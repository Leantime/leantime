##
# File access restrictions (from serversideup's default security.conf).
# Security headers are left to Leantime's InitialHeaders middleware so they are
# sent once and plugins can still change them through the `headers` filter.
##

# Block hidden files and directories, except /.well-known/ (RFC 8615)
location ~ /\.(?!well-known) {
    deny all;
}

# Block files that may expose sensitive information
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}

# The installer is never used on the cloud: tenants are provisioned by the Accounts plugin.
# /install/update stays reachable, it runs a tenant's database update after a deploy.
location ~* ^/install(?!/update)(?:/|$) {
    return 404;
}
