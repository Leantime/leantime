text.mattermost_instructions=" Þessi samþætting sendir tilkynningar um uppfærslur á rásina sem þú velur.<br/>Fylgdu leiðbeiningunum <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>hér til að fá slóð fyrir Incoming Webhook</a> frá Mattermost. Límdu síðan tengilinn í reitinn hægra megin og smelltu á Vista."
text.slack_instructions="Þessi samþætting sendir tilkynningar um uppfærslur á rásina sem þú velur.<br/>Fylgdu leiðbeiningunum <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>hér til að fá slóð fyrir Incoming Webhook</a> frá Slack. Límdu síðan tengilinn í reitinn hægra megin og smelltu á Vista."
text.choose_access_for_users="Hakaðu við eða taktu hakið af þeim notendum sem þú vilt bæta við eða fjarlægja. Þú getur lesið meira um hlutverkin á <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
