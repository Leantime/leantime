text.who_can_access="Veldu hverjir mega skoða þetta verkefni. Sjálfgefið erfa notendur hlutverkin sem þeim hafa verið gefin. Þú getur breytt þessum hlutverkum undir flipanum „Teymi“"
text.ical_export_description="Hér geturðu búið til einstaka dagatalsslóð sem gerir þér kleift að samþætta Leantime-dagatalið þitt við hvaða forrit sem er sem styður iCal-sniðið. "
text.you_ical_url="Dagatalsslóðin þín er hér að neðan. <br /> Athugaðu að hver sem er með þessa slóð getur opnað dagatalið. Haltu henni leyndri eins og lykilorði."
