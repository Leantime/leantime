text.full_lean_canvas_helper_content="Heildstæða rannsóknartaflan leiðir þig í gegnum allt ferlið við að sannreyna hugmynd.<br/>Á þessari síðu fjallarðu aftur um viðskiptavinahópinn, vandamálið og lausnina (en engar áhyggjur, ef þú hefur þegar fyllt það út á einföldu töflunni sérðu það aftur hér!).<br/>Þaðan ferðu yfir í skýrt virðistilboð (Hvað gerir hugmyndina þína betri en aðra valkosti?),<br/>söluleiðir (Hvernig fá viðskiptavinir lausnina þína?)<br/>tekjustrauma (Hvernig aflar lausnin þín tekna?)<br/>kostnaðarskipan (Hversu mikils virði er lausnin þín?), lykilmælikvarða (Hvernig mælirðu árangur?)<br/>og ósanngjarnt forskot (Hvað hjálpar þér að skera þig úr í samkeppninni?)<br/>Þessum spurningum er ætlað að stuðla að árangri, draga úr mistökum og gera þér kleift að fylgjast með forsendum þínum og sannreyna þær.<br/>Lean snýst um að útrýma sóun og vinna að því að byggja vörur, verslanir og lausnir sem viðskiptavinir þínir þurfa."
