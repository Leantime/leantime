support.marcel_name="👋 Ég heiti Marcel"
support.marcel_tagline="Þýskur innflytjandi, faðir einhverfrar dóttur og sjálfur með ADHD."
support.marcel_bio_1="Hefðbundin verkefnastjórnunartól gengu aldrei upp fyrir mig. Mér fannst þau byggð af taugdæmigerðum hugum fyrir taugdæmigerða hugi. Þegar ég starfaði sjálfstætt og átti erfitt með að halda verkefnum viðskiptavina skipulögðum fór ég að byggja eitthvað sem vann með heilanum mínum í stað þess að vinna gegn honum."
support.marcel_bio_2="Það sem byrjaði sem persónuleg lausn varð að Leantime þegar ég áttaði mig á því að milljónir annarra þurftu það sama."
support.gloria_name="👋 Og ég heiti Gloria"
support.gloria_tagline="Fyrrverandi hjúkrunarfræðingur á bráðamóttöku sem gerðist vörustjóri, frumkvöðull af rómönskum uppruna í fyrstu kynslóð."
support.gloria_bio_1="Ég starfaði árum saman í krefjandi heilbrigðisumhverfi þar sem skipulag bjargar bókstaflega mannslífum. En þegar ég stofnaði mitt eigið fyrirtæki fannst mér hefðbundin verkefnatól yfirþyrmandi og úr tengslum við það hvernig ég hugsa og vinn í raun."
support.gloria_bio_2="Bakgrunnur minn í atferlisvísindum og rannsóknum á hvatningu mótar hvernig við smíðum eiginleika sem skipuleggja ekki bara verk — þeir hjálpa þér að langa í raun til að klára þau."
support.closing_text="Við getum skapað heim þar sem enginn þarf að berjast við tólin sín til að vinna frábært starf. Styrkurinn þinn fjármagnar framtíð þar sem hugbúnaður lagar sig að fjölbreytileika fólks, ekki öfugt."
