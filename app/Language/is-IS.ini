headline.sm.board="Stefnuskilaboðatafla"

box.sm.qa="Hverjir eru <em>markhópar viðskiptavina</em> og hverjir falla <em>sérstaklega utan umfangs</em>?"
box.sm.qb="Hvaða <em>virðistilboð</em> ætlarðu að bjóða markhópnum þínum?"
box.sm.qc="Af hverju ættu viðskiptavinir að velja að eiga viðskipti við þig frekar en samkeppnisaðilana? Hver eru <em>sérkenni</em> þín sem erfitt er að herma eftir?"
box.sm.qd="Af hverju muntu geta staðið við loforðin sem þú gefur viðskiptavinum þínum? Hvaða <em>einstöku hæfni</em> býrðu yfir og nýtir?"
box.sm.qe="Hvað mun <em>breytast</em> með nýju eða endurskoðuðu stefnunni og hvað <em>helst óbreytt</em> til lengri tíma? Hvernig tryggirðu að núverandi viðskiptavinir, sem eru áfram innan umfangs, tapist ekki?"
