text.insights.helper_content="Taflan <em>Athuga / Læra - Innsýn</em> hjálpar þér að safna og skipuleggja innsýn úr fjórum ólíkum áttum (vettvangsathugunum, viðtölum, rýnihópum og fyrirliggjandi rannsóknum) og breyta henni í þekkingu.<br/>Hún styður athugunar- og lærdómsstigin, stundum kölluð samkennd og skilgreining, í hönnunarhugsunarferlinu.<br/>Við mælum með að þú notir töfluna <em>Athuga / Læra - Innsýn</em> í hvert sinn sem þú safnar og greinir nýja innsýn, hvort sem það er fyrir áhættugreiningu, umhverfisgreiningu, til að greina strauma í atvinnugreininni eða til að hanna nýjar vörur og þjónustu, svo eitthvað sé nefnt."
