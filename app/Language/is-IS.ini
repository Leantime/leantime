text.onboarding_task_community_chat="Samfélagsspjallið okkar er frábær vettvangur til að spyrja spurninga og fá endurgjöf á uppsetningu verkefna. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Samfélagsspjall</a>"
label.onboarding_task_invite_team="Bjóddu samstarfsfólkinu þínu"
text.onboarding_task_invite_team="Hvort sem þú vinnur með öðrum eða vantar bara einhvern til að halda þér við efnið. Þegar Leantime er notað í hóp er auðveldara að halda sig á réttri braut og viðhalda áhuganum <a href='%s'>Notendastjórnun</a>"
label.onboarding_task_project_structure="Kynntu þér betur verkefnauppbyggingu Leantime"
text.onboarding_task_project_structure="Við eigum mikið af viðbótarefni í hjálpargögnunum okkar. Til að kynna þér betur verkefnauppbyggingu í Leantime og bestu starfsvenjur skaltu fara á: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Búðu til markmið"
text.onboarding_task_create_goal="Markmið eru notuð til að fylgjast með og mæla takmörk til lengri tíma. Þau ættu að vera mælanleg með mælikvörðum sem þú getur uppfært reglulega. Hægt er að tengja markmið og áfanga til að sjá framvindu framkvæmdarinnar samhliða framvindu mælikvarðanna <a href='%s'>Markmið verkefnisins</a>"
label.onboarding_task_create_milestone="Búðu til áfanga"
text.onboarding_task_create_milestone="Með áföngum geturðu skipt verkefnunum þínum niður í tímabil með afmarkaðri útkomu. Hver áfangi hefur upphafs- og lokadag og ætti að skila einhverri afurð <a href='%s'>Áfangar verkefnisins</a>"
label.onboarding_task_personal_project="Kynntu þér persónulega verkefnið þitt"
text.onboarding_task_personal_project="Persónulega verkefnið þitt er svæði þar sem þú getur skipulagt verkin þín, markmið og vinnu. Þú kemst í það með verkefnavalinu efst eða með því að smella á þennan tengil: <a href='%s'>Verkefnið mitt</a>"
label.onboarding_task_complete_profile="Ljúka við Leantime-prófílinn minn"
text.onboarding_task_complete_profile="Uppfæra prófílmynd og ljúka við vinnustillingar til að sérsníða upplifun mína. <a href='%s'>Prófíllinn minn</a>"
label.onboarding_goalboard_title="Markmiðin mín"
label.onboarding_goal_metric="Verk kláruð á réttum tíma"
label.onboarding_goal_objective="Byggja upp afkastakerfið mitt"
label.onboarding_step_name_first_task="Gefðu fyrsta verkinu þínu nafn"
label.onboarding_step_invite_team="Bjóddu teyminu þínu"
label.onboarding_step_name_project="Gefðu verkefninu þínu nafn"

