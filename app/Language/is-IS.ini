text.zulip_instructions="Þessi samþætting sendir tilkynningar um uppfærslur á strauminn og efnið sem þú velur.<br/>Fylgdu leiðbeiningunum <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>hér til að búa til nýtt vélmenni</a>. Límdu síðan upplýsingarnar í reitina hægra megin og smelltu á Vista."
