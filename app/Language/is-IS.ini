text.these_are_system_wide_settings="Þetta eru kerfisstillingar sem hafa áhrif á útlit og viðmót Leantime."
text.company_name_helper="Birtist í titli síðunnar og í tölvupóstum"
text.advanced_boards_helper_content="Hugmyndir þróast, vaxa og þroskast. Hér geturðu haldið utan um þær.<br/>Færðu hugmyndaspjöld á milli dálka til að sýna núverandi stöðu þeirra.<br/>Þetta er góður staður til að hefja rannsóknir, þróa frumgerðir og sannreyna þær með nokkrum viðskiptavinum áður en þú hefst handa við útfærsluna."
text.backlog_helper_content="Backlog er heimili allra verkanna þinna; þeirra sem þú vinnur að núna og þeirra sem þú ætlar að vinna að.<br/><br/>Til að vinna á Backlog mælum við með því að vinna í stuttum lotum – sprettum.<br/>Sprettir eru tveggja vikna tímabil sem gera þér kleift að einbeita þér að smærri, afhendanlegum vinnueiningum.<br/>Í lok tveggja vikna ættirðu að hafa eitthvað til að sýna. Eitthvað sem skapar virði fyrir notendur þína eða viðskiptavini.<br/><br/>Á þessum skjá geturðu skipulagt og haldið utan um verkalistann þinn, forgangsraðað Backlog með því að draga og sleppa og fært atriði úr Backlog yfir í núverandi sprett.<br/>Viltu vita meira? Byrjaðu kynnisferðina eða lokaðu til að hefjast handa!"
text.glad_youre_here="Gaman að hafa þig hér. Gefum okkur smá stund til að kynnast."
text.business_research_section="Viðskiptarannsóknahlutinn er nýja heimilið fyrir hugmyndirnar þínar. Hann leiðir þig í gegnum skrefin í viðskiptavinaþróun, greiningu vandamála og mótun lausna."
text.our_roadmap_design="Vegvísirinn okkar er hannaður til að leiða þig frá smærri, viðráðanlegum áföngum að heildarmyndinni. Gerðu ráð fyrir um þriggja mánaða löngum áföngum og notaðu þessar vörður til að halda stefnunni."
text.this_is_where_you_spend_most_time="Hér muntu verja mestum tíma þínum – við framkvæmdina. Skipuleggðu tveggja vikna sprettina þína og ljúktu þeim með Kanban-töflunni og Backlog-verkfærunum okkar. Notaðu endurlit til að gera betur í næsta spretti."
text.idea_board_helper_content="Hér safnarðu öllum hugmyndunum þínum. Ræddu nýjar hugmyndir við teymið þitt og tengdu áfanga til að sjá framvindu hugmyndanna."
text.kanban_helper_content="Kanban er japanska orðið yfir „spjald“. Verkfræðingar hjá Toyota tóku Kanban-töflur í notkun á fimmta áratugnum samhliða Lean-framleiðslu.<br/>Þær eru notaðar til að deila upplýsingum og framvindu vinnu á sjónrænan og fljótlegan hátt.<br/>Kanban-töflur nýtast vel til að gera vinnu og stöðu sýnilega, halda utan um virka vinnu eða vinnu í gangi, stýra vinnuflæði og bregðast hratt við með Lean-umbótum."
text.my_timesheets_helper_content="Í tímaskráningum skráirðu raunverulegar vinnustundir á verk.<br/>Þetta nýtist við reikningagerð en einnig til að meta hversu vel þú skipuleggur verkin þín fyrir fram.<br/>Með tímanum getur Leantime aðlagað skiladaga til að taka tillit til frávika í áætlunum."
text.new_project_helper_content="<p>Hér lýsirðu verkefninu, skilgreinir það og setur því ramma. Þetta skiptir máli því þetta er það sem miðlar til<br/>alls teymisins hver forgangsröðun, væntingar og viðmið verkefnisins eru.</p><p><br/><em>Hafðu 4C-in í huga.<br/>Lýsingin á að vera skýr (Clear), hnitmiðuð (Concise), tæmandi (Complete) og trúverðug (Credible).<br/><br/></em></p><p>Þegar verkefnalýsingarnar þínar uppfylla þetta eru allir samstíga og það dregur úr hættu á villum og mistökum.</p><br/>Nú er kominn tími til að byrja!<br/><br/>"
text.not_found_helper_content="<p>Við erum ekki enn með efni fyrir þessa síðu.<br/>Notaðu hjálpartengilinn neðst á síðunni til að fræðast meira um það sem þú getur gert hér.</p>"
text.retros_helper_content="<p>Endurlit eru stuttar ígrundanir um vinnuna, samstarf teymisins og að sjálfsögðu framvinduna.<br/>Hér getur teymið gefið sér stund til að einbeita sér að því sem gekk vel, því sem gekk ekki vel og því sem mætti gera öðruvísi næst.<br/>Við mælum með því að halda yfirferðarfund með reglulegu millibili, eða að minnsta kosti í lok hvers áfanga.<br/></p>"
text.roadmap_helper_content="<p>Vegvísar hjálpa til við að brjóta stór verkefni niður í smærri og viðráðanlegri einingar.<br/><br/></p><p>Til að búa til vegvísinn þinn mælum við með því að setja áfanga sem hægt er að ná innan þriggja mánaða.</p><p>Áfangar eru vörður á leiðinni að verklokum.<br/>Einfaldlega sagt: Ef þú ferð hringinn í kringum landið gæti hver landshluti sem þú ferð um verið áfangi.<br/><br/>Smelltu á „Bæta við áfanga“ efst til vinstri til að byrja. Stilltu dagsetninguna á þessum flipa eða beint í vegvísinum með því að smella á áfangann og draga hann til í dagatalinu.</p>"
text.show_clients_helper_content="<p>Viðskiptavinir/vörur flokka verkefnin þín og gera þér kleift að aðgreina ólíka hópa.<br/><br/></p><p>Sem ráðgjafi vinnur þú nú þegar með viðskiptavinum og hér er staðurinn til að skipuleggja þá.</p><p>Ef þú ert í vöruteymi geturðu notað þennan hluta til að skipuleggja og aðgreina deildirnar þínar (markaðsmál, sölu, rekstur o.s.frv.).</p>"
text.show_projects_helper_content="<p>Verkefni eru hjarta fyrirtækisins þíns og Leantime! Breytingar, þróun, markmið og allt sem þig dreymir um eða getur byggt felur í sér verkefni.<br/>Verkefnastjórnun er einfaldlega ferlið við að tryggja að verkefnin þín skili sér á réttum tíma, rétt unnin og með raunverulegu viðskiptavirði.<br/><br/>Hér búa verkefnin þín. Á verkefnasíðunni geturðu stofnað verkefni og séð í fljótu bragði fjölda verka, tíma, fjárhagsáætlun og viðskiptavininn sem tengist verkefninu.<br/><br/>Notaðu þessa síðu til að fá skjótt yfirlit yfir öll verkefnin þín.<br/><br/></p>"
text.new_db_version="Ný útgáfa hefur verið sett upp. Til að nota Leantime þarftu að uppfæra gagnagrunninn.<br/><br/><strong>Gættu þess að taka afrit af gagnagrunninum áður en þú framkvæmir uppfærsluna!</strong><br/>Þetta getur tekið nokkrar mínútur."
text.update_was_successful="Uppfærslan tókst og þú getur nú skráð þig inn. <a href='%1$s'>Fara í innskráningu</a>"
text.this_script_will_set_up_leantime="Þessi skrifta setur upp gagnagrunninn og stofnar stjórnandaaðgang"
text.enter_new_password="Sláðu inn nýja lykilorðið til að endurstilla það."
text.enter_email_address_to_reset="Sláðu inn netfangið þitt til að endurstilla lykilorðið."
