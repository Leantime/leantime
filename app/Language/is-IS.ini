text.twoFA_verify_code="Sláðu inn kóðann sem OTP-forritið/Google Authenticator gefur þér"
text.twoFA_already_enabled="Tveggja þátta auðkenning er þegar virk fyrir aðganginn þinn og er krafist við innskráningu.<br/><br/>Til að fjarlægja tveggja þátta auðkenningu skaltu smella á Fjarlægja hér að neðan"
