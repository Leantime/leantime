text.my_work_dashboard_intro="Yfirlitið Mín verk dregur fram allt sem skiptir máli.<br/>Mikilvægasta vinnan þín er nú í forgrunni, skipulögð sérstaklega fyrir þig og eftir því hvernig heilinn þinn vinnur best.<br/><br/>Frá smáverkum til metnaðarfullra markmiða — allt sem þú þarft er hér. Þetta er þitt rými til að fanga hugmyndir, fylgjast með framvindu og fagna sigrum á leiðinni."
text.blueprints_intro="Teikningar eru tækifærið þitt til að átta þig á öllum gögnunum. Leantime býður upp á ýmis verkfæri og striga til að skilgreina bakgrunn verkefnisins, t.d. viðskiptalíkansstriga, SVÓT-greiningu eða samkenndarkort.<br/><br/>Ef þú veist ekki hvar þú átt að byrja mælum við með að þú búir til „virðistöflu verkefnis“. Hún svarar mikilvægustu spurningunum um verkefnið: Hver er viðskiptavinurinn þinn?<br/>Hvaða vandamál ertu að leysa?<br/>Hver er lausnin þín?<br/>Hvaða ávinning býður lausnin þín umfram samkeppnisaðilana<br/>"
text.goals_tour_intro="Markmið gera þér kleift að skipta verkefninu niður í raunhæfa, mælanlega og framkvæmanlega hluta.<br/>Á meðan áfangar snúast um framkvæmd snúast markmið um mælikvarðana sem þú vilt ná.<br/>Hvert markmið ætti að hafa skýran tilgang (það sem þú vilt ná) og vera auðmælanlegt með einum mælikvarða.<br/><br/>Þegar markmið er komið geturðu tengt áfanga við það til að skipta því niður í framkvæmanleg verk.<br/>"
text.project_dashboard_tour_intro="Verkefni í Leantime eru sameiginleg vinnusvæði þar sem þú og teymið þitt skipuleggið, fylgist með og skilið vinnu á skilvirkan hátt. Hvert verkefni heldur utan um tengd markmið, verk og áfanga og gerir þér kleift að fylgjast með framvindu á einum stað.<br/><br/>Hvort sem þú heldur utan um vinnu, nám eða persónuleg verkefni veita verkefni í Leantime þá umgjörð og þau verkfæri sem þarf til að breyta hugmyndum í árangur."
text.wiki_tour_intro="Skjölin gera þér kleift að skrifa og deila skjölun með teyminu þínu. Þú getur búið til mörg svæði til að skipuleggja skjölunina eftir teymum, sviðum eða flokkum skjala.<br/>Búðu til skjöl til að deila þekkingu, ferlum og verklagi. Þú getur líka búið til skjal til að deila tengli á skrá eða möppu í skýjageymslunni þinni.<br/>"
text.extend_leantime_latest_plugins="Auktu möguleika Leantime með nýjustu viðbótunum okkar."
support.headline_help_us_build="Hjálpaðu okkur að byggja framtíð þar sem allir hugir blómstra!"
support.intro_text_1="Flest framleiðnitól gera ráð fyrir að allir hugsi eins: línulega, með fullkomna einbeitingu og drifin áfram af handahófskenndum skilafrestum. Hvort sem þú ert með ADHD og þarft dópamínskot frá kláruðum verkum, ert á einhverfurófi og þráir stöðuga umgjörð, glímir við lesblindu og hugsar í rýmum, eða hefur einfaldlega fengið nóg af tólum sem passa ekki við það hvernig heilinn þinn vinnur í raun — þá hefurðu líklega gefist alveg upp á verkefnastjórnun."
support.intro_text_2="Við byggjum Leantime fyrir hugi sem virka öðruvísi. Það á við um taugsegin heila, en líka alla sem hafa einhvern tíma fundið að núverandi tól vinni gegn náttúrulegu hugsanamynstri þeirra."
