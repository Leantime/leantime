tour.my_work.work_modes_title="Vinnuhamir"
tour.my_work.work_modes_text="Efri valmyndin sýnir í hvaða „vinnuham“ þú ert. Þú getur verið inni í verkefni, á þínu persónulega vinnusvæði eða í fyrirtækjaham."
tour.my_work.left_nav_text="Vinstri valmyndin sundurliðar núverandi vinnuham og veitir þér aðgang að ólíkum svæðum. Allt sem birtist hér tilheyrir vinnuhamnum sem er valinn hér að ofan."
tour.my_work.profile_bar_title="Prófílstikan mín"
tour.my_work.profile_bar_text="Hér finnurðu tengla á aðganginn þinn ásamt tilkynningum og nýjustu fréttum af Leantime."
tour.my_work.widgets_title="Græjurnar á yfirlitinu þínu"
tour.my_work.widgets_text="Yfirlitinu þínu er skipt upp í ýmsar græjur sem sýna þér markvissar upplýsingar um vinnuna þína."
tour.my_work.customize_title="Sérsníddu yfirlitið þitt"
tour.my_work.customize_text="Þú getur breytt stærð græjanna og fært þær til með því að draga og sleppa."
tour.my_work.todos_title="Verkin mín"
tour.my_work.todos_text="Græjan „Verkin mín“ sýnir þér öll verk sem eru núna úthlutuð þér."
tour.my_work.group_todos_title="Flokka verk"
tour.my_work.group_todos_text="Með fellilistunum hér geturðu síað verkin þín eftir verkefni eða flokkað þau eftir forgangi, stöðu, verkefni eða dagsetningum."
tour.my_work.sort_todos_title="Raða verkum"
tour.my_work.sort_todos_text="Þú getur dregið og sleppt hverju verki til að breyta röð þess. Þú getur líka dregið verk yfir á dagatalið til að tímasetja það."
tour.my_work.timer_title="Ræstu tímamælinn"
tour.my_work.timer_text="Þegar þú vilt byrja að vinna að verki smellirðu bara á hnappinn til að ræsa tímamælinn."
tour.my_work.complete_task_title="Ljúktu verki"
tour.my_work.complete_task_text="Þegar verki er lokið geturðu merkt það sem lokið með því að smella á stöðufellilistann."
tour.my_work.add_tasks_title="Bættu við fleiri verkum"
tour.my_work.add_tasks_text="Þú getur bætt við fleiri verkum með því að smella á plúshnappinn í hverjum hluta eða með þriggja punkta valmyndinni við hvert verk."
tour.my_work.finish_text="Þú hefur lokið kynnisferðinni um yfirlitið Mín verk. Farðu í <a href='%s/dashboard/show'>verkefnið þitt</a> til að læra meira um verkefnastjórnun í Leantime."
tour.project_dashboard.menu_title="Verkefnavalmynd"
tour.project_dashboard.menu_text="Verkefnavalmyndin skiptir verkefninu þínu í ólíka hluta: <strong>Gagnaherbergi</strong> - til að geyma allar skrár og upplýsingar, <strong>Hugsa</strong> - til að móta stefnu, fá hugmyndir og skilgreina, <strong>Framkvæma</strong> - til að stýra markmiðum, áföngum og verkum."
tour.project_dashboard.selector_title="Verkefnaval"
tour.project_dashboard.selector_text="Notaðu verkefnavalið til að fara á milli verkefna. Vinstri valmyndin sýnir allt sem tengist núverandi verkefni."
tour.project_dashboard.checklist_title="Gátlisti"
tour.project_dashboard.checklist_text="Gátlisti verkefnisins er fljótleg leið til að sjá hvort verkefnið þitt hafi allar þær upplýsingar sem þarf til að framkvæmdin heppnist."
tour.project_dashboard.status_title="Skjótar stöðuuppfærslur"
tour.project_dashboard.status_text="Með stöðuuppfærslum geturðu á fljótlegan hátt deilt framvindu verkefnisins með teyminu þínu með rauðum, gulum og grænum lit. Staðan birtist alls staðar í kerfinu."
tour.project_dashboard.progress_title="Framvinda"
tour.project_dashboard.progress_text="Framvinduvísir verkefnisins sýnir hversu mikilli vinnu þú hefur lokið. Hann tekur mið af ólíkum stærðum verka, afköstum teymisins og áföngum verkefnisins."
tour.project_dashboard.latest_tasks_title="Nýjustu verk"
tour.project_dashboard.latest_tasks_text="Listinn yfir nýjustu verk sýnir þau verk sem síðast var bætt við verkefnið og hann má nota sem innhólf verkefnisins."
tour.project_dashboard.team_title="Teymi"
tour.project_dashboard.team_text="Teymisreiturinn sýnir þér meðlimi þessa verkefnis."
tour.project_dashboard.finish_text="Þú hefur lokið kynnisferðinni um verkefnayfirlitið. Farðu í <a href='%s/tickets/showKanban'>Verk</a> til að kynnast ólíkum leiðum til að halda utan um verkin þín í Leantime."
tour.kanban_board.overview_title="Kanban-taflan þín"
tour.kanban_board.overview_text="Þetta er Kanban-taflan þín. Hún hjálpar þér að gera vinnuna sýnilega og takmarka vinnu í gangi."
tour.kanban_board.workflow_title="Vinnuflæði"
tour.kanban_board.workflow_text="Verk færast frá vinstri til hægri eftir því sem þeim miðar áfram. Dragðu og slepptu spjöldum til að uppfæra stöðu þeirra."
tour.kanban_board.columns_title="Sveigjanlegir dálkar"
tour.kanban_board.columns_text="Með þriggja punkta valmyndinni geturðu bætt við dálkum, fjarlægt þá og endurnefnt."
tour.kanban_board.filter_title="Sía verk"
tour.kanban_board.filter_text="Þú getur síað verkin þín eftir ýmsum reitum, t.d. forgangi, stöðu, verkefni eða dagsetningum."
tour.kanban_board.swimlanes_title="Sundbrautir"
tour.kanban_board.swimlanes_text="Auk þess geturðu flokkað verkin þín til að búa til sundbrautir á Kanban-töflunni. Þannig sérðu vinnuna eftir teymismeðlimum, forgangi eða áföngum."
tour.kanban_board.sprints_title="Sprettir"
tour.kanban_board.sprints_text="Ef þú skipuleggur vinnuna í sprettum geturðu notað fellilistann hér til að velja, búa til og uppfæra spretti."
tour.kanban_board.finish_text="Þar með er kynnisferðinni um Kanban lokið. Farðu í <a href='%s/tickets/roadmap'>Áfanga</a> til að læra hvernig þú býrð til áfanga og heldur utan um þá í Leantime."
tour.milestones.overview_title="Áfangar"
tour.milestones.overview_text="Áfangar hjálpa þér að fylgjast með helstu útkomum og tímabilum verkefnisins."
tour.milestones.drag_title="Draga og raða"
tour.milestones.drag_text="Hver súla táknar einn áfanga. Þú getur dregið þá eftir tímalínunni, endurraðað þeim og breytt stærð þeirra. Allt sem þú gerir á þessum skjá uppfærir tímasetningu áfanganna þinna."
tour.milestones.filter_title="Sía"
tour.milestones.filter_text="Þú getur síað áfangana þína og einnig skoðað verkin sem tilheyra þeim."
tour.milestones.timeframes_title="Tímabil"
tour.milestones.timeframes_text="Þú getur breytt tímabili tímalínunnar til að sjá stærri hluta ársins eða kafað ofan í sundurliðun eftir dögum."
tour.milestones.finish_text="Þar með er kynnisferðinni um áfanga lokið. Farðu í <a href='%s/goalcanvas/dashboard'>Markmið</a> til að læra hvernig þú býrð til markmið og heldur utan um þau í Leantime."
tour.goals.overview_title="Markmið"
tour.goals.overview_text="Markmið hjálpa þér að fylgjast með mælanlegum áhrifum á verkefnin þín."
tour.goals.parts_title="Takmörk og mælikvarðar"
tour.goals.parts_text="Hvert markmið samanstendur af takmarki (því sem þú vilt ná fram) og mælikvarða (hvernig þú ætlar að mæla það)."
tour.goals.progress_title="Framvinda markmiðs"
tour.goals.progress_text="Þegar þú uppfærir mælikvarða markmiðanna sýnir framvindustikan hversu vel þér miðar áfram."
tour.goals.milestones_title="Áfangar og markmið"
tour.goals.milestones_text="Þú getur tengt markmið við áfanga til að fylgjast með framvindu markmiðanna á verkstigi. Þannig er auðveldara að koma auga á eyður í verkefnisáætluninni."
tour.goals.finish_text="Þar með er kynnisferðinni um markmið lokið. Áfangar, markmið og verk eru grunnstoðirnar í Leantime. Notaðu þær til að brjóta vinnuna niður í viðráðanlega hluta. Farðu á <a href='%s/tickets/showKanban'>Kanban-töfluna</a> til að fara yfir verkin þín."
