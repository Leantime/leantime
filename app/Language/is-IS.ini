text.lean.helper_content="Lean Canvas leiðir þig í gegnum allt ferlið við að staðfesta nýja viðskipta- og/eða vöruhugmynd.<br/>Þú fjallar um <em>viðskiptavinahóp</em>, <em>vandamál og lausn</em>.<br/>Þaðan ferðu yfir í <em>einstakt virðistilboð</em> (hvað gerir hugmyndina þína betri en aðra valkosti?), <em>dreifileiðir</em> (hvernig kemurðu lausninni til viðskiptavina?), <em>tekjustrauma</em> (hvernig aflar lausnin tekna?), <em>kostnaðaruppbyggingu</em> (hvað kostar lausnin?), <em>lykilmælikvarða</em> (hvernig mælirðu árangur?) og <em>óviðjafnanlegt forskot</em> (hvað hefurðu sem hjálpar þér að ná árangri í samkeppninni?)<br/>Svörunum við þessum spurningum er ætlað að stuðla að árangri, draga úr líkum á mistökum og gera þér kleift að fylgjast með forsendum þínum og staðfesta þær. Að vera „lean“ snýst um að útrýma sóun og vinna að því að byggja vörur, rekstur og lausnir sem viðskiptavinir þínir þurfa á að halda."
text.lean.disclaimer="Lean Canvas er aðlagaður úr <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> og er gefinn út með <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> leyfinu"
tour.lean.once_your_done="<em>Þegar Lean Canvas-striginn þinn er tilbúinn skaltu fara í</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Vegvísinn</a>"


