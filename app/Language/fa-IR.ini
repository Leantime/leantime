text.onboarding_default_project_details="به نخستین پروژه خود در Leantime خوش آمدید!<br />اینجا فضای شماست برای سازمان‌دهی کارها، پیگیری اهداف و برنامه‌ریزی کارتان. هر چیزی را در اینجا آزادانه تغییر دهید یا هم‌زمان با رشد خود پروژه‌های بیشتری بسازید. این پروژه فقط برای شروع کار شماست"
label.onboarding_milestone_getting_started="شروع کار"
label.onboarding_task_community_chat="به گفت‌وگوی انجمن ما بپیوندید"
text.onboarding_task_community_chat="گفت‌وگوی انجمن ما منبعی عالی برای پرسیدن سؤال و دریافت بازخورد درباره راه‌اندازی پروژه است. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>گفت‌وگوی انجمن</a>"
label.onboarding_task_invite_team="هم‌تیمی‌های خود را دعوت کنید"
text.onboarding_task_invite_team="چه با کسی همکاری می‌کنید و چه فقط به همراهی برای پاسخ‌گو ماندن نیاز دارید، استفاده گروهی از Leantime به شما کمک می‌کند در مسیر بمانید و انگیزه‌تان را حفظ کنید <a href='%s'>مدیریت کاربران</a>"
label.onboarding_task_project_structure="درباره ساختار پروژه در Leantime بیشتر بدانید"
text.onboarding_task_project_structure="منابع بیشتری در مستندات راهنمای ما در دسترس است. برای آشنایی بیشتر با ساختار پروژه در Leantime و بهترین روش‌ها به این نشانی بروید: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="یک هدف ایجاد کنید"
text.onboarding_task_create_goal="اهداف برای پیگیری و سنجش مقصودهای بلندمدت به کار می‌روند. باید بتوان آن‌ها را با معیارهایی سنجید که به‌طور منظم به‌روزرسانی می‌کنید. می‌توانید اهداف و نقاط عطف را به هم متصل کنید تا هم‌زمان با پیشرفت معیار، پیشرفت اجرا را هم ببینید <a href='%s'>اهداف پروژه</a>"
label.onboarding_task_create_milestone="یک نقطه عطف ایجاد کنید"
text.onboarding_task_create_milestone="نقاط عطف به شما امکان می‌دهند مراحل پروژه‌هایتان را در قالب نتایج مجزا دسته‌بندی کنید. هر نقطه عطف تاریخ شروع و پایان دارد و باید خروجی مشخصی داشته باشد <a href='%s'>نقطه عطف پروژه</a>"
label.onboarding_task_personal_project="پروژه شخصی خود را کاوش کنید"
text.onboarding_task_personal_project="پروژه شخصی شما فضایی است که می‌توانید کارها، اهداف و فعالیت‌هایتان را در آن سازمان‌دهی کنید. از طریق انتخابگر پروژه در بالا یا با کلیک روی این پیوند به آن دسترسی دارید: <a href='%s'>پروژه من</a>"
label.onboarding_task_complete_profile="تکمیل پروفایل Leantime من"
text.onboarding_task_complete_profile="به‌روزرسانی تصویر پروفایل و تکمیل ترجیحات کاری برای شخصی‌سازی تجربه من. <a href='%s'>پروفایل من</a>"
