text.these_are_system_wide_settings="این‌ها تنظیمات سراسری سیستم هستند که بر ظاهر و نمایش Leantime شما تأثیر می‌گذارند."
text.company_name_helper="در عنوان صفحه و در ایمیل‌ها نمایش داده می‌شود"
text.advanced_boards_helper_content="ایده‌ها تکامل می‌یابند، رشد می‌کنند و پخته می‌شوند. اینجا جای پیگیری آن‌هاست.<br/>کارت‌های ایده را از یک ستون به ستون بعدی ببرید تا وضعیت فعلی‌شان را نشان دهند.<br/>اینجا جای خوبی برای شروع تحقیق، ساخت نمونه‌های اولیه و اعتبارسنجی آن‌ها با چند مشتری پیش از شروع پیاده‌سازی است."
text.backlog_helper_content="بک‌لاگ خانه همه کارهای شماست؛ کارهایی که هم‌اکنون روی آن‌ها کار می‌کنید و کارهایی که قصد دارید انجام دهید.<br/><br/>برای پیشرفت در تکمیل بک‌لاگ، توصیه می‌کنیم در دوره‌های کوتاه کار کنید: اسپرینت‌ها.<br/>اسپرینت‌ها بازه‌های زمانی دوهفته‌ای هستند که به شما امکان می‌دهند روی بخش‌های کوچک‌تر و قابل تحویل کار تمرکز کنید.<br/>در پایان دو هفته باید چیزی برای «نمایش» داشته باشید؛ چیزی که برای کاربران یا مشتریان شما ارزش ایجاد کند.<br/><br/>در این صفحه می‌توانید فهرست کارهای خود را سازمان‌دهی و مدیریت کنید، بک‌لاگ را با کشیدن و رها کردن اولویت‌بندی کنید و موارد بک‌لاگ را به اسپرینت جاری منتقل کنید.<br/>اطلاعات بیشتری می‌خواهید؟ تور را شروع کنید یا برای شروع کار، این پنجره را ببندید!"
text.glad_youre_here="خوشحالیم که اینجا هستید. بیایید چند لحظه با هم آشنا شویم."
text.business_research_section="بخش تحقیقات کسب‌وکار، خانه جدید ایده‌های شماست. این بخش طوری طراحی شده که شما را گام‌به‌گام در مراحل توسعه مشتری، تحقیق درباره مسئله و ایده‌پردازی راه‌حل همراهی کند."
text.our_roadmap_design="نقشه راه ما طوری طراحی شده که شما را از نقاط عطف کوچک و قابل مدیریت به تکمیل تصویر کلی برساند. نقاط عطف را حدوداً 3 ماهه برنامه‌ریزی کنید و از این نشانگرهای پروژه برای ماندن در مسیر استفاده کنید."
text.this_is_where_you_spend_most_time="اینجا جایی است که بیشتر وقت خود را صرف انجام کارها می‌کنید. اسپرینت‌های دوهفته‌ای خود را برنامه‌ریزی کنید و با تابلوی کانبان و ابزارهای بک‌لاگ با موفقیت اجرا کنید. از بازنگری‌ها برای پیشرفت در اسپرینت بعدی استفاده کنید."
text.idea_board_helper_content="اینجا جای گردآوری همه ایده‌های شماست. ایده‌های جدید را با تیم خود به بحث بگذارید و نقاط عطف را پیوست کنید تا پیشرفت ایده‌هایتان را ببینید."
text.kanban_helper_content="کانبان واژه‌ای ژاپنی به معنای «کارت» است. تابلوهای کانبان را مهندسان تویوتا در دهه 40 میلادی همراه با تولید ناب به کار گرفتند.<br/>از آن برای اشتراک‌گذاری سریع و بصری اطلاعات و پیشرفت کار استفاده می‌شود.<br/>تابلوهای کانبان برای نمایش بصری کار و وضعیت، کمک به مدیریت کارهای فعال یا در حال انجام، مدیریت جریان کار و اقدام سریع برای بهبودهای ناب مفیدند."
text.my_timesheets_helper_content="برگه‌های زمان جایی برای ثبت ساعات واقعی صرف‌شده برای یک کار هستند.<br/>این کار برای صدور صورت‌حساب مفید است، اما همچنین نشان می‌دهد کارهایتان را از پیش چقدر خوب برنامه‌ریزی می‌کنید.<br/>با گذشت زمان، Leantime می‌تواند تاریخ‌های سررسید را برای جبران اختلاف‌های برنامه‌ریزی تنظیم کند."
text.new_project_helper_content="<p>اینجا جایی است که پروژه خود را توصیف و تعریف می‌کنید و پارامترهای آن را تعیین می‌کنید. این بخش مهم است، زیرا اولویت‌ها، انتظارات و رهنمودهای پروژه را به<br/>کل تیم منتقل می‌کند.</p><p><br/><em>مواردی که اینجا باید به آن‌ها فکر کنید: اصل 4C.<br/>روشن، موجز، کامل و معتبر باشید.<br/><br/></em></p><p>رعایت این اصول در توضیحات پروژه، همه را هم‌نظر نگه می‌دارد و به کاهش خطر اشتباه یا گام‌های نادرست کمک می‌کند.</p><br/>وقت شروع است!<br/><br/>"
text.not_found_helper_content="<p>هنوز محتوایی برای این صفحه نداریم.<br/>لطفاً از پیوند «نیاز به کمک» در پایین صفحه استفاده کنید تا درباره کارهایی که اینجا می‌توانید انجام دهید بیشتر بدانید.</p>"
text.retros_helper_content="<p>بازنگری‌ها تأملی کوتاه درباره کار، عملکرد تیم و البته پیشرفت هستند.<br/>اینجا تیم شما می‌تواند لحظه‌ای روی آنچه خوب پیش رفت، آنچه خوب پیش نرفت و آنچه دفعه بعد می‌توان متفاوت انجام داد تمرکز کند.<br/>توصیه می‌کنیم جلسه بازبینی را در فواصل منظم یا دست‌کم در پایان هر نقطه عطف برگزار کنید.<br/></p>"
text.roadmap_helper_content="<p>نقشه‌های راه برای تقسیم پروژه‌های بزرگ به بخش‌های کوچک‌تر و قابل مدیریت‌تر مفیدند.<br/><br/></p><p>برای ساخت نقشه راه، توصیه می‌کنیم نقاط عطفی تعیین کنید که در بازه‌ای 3 ماهه قابل دستیابی باشند.</p><p>نقاط عطف ایستگاه‌هایی در مسیر تکمیل پروژه هستند.<br/>به زبان ساده: اگر سفری جاده‌ای از این سر کشور به آن سر در پیش دارید، هر استانی که از آن می‌گذرید می‌تواند یک نقطه عطف باشد.<br/><br/>برای شروع، روی «افزودن نقطه عطف» در بالای صفحه کلیک کنید. تاریخ را در این زبانه یا مستقیماً در نمودار نقشه راه، با کلیک و کشیدن نقطه عطف در تقویم، تنظیم کنید.</p>"
text.show_clients_helper_content="<p>مشتریان/محصولات، پروژه‌های شما را در دسته‌هایی سازمان‌دهی می‌کنند و امکان جداسازی گروه‌های مختلف را فراهم می‌کنند.<br/><br/></p><p>اگر مشاور هستید، از قبل با مشتریان کار می‌کنید و اینجا جای سازمان‌دهی آن‌هاست.</p><p>اگر یک تیم محصول هستید، می‌توانید از این بخش برای سازمان‌دهی و جداسازی واحدهای خود (بازاریابی، فروش، عملیات و غیره) استفاده کنید.</p>"
text.show_projects_helper_content="<p>پروژه‌ها قلب کسب‌وکار شما و Leantime هستند! تغییر، توسعه، اهداف و هر چیزی که بتوانید بسازید یا در رؤیا ببینید، با پروژه‌ها گره خورده است.<br/>مدیریت پروژه به زبان ساده یعنی اطمینان از اینکه پروژه‌هایتان به‌موقع، درست و با ارزش واقعی کسب‌وکاری تحویل داده می‌شوند.<br/><br/>پروژه‌های شما اینجا قرار دارند. در صفحه پروژه‌ها می‌توانید پروژه ایجاد کنید و تعداد کارها، ساعات، بودجه و مشتری مرتبط با هر پروژه را به‌سرعت ببینید.<br/><br/>از این صفحه برای مرور سریع همه پروژه‌هایتان استفاده کنید.<br/><br/></p>"
text.new_db_version="نسخه جدیدی نصب شده است. برای استفاده از Leantime باید پایگاه داده خود را به‌روزرسانی کنید.<br/><br/><strong>لطفاً پیش از انجام این به‌روزرسانی حتماً از پایگاه داده خود نسخه پشتیبان تهیه کنید!</strong><br/>این کار ممکن است چند دقیقه طول بکشد."
text.update_was_successful="به‌روزرسانی با موفقیت انجام شد؛ اکنون می‌توانید وارد شوید. <a href='%1$s'>رفتن به صفحه ورود</a>"
text.this_script_will_set_up_leantime="این اسکریپت پایگاه داده شما را راه‌اندازی می‌کند و یک حساب مدیر سیستم می‌سازد"
text.enter_new_password="برای بازنشانی، رمز عبور جدید خود را وارد کنید."
text.enter_email_address_to_reset="برای بازنشانی رمز عبور، نشانی ایمیل خود را وارد کنید."
text.twoFA_qr="کد QR زیر را با برنامه OTP دلخواه خود یا Google Authenticator اسکن کنید"
text.twoFA_verify_code="کدی را که برنامه OTP یا Google Authenticator به شما داده است وارد کنید"
text.twoFA_already_enabled="احراز هویت دومرحله‌ای برای حساب شما از قبل فعال است و برای ورود الزامی است.<br/><br/>برای حذف احراز هویت دومرحله‌ای، روی «حذف» در پایین کلیک کنید"
text.twoFA_enabled="احراز هویت دومرحله‌ای برای حساب شما <strong>فعال</strong> است."
text.twoFA_disabled="احراز هویت دومرحله‌ای برای حساب شما <strong>غیرفعال</strong> است."
text.twoFA_manage="<span class='fa fa-lock'></span> مدیریت احراز هویت دومرحله‌ای"
text.who_can_access="انتخاب کنید چه کسانی مجاز به مشاهده این پروژه باشند. به‌طور پیش‌فرض، کاربران نقش‌هایی را که با آن‌ها تعریف شده‌اند به ارث می‌برند. می‌توانید این نقش‌ها را در زبانه «تیم» تغییر دهید"
text.ical_export_description="اینجا می‌توانید یک نشانی تقویم یکتا بسازید تا تقویم Leantime خود را در هر برنامه‌ای که از قالب iCal پشتیبانی می‌کند یکپارچه کنید. "
text.you_ical_url="نشانی تقویم شما در زیر آمده است. <br /> توجه داشته باشید که هر کسی این نشانی را داشته باشد می‌تواند به تقویم دسترسی پیدا کند. آن را مانند رمز عبور محرمانه نگه دارید."
text.no_url="با کلیک روی دکمه زیر یک نشانی بسازید"
