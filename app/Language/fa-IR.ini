text.full_lean_canvas_helper_content="تابلوی تحقیق کامل، شما را در کل فرایند اعتبارسنجی ایده راهنمایی می‌کند.<br/>در این صفحه بار دیگر به بخش مشتریان، مسئله و راه‌حل خود می‌پردازید (نگران نباشید؛ اگر این موارد را قبلاً در تابلوی ساده پر کرده باشید، اینجا دوباره آن‌ها را می‌بینید!).<br/>از آنجا به این موارد می‌روید: ارزش پیشنهادی روشن (چه چیزی ایده شما را از سایر پیشنهادها بهتر می‌کند؟)،<br/>کانال‌های فروش (مشتریان چگونه به راه‌حل شما دست پیدا می‌کنند؟)<br/>جریان‌های درآمد (راه‌حل شما چگونه درآمد ایجاد می‌کند؟)<br/>ساختار هزینه (راه‌حل شما چقدر ارزش دارد؟) شاخص‌های کلیدی (موفقیت را چگونه می‌سنجید؟)<br/>و مزیت انحصاری (چه چیزی شما را در برابر رقبا متمایز می‌کند؟)<br/>پاسخ به این پرسش‌ها برای پیشبرد موفقیت، کاهش شکست‌ها و امکان پیگیری و اعتبارسنجی فرض‌هایتان طراحی شده است.<br/>رویکرد ناب یعنی حذف اتلاف و تلاش برای ساخت محصولات، فروشگاه‌ها و راه‌حل‌هایی که مشتریانتان به آن‌ها نیاز دارند."
