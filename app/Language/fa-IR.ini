support.marcel_name="👋 من مارسل هستم"
support.marcel_tagline="مهاجر آلمانی، پدر یک دختر اوتیستیک و خودم هم با ADHD زندگی می‌کنم."
support.marcel_bio_1="ابزارهای سنتی مدیریت پروژه هیچ‌وقت برای من جا نیفتادند. احساس می‌کردم توسط ذهن‌های نوروتیپیک برای ذهن‌های نوروتیپیک ساخته شده‌اند. وقتی فریلنسر بودم و برای منظم نگه داشتن پروژه‌های مشتریان تقلا می‌کردم، شروع به ساختن چیزی کردم که با ذهن من کار کند، نه علیه آن."
support.marcel_bio_2="آنچه به‌عنوان یک راه‌حل شخصی شروع شد، وقتی فهمیدم میلیون‌ها نفر دیگر هم به همین نیاز دارند، به Leantime تبدیل شد."
support.gloria_name="👋 و من گلوریا هستم"
support.gloria_tagline="پرستار سابق اورژانس که مدیر محصول شد، کارآفرین هیسپانیک نسل اول."
support.gloria_bio_1="سال‌ها در محیط‌های پزشکی پرفشار کار کردم، جایی که نظم به معنای واقعی کلمه جان انسان‌ها را نجات می‌دهد. اما وقتی کسب‌وکار خودم را راه انداختم، ابزارهای سنتی پروژه طاقت‌فرسا بودند و با شیوه واقعی فکر کردن و کار کردن من ارتباطی نداشتند."
support.gloria_bio_2="پیشینه من در علوم رفتاری و پژوهش درباره انگیزه، شیوه ساخت امکاناتی را هدایت می‌کند که فقط کارها را سازمان‌دهی نمی‌کنند — بلکه کمک می‌کنند واقعاً بخواهید آن‌ها را تکمیل کنید."
support.closing_text="ما می‌توانیم جهانی بسازیم که در آن هیچ‌کس برای انجام کار عالی مجبور به جنگیدن با ابزارهایش نباشد. حمایت شما آینده‌ای را تأمین می‌کند که در آن نرم‌افزار خود را با تنوع انسانی تطبیق می‌دهد، نه برعکس."
