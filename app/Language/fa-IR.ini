text.help_dashboard_intro="Leantime ساخته شده تا به ابرقدرت‌های شما نیرو بدهد و به شما کمک کند پیشرفت خود به سوی اهدافتان را ببینید.<br /><br />بیشتر ما به ساختن فهرست کارها عادت کرده‌ایم — اما ما از شما می‌خواهیم به این فکر کنید که دقیقاً می‌خواهید به چه چیزی برسید.<br /><br />1. یک چشم‌انداز (استراتژی) و اهداف خود را تعیین کنید<br />2. کاری را که شما را به آن اهداف می‌رساند تعریف کنید<br />3. و سپس با برنامه‌ریزی روزبه‌روز در داشبورد «کارهای من» به آن‌ها برسید.<br />"
