tour.my_work.welcome_title="به تور داشبورد خوش آمدید"
tour.my_work.welcome_text="بیایید با چند نکته پایه شروع کنیم تا با منوها و بخش‌های مختلف Leantime آشنا شوید."
tour.my_work.work_modes_title="حالت‌های کاری"
tour.my_work.work_modes_text="منوی بالا «حالت کاری» فعلی شما را نشان می‌دهد. ممکن است درون یک پروژه، در فضای کاری شخصی خود یا در حالت شرکت باشید."
tour.my_work.left_nav_text="منوی کناری، حالت کاری فعلی را به بخش‌های مختلف تقسیم می‌کند و به آن‌ها دسترسی می‌دهد. همه موارد این منو به حالت کاری‌ای تعلق دارند که در بالا انتخاب شده است."
tour.my_work.profile_bar_title="نوار پروفایل من"
tour.my_work.profile_bar_text="اینجا پیوندهای حساب کاربری خود و همچنین اعلان‌ها و تازه‌ترین اخبار Leantime را می‌یابید."
tour.my_work.widgets_title="ابزارک‌های داشبورد شما"
tour.my_work.widgets_text="داشبورد شما از ابزارک‌های مختلفی تشکیل شده است که اطلاعات متمرکزی درباره کارتان نشان می‌دهند."
tour.my_work.customize_title="داشبورد خود را سفارشی کنید"
tour.my_work.customize_text="می‌توانید با کشیدن و رها کردن، اندازه ابزارک‌ها را تغییر دهید و جای آن‌ها را عوض کنید."
tour.my_work.todos_title="کارهای من"
tour.my_work.todos_text="ابزارک «کارهای من» همه کارهایی را که در حال حاضر به شما واگذار شده‌اند نشان می‌دهد."
tour.my_work.group_todos_title="گروه‌بندی کارها"
tour.my_work.group_todos_text="با منوهای کشویی این بخش می‌توانید کارهای خود را بر اساس پروژه فیلتر کنید یا آن‌ها را بر اساس اولویت، وضعیت، پروژه یا تاریخ گروه‌بندی کنید."
tour.my_work.sort_todos_title="مرتب‌سازی کارها"
tour.my_work.sort_todos_text="می‌توانید ترتیب هر کار را با کشیدن و رها کردن تغییر دهید. همچنین می‌توانید یک کار را به تقویم بکشید تا آن را زمان‌بندی کنید."
tour.my_work.timer_title="زمان‌سنج را شروع کنید"
tour.my_work.timer_text="وقتی آماده‌اید پرداختن به یک کار را آغاز کنید، کافی است روی دکمه شروع زمان‌سنج کلیک کنید."
tour.my_work.complete_task_title="تکمیل یک کار"
tour.my_work.complete_task_text="وقتی کاری تمام شد، می‌توانید با کلیک روی منوی کشویی وضعیت، آن را به‌عنوان انجام‌شده علامت بزنید."
tour.my_work.add_tasks_title="افزودن کارهای بیشتر"
tour.my_work.add_tasks_text="می‌توانید با کلیک روی دکمه + در هر بخش یا با استفاده از منوی سه‌نقطه کنار هر کار، کارهای بیشتری اضافه کنید."
tour.my_work.finish_text="تور داشبورد «کارهای من» را به پایان رساندید. به <a href='%s/dashboard/show'>پروژه خود</a> بروید تا درباره مدیریت پروژه در Leantime بیشتر بیاموزید."
tour.project_dashboard.menu_title="منوی پروژه"
tour.project_dashboard.menu_text="منوی پروژه، پروژه شما را در بخش‌های مختلفی سازمان‌دهی می‌کند: <strong>اتاق داده</strong> - برای نگهداری همه فایل‌ها و اطلاعات شما، <strong>تفکر</strong> - برای استراتژی‌پردازی، ایده‌پردازی و تعریف، <strong>ساخت</strong> - برای مدیریت اهداف، نقاط عطف و کارها."
tour.project_dashboard.selector_title="انتخابگر پروژه"
tour.project_dashboard.selector_text="با انتخابگر پروژه بین پروژه‌ها جابه‌جا شوید. منوی کناری همه چیزهای مربوط به پروژه فعلی شما را نشان می‌دهد."
tour.project_dashboard.checklist_title="چک‌لیست"
tour.project_dashboard.checklist_text="چک‌لیست پروژه مرجعی سریع است تا ببینید آیا پروژه شما همه اطلاعات لازم برای اجرای موفق را در بر دارد یا نه."
tour.project_dashboard.status_title="به‌روزرسانی سریع وضعیت"
tour.project_dashboard.status_text="با به‌روزرسانی‌های وضعیت می‌توانید پیشرفت پروژه خود را با رنگ‌های قرمز، زرد و سبز به‌سرعت با تیمتان به اشتراک بگذارید. این وضعیت در سراسر برنامه قابل مشاهده خواهد بود."
tour.project_dashboard.progress_title="پیشرفت"
tour.project_dashboard.progress_text="نشانگر پیشرفت پروژه نشان می‌دهد چه مقدار از کار را تکمیل کرده‌اید. این نشانگر اندازه‌های مختلف کارها، سرعت تیم و نقاط عطف پروژه را در نظر می‌گیرد."
tour.project_dashboard.latest_tasks_title="آخرین کارها"
tour.project_dashboard.latest_tasks_text="فهرست آخرین کارها، جدیدترین کارهای افزوده‌شده به پروژه شما را نشان می‌دهد و می‌تواند به‌عنوان صندوق ورودی پروژه به کار رود."
tour.project_dashboard.team_title="تیم"
tour.project_dashboard.team_text="کادر تیم، اعضای این پروژه را به شما نشان می‌دهد."
tour.project_dashboard.finish_text="تور داشبورد پروژه را به پایان رساندید. به بخش <a href='%s/tickets/showKanban'>کارها</a> بروید تا با روش‌های مختلف مدیریت کارهایتان در Leantime آشنا شوید."
tour.kanban_board.overview_title="تابلوی کانبان شما"
tour.kanban_board.overview_text="این تابلوی کانبان شماست. به شما کمک می‌کند کارتان را به‌صورت بصری ببینید و کارهای در جریان را محدود کنید."
tour.kanban_board.workflow_title="جریان کار"
tour.kanban_board.workflow_text="کارها با پیشرفتشان از یک ستون به ستون بعدی می‌روند. برای به‌روزرسانی وضعیت، کارت‌ها را بکشید و رها کنید."
tour.kanban_board.columns_title="ستون‌های انعطاف‌پذیر"
tour.kanban_board.columns_text="با منوی سه‌نقطه می‌توانید ستون‌ها را اضافه یا حذف کنید و نامشان را تغییر دهید."
tour.kanban_board.filter_title="فیلتر کردن کارها"
tour.kanban_board.filter_text="می‌توانید کارهای خود را بر اساس فیلدهای مختلفی مانند اولویت، وضعیت، پروژه یا تاریخ فیلتر کنید."
tour.kanban_board.swimlanes_title="خطوط شنا"
tour.kanban_board.swimlanes_text="علاوه بر این، می‌توانید کارهای خود را گروه‌بندی کنید تا خطوط شنای کانبان بسازید. این کار به شما کمک می‌کند کارتان را بر اساس اعضای تیم، اولویت یا نقاط عطف به‌صورت بصری ببینید."
tour.kanban_board.sprints_title="اسپرینت‌ها"
tour.kanban_board.sprints_text="اگر کارتان را در قالب اسپرینت مدیریت می‌کنید، می‌توانید با منوی کشویی این بخش اسپرینت‌ها را انتخاب، ایجاد و به‌روزرسانی کنید."
tour.kanban_board.finish_text="تور کانبان به پایان رسید. به بخش <a href='%s/tickets/roadmap'>نقاط عطف</a> بروید تا با ایجاد و مدیریت نقاط عطف در Leantime آشنا شوید."
tour.milestones.overview_title="نقاط عطف"
tour.milestones.overview_text="نقاط عطف به شما کمک می‌کنند نتایج اصلی و مراحل پروژه را پیگیری کنید."
tour.milestones.drag_title="کشیدن و مرتب‌سازی"
tour.milestones.drag_text="هر نوار نشان‌دهنده یک نقطه عطف است. می‌توانید نوارها را در طول خط زمانی بکشید، ترتیبشان را تغییر دهید و اندازه‌شان را عوض کنید. هر تغییری در این صفحه، زمان‌بندی نقاط عطف شما را به‌روزرسانی می‌کند."
tour.milestones.filter_title="فیلتر"
tour.milestones.filter_text="می‌توانید نقاط عطف خود را فیلتر کنید و کارهای مربوط به آن‌ها را نیز ببینید."
tour.milestones.timeframes_title="بازه‌های زمانی"
tour.milestones.timeframes_text="می‌توانید بازه زمانی نمای خط زمانی را تغییر دهید تا بخش بیشتری از سال را ببینید یا به جزئیات روزبه‌روز بپردازید."
tour.milestones.finish_text="تور نقاط عطف به پایان رسید. به بخش <a href='%s/goalcanvas/dashboard'>اهداف</a> بروید تا با ایجاد و مدیریت اهداف در Leantime آشنا شوید."
tour.goals.overview_title="اهداف"
tour.goals.overview_text="اهداف به شما کمک می‌کنند تأثیر قابل اندازه‌گیری پروژه‌هایتان را پیگیری کنید."
tour.goals.parts_title="مقصودها و معیارها"
tour.goals.parts_text="هر هدف از یک مقصود (آنچه می‌خواهید به آن برسید) و یک معیار (اینکه چگونه آن را می‌سنجید) تشکیل شده است."
tour.goals.progress_title="پیشرفت هدف"
tour.goals.progress_text="با به‌روزرسانی معیارهای هدف، نوار پیشرفت نشان می‌دهد چقدر پیش رفته‌اید."
tour.goals.milestones_title="نقاط عطف و اهداف"
tour.goals.milestones_text="می‌توانید اهداف را به نقاط عطف متصل کنید تا پیشرفت اهدافتان را در سطح کارها پیگیری کنید. این کار به شناسایی کاستی‌های برنامه پروژه شما کمک می‌کند."
tour.goals.finish_text="تور اهداف به پایان رسید. نقاط عطف، اهداف و کارها اجزای پایه Leantime هستند. از آن‌ها برای تقسیم کارتان به بخش‌های قابل مدیریت استفاده کنید. به <a href='%s/tickets/showKanban'>تابلوی کانبان</a> بروید تا کارهایتان را مرور کنید."
