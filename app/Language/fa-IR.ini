label.webhook_notifications="وب‌هوک شخصی"
label.webhook_notifications_description="اعلان‌های خود را به نقطه پایانی HTTPS خودتان بفرستید. برای هر اعلان پروژه که واجد دریافت آن هستید، Leantime یک درخواست HTTP POST با بدنه JSON به این نشانی ارسال می‌کند. درخواست‌ها در پس‌زمینه ارسال می‌شوند و ممکن است رسیدنشان چند دقیقه طول بکشد؛ درخواستی که ناموفق باشد دوباره ارسال نمی‌شود. دسته‌بندی‌ها و سطح هر پروژه در تب اعلان‌ها تعیین می‌کنند کدام اعلان‌ها واجد شرایط هستند، از جمله تغییراتی که خودتان انجام می‌دهید. خاموش کردن اعلان‌های ایمیلی وب‌هوک را متوقف نمی‌کند. وب‌هوک فقط زمانی ارسال می‌کند که فعال باشد و نشانی آن تنظیم شده باشد. وقتی وب‌هوک غیرفعال است نشانی شما ذخیره می‌ماند — برای حذف آن، نشانی را پاک کنید."
