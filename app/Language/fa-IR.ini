text.mattermost_instructions=" این یکپارچه‌سازی، اعلان‌های به‌روزرسانی را در کانال دلخواه شما ارسال می‌کند.<br/>برای دریافت نشانی Incoming Webhook از Mattermost، <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>دستورالعمل‌های این صفحه</a> را دنبال کنید. سپس پیوند را در فرم کناری قرار دهید و روی «ذخیره» کلیک کنید."
text.slack_instructions="این یکپارچه‌سازی، اعلان‌های به‌روزرسانی را در کانال دلخواه شما ارسال می‌کند.<br/>برای دریافت نشانی Incoming Webhook از Slack، <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>دستورالعمل‌های این صفحه</a> را دنبال کنید. سپس پیوند را در فرم کناری قرار دهید و روی «ذخیره» کلیک کنید."
text.choose_access_for_users="کاربرانی را که می‌خواهید اضافه یا حذف کنید، علامت بزنید یا علامتشان را بردارید. درباره نقش‌ها می‌توانید در <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a> بیشتر بخوانید"
text.expected_to_finish_by="پایان پیش‌بینی‌شده تا"
text.zulip_instructions="این یکپارچه‌سازی، اعلان‌های به‌روزرسانی را در استریم و موضوع دلخواه شما ارسال می‌کند.<br/>برای ایجاد یک بات جدید، <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>دستورالعمل‌های این صفحه</a> را دنبال کنید. سپس اطلاعات را در فرم کناری وارد کنید و روی «ذخیره» کلیک کنید."
text.discord_instructions="این یکپارچه‌سازی، اعلان‌های به‌روزرسانی را در کانال دلخواه شما ارسال می‌کند.<br/>برای ایجاد وب‌هوک(های) جدید، <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>دستورالعمل‌های این صفحه</a> را دنبال کنید، سپس پیوند(ها) را در فیلدهای کناری قرار دهید و روی «ذخیره» کلیک کنید."
