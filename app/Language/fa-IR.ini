text.my_work_dashboard_intro="داشبورد «کارهای من» همه چیزهای مهم را در کانون توجه قرار می‌دهد.<br/>مهم‌ترین کارهای شما اکنون در صدر قرار دارند و دقیقاً برای شما و متناسب با شیوه‌ای که ذهنتان بهتر کار می‌کند سازمان‌دهی شده‌اند.<br/><br/>از کارهای کوچک تا اهداف بلندپروازانه، هر چه نیاز دارید همین‌جاست. این فضای شماست برای ثبت ایده‌ها، پیگیری پیشرفت و جشن گرفتن موفقیت‌ها در طول مسیر."
text.blueprints_intro="الگوها فرصتی هستند برای اینکه همه داده‌ها را معنا کنید. Leantime ابزارها و بوم‌های متنوعی دارد تا پیش‌زمینه پروژه خود را از طریق بوم مدل کسب‌وکار، تحلیل SWOT یا نقشه همدلی تعریف کنید.<br/><br/>اگر نمی‌دانید از کجا شروع کنید، پیشنهاد می‌کنیم یک «بوم ارزش پروژه» بسازید. این بوم به مهم‌ترین پرسش‌های پروژه شما پاسخ می‌دهد: مشتری شما کیست؟<br/>چه مسئله‌ای را حل می‌کنید؟<br/>راه‌حل شما چیست؟<br/>راه‌حل شما چه مزیتی نسبت به رقبا دارد؟<br/>"
text.goals_tour_intro="اهداف به شما امکان می‌دهند پروژه خود را به بخش‌های دست‌یافتنی، قابل سنجش و قابل اجرا تقسیم کنید.<br/>در حالی که نقاط عطف بر اجرا تمرکز دارند، اهداف درباره معیارهایی هستند که می‌خواهید به آن‌ها برسید.<br/>هر هدف باید مقصود روشنی داشته باشد (چیزی که می‌خواهید به آن برسید) و به‌راحتی با یک معیار واحد قابل سنجش باشد.<br/><br/>وقتی هدفی داشتید، می‌توانید نقاط عطف را به آن اختصاص دهید تا آن را به کارهای قابل اجرا تقسیم کنید.<br/>"
text.project_dashboard_tour_intro="پروژه‌ها در Leantime فضاهای کاری مشارکتی هستند که شما و تیمتان در آن‌ها کارها را به‌طور کارآمد سازمان‌دهی، پیگیری و تحویل می‌دهید. هر پروژه ظرفی برای اهداف، کارها و نقاط عطف مرتبط است و به شما امکان می‌دهد پیشرفت را در یک مکان مرکزی زیر نظر داشته باشید.<br/><br/>چه کارهای شغلی، تحصیلی یا ابتکارهای شخصی را مدیریت کنید، پروژه‌های Leantime ساختار و ابزارهای لازم برای تبدیل ایده‌ها به نتایج موفق را فراهم می‌کنند."
text.wiki_tour_intro="اسناد ما به شما امکان می‌دهند مستندات را بنویسید و با تیم خود به اشتراک بگذارید. می‌توانید چندین فضا بسازید تا مستندات خود را بر اساس تیم، حوزه یا دسته اسناد سازمان‌دهی کنید.<br/>برای به اشتراک گذاشتن دانش، فرایندها و رویه‌ها سند بسازید. همچنین می‌توانید سندی بسازید تا پیوند یک فایل یا پوشه در فضای ذخیره‌سازی ابری خود را به اشتراک بگذارید.<br/>"
text.extend_leantime_latest_plugins="Leantime را با جدیدترین افزونه‌های ما گسترش دهید."
support.headline_help_us_build="به ما کمک کنید آینده‌ای بسازیم که در آن همه ذهن‌ها شکوفا شوند!"
support.intro_text_1="بیشتر ابزارهای بهره‌وری فرض می‌کنند همه یک‌جور فکر می‌کنند: خطی، با تمرکز کامل و با انگیزه‌ای که از مهلت‌های دلبخواهی می‌آید. چه ADHD داشته باشید و برای انگیزه به دوپامینِ تکمیل کارها نیاز داشته باشید، چه اوتیسم داشته باشید و به ساختاری ثابت نیاز داشته باشید، چه نارساخوانی داشته باشید و فضایی فکر کنید، یا صرفاً از ابزارهایی که با شیوه واقعی کار ذهنتان جور نیستند خسته شده باشید — احتمالاً به‌کلی قید مدیریت پروژه را زده‌اید."
support.intro_text_2="ما Leantime را برای ذهن‌هایی می‌سازیم که متفاوت کار می‌کنند. این شامل ذهن‌های نورودایورجنت است، اما همچنین هر کسی که تا به حال احساس کرده ابزارهای موجود با الگوهای طبیعی فکر کردنش در تضادند."
