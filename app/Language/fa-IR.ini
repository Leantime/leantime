## Strategy Message=

headline.sm.board="تابلوی پیام استراتژی"

box.sm.qa="<em>بخش‌های مشتری هدف</em> چه کسانی هستند و چه کسانی <em>صراحتاً خارج از دامنه</em> قرار دارند؟"
box.sm.qb="چه <em>ارزش پیشنهادی</em> به مشتریان هدف خود ارائه می‌کنید؟"
box.sm.qc="چرا مشتریان باید به‌جای رقبا با شما کار کنند؟ <em>ویژگی‌های متمایز</em> ما که تقلیدشان دشوار است کدام‌اند؟"
box.sm.qd="چرا می‌توانید به وعده‌هایی که به مشتریان داده‌اید عمل کنید؟ چه <em>توانمندی‌های منحصربه‌فردی</em> دارید و از آن‌ها بهره می‌برید؟"
box.sm.qe="با استراتژی جدید یا بازنگری‌شده چه چیزی <em>تغییر می‌کند</em> و چه چیزی در طول زمان <em>ثابت می‌ماند</em>؟ چگونه مطمئن می‌شوید مشتریان فعلی که همچنان در دامنه هستند از دست نمی‌روند؟"
box.sm.qf="چرا این استراتژی امکان <em>ایجاد و/یا افزایش سود در طول زمان</em> را فراهم می‌کند؟"
box.sm.qg="اهداف تعیین‌شده با استراتژی جدید یا بازنگری‌شده چگونه <em>به‌طور واقع‌بینانه دست‌یافتنی</em> هستند؟"

