text.lean.helper_content="O lean canvas vai guiá-lo por todo o processo de validação da sua nova ideia de negócio e/ou de produto.<br/>Vai abordar o seu <em>Segmento de clientes</em>, <em>Problema, Solução</em>.<br/>A partir daí, passará para a sua <em>Proposta de valor única</em> (o que torna a sua ideia melhor do que outras ofertas?), os seus <em>Canais de distribuição</em> (como vai fazer chegar a sua solução aos clientes?), as suas <em>Fontes de receita</em> (como é que a sua solução vai gerar dinheiro?), a sua <em>Estrutura de custos</em> (quanto vale a sua solução?), as <em>Métricas-chave</em> (como vai medir o sucesso?) e a sua <em>Vantagem injusta</em> (o que tem que o vai ajudar a ter sucesso face à concorrência?)<br/>Responder a estas perguntas ajuda a promover o sucesso, a mitigar o insucesso e permite-lhe acompanhar e validar os seus pressupostos. Ser Lean consiste em eliminar o desperdício e trabalhar para criar produtos, negócios e soluções de que os seus clientes precisam."
text.lean.disclaimer="O Lean Canvas foi adaptado do <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> e está licenciado ao abrigo da licença <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Quando se sentir confortável com o seu lean canvas, aceda ao</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Planeador de roadmap</a>"


