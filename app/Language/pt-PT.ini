text.my_work_dashboard_intro="O seu painel O Meu Trabalho põe em foco tudo o que importa.<br/>O seu trabalho mais importante está agora em destaque, organizado só para si e para a forma como o seu cérebro funciona melhor.<br/><br/>Das tarefas rápidas aos objetivos ambiciosos, tudo o que precisa está aqui. Este é o seu espaço para registar ideias, acompanhar o progresso e celebrar as conquistas pelo caminho."
text.blueprints_intro="Os Planos do Projeto são a sua oportunidade de dar sentido a todos os dados. O Leantime tem uma variedade de ferramentas e canvas para definir o contexto do seu projeto através de Business Model Canvas, análises SWOT ou mapas de empatia.<br/><br/>Se não souber por onde começar, sugerimos que crie um «Canvas de Valor do Projeto». Este canvas responde às perguntas mais importantes do seu projeto: Quem é o seu cliente?<br/>Que problema está a resolver?<br/>Qual é a sua solução?<br/>Que vantagem oferece a sua solução face à concorrência?<br/>"
text.goals_tour_intro="Os objetivos permitem dividir o seu projeto em partes alcançáveis, mensuráveis e acionáveis.<br/>Enquanto as metas se centram na execução, os objetivos dizem respeito às métricas que pretende alcançar.<br/>Cada objetivo deve ter uma finalidade clara (aquilo que pretende alcançar) e ser facilmente mensurável através de uma única métrica.<br/><br/>Depois de ter um objetivo, pode atribuir-lhe metas para o dividir em tarefas executáveis.<br/>"
text.project_dashboard_tour_intro="No Leantime, os projetos são espaços de trabalho colaborativos onde o utilizador e a sua equipa organizam, acompanham e entregam trabalho de forma eficiente. Cada projeto funciona como um contentor de objetivos, tarefas e metas relacionados e permite acompanhar o progresso num local central.<br/><br/>Quer esteja a gerir trabalho, estudos ou iniciativas pessoais, os projetos do Leantime dão-lhe a estrutura e as ferramentas necessárias para transformar ideias em resultados de sucesso."
text.wiki_tour_intro="Os nossos documentos permitem-lhe escrever e partilhar documentação com a sua equipa. Pode criar vários espaços para organizar a documentação por equipas, áreas ou categorias de documentos.<br/>Crie documentos para partilhar conhecimento, processos e procedimentos. Também pode criar um documento para partilhar uma ligação para um ficheiro ou uma pasta no seu armazenamento na nuvem.<br/>"
text.extend_leantime_latest_plugins="Expanda o Leantime com os nossos plugins mais recentes."
support.headline_help_us_build="Ajude-nos a construir um futuro em que todas as mentes prosperem!"
support.intro_text_1="A maioria das ferramentas de produtividade parte do princípio de que todos pensam da mesma forma: de forma linear, com foco perfeito e motivados por prazos arbitrários. Quer tenha PHDA e precise da dose de dopamina de concluir tarefas, seja autista e anseie por uma estrutura consistente, tenha dislexia e pense de forma espacial, ou esteja simplesmente cansado de ferramentas que não correspondem à forma como o seu cérebro realmente funciona — provavelmente já desistiu por completo da gestão de projetos."
support.intro_text_2="Estamos a construir o Leantime para mentes que funcionam de forma diferente. Isso inclui cérebros neurodivergentes, mas também qualquer pessoa que alguma vez tenha sentido que as ferramentas existentes lutam contra a sua forma natural de pensar."
