box.sm.qd="Porque é que vai conseguir cumprir as promessas feitas aos seus clientes? Que <em>capacidades únicas</em> possui e explora?"
box.sm.qe="O que vai <em>mudar</em> com a estratégia nova ou revista e o que <em>se vai manter</em> ao longo do tempo? Como garante que os clientes existentes, que continuam no âmbito, não se perdem?"
box.sm.qf="Porque é que a estratégia vai permitir <em>gerar e/ou aumentar os lucros ao longo do tempo</em>?"
box.sm.qg="Os objetivos definidos com a estratégia nova ou revista são <em>realisticamente alcançáveis</em>?"

