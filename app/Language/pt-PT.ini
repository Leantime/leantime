tour.my_work.welcome_title="Bem-vindo à visita guiada ao painel"
tour.my_work.welcome_text="Vamos começar por alguns conceitos básicos para se familiarizar com a navegação e os diferentes elementos do Leantime."
tour.my_work.work_modes_title="Modos de trabalho"
tour.my_work.work_modes_text="A navegação superior mostra o «modo de trabalho» em que se encontra. Pode estar dentro de um projeto, na sua área de trabalho pessoal ou no modo da empresa."
tour.my_work.left_nav_text="A navegação à esquerda detalha o modo de trabalho atual e dá acesso a diferentes áreas. Tudo o que aqui é apresentado faz parte do modo de trabalho selecionado acima."
tour.my_work.profile_bar_title="A minha barra de perfil"
tour.my_work.profile_bar_text="Aqui encontra ligações para a sua conta, bem como notificações e as últimas novidades sobre o Leantime."
tour.my_work.widgets_title="Os widgets do seu painel"
tour.my_work.widgets_text="O seu painel está dividido em vários widgets que mostram informação focada sobre o seu trabalho."
tour.my_work.customize_title="Personalize o seu painel"
tour.my_work.customize_text="Os widgets podem ser redimensionados e movidos através da funcionalidade de arrastar e largar."
tour.my_work.todos_title="As minhas tarefas"
tour.my_work.todos_text="O widget «As minhas tarefas» mostra todas as tarefas que lhe estão atualmente atribuídas."
tour.my_work.group_todos_title="Agrupar tarefas"
tour.my_work.group_todos_text="Pode utilizar estes menus pendentes para filtrar as suas tarefas por projeto ou agrupá-las por prioridade, estado, projeto ou datas."
tour.my_work.sort_todos_title="Ordenar tarefas"
tour.my_work.sort_todos_text="Cada tarefa pode ser arrastada e largada para alterar a sua ordem. Também pode arrastar uma tarefa para o calendário para a agendar."
tour.my_work.timer_title="Iniciar o cronómetro"
tour.my_work.timer_text="Quando estiver pronto para começar a trabalhar numa tarefa, basta clicar no botão para iniciar o cronómetro."
tour.my_work.complete_task_title="Concluir uma tarefa"
tour.my_work.complete_task_text="Quando uma tarefa estiver concluída, pode marcá-la como feita clicando no menu pendente do estado."
tour.my_work.add_tasks_title="Adicionar mais tarefas"
tour.my_work.add_tasks_text="Pode adicionar mais tarefas clicando no botão «+» de cada secção ou utilizando o menu de três pontos junto a cada tarefa."
tour.my_work.finish_text="Concluiu a visita guiada ao painel «O Meu Trabalho». Aceda ao <a href='%s/dashboard/show'>seu projeto</a> para saber mais sobre a gestão de projetos no Leantime."
tour.project_dashboard.menu_title="Menu do projeto"
tour.project_dashboard.menu_text="O menu do projeto organiza o seu projeto em diferentes secções: <strong>Sala de dados</strong> - para guardar todos os seus ficheiros e informações, <strong>Pensar</strong> - para definir a estratégia, gerar ideias e definir o projeto, <strong>Fazer</strong> - para gerir objetivos, metas e tarefas."
tour.project_dashboard.selector_title="Seletor de projetos"
tour.project_dashboard.selector_text="Utilize o seletor de projetos para alternar entre projetos. O menu à esquerda mostra tudo o que está relacionado com o seu projeto atual."
tour.project_dashboard.checklist_title="Lista de verificação"
tour.project_dashboard.checklist_text="A lista de verificação do projeto é uma referência rápida para ver se o seu projeto contém toda a informação necessária para uma execução bem-sucedida."
tour.project_dashboard.status_title="Atualizações rápidas de estado"
tour.project_dashboard.status_text="Pode utilizar as atualizações de estado para partilhar rapidamente o progresso do seu projeto com a sua equipa, através das cores vermelho, amarelo e verde. O estado fica visível em toda a aplicação."
tour.project_dashboard.progress_title="Progresso"
tour.project_dashboard.progress_text="O indicador de progresso do projeto mostra quanto trabalho já concluiu. Tem em conta os diferentes tamanhos das tarefas, a velocidade da equipa e as metas do projeto."
tour.project_dashboard.latest_tasks_title="Tarefas recentes"
tour.project_dashboard.latest_tasks_text="A lista de tarefas recentes mostra as tarefas adicionadas mais recentemente ao seu projeto e pode ser utilizada como caixa de entrada do projeto."
tour.project_dashboard.team_title="Equipa"
tour.project_dashboard.team_text="A caixa da equipa mostra os membros deste projeto."
tour.project_dashboard.finish_text="Concluiu a visita guiada ao painel do projeto. Aceda às <a href='%s/tickets/showKanban'>Tarefas</a> para conhecer as várias formas de gerir as suas tarefas no Leantime."
tour.kanban_board.overview_title="O seu quadro Kanban"
tour.kanban_board.overview_text="Este é o seu quadro Kanban. Ajuda-o a visualizar o seu trabalho e a limitar o trabalho em curso."
tour.kanban_board.workflow_title="Fluxo de trabalho"
tour.kanban_board.workflow_text="As tarefas avançam da esquerda para a direita à medida que progridem. Arraste e largue os cartões para atualizar o respetivo estado."
tour.kanban_board.columns_title="Colunas flexíveis"
tour.kanban_board.columns_text="Através do menu de três pontos, pode adicionar, remover e mudar o nome das colunas."
tour.kanban_board.filter_title="Filtrar tarefas"
tour.kanban_board.filter_text="Pode filtrar as suas tarefas por vários campos, como prioridade, estado, projeto ou datas."
tour.kanban_board.swimlanes_title="Swimlanes"
tour.kanban_board.swimlanes_text="Além disso, pode agrupar as suas tarefas para criar swimlanes no Kanban. Isto ajuda-o a visualizar o seu trabalho por membros da equipa, prioridade ou metas."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Se gere o seu trabalho em sprints, pode utilizar este menu pendente para selecionar, criar e atualizar sprints."
tour.kanban_board.finish_text="Assim termina a visita guiada ao Kanban. Aceda às <a href='%s/tickets/roadmap'>Metas</a> para saber como criar e gerir metas no Leantime."
tour.milestones.overview_title="Metas"
tour.milestones.overview_text="As metas ajudam-no a acompanhar os principais resultados e as fases do projeto."
tour.milestones.drag_title="Arrastar e ordenar"
tour.milestones.drag_text="Cada barra representa uma meta. Pode arrastá-las ao longo do cronograma, reordená-las e redimensioná-las. Tudo o que fizer neste ecrã atualiza as datas das suas metas."
tour.milestones.filter_title="Filtrar"
tour.milestones.filter_text="Pode filtrar as suas metas e também ver as tarefas que fazem parte delas."
tour.milestones.timeframes_title="Intervalos de tempo"
tour.milestones.timeframes_text="Pode alterar o intervalo de tempo da vista de cronograma para ver uma parte maior do ano ou analisar em detalhe a divisão por dia."
tour.milestones.finish_text="Assim termina a visita guiada às metas. Aceda aos <a href='%s/goalcanvas/dashboard'>Objetivos</a> para saber como criar e gerir objetivos no Leantime."
tour.goals.overview_title="Objetivos"
tour.goals.overview_text="Os objetivos ajudam-no a acompanhar o impacto mensurável nos seus projetos."
tour.goals.parts_title="Finalidades e métricas"
tour.goals.parts_text="Cada objetivo é composto por uma finalidade (aquilo que pretende alcançar) e uma métrica (a forma como a vai medir)."
tour.goals.progress_title="Progresso do objetivo"
tour.goals.progress_text="À medida que atualiza as métricas dos seus objetivos, a barra de progresso mostra-lhe o quanto já avançou."
tour.goals.milestones_title="Metas e objetivos"
tour.goals.milestones_text="Pode associar objetivos a metas para acompanhar o progresso dos seus objetivos ao nível das tarefas. Isto ajuda a identificar lacunas no plano do seu projeto."
tour.goals.finish_text="Assim termina a visita guiada aos objetivos. Metas, Objetivos e Tarefas são os elementos básicos do Leantime. Utilize-os para dividir o seu trabalho em partes geríveis. Aceda ao <a href='%s/tickets/showKanban'>Quadro Kanban</a> para rever as suas tarefas."
