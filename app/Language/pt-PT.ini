label.onboarding_default_project_name="O meu projeto"
text.onboarding_default_project_details="Bem-vindo ao seu primeiro projeto no Leantime!<br />Este é o seu espaço para organizar tarefas, acompanhar objetivos e planear o seu trabalho. Pode alterar o que quiser aqui ou criar projetos adicionais à medida que for crescendo. Este projeto serve apenas para começar"
label.onboarding_milestone_getting_started="Primeiros passos"
label.onboarding_task_community_chat="Junte-se ao chat da nossa comunidade"
text.onboarding_task_community_chat="O chat da nossa comunidade é um ótimo recurso para fazer perguntas e obter feedback sobre a configuração de projetos. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat da comunidade</a>"
label.onboarding_task_invite_team="Convide os seus colegas de equipa"
text.onboarding_task_invite_team="Quer trabalhe com alguém ou apenas precise de um parceiro que o ajude a cumprir os seus compromissos, utilizar o Leantime em grupo ajuda a manter o rumo e a motivação <a href='%s'>Gestão de Utilizadores</a>"
label.onboarding_task_project_structure="Saiba mais sobre a estrutura de projetos do Leantime"
text.onboarding_task_project_structure="Temos muitos recursos adicionais na nossa documentação de ajuda. Para saber mais sobre a estrutura de projetos no Leantime e as boas práticas, visite: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Crie um objetivo"
text.onboarding_task_create_goal="Os objetivos servem para acompanhar e medir finalidades de longo prazo. Devem ser mensuráveis através de métricas que possa atualizar regularmente. Os objetivos e as metas podem ser associados para acompanhar o progresso da execução juntamente com o progresso das métricas <a href='%s'>Objetivos do projeto</a>"
label.onboarding_task_create_milestone="Crie uma meta"
text.onboarding_task_create_milestone="As metas permitem organizar as fases dos seus projetos em resultados concretos. Cada meta tem uma data de início e de fim e deve produzir algum resultado <a href='%s'>Metas do projeto</a>"
label.onboarding_task_personal_project="Explore o seu projeto pessoal"
text.onboarding_task_personal_project="O seu projeto pessoal é um espaço onde pode organizar as suas tarefas, objetivos e trabalho. Pode aceder-lhe através do seletor de projetos no topo ou clicando nesta ligação: <a href='%s'>O meu projeto</a>"
label.onboarding_task_complete_profile="Completar o meu perfil no Leantime"
text.onboarding_task_complete_profile="Atualizar a fotografia de perfil e completar as preferências de trabalho para personalizar a minha experiência. <a href='%s'>O meu perfil</a>"
