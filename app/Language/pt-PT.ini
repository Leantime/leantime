support.marcel_name="👋 Sou o Marcel"
support.marcel_tagline="Imigrante alemão, pai de uma filha autista e eu próprio com PHDA."
support.marcel_bio_1="As ferramentas tradicionais de gestão de projetos nunca resultaram comigo. Pareciam feitas por mentes neurotípicas para mentes neurotípicas. Quando trabalhava como freelancer e tinha dificuldade em manter organizados os projetos dos clientes, comecei a construir algo que funcionasse a favor do meu cérebro e não contra ele."
support.marcel_bio_2="O que começou como uma solução pessoal tornou-se o Leantime quando percebi que milhões de outras pessoas precisavam do mesmo."
support.gloria_name="👋 E eu sou a Gloria"
support.gloria_tagline="Ex-enfermeira de urgências que se tornou gestora de produto, empreendedora hispânica de primeira geração."
support.gloria_bio_1="Passei anos em ambientes médicos de grande pressão, onde a organização salva literalmente vidas. Mas quando criei o meu próprio negócio, as ferramentas de projeto tradicionais pareciam esmagadoras e desligadas da forma como realmente penso e trabalho."
support.gloria_bio_2="A minha formação em ciências comportamentais e investigação sobre motivação orienta a forma como construímos funcionalidades que não se limitam a organizar tarefas — ajudam-no a querer realmente concluí-las."
support.closing_text="Podemos criar um mundo em que ninguém tenha de lutar contra as suas ferramentas para fazer um ótimo trabalho. O seu patrocínio financia um futuro em que o software se adapta à diversidade humana, e não o contrário."
