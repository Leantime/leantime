text.helpful_resources="Aprender a usar cualquier software nuevo puede ser abrumador; nos esforzamos por hacer que Leantime sea lo más simple y directo posible.<br />Si en algún momento te sientes atascado o quieres intercambiar ideas, puedes usar los siguientes recursos para obtener ayuda:"

text.discordChat="Nuestro chat de Discord es probablemente la forma más rápida de obtener respuesta a cualquiera de tus preguntas. Nuestra comunidad es activa e increíblemente servicial."
