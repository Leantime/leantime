text.lean.helper_content="El Lean Canvas te guiará por todo el proceso de validación de tu nueva idea de negocio o de producto.<br/>Abordarás tu <em>Segmento de clientes</em>, <em>Problema, Solución</em>.<br/>A partir de ahí, pasarás a tu <em>Propuesta de valor única</em> (¿qué hace que tu idea sea mejor que otras ofertas?), tus <em>Canales de distribución</em> (¿cómo harás llegar tu solución a tus clientes?), tus <em>Fuentes de ingresos</em> (¿cómo generará dinero tu solución?), tu <em>Estructura de costos</em> (¿cuánto vale tu solución?), tus <em>Métricas clave</em> (¿cómo medirás el éxito?) y tu <em>Ventaja injusta</em> (¿qué tienes que te ayudará a triunfar frente a la competencia?)<br/>Responder estas preguntas está pensado para favorecer el éxito, reducir el riesgo de fracaso y permitirte hacer seguimiento y validar tus supuestos. Ser Lean consiste en eliminar el desperdicio y trabajar para crear productos, negocios y soluciones que tus clientes necesitan."
text.lean.disclaimer="Lean Canvas es una adaptación del <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> y está publicado bajo la licencia <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
