text.onboarding_default_project_details="¡Te damos la bienvenida a tu primer proyecto en Leantime!<br />Este es tu espacio para organizar tareas, dar seguimiento a objetivos y planificar tu trabajo. Puedes modificar lo que quieras aquí o crear más proyectos a medida que crezcas. Este proyecto es solo para que empieces"
