tour.my_work.welcome_title="Te damos la bienvenida al recorrido por el panel"
tour.my_work.welcome_text="Empecemos con algunos conceptos básicos para que te familiarices con la navegación y los distintos elementos de Leantime."
tour.my_work.work_modes_title="Modos de trabajo"
tour.my_work.work_modes_text="La navegación superior te muestra el “modo de trabajo” en el que estás. Puedes estar dentro de un proyecto, en tu área de trabajo personal o en el modo de empresa."
tour.my_work.left_nav_text="La navegación izquierda desglosa el modo de trabajo actual y te da acceso a distintas áreas. Todo lo que se muestra aquí forma parte del modo de trabajo seleccionado arriba."
tour.my_work.profile_bar_title="Mi barra de perfil"
tour.my_work.profile_bar_text="Aquí encontrarás enlaces a tu cuenta, además de las notificaciones y las últimas novedades sobre Leantime."
tour.my_work.widgets_title="Los widgets de tu panel"
tour.my_work.widgets_text="Tu panel está dividido en varios widgets que te muestran información específica sobre tu trabajo."
tour.my_work.customize_title="Personaliza tu panel"
tour.my_work.customize_text="Puedes cambiar el tamaño de los widgets y moverlos con la función de arrastrar y soltar."
tour.my_work.todos_title="Mis tareas"
tour.my_work.todos_text="El widget Mis tareas te muestra todas las tareas que tienes asignadas actualmente."
tour.my_work.group_todos_title="Agrupar tareas"
tour.my_work.group_todos_text="Puedes usar estos menús desplegables para filtrar tus tareas por proyecto o agruparlas por prioridad, estado, proyecto o fechas."
tour.my_work.sort_todos_title="Ordenar tareas"
tour.my_work.sort_todos_text="Puedes arrastrar y soltar cada tarea para cambiar su orden. También puedes arrastrar una tarea al calendario para programarla."
tour.my_work.timer_title="Inicia el temporizador"
tour.my_work.timer_text="Cuando quieras empezar a trabajar en una tarea, solo haz clic en el botón para iniciar el temporizador."
tour.my_work.complete_task_title="Completa una tarea"
tour.my_work.complete_task_text="Cuando termines una tarea, puedes marcarla como terminada haciendo clic en el menú desplegable de estado."
tour.my_work.add_tasks_title="Agrega más tareas"
tour.my_work.add_tasks_text="Puedes agregar más tareas haciendo clic en el botón + de cada sección o usando el menú de tres puntos junto a cada tarea."
tour.my_work.finish_text="Completaste el recorrido por el panel Mi trabajo. Ve a <a href='%s/dashboard/show'>tu proyecto</a> para aprender más sobre la gestión de proyectos en Leantime."
tour.project_dashboard.menu_title="Menú del proyecto"
tour.project_dashboard.menu_text="El menú del proyecto organiza tu proyecto en distintas secciones: <strong>Sala de datos</strong>, para alojar todos tus archivos e información; <strong>Pensar</strong>, para elaborar la estrategia, generar ideas y definir; y <strong>Hacer</strong>, para gestionar objetivos, hitos y tareas."
tour.project_dashboard.selector_title="Selector de proyectos"
tour.project_dashboard.selector_text="Usa el selector de proyectos para pasar de un proyecto a otro. El menú izquierdo muestra todo lo relacionado con tu proyecto actual."
tour.project_dashboard.checklist_title="Lista de verificación"
tour.project_dashboard.checklist_text="La lista de verificación del proyecto es una referencia rápida para comprobar si tu proyecto contiene toda la información necesaria para ejecutarse con éxito."
tour.project_dashboard.status_title="Actualizaciones rápidas de estado"
tour.project_dashboard.status_text="Puedes usar las actualizaciones de estado para compartir rápidamente con tu equipo el avance de tu proyecto con los colores rojo, amarillo y verde. El estado será visible en toda la aplicación."
tour.project_dashboard.progress_title="Progreso"
tour.project_dashboard.progress_text="El indicador de progreso del proyecto te muestra cuánto trabajo completaste. Tiene en cuenta los distintos tamaños de las tareas, la velocidad del equipo y los hitos del proyecto."
tour.project_dashboard.latest_tasks_title="Últimas tareas"
tour.project_dashboard.latest_tasks_text="La lista de últimas tareas te muestra las tareas agregadas más recientemente a tu proyecto y puede usarse como bandeja de entrada del proyecto."
tour.project_dashboard.team_title="Equipo"
tour.project_dashboard.team_text="El recuadro del equipo te muestra a los miembros de este proyecto."
tour.project_dashboard.finish_text="Completaste el recorrido por el panel del proyecto. Ve a <a href='%s/tickets/showKanban'>Tareas</a> para aprender más sobre las distintas formas de gestionar tus tareas en Leantime."
tour.kanban_board.overview_title="Tu tablero Kanban"
tour.kanban_board.overview_text="Este es tu tablero Kanban. Te ayuda a visualizar tu trabajo y a limitar el trabajo en curso."
tour.kanban_board.workflow_title="Flujo de trabajo"
tour.kanban_board.workflow_text="Las tareas se mueven de izquierda a derecha a medida que avanzan. Arrastra y suelta las tarjetas para actualizar su estado."
tour.kanban_board.columns_title="Columnas flexibles"
tour.kanban_board.columns_text="Con el menú de tres puntos puedes agregar, quitar y renombrar columnas."
tour.kanban_board.filter_title="Filtrar tareas"
tour.kanban_board.filter_text="Puedes filtrar tus tareas por varios campos, como prioridad, estado, proyecto o fechas."
tour.kanban_board.swimlanes_title="Carriles"
tour.kanban_board.swimlanes_text="Además, puedes agrupar tus tareas para crear carriles en el tablero Kanban. Esto te ayuda a visualizar tu trabajo por miembros del equipo, prioridad o hitos."
tour.kanban_board.sprints_text="Si gestionas tu trabajo en sprints, puedes usar este menú desplegable para seleccionar, crear y actualizar sprints."
tour.kanban_board.finish_text="Así termina el recorrido por Kanban. Ve a <a href='%s/tickets/roadmap'>Hitos</a> para aprender a crear y gestionar hitos en Leantime."
tour.milestones.overview_title="Hitos"
tour.milestones.overview_text="Los hitos te ayudan a dar seguimiento a los resultados principales y a las fases del proyecto."
tour.milestones.drag_title="Arrastrar y ordenar"
tour.milestones.drag_text="Cada barra representa un hito. Puedes arrastrarlas a lo largo del cronograma, reordenarlas y cambiarles el tamaño. Todo lo que hagas en esta pantalla actualiza las fechas de tus hitos."
tour.milestones.filter_title="Filtrar"
tour.milestones.filter_text="Puedes filtrar tus hitos y también ver las tareas que forman parte de ellos."
tour.milestones.timeframes_title="Períodos"
tour.milestones.timeframes_text="Puedes cambiar el período de la vista de cronograma para ver una mayor parte del año o profundizar en un desglose diario."
tour.milestones.finish_text="Así termina el recorrido por los hitos. Ve a <a href='%s/goalcanvas/dashboard'>Objetivos</a> para aprender a crear y gestionar objetivos en Leantime."
tour.goals.overview_title="Objetivos"
tour.goals.overview_text="Los objetivos te ayudan a dar seguimiento al impacto medible en tus proyectos."
tour.goals.parts_title="Propósitos y métricas"
tour.goals.parts_text="Cada objetivo se compone de un propósito (lo que quieres lograr) y una métrica (cómo lo vas a medir)."
tour.goals.progress_title="Progreso del objetivo"
tour.goals.progress_text="A medida que actualices las métricas de tus objetivos, la barra de progreso te mostrará cuánto llevas avanzado."
tour.goals.milestones_title="Hitos y objetivos"
tour.goals.milestones_text="Puedes conectar objetivos con hitos para dar seguimiento al progreso de tus objetivos a nivel de tareas. Esto ayuda a identificar vacíos en el plan de tu proyecto."
tour.goals.finish_text="Así termina el recorrido por los objetivos. Los hitos, los objetivos y las tareas son los componentes básicos de Leantime. Úsalos para dividir tu trabajo en partes manejables. Ve al <a href='%s/tickets/showKanban'>tablero Kanban</a> para revisar tus tareas."
