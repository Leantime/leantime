label.onboarding_task_community_chat="Únete a nuestro chat de la comunidad"
text.onboarding_task_community_chat="Nuestro chat de la comunidad es un gran recurso para hacer preguntas y recibir comentarios sobre la configuración de tus proyectos. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat de la comunidad</a>"
label.onboarding_task_invite_team="Invita a tus compañeros de equipo"
text.onboarding_task_invite_team="Ya sea que trabajes con alguien o solo necesites a alguien que te ayude a cumplir tus compromisos, usar Leantime en grupo ayuda a mantener el rumbo y la motivación <a href='%s'>Gestión de usuarios</a>"
label.onboarding_task_project_structure="Aprende más sobre la estructura de proyectos de Leantime"
text.onboarding_task_project_structure="Tenemos muchos recursos adicionales en nuestra documentación de ayuda. Para aprender más sobre la estructura de proyectos en Leantime y las mejores prácticas, visita: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Crea un objetivo"
text.onboarding_task_create_goal="Los objetivos sirven para dar seguimiento a propósitos de largo plazo y medirlos. Deben poder medirse con métricas que puedas actualizar con regularidad. Puedes conectar objetivos e hitos para ver el progreso de la ejecución junto con el progreso de las métricas <a href='%s'>Objetivos del proyecto</a>"
label.onboarding_task_create_milestone="Crea un hito"
text.onboarding_task_create_milestone="Los hitos te permiten dividir las fases de tus proyectos en resultados concretos. Cada hito tiene una fecha de inicio y una de finalización, y debe producir algún entregable <a href='%s'>Hitos del proyecto</a>"
label.onboarding_task_personal_project="Explora tu proyecto personal"
text.onboarding_task_personal_project="Tu proyecto personal es un espacio donde puedes organizar tus tareas, objetivos y trabajo. Puedes acceder a él desde el selector de proyectos de la parte superior o haciendo clic en este enlace: <a href='%s'>Mi proyecto</a>"
label.onboarding_task_complete_profile="Completar mi perfil de Leantime"
text.onboarding_task_complete_profile="Actualizar mi foto de perfil y completar mis preferencias de trabajo para personalizar mi experiencia. <a href='%s'>Mi perfil</a>"
