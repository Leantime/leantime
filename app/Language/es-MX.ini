text.my_work_dashboard_intro="Tu panel Mi trabajo pone en foco todo lo que importa.<br/>Tu trabajo más importante ahora está en primer plano, organizado solo para ti y para la forma en que mejor funciona tu cerebro.<br/><br/>Desde tareas rápidas hasta objetivos ambiciosos, todo lo que necesitas está aquí. Este es tu espacio para capturar ideas, dar seguimiento a tu progreso y celebrar los logros en el camino."
text.blueprints_intro="Los modelos son tu oportunidad de darle sentido a todos los datos. Leantime ofrece diversas herramientas y lienzos para definir el contexto de tu proyecto mediante lienzos de modelo de negocio, análisis FODA o mapas de empatía.<br/><br/>Si no sabes por dónde empezar, te recomendamos crear un “lienzo de valor del proyecto”. Este lienzo responderá las preguntas más importantes de tu proyecto: ¿Quién es tu cliente?<br/>¿Qué problema estás resolviendo?<br/>¿Cuál es tu solución?<br/>¿Qué ventaja ofrece tu solución frente a la competencia?<br/>"
text.goals_tour_intro="Los objetivos te permiten dividir tu proyecto en partes alcanzables, medibles y accionables.<br/>Mientras que los hitos se centran en la ejecución, los objetivos tratan sobre las métricas que quieres alcanzar.<br/>Cada objetivo debe tener un propósito claro (lo que quieres lograr) y debe poder medirse fácilmente con una sola métrica.<br/><br/>Cuando tengas un objetivo, puedes asignarle hitos para dividirlo en tareas ejecutables.<br/>"
text.project_dashboard_tour_intro="Los proyectos de Leantime son espacios de trabajo colaborativos donde tú y tu equipo organizan, dan seguimiento y entregan el trabajo de forma eficiente. Cada proyecto sirve como contenedor de objetivos, tareas e hitos relacionados, y te permite supervisar el progreso desde un único lugar.<br/><br/>Ya sea que gestiones trabajo, estudios o iniciativas personales, los proyectos de Leantime te dan la estructura y las herramientas necesarias para convertir las ideas en resultados exitosos."
text.wiki_tour_intro="Nuestros documentos te permiten escribir y compartir documentación con tu equipo. Puedes crear varios espacios para organizar tu documentación por equipos, áreas o categorías.<br/>Crea documentos para compartir conocimientos, procesos y procedimientos. También puedes crear un documento para compartir un enlace a un archivo o a una carpeta de tu almacenamiento en la nube.<br/>"
text.extend_leantime_latest_plugins="Amplía Leantime con nuestros plugins más recientes."
support.headline_help_us_build="¡Ayúdanos a construir un futuro en el que todas las mentes prosperen!"
support.intro_text_1="La mayoría de las herramientas de productividad dan por hecho que todo el mundo piensa igual: de forma lineal, con una concentración perfecta y motivado por plazos arbitrarios. Ya sea que tengas TDAH y necesites la dopamina de completar tareas, seas autista y necesites una estructura constante, tengas dislexia y pienses de forma espacial, o simplemente estés harto de herramientas que no encajan con cómo funciona realmente tu cerebro, probablemente ya renunciaste por completo a la gestión de proyectos."
support.intro_text_2="Estamos creando Leantime para mentes que funcionan de otra manera. Eso incluye a los cerebros neurodivergentes, pero también a cualquiera que alguna vez haya sentido que las herramientas existentes van en contra de su forma natural de pensar."
