text.timer_on_todo="<span class='head-icon fa fa-stop'></span> %1$s Temporizador en %2$s"
text.these_are_system_wide_settings="Esta configuración se aplica a todo el sistema y afecta la apariencia de tu experiencia en Leantime."
text.company_name_helper="Aparece en el título de la página y en los correos electrónicos"
text.advanced_boards_helper_content="Las ideas evolucionan, crecen y maduran. Este es el lugar para hacerles seguimiento.<br/>Mueve las tarjetas de ideas de una columna a la siguiente para reflejar su estado actual.<br/>Es un buen lugar para empezar a investigar, desarrollar prototipos y validarlos con algunos clientes antes de empezar a implementarlos."
text.backlog_helper_content="El backlog es el lugar donde viven todas tus tareas: las que tienes en curso y las que planeas hacer.<br/><br/>Para avanzar en tu backlog, te recomendamos trabajar en iteraciones cortas: los sprints.<br/>Los sprints son intervalos de dos semanas que te permiten enfocarte en partes de trabajo más pequeñas y entregables.<br/>Al final de las dos semanas deberías tener algo para hacer una “demo”. Algo que aporte valor a tus usuarios o clientes.<br/><br/>En esta pantalla podrás organizar y gestionar tu lista de tareas, priorizar tu backlog arrastrando y soltando, y mover elementos del backlog a tu sprint actual.<br/>¿Quieres más información? ¡Inicia el recorrido o cierra esta ventana para empezar!"
text.glad_youre_here="Nos alegra que estés aquí. Tomemos un minuto para conocernos."
text.business_research_section="Nuestra sección de Investigación de negocio es el nuevo hogar de tus ideas. Está diseñada para guiarte por los pasos del desarrollo de clientes, la investigación de problemas y la ideación de soluciones."
text.our_roadmap_design="Nuestra hoja de ruta está diseñada para llevarte de hitos pequeños y manejables a la realización de la visión general. Planifica hitos de unos 3 meses y usa estos marcadores del proyecto para mantener el rumbo."
text.this_is_where_you_spend_most_time="Aquí es donde pasarás la mayor parte de tu tiempo: haciendo. Planifica tus sprints de 2 semanas y ejecútalos con éxito con el tablero Kanban y nuestras herramientas de backlog. Usa las retrospectivas para mejorar en el siguiente sprint."
text.idea_board_helper_content="Este es el lugar para reunir todas tus ideas. Conversa sobre las nuevas con tu equipo y vincula hitos para ver el progreso de tus ideas."
text.kanban_helper_content="Kanban es la palabra japonesa para “tarjeta”. Los tableros Kanban surgieron con los ingenieros de Toyota en los años 40, junto con la manufactura lean.<br/>Se usan para compartir de forma visual y rápida la información y el progreso del trabajo.<br/>Los tableros Kanban son útiles para visualizar el trabajo y su estado, gestionar el trabajo activo o en curso, gestionar el flujo de trabajo y actuar rápidamente hacia mejoras lean."
text.my_timesheets_helper_content="Los registros de horas son el lugar para registrar las horas reales trabajadas en una tarea.<br/>Esto es útil para la facturación, pero también para validar qué tan bien planificas tus tareas por adelantado.<br/>Con el tiempo, Leantime puede ajustar las fechas de vencimiento para compensar las diferencias de planificación."
text.new_project_helper_content="<p>Este es el lugar donde describirás, definirás y establecerás los parámetros de tu proyecto. Es importante porque es lo que comunica a<br/>todo el equipo cuáles son las prioridades, las expectativas y las pautas del proyecto.</p><p><br/><em>Algo en qué pensar aquí: las 4 C.<br/>Sé claro, conciso, completo y creíble.<br/><br/></em></p><p>Aplicar bien estos puntos en las descripciones de tus proyectos mantiene a todos en sintonía y ayuda a minimizar el riesgo de errores o pasos en falso.</p><br/>¡Es hora de empezar!<br/><br/>"
text.not_found_helper_content="<p>Todavía no tenemos contenido para esta página.<br/>Usa nuestro enlace “¿Necesitas ayuda?” en la parte inferior para obtener más información sobre lo que puedes hacer aquí.</p>"
text.retros_helper_content="<p>Las retrospectivas son reflexiones rápidas sobre el trabajo, el funcionamiento del equipo y, por supuesto, el progreso.<br/>Aquí es donde tu equipo puede tomarse un momento para concentrarse en lo que salió bien, lo que no salió bien y lo que se podría hacer distinto la próxima vez.<br/>Te recomendamos hacer una reunión de revisión a intervalos regulares o, como mínimo, al final de cada hito.<br/></p>"
text.roadmap_helper_content="<p>Las hojas de ruta son útiles para dividir proyectos grandes en partes más pequeñas y manejables.<br/><br/></p><p>Para crear tu hoja de ruta, te recomendamos definir hitos que se puedan alcanzar en un plazo de 3 meses.</p><p>Los hitos son puntos de control en el camino hacia la finalización del proyecto.<br/>Dicho de forma sencilla: si haces un viaje por carretera a través del país, cada estado por el que pasas podría ser un hito.<br/><br/>Haz clic en “Agregar hito” en la parte superior izquierda para empezar. Define la fecha en esta pestaña o directamente en el gráfico de la hoja de ruta, haciendo clic y arrastrando el hito dentro del calendario.</p>"
text.show_clients_helper_content="<p>Los clientes/productos organizan tus proyectos en categorías y te permiten aislar distintos grupos.<br/><br/></p><p>Si eres consultor, ya trabajas con clientes y este sería el lugar para organizarlos.</p><p>Si eres parte de un equipo de producto, puedes usar esta sección para organizar y aislar tus departamentos (marketing, ventas, operaciones, etc.).</p>"
text.show_projects_helper_content="<p>¡Los proyectos son el corazón de tu negocio y de Leantime! Los cambios, el desarrollo, los objetivos y todo lo que puedas construir o soñar implicará proyectos.<br/>La gestión de proyectos es simplemente el proceso de asegurar que tus proyectos se entreguen a tiempo, correctamente y con valor real para el negocio.<br/><br/>Aquí es donde vivirán tus proyectos. La página de proyectos te permitirá crear un proyecto y ver rápidamente la cantidad de tareas, las horas, el presupuesto y el cliente asociado al proyecto.<br/><br/>Usa esta página para obtener un resumen rápido de todos tus proyectos.<br/><br/></p>"
text.new_db_version="Se instaló una nueva versión. Para usar Leantime, necesitas actualizar tu base de datos.<br/><br/><strong>¡Asegúrate de hacer una copia de seguridad de tu base de datos antes de realizar esta actualización!</strong><br/>Esto puede tardar unos minutos."
