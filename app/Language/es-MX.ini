text.zulip_instructions="Esta integración publicará notificaciones de actualizaciones en el stream y el tema que elijas.<br/>Sigue las instrucciones <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>aquí para crear un nuevo bot</a>. Luego pega la información en el formulario de la derecha y haz clic en Guardar."
text.discord_instructions="Esta integración publicará notificaciones de actualizaciones en el canal que elijas.<br/>Sigue las instrucciones <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>aquí para crear uno o varios webhooks</a>, luego pega los enlaces en los campos de la derecha y haz clic en Guardar."
