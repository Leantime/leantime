text.full_lean_canvas_helper_content="完全版のリサーチ掲示板では、アイデア検証のプロセス全体をガイドします。<br/>このページでは、顧客セグメント、課題、解決策にもう一度取り組みます（シンプル版の掲示板ですでに入力している場合は、ここにも表示されるのでご安心ください）。<br/>そこから、明確な価値提案（あなたのアイデアは他の提案より何が優れているのか？）、<br/>販売チャネル（顧客はどのようにして解決策を手に入れるのか？）<br/>収益の流れ（解決策はどのように収益を生むのか？）<br/>コスト構造（解決策にはどれだけの価値があるのか？）、主要指標（成功をどのように測るのか？）<br/>そして圧倒的な優位性（競合に対して際立つ要因は何か？）へと進みます。<br/>これらの質問に答えることで、成功を後押しし、失敗を減らし、仮説を追跡・検証できるように設計されています。<br/>リーンとは、無駄を省き、顧客が本当に必要とする製品、店舗、解決策を作ることです。"
