label.onboarding_default_project_name="マイプロジェクト"
text.onboarding_default_project_details="Leantimeでの最初のプロジェクトへようこそ！<br />ここは、タスクを整理し、目標を追跡し、作業を計画するためのスペースです。ここにあるものは自由に変更でき、必要に応じてプロジェクトを追加することもできます。このプロジェクトは、使い始めるためのあなた専用のプロジェクトです"
label.onboarding_milestone_getting_started="はじめに"
label.onboarding_task_community_chat="コミュニティチャットに参加する"
text.onboarding_task_community_chat="コミュニティチャットは、質問したり、プロジェクトの設定についてフィードバックをもらったりするのに最適な場所です。<a href='https://discord.gg/4zMzJtAq9z' target='_blank'>コミュニティチャット</a>"
label.onboarding_task_invite_team="チームメイトを招待する"
text.onboarding_task_invite_team="誰かと一緒に作業している場合も、励まし合える仲間が欲しいだけの場合も、Leantimeをグループで使うと、計画どおりに進めやすく、モチベーションも維持できます <a href='%s'>ユーザー管理</a>"
label.onboarding_task_project_structure="Leantimeのプロジェクト構成について詳しく知る"
text.onboarding_task_project_structure="ヘルプドキュメントには、多くの追加リソースがあります。Leantimeのプロジェクト構成やベストプラクティスについて詳しくは、こちらをご覧ください: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="目標を作成する"
text.onboarding_task_create_goal="目標は、長期的な目的を追跡・測定するために使います。定期的に更新できる指標で測定できるようにしましょう。目標とマイルストーンを関連付けると、指標の進捗と合わせて実行の進捗も確認できます <a href='%s'>プロジェクトの目標</a>"
label.onboarding_task_create_milestone="マイルストーンを作成する"
text.onboarding_task_create_milestone="マイルストーンを使うと、プロジェクトのフェーズを個別の成果に分類できます。各マイルストーンには開始日と終了日があり、何らかの成果物を生み出す必要があります <a href='%s'>プロジェクトのマイルストーン</a>"
label.onboarding_task_personal_project="個人プロジェクトを見てみる"
text.onboarding_task_personal_project="個人プロジェクトは、タスク、目標、作業を整理できるスペースです。上部のプロジェクトセレクタから、またはこちらのリンクをクリックしてアクセスできます: <a href='%s'>マイプロジェクト</a>"
label.onboarding_task_complete_profile="Leantimeのプロフィールを完成させる"
text.onboarding_task_complete_profile="プロフィール画像を更新し、作業の設定を完了して、自分に合った使い心地にしましょう。<a href='%s'>自分のプロフィール</a>"
