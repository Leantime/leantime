text.my_work_dashboard_intro="マイワークダッシュボードは、大切なことすべてに焦点を合わせます。<br/>最も重要な作業が、あなたのために、あなたの頭が最も働きやすい形で整理され、中心に表示されるようになりました。<br/><br/>ちょっとしたタスクから大きな目標まで、必要なものはすべてここにあります。アイデアを書き留め、進捗を追跡し、達成を祝う — そのためのあなたのスペースです。"
text.blueprints_intro="ブループリントは、あらゆるデータを整理して理解するためのものです。Leantimeには、ビジネスモデルキャンバス、SWOT分析、共感マップなど、プロジェクトの背景を定義するためのさまざまなツールとキャンバスが用意されています。<br/><br/>どこから始めればよいか分からない場合は、「Project Value Canvas」の作成をおすすめします。このキャンバスは、プロジェクトの最も重要な問いに答えます: 顧客は誰か？<br/>どんな課題を解決するのか？<br/>解決策は何か？<br/>その解決策は競合と比べてどんな利点があるのか？<br/>"
text.goals_tour_intro="目標を使うと、プロジェクトを達成可能で、測定可能で、実行可能な単位に分解できます。<br/>マイルストーンが実行に焦点を当てるのに対し、目標は達成したい指標に焦点を当てます。<br/>各目標には明確な目的（達成したいこと）を設定し、1つの指標で簡単に測定できるようにしましょう。<br/><br/>目標を作成したら、マイルストーンを割り当てて、実行可能なタスクに分解できます。<br/>"
text.project_dashboard_tour_intro="Leantimeのプロジェクトは、あなたとチームが作業を効率的に整理、追跡、遂行するための共同ワークスペースです。各プロジェクトは関連する目標、タスク、マイルストーンをまとめるコンテナとして機能し、進捗を一か所で確認できます。<br/><br/>仕事、学校、個人的な取り組みのいずれを管理する場合でも、Leantimeのプロジェクトは、アイデアを成功につなげるための構造とツールを提供します。"
text.wiki_tour_intro="ドキュメントを使うと、チームでドキュメントを作成・共有できます。複数のスペースを作成して、チーム、領域、ドキュメントのカテゴリごとに整理できます。<br/>ドキュメントを作成して、知識、プロセス、手順を共有しましょう。クラウドストレージ上のファイルやフォルダへのリンクを共有するドキュメントを作成することもできます。<br/>"
text.extend_leantime_latest_plugins="最新のプラグインでLeantimeを拡張しましょう。"
support.headline_help_us_build="すべての人の頭脳が活躍できる未来を、一緒に築きましょう！"
support.intro_text_1="ほとんどの生産性ツールは、誰もが同じように考えることを前提にしています: 直線的に、完璧な集中力で、恣意的な締め切りを動機として。タスクの完了でドーパミンを得る必要があるADHDの方も、一貫した構造を求める自閉スペクトラムの方も、空間的に考えるディスレクシアの方も、あるいは自分の頭の働き方に合わないツールに疲れただけの方も — プロジェクト管理そのものを諦めてしまったかもしれません。"
support.intro_text_2="私たちは、異なる考え方をする人のためにLeantimeを作っています。ニューロダイバージェントの方はもちろん、既存のツールが自然な思考パターンに逆らっていると感じたことのあるすべての人のためです。"
