text.mattermost_instructions=" この統合により、選択したチャンネルに更新通知が投稿されます。<br/>Mattermostから<a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>Incoming Webhook URLを取得するためにここをクリック</a>。次に、右のフォームにリンクを貼り付けて保存をクリックしてください。"
text.slack_instructions="この統合により、選択したチャンネルに更新通知が投稿されます。<br/>Slackから<a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>Incoming Webhook URLを取得するためにここをクリック</a>。次に、右のフォームにリンクを貼り付けて保存をクリックしてください。"
