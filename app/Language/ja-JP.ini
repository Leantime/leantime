support.marcel_name="👋 Marcelです"
support.marcel_tagline="ドイツからの移民で、自閉スペクトラムの娘の父親。私自身もADHDと共に生きています。"
support.marcel_bio_1="従来のプロジェクト管理ツールは、私にはまったくしっくりきませんでした。定型発達の人が、定型発達の人のために作ったもののように感じられたのです。フリーランスとしてクライアントのプロジェクトを整理するのに苦労していたとき、自分の頭に逆らうのではなく、頭に合わせて動く何かを作り始めました。"
support.marcel_bio_2="個人的な解決策として始まったものが、何百万人もの人が同じものを必要としていると気づいたときにLeantimeになりました。"
support.gloria_name="👋 そしてGloriaです"
support.gloria_tagline="元救急看護師からプロダクトマネージャーに転身した、ヒスパニック系移民一世の起業家です。"
support.gloria_bio_1="私は長年、整理整頓が文字どおり命を救う、プレッシャーの大きい医療現場で働いてきました。しかし自分のビジネスを始めたとき、従来のプロジェクトツールは圧倒的で、自分の実際の考え方や働き方とかけ離れていると感じました。"
support.gloria_bio_2="行動科学とモチベーション研究のバックグラウンドを活かし、単にタスクを整理するだけでなく、本当に完了したいと思えるような機能づくりを進めています。"
support.closing_text="素晴らしい仕事をするために、誰もツールと戦わなくてよい世界をつくることができます。あなたのスポンサーシップは、人がソフトウェアに合わせるのではなく、ソフトウェアが人の多様性に合わせる未来を支えます。"
support.headline_ready_to_impact="直接、変化を生み出しませんか？"
support.contribution_text="$1から$100まで、すべての支援がLeantimeをすべての人にとってより良いものにするために直接使われます。"
