text.zulip_instructions="この統合により、お好みのストリームや掲示板に更新通知を投稿することができます。<br/>指示に従って <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>ここから新しいボットを作成してください</a>。次に、右のフォームにリンクを貼り付けて保存をクリックしてください。"
text.discord_instructions="This integration will post update notifications to the channel of your choice.<br/>Follow the instructions <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>here to create a new webhook(s)</a>, then paste the link(s) into the fields to the right and click Save."
