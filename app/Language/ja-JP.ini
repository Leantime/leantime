tour.my_work.welcome_title="ダッシュボードツアーへようこそ"
tour.my_work.welcome_text="Leantimeのナビゲーションやさまざまな要素をすぐに把握できるよう、まずはいくつかの基本から始めましょう。"
tour.my_work.work_modes_title="作業モード"
tour.my_work.work_modes_text="上部のナビゲーションには、現在の「作業モード」が表示されます。プロジェクト内、個人の作業エリア、または会社モードのいずれかで作業できます。"
tour.my_work.left_nav_text="左のナビゲーションには現在の作業モードの内容が整理されており、さまざまなエリアにアクセスできます。ここに表示されるものはすべて、上で選択されている作業モードに属します。"
tour.my_work.profile_bar_title="プロフィールバー"
tour.my_work.profile_bar_text="ここには、アカウントへのリンクのほか、通知やLeantimeの最新情報があります。"
tour.my_work.widgets_title="ダッシュボードのウィジェット"
tour.my_work.widgets_text="ダッシュボードはさまざまなウィジェットで構成されており、作業に関する情報を的を絞って表示します。"
tour.my_work.customize_title="ダッシュボードをカスタマイズ"
tour.my_work.customize_text="ウィジェットは、ドラッグ＆ドロップでサイズを変更したり移動したりできます。"
tour.my_work.todos_title="自分のタスク"
tour.my_work.todos_text="「自分のタスク」ウィジェットには、現在あなたに割り当てられているすべてのタスクが表示されます。"
tour.my_work.group_todos_title="タスクのグループ化"
tour.my_work.group_todos_text="ここのドロップダウンを使って、タスクをプロジェクトで絞り込んだり、優先度、ステータス、プロジェクト、日付でグループ化したりできます。"
tour.my_work.sort_todos_title="タスクの並べ替え"
tour.my_work.sort_todos_text="各タスクはドラッグ＆ドロップで順序を変更できます。タスクをカレンダーにドラッグ＆ドロップして予定を立てることもできます。"
tour.my_work.timer_title="タイマーを開始"
tour.my_work.timer_text="タスクに取りかかる準備ができたら、タイマー開始ボタンをクリックするだけです。"
tour.my_work.complete_task_title="タスクを完了する"
tour.my_work.complete_task_text="タスクが終わったら、ステータスのドロップダウンをクリックして完了にできます。"
tour.my_work.add_tasks_title="タスクを追加する"
tour.my_work.add_tasks_text="各セクションのプラスボタンをクリックするか、各タスクの横にある三点メニューを使って、タスクを追加できます。"
tour.my_work.finish_text="マイワークダッシュボードのツアーが完了しました。<a href='%s/dashboard/show'>プロジェクト</a>に移動して、Leantimeでのプロジェクト管理について詳しく学びましょう。"
tour.project_dashboard.menu_title="プロジェクトメニュー"
tour.project_dashboard.menu_text="プロジェクトメニューでは、プロジェクトがいくつかのセクションに整理されています。<strong>データルーム</strong>（すべてのファイルと情報を保管）、<strong>構想</strong>（戦略立案、アイデア出し、定義）、<strong>実行</strong>（目標、マイルストーン、タスクの管理）です。"
tour.project_dashboard.selector_title="プロジェクトセレクタ"
tour.project_dashboard.selector_text="プロジェクトセレクタを使って、プロジェクト間を移動できます。左のメニューには、現在のプロジェクトに関連するすべてが表示されます。"
tour.project_dashboard.checklist_title="チェックリスト"
tour.project_dashboard.checklist_text="プロジェクトチェックリストでは、プロジェクトを成功させるために必要な情報がすべて揃っているかをすばやく確認できます。"
tour.project_dashboard.status_title="クイックステータス更新"
tour.project_dashboard.status_text="ステータス更新を使うと、赤・黄・緑の色でプロジェクトの進捗をチームとすばやく共有できます。ステータスはアプリケーション全体に表示されます。"
tour.project_dashboard.progress_title="進捗状況"
tour.project_dashboard.progress_text="プロジェクトの進捗インジケーターには、完了した作業量が表示されます。さまざまなタスクの規模、チームのベロシティ、プロジェクトのマイルストーンが考慮されます。"
tour.project_dashboard.latest_tasks_title="最新のタスク"
tour.project_dashboard.latest_tasks_text="最新のタスク一覧には、プロジェクトに最近追加されたタスクが表示され、プロジェクトの受信箱として使うことができます。"
tour.project_dashboard.team_title="チーム"
tour.project_dashboard.team_text="チーム欄には、このプロジェクトのメンバーが表示されます。"
tour.project_dashboard.finish_text="プロジェクトダッシュボードのツアーが完了しました。<a href='%s/tickets/showKanban'>タスク</a>に移動して、Leantimeでのさまざまなタスク管理の方法について学びましょう。"
tour.kanban_board.overview_title="カンバンボード"
tour.kanban_board.overview_text="これはカンバンボードです。作業を可視化し、進行中の作業量を制限するのに役立ちます。"
tour.kanban_board.workflow_title="ワークフロー"
tour.kanban_board.workflow_text="タスクは進捗に応じて左から右へ移動します。カードをドラッグ＆ドロップしてステータスを更新します。"
tour.kanban_board.columns_title="柔軟な列"
tour.kanban_board.columns_text="三点メニューを使って、列の追加、削除、名前の変更ができます。"
tour.kanban_board.filter_title="タスクの絞り込み"
tour.kanban_board.filter_text="優先度、ステータス、プロジェクト、日付など、さまざまな項目でタスクを絞り込めます。"
tour.kanban_board.swimlanes_title="スイムレーン"
tour.kanban_board.swimlanes_text="さらに、タスクをグループ化してカンバンのスイムレーンを作成できます。チームメンバー、優先度、マイルストーンごとに作業を可視化するのに役立ちます。"
tour.kanban_board.sprints_title="スプリント"
tour.kanban_board.sprints_text="スプリントで作業を管理している場合は、ここのドロップダウンでスプリントの選択、作成、更新ができます。"
tour.kanban_board.finish_text="カンバンのツアーはこれで終了です。<a href='%s/tickets/roadmap'>マイルストーン</a>に移動して、Leantimeでのマイルストーンの作成と管理について学びましょう。"
tour.milestones.overview_title="マイルストーン"
tour.milestones.overview_text="マイルストーンは、主要な成果やプロジェクトのフェーズを追跡するのに役立ちます。"
tour.milestones.drag_title="ドラッグ＆並べ替え"
tour.milestones.drag_text="各バーは1つのマイルストーンを表します。タイムライン上でドラッグしたり、並べ替えたり、サイズを変更したりできます。この画面での操作はすべて、マイルストーンの日程に反映されます。"
tour.milestones.filter_title="絞り込み"
tour.milestones.filter_text="マイルストーンを絞り込んだり、マイルストーンに含まれるタスクを表示したりできます。"
tour.milestones.timeframes_title="時間枠"
tour.milestones.timeframes_text="タイムライン表示の時間枠を変更して、1年のより長い期間を表示したり、日単位の詳細まで掘り下げたりできます。"
tour.milestones.finish_text="マイルストーンのツアーはこれで終了です。<a href='%s/goalcanvas/dashboard'>目標</a>に移動して、Leantimeでの目標の作成と管理について学びましょう。"
tour.goals.overview_title="目標"
tour.goals.overview_text="目標は、プロジェクトにおける測定可能な成果を追跡するのに役立ちます。"
tour.goals.parts_title="目的と指標"
tour.goals.parts_text="各目標は、目的（達成しようとしていること）と指標（それをどのように測定するか）で構成されます。"
tour.goals.progress_title="目標の進捗"
tour.goals.progress_text="目標の指標を更新すると、進捗バーにどこまで進んでいるかが表示されます。"
tour.goals.milestones_title="マイルストーンと目標"
tour.goals.milestones_text="目標をマイルストーンに関連付けると、目標の進捗をタスク単位で追跡できます。プロジェクト計画の抜けや漏れを見つけるのに役立ちます。"
tour.goals.finish_text="目標のツアーはこれで終了です。マイルストーン、目標、タスクは、Leantimeの基本的な構成要素です。これらを使って、作業を管理しやすい単位に分割しましょう。<a href='%s/tickets/showKanban'>カンバンボード</a>に移動して、タスクを確認しましょう。"
