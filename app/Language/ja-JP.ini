text.lean.helper_content="リーンキャンバスは、新しいビジネスや製品のアイデアを検証するプロセス全体をガイドします。<br/><em>顧客セグメント</em>、<em>課題、解決策</em>に取り組みます。<br/>そこから、<em>独自の価値提案</em>（あなたのアイデアは他の提案より何が優れているのか？）、<em>流通チャネル</em>（どのように解決策を顧客に届けるのか？）、<em>収益の流れ</em>（解決策はどのように収益を生むのか？）、<em>コスト構造</em>（解決策にはどれだけの価値があるのか？）、<em>主要指標</em>（成功をどのように測るのか？）、<em>圧倒的な優位性</em>（競合に勝つために何を持っているのか？）へと進みます。<br/>これらの質問に答えることで、成功を後押しし、失敗を減らし、仮説を追跡・検証できるように設計されています。リーンであるとは、無駄を省き、顧客が本当に必要とする製品、ビジネス、解決策を作ることです。"
text.lean.disclaimer="リーンキャンバスは<a href='https://strategyzer.com/' target='_blank'>ビジネスモデルキャンバス</a>を応用したもので、<a href='https://creativecommons.org/licenses/by-sa/3.0/'>クリエイティブ・コモンズ 表示 - 継承 3.0</a>ライセンスの下で提供されています"
