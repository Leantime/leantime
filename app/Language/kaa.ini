text.twoFA_already_enabled="Akkauntıńız ushın eki faktorlı autentifikaciya qosılıp qoyılǵan hám kiriw ushın talap etiledi.<br/><br/>Eki faktorlı autentifikaciyanı alıp taslaw ushın tómendegi «Alıp taslaw» túymesin basıń"
text.twoFA_enabled="Akkauntıńızda eki faktorlı autentifikaciya <strong>qosılǵan</strong>."
