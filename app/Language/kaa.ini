support.marcel_name="👋 Men Marcel"
support.marcel_tagline="Germaniyadan kelgen immigrant, autizmli qızdıń ákesi hám ózim de ADHD menen jasayman."
support.marcel_bio_1="Dástúriy joba basqarıw quralları maǵan hesh qashan unamadı. Olar neyrotipik aqıl-oylar tárepinen neyrotipik aqıl-oylar ushın jaratılǵanday sezilerdi. Men frilanser bolıp islep, klient jobaların tártipte saqlawda qıynalǵan waqıtta, miyime qarsı emes, al onıń menen birge isleytuǵın bir nárse jaratıwdı basladım."
support.marcel_bio_2="Jeke sheshim retinde baslanǵan nárse, millionlaǵan basqa adamlarǵa da usınday nárse kerek ekenin túsingenimde, Leantime bolıp qáliplesti."
support.gloria_name="👋 Al men Gloria"
support.gloria_tagline="Burınǵı tez járdem bólimi medbiykesi, keyin ónim menedjeri, birinshi áwlad ispan tekli isbilermen."
support.gloria_bio_1="Men kóp jıllar boyı shólkemlesiw sózbe-sóz ómirlerdi saqlap qalatuǵın joqarı basımlı medicinalıq ortalıqlarda isledim. Biraq óz biznesimdi baslaǵanımda, dástúriy joba quralları shamadan tıs quramalı hám meniń haqıyqatında qalay oylaytuǵınım hám isleytuǵınımnan alıs bolıp sezildi."
support.gloria_bio_2="Minez-qulıq ilimi hám motivaciya izertlewlerindegi tájiriybem, tek wazıypalardı shólkemlestirip qoymay, olardı haqıyqatında tamamlawdı qálewińizge járdem beretuǵın múmkinshiliklerdi qalay jaratatuǵınımızdı anıqlaydı."
support.closing_text="Biz hesh kim ullı jumıs islew ushın óz quralları menen gúresiwi shárt bolmaǵan dúnya jarata alamız. Sizdiń demewshiligińiz programmalıq támiynat adamzattıń túrliligine beyimlesetuǵın — kerisinshe emes — keleshekti qarjılandıradı."
