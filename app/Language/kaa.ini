tour.my_work.welcome_title="Basqarıw paneli boyınsha tanıstırıwǵa xosh kelipsiz"
tour.my_work.welcome_text="Leantime ishindegi navigaciya hám hár qıylı elementler menen tez tanısıp alıwıńız ushın bir neshe tiykarǵı nárseden baslayıq."
tour.my_work.work_modes_title="Jumıs rejimleri"
tour.my_work.work_modes_text="Joqarǵı navigaciya siz házir turǵan «jumıs rejimin» kórsetedi. Siz joba ishinde, jeke jumıs aymaǵıńızda yamasa kompaniya rejiminde bolıwıńız múmkin."
tour.my_work.left_nav_text="Shep navigaciya ámeldegi jumıs rejimin bólimlerge bóledi hám hár qıylı aymaqlarǵa kiriwge múmkinshilik beredi. Bul jerde kórsetilgen hámme nárse joqarıda tańlanǵan jumıs rejiminiń bólegi bolıp tabıladı."
tour.my_work.profile_bar_title="Meniń profil panelim"
tour.my_work.profile_bar_text="Bul jerden akkauntıńızǵa siltemelerdi, sonday-aq xabarlandırıwlar menen Leantime haqqındaǵı sońǵı jańalıqlardı tabasız."
tour.my_work.widgets_title="Basqarıw panelińizdiń vidjetleri"
tour.my_work.widgets_text="Basqarıw panelińiz jumısıńız haqqında anıq maǵlıwmat kórsetetuǵın hár qıylı vidjetlerge bólingen."
tour.my_work.customize_title="Basqarıw panelin sazlaw"
tour.my_work.customize_text="Vidjetlerdiń ólshemin ózgertiwge hám olardı súyrep aparıw arqalı basqa orınǵa jılıstırıwǵa boladı."
tour.my_work.todos_title="Meniń wazıypalarım"
tour.my_work.todos_text="«Meniń wazıypalarım» vidjeti házir sizge tayınlanǵan barlıq wazıypalardı kórsetedi."
tour.my_work.group_todos_title="Wazıypalardı toparlaw"
tour.my_work.group_todos_text="Bul jerdegi ashılmalı dizimler arqalı wazıypalarıńızdı joba boyınsha filtrlewińizge yamasa olardı ústinlik, status, joba yamasa sáneler boyınsha toparlawıńızǵa boladı."
tour.my_work.sort_todos_title="Wazıypalardı saralaw"
tour.my_work.sort_todos_text="Hár bir wazıypanıń tártibin ózgertiw ushın onı súyrep aparıwıńızǵa boladı. Sonday-aq wazıypanı rejelestiriw ushın onı kalendarǵa súyrep aparıwıńız múmkin."
tour.my_work.timer_title="Taymerdi iske qosıw"
tour.my_work.timer_text="Wazıypa ústinde islewge tayın bolǵanıńızda, taymerdi iske qosıw túymesin basıń."
tour.my_work.complete_task_title="Wazıypanı tamamlaw"
tour.my_work.complete_task_text="Wazıypa tamamlanǵannan keyin, status ashılmalı dizimin basıp, onı «Tamamlandı» dep belgilewińizge boladı."
tour.my_work.add_tasks_title="Kóbirek wazıypa qosıw"
tour.my_work.add_tasks_text="Hár bir bólimdegi plyus túymesin basıw arqalı yamasa hár bir wazıypanıń janındaǵı 3 noqatlı menyu arqalı jáne wazıypalar qosa alasız."
tour.my_work.finish_text="Siz «Meniń jumısım» basqarıw paneli boyınsha tanıstırıwdı juwmaqladıńız. Leantime ishinde joba basqarıw haqqında kóbirek biliw ushın <a href='%s/dashboard/show'>jobańızǵa</a> ótiń."
tour.project_dashboard.menu_title="Joba menyuı"
tour.project_dashboard.menu_text="Joba menyuı jobańızdı hár qıylı bólimlerge bóledi: <strong>Maǵlıwmatlar bólmesi</strong> — barlıq fayllarıńız benen maǵlıwmatlarıńızdı saqlaw ushın, <strong>Oylaw</strong> — strategiya dúziw, ideya payda etiw hám anıqlaw ushın, <strong>Islew</strong> — maqsetlerdi, basqıshlardı hám wazıypalardı basqarıw ushın."
tour.project_dashboard.selector_title="Joba tańlaw"
tour.project_dashboard.selector_text="Jobalar arasında ótiw ushın joba tańlaw menyuın paydalanıń. Shep menyu ámeldegi jobańızǵa baylanıslı hámme nárseni kórsetedi."
tour.project_dashboard.checklist_title="Tekseriw dizimi"
tour.project_dashboard.checklist_text="Joba tekseriw dizimi — jobańızda tabıslı orınlaw ushın kerekli barlıq maǵlıwmatlar bar ekenin tez tekseriwge járdem beretuǵın qural."
tour.project_dashboard.status_title="Tez status jańalanıwları"
tour.project_dashboard.status_text="Status jańalanıwları arqalı qızıl, sarı hám jasıl reńlerdi paydalanıp, jobańızdıń barısın toparıńız benen tez bólise alasız. Status pútkil qosımsha boyınsha kórinip turadı."
tour.project_dashboard.progress_title="Orınlanıw barısı"
tour.project_dashboard.progress_text="Joba barısı kórsetkishi qansha jumıstı tamamlaǵanıńızdı kórsetedi. Ol wazıypalardıń hár qıylı kólemin, topar tezligin hám joba basqıshların esapqa aladı."
tour.project_dashboard.latest_tasks_title="Eń sońǵı wazıypalar"
tour.project_dashboard.latest_tasks_text="Eń sońǵı wazıypalar dizimi jobańızǵa eń sońǵı qosılǵan wazıypalardı kórsetedi hám onı jobanıń kiris qutısı retinde paydalanıwǵa boladı."
tour.project_dashboard.team_title="Topar"
tour.project_dashboard.team_text="Topar bloki usı jobanıń aǵzaların kórsetedi."
tour.project_dashboard.finish_text="Siz joba basqarıw paneli boyınsha tanıstırıwdı juwmaqladıńız. Leantime ishinde wazıypalarıńızdı basqarıwdıń hár qıylı usılları haqqında kóbirek biliw ushın <a href='%s/tickets/showKanban'>Wazıypalar</a> bólimine ótiń."
tour.kanban_board.overview_title="Sizdiń Kanban taxtańız"
tour.kanban_board.overview_text="Bul — sizdiń Kanban taxtańız. Ol jumısıńızdı kórgizbeli kórsetiwge hám orınlanıp atırǵan jumıs kólemin sheklewge járdem beredi."
tour.kanban_board.workflow_title="Jumıs aǵımı"
tour.kanban_board.workflow_text="Wazıypalar alǵa ilgerilegen sayın shepten ońǵa qaray jılısadı. Statusın jańalaw ushın kartalardı súyrep aparıń."
tour.kanban_board.columns_title="Iykemli baǵanalar"
tour.kanban_board.columns_text="3 noqatlı menyu arqalı baǵanalardı qosıwıńızǵa, alıp taslawıńızǵa hám olardıń atın ózgertiwińizge boladı."
tour.kanban_board.filter_title="Wazıypalardı filtrlew"
tour.kanban_board.filter_text="Wazıypalarıńızdı ústinlik, status, joba yamasa sáneler sıyaqlı hár qıylı maydanlar boyınsha filtrlewińizge boladı."
tour.kanban_board.swimlanes_title="Jolaqlar"
tour.kanban_board.swimlanes_text="Bunnan tısqarı, Kanban jolaqların jaratıw ushın wazıypalarıńızdı toparlay alasız. Bul jumısıńızdı topar aǵzaları, ústinlik yamasa basqıshlar boyınsha kórgizbeli kórsetiwge járdem beredi."
tour.kanban_board.sprints_title="Sprintler"
tour.kanban_board.sprints_text="Eger jumısıńızdı sprintler menen basqarsańız, sprintlerdi tańlaw, jaratıw hám jańalaw ushın bul jerdegi ashılmalı dizimdi paydalanıń."
tour.kanban_board.finish_text="Kanban boyınsha tanıstırıw usı jerde juwmaqlanadı. Leantime ishinde basqıshlardı qalay jaratıw hám basqarıw kerekligin biliw ushın <a href='%s/tickets/roadmap'>Basqıshlar</a> bólimine ótiń."
tour.milestones.overview_title="Basqıshlar"
tour.milestones.overview_text="Basqıshlar áhmiyetli nátiyjelerdi hám joba etapların baqlawǵa járdem beredi."
tour.milestones.drag_title="Súyrew hám saralaw"
tour.milestones.drag_text="Hár bir jolaq bir basqıshtı bildiredi. Olardı waqıt sızıǵı boylap súyrep aparıwıńızǵa, tártibin hám ólshemin ózgertiwińizge boladı. Bul ekranda islegen hár bir ózgerisińiz basqıshlarıńızdıń múddetlerin jańalaydı."
tour.milestones.filter_title="Filtr"
tour.milestones.filter_text="Basqıshlarıńızdı filtrlewińizge hám olarǵa tiyisli wazıypalardı da kóriwińizge boladı."
tour.milestones.timeframes_title="Waqıt aralıqları"
tour.milestones.timeframes_text="Jıldıń kóbirek bólegin kóriw yamasa kúnlik bólistiriwge tereńirek úńiliw ushın waqıt sızıǵı kórinisiniń waqıt aralıǵın ózgerte alasız."
tour.milestones.finish_text="Basqıshlar boyınsha tanıstırıw usı jerde juwmaqlanadı. Leantime ishinde maqsetlerdi qalay jaratıw hám basqarıw kerekligin biliw ushın <a href='%s/goalcanvas/dashboard'>Maqsetler</a> bólimine ótiń."
tour.goals.overview_title="Maqsetler"
tour.goals.overview_text="Maqsetler jobalarıńızdaǵı ólshewge bolatuǵın tásirdi baqlawǵa járdem beredi."
tour.goals.parts_title="Nıshanalar hám kórsetkishler"
tour.goals.parts_text="Hár bir maqset Nıshanadan (siz neni ámelge asırıwǵa umtılıp atırǵanıńız) hám Kórsetkishten (onı qalay ólsheytuǵınıńız) ibarat."
tour.goals.progress_title="Maqsettiń orınlanıw barısı"
tour.goals.progress_text="Maqset kórsetkishlerin jańalaǵanıńız sayın, orınlanıw barısı sızıǵı qanshelli alǵa ilgerilegenińizdi kórsetedi."
tour.goals.milestones_title="Basqıshlar hám maqsetler"
tour.goals.milestones_text="Maqsetlerińizdiń wazıypalar dárejesindegi barısın baqlaw ushın maqsetlerdi basqıshlar menen baylanıstıra alasız. Bul joba rejesindegi kemshiliklerdi anıqlawǵa járdem beredi."
tour.goals.finish_text="Maqsetler boyınsha tanıstırıw usı jerde juwmaqlanadı. Basqıshlar, Maqsetler hám Wazıypalar — Leantime ishindegi tiykarǵı qurılıs bloklari. Jumısıńızdı basqarıwǵa qolaylı bóleklerge bóliw ushın olardı paydalanıń. Wazıypalarıńızdı kórip shıǵıw ushın <a href='%s/tickets/showKanban'>Kanban taxtası</a> bólimine ótiń."
