text.full_lean_canvas_helper_content="Tolıq izertlew taxtası sizdi ideyanı tekseriwdiń barlıq procesi arqalı alıp ótedi.<br/>Bul bette siz jáne de klientler segmentińiz, mashqala hám sheshim ústinde islesiz (biraq tınıshlanıń, eger olardı ápiwayı taxtada toltırǵan bolsańız, olardı bul jerde jáne kóresiz!).<br/>Sonnan keyin siz Anıq qádiriyat usınısına (Ideyańız basqa usınıslardan nesi menen jaqsıraq?),<br/>Satıw kanallarına (Klientler sheshimińizdi qalay aladı?)<br/>Dáramat dereklerine (Sheshimińiz qalay pul tabadı?)<br/>Shıǵınlar dúzilisine (Sheshimińiz qansha turadı?), Tiykarǵı kórsetkishlerge (Tabıstı qalay ólsheysiz?)<br/>hám ádiletsiz artıqmashılıqqa (Básekelesler arasında sizdi ne ajıratıp turadı?) ótesiz.<br/>Bul sorawlarǵa juwap beriw tabısqa jetiwge, sátsizliklerdi azaytıwǵa hám boljawlarıńızdı baqlap, tekseriwge járdem beredi.<br/>Lean — bul isrepgershilikti joq etiw hám klientlerińizge kerek ónimler, dúkanlar hám sheshimlerdi jaratıw ústinde islew."
