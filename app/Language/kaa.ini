text.who_can_access="Bul jobanı kimler kóre alatuǵının tańlań. Standart boyınsha paydalanıwshılar ózlerine belgilengen rollerdi miyras etip aladı. Bul rollerdi «Topar» bóliminde ózgerte alasız"
text.ical_export_description="Bul jerde Leantime kalendarıńızdı «iCal» formatın qollap-quwatlaytuǵın hár qanday qosımshaǵa integraciyalawǵa múmkinshilik beretuǵın unikal kalendar URL mánzilin jarata alasız. "
text.you_ical_url="Kalendarıńızdıń URL mánzili tómende. <br /> Bul URL mánzili bar hár bir adam kalendarǵa kire alatuǵının esapqa alıń. Onı paroldey jasırın saqlań."
