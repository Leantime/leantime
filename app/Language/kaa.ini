text.company_name_helper="Bet atawında hám elektron xatlarda kórsetiledi"
text.advanced_boards_helper_content="Ideyalar rawajlanadı, ósedi hám pisip jetiledi. Olardı baqlap barıw ushın orın usı.<br/>Ideya kartalarınıń házirgi jaǵdayın kórsetiw ushın olardı bir baǵanadan keyingisine ótkeriń.<br/>Bul — ámelge asırıwdı baslawdan aldın izertlewdi baslaw, prototiplerdi islep shıǵıw hám olardı bir neshe klient penen tekseriw ushın jaqsı orın."
text.backlog_helper_content="Backlog — barlıq wazıypalarıńızdıń, yaǵnıy házir islep atırǵan hám islewdi rejelestirgen wazıypalarıńızdıń turaq jayı.<br/><br/>Backlog dizimin tamamlawda alǵa ilgerilew ushın qısqa iteraciyalar — sprintler menen islewdi usınamız.<br/>Sprintler — kishi, tapsırıwǵa tayın jumıs bóleklerine dıqqat qaratıwǵa múmkinshilik beretuǵın eki háptelik waqıt aralıqları.<br/>Eki hápte aqırında sizde «kórsetiw» ushın bir nárse bolıwı kerek — paydalanıwshılarıńız yamasa klientlerińiz ushın qádiriyat beretuǵın bir nárse.<br/><br/>Bul ekranda siz wazıypalar dizimińizdi shólkemlestirip, basqara alasız, súyrep aparıw arqalı backlog ústinliklerin belgiley alasız hám Backlog elementlerin házirgi sprintińizge ótkere alasız.<br/>Kóbirek maǵlıwmat kerek pe? Tanıstırıwdı baslań yamasa jumıstı baslaw ushın jabıń!"
text.glad_youre_here="Sizdi bul jerde kórgenimizden quwanıshlımız. Keliń, bir minut tanısıp alayıq."
text.business_research_section="Biznes izertlew bólimimiz — ideyalarıńız ushın jańa úy. Bul bólim sizdi klientlerdi rawajlandırıw, mashqalanı izertlew hám sheshim ideyaların islep shıǵıw qádemleri arqalı alıp ótiwge arnalǵan."
text.our_roadmap_design="Jol kartamız sizdi kishi, basqarıwǵa qolaylı basqıshlardan úlken nátiyjege shekem alıp barıwǵa arnalǵan. Basqıshlardı shama menen 3 ay dawamında rejelestirip, maqsetten shetlespew ushın usı joba belgilerin paydalanıń."
text.this_is_where_you_spend_most_time="Waqtıńızdıń kóp bólegin usı jerde — jumıs islep ótkeresiz. 2 háptelik sprintlerińizdi rejelestirip, Kanban taxtası hám Backlog quralları járdeminde tabıslı orınlań. Keyingi sprintte ósiw ushın retrospektivalardı paydalanıń."
text.idea_board_helper_content="Bul — barlıq ideyalarıńızdı jıynaytuǵın orın. Jańa ideyalardı toparıńız benen talqılań hám ideyalarıńız boyınsha orınlanıw barısın kóriw ushın basqıshlardı baylanıstırıń."
text.kanban_helper_content="Kanban — yapon tilinde «karta» degen sóz. Kanban taxtaların 40-jılları Toyota injenerleri Lean óndirisi menen birge qollanıwdı basladı.<br/>Ol maǵlıwmattı hám jumıstıń barısın kórgizbeli túrde tez bólisiw ushın qollanıladı.<br/>Kanban taxtaları jumıs penen statustı kórgizbeli kórsetiw, aktiv yamasa orınlanıp atırǵan jumıstı basqarıw, jumıs aǵımın basqarıw hám lean jaqsılawları boyınsha tez háreket etiw ushın paydalı."
text.my_timesheets_helper_content="Waqıt esapları — wazıypa ústinde haqıyqatında islengen saǵatlardı esapqa alatuǵın orın.<br/>Bul esap-faktura jazıw ushın, sonday-aq wazıypalarıńızdı aldınnan qanshelli jaqsı rejelestirip atırǵanıńızdı tekseriw ushın da paydalı.<br/>Waqıt ótken sayın Leantime rejelestiriwdegi parqlardı esapqa alıp, múddetlerdi dúzetiwi múmkin."
text.new_project_helper_content="<p>Bul — jobańızdı táriyplep, anıqlap, onıń parametrlerin belgileytuǵın orın. Bul áhmiyetli, sebebi tap usı bólim<br/>pútkil toparǵa jobanıń ústinlikleri, kútiletuǵın nátiyjeleri hám qaǵıydaları haqqında maǵlıwmat beredi.</p><p><br/><em>Bul jerde oylanatuǵın nárseler: 4C.<br/>Anıq, qısqa, tolıq hám isenimli bolıń.<br/><br/></em></p><p>Bul qaǵıydalardı joba táriyplerińizde qollanıw hámmeniń birdey túsiniwin támiyinleydi hám qátelikler menen nadurıs qádemler qáwipin azaytadı.</p><br/>Baslaw waqtı keldi!<br/><br/>"
text.not_found_helper_content="<p>Bul bet ushın bizde ele mazmun joq.<br/>Bul jerde ne islewge bolatuǵını haqqında kóbirek biliw ushın tómendegi «Járdem kerek pe» siltemesin paydalanıń.</p>"
text.retros_helper_content="<p>Retrospektivalar — jumıs, topardıń islewi hám, álbette, orınlanıw barısı haqqında qısqa oylanıw.<br/>Bul jerde toparıńız neniń jaqsı ótkenine, neniń jaqsı ótpegenine hám keyingi ret neni basqasha islewge bolatuǵınına dıqqat qarata aladı.<br/>Talqılaw ushırasıwın turaqlı aralıqlarda yamasa keminde hár bir basqısh sońında ótkeriwdi usınamız.<br/></p>"
text.roadmap_helper_content="<p>Jol kartaları úlken jobalardı kishi hám basqarıwǵa qolaylıraq bóleklerge bóliwge járdem beredi.<br/><br/></p><p>Jol kartańızdı jaratıw ushın 3 ay ishinde jetiwge bolatuǵın basqıshlar belgilewdi usınamız.</p><p>Basqıshlar — jobanı tamamlaw jolındaǵı tekseriw noqatları.<br/>Ápiwayı etip aytqanda: eger siz el boylap avtomobil sayaxatına shıqsańız, ótetuǵın hár bir wálayat basqısh bolıwı múmkin.<br/><br/>Baslaw ushın joqarǵı shep tárepte «Basqısh qosıw» túymesin basıń. Sáneni usı bólimde yamasa jol kartası diagrammasınıń ózinde basqıshtı kalendar ishinde basıp, súyrep aparıw arqalı belgileń.</p>"
text.show_clients_helper_content="<p>Klientler/Ónimler jobalarıńızdı kategoriyalarǵa bóledi hám hár qıylı toparlardı bir-birinen ajıratıwǵa múmkinshilik beredi.<br/><br/></p><p>Konsultant retinde siz klientler menen islesesiz, olardı shólkemlestiretuǵın orın usı.</p><p>Eger siz ónim toparı bolsańız, bul bólimdi bólimlerińizdi (marketing, satıw, operaciyalar h.t.b.) shólkemlestiriw hám ajıratıw ushın paydalanıwıńızǵa boladı.</p>"
text.show_projects_helper_content="<p>Jobalar — biznesińizdiń hám Leantime sistemasınıń júregi! Ózgerisler, rawajlanıw, maqsetler hám siz qura alatuǵın yamasa ármanlaytuǵın hár qanday nárse jobalardı óz ishine aladı.<br/>Joba basqarıw — bul ápiwayı etip aytqanda, jobalarıńızdıń óz waqtında, durıs hám haqıyqıy biznes qádiriyatı menen orınlanıwın támiyinlew procesi.<br/><br/>Jobalarıńız usı jerde jaylasadı. Jobalar beti joba jaratıwǵa, wazıypalar sanın, saǵatlardı, byudjet summasın hám jobaǵa baylanıslı klientti tez kóriwge múmkinshilik beredi.<br/><br/>Barlıq jobalarıńızǵa tez kóz jiberiw ushın usı betti paydalanıń.<br/><br/></p>"
text.new_db_version="Jańa versiya ornatıldı. Leantime sistemasın paydalanıw ushın maǵlıwmatlar bazasın jańalawıńız kerek.<br/><br/><strong>Bul jańalawdı orınlawdan aldın maǵlıwmatlar bazasınıń zapas nusqasın jaratıwdı umıtpań!</strong><br/>Bul bir neshe minut waqıt alıwı múmkin."
text.update_was_successful="Jańalaw tabıslı ámelge astı, endi sistemaǵa kire alasız. <a href='%1$s'>Kiriw betine ótiw</a>"
text.this_script_will_set_up_leantime="Bul skript maǵlıwmatlar bazańızdı sazlaydı hám administrator akkauntın jaratadı"
