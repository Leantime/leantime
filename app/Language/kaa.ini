text.lean.helper_content="Lean Canvas sizdi jańa biznes hám/yamasa ónim ideyańızdı tekseriwdiń tolıq procesinen alıp ótedi.<br/>Siz <em>Klient segmenti</em>, <em>Mashqala, Sheshim</em> máselelerin qarastırasız.<br/>Sonnan keyin <em>Unikal qunlılıq usınısı</em> (ideyańızdı basqa usınıslardan ne jaqsıraq etedi?), <em>Tarqatıw kanalları</em> (sheshimińizdi klientlerge qalay jetkeresiz?), <em>Dáramat aǵımları</em> (sheshimińiz qalay dáramat ákeledi?), <em>Shıǵınlar strukturası</em> (sheshimińiz qansha turadı?), <em>Tiykarǵı kórsetkishler</em> (tabıstı qalay ólsheysiz?) hám <em>Ayrıqsha artıqmashlıq</em> (básekede tabısqa erisiwge járdem beretuǵın sizde ne bar?) bólimlerine ótesiz.<br/>Bul sorawlarǵa juwap beriw tabıstı qollap-quwatlaw, sátsizlik qáwipin kemeytiw hám boljawlarıńızdı baqlap, tekseriw ushın arnalǵan. Lean bolıw — israpgershilikti joq etiw hám klientlerińizge kerek ónimlerdi, biznesti hám sheshimlerdi jaratıw ushın islew degen sóz."
text.lean.disclaimer="Lean Canvas <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> modelinen beyimlestirilgen hám <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> licenziyası astında tarqatıladı"
