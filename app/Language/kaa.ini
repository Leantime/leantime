text.my_work_dashboard_intro="«Meniń jumısım» basqarıw paneli eń áhmiyetli nárselerdiń barlıǵın dıqqat orayına qoyadı.<br/>Eń áhmiyetli jumısıńız endi aldıńǵı orında, tek siz ushın hám miyińizdiń eń jaqsı isleytuǵın usılına sáykes shólkemlestirilgen.<br/><br/>Kishi wazıypalardan baslap úlken maqsetlerge shekem — sizge kerekli hámme nárse usı jerde. Bul ideyalardı jazıp alıw, orınlanıw barısın baqlaw hám jol boyı jetiskenliklerdi belgilew ushın sizdiń keńisligińiz."
text.blueprints_intro="Úlgiler barlıq maǵlıwmatlardı túsiniwge járdem beredi. Leantime biznes model kanvasları, SWOT analizi yamasa empatiya kartaları arqalı jobańızdıń fonın anıqlaw ushın túrli quralları hám kanvasları usınadı.<br/><br/>Eger neden baslawdı bilmeseńiz, «Joba qunlılıǵı kanvasın» jaratıwdı usınamız. Bul kanvas jobańızdıń eń áhmiyetli sorawlarına juwap beredi: Klientińiz kim?<br/>Siz qanday mashqalanı sheship atırsız?<br/>Sizdiń sheshimińiz qanday?<br/>Sheshimińiz básekileslerge salıstırǵanda qanday artıqmashılıq beredi<br/>"
text.goals_tour_intro="Maqsetler jobańızdı erisiwge bolatuǵın, ólshenetuǵın hám ámelge asırılatuǵın bóleklerge bóliwge múmkinshilik beredi.<br/>Basqıshlar orınlawǵa qaratılǵan bolsa, maqsetler siz erisiwdi qáleytuǵın kórsetkishler haqqında.<br/>Hár bir maqsettiń anıq nıshanası (siz erisiwdi qáleytuǵın nárse) bolıwı hám onı bir kórsetkish arqalı ańsat ólshewge bolıwı kerek.<br/><br/>Maqset jaratılǵannan keyin, onı orınlanatuǵın wazıypalarǵa bóliw ushın oǵan basqıshlar tayınlaw múmkin.<br/>"
text.project_dashboard_tour_intro="Leantime ishindegi jobalar — siz hám toparıńız jumıstı shólkemlestiretuǵın, baqlaytuǵın hám nátiyjeli orınlaytuǵın birgeliktegi jumıs keńislikleri. Hár bir joba baylanıslı maqsetler, wazıypalar hám basqıshlar ushın konteyner xızmetin atqaradı hám orınlanıw barısın bir orayda baqlawǵa múmkinshilik beredi.<br/><br/>Jumıstı, oqıwdı yamasa ishki jeke baslamalardı basqarıp atırǵan bolsańız da, Leantime jobaları ideyalardı tabıslı nátiyjelerge aylandırıw ushın kerekli strukturanı hám quralların usınadı."
text.wiki_tour_intro="Hújjetler toparıńız benen hújjetler jazıwǵa hám bólisiwge múmkinshilik beredi. Hújjetlerińizdi toparlar, baǵdarlar yamasa hújjet kategoriyaları boyınsha shólkemlestiriw ushın bir neshe keńislik jaratıwıńız múmkin.<br/>Bilim, procesler hám tártipler menen bólisiw ushın hújjetler jaratıń. Sonday-aq bult saqlawıńızdaǵı faylǵa yamasa papkaǵa silteme menen bólisiw ushın hújjet jaratıwıńız múmkin.<br/>"
text.extend_leantime_latest_plugins="Eń sońǵı pluginlerimiz járdeminde Leantime múmkinshiliklerin keńeytiń."
support.headline_help_us_build="Barlıq aqıl-oylar rawajlanatuǵın keleshekti qurıwǵa járdem beriń!"
support.intro_text_1="Kópshilik ónimdarlıq quralları hámme birdey oylaydı dep esaplaydı: sızıqlı túrde, tolıq dıqqat penen, ıqtıyarlı múddetler menen motivaciyalanıp. Sizde ADHD bolıp, tamamlanǵan wazıypalardan dofamin alıwıńız kerek pe, autizmińiz bolıp, turaqlı struktura qáleysiz be, disleksiyańız bolıp, keńislikte oylaysız ba, yamasa miyińizdiń haqıyqıy islew usılına sáykes kelmeytuǵın qurallardan sharshaǵansız ba — siz, bálkim, joba basqarıwınan pútkilley waz keshkensiz."
support.intro_text_2="Biz Leantime sistemasın basqasha isleytuǵın aqıl-oylar ushın jaratıp atırmız. Bul neyrodivergent adamlardı, sonday-aq bar qurallar óziniń tábiyiy oylaw usılına qarsı isleytuǵının sezgen hár bir adamdı óz ishine aladı."
