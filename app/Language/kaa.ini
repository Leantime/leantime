label.onboarding_default_project_name="Meniń jobam"
text.onboarding_default_project_details="Leantime ishindegi birinshi jobańızǵa xosh kelipsiz!<br />Bul — wazıypalardı shólkemlestiriw, maqsetlerdi baqlaw hám jumısıńızdı rejelestiriw ushın sizdiń keńisligińiz. Bul jerdegi hár qanday nárseni ózgertiwińizge yamasa jumısıńız keńeygen sayın qosımsha jobalar jaratıwıńızǵa boladı. Bul joba tek jumıstı baslawıńız ushın arnalǵan"
label.onboarding_milestone_getting_started="Jumıstı baslaw"
label.onboarding_task_community_chat="Jámiyet chatımızǵa qosılıń"
text.onboarding_task_community_chat="Jámiyet chatımız — sorawlar beriw hám jobanı sazlaw boyınsha pikir alıw ushın jaqsı derek. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Jámiyet chatı</a>"
label.onboarding_task_invite_team="Topar aǵzalarıńızdı shaqırıń"
text.onboarding_task_invite_team="Kim menendur birge isleseńiz de yamasa sizdi juwapkershilikke shaqırıp turatuǵın serik kerek bolsa da, Leantime sistemasın topar bolıp paydalanıw durıs jolda qalıwǵa hám motivaciyanı saqlawǵa járdem beredi <a href='%s'>Paydalanıwshılardı basqarıw</a>"
label.onboarding_task_project_structure="Leantime ishindegi joba dúzilisi haqqında kóbirek biliń"
text.onboarding_task_project_structure="Járdem hújjetlerimizde kóplegen qosımsha resurslar bar. Leantime ishindegi joba dúzilisi hám eń jaqsı ámeliyatlar haqqında kóbirek biliw ushın mına mánzilge kiriń: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Maqset jaratıń"
text.onboarding_task_create_goal="Maqsetler uzaq múddetli nıshanalardı baqlaw hám ólshew ushın paydalanıladı. Olardı turaqlı túrde jańalap turıwǵa bolatuǵın kórsetkishler arqalı ólshewge bolıwı kerek. Kórsetkishlerdiń barısın kórip otırıp, orınlanıw barısın da kóriw ushın Maqsetler menen Basqıshlardı baylanıstırıwǵa boladı <a href='%s'>Joba maqsetleri</a>"
label.onboarding_task_create_milestone="Basqısh jaratıń"
text.onboarding_task_create_milestone="Basqıshlar jobalarıńızdıń etapların anıq nátiyjeler boyınsha kategoriyalarǵa bóliwge múmkinshilik beredi. Hár bir basqıshtıń baslanıw hám tamamlanıw sánesi boladı hám ol belgili bir nátiyje beriwi kerek <a href='%s'>Joba basqıshı</a>"
label.onboarding_task_personal_project="Jeke jobańız benen tanısıń"
text.onboarding_task_personal_project="Jeke jobańız — wazıypalarıńızdı, maqsetlerińizdi hám jumısıńızdı shólkemlestiretuǵın keńislik. Oǵan joqarıdaǵı joba tańlaw menyuı arqalı yamasa mına siltemeni basıp kiriwińizge boladı: <a href='%s'>Meniń jobam</a>"
label.onboarding_task_complete_profile="Leantime profilimdi tolıqtırıw"
text.onboarding_task_complete_profile="Paydalanıw tájiriybemdi jekelestiriw ushın profil súwretin jańalaw hám jumıs sazlawların toltırıw. <a href='%s'>Meniń profilim</a>"
