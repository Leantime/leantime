text.ea.helper_content="Die <em>Umweltanalyse</em>, auch als <em>PESTLE-Analyse</em> bekannt, hilft Ihnen, das aktuelle und/oder zukünftige Umfeld, in dem Sie tätig sind, entlang der sechs Dimensionen einzuschätzen: politisch, wirtschaftlich, gesellschaftlich, technologisch, rechtlich und ökonomisch.<br/>Wir empfehlen Ihnen, frühzeitig in Ihrem Projekt, zumindest vor Beginn der Ideenfindungsphase, eine Umweltanalyse durchzuführen und diese während Ihres gesamten Projekts auf dem neuesten Stand zu halten."
