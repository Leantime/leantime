text.my_work_dashboard_intro="Ihr Dashboard „Meine Arbeit“ rückt alles Wichtige in den Fokus.<br/>Ihre wichtigste Arbeit steht jetzt im Mittelpunkt – organisiert speziell für Sie und so, wie Ihr Gehirn am besten arbeitet.<br/><br/>Von schnellen Aufgaben bis zu ehrgeizigen Zielen: Alles, was Sie brauchen, finden Sie hier. Das ist Ihr Raum, um Ideen festzuhalten, Fortschritte zu verfolgen und Erfolge unterwegs zu feiern."
text.blueprints_intro="Projektpläne helfen Ihnen, alle Daten sinnvoll einzuordnen. Leantime bietet eine Vielzahl von Werkzeugen und Canvases, um den Hintergrund Ihres Projekts zu definieren – etwa mit Business Model Canvases, SWOT-Analysen oder Empathy Maps.<br/><br/>Wenn Sie nicht wissen, wo Sie anfangen sollen, empfehlen wir Ihnen, ein „Project Value Canvas“ zu erstellen. Dieses Canvas beantwortet die wichtigsten Fragen Ihres Projekts: Wer ist Ihr Kunde?<br/>Welches Problem lösen Sie?<br/>Was ist Ihre Lösung?<br/>Welchen Vorteil bietet Ihre Lösung gegenüber Ihren Mitbewerbern?<br/>"
text.goals_tour_intro="Mit Zielen können Sie Ihr Projekt in erreichbare, messbare und umsetzbare Abschnitte aufteilen.<br/>Während sich Meilensteine auf die Umsetzung konzentrieren, geht es bei Zielen um die Kennzahlen, die Sie erreichen möchten.<br/>Jedes Ziel sollte eine klare Zielsetzung haben (das, was Sie erreichen möchten) und sich mit einer einzigen Kennzahl leicht messen lassen.<br/><br/>Sobald Sie ein Ziel haben, können Sie ihm Meilensteine zuordnen, um es in umsetzbare Aufgaben aufzuteilen.<br/>"
text.project_dashboard_tour_intro="Projekte in Leantime sind gemeinsame Arbeitsbereiche, in denen Sie und Ihr Team Arbeit effizient organisieren, verfolgen und erledigen. Jedes Projekt bündelt zusammengehörige Ziele, Aufgaben und Meilensteine und ermöglicht es Ihnen, den Fortschritt an einem zentralen Ort zu verfolgen.<br/><br/>Ob Sie Arbeit, Studium oder persönliche Vorhaben verwalten – Leantime-Projekte bieten die Struktur und die Werkzeuge, um aus Ideen erfolgreiche Ergebnisse zu machen."
text.wiki_tour_intro="Mit unseren Dokumenten können Sie Dokumentation schreiben und mit Ihrem Team teilen. Sie können mehrere Bereiche anlegen, um Ihre Dokumentation nach Teams, Themen oder Dokumentkategorien zu ordnen.<br/>Erstellen Sie Dokumente, um Wissen, Prozesse und Abläufe zu teilen. Sie können auch ein Dokument erstellen, um einen Link zu einer Datei oder einem Ordner in Ihrem Cloud-Speicher zu teilen.<br/>"
text.extend_leantime_latest_plugins="Erweitern Sie Leantime mit unseren neuesten Plugins."
support.headline_help_us_build="Helfen Sie uns, eine Zukunft zu schaffen, in der alle Köpfe aufblühen!"
support.intro_text_1="Die meisten Produktivitätstools gehen davon aus, dass alle gleich denken: linear, perfekt fokussiert und motiviert durch willkürliche Deadlines. Ob Sie ADHS haben und die Dopamin-Kicks erledigter Aufgaben brauchen, autistisch sind und sich nach verlässlicher Struktur sehnen, Legasthenie haben und räumlich denken – oder einfach genug von Tools haben, die nicht dazu passen, wie Ihr Gehirn wirklich arbeitet: Wahrscheinlich haben Sie Projektmanagement längst ganz aufgegeben."
support.intro_text_2="Wir entwickeln Leantime für Köpfe, die anders arbeiten. Das schliesst neurodivergente Gehirne ein, aber auch alle, die schon einmal das Gefühl hatten, dass bestehende Tools gegen ihre natürlichen Denkmuster arbeiten."
