label.onboarding_default_project_name="Mein Projekt"
text.onboarding_default_project_details="Willkommen in Ihrem ersten Projekt in Leantime!<br />Hier organisieren Sie Aufgaben, verfolgen Ziele und planen Ihre Arbeit. Sie können hier alles nach Belieben ändern oder weitere Projekte anlegen, wenn Ihre Arbeit wächst. Dieses Projekt soll Ihnen nur den Einstieg erleichtern"
label.onboarding_milestone_getting_started="Erste Schritte"
label.onboarding_task_community_chat="Unserem Community-Chat beitreten"
text.onboarding_task_community_chat="Unser Community-Chat ist eine grossartige Anlaufstelle, um Fragen zu stellen und Feedback zur Einrichtung Ihres Projekts zu erhalten. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Community-Chat</a>"
label.onboarding_task_invite_team="Ihre Teamkollegen einladen"
text.onboarding_task_invite_team="Ob Sie mit anderen zusammenarbeiten oder einfach jemanden brauchen, der Sie in die Pflicht nimmt: Wenn Sie Leantime gemeinsam nutzen, bleiben Sie leichter auf Kurs und motiviert <a href='%s'>Benutzerverwaltung</a>"
label.onboarding_task_project_structure="Mehr über die Projektstruktur von Leantime erfahren"
text.onboarding_task_project_structure="In unserer Hilfe-Dokumentation finden Sie viele weitere Ressourcen. Um mehr über die Projektstruktur in Leantime und bewährte Vorgehensweisen zu erfahren, besuchen Sie: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Ein Ziel erstellen"
text.onboarding_task_create_goal="Ziele dienen dazu, langfristige Zielsetzungen zu verfolgen und zu messen. Sie sollten anhand von Kennzahlen messbar sein, die Sie regelmässig aktualisieren können. Ziele und Meilensteine lassen sich verknüpfen, sodass Sie den Umsetzungsfortschritt neben dem Fortschritt der Kennzahlen sehen <a href='%s'>Projektziele</a>"
label.onboarding_task_create_milestone="Einen Meilenstein erstellen"
text.onboarding_task_create_milestone="Mit Meilensteinen gliedern Sie die Phasen Ihrer Projekte in klar abgegrenzte Ergebnisse. Jeder Meilenstein hat ein Start- und ein Enddatum und sollte ein konkretes Ergebnis liefern <a href='%s'>Projektmeilensteine</a>"
label.onboarding_task_personal_project="Ihr persönliches Projekt erkunden"
text.onboarding_task_personal_project="Ihr persönliches Projekt ist ein Bereich, in dem Sie Ihre Aufgaben, Ziele und Arbeit organisieren können. Sie erreichen es über die Projektauswahl oben oder über diesen Link: <a href='%s'>Mein Projekt</a>"
label.onboarding_task_complete_profile="Mein Leantime-Profil vervollständigen"
text.onboarding_task_complete_profile="Profilbild aktualisieren und Arbeitseinstellungen vervollständigen, um Leantime an mich anzupassen. <a href='%s'>Mein Profil</a>"
