headlines.insights.welcome_to_board="Willkommen im Insights-Board!"
text.insights.helper_content="Das Board <em>Beobachten/Lernen – Einblicke</em> hilft Ihnen, strukturierte Einblicke aus vier verschiedenen Quellen (ethnografische Beobachtungen, Interviews, Fokusgruppen und Sekundärforschung) zu sammeln und sie in Wissen umzuwandeln.<br/>Es unterstützt die Phasen des Design-Thinking-Prozesses beobachten und lernen, die manchmal auch Empathisieren und Definieren genannt werden.<br/>Weitere Details finden Sie in den Kapiteln 2, 8 und 9 des Buches <a href='https://inov.at/dts'></em>Design Thinking for Strategy</em></a>.<br/>Wir empfehlen Ihnen, jedes Mal, wenn Sie neue Erkenntnisse sammeln und analysieren, das Board <em>Beobachten/Lernen – Einblicke</em> zu verwenden, sei es für eine Risikoanalyse, eine Umweltanalyse, das Entdecken von Branchentrends oder das Entwerfen neuer Produkte und Dienstleistungen, um nur einige zu nennen."
