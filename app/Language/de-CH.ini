support.marcel_name="👋 Ich bin Marcel"
support.marcel_tagline="Deutscher Einwanderer, Vater einer autistischen Tochter und selbst mit ADHS."
support.marcel_bio_1="Herkömmliche Projektmanagement-Tools haben bei mir nie funktioniert. Sie fühlten sich an, als wären sie von neurotypischen Köpfen für neurotypische Köpfe gemacht. Als ich freiberuflich arbeitete und Mühe hatte, Kundenprojekte zu organisieren, begann ich, etwas zu entwickeln, das mit meinem Gehirn arbeitet statt dagegen."
support.marcel_bio_2="Was als persönliche Lösung begann, wurde zu Leantime, als mir klar wurde, dass Millionen anderer Menschen genau dasselbe brauchten."
support.gloria_name="👋 Und ich bin Gloria"
support.gloria_tagline="Ehemalige Notaufnahme-Pflegekraft, heute Produktmanagerin und hispanische Unternehmerin der ersten Generation."
support.gloria_bio_1="Ich habe jahrelang in medizinischen Umgebungen unter hohem Druck gearbeitet, in denen Organisation buchstäblich Leben rettet. Doch als ich mein eigenes Unternehmen gründete, wirkten herkömmliche Projekttools überwältigend und hatten nichts damit zu tun, wie ich tatsächlich denke und arbeite."
support.gloria_bio_2="Mein Hintergrund in Verhaltenswissenschaft und Motivationsforschung prägt, wie wir Funktionen entwickeln, die Aufgaben nicht nur organisieren – sondern dafür sorgen, dass Sie sie wirklich erledigen wollen."
support.closing_text="Wir können eine Welt schaffen, in der niemand gegen seine Werkzeuge kämpfen muss, um grossartige Arbeit zu leisten. Ihr Sponsoring finanziert eine Zukunft, in der sich Software an die Vielfalt der Menschen anpasst – nicht umgekehrt."
support.headline_ready_to_impact="Bereit, direkt etwas zu bewirken?"
support.contribution_text="Jeder Beitrag – von 1 $ bis 100 $ – fliesst direkt in die Verbesserung von Leantime für alle."
