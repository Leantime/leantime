# Notifications

MTR.headlines.lean.analysis = "Beschreiben Sie Ihr Lean Canvas"
MTR.headlines.lean.welcome_to_board = "Willkommen auf dem Lean Canvas Board!"

MTR.text.lean.helper_content = "Der Lean Canvas führt Sie durch den gesamten Prozess der Ideenvalidierung Ihrer neuen Geschäfts- und/oder Produktidee.<br/>Sie befassen sich mit Ihrem <em>Kundensegment</em>, <em>Problem, Lösung</em>.<br/>Von dort aus gehen Sie zu Ihrem <em>Einzigartigen Nutzenversprechen</em> (was macht Ihre Idee besser als andere Angebote?), Ihren <em>Vertriebskanälen</em> (wie bringen Sie Ihre Lösung zu Ihren Kunden?), Ihre <em>Umsatzströme</em> (wie wird Ihre Lösung Geld einbringen?), Ihre <em>Kostenstruktur</em> (wie viel ist Ihre Lösung wert?), <em>Schlüsselkennzahlen</em> (wie werden Sie den Erfolg messen?) und Ihr <em>Unfairer Vorteil</em> (was haben Sie, um sich gegenüber der Konkurrenz durchzusetzen?)<br/>Die Beantwortung dieser Fragen soll den Erfolg fördern, Misserfolge abmildern und Ihnen ermöglichen, Ihre Annahmen zu verfolgen und zu überprüfen. Bei Lean geht es darum, Verschwendung zu beseitigen und Produkte, Geschäfte und Lösungen zu entwickeln, die Ihre Kunden brauchen."
MTR.text.lean.disclaimer = "Lean Canvas ist eine Adaption von <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> und ist lizenziert unter der <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> Lizenz"
MTR.tour.lean.once_your_done = "<em>Wenn Sie mit Ihrer schlanken Leinwand zufrieden sind, gehen Sie zum</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Roadmap-Planer</a>"


