MTR.headlines.dbm.welcome_to_board = "Willkommen im Detailed Business Model Board!"

MTR.text.dbm.helper_content = "Das <em>Detaillierte Geschäftsmodell</em> hilft Ihnen, Ihre aktuelle Organisation, Ihre Wettbewerber und die Branche zu dokumentieren. Es trägt dazu bei, sicherzustellen, dass Ihre Strategie wünschenswert, lebensfähig und durchführbar ist. Es baut typischerweise auf dem <em>Leichtgewichtigen Geschäftsmodell</em> auf und erweitert es, indem es zusätzliche Details berücksichtigt, die für den Erfolg eines Unternehmens relevant sind.<br />Weitere Details finden Sie in Kapitel 3 des Buches <a href='https://inov.at/dts'></em>Design Thinking for Strategy</em></a>.<br/>Wir empfehlen die Verwendung des detaillierten Geschäftsmodells, wenn Sie bestimmte Geschäftsideen prototypisieren und sicherstellen wollen, dass diese zu einem wünschenswerten, lebensfähigen und realisierbaren Unternehmen führen."
MTR.tour.dbm.once_your_done = "<em>Wenn Sie mit Ihrem detaillierten Geschäftsmodell zufrieden sind, gehen Sie zum</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Roadmap-Planer</a>"
MTR.text.dbm.disclaimer = "Das <em>Detailed Business Model Canvas</em> stammt aus <a href='https://inov.at/dts'>Design Thinking for Strategy</a> und basiert auf dem <em>Business Model Canvas</em> von <a href='https://www.strategyzer.com'>Strategyzer</a>. Es ist lizenziert unter der <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> Lizenz"


