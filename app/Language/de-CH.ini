checklist.define.description="Beginnen Sie Ihre Projekte mit einer Projektbeschreibung, fügen Sie Ihre Team-Mitglieder hinzu und erstellen Sie eine Vorlage. Damit versichern Sie, dass Sie sich auf den richtigen Weg begeben."
checklist.define.tasks.description="Eine gute Projektbeschreibung hilft allen Team-Mitgliedern zu verstehen, was getan werden muss und wo die Ziele liegen."
checklist.define.tasks.defineTeam="Fügen Sie Ihre Team-Mitglieder hinzu um ihre Einsichten in das Projekt während der Definitionsphase zu sammeln."
checklist.define.tasks.createBlueprint="Definieren die Kernpunkte Ihres Projekts mit einer Vorlage. Helfen Sie jedem zu verstehen: Wer ist der Kunde? Was ist sein Problem? Was ist die Lösung?"
checklist.goals.description="Zeit, Ziele für Ihr Projekt zu setzen. Seien Sie so genau wie möglich und folgen Sie dem S.M.A.R.T. Prinzip."
checklist.goals.tasks.setGoals="Verwenden Sie Ziele, um Kennzahlen und Ergebnisse zu verfolgen. Erstellen Sie Kennzahlen zusammen mit Ihrem Team und den Inhabern."
checklist.timeline.description="Ausgestattet mit Zielen und Definitionen, kann man nun Meilensteine und eine Timeline erstellen. Das erlaubt Ihnen vorauszuplanen, den Fortschritt darzustellen und das Team auf der richtigen Schiene behalten."
checklist.timeline.tasks.createMilestones="Meilensteine in Leantime nehmen eine bestimmte Anzahl von Aufgaben, einen Zeitraum und fungieren damit als Sprungbrett zum Ziel. Erstellen Sie 3-5 Meilensteine, welche ungefähr einen Zeitraum von 3-6 Monaten umfassen."
checklist.implementation.description="Teilen Sie die Arbeit in Aufgaben auf und starten Sie den Aufbau"
checklist.implementation.tasks.createTasks="Fangen Sie von hinten an und erstellen Sie alle Aufgaben und Unteraufgaben an die Sie denken können. Je kleiner die Aufgaben sind, desto wahrscheinlicher ist es, dass Ihre Schätzungen korrekt sind."
checklist.implementation.tasks.finish80percent="Verfolgen Sie Ihren Fortschritt unter Berichte, Schliessen Sie 80% Ihrer Aufgaben ab und Sie sind fast am Ziel. Sie schaffen das!"
