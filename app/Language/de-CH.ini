text.telegram_instructions="Diese Integration sendet Aktualisierungsbenachrichtigungen an einen Telegram-Chat.<br/>Erstellen Sie einen Bot mit <a href='https://core.telegram.org/bots#how-do-i-create-a-bot' target='_blank'>@BotFather</a> und fügen Sie den Token rechts ein. Schreiben Sie Ihrem Bot einmal eine Nachricht und klicken Sie auf Speichern, um den Chat automatisch zu erkennen – oder fügen Sie bei einer Gruppe mit aktivierten Themen die Chat-ID und Themen-ID der Gruppe direkt ein."
