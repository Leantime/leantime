text.help_dashboard_intro="Leantime ist darauf ausgelegt, Ihre Superkräfte zu stärken und Ihnen Ihren Fortschritt auf dem Weg zu Ihren Zielen zu zeigen.<br /><br />Die meisten von uns sind es gewohnt, Aufgabenlisten zu erstellen – wir möchten Sie aber bitten, darüber nachzudenken, was genau Sie erreichen möchten.<br /><br />1. Legen Sie eine Vision (Strategie) und Ihre Ziele fest<br />2. Definieren Sie die Arbeit, die Sie zu diesen Zielen führt<br />3. Und dann erreichen Sie sie, indem Sie Ihren Alltag mit Ihrem Dashboard „Meine Arbeit“ planen.<br />"
