headlines.dbm.welcome_to_board="Willkommen beim detaillierten Business-Model-Dashboard!"
text.dbm.helper_content="The <em>Detailed Business Model</em> will help you document your current organization, competitors, and the industry. It supports ensuring that your strategy is desirable, viable, and feasible. It typically builds upon and extends a <em>Lightweight Business Model</em> by considering additional details that are relevant for a firm's success.<br />You can find further details in chapter 3 of the book <a href='https://inov.at/dts'></em>Design Thinking for Strategy</em></a>.<br/>We recommend using the detailed business model when prototyping specific business ideas and want to ensure that they result in a desirable, viable, and feasible business."
