text.lbm.helper_content="Das <em>Vereinfachte Geschäftsmodell</em> hilft Ihnen, Ihre aktuelle Organisation, Ihre Wettbewerber und die Branche zu dokumentieren. Es unterstützt Sie dabei, den strategischen Fokus eines Unternehmens zu bestimmen, und legt die Grundlage für die Gestaltung neuartiger und wettbewerbsfähiger detaillierter Geschäftsmodelle.<br/>Wir empfehlen, die vereinfachte Variante des Business Model Canvas immer dann zu verwenden, wenn Sie die Einzelheiten des detaillierten oder des originalen Business Models nach Osterwalder nicht benötigen."
