tour.my_work.welcome_title="Willkommen zur Dashboard-Tour"
tour.my_work.welcome_text="Beginnen wir mit ein paar Grundlagen, damit Sie sich schnell in der Navigation und den verschiedenen Elementen von Leantime zurechtfinden."
tour.my_work.work_modes_title="Arbeitsmodi"
tour.my_work.work_modes_text="Die obere Navigation zeigt Ihnen den „Arbeitsmodus“, in dem Sie sich gerade befinden. Sie können sich in einem Projekt, in Ihrem persönlichen Arbeitsbereich oder im Unternehmensmodus befinden."
tour.my_work.left_nav_text="Die linke Navigation gliedert den aktuellen Arbeitsmodus und gibt Ihnen Zugriff auf verschiedene Bereiche. Alles, was hier angezeigt wird, gehört zum oben ausgewählten Arbeitsmodus."
tour.my_work.profile_bar_title="Meine Profilleiste"
tour.my_work.profile_bar_text="Hier finden Sie Links zu Ihrem Konto sowie Benachrichtigungen und die neuesten Nachrichten zu Leantime."
tour.my_work.widgets_title="Ihre Dashboard-Widgets"
tour.my_work.widgets_text="Ihr Dashboard ist in verschiedene Widgets unterteilt, die Ihnen gezielte Informationen zu Ihrer Arbeit anzeigen."
tour.my_work.customize_title="Dashboard anpassen"
tour.my_work.customize_text="Widgets lassen sich per Drag & Drop verschieben und in der Grösse ändern."
tour.my_work.todos_title="Meine To-Dos"
tour.my_work.todos_text="Das Widget „Meine To-Dos“ zeigt Ihnen alle Aufgaben, die Ihnen derzeit zugewiesen sind."
tour.my_work.group_todos_title="To-Dos gruppieren"
tour.my_work.group_todos_text="Mit den Dropdown-Menüs hier können Sie Ihre Aufgaben nach Projekt filtern oder nach Priorität, Status, Projekt oder Datum gruppieren."
tour.my_work.sort_todos_title="To-Dos sortieren"
tour.my_work.sort_todos_text="Jedes To-Do lässt sich per Drag & Drop verschieben, um seine Reihenfolge zu ändern. Sie können eine Aufgabe auch per Drag & Drop in den Kalender ziehen, um sie einzuplanen."
tour.my_work.timer_title="Timer starten"
tour.my_work.timer_text="Wenn Sie mit der Arbeit an einer Aufgabe beginnen möchten, klicken Sie einfach auf die Schaltfläche zum Starten des Timers."
tour.my_work.complete_task_title="Aufgabe abschliessen"
tour.my_work.complete_task_text="Sobald eine Aufgabe abgeschlossen ist, können Sie sie über das Status-Dropdown als erledigt markieren."
tour.my_work.add_tasks_title="Weitere Aufgaben hinzufügen"
tour.my_work.add_tasks_text="Sie können weitere Aufgaben hinzufügen, indem Sie in einem Abschnitt auf die Plus-Schaltfläche klicken oder das 3-Punkte-Menü neben einer Aufgabe verwenden."
tour.my_work.finish_text="Sie haben die Tour durch das Dashboard „Meine Arbeit“ abgeschlossen. Wechseln Sie zu <a href='%s/dashboard/show'>Ihrem Projekt</a>, um mehr über das Projektmanagement in Leantime zu erfahren."
tour.project_dashboard.menu_title="Projektmenü"
tour.project_dashboard.menu_text="Das Projektmenü gliedert Ihr Projekt in verschiedene Bereiche: <strong>Datenbereich</strong> – für alle Ihre Dateien und Informationen, <strong>Denken</strong> – zum Entwickeln von Strategien und Ideen und zum Definieren, <strong>Machen</strong> – zum Verwalten von Zielen, Meilensteinen und Aufgaben."
tour.project_dashboard.selector_title="Projektauswahl"
tour.project_dashboard.selector_text="Mit der Projektauswahl wechseln Sie zwischen Projekten. Das linke Menü zeigt alles, was zu Ihrem aktuellen Projekt gehört."
tour.project_dashboard.checklist_title="Checkliste"
tour.project_dashboard.checklist_text="Die Projekt-Checkliste zeigt Ihnen auf einen Blick, ob Ihr Projekt alle Informationen enthält, die für eine erfolgreiche Umsetzung nötig sind."
tour.project_dashboard.status_title="Schnelle Status-Updates"
tour.project_dashboard.status_text="Mit Status-Updates teilen Sie den Fortschritt Ihres Projekts schnell mit Ihrem Team – mithilfe der Farben Rot, Gelb und Grün. Der Status ist in der gesamten Anwendung sichtbar."
tour.project_dashboard.progress_title="Fortschritt"
tour.project_dashboard.progress_text="Die Fortschrittsanzeige zeigt Ihnen, wie viel Arbeit Sie bereits erledigt haben. Sie berücksichtigt unterschiedliche Aufgabengrössen, die Teamgeschwindigkeit und die Projektmeilensteine."
tour.project_dashboard.latest_tasks_title="Neueste Aufgaben"
tour.project_dashboard.latest_tasks_text="Die Liste der neuesten Aufgaben zeigt Ihnen die zuletzt zu Ihrem Projekt hinzugefügten Aufgaben und kann als Projekt-Posteingang genutzt werden."
tour.project_dashboard.team_text="Im Team-Bereich sehen Sie die Mitglieder dieses Projekts."
tour.project_dashboard.finish_text="Sie haben die Tour durch das Projekt-Dashboard abgeschlossen. Öffnen Sie die <a href='%s/tickets/showKanban'>Aufgaben</a>, um mehr über die verschiedenen Möglichkeiten zu erfahren, Ihre Aufgaben in Leantime zu verwalten."
tour.kanban_board.overview_title="Ihr Kanban-Board"
tour.kanban_board.overview_text="Das ist Ihr Kanban-Board. Es hilft Ihnen, Ihre Arbeit zu visualisieren und die Menge gleichzeitig laufender Arbeit zu begrenzen."
tour.kanban_board.workflow_title="Arbeitsablauf"
tour.kanban_board.workflow_text="Aufgaben wandern mit ihrem Fortschritt von links nach rechts. Ziehen Sie Karten per Drag & Drop, um ihren Status zu aktualisieren."
tour.kanban_board.columns_title="Flexible Spalten"
tour.kanban_board.columns_text="Über das 3-Punkte-Menü können Sie Spalten hinzufügen, entfernen und umbenennen."
tour.kanban_board.filter_title="Aufgaben filtern"
tour.kanban_board.filter_text="Sie können Ihre Aufgaben nach verschiedenen Feldern wie Priorität, Status, Projekt oder Datum filtern."
tour.kanban_board.swimlanes_text="Zusätzlich können Sie Ihre Aufgaben gruppieren, um Kanban-Swimlanes zu erstellen. So können Sie Ihre Arbeit nach Teammitgliedern, Priorität oder Meilensteinen visualisieren."
tour.kanban_board.sprints_text="Wenn Sie Ihre Arbeit in Sprints organisieren, können Sie hier über das Dropdown-Menü Sprints auswählen, erstellen und aktualisieren."
tour.kanban_board.finish_text="Damit ist die Kanban-Tour abgeschlossen. Öffnen Sie die <a href='%s/tickets/roadmap'>Meilensteine</a>, um zu erfahren, wie Sie Meilensteine in Leantime erstellen und verwalten."
tour.milestones.overview_title="Meilensteine"
tour.milestones.overview_text="Mit Meilensteinen verfolgen Sie wichtige Ergebnisse und Projektphasen."
tour.milestones.drag_title="Ziehen & Sortieren"
tour.milestones.drag_text="Jeder Balken steht für einen Meilenstein. Sie können die Balken entlang der Zeitleiste verschieben, neu anordnen und in der Grösse ändern. Alles, was Sie auf dieser Seite tun, aktualisiert die zeitliche Planung Ihrer Meilensteine."
tour.milestones.filter_text="Sie können Ihre Meilensteine filtern und sich auch die zugehörigen Aufgaben anzeigen lassen."
tour.milestones.timeframes_title="Zeiträume"
tour.milestones.timeframes_text="Sie können den Zeitraum der Zeitleisten-Ansicht ändern, um mehr vom Jahr zu sehen oder bis auf die einzelnen Tage herunterzugehen."
tour.milestones.finish_text="Damit ist die Meilenstein-Tour abgeschlossen. Öffnen Sie die <a href='%s/goalcanvas/dashboard'>Ziele</a>, um zu erfahren, wie Sie Ziele in Leantime erstellen und verwalten."
tour.goals.overview_title="Ziele"
tour.goals.overview_text="Mit Zielen verfolgen Sie die messbare Wirkung Ihrer Projekte."
tour.goals.parts_title="Zielsetzungen & Kennzahlen"
tour.goals.parts_text="Jedes Ziel besteht aus einer Zielsetzung (was Sie erreichen möchten) und einer Kennzahl (wie Sie es messen)."
tour.goals.progress_title="Zielfortschritt"
tour.goals.progress_text="Wenn Sie die Kennzahlen Ihrer Ziele aktualisieren, zeigt Ihnen der Fortschrittsbalken, wie weit Sie bereits sind."
tour.goals.milestones_title="Meilensteine & Ziele"
tour.goals.milestones_text="Sie können Ziele mit Meilensteinen verknüpfen, um den Fortschritt Ihrer Ziele auf Aufgabenebene zu verfolgen. So erkennen Sie Lücken in Ihrem Projektplan."
tour.goals.finish_text="Damit ist die Ziele-Tour abgeschlossen. Meilensteine, Ziele und Aufgaben sind die grundlegenden Bausteine in Leantime. Nutzen Sie sie, um Ihre Arbeit in überschaubare Abschnitte zu gliedern. Öffnen Sie das <a href='%s/tickets/showKanban'>Kanban-Board</a>, um Ihre Aufgaben zu überprüfen."
