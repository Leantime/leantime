text.full_lean_canvas_helper_content="Das vollständige Recherche-Board führt Sie durch den gesamten Prozess der Ideenvalidierung.<br/>Auf dieser Seite gehen Sie noch einmal auf Ihr Kundensegment, das Problem und die Lösung ein (keine Sorge: Wenn Sie das bereits im einfachen Board ausgefüllt haben, sehen Sie es hier wieder!).<br/>Danach geht es weiter mit der klaren Wertvorstellung (Was macht Ihre Idee besser als andere Angebote?),<br/>den Vertriebskanälen (Wie kommen Kunden zu Ihrer Lösung?)<br/>den Einnahmequellen (Wie verdient Ihre Lösung Geld?)<br/>der Kostenstruktur (Wie viel ist Ihre Lösung wert?), den Schlüsselkennzahlen (Wie messen Sie Erfolg?)<br/>und dem unfairen Vorteil (Was hebt Sie von der Konkurrenz ab?)<br/>Die Antworten auf diese Fragen sollen den Erfolg fördern, Fehlschläge verringern und es Ihnen ermöglichen, Ihre Annahmen zu verfolgen und zu validieren.<br/>Bei Lean geht es darum, Verschwendung zu vermeiden und Produkte, Shops und Lösungen zu entwickeln, die Ihre Kunden brauchen."
