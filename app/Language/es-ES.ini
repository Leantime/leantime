text.my_work_dashboard_intro="Tu panel Mi trabajo pone el foco en todo lo que importa.<br/>Tu trabajo más importante está ahora en primer plano, organizado solo para ti y para la forma en que mejor funciona tu cerebro.<br/><br/>Desde tareas rápidas hasta objetivos ambiciosos, todo lo que necesitas está aquí. Este es tu espacio para capturar ideas, seguir tu progreso y celebrar los logros por el camino."
text.blueprints_intro="Los modelos son tu oportunidad para dar sentido a todos los datos. Leantime ofrece diversas herramientas y lienzos para definir el contexto de tu proyecto mediante lienzos de modelo de negocio, análisis DAFO o mapas de empatía.<br/><br/>Si no sabes por dónde empezar, te recomendamos crear un «lienzo de valor de proyecto». Este lienzo responderá a las preguntas más importantes de tu proyecto: ¿Quién es tu cliente?<br/>¿Qué problema estás resolviendo?<br/>¿Cuál es tu solución?<br/>¿Qué ventaja ofrece tu solución frente a la competencia?<br/>"
text.goals_tour_intro="Los objetivos te permiten dividir tu proyecto en partes alcanzables, medibles y accionables.<br/>Mientras que los hitos se centran en la ejecución, los objetivos tratan sobre las métricas que quieres alcanzar.<br/>Cada objetivo debe tener un propósito claro (lo que quieres lograr) y debe poder medirse fácilmente con una sola métrica.<br/><br/>Cuando tengas un objetivo, puedes asignarle hitos para dividirlo en tareas ejecutables.<br/>"
text.project_dashboard_tour_intro="Los proyectos de Leantime son espacios de trabajo colaborativos donde tú y tu equipo organizáis, seguís y entregáis el trabajo de forma eficiente. Cada proyecto sirve como contenedor de objetivos, tareas e hitos relacionados, y te permite supervisar el progreso desde un único lugar.<br/><br/>Tanto si gestionas trabajo, estudios o iniciativas personales, los proyectos de Leantime te dan la estructura y las herramientas necesarias para convertir las ideas en resultados de éxito."
text.wiki_tour_intro="Nuestros documentos te permiten escribir y compartir documentación con tu equipo. Puedes crear varios espacios para organizar tu documentación por equipos, áreas o categorías.<br/>Crea documentos para compartir conocimientos, procesos y procedimientos. También puedes crear un documento para compartir un enlace a un archivo o a una carpeta de tu almacenamiento en la nube.<br/>"
text.extend_leantime_latest_plugins="Amplía Leantime con nuestros últimos plugins."
support.headline_help_us_build="¡Ayúdanos a construir un futuro en el que todas las mentes prosperen!"
support.intro_text_1="La mayoría de las herramientas de productividad dan por hecho que todo el mundo piensa igual: de forma lineal, con una concentración perfecta y motivado por plazos arbitrarios. Tanto si tienes TDAH y necesitas la dopamina de completar tareas, como si eres autista y necesitas una estructura constante, tienes dislexia y piensas de forma espacial, o simplemente estás harto de herramientas que no encajan con cómo funciona realmente tu cerebro, probablemente hayas renunciado por completo a la gestión de proyectos."
support.intro_text_2="Estamos creando Leantime para mentes que funcionan de otra manera. Eso incluye a los cerebros neurodivergentes, pero también a cualquiera que haya sentido alguna vez que las herramientas existentes van en contra de su forma natural de pensar."
