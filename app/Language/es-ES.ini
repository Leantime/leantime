text.lean.helper_content="El lean canvas te llevará a través de todo el proceso de validación de tu nueva idea de negocio y/o producto.<br/>Abordarás tu <em>segmento de clientes</em>, <em>problema, solución</em>.<br/>Desde ahí, te moverás a tu <em>propuesta de valor única</em> (¿qué hace tu idea mejor que otras ofertas?), tus <em>canales de distribución</em> (¿cómo llevarás tu solución a tus clientes?), tus <em>fuentes de ingresos</em> (¿cómo hará dinero tu solución?), tu <em>estructura de costes</em> (¿cuánto vale tu solución?), <em>métricas clave</em> (¿cómo medirás el éxito?), y tu <em>Ventaja injusta</em> (¿qué tienes que te ayudará a superar la competencia?)<br/>Las respuestas a estas preguntas están diseñadas para promover el éxito, mitigar el fracaso y permitirte realizar un seguimiento y validar tus suposiciones. Ser lean significa eliminar los despilfarros y trabajar para crear productos, negocios y soluciones que sus clientes necesiten."
text.lean.disclaimer="Lean Canvas está adaptado de <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> y tiene licencia <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Una vez que te sientas cómodo con tu lean canvas, ve al</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Planificador del roadmap</a>"


