tour.my_work.welcome_title="Bienvenido/a al tour del panel"
tour.my_work.welcome_text="Empecemos con algunos conceptos básicos para que te familiarices con la navegación y los distintos elementos de Leantime."
tour.my_work.work_modes_title="Modos de trabajo"
tour.my_work.work_modes_text="La navegación superior muestra el «modo de trabajo» en el que te encuentras. Puedes estar dentro de un proyecto, en tu área de trabajo personal o en el modo empresa."
tour.my_work.left_nav_text="La navegación izquierda desglosa el modo de trabajo actual y te da acceso a sus distintas áreas. Todo lo que ves aquí forma parte del modo de trabajo seleccionado arriba."
tour.my_work.profile_bar_title="Mi barra de perfil"
tour.my_work.profile_bar_text="Aquí encontrarás enlaces a tu cuenta, así como las notificaciones y las últimas novedades de Leantime."
tour.my_work.widgets_title="Los widgets de tu panel"
tour.my_work.widgets_text="Tu panel se divide en varios widgets que te muestran información concreta sobre tu trabajo."
tour.my_work.customize_title="Personaliza tu panel"
tour.my_work.customize_text="Puedes cambiar el tamaño de los widgets y moverlos arrastrándolos y soltándolos."
tour.my_work.todos_title="Mis tareas"
tour.my_work.todos_text="El widget Mis tareas te muestra todas las tareas que tienes asignadas actualmente."
tour.my_work.group_todos_title="Agrupar tareas"
tour.my_work.group_todos_text="Puedes usar estos desplegables para filtrar tus tareas por proyecto o agruparlas por prioridad, estado, proyecto o fechas."
tour.my_work.sort_todos_title="Ordenar tareas"
tour.my_work.sort_todos_text="Puedes arrastrar y soltar cada tarea para cambiar su orden. También puedes arrastrar una tarea al calendario para programarla."
tour.my_work.timer_title="Inicia el temporizador"
tour.my_work.timer_text="Cuando quieras empezar a trabajar en una tarea, solo tienes que hacer clic en el botón para iniciar el temporizador."
tour.my_work.complete_task_title="Completa una tarea"
tour.my_work.complete_task_text="Cuando hayas terminado una tarea, puedes marcarla como hecha haciendo clic en el desplegable de estado."
tour.my_work.add_tasks_title="Añade más tareas"
tour.my_work.add_tasks_text="Puedes añadir más tareas haciendo clic en el botón «+» de cada sección o usando el menú de tres puntos junto a cada tarea."
tour.my_work.finish_text="Has completado el tour del panel Mi trabajo. Ve a <a href='%s/dashboard/show'>tu proyecto</a> para saber más sobre la gestión de proyectos en Leantime."
tour.project_dashboard.menu_title="Menú del proyecto"
tour.project_dashboard.menu_text="El menú del proyecto organiza tu proyecto en distintas secciones: <strong>Zona de datos</strong>, para alojar todos tus archivos e información; <strong>Pensar</strong>, para elaborar la estrategia, generar ideas y definir; <strong>Hacer</strong>, para gestionar objetivos, hitos y tareas."
tour.project_dashboard.selector_title="Selector de proyectos"
tour.project_dashboard.selector_text="Usa el selector de proyectos para cambiar de un proyecto a otro. El menú izquierdo muestra todo lo relacionado con tu proyecto actual."
tour.project_dashboard.checklist_title="Lista de comprobación"
tour.project_dashboard.checklist_text="La lista de comprobación del proyecto es una referencia rápida para ver si tu proyecto contiene toda la información necesaria para ejecutarse con éxito."
tour.project_dashboard.status_title="Actualizaciones rápidas de estado"
tour.project_dashboard.status_text="Puedes usar las actualizaciones de estado para compartir rápidamente con tu equipo el progreso de tu proyecto mediante los colores rojo, amarillo y verde. El estado será visible en toda la aplicación."
tour.project_dashboard.progress_title="Progreso"
tour.project_dashboard.progress_text="El indicador de progreso del proyecto te muestra cuánto trabajo has completado. Tiene en cuenta los distintos tamaños de las tareas, la velocidad del equipo y los hitos del proyecto."
tour.project_dashboard.latest_tasks_title="Últimas tareas"
tour.project_dashboard.latest_tasks_text="La lista de últimas tareas te muestra las tareas añadidas más recientemente a tu proyecto y puede usarse como bandeja de entrada del proyecto."
tour.project_dashboard.team_title="Equipo"
tour.project_dashboard.team_text="El recuadro del equipo te muestra los miembros de este proyecto."
tour.project_dashboard.finish_text="Has completado el tour del panel del proyecto. Ve a <a href='%s/tickets/showKanban'>Tareas</a> para conocer las distintas formas de gestionar tus tareas en Leantime."
tour.kanban_board.overview_title="Tu tablero Kanban"
tour.kanban_board.overview_text="Este es tu tablero Kanban. Te ayuda a visualizar tu trabajo y a limitar el trabajo en curso."
tour.kanban_board.workflow_title="Flujo de trabajo"
tour.kanban_board.workflow_text="Las tareas avanzan de izquierda a derecha a medida que progresan. Arrastra y suelta las tarjetas para actualizar su estado."
tour.kanban_board.columns_title="Columnas flexibles"
tour.kanban_board.columns_text="Con el menú de tres puntos puedes añadir, eliminar y renombrar columnas."
tour.kanban_board.filter_title="Filtrar tareas"
tour.kanban_board.filter_text="Puedes filtrar tus tareas por distintos campos, como prioridad, estado, proyecto o fechas."
tour.kanban_board.swimlanes_title="Calles"
tour.kanban_board.swimlanes_text="Además, puedes agrupar tus tareas para crear calles en el tablero Kanban. Así puedes visualizar tu trabajo por miembros del equipo, prioridad o hitos."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Si organizas tu trabajo en sprints, puedes usar este desplegable para seleccionar, crear y actualizar sprints."
tour.kanban_board.finish_text="Con esto termina el tour de Kanban. Ve a <a href='%s/tickets/roadmap'>Hitos</a> para aprender a crear y gestionar hitos en Leantime."
tour.milestones.overview_title="Hitos"
tour.milestones.overview_text="Los hitos te ayudan a seguir los resultados principales y las fases del proyecto."
tour.milestones.drag_title="Arrastrar y ordenar"
tour.milestones.drag_text="Cada barra representa un hito. Puedes arrastrarlas a lo largo de la línea de tiempo, reordenarlas y cambiar su tamaño. Todo lo que hagas en esta pantalla actualiza las fechas de tus hitos."
tour.milestones.filter_title="Filtrar"
tour.milestones.filter_text="Puedes filtrar tus hitos y ver también las tareas que forman parte de ellos."
tour.milestones.timeframes_title="Periodos de tiempo"
tour.milestones.timeframes_text="Puedes cambiar el periodo de la vista de línea de tiempo para ver una parte mayor del año o profundizar en un desglose diario."
tour.milestones.finish_text="Con esto termina el tour de hitos. Ve a <a href='%s/goalcanvas/dashboard'>Objetivos</a> para aprender a crear y gestionar objetivos en Leantime."
tour.goals.overview_title="Objetivos"
tour.goals.overview_text="Los objetivos te ayudan a seguir el impacto medible de tus proyectos."
tour.goals.parts_title="Propósitos y métricas"
tour.goals.parts_text="Cada objetivo se compone de un propósito (lo que intentas conseguir) y una métrica (cómo lo vas a medir)."
tour.goals.progress_title="Progreso del objetivo"
tour.goals.progress_text="A medida que actualices las métricas de tus objetivos, la barra de progreso te mostrará cuánto has avanzado."
tour.goals.milestones_title="Hitos y objetivos"
tour.goals.milestones_text="Puedes vincular objetivos a hitos para seguir el progreso de tus objetivos a nivel de tarea. Esto te ayuda a detectar carencias en el plan del proyecto."
tour.goals.finish_text="Con esto termina el tour de objetivos. Los hitos, los objetivos y las tareas son los componentes básicos de Leantime. Úsalos para dividir tu trabajo en partes manejables. Ve al <a href='%s/tickets/showKanban'>tablero Kanban</a> para revisar tus tareas."
