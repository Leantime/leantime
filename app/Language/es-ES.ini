support.marcel_name="👋 Soy Marcel"
support.marcel_tagline="Inmigrante alemán, padre de una hija autista y con TDAH."
support.marcel_bio_1="Las herramientas tradicionales de gestión de proyectos nunca me convencieron. Parecían creadas por mentes neurotípicas para mentes neurotípicas. Cuando trabajaba como freelance y me costaba mantener organizados los proyectos de mis clientes, empecé a crear algo que funcionara con mi cerebro y no en su contra."
support.marcel_bio_2="Lo que empezó como una solución personal se convirtió en Leantime cuando me di cuenta de que millones de personas necesitaban lo mismo."
support.gloria_name="👋 Y yo soy Gloria"
support.gloria_tagline="Exenfermera de urgencias reconvertida en product manager y emprendedora hispana de primera generación."
support.gloria_bio_1="Pasé años en entornos médicos de mucha presión donde la organización literalmente salva vidas. Pero cuando monté mi propio negocio, las herramientas de proyectos tradicionales me resultaban abrumadoras y desconectadas de cómo pienso y trabajo realmente."
support.gloria_bio_2="Mi formación en ciencias del comportamiento e investigación sobre la motivación guía cómo creamos funciones que no solo organizan tareas, sino que hacen que de verdad quieras completarlas."
support.closing_text="Podemos crear un mundo en el que nadie tenga que pelearse con sus herramientas para hacer un gran trabajo. Tu patrocinio financia un futuro en el que el software se adapta a la diversidad humana, y no al revés."
