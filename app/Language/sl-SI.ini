label.onboarding_default_project_name="Moj projekt"
text.onboarding_default_project_details="Dobrodošli v svojem prvem projektu v Leantime!<br />To je vaš prostor za organiziranje opravil, spremljanje ciljev in načrtovanje dela. Tukaj lahko karkoli spremenite ali ustvarite dodatne projekte, ko boste rasli. Ta projekt je namenjen samo vam, da začnete"
label.onboarding_milestone_getting_started="Prvi koraki"
label.onboarding_task_community_chat="Pridružite se klepetu naše skupnosti"
text.onboarding_task_community_chat="Klepet naše skupnosti je odličen vir za postavljanje vprašanj in pridobivanje povratnih informacij o nastavitvi projekta. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Klepet skupnosti</a>"
label.onboarding_task_invite_team="Povabite člane ekipe"
text.onboarding_task_invite_team="Ne glede na to, ali delate z nekom ali potrebujete le nekoga, ki vas bo držal k odgovornosti – skupna uporaba Leantime vam pomaga ostati na pravi poti in motivirani. <a href='%s'>Upravljanje uporabnikov</a>"
label.onboarding_task_project_structure="Izvedite več o strukturi projektov v Leantime"
text.onboarding_task_project_structure="V naši dokumentaciji pomoči je veliko dodatnih virov. Če želite izvedeti več o strukturi projektov v Leantime in dobrih praksah, obiščite: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Ustvarite cilj"
text.onboarding_task_create_goal="Cilji so namenjeni spremljanju in merjenju dolgoročnih prizadevanj. Biti morajo merljivi z meritvami, ki jih lahko redno posodabljate. Cilje in mejnike lahko povežete, da poleg napredka meritev spremljate tudi napredek izvedbe. <a href='%s'>Projektni cilji</a>"
label.onboarding_task_create_milestone="Ustvarite mejnik"
text.onboarding_task_create_milestone="Z mejniki lahko faze projektov razdelite na zaključene rezultate. Vsak mejnik ima začetni in končni datum ter naj bi prinesel določen izid. <a href='%s'>Mejniki projekta</a>"
label.onboarding_task_personal_project="Raziščite svoj osebni projekt"
text.onboarding_task_personal_project="Vaš osebni projekt je prostor, kjer lahko organizirate svoja opravila, cilje in delo. Do njega dostopate prek izbirnika projektov na vrhu ali s klikom na to povezavo: <a href='%s'>Moj projekt</a>"
label.onboarding_task_complete_profile="Dopolnite svoj profil Leantime"
text.onboarding_task_complete_profile="Posodobite profilno sliko in izpolnite delovne nastavitve, da prilagodite svojo izkušnjo. <a href='%s'>Moj profil</a>"
