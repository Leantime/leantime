text.mattermost_instructions=" Ta integracija bo obvestila o posodobitvah objavljala v kanalu po vaši izbiri.<br/>Sledite navodilom <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>tukaj, da pridobite URL dohodnega webhooka</a> iz storitve Mattermost. Nato prilepite povezavo v obrazec na desni in kliknite Shrani."
text.slack_instructions="Ta integracija bo obvestila o posodobitvah objavljala v kanalu po vaši izbiri.<br/>Sledite navodilom <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>tukaj, da pridobite URL dohodnega webhooka</a> iz storitve Slack. Nato prilepite povezavo v obrazec na desni in kliknite Shrani."
text.choose_access_for_users="Označite ali odznačite uporabnike, ki jih želite dodati/odstraniti. Več o vlogah lahko izveste na <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Predviden zaključek do"
text.zulip_instructions="Ta integracija bo obvestila o posodobitvah objavljala v tok in temo po vaši izbiri.<br/>Sledite navodilom <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>tukaj, da ustvarite novega bota</a>. Nato prilepite podatke v obrazec na desni in kliknite Shrani."
text.discord_instructions="Ta integracija bo obvestila o posodobitvah objavljala v kanalu po vaši izbiri.<br/>Sledite navodilom <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>tukaj, da ustvarite nove webhooke</a>, nato prilepite povezave v polja na desni in kliknite Shrani."
