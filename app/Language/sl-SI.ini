text.no_users_assigned_to_this_client="Tej stranki še ni bil dodan noben kontakt. Uporabnike dodajte in dodelite <a href='/users/showAll'>tukaj</a>"
text.confirm_delete_timesheet="Ali je treba časovnico res izbrisati?"
text.timer_on_todo="<span class='head-icon fa fa-stop'></span> %1$s časovnik: %2$s"
text.these_are_system_wide_settings="To so sistemske nastavitve, ki vplivajo na videz in občutek vaše izkušnje z Leantime."
text.company_name_helper="Pojavlja se v naslovu strani in v e-poštnih sporočilih"
text.advanced_boards_helper_content="Ideje se razvijajo, rastejo in zorijo. Tukaj jim lahko sledite.<br/>Kartice idej premikajte iz enega stolpca v drugega, da prikažete njihovo trenutno stanje.<br/>To je dobro mesto za začetek raziskav, razvoj prototipov in preverjanje teh prototipov z nekaj strankami, preden se lotite izvedbe."
text.backlog_helper_content="Zaostanki so dom vseh vaših opravil – tistih, na katerih trenutno delate, in tistih, na katerih nameravate delati.<br/><br/>Za napredek pri dokončevanju zaostankov priporočamo delo v kratkih ponovitvah – sprintih.<br/>Sprinti so dvotedenski časovni intervali, ki vam omogočajo, da se osredotočite na manjše, izvedljive dele dela.<br/>Ob koncu dveh tednov bi morali imeti nekaj za „predstavitev“. Nekaj, kar prinaša vrednost vašim uporabnikom ali strankam.<br/><br/>Na tem zaslonu lahko organizirate in upravljate seznam opravil, z vlečenjem in spuščanjem določite prednost zaostankov ter elemente iz zaostankov premaknete v trenutni sprint.<br/>Želite več informacij? Začnite voden ogled ali zaprite okno in začnite!"
text.glad_youre_here="Veseli nas, da ste tukaj. Vzemimo si minuto, da se spoznamo."
text.business_research_section="Naš razdelek Poslovne raziskave je nov dom za vaše ideje. Zasnovan je tako, da vas vodi skozi korake razvoja strank, raziskovanja problemov in snovanja rešitev."
text.our_roadmap_design="Naš časovni načrt vas vodi od manjših, obvladljivih mejnikov do celovite izvedbe. Načrtujte mejnike, dolge približno 3 mesece, in z njimi ostanite na pravi poti."
text.this_is_where_you_spend_most_time="Tukaj boste preživeli večino časa – pri delu. Načrtujte dvotedenske sprinte in jih uspešno izvedite s tablo Kanban in orodji za zaostanke. Z retrospektivami se izboljšajte za naslednji sprint."
text.idea_board_helper_content="Tukaj zbirate vse svoje ideje. O novih se pogovorite z ekipo in jim pripnite mejnike, da vidite napredek pri svojih idejah."
text.kanban_helper_content="Kanban je japonska beseda za „kartico“. Table Kanban so v 40. letih prejšnjega stoletja začeli uporabljati inženirji podjetja Toyota v okviru vitke proizvodnje.<br/>Uporabljajo se za hitro vizualno deljenje informacij in napredka dela.<br/>Table Kanban so uporabne za vizualizacijo dela in stanja, upravljanje aktivnega dela oziroma dela v teku, upravljanje poteka dela in hitro ukrepanje za vitke izboljšave."
text.my_timesheets_helper_content="Časovnice so mesto za beleženje dejansko opravljenih ur na opravilu.<br/>To je koristno za obračun, pa tudi za preverjanje, kako dobro vnaprej načrtujete svoje naloge.<br/>Sčasoma lahko Leantime prilagodi roke, da upošteva odstopanja pri načrtovanju."
text.new_project_helper_content="<p>Tukaj boste opisali in opredelili projekt ter določili njegove parametre. To je pomembno, saj celotni<br/>ekipi sporoča, kakšne so prednostne naloge, pričakovanja in smernice projekta.</p><p><br/><em>Na kaj morate pomisliti: štiri načela.<br/>Bodite jasni, jedrnati, celoviti in verodostojni.<br/><br/></em></p><p>Če ta načela upoštevate v opisih projektov, so vsi na isti strani, tveganje za napake ali zdrse pa se zmanjša.</p><br/>Čas je, da začnete!<br/><br/>"
text.not_found_helper_content="<p>Za to stran še nimamo vsebine.<br/>Za več informacij o tem, kaj lahko počnete tukaj, uporabite povezavo „Potrebujete pomoč“ na dnu strani.</p>"
text.retros_helper_content="<p>Retrospektive so kratki razmisleki o delu, delovanju ekipe in seveda napredku.<br/>Tukaj se lahko ekipa za trenutek osredotoči na to, kaj je šlo dobro, kaj ni šlo dobro in kaj bi lahko naslednjič naredili drugače.<br/>Priporočamo, da pregledni sestanek izvajate v rednih intervalih ali vsaj ob koncu vsakega mejnika.<br/></p>"
text.roadmap_helper_content="<p>Časovni načrti pomagajo razdeliti velike projekte na manjše in bolj obvladljive dele.<br/><br/></p><p>Za pripravo časovnega načrta priporočamo, da določite mejnike, ki jih je mogoče doseči v 3 mesecih.</p><p>Mejniki so kontrolne točke na poti do dokončanja projekta.<br/>Preprosto povedano: če se odpravite na dolgo potovanje z avtomobilom čez državo, je lahko vsaka pokrajina, skozi katero peljete, en mejnik.<br/><br/>Za začetek kliknite „Dodaj mejnik“ zgoraj levo. Datum nastavite na tem zavihku ali neposredno v grafikonu časovnega načrta, tako da mejnik kliknete in povlečete po koledarju.</p>"
text.show_clients_helper_content="<p>Stranke/izdelki razvrščajo vaše projekte v kategorije in vam omogočajo ločevanje različnih skupin.<br/><br/></p><p>Kot svetovalec že sodelujete s strankami in tukaj jih lahko organizirate.</p><p>Če ste produktna ekipa, lahko ta razdelek uporabite za organizacijo in ločevanje oddelkov (marketing, prodaja, operativa itd.).</p>"
text.show_projects_helper_content="<p>Projekti so srce vašega poslovanja in Leantime! Spremembe, razvoj, cilji in vse, kar lahko zgradite ali si zamislite, vključuje projekte.<br/>Upravljanje projektov je preprosto postopek, s katerim zagotovite, da so projekti izvedeni pravočasno, pravilno in z resnično poslovno vrednostjo.<br/><br/>Tukaj bodo živeli vaši projekti. Na strani s projekti lahko ustvarite projekt ter hitro vidite število opravil, ure, proračun in stranko, povezano s projektom.<br/><br/>To stran uporabite za hiter pregled vseh svojih projektov.<br/><br/></p>"
text.new_db_version="Nameščena je bila nova različica. Za uporabo Leantime morate posodobiti podatkovno bazo.<br/><br/><strong>Pred to posodobitvijo obvezno naredite varnostno kopijo podatkovne baze!</strong><br/>To lahko traja nekaj minut."
text.update_was_successful="Posodobitev je bila uspešna, zdaj se lahko prijavite. <a href='%1$s'>Pojdi na prijavo</a>"
text.this_script_will_set_up_leantime="Ta skripta bo nastavila vašo podatkovno bazo in ustvarila skrbniški račun"
text.enter_new_password="Vnesite novo geslo, da ga ponastavite."
text.enter_email_address_to_reset="Vnesite svoj e-poštni naslov za ponastavitev gesla."
text.twoFA_qr="Skenirajte spodnjo kodo QR v svojo priljubljeno aplikacijo OTP/Google Authenticator"
text.twoFA_verify_code="Vnesite kodo, ki vam jo je generirala aplikacija OTP/Google Authenticator"
text.twoFA_already_enabled="Dvostopenjsko preverjanje pristnosti je že omogočeno za vaš račun in je obvezno za prijavo.<br/><br/>Če želite odstraniti dvostopenjsko preverjanje pristnosti, spodaj kliknite odstrani"
text.twoFA_enabled="Vaš račun ima omogočeno dvostopenjsko preverjanje pristnosti <strong></strong>."
text.twoFA_disabled="Vaš račun ima dvostopenjsko preverjanje pristnosti <strong>onemogočeno</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Upravljanje dvostopenjskega preverjanja pristnosti"
text.who_can_access="Izberite, kdo ima dovoljenje za ogled tega projekta. Privzeto bodo uporabniki podedovali vloge, ki so jim bile nastavljene. Te vloge lahko spremenite na zavihku »Ekipa«"
text.ical_export_description="Tukaj lahko ustvarite edinstven URL koledarja, s katerim lahko svoj koledar Leantime vključite v katero koli aplikacijo, ki podpira obliko „iCal“. "
text.you_ical_url="Vaš URL koledarja je spodaj. <br /> Upoštevajte, da lahko vsak, ki ima ta URL, dostopa do koledarja. Hranite ga na skrivnem kot geslo."
