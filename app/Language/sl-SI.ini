text.insights.helper_content="Tabla <em>Opazovanje / učenje – spoznanja</em> vam pomaga zbirati in strukturirati spoznanja iz štirih različnih virov (etnografska opazovanja, intervjuji, fokusne skupine in sekundarne raziskave) ter jih preoblikovati v znanje.<br/>Podpira fazi opazovanja in učenja, imenovani tudi empatija in opredelitev, v procesu oblikovalskega razmišljanja (Design Thinking).<br/>Tablo <em>Opazovanje / učenje – spoznanja</em> priporočamo uporabiti vsakič, ko zbirate in analizirate nova spoznanja, na primer za analizo tveganja, analizo okolja, odkrivanje trendov v panogi ali oblikovanje novih izdelkov in storitev."
