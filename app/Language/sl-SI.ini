tour.my_work.welcome_title="Dobrodošli v vodenem ogledu nadzorne plošče"
tour.my_work.welcome_text="Začnimo z nekaj osnovami, da se boste hitro znašli v navigaciji in različnih elementih v Leantime."
tour.my_work.work_modes_title="Delovni načini"
tour.my_work.work_modes_text="Zgornja navigacija prikazuje trenutni „delovni način“, v katerem ste. Lahko ste v projektu, v svojem osebnem delovnem prostoru ali v načinu Podjetje."
tour.my_work.left_nav_text="Leva navigacija razčleni trenutni delovni način in vam omogoča dostop do različnih področij. Vse, kar je prikazano tukaj, je del zgoraj izbranega delovnega načina."
tour.my_work.profile_bar_title="Moja profilna vrstica"
tour.my_work.profile_bar_text="Tukaj boste našli povezave do svojega računa ter obvestila in najnovejše novice o Leantime."
tour.my_work.widgets_title="Pripomočki na vaši nadzorni plošči"
tour.my_work.widgets_text="Vaša nadzorna plošča je razdeljena na različne pripomočke, ki prikazujejo osredotočene informacije o vašem delu."
tour.my_work.customize_title="Prilagodite svojo nadzorno ploščo"
tour.my_work.customize_text="Pripomočkom lahko spreminjate velikost in jih premikate s funkcijo povleci in spusti."
tour.my_work.todos_title="Moja opravila"
tour.my_work.todos_text="Pripomoček Moja opravila prikazuje vsa opravila, ki so vam trenutno dodeljena."
tour.my_work.group_todos_title="Združevanje opravil"
tour.my_work.group_todos_text="S spustnimi meniji tukaj lahko opravila filtrirate po projektu ali jih združite po prioriteti, stanju, projektu ali datumih."
tour.my_work.sort_todos_title="Razvrščanje opravil"
tour.my_work.sort_todos_text="Vsako opravilo lahko povlečete in spustite, da spremenite njegov vrstni red. Opravilo lahko povlečete tudi v koledar, da ga načrtujete."
tour.my_work.timer_title="Zaženite časovnik"
tour.my_work.timer_text="Ko ste pripravljeni na delo na opravilu, preprosto kliknite gumb za zagon časovnika."
tour.my_work.complete_task_title="Dokončajte opravilo"
tour.my_work.complete_task_text="Ko je opravilo dokončano, ga lahko označite kot končano s klikom na spustni meni stanja."
tour.my_work.add_tasks_title="Dodajte več opravil"
tour.my_work.add_tasks_text="Več opravil lahko dodate s klikom na gumb plus v vsakem razdelku ali z menijem s tremi pikami ob vsakem opravilu."
tour.my_work.finish_text="Zaključili ste voden ogled nadzorne plošče Moje delo. Pojdite na <a href='%s/dashboard/show'>svoj projekt</a> in izvedite več o upravljanju projektov v Leantime."
tour.project_dashboard.menu_title="Meni projekta"
tour.project_dashboard.menu_text="Meni projekta razdeli vaš projekt na različne razdelke: <strong>Podatkovna soba</strong> – za shranjevanje vseh vaših datotek in informacij, <strong>Razmišljanje</strong> – za načrtovanje strategije, snovanje idej in opredeljevanje, <strong>Ustvarjanje</strong> – za upravljanje ciljev, mejnikov in opravil."
tour.project_dashboard.selector_title="Izbirnik projektov"
tour.project_dashboard.selector_text="Z izbirnikom projektov lahko preskakujete med projekti. Levi meni prikazuje vse, kar je povezano z vašim trenutnim projektom."
tour.project_dashboard.checklist_title="Kontrolni seznam"
tour.project_dashboard.checklist_text="Kontrolni seznam projekta vam omogoča hiter pregled, ali vaš projekt vsebuje vse informacije, potrebne za uspešno izvedbo."
tour.project_dashboard.status_title="Hitre posodobitve stanja"
tour.project_dashboard.status_text="S posodobitvami stanja lahko z ekipo hitro delite napredek projekta z rdečo, rumeno in zeleno barvo. Stanje bo vidno v celotni aplikaciji."
tour.project_dashboard.progress_title="Napredek"
tour.project_dashboard.progress_text="Kazalnik napredka projekta prikazuje, koliko dela ste že opravili. Upošteva različne velikosti opravil, hitrost ekipe in mejnike projekta."
tour.project_dashboard.latest_tasks_title="Najnovejša opravila"
tour.project_dashboard.latest_tasks_text="Seznam najnovejših opravil prikazuje opravila, ki so bila nazadnje dodana v vaš projekt, in ga lahko uporabljate kot nabiralnik projekta."
tour.project_dashboard.team_title="Ekipa"
tour.project_dashboard.team_text="Polje Ekipa prikazuje člane tega projekta."
tour.project_dashboard.finish_text="Zaključili ste voden ogled nadzorne plošče projekta. Pojdite v razdelek <a href='%s/tickets/showKanban'>Opravila</a> in spoznajte različne načine upravljanja opravil v Leantime."
tour.kanban_board.overview_title="Vaša tabla Kanban"
tour.kanban_board.overview_text="To je vaša tabla Kanban. Pomaga vam vizualizirati delo in omejiti delo v teku."
tour.kanban_board.workflow_title="Potek dela"
tour.kanban_board.workflow_text="Opravila se z napredovanjem premikajo od leve proti desni. Povlecite in spustite kartice, da posodobite njihovo stanje."
tour.kanban_board.columns_title="Prilagodljivi stolpci"
tour.kanban_board.columns_text="Z menijem s tremi pikami lahko stolpce dodajate, odstranjujete in preimenujete."
tour.kanban_board.filter_title="Filtriranje opravil"
tour.kanban_board.filter_text="Opravila lahko filtrirate po različnih poljih, kot so prioriteta, stanje, projekt ali datumi."
tour.kanban_board.swimlanes_title="Plavalne steze"
tour.kanban_board.swimlanes_text="Opravila lahko tudi združite in tako ustvarite plavalne steze Kanban. Tako lahko delo vizualizirate po članih ekipe, prioriteti ali mejnikih."
tour.kanban_board.sprints_title="Sprinti"
tour.kanban_board.sprints_text="Če delo upravljate v sprintih, lahko s spustnim menijem tukaj izbirate, ustvarjate in posodabljate sprinte."
tour.kanban_board.finish_text="S tem je voden ogled table Kanban končan. Pojdite v razdelek <a href='%s/tickets/roadmap'>Mejniki</a> in spoznajte, kako v Leantime ustvarjate in upravljate mejnike."
tour.milestones.overview_title="Mejniki"
tour.milestones.overview_text="Mejniki vam pomagajo spremljati ključne rezultate in faze projekta."
tour.milestones.drag_title="Povleci in razvrsti"
tour.milestones.drag_text="Vsak trak predstavlja en mejnik. Mejnike lahko vlečete po časovni premici, jim spreminjate vrstni red in velikost. Vse, kar storite na tem zaslonu, posodobi časovni potek vaših mejnikov."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Mejnike lahko filtrirate in si ogledate tudi opravila, ki so del njih."
tour.milestones.timeframes_title="Časovni okviri"
tour.milestones.timeframes_text="Časovni okvir pogleda časovne premice lahko spremenite, da vidite večji del leta ali se poglobite v prikaz po dnevih."
tour.milestones.finish_text="S tem je voden ogled mejnikov končan. Pojdite v razdelek <a href='%s/goalcanvas/dashboard'>Cilji</a> in spoznajte, kako v Leantime ustvarjate in upravljate cilje."
tour.goals.overview_title="Cilji"
tour.goals.overview_text="Cilji vam pomagajo spremljati merljiv učinek vaših projektov."
tour.goals.parts_title="Nameni in meritve"
tour.goals.parts_text="Vsak cilj sestavljata namen (kaj želite doseči) in meritev (kako boste to merili)."
tour.goals.progress_title="Napredek cilja"
tour.goals.progress_text="Ko posodabljate meritve ciljev, vrstica napredka prikazuje, kako daleč ste že prišli."
tour.goals.milestones_title="Mejniki in cilji"
tour.goals.milestones_text="Cilje lahko povežete z mejniki in tako spremljate napredek svojih ciljev na ravni opravil. To vam pomaga odkriti vrzeli v načrtu projekta."
tour.goals.finish_text="S tem je voden ogled ciljev končan. Mejniki, cilji in opravila so osnovni gradniki v Leantime. Z njimi razdelite delo na obvladljive dele. Pojdite na <a href='%s/tickets/showKanban'>tablo Kanban</a> in preglejte svoja opravila."
