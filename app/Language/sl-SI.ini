support.marcel_name="👋 Sem Marcel"
support.marcel_tagline="Nemški priseljenec, oče avtistične hčerke, tudi sam pa živim z ADHD."
support.marcel_bio_1="Tradicionalna orodja za upravljanje projektov mi nikoli niso ustrezala. Zdelo se mi je, da so jih zgradili nevrotipični umi za nevrotipične ume. Ko sem delal kot samostojni podjetnik in se trudil ohranjati red v projektih strank, sem začel graditi nekaj, kar deluje z mojimi možgani, ne proti njim."
support.marcel_bio_2="Kar se je začelo kot osebna rešitev, je postalo Leantime, ko sem spoznal, da milijoni drugih potrebujejo isto."
support.gloria_name="👋 Jaz pa sem Gloria"
support.gloria_tagline="Nekdanja medicinska sestra na urgenci, zdaj produktna vodja, podjetnica hispanskega rodu v prvi generaciji."
support.gloria_bio_1="Leta sem preživela v zahtevnih zdravstvenih okoljih, kjer organizacija dobesedno rešuje življenja. Ko pa sem ustanovila lastno podjetje, so se mi tradicionalna projektna orodja zdela preobsežna in nepovezana s tem, kako v resnici razmišljam in delam."
support.gloria_bio_2="Moje ozadje v vedenjski znanosti in raziskavah motivacije vodi način, kako gradimo funkcije, ki opravil ne le organizirajo — pomagajo vam, da jih zares želite dokončati."
support.closing_text="Ustvarimo lahko svet, v katerem se nihče ne bo boril s svojimi orodji, da bi opravil odlično delo. Vaše sponzorstvo financira prihodnost, v kateri se programska oprema prilagaja človeški raznolikosti, ne obratno."
