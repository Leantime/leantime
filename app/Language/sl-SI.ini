text.my_work_dashboard_intro="Vaša nadzorna plošča Moje delo postavi v ospredje vse, kar je pomembno.<br/>Vaše najpomembnejše delo je zdaj na vidnem mestu, urejeno prav za vas in za to, kako vaši možgani delujejo najbolje.<br/><br/>Od hitrih opravil do ambicioznih ciljev — vse, kar potrebujete, je tukaj. To je vaš prostor za zapisovanje idej, spremljanje napredka in proslavljanje uspehov na poti."
text.blueprints_intro="Blueprints so vaša priložnost, da osmislite vse podatke. Leantime ponuja vrsto orodij in tabel za opredelitev ozadja projekta, kot so table poslovnega modela, analiza SWOT ali zemljevidi empatije.<br/><br/>Če ne veste, kje začeti, predlagamo, da ustvarite „Tablo vrednosti projekta“. Ta tabla odgovori na najpomembnejša vprašanja vašega projekta: Kdo je vaša stranka?<br/>Kateri problem rešujete?<br/>Kakšna je vaša rešitev?<br/>Kakšno prednost ima vaša rešitev pred konkurenco?<br/>"
text.goals_tour_intro="Cilji vam omogočajo, da projekt razčlenite na dosegljive, merljive in izvedljive dele.<br/>Medtem ko so mejniki osredotočeni na izvedbo, so cilji namenjeni metrikam, ki jih želite doseči.<br/>Vsak cilj naj ima jasen namen (to, kar želite doseči) in naj bo enostavno merljiv z eno samo metriko.<br/><br/>Ko imate cilj, mu lahko dodelite mejnike in ga tako razčlenite na izvedljiva opravila.<br/>"
text.project_dashboard_tour_intro="Projekti v Leantime so skupni delovni prostori, v katerih z ekipo učinkovito organizirate, spremljate in izvajate delo. Vsak projekt je vsebnik za povezane cilje, opravila in mejnike ter vam omogoča spremljanje napredka na enem osrednjem mestu.<br/><br/>Ne glede na to, ali upravljate delo, šolo ali notranje osebne pobude, vam projekti v Leantime dajejo strukturo in orodja, s katerimi ideje spremenite v uspešne rezultate."
text.wiki_tour_intro="Naši dokumenti vam omogočajo pisanje in deljenje dokumentacije z ekipo. Ustvarite lahko več prostorov, da dokumentacijo organizirate po ekipah, področjih ali kategorijah dokumentov.<br/>Ustvarjajte dokumente za deljenje znanja, procesov in postopkov. Ustvarite lahko tudi dokument, s katerim delite povezavo do datoteke ali mape v svoji shrambi v oblaku.<br/>"
text.extend_leantime_latest_plugins="Razširite Leantime z našimi najnovejšimi vtičniki."
support.headline_help_us_build="Pomagajte nam graditi prihodnost, v kateri uspevajo vsi umi!"
support.intro_text_1="Večina orodij za produktivnost predpostavlja, da vsi razmišljamo enako: linearno, popolnoma osredotočeno in motivirani s poljubnimi roki. Ne glede na to, ali imate ADHD in potrebujete dopaminske spodbude ob dokončanih opravilih, ste avtistični in potrebujete dosledno strukturo, imate disleksijo in razmišljate prostorsko ali pa ste preprosto naveličani orodij, ki se ne ujemajo s tem, kako vaši možgani dejansko delujejo — verjetno ste upravljanje projektov že povsem opustili."
support.intro_text_2="Leantime gradimo za ume, ki delujejo drugače. To vključuje nevrodivergentne možgane, pa tudi vse, ki so se kdaj počutili, kot da se obstoječa orodja borijo proti njihovim naravnim vzorcem razmišljanja."
