tour.my_work.welcome_title="Vitajte na prehliadke prehľadu"
tour.my_work.welcome_text="Začnime niekoľkými základmi, aby ste sa rýchlo zorientovali v navigácii a jednotlivých prvkoch Leantime."
tour.my_work.work_modes_title="Pracovné režimy"
tour.my_work.work_modes_text="Horná navigácia ukazuje aktuálny „pracovný režim“, v ktorom sa nachádzate. Môžete byť v projekte, vo svojom osobnom pracovnom priestore alebo v režime spoločnosti."
tour.my_work.left_nav_text="Ľavá navigácia člení aktuálny pracovný režim a sprístupňuje jeho jednotlivé oblasti. Všetko, čo sa tu zobrazuje, patrí k pracovnému režimu vybranému vyššie."
tour.my_work.profile_bar_title="Panel môjho profilu"
tour.my_work.profile_bar_text="Tu nájdete odkazy na svoj účet, ako aj oznámenia a najnovšie správy o Leantime."
tour.my_work.widgets_title="Widgety vášho prehľadu"
tour.my_work.widgets_text="Váš prehľad je rozdelený na rôzne widgety, ktoré zobrazujú cielené informácie o vašej práci."
tour.my_work.customize_title="Prispôsobte si prehľad"
tour.my_work.customize_text="Veľkosť widgetov môžete meniť a widgety môžete presúvať myšou."
tour.my_work.todos_title="Moje úlohy"
tour.my_work.todos_text="Widget Moje úlohy zobrazuje všetky úlohy, ktoré sú vám momentálne priradené."
tour.my_work.group_todos_title="Zoskupte úlohy"
tour.my_work.group_todos_text="Pomocou rozbaľovacích ponúk tu môžete filtrovať úlohy podľa projektu alebo ich zoskupiť podľa priority, stavu, projektu či dátumov."
tour.my_work.sort_todos_title="Zoraďte úlohy"
tour.my_work.sort_todos_text="Poradie každej úlohy môžete zmeniť jej presunutím myšou. Úlohu môžete tiež presunúť do kalendára a naplánovať ju."
tour.my_work.timer_title="Spustite časovač"
tour.my_work.timer_text="Keď budete pripravení začať pracovať na úlohe, stačí kliknúť na tlačidlo spustenia časovača."
tour.my_work.complete_task_title="Dokončite úlohu"
tour.my_work.complete_task_text="Keď je úloha hotová, môžete ju označiť ako dokončenú kliknutím na rozbaľovaciu ponuku stavu."
tour.my_work.add_tasks_title="Pridajte ďalšie úlohy"
tour.my_work.add_tasks_text="Ďalšie úlohy pridáte kliknutím na tlačidlo plus v každej sekcii alebo pomocou ponuky s tromi bodkami vedľa každej úlohy."
tour.my_work.finish_text="Dokončili ste prehliadku prehľadu Moja práca. Prejdite do <a href='%s/dashboard/show'>svojho projektu</a> a zistite viac o riadení projektov v Leantime."
tour.project_dashboard.menu_title="Ponuka projektu"
tour.project_dashboard.menu_text="Ponuka projektu člení váš projekt do rôznych sekcií: <strong>Dátová miestnosť</strong> – na uloženie všetkých súborov a informácií, <strong>Premýšľať</strong> – na tvorbu stratégie, hľadanie nápadov a definovanie projektu, <strong>Tvoriť</strong> – na riadenie cieľov, míľnikov a úloh."
tour.project_dashboard.selector_title="Výber projektu"
tour.project_dashboard.selector_text="Pomocou výberu projektu môžete prechádzať medzi projektmi. Ľavá ponuka zobrazuje všetko, čo súvisí s vaším aktuálnym projektom."
tour.project_dashboard.checklist_title="Kontrolný zoznam"
tour.project_dashboard.checklist_text="Kontrolný zoznam projektu slúži na rýchlu kontrolu, či váš projekt obsahuje všetky informácie potrebné na úspešnú realizáciu."
tour.project_dashboard.status_title="Rýchle aktualizácie stavu"
tour.project_dashboard.status_text="Pomocou aktualizácií stavu môžete tímu rýchlo oznámiť postup projektu pomocou červenej, žltej a zelenej farby. Stav bude viditeľný v celej aplikácii."
tour.project_dashboard.progress_title="Postup"
tour.project_dashboard.progress_text="Ukazovateľ postupu projektu zobrazuje, koľko práce ste už dokončili. Zohľadňuje rôznu veľkosť úloh, rýchlosť tímu aj míľniky projektu."
tour.project_dashboard.latest_tasks_title="Najnovšie úlohy"
tour.project_dashboard.latest_tasks_text="Zoznam najnovších úloh zobrazuje úlohy, ktoré boli do projektu pridané naposledy, a môže slúžiť ako vstupná schránka projektu."
tour.project_dashboard.team_title="Tím"
tour.project_dashboard.team_text="Sekcia Tím zobrazuje členov tohto projektu."
tour.project_dashboard.finish_text="Dokončili ste prehliadku prehľadu projektu. Prejdite na <a href='%s/tickets/showKanban'>Úlohy</a> a zistite viac o rôznych spôsoboch, ako v Leantime spravovať úlohy."
tour.kanban_board.overview_title="Vaša tabuľa Kanban"
tour.kanban_board.overview_text="Toto je vaša tabuľa Kanban. Pomáha vám vizualizovať prácu a obmedziť množstvo rozpracovanej práce."
tour.kanban_board.workflow_title="Tok práce"
tour.kanban_board.workflow_text="Úlohy sa s postupom práce presúvajú zľava doprava. Presúvaním kariet myšou aktualizujete ich stav."
tour.kanban_board.columns_title="Flexibilné stĺpce"
tour.kanban_board.columns_text="Pomocou ponuky s tromi bodkami môžete stĺpce pridávať, odstraňovať a premenovať."
tour.kanban_board.filter_title="Filtrujte úlohy"
tour.kanban_board.filter_text="Úlohy môžete filtrovať podľa rôznych polí, napríklad priority, stavu, projektu alebo dátumov."
tour.kanban_board.swimlanes_title="Dráhy (swimlanes)"
tour.kanban_board.swimlanes_text="Úlohy môžete tiež zoskupiť a vytvoriť tak na tabuli Kanban dráhy (swimlanes). Pomáha vám to vizualizovať prácu podľa členov tímu, priority alebo míľnikov."
tour.kanban_board.sprints_title="Šprinty"
tour.kanban_board.sprints_text="Ak riadite prácu v šprintoch, pomocou tejto rozbaľovacej ponuky môžete šprinty vyberať, vytvárať a aktualizovať."
tour.kanban_board.finish_text="Týmto sa prehliadka Kanbanu končí. Prejdite na <a href='%s/tickets/roadmap'>Míľniky</a> a zistite, ako v Leantime vytvárať a spravovať míľniky."
tour.milestones.overview_title="Míľniky"
tour.milestones.overview_text="Míľniky vám pomáhajú sledovať hlavné výsledky a fázy projektu."
tour.milestones.drag_title="Presúvanie a zoraďovanie"
tour.milestones.drag_text="Každý pruh predstavuje jeden míľnik. Môžete ich presúvať po časovej osi, meniť ich poradie aj veľkosť. Všetko, čo na tejto obrazovke urobíte, aktualizuje načasovanie vašich míľnikov."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Míľniky môžete filtrovať a zobraziť aj úlohy, ktoré k nim patria."
tour.milestones.timeframes_title="Časové obdobia"
tour.milestones.timeframes_text="Zmenou časového obdobia v zobrazení časovej osi môžete vidieť väčšiu časť roka alebo sa ponoriť do podrobného rozpisu po dňoch."
tour.milestones.finish_text="Týmto sa prehliadka míľnikov končí. Prejdite na <a href='%s/goalcanvas/dashboard'>Ciele</a> a zistite, ako v Leantime vytvárať a spravovať ciele."
tour.goals.overview_title="Ciele"
tour.goals.overview_text="Ciele vám pomáhajú sledovať merateľný dopad vašich projektov."
tour.goals.parts_title="Zámery a metriky"
tour.goals.parts_text="Každý cieľ sa skladá zo zámeru (čo sa snažíte dosiahnuť) a metriky (ako to budete merať)."
tour.goals.progress_title="Postup cieľa"
tour.goals.progress_text="Keď budete aktualizovať metriky cieľov, ukazovateľ postupu vám ukáže, ako ďaleko ste sa dostali."
tour.goals.milestones_title="Míľniky a ciele"
tour.goals.milestones_text="Ciele môžete prepojiť s míľnikmi a sledovať tak postup svojich cieľov na úrovni úloh. Pomáha to odhaliť medzery v pláne projektu."
tour.goals.finish_text="Týmto sa prehliadka cieľov končí. Míľniky, ciele a úlohy sú základnými stavebnými kameňmi Leantime. Pomocou nich rozdelíte prácu na zvládnuteľné časti. Prejdite na <a href='%s/tickets/showKanban'>tabuľu Kanban</a> a skontrolujte svoje úlohy."
