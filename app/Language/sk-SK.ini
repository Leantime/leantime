text.these_are_system_wide_settings="Ide o celosystémové nastavenia, ktoré ovplyvnia vzhľad a prostredie vášho Leantime."
text.company_name_helper="Zobrazuje sa v názve stránky a v e-mailoch"
text.advanced_boards_helper_content="Nápady sa vyvíjajú, rastú a dozrievajú. Tu ich môžete sledovať.<br/>Presúvajte karty nápadov z jedného stĺpca do ďalšieho podľa ich aktuálneho stavu.<br/>Je to dobré miesto na začatie prieskumu, vývoj prototypov a ich overenie s niekoľkými zákazníkmi skôr, než začnete s implementáciou."
text.backlog_helper_content="Backlog je domovom všetkých vašich úloh – tých, na ktorých práve pracujete, aj tých, na ktorých plánujete pracovať.<br/><br/>Aby ste v backlogu napredovali, odporúčame pracovať v krátkych iteráciách – šprintoch.<br/>Šprinty sú dvojtýždňové časové úseky, ktoré vám umožnia sústrediť sa na menšie, dodateľné časti práce.<br/>Na konci dvoch týždňov by ste mali mať niečo, čo môžete „predviesť“. Niečo, čo prináša hodnotu vašim používateľom alebo klientom.<br/><br/>Na tejto obrazovke môžete organizovať a spravovať zoznam úloh, určovať priority backlogu presúvaním myšou a presúvať položky backlogu do aktuálneho šprintu.<br/>Chcete viac informácií? Spustite prehliadku alebo ju zatvorte a pustite sa do toho!"
text.glad_youre_here="Sme radi, že ste tu. Venujme chvíľu tomu, aby sme sa zoznámili."
text.business_research_section="Sekcia Obchodný prieskum je novým domovom vašich nápadov. Prevedie vás krokmi rozvoja zákazníkov, prieskumu problému a hľadania riešení."
text.our_roadmap_design="Náš harmonogram vás prevedie od menších, zvládnuteľných míľnikov až k dokončeniu celého projektu. Plánujte míľniky približne na 3 mesiace a pomocou týchto projektových značiek sa držte cieľa."
text.this_is_where_you_spend_most_time="Tu strávite väčšinu času – samotnou prácou. Plánujte svoje dvojtýždňové šprinty a úspešne ich realizujte pomocou tabule Kanban a nástrojov backlogu. Vďaka retrospektívam sa zlepšíte v ďalšom šprinte."
text.idea_board_helper_content="Tu môžete zhromažďovať všetky svoje nápady. Diskutujte o nových nápadoch so svojím tímom a priraďte k nim míľniky, aby ste videli, ako napredujú."
text.kanban_helper_content="Kanban je japonské slovo pre „kartu“. Tabule Kanban zaviedli inžinieri spoločnosti Toyota v 40. rokoch v rámci štíhlej (lean) výroby.<br/>Slúžia na rýchle vizuálne zdieľanie informácií a postupu práce.<br/>Tabule Kanban pomáhajú vizualizovať prácu a jej stav, riadiť aktívnu či rozpracovanú prácu a pracovný tok a rýchlo konať v smere štíhlych zlepšení."
text.my_timesheets_helper_content="Vo výkazoch práce zaznamenávate skutočne odpracované hodiny na úlohe.<br/>Pomáha to pri fakturácii, ale aj pri overovaní, ako dobre plánujete svoje úlohy vopred.<br/>Časom dokáže Leantime upraviť termíny tak, aby zohľadnili odchýlky v plánovaní."
text.new_project_helper_content="<p>Tu opíšete a definujete svoj projekt a nastavíte jeho parametre. Je to dôležité, pretože práve táto časť oznamuje<br/>celému tímu priority, očakávania a pravidlá projektu.</p><p><br/><em>Na čo tu myslieť: 4C.<br/>Buďte jasní (Clear), struční (Concise), úplní (Complete) a dôveryhodní (Credible).<br/><br/></em></p><p>Ak tieto zásady uplatníte v opisoch projektov, všetci budú mať rovnaké informácie a znížite riziko chýb či prešľapov.</p><br/>Je čas začať!<br/><br/>"
text.not_found_helper_content="<p>Pre túto stránku zatiaľ nemáme obsah.<br/>Pomocou odkazu „Potrebujete pomoc?“ v dolnej časti sa dozviete viac o tom, čo tu môžete robiť.</p>"
text.retros_helper_content="<p>Retrospektívy sú rýchle zamyslenia nad prácou, fungovaním tímu a, samozrejme, pokrokom.<br/>Tu sa váš tím môže na chvíľu zastaviť a zamerať sa na to, čo sa podarilo, čo sa nepodarilo a čo by sa dalo nabudúce urobiť inak.<br/>Odporúčame robiť hodnotiace stretnutie v pravidelných intervaloch alebo aspoň na konci každého míľnika.<br/></p>"
text.roadmap_helper_content="<p>Harmonogramy pomáhajú rozdeliť veľké projekty na menšie a lepšie zvládnuteľné časti.<br/><br/></p><p>Pri tvorbe harmonogramu odporúčame stanoviť míľniky, ktoré sa dajú dosiahnuť v priebehu 3 mesiacov.</p><p>Míľniky sú kontrolné body na ceste k dokončeniu projektu.<br/>Zjednodušene: ak sa vydáte na cestu autom naprieč krajinou, každý štát, ktorým prejdete, môže byť míľnikom.<br/><br/>Začnite kliknutím na „Pridať míľnik“ vľavo hore. Dátum nastavíte na tejto karte alebo priamo v grafe harmonogramu tak, že míľnik v kalendári presuniete myšou.</p>"
text.show_clients_helper_content="<p>Klienti/produkty rozdeľujú vaše projekty do kategórií a umožňujú oddeliť rôzne skupiny.<br/><br/></p><p>Ako konzultant už s klientmi pracujete a toto je miesto, kde ich môžete organizovať.</p><p>Ak ste produktový tím, môžete túto sekciu použiť na organizáciu a oddelenie svojich oddelení (marketing, predaj, prevádzka atď.).</p>"
text.show_projects_helper_content="<p>Projekty sú srdcom vášho podnikania aj Leantime! Zmeny, vývoj, ciele a všetko, čo dokážete vybudovať alebo si vysniť, zahŕňa projekty.<br/>Riadenie projektov je jednoducho proces, ktorý zabezpečuje, aby boli projekty dodané včas, správne a so skutočnou obchodnou hodnotou.<br/><br/>Tu budú vaše projekty. Na stránke projektov môžete vytvoriť projekt a rýchlo vidieť počty úloh, hodiny, rozpočet a klienta priradeného k projektu.<br/><br/>Táto stránka vám poskytne rýchly prehľad o všetkých vašich projektoch.<br/><br/></p>"
text.new_db_version="Bola nainštalovaná nová verzia. Ak chcete používať Leantime, musíte aktualizovať databázu.<br/><br/><strong>Pred touto aktualizáciou nezabudnite zálohovať databázu!</strong><br/>Môže to trvať niekoľko minút."
text.update_was_successful="Aktualizácia prebehla úspešne, teraz sa môžete prihlásiť. <a href='%1$s'>Prejsť na prihlásenie</a>"
text.this_script_will_set_up_leantime="Tento skript nastaví vašu databázu a vytvorí účet administrátora"
text.enter_new_password="Zadajte nové heslo a obnovte ho."
text.enter_email_address_to_reset="Zadajte svoju e-mailovú adresu a obnovte si heslo."
text.twoFA_qr="Naskenujte QR kód nižšie do svojej obľúbenej aplikácie OTP/Google Authenticator"
text.twoFA_verify_code="Zadajte kód z aplikácie OTP/Google Authenticator"
text.twoFA_already_enabled="Dvojfaktorové overenie je pre váš účet už zapnuté a vyžaduje sa pri prihlásení.<br/><br/>Ak chcete dvojfaktorové overenie odstrániť, kliknite nižšie na Odstrániť"
text.twoFA_enabled="Dvojfaktorové overenie je pre váš účet <strong>zapnuté</strong>."
text.twoFA_disabled="Dvojfaktorové overenie je pre váš účet <strong>vypnuté</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Spravovať dvojfaktorové overenie"
text.who_can_access="Vyberte, kto môže tento projekt zobraziť. Používatelia predvolene zdedia roly, s ktorými boli nastavení. Tieto roly môžete zmeniť na karte „Tím“"
text.ical_export_description="Tu môžete vytvoriť jedinečnú URL kalendára, pomocou ktorej integrujete svoj kalendár Leantime do ľubovoľnej aplikácie s podporou formátu „iCal“. "
text.you_ical_url="Vaša URL kalendára je uvedená nižšie. <br /> Upozorňujeme, že ku kalendáru môže pristupovať ktokoľvek s touto URL. Uchovajte ju v tajnosti ako heslo."
