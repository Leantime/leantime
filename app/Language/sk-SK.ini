text.mattermost_instructions=" Táto integrácia bude odosielať oznámenia o aktualizáciách do kanála podľa vášho výberu.<br/>Postupujte podľa pokynov <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>tu a získajte URL prichádzajúceho webhooku</a> zo služby Mattermost. Potom vložte odkaz do formulára vpravo a kliknite na Uložiť."
text.slack_instructions="Táto integrácia bude odosielať oznámenia o aktualizáciách do kanála podľa vášho výberu.<br/>Postupujte podľa pokynov <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>tu a získajte URL prichádzajúceho webhooku</a> zo služby Slack. Potom vložte odkaz do formulára vpravo a kliknite na Uložiť."
text.choose_access_for_users="Označte alebo zrušte označenie používateľov, ktorých chcete pridať/odstrániť. Viac o rolách sa dozviete na <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Predpokladané dokončenie do"
text.zulip_instructions="Táto integrácia bude odosielať oznámenia o aktualizáciách do streamu a témy podľa vášho výberu.<br/>Postupujte podľa pokynov <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>tu a vytvorte nového bota</a>. Potom vložte údaje do formulára vpravo a kliknite na Uložiť."
text.discord_instructions="Táto integrácia bude odosielať oznámenia o aktualizáciách do kanála podľa vášho výberu.<br/>Postupujte podľa pokynov <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>tu a vytvorte nový webhook (alebo viac webhookov)</a>, potom vložte odkaz(y) do polí vpravo a kliknite na Uložiť."
