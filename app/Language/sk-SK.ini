label.onboarding_default_project_name="Môj projekt"
text.onboarding_default_project_details="Vitajte vo svojom prvom projekte v Leantime!<br />Toto je váš priestor na organizovanie úloh, sledovanie cieľov a plánovanie práce. Čokoľvek tu môžete upraviť alebo podľa potreby vytvoriť ďalšie projekty. Tento projekt slúži len na to, aby ste mohli začať"
label.onboarding_milestone_getting_started="Začíname"
label.onboarding_task_community_chat="Pridajte sa do nášho komunitného chatu"
text.onboarding_task_community_chat="Náš komunitný chat je skvelým miestom, kde môžete klásť otázky a získať spätnú väzbu k nastaveniu projektu. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Komunitný chat</a>"
label.onboarding_task_invite_team="Pozvite svojich kolegov z tímu"
text.onboarding_task_invite_team="Či už s niekým spolupracujete, alebo len potrebujete parťáka, ktorý vás udrží pri zodpovednosti. Spoločné používanie Leantime v skupine pomáha udržať smer aj motiváciu <a href='%s'>Správa používateľov</a>"
label.onboarding_task_project_structure="Zistite viac o štruktúre projektov v Leantime"
text.onboarding_task_project_structure="V našej dokumentácii pomoci nájdete množstvo ďalších zdrojov. Ak sa chcete dozvedieť viac o štruktúre projektov v Leantime a osvedčených postupoch, navštívte: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Vytvorte cieľ"
text.onboarding_task_create_goal="Ciele slúžia na sledovanie a meranie dlhodobých zámerov. Mali by byť merateľné pomocou metrík, ktoré môžete pravidelne aktualizovať. Ciele a míľniky môžete prepojiť a pri sledovaní postupu metrík tak vidieť aj postup realizácie <a href='%s'>Ciele projektu</a>"
label.onboarding_task_create_milestone="Vytvorte míľnik"
text.onboarding_task_create_milestone="Míľniky vám umožňujú rozdeliť fázy projektov na samostatné výsledky. Každý míľnik má dátum začiatku a konca a mal by priniesť konkrétny výstup <a href='%s'>Míľnik projektu</a>"
label.onboarding_task_personal_project="Preskúmajte svoj osobný projekt"
text.onboarding_task_personal_project="Váš osobný projekt je priestor, kde môžete organizovať svoje úlohy, ciele a prácu. Otvoríte ho cez výber projektu hore alebo kliknutím na tento odkaz: <a href='%s'>Môj projekt</a>"
label.onboarding_task_complete_profile="Dokončite svoj profil v Leantime"
text.onboarding_task_complete_profile="Aktualizujte profilovú fotografiu a doplňte pracovné preferencie, aby ste si prispôsobili prostredie. <a href='%s'>Môj profil</a>"
label.onboarding_goalboard_title="Moje ciele"
