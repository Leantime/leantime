text.lean.helper_content="Lean Canvas vás prevedie celým procesom overovania vášho nového podnikateľského a/alebo produktového nápadu.<br/>Budete sa venovať svojmu <em>zákazníckemu segmentu</em>, <em>problému a riešeniu</em>.<br/>Odtiaľ prejdete k svojej <em>jedinečnej hodnotovej ponuke</em> (čím je váš nápad lepší než iné ponuky?), <em>distribučným kanálom</em> (ako sa vaše riešenie dostane k zákazníkom?), <em>zdrojom príjmov</em> (ako bude vaše riešenie zarábať?), <em>štruktúre nákladov</em> (akú hodnotu má vaše riešenie?), <em>kľúčovým metrikám</em> (ako budete merať úspech?) a <em>neférovej výhode</em> (čo máte, čo vám pomôže uspieť proti konkurencii?)<br/>Odpovede na tieto otázky majú podporiť úspech, zmierniť riziko neúspechu a umožniť vám sledovať a overovať svoje predpoklady. Byť lean znamená odstraňovať plytvanie a budovať produkty, podnikanie a riešenia, ktoré vaši zákazníci potrebujú."
