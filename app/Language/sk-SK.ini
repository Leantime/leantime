support.marcel_name="👋 Som Marcel"
support.marcel_tagline="Nemecký prisťahovalec, otec autistickej dcéry a sám žijem s ADHD."
support.marcel_bio_1="Tradičné nástroje na riadenie projektov mi nikdy nesadli. Pôsobili, akoby ich vytvorili neurotypické mysle pre neurotypické mysle. Keď som pracoval ako freelancer a snažil sa udržať klientske projekty v poriadku, začal som budovať niečo, čo by fungovalo s mojím mozgom, a nie proti nemu."
support.marcel_bio_2="To, čo začalo ako osobné riešenie, sa stalo Leantime, keď som si uvedomil, že milióny ďalších ľudí potrebujú to isté."
support.gloria_name="👋 A ja som Gloria"
support.gloria_tagline="Bývalá zdravotná sestra z urgentného príjmu, dnes produktová manažérka a hispánska podnikateľka prvej generácie."
support.gloria_bio_1="Roky som strávila v náročnom zdravotníckom prostredí, kde organizácia doslova zachraňuje životy. Keď som však začala podnikať, tradičné projektové nástroje pôsobili zahlcujúco a vôbec nezodpovedali tomu, ako skutočne myslím a pracujem."
support.gloria_bio_2="Moje skúsenosti z behaviorálnej vedy a výskumu motivácie určujú, ako budujeme funkcie, ktoré úlohy nielen organizujú — ale pomáhajú vám, aby ste ich naozaj chceli dokončiť."
support.closing_text="Môžeme vytvoriť svet, v ktorom nikto nemusí bojovať so svojimi nástrojmi, aby odviedol skvelú prácu. Vaše sponzorstvo financuje budúcnosť, v ktorej sa softvér prispôsobuje ľudskej rozmanitosti, a nie naopak."
