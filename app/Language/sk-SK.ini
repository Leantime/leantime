text.full_lean_canvas_helper_content="Úplná výskumná tabuľa vás prevedie celým procesom overovania nápadu.<br/>Na tejto stránke sa opäť budete venovať zákazníckemu segmentu, problému a riešeniu (nemajte obavy, ak ste ich už vyplnili na jednoduchej tabuli, uvidíte ich tu znova!).<br/>Potom prejdete k jasnej hodnotovej ponuke (V čom je váš nápad lepší ako iné ponuky?),<br/>predajným kanálom (Ako sa zákazníci dostanú k vášmu riešeniu?)<br/>zdrojom príjmov (Ako na vašom riešení zarobíte?)<br/>štruktúre nákladov (Akú hodnotu má vaše riešenie?), kľúčovým metrikám (Ako meriate úspech?)<br/>a neférovej výhode (Čím sa odlíšite od konkurencie?)<br/>Odpovede na tieto otázky vám pomôžu dosiahnuť úspech, obmedziť neúspechy a sledovať a overovať vaše predpoklady.<br/>Lean znamená odstraňovať plytvanie a vytvárať produkty, obchody a riešenia, ktoré vaši zákazníci potrebujú."
