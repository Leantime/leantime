text.my_work_dashboard_intro="Váš prehľad Moja práca zaostruje na všetko, na čom záleží.<br/>Vaša najdôležitejšia práca je teraz v popredí, usporiadaná presne pre vás a podľa toho, ako váš mozog funguje najlepšie.<br/><br/>Od rýchlych úloh až po ambiciózne ciele — všetko, čo potrebujete, nájdete práve tu. Toto je váš priestor na zachytávanie nápadov, sledovanie pokroku a oslavu úspechov na ceste."
text.blueprints_intro="Plány projektu sú vašou príležitosťou dať všetkým údajom zmysel. Leantime ponúka množstvo nástrojov a plátien na definovanie pozadia projektu prostredníctvom plátien obchodného modelu (Business Model Canvas), analýzy SWOT alebo máp empatie.<br/><br/>Ak neviete, kde začať, odporúčame vytvoriť „Plátno hodnoty projektu“. Toto plátno odpovie na najdôležitejšie otázky vášho projektu: Kto je váš zákazník?<br/>Aký problém riešite?<br/>Aké je vaše riešenie?<br/>Akú výhodu ponúka vaše riešenie oproti konkurencii?<br/>"
text.goals_tour_intro="Ciele vám umožňujú rozdeliť projekt na dosiahnuteľné, merateľné a realizovateľné časti.<br/>Kým míľniky sa zameriavajú na realizáciu, ciele sa týkajú metrík, ktoré chcete dosiahnuť.<br/>Každý cieľ by mal mať jasný zámer (to, čo chcete dosiahnuť) a mal by byť ľahko merateľný jednou metrikou.<br/><br/>Keď máte cieľ, môžete k nemu priradiť míľniky a rozdeliť ho na realizovateľné úlohy.<br/>"
text.project_dashboard_tour_intro="Projekty v Leantime sú spoločné pracovné priestory, v ktorých vy a váš tím efektívne organizujete, sledujete a dodávate prácu. Každý projekt slúži ako kontajner pre súvisiace ciele, úlohy a míľniky a umožňuje vám sledovať pokrok na jednom centrálnom mieste.<br/><br/>Či už riadite pracovné, školské alebo interné osobné iniciatívy, projekty v Leantime poskytujú štruktúru a nástroje potrebné na premenu nápadov na úspešné výsledky."
text.wiki_tour_intro="Naše dokumenty vám umožňujú písať dokumentáciu a zdieľať ju s tímom. Môžete vytvoriť viacero priestorov a usporiadať dokumentáciu podľa tímov, oblastí alebo kategórií dokumentov.<br/>Vytvárajte dokumenty na zdieľanie znalostí, procesov a postupov. Môžete tiež vytvoriť dokument na zdieľanie odkazu na súbor alebo priečinok vo vašom cloudovom úložisku.<br/>"
text.extend_leantime_latest_plugins="Rozšírte Leantime pomocou našich najnovších doplnkov."
support.headline_help_us_build="Pomôžte nám budovať budúcnosť, v ktorej môže prosperovať každá myseľ!"
support.intro_text_1="Väčšina nástrojov na produktivitu predpokladá, že všetci myslia rovnako: lineárne, s dokonalým sústredením a s motiváciou vďaka ľubovoľne stanoveným termínom. Či už máte ADHD a potrebujete dávku dopamínu z dokončených úloh, ste autista a túžite po stálej štruktúre, máte dyslexiu a myslíte priestorovo, alebo vás jednoducho unavujú nástroje, ktoré nezodpovedajú tomu, ako váš mozog skutočne funguje — pravdepodobne ste to s riadením projektov úplne vzdali."
support.intro_text_2="Leantime budujeme pre mysle, ktoré fungujú inak. To zahŕňa neurodivergentné mozgy, ale aj každého, kto mal niekedy pocit, že existujúce nástroje bojujú proti jeho prirodzenému spôsobu myslenia."
