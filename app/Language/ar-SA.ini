text.onboarding_default_project_details="أهلاً بك في مشروعك الأول في Leantime!<br />هذه مساحتك لتنظيم المهام وتتبّع الأهداف وتخطيط عملك. لا تتردد في تعديل أي شيء هنا أو إنشاء مشاريع إضافية كلما توسّع عملك. هذا المشروع مخصص لك لتبدأ فحسب"
label.onboarding_milestone_getting_started="الخطوات الأولى"
label.onboarding_task_community_chat="انضم إلى دردشة المجتمع"
text.onboarding_task_community_chat="تُعد دردشة المجتمع مصدراً رائعاً لطرح الأسئلة والحصول على ملاحظات حول إعداد المشاريع. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>دردشة المجتمع</a>"
label.onboarding_task_invite_team="ادعُ زملاءك في الفريق"
text.onboarding_task_invite_team="سواء كنت تعمل مع شخص آخر أو تحتاج فقط إلى رفيق يشجّعك على الالتزام، فإن استخدام Leantime ضمن مجموعة يساعدك على البقاء على المسار الصحيح والحفاظ على حماسك <a href='%s'>إدارة المستخدمين</a>"
label.onboarding_task_project_structure="تعرّف على المزيد حول بنية المشاريع في Leantime"
text.onboarding_task_project_structure="لدينا الكثير من الموارد الإضافية في وثائق المساعدة. لمعرفة المزيد عن بنية المشاريع في Leantime وأفضل الممارسات، تفضّل بزيارة: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="أنشئ هدفاً"
text.onboarding_task_create_goal="تُستخدم الأهداف لتتبّع الغايات طويلة المدى وقياسها. ويجب أن تكون قابلة للقياس باستخدام مقاييس يمكنك تحديثها بانتظام. ويمكن ربط الأهداف بالمحطات الرئيسية لمتابعة تقدّم التنفيذ إلى جانب تقدّم المقاييس <a href='%s'>أهداف المشروع</a>"
label.onboarding_task_create_milestone="أنشئ محطة رئيسية"
text.onboarding_task_create_milestone="تتيح لك المحطات الرئيسية تقسيم مراحل مشاريعك إلى نتائج محددة ومستقلة. لكل محطة رئيسية تاريخ بداية وتاريخ نهاية، وينبغي أن تُسفر عن مُخرَج ما <a href='%s'>المحطات الرئيسية للمشروع</a>"
label.onboarding_task_personal_project="استكشف مشروعك الشخصي"
text.onboarding_task_personal_project="مشروعك الشخصي مساحة يمكنك فيها تنظيم مهامك وأهدافك وعملك. يمكنك الوصول إليه عبر محدد المشاريع في الأعلى أو بالنقر على هذا الرابط: <a href='%s'>مشروعي</a>"
label.onboarding_task_complete_profile="أكمل ملفي الشخصي في Leantime"
text.onboarding_task_complete_profile="حدّث صورة الملف الشخصي وأكمل تفضيلات العمل لتخصيص تجربتي. <a href='%s'>ملفي الشخصي</a>"
