tour.my_work.welcome_title="أهلاً بك في جولة لوحة التحكم"
tour.my_work.welcome_text="لنبدأ ببعض الأساسيات لتتعرّف بسرعة على التنقل والعناصر المختلفة داخل Leantime."
tour.my_work.work_modes_title="أوضاع العمل"
tour.my_work.work_modes_text="يعرض لك شريط التنقل العلوي «وضع العمل» الحالي الذي تعمل فيه. يمكنك أن تكون داخل مشروع، أو في مساحة عملك الشخصية، أو في وضع الشركة."
tour.my_work.left_nav_text="يفصّل شريط التنقل الجانبي وضع العمل الحالي ويمنحك الوصول إلى أقسامه المختلفة. كل ما يظهر هنا جزء من وضع العمل المحدد حالياً في الأعلى."
tour.my_work.profile_bar_title="شريط ملفي الشخصي"
tour.my_work.profile_bar_text="ستجد هنا روابط إلى حسابك، بالإضافة إلى الإشعارات وآخر أخبار Leantime."
tour.my_work.widgets_title="أدوات لوحة التحكم الخاصة بك"
tour.my_work.widgets_text="تنقسم لوحة التحكم إلى أدوات متنوعة تعرض لك معلومات مركّزة عن عملك."
tour.my_work.customize_title="خصّص لوحة التحكم"
tour.my_work.customize_text="يمكنك تغيير حجم الأدوات ونقلها باستخدام السحب والإفلات."
tour.my_work.todos_title="مهامي"
tour.my_work.todos_text="تعرض لك أداة «مهامي» جميع المهام المسندة إليك حالياً."
tour.my_work.group_todos_title="تجميع المهام"
tour.my_work.group_todos_text="يمكنك استخدام القوائم المنسدلة هنا لتصفية مهامك حسب المشروع أو تجميعها حسب الأولوية أو الحالة أو المشروع أو التواريخ."
tour.my_work.sort_todos_title="ترتيب المهام"
tour.my_work.sort_todos_text="يمكنك سحب أي مهمة وإفلاتها لتغيير ترتيبها. ويمكنك أيضاً سحب مهمة وإفلاتها في التقويم لجدولتها."
tour.my_work.timer_title="ابدأ المؤقت"
tour.my_work.timer_text="عندما تكون مستعداً لبدء العمل على مهمة، ما عليك سوى النقر على زر بدء المؤقت."
tour.my_work.complete_task_title="أكمل مهمة"
tour.my_work.complete_task_text="عند اكتمال المهمة، يمكنك تعليمها بأنها «تم» بالنقر على القائمة المنسدلة للحالة."
tour.my_work.add_tasks_title="أضف المزيد من المهام"
tour.my_work.add_tasks_text="يمكنك إضافة المزيد من المهام بالنقر على زر الإضافة في كل قسم، أو باستخدام قائمة النقاط الثلاث بجانب كل مهمة."
tour.my_work.finish_text="لقد أكملت جولة لوحة «أعمالي». انتقل إلى <a href='%s/dashboard/show'>مشروعك</a> لمعرفة المزيد عن إدارة المشاريع في Leantime."
tour.project_dashboard.menu_title="قائمة المشروع"
tour.project_dashboard.menu_text="تنظّم قائمة المشروع مشروعك في أقسام مختلفة: <strong>غرفة البيانات</strong> - لاستضافة جميع ملفاتك ومعلوماتك، <strong>فكر</strong> - لوضع الاستراتيجية وتوليد الأفكار والتعريف، <strong>اصنع</strong> - لإدارة الأهداف والمحطات الرئيسية والمهام."
tour.project_dashboard.selector_title="محدد المشاريع"
tour.project_dashboard.selector_text="استخدم محدد المشاريع للتنقل بين المشاريع. تعرض القائمة الجانبية كل ما يتعلق بمشروعك الحالي."
tour.project_dashboard.checklist_title="قائمة المراجعة"
tour.project_dashboard.checklist_text="قائمة مراجعة المشروع مرجع سريع لمعرفة ما إذا كان مشروعك يتضمن جميع المعلومات اللازمة لتنفيذه بنجاح."
tour.project_dashboard.status_title="تحديثات الحالة السريعة"
tour.project_dashboard.status_text="يمكنك استخدام تحديثات الحالة لمشاركة تقدّم مشروعك مع فريقك بسرعة باستخدام الألوان الأحمر والأصفر والأخضر. ستظهر الحالة في جميع أنحاء التطبيق."
tour.project_dashboard.progress_title="التقدم"
tour.project_dashboard.progress_text="يُظهر لك مؤشر تقدّم المشروع مقدار العمل الذي أنجزته. ويأخذ في الحسبان أحجام المهام المختلفة وسرعة الفريق والمحطات الرئيسية للمشروع."
tour.project_dashboard.latest_tasks_title="أحدث المهام"
tour.project_dashboard.latest_tasks_text="تعرض لك قائمة أحدث المهام آخر المهام التي أُضيفت إلى مشروعك، ويمكن استخدامها كصندوق وارد للمشروع."
tour.project_dashboard.team_title="الفريق"
tour.project_dashboard.team_text="يعرض لك مربع الفريق أعضاء هذا المشروع."
tour.project_dashboard.finish_text="لقد أكملت جولة لوحة تحكم المشروع. انتقل إلى <a href='%s/tickets/showKanban'>المهام</a> لمعرفة المزيد عن الطرق المختلفة لإدارة مهامك في Leantime."
tour.kanban_board.overview_title="لوحة كانبان الخاصة بك"
tour.kanban_board.overview_text="هذه لوحة كانبان الخاصة بك. تساعدك على تصوّر عملك والحد من العمل قيد التنفيذ."
tour.kanban_board.workflow_title="سير العمل"
tour.kanban_board.workflow_text="تنتقل المهام من عمود إلى الذي يليه كلما تقدّمت. اسحب البطاقات وأفلتها لتحديث حالتها."
tour.kanban_board.columns_title="أعمدة مرنة"
tour.kanban_board.columns_text="باستخدام قائمة النقاط الثلاث، يمكنك إضافة الأعمدة أو إزالتها وإعادة تسميتها."
tour.kanban_board.filter_title="تصفية المهام"
tour.kanban_board.filter_text="يمكنك تصفية مهامك حسب حقول متنوعة مثل الأولوية أو الحالة أو المشروع أو التواريخ."
tour.kanban_board.swimlanes_title="المسارات الأفقية"
tour.kanban_board.swimlanes_text="يمكنك أيضاً تجميع مهامك لإنشاء مسارات أفقية في كانبان. يساعدك ذلك على تصوّر عملك حسب أعضاء الفريق أو الأولوية أو المحطات الرئيسية."
tour.kanban_board.sprints_title="السبرنتات"
tour.kanban_board.sprints_text="إذا كنت تدير عملك على شكل سبرنتات، يمكنك استخدام القائمة المنسدلة هنا لاختيار السبرنتات وإنشائها وتحديثها."
tour.kanban_board.finish_text="بهذا تنتهي جولة كانبان. انتقل إلى <a href='%s/tickets/roadmap'>المحطات الرئيسية</a> لتتعلّم كيفية إنشاء المحطات الرئيسية وإدارتها في Leantime."
tour.milestones.overview_title="المحطات الرئيسية"
tour.milestones.overview_text="تساعدك المحطات الرئيسية على تتبّع النتائج الكبرى ومراحل المشروع."
tour.milestones.drag_title="السحب والترتيب"
tour.milestones.drag_text="يمثّل كل شريط محطة رئيسية واحدة. يمكنك سحب الأشرطة على طول الجدول الزمني وإعادة ترتيبها وتغيير حجمها. كل ما تفعله في هذه الشاشة يحدّث توقيت محطاتك الرئيسية."
tour.milestones.filter_title="التصفية"
tour.milestones.filter_text="يمكنك تصفية محطاتك الرئيسية وعرض المهام التابعة لها أيضاً."
tour.milestones.timeframes_title="الأطر الزمنية"
tour.milestones.timeframes_text="يمكنك تغيير الإطار الزمني لعرض الجدول الزمني لترى جزءاً أكبر من السنة أو لتتعمّق في التفاصيل اليومية."
tour.milestones.finish_text="بهذا تنتهي جولة المحطات الرئيسية. انتقل إلى <a href='%s/goalcanvas/dashboard'>الأهداف</a> لتتعلّم كيفية إنشاء الأهداف وإدارتها في Leantime."
tour.goals.overview_title="الأهداف"
tour.goals.overview_text="تساعدك الأهداف على تتبّع الأثر القابل للقياس في مشاريعك."
tour.goals.parts_title="الغايات والمقاييس"
tour.goals.parts_text="يتكوّن كل هدف من غاية (ما تسعى إلى تحقيقه) ومقياس (كيف ستقيسه)."
tour.goals.progress_title="تقدّم الهدف"
tour.goals.progress_text="عندما تحدّث مقاييس أهدافك، سيُظهر لك شريط التقدّم مدى تقدّمك."
tour.goals.milestones_title="المحطات الرئيسية والأهداف"
tour.goals.milestones_text="يمكنك ربط الأهداف بالمحطات الرئيسية لتتبّع تقدّم أهدافك على مستوى المهام. يساعد ذلك على تحديد الثغرات في خطة مشروعك."
tour.goals.finish_text="بهذا تنتهي جولة الأهداف. المحطات الرئيسية والأهداف والمهام هي اللبنات الأساسية في Leantime. استخدمها لتقسيم عملك إلى أجزاء يسهل إدارتها. انتقل إلى <a href='%s/tickets/showKanban'>لوحة كانبان</a> لمراجعة مهامك."
