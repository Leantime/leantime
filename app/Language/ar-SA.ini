support.marcel_name="👋 أنا مارسيل"
support.marcel_tagline="مهاجر ألماني، وأب لابنة مصابة بالتوحد، وأعيش أنا نفسي مع اضطراب فرط الحركة ونقص الانتباه."
support.marcel_bio_1="لم تنسجم أدوات إدارة المشاريع التقليدية معي يومًا. شعرت بأنها صُممت بعقول نمطية عصبيًا من أجل عقول نمطية عصبيًا. عندما كنت أعمل مستقلاً وأكافح لإبقاء مشاريع العملاء منظمة، بدأت ببناء شيء يعمل مع عقلي بدلاً من أن يعمل ضده."
support.marcel_bio_2="ما بدأ كحل شخصي أصبح Leantime عندما أدركت أن ملايين الآخرين يحتاجون إلى الشيء نفسه."
support.gloria_name="👋 وأنا غلوريا"
support.gloria_tagline="ممرضة طوارئ سابقة تحولت إلى مديرة منتجات، ورائدة أعمال من الجيل الأول من أصل لاتيني."
support.gloria_bio_1="قضيت سنوات في بيئات طبية عالية الضغط حيث ينقذ التنظيم الأرواح حرفيًا. لكن عندما بدأت عملي الخاص، شعرت بأن أدوات المشاريع التقليدية مرهقة ومنفصلة عن طريقة تفكيري وعملي الفعلية."
support.gloria_bio_2="خلفيتي في العلوم السلوكية وأبحاث التحفيز توجّه طريقة بنائنا لميزات لا تكتفي بتنظيم المهام — بل تجعلك ترغب فعلاً في إنجازها."
support.closing_text="يمكننا أن نصنع عالمًا لا يضطر فيه أحد إلى محاربة أدواته لينجز عملاً رائعًا. رعايتك تموّل مستقبلاً تتكيف فيه البرمجيات مع التنوع البشري، لا العكس."
