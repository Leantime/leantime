text.my_work_dashboard_intro="لوحة «أعمالي» تضع كل ما يهمك في دائرة التركيز.<br/>أهم أعمالك الآن في المقدمة، مرتبة خصيصًا لك وبالطريقة التي يعمل بها عقلك على أفضل وجه.<br/><br/>من المهام السريعة إلى الأهداف الطموحة، كل ما تحتاجه موجود هنا. هذه مساحتك لالتقاط الأفكار وتتبع التقدم والاحتفاء بالإنجازات على طول الطريق."
text.blueprints_intro="المخططات هي فرصتك لفهم كل البيانات. يوفر Leantime مجموعة متنوعة من الأدوات واللوحات لتحديد خلفية مشروعك عبر مخططات نموذج العمل التجاري أو تحليل SWOT أو خرائط التعاطف.<br/><br/>إذا لم تكن تعرف من أين تبدأ، نقترح أن تنشئ «مخطط قيمة المشروع». سيجيب هذا المخطط عن أهم أسئلة مشروعك: من هو عميلك؟<br/>ما المشكلة التي تحلها؟<br/>ما هو حلك؟<br/>ما الميزة التي يقدمها حلك مقارنة بمنافسيك؟<br/>"
text.goals_tour_intro="تتيح لك الأهداف تقسيم مشروعك إلى أجزاء قابلة للتحقيق والقياس والتنفيذ.<br/>بينما تركز المحطات الرئيسية على التنفيذ، تتعلق الأهداف بالمقاييس التي تريد تحقيقها.<br/>يجب أن يكون لكل هدف غاية واضحة (الشيء الذي تريد تحقيقه) وأن يكون قابلاً للقياس بسهولة باستخدام مقياس واحد.<br/><br/>بمجرد أن يكون لديك هدف، يمكنك إسناد محطات رئيسية إليه لتقسيمه إلى مهام قابلة للتنفيذ.<br/>"
text.project_dashboard_tour_intro="المشاريع في Leantime هي مساحات عمل تعاونية تنظّم فيها أنت وفريقك العمل وتتابعونه وتنجزونه بكفاءة. يعمل كل مشروع كحاوية للأهداف والمهام والمحطات الرئيسية المرتبطة به، ويتيح لك متابعة التقدم في مكان مركزي واحد.<br/><br/>سواء كنت تدير العمل أو الدراسة أو مبادرات شخصية داخلية، توفر مشاريع Leantime البنية والأدوات اللازمة لتحويل الأفكار إلى نتائج ناجحة."
text.wiki_tour_intro="تتيح لك المستندات كتابة الوثائق ومشاركتها مع فريقك. يمكنك إنشاء مساحات متعددة لتنظيم وثائقك حسب الفرق أو المجالات أو فئات المستندات.<br/>أنشئ مستندات لمشاركة المعرفة والعمليات والإجراءات. يمكنك أيضًا إنشاء مستند لمشاركة رابط إلى ملف أو مجلد في التخزين السحابي الخاص بك.<br/>"
text.extend_leantime_latest_plugins="وسّع Leantime باستخدام أحدث إضافاتنا."
support.headline_help_us_build="ساعدنا في بناء مستقبل تزدهر فيه كل العقول!"
support.intro_text_1="تفترض معظم أدوات الإنتاجية أن الجميع يفكرون بالطريقة نفسها: بشكل خطي، وبتركيز تام، وبدافع من مواعيد نهائية اعتباطية. سواء كنت مصابًا باضطراب فرط الحركة ونقص الانتباه وتحتاج إلى جرعات الدوبامين التي تمنحها المهام المنجزة، أو كنت من ذوي التوحد وتتوق إلى بنية ثابتة، أو لديك عسر قراءة وتفكر بشكل مكاني، أو سئمت ببساطة من أدوات لا تتوافق مع طريقة عمل عقلك فعليًا — فمن المحتمل أنك تخليت عن إدارة المشاريع تمامًا."
support.intro_text_2="نحن نبني Leantime للعقول التي تعمل بشكل مختلف. يشمل ذلك العقول المتباينة عصبيًا، وكذلك كل من شعر يومًا بأن الأدوات الحالية تحارب أنماط تفكيره الطبيعية."
