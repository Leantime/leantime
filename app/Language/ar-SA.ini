label.webhook_notifications_description="أرسل إشعاراتك إلى نقطة نهاية HTTPS خاصة بك. لكل إشعار مشروع يحق لك تلقيه، يرسل Leantime طلب HTTP POST واحدًا بمحتوى JSON إلى هذا الرابط. تُرسل الطلبات في الخلفية وقد يستغرق وصولها عدة دقائق، ولا تُعاد محاولة الطلب الذي يفشل. تحدد الفئات ومستويات كل مشروع في تبويب الإشعارات الإشعاراتِ المؤهلة، بما في ذلك التغييرات التي تجريها بنفسك. لا يؤدي إيقاف إشعارات البريد الإلكتروني إلى إيقاف الويب هوك. لا يرسل الويب هوك إلا عندما يكون مفعّلاً ومحددًا له رابط. يبقى رابطك محفوظًا أثناء تعطيل الويب هوك — امسح الرابط لإزالته."
