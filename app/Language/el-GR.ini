text.these_are_system_wide_settings="Αυτές είναι ρυθμίσεις ευρέος συστήματος που θα επηρεάσουν την εμφάνιση και την αίσθηση της εμπειρίας σας σε άπαχο χρόνο."
text.company_name_helper="Εμφανίζεται στον τίτλο της σελίδας και στα μηνύματα ηλεκτρονικού ταχυδρομείου"
text.advanced_boards_helper_content="Οι ιδέες εξελίσσονται, μεγαλώνουν και ωριμάζουν. Αυτό είναι το μέρος για να τις παρακολουθείτε.<br/>Μετακινήστε τις κάρτες ιδεών από τη μία στήλη στην άλλη για να απεικονίσετε την τρέχουσα κατάστασή τους.<br/>Αυτό είναι ένα καλό μέρος για να ξεκινήσετε την έρευνα, να αναπτύξετε πρωτότυπα και να επικυρώσετε αυτά τα πρωτότυπα με μερικούς πελάτες πριν από την έναρξη της εφαρμογής σας."
text.backlog_helper_content="Το backlog είναι το σπίτι όλων των To-Dos σας· αυτών που δουλεύετε τώρα και αυτών που σκοπεύετε να δουλέψετε.<br/><br/>Για να προχωράτε στην ολοκλήρωση του backlog σας, προτείνουμε να εργάζεστε σε σύντομους κύκλους - Sprints.<br/>Τα Sprints είναι χρονικά διαστήματα δύο εβδομάδων που σας επιτρέπουν να εστιάζετε σε μικρότερα, παραδοτέα κομμάτια εργασίας.<br/>Στο τέλος των δύο εβδομάδων θα πρέπει να έχετε κάτι για «επίδειξη». Κάτι που προσφέρει αξία στους χρήστες ή τους πελάτες σας.<br/><br/>Σε αυτή την οθόνη μπορείτε να οργανώνετε και να διαχειρίζεστε τη λίστα με τα To-Dos σας, να ιεραρχείτε το backlog σας με μεταφορά και απόθεση και να μετακινείτε στοιχεία του Backlog στο τρέχον Sprint.<br/>Θέλετε περισσότερες πληροφορίες; Ξεκινήστε την περιήγηση ή κλείστε το παράθυρο για να ξεκινήσετε!"
text.glad_youre_here="Χαιρόμαστε που είστε εδώ. Ας πάρουμε ένα λεπτό για να γνωριστούμε."
text.business_research_section="Το τμήμα Επιχειρηματικής Έρευνας είναι το νέο σας σπίτι για τις ιδέες σας. Αυτή η ενότητα έχει σχεδιαστεί για να σας μεταφέρει μέσα από τα βήματα της ανάπτυξης των πελατών, την έρευνα προβλημάτων, και την ιδέα λύσης."
text.our_roadmap_design="Ο οδικός μας χάρτης έχει σχεδιαστεί για να σας μεταφέρει από μικρότερα διαχειρίσιμα ορόσημα έως μεγάλη ολοκλήρωση εικόνας. Σχεδιάστε για ορόσημα περίπου 3 μήνες και χρησιμοποιήστε αυτούς τους δείκτες του έργου για να μείνετε στο στόχο."
text.this_is_where_you_spend_most_time="Αυτό είναι όπου θα περάσετε το μεγαλύτερο μέρος του χρόνου σας - κάνει. Σχεδιάστε 2 εβδομάδες Sprints σας και εκτελέστε με επιτυχία με το Kanban Board και τα εργαλεία Backlog μας. Χρησιμοποιήστε Retrospectives για να αυξηθεί για το επόμενο Sprint."
text.idea_board_helper_content="Αυτό είναι το μέρος για να συλλέξετε όλες τις ιδέες σας. Συζητήστε νέες με την ομάδα σας και επισυνάψτε Ορόσημα για να δείτε την πρόοδο προς τις ιδέες σας."
text.kanban_helper_content="Kanban είναι η ιαπωνική λέξη για την «κάρτα». Οι πίνακες Kanban ξεκίνησαν από μηχανικούς της Toyota τη δεκαετία του 1940, μαζί με τη λιτή παραγωγή (Lean manufacturing).<br/>Χρησιμοποιούνται για την οπτική και γρήγορη κοινοποίηση πληροφοριών και της προόδου της εργασίας.<br/>Οι πίνακες Kanban είναι χρήσιμοι για την οπτικοποίηση της εργασίας και της κατάστασής της, για τη διαχείριση της ενεργής εργασίας ή της εργασίας σε εξέλιξη, τη διαχείριση της ροής εργασίας και τη γρήγορη ανάληψη δράσης για βελτιώσεις lean."
text.my_timesheets_helper_content="Τα φύλλα χρόνου είναι το σημείο όπου καταγράφετε τις πραγματικές ώρες εργασίας σε ένα To-Do.<br/>Αυτό είναι χρήσιμο για την τιμολόγηση, αλλά και για να ελέγχετε πόσο καλά σχεδιάζετε τις εργασίες σας εκ των προτέρων.<br/>Με τον καιρό, το Leantime μπορεί να προσαρμόζει τις προθεσμίες ώστε να λαμβάνει υπόψη τις αποκλίσεις στον σχεδιασμό."
text.new_project_helper_content="<p>Εδώ περιγράφετε, ορίζετε και καθορίζετε τις παραμέτρους του έργου σας. Αυτό είναι σημαντικό, γιατί είναι το κομμάτι που μεταφέρει σε<br/>ολόκληρη την ομάδα ποιες είναι οι προτεραιότητες, οι προσδοκίες και οι κατευθυντήριες γραμμές του έργου.</p><p><br/><em>Τι να σκεφτείτε εδώ: τα 4C.<br/>Να είστε σαφείς (Clear), συνοπτικοί (Concise), πλήρεις (Complete) και αξιόπιστοι (Credible).<br/><br/></em></p><p>Όταν εφαρμόζετε σωστά αυτές τις αρχές στις περιγραφές των έργων σας, όλοι είναι ενημερωμένοι και μειώνεται ο κίνδυνος λαθών ή λανθασμένων βημάτων.</p><br/>Ώρα να ξεκινήσετε!<br/><br/>"
text.not_found_helper_content="<p>Δεν έχουμε ακόμη περιεχόμενο για αυτή τη σελίδα.<br/>Χρησιμοποιήστε τον σύνδεσμο «Χρειάζεστε βοήθεια» στο κάτω μέρος για να μάθετε περισσότερα για όσα μπορείτε να κάνετε εδώ.</p>"
text.retros_helper_content="<p>Οι αναδρομές είναι σύντομοι αναστοχασμοί σχετικά με την εργασία, τη λειτουργία της ομάδας και, φυσικά, την πρόοδο.<br/>Εδώ η ομάδα σας μπορεί να αφιερώσει λίγο χρόνο για να εστιάσει σε ό,τι πήγε καλά, ό,τι δεν πήγε καλά και ό,τι θα μπορούσε να γίνει διαφορετικά την επόμενη φορά.<br/>Προτείνουμε να πραγματοποιείτε μια συνάντηση ανασκόπησης σε τακτά διαστήματα ή, τουλάχιστον, στο τέλος κάθε ορόσημου.<br/></p>"
text.roadmap_helper_content="<p>Οι χάρτες πορείας βοηθούν στη διάσπαση μεγάλων έργων σε μικρότερα και πιο διαχειρίσιμα κομμάτια.<br/><br/></p><p>Για να δημιουργήσετε τον χάρτη πορείας σας, προτείνουμε να ορίσετε ορόσημα που μπορούν να επιτευχθούν μέσα σε διάστημα 3 μηνών.</p><p>Τα ορόσημα είναι σημεία ελέγχου στη διαδρομή προς την ολοκλήρωση του έργου.<br/>Με απλά λόγια: αν κάνετε ένα οδικό ταξίδι από τη μία άκρη της χώρας στην άλλη, κάθε περιοχή από την οποία περνάτε θα μπορούσε να είναι ένα ορόσημο.<br/><br/>Κάντε κλικ στο «Προσθήκη ορόσημου» επάνω αριστερά για να ξεκινήσετε. Ορίστε την ημερομηνία σε αυτή την καρτέλα ή απευθείας στο διάγραμμα του χάρτη πορείας, κάνοντας κλικ και σύροντας το ορόσημο μέσα στο ημερολόγιο.</p>"
text.show_clients_helper_content="<p>Οι Πελάτες/Προϊόντα οργανώνουν τα έργα σας σε κατηγορίες και σας επιτρέπουν να απομονώνετε διαφορετικές ομάδες.<br/><br/></p><p>Ως σύμβουλος συνεργάζεστε ήδη με πελάτες, και εδώ μπορείτε να τους οργανώσετε.</p><p>Αν είστε ομάδα προϊόντος, μπορείτε να χρησιμοποιήσετε αυτή την ενότητα για να οργανώσετε και να απομονώσετε τα τμήματά σας (μάρκετινγκ, πωλήσεις, λειτουργίες κ.λπ.).</p>"
text.show_projects_helper_content="<p>Τα έργα είναι η καρδιά της επιχείρησής σας και του Leantime! Η αλλαγή, η ανάπτυξη, οι στόχοι και ό,τι μπορείτε να δημιουργήσετε ή να ονειρευτείτε θα περιλαμβάνει έργα.<br/>Η διαχείριση έργων είναι απλώς η διαδικασία που διασφαλίζει ότι τα έργα σας παραδίδονται έγκαιρα, σωστά και με πραγματική επιχειρηματική αξία.<br/><br/>Εδώ θα βρίσκονται τα έργα σας. Η σελίδα έργων σάς επιτρέπει να δημιουργήσετε ένα έργο και να δείτε γρήγορα τον αριθμό των To-Dos, τις ώρες, τον προϋπολογισμό και τον πελάτη που σχετίζεται με το έργο.<br/><br/>Χρησιμοποιήστε αυτή τη σελίδα για μια γρήγορη επισκόπηση όλων των έργων σας.<br/><br/></p>"
text.new_db_version="Μια νέα έκδοση έχει εγκατασταθεί. Για να χρησιμοποιήσετε Leantime θα πρέπει να ενημερώσετε τη βάση δεδομένων σας.<br/><br/><strong>Παρακαλώ σιγουρευτείτε να δημιουργήσετε αντίγραφα ασφαλείας της βάσης δεδομένων σας πριν πραγματοποιήσετε αυτήν την ενημέρωση!</strong><br/>Αυτό μπορεί να διαρκέσει μερικά λεπτά."
text.update_was_successful="Η ενημέρωση ήταν επιτυχής, μπορείτε τώρα να συνδεθείτε. <a href='%1$s'>Πηγαίνετε στο login</a>"
text.this_script_will_set_up_leantime="Αυτό το σενάριο θα δημιουργήσει τη βάση δεδομένων σας και θα δημιουργήσει ένα λογαριασμό διαχειριστή"
text.enter_new_password="Εισάγετε τον νέο κωδικό πρόσβασης για να τον επαναφέρετε."
text.enter_email_address_to_reset="Εισάγετε το email σας για να επαναφέρετε τον κωδικό πρόσβασής σας."
text.twoFA_qr="Σαρώστε τον παρακάτω κωδικό QR στην αγαπημένη σας εφαρμογή OTP / Google Authenticator"
text.twoFA_verify_code="Εισάγετε τον κωδικό που σας δίνεται από την εφαρμογή OTP/το Google Authenticator"
text.twoFA_already_enabled="Ο έλεγχος ταυτότητας δύο παραγόντων είναι ήδη ενεργοποιημένος για το λογαριασμό σας και απαιτείται για τη σύνδεση.<br/><br/>Για να καταργήσετε την ταυτοποίηση δύο παραγόντων, κάντε κλικ στην κατάργηση παρακάτω"
text.twoFA_enabled="Ο λογαριασμός σας έχει έλεγχο ταυτότητας δύο παραγόντων <strong>ενεργοποιημένο</strong>."
text.twoFA_disabled="Ο λογαριασμός σας έχει έλεγχο ταυτότητας δύο παραγόντων <strong>απενεργοποιήθηκε</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Διαχείριση ελέγχου ταυτότητας δύο παραγόντων"
text.who_can_access="Επιλέξτε ποιος επιτρέπεται να δει αυτό το έργο. Από προεπιλογή οι χρήστες θα κληρονομήσουν τους ρόλους με τους οποίους έχουν ρυθμιστεί. Μπορείτε να αλλάξετε αυτούς τους ρόλους κάτω από την καρτέλα 'Ομάδα'"
text.ical_export_description="Εδώ μπορείτε να δημιουργήσετε ένα μοναδικό URL ημερολογίου που θα σας επιτρέψει να ενσωματώσετε το ημερολόγιό σας Leantime σε οποιαδήποτε εφαρμογή που υποστηρίζει τη μορφή 'iCal'. "
text.you_ical_url="Η διεύθυνση URL του ημερολογίου σας βρίσκεται παρακάτω. <br /> Λάβετε υπόψη ότι οποιοσδήποτε έχει αυτή τη διεύθυνση URL μπορεί να αποκτήσει πρόσβαση στο ημερολόγιο. Κρατήστε την μυστική, όπως θα κάνατε με έναν κωδικό πρόσβασης."
