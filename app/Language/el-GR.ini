tour.my_work.welcome_title="Καλώς ήρθατε στην περιήγηση στον πίνακα ελέγχου"
tour.my_work.welcome_text="Ας ξεκινήσουμε με μερικά βασικά, ώστε να εξοικειωθείτε με την πλοήγηση και τα διάφορα στοιχεία του Leantime."
tour.my_work.work_modes_title="Λειτουργίες εργασίας"
tour.my_work.work_modes_text="Η επάνω γραμμή πλοήγησης δείχνει την τρέχουσα «λειτουργία εργασίας» στην οποία βρίσκεστε. Μπορείτε να βρίσκεστε μέσα σε ένα έργο, στον προσωπικό σας χώρο εργασίας ή στη λειτουργία εταιρείας."
tour.my_work.left_nav_text="Η αριστερή πλοήγηση αναλύει την τρέχουσα λειτουργία εργασίας και σας δίνει πρόσβαση σε διάφορες περιοχές. Όλα όσα εμφανίζονται εδώ ανήκουν στη λειτουργία εργασίας που έχει επιλεγεί παραπάνω."
tour.my_work.profile_bar_title="Η γραμμή προφίλ μου"
tour.my_work.profile_bar_text="Εδώ θα βρείτε συνδέσμους προς τον λογαριασμό σας, καθώς και ειδοποιήσεις και τα τελευταία νέα για το Leantime."
tour.my_work.widgets_title="Τα widget του πίνακα ελέγχου σας"
tour.my_work.widgets_text="Ο πίνακας ελέγχου σας χωρίζεται σε διάφορα widget που σας δείχνουν στοχευμένες πληροφορίες για τη δουλειά σας."
tour.my_work.customize_title="Προσαρμόστε τον πίνακα ελέγχου σας"
tour.my_work.customize_text="Μπορείτε να αλλάξετε το μέγεθος των widget και να τα μετακινήσετε με μεταφορά και απόθεση."
tour.my_work.todos_title="Τα To-Dos μου"
tour.my_work.todos_text="Το widget «Τα To-Dos μου» σας δείχνει όλες τις εργασίες που σας έχουν ανατεθεί αυτή τη στιγμή."
tour.my_work.group_todos_title="Ομαδοποίηση To-Dos"
tour.my_work.group_todos_text="Με τα αναπτυσσόμενα μενού εδώ μπορείτε να φιλτράρετε τις εργασίες σας ανά έργο ή να τις ομαδοποιήσετε ανά προτεραιότητα, κατάσταση, έργο ή ημερομηνίες."
tour.my_work.sort_todos_title="Ταξινόμηση To-Dos"
tour.my_work.sort_todos_text="Κάθε To-Do μπορεί να μετακινηθεί με μεταφορά και απόθεση για να αλλάξει η σειρά του. Μπορείτε επίσης να σύρετε μια εργασία στο ημερολόγιο για να την προγραμματίσετε."
tour.my_work.timer_title="Ξεκινήστε το χρονόμετρο"
tour.my_work.timer_text="Όταν είστε έτοιμοι να ξεκινήσετε να δουλεύετε σε μια εργασία, απλώς κάντε κλικ στο κουμπί έναρξης χρονομέτρου."
tour.my_work.complete_task_title="Ολοκληρώστε μια εργασία"
tour.my_work.complete_task_text="Μόλις ολοκληρωθεί μια εργασία, μπορείτε να τη σημειώσετε ως ολοκληρωμένη κάνοντας κλικ στο αναπτυσσόμενο μενού κατάστασης."
tour.my_work.add_tasks_title="Προσθέστε περισσότερες εργασίες"
tour.my_work.add_tasks_text="Μπορείτε να προσθέσετε περισσότερες εργασίες κάνοντας κλικ στο κουμπί συν σε κάθε ενότητα ή από το μενού τριών τελειών δίπλα σε κάθε εργασία."
tour.my_work.finish_text="Ολοκληρώσατε την περιήγηση στον πίνακα ελέγχου «Η Εργασία Μου». Μεταβείτε στο <a href='%s/dashboard/show'>έργο σας</a> για να μάθετε περισσότερα για τη διαχείριση έργων στο Leantime."
tour.project_dashboard.menu_title="Μενού έργου"
tour.project_dashboard.menu_text="Το μενού έργου οργανώνει το έργο σας σε διάφορες ενότητες: <strong>Χώρος δεδομένων</strong> - για να φιλοξενεί όλα τα αρχεία και τις πληροφορίες σας, <strong>Σκεφτείτε</strong> - για στρατηγική, ιδέες και καθορισμό, <strong>Υλοποίηση</strong> - για τη διαχείριση στόχων, οροσήμων και εργασιών."
tour.project_dashboard.selector_title="Επιλογέας έργων"
tour.project_dashboard.selector_text="Χρησιμοποιήστε τον επιλογέα έργων για να μεταβαίνετε από έργο σε έργο. Το αριστερό μενού εμφανίζει όλα όσα σχετίζονται με το τρέχον έργο σας."
tour.project_dashboard.checklist_title="Λίστα ελέγχου"
tour.project_dashboard.checklist_text="Η λίστα ελέγχου του έργου είναι ένας γρήγορος οδηγός για να δείτε αν το έργο σας περιέχει όλες τις απαραίτητες πληροφορίες για επιτυχημένη εκτέλεση."
tour.project_dashboard.status_title="Γρήγορες ενημερώσεις κατάστασης"
tour.project_dashboard.status_text="Με τις ενημερώσεις κατάστασης μπορείτε να μοιραστείτε γρήγορα την πρόοδο του έργου σας με την ομάδα σας, χρησιμοποιώντας κόκκινο, κίτρινο και πράσινο χρώμα. Η κατάσταση θα είναι ορατή σε όλη την εφαρμογή."
tour.project_dashboard.progress_title="Πρόοδος"
tour.project_dashboard.progress_text="Ο δείκτης προόδου του έργου σας δείχνει πόση δουλειά έχετε ολοκληρώσει. Λαμβάνει υπόψη τα διάφορα μεγέθη εργασιών, την ταχύτητα της ομάδας και τα ορόσημα του έργου."
tour.project_dashboard.latest_tasks_title="Τελευταίες εργασίες"
tour.project_dashboard.latest_tasks_text="Η λίστα τελευταίων εργασιών σας δείχνει τις πιο πρόσφατες εργασίες που προστέθηκαν στο έργο σας και μπορεί να χρησιμοποιηθεί ως θυρίδα εισερχομένων του έργου."
tour.project_dashboard.team_title="Ομάδα"
tour.project_dashboard.team_text="Το πλαίσιο ομάδας σας δείχνει τα μέλη αυτού του έργου."
tour.project_dashboard.finish_text="Ολοκληρώσατε την περιήγηση στον πίνακα ελέγχου του έργου. Μεταβείτε στην ενότητα <a href='%s/tickets/showKanban'>To-Dos</a> για να μάθετε περισσότερα για τους διάφορους τρόπους διαχείρισης των εργασιών σας στο Leantime."
tour.kanban_board.overview_title="Ο πίνακας Kanban σας"
tour.kanban_board.overview_text="Αυτός είναι ο πίνακας Kanban σας. Σας βοηθά να οπτικοποιείτε τη δουλειά σας και να περιορίζετε την εργασία σε εξέλιξη."
tour.kanban_board.workflow_title="Ροή εργασίας"
tour.kanban_board.workflow_text="Οι εργασίες μετακινούνται από αριστερά προς τα δεξιά καθώς προχωρούν. Σύρετε και αποθέστε κάρτες για να ενημερώσετε την κατάστασή τους."
tour.kanban_board.columns_title="Ευέλικτες στήλες"
tour.kanban_board.columns_text="Από το μενού τριών τελειών μπορείτε να προσθέσετε, να αφαιρέσετε και να μετονομάσετε στήλες."
tour.kanban_board.filter_title="Φιλτράρισμα εργασιών"
tour.kanban_board.filter_text="Μπορείτε να φιλτράρετε τις εργασίες σας με βάση διάφορα πεδία, όπως προτεραιότητα, κατάσταση, έργο ή ημερομηνίες."
tour.kanban_board.swimlanes_title="Λωρίδες"
tour.kanban_board.swimlanes_text="Επιπλέον, μπορείτε να ομαδοποιήσετε τις εργασίες σας για να δημιουργήσετε λωρίδες Kanban. Έτσι οπτικοποιείτε τη δουλειά σας ανά μέλος της ομάδας, προτεραιότητα ή ορόσημο."
tour.kanban_board.sprints_title="Sprint"
tour.kanban_board.sprints_text="Αν οργανώνετε τη δουλειά σας σε Sprint, μπορείτε να χρησιμοποιήσετε το αναπτυσσόμενο μενού εδώ για να επιλέξετε, να δημιουργήσετε και να ενημερώσετε Sprint."
tour.kanban_board.finish_text="Η περιήγηση στο Kanban ολοκληρώθηκε. Μεταβείτε στην ενότητα <a href='%s/tickets/roadmap'>Ορόσημα</a> για να μάθετε πώς να δημιουργείτε και να διαχειρίζεστε ορόσημα στο Leantime."
tour.milestones.overview_title="Ορόσημα"
tour.milestones.overview_text="Τα ορόσημα σας βοηθούν να παρακολουθείτε σημαντικά αποτελέσματα και φάσεις του έργου."
tour.milestones.drag_title="Μεταφορά & ταξινόμηση"
tour.milestones.drag_text="Κάθε γραμμή αντιστοιχεί σε ένα ορόσημο. Μπορείτε να τις σύρετε κατά μήκος του χρονοδιαγράμματος, να αλλάξετε τη σειρά τους και το μέγεθός τους. Ό,τι κάνετε σε αυτή την οθόνη ενημερώνει τον χρονισμό των οροσήμων σας."
tour.milestones.filter_title="Φιλτράρισμα"
tour.milestones.filter_text="Μπορείτε να φιλτράρετε τα ορόσημά σας και να δείτε επίσης τις εργασίες που ανήκουν σε αυτά."
tour.milestones.timeframes_title="Χρονικά πλαίσια"
tour.milestones.timeframes_text="Μπορείτε να αλλάξετε το χρονικό πλαίσιο της προβολής χρονοδιαγράμματος για να δείτε μεγαλύτερο μέρος του έτους ή να εμβαθύνετε σε ημερήσια ανάλυση."
tour.milestones.finish_text="Η περιήγηση στα ορόσημα ολοκληρώθηκε. Μεταβείτε στην ενότητα <a href='%s/goalcanvas/dashboard'>Στόχοι</a> για να μάθετε πώς να δημιουργείτε και να διαχειρίζεστε στόχους στο Leantime."
tour.goals.overview_title="Στόχοι"
tour.goals.overview_text="Οι στόχοι σας βοηθούν να παρακολουθείτε τον μετρήσιμο αντίκτυπο στα έργα σας."
tour.goals.parts_title="Σκοποί & μετρήσεις"
tour.goals.parts_text="Κάθε στόχος αποτελείται από έναν σκοπό (αυτό που προσπαθείτε να πετύχετε) και μια μέτρηση (πώς θα τον μετρήσετε)."
tour.goals.progress_title="Πρόοδος στόχου"
tour.goals.progress_text="Καθώς ενημερώνετε τις μετρήσεις των στόχων σας, η γραμμή προόδου θα σας δείχνει πόσο έχετε προχωρήσει."
tour.goals.milestones_title="Ορόσημα & στόχοι"
tour.goals.milestones_text="Μπορείτε να συνδέσετε στόχους με ορόσημα για να παρακολουθείτε την πρόοδο των στόχων σας σε επίπεδο εργασιών. Αυτό σας βοηθά να εντοπίζετε κενά στο πλάνο του έργου σας."
tour.goals.finish_text="Η περιήγηση στους στόχους ολοκληρώθηκε. Τα ορόσημα, οι στόχοι και τα To-Dos είναι τα βασικά δομικά στοιχεία του Leantime. Χρησιμοποιήστε τα για να χωρίσετε τη δουλειά σας σε διαχειρίσιμα κομμάτια. Μεταβείτε στον <a href='%s/tickets/showKanban'>πίνακα Kanban</a> για να δείτε τις εργασίες σας."
