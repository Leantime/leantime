label.webhook_notifications_description="Στείλτε τις ειδοποιήσεις σας στο δικό σας endpoint HTTPS. Για κάθε ειδοποίηση έργου για την οποία είστε επιλέξιμοι, το Leantime στέλνει ένα αίτημα HTTP POST με σώμα JSON σε αυτή τη διεύθυνση URL. Τα αιτήματα αποστέλλονται στο παρασκήνιο και μπορεί να χρειαστούν αρκετά λεπτά για να φτάσουν· ένα αίτημα που αποτυγχάνει δεν επαναλαμβάνεται. Οι κατηγορίες και τα επίπεδα ανά έργο στην καρτέλα Ειδοποιήσεις καθορίζουν ποιες ειδοποιήσεις είναι επιλέξιμες, μαζί με τις αλλαγές που κάνετε εσείς. Η απενεργοποίηση των ειδοποιήσεων email δεν σταματά το webhook. Το webhook στέλνει μόνο όταν είναι ενεργοποιημένο και έχει οριστεί διεύθυνση URL. Η διεύθυνση URL σας παραμένει αποθηκευμένη όσο το webhook είναι απενεργοποιημένο — διαγράψτε τη διεύθυνση URL για να την αφαιρέσετε."
