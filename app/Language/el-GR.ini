text.my_work_dashboard_intro="Ο πίνακας ελέγχου «Η Εργασία Μου» φέρνει στο προσκήνιο ό,τι έχει σημασία.<br/>Η πιο σημαντική εργασία σας βρίσκεται πλέον σε πρώτο πλάνο, οργανωμένη αποκλειστικά για εσάς και για τον τρόπο που λειτουργεί καλύτερα το μυαλό σας.<br/><br/>Από γρήγορες εργασίες έως φιλόδοξους στόχους, ό,τι χρειάζεστε βρίσκεται εδώ. Αυτός είναι ο χώρος σας για να καταγράφετε ιδέες, να παρακολουθείτε την πρόοδο και να γιορτάζετε τις επιτυχίες σας στην πορεία."
text.blueprints_intro="Τα Σχεδιαγράμματα σας δίνουν την ευκαιρία να βγάλετε νόημα από όλα τα δεδομένα. Το Leantime διαθέτει μια ποικιλία εργαλείων και καμβάδων για να ορίσετε το υπόβαθρο του έργου σας μέσω Καμβάδων Επιχειρηματικού Μοντέλου, Ανάλυσης SWOT ή Χαρτών Ενσυναίσθησης.<br/><br/>Αν δεν ξέρετε από πού να ξεκινήσετε, σας προτείνουμε να δημιουργήσετε έναν «Καμβά Αξίας Έργου». Αυτός ο καμβάς θα απαντήσει στις πιο σημαντικές ερωτήσεις του έργου σας: Ποιος είναι ο πελάτης σας;<br/>Ποιο πρόβλημα λύνετε;<br/>Ποια είναι η λύση σας;<br/>Ποιο όφελος προσφέρει η λύση σας σε σχέση με τους ανταγωνιστές σας;<br/>"
text.goals_tour_intro="Οι Στόχοι σας επιτρέπουν να χωρίσετε το έργο σας σε εφικτά, μετρήσιμα και εφαρμόσιμα κομμάτια.<br/>Ενώ τα ορόσημα εστιάζουν στην εκτέλεση, οι στόχοι αφορούν τις μετρήσεις που θέλετε να πετύχετε.<br/>Κάθε στόχος πρέπει να έχει σαφή σκοπό (αυτό που θέλετε να πετύχετε) και να μετριέται εύκολα με μία μόνο μέτρηση.<br/><br/>Μόλις έχετε έναν στόχο, μπορείτε να του αναθέσετε ορόσημα για να τον αναλύσετε σε εκτελέσιμες εργασίες.<br/>"
text.project_dashboard_tour_intro="Τα έργα στο Leantime είναι συνεργατικοί χώροι εργασίας όπου εσείς και η ομάδα σας οργανώνετε, παρακολουθείτε και παραδίδετε εργασία αποτελεσματικά. Κάθε έργο λειτουργεί ως φάκελος για σχετικούς στόχους, εργασίες και ορόσημα και σας επιτρέπει να παρακολουθείτε την πρόοδο από ένα κεντρικό σημείο.<br/><br/>Είτε διαχειρίζεστε επαγγελματική εργασία, σπουδές ή προσωπικές πρωτοβουλίες, τα έργα του Leantime παρέχουν τη δομή και τα εργαλεία που χρειάζονται για να μετατρέψετε τις ιδέες σε επιτυχημένα αποτελέσματα."
text.wiki_tour_intro="Τα Έγγραφα σας επιτρέπουν να γράφετε και να μοιράζεστε τεκμηρίωση με την ομάδα σας. Μπορείτε να δημιουργήσετε πολλούς χώρους για να οργανώσετε την τεκμηρίωσή σας ανά ομάδα, τομέα ή κατηγορία εγγράφων.<br/>Δημιουργήστε έγγραφα για να μοιράζεστε γνώση, διαδικασίες και οδηγίες. Μπορείτε επίσης να δημιουργήσετε ένα έγγραφο για να μοιραστείτε έναν σύνδεσμο προς ένα αρχείο ή φάκελο στον χώρο αποθήκευσης cloud σας.<br/>"
text.extend_leantime_latest_plugins="Επεκτείνετε το Leantime με τα πιο πρόσφατα πρόσθετά μας."
support.headline_help_us_build="Βοηθήστε μας να χτίσουμε ένα μέλλον όπου κάθε μυαλό ευδοκιμεί!"
support.intro_text_1="Τα περισσότερα εργαλεία παραγωγικότητας υποθέτουν ότι όλοι σκέφτονται με τον ίδιο τρόπο: γραμμικά, με τέλεια συγκέντρωση, με κίνητρο αυθαίρετες προθεσμίες. Είτε έχετε ΔΕΠΥ και χρειάζεστε τη δόση ντοπαμίνης από τις ολοκληρωμένες εργασίες, είτε είστε αυτιστικοί και χρειάζεστε σταθερή δομή, είτε έχετε δυσλεξία και σκέφτεστε χωρικά, είτε απλώς έχετε κουραστεί από εργαλεία που δεν ταιριάζουν με τον τρόπο που λειτουργεί πραγματικά το μυαλό σας—πιθανότατα έχετε εγκαταλείψει εντελώς τη διαχείριση έργων."
support.intro_text_2="Χτίζουμε το Leantime για μυαλά που λειτουργούν διαφορετικά. Αυτό περιλαμβάνει τα νευροαποκλίνοντα μυαλά, αλλά και οποιονδήποτε έχει νιώσει ποτέ ότι τα υπάρχοντα εργαλεία πάνε κόντρα στον φυσικό τρόπο σκέψης του."
