support.marcel_name="👋 Είμαι ο Marcel"
support.marcel_tagline="Γερμανός μετανάστης, μπαμπάς μιας αυτιστικής κόρης και ζω κι εγώ με ΔΕΠΥ."
support.marcel_bio_1="Τα παραδοσιακά εργαλεία διαχείρισης έργων δεν μου ταίριαξαν ποτέ. Μου έδιναν την αίσθηση ότι είχαν φτιαχτεί από νευροτυπικά μυαλά για νευροτυπικά μυαλά. Όταν εργαζόμουν ως freelancer και πάλευα να κρατήσω οργανωμένα τα έργα των πελατών μου, άρχισα να φτιάχνω κάτι που να λειτουργεί μαζί με το μυαλό μου αντί να του πηγαίνει κόντρα."
support.marcel_bio_2="Αυτό που ξεκίνησε ως προσωπική λύση έγινε το Leantime, όταν συνειδητοποίησα ότι εκατομμύρια άλλοι χρειάζονταν το ίδιο πράγμα."
support.gloria_name="👋 Κι εγώ είμαι η Gloria"
support.gloria_tagline="Πρώην νοσηλεύτρια επειγόντων που έγινε product manager, επιχειρηματίας ισπανόφωνης καταγωγής πρώτης γενιάς."
support.gloria_bio_1="Πέρασα χρόνια σε ιατρικά περιβάλλοντα υψηλής πίεσης όπου η οργάνωση κυριολεκτικά σώζει ζωές. Όταν όμως ξεκίνησα τη δική μου επιχείρηση, τα παραδοσιακά εργαλεία έργων μου φαίνονταν συντριπτικά και αποκομμένα από τον τρόπο που πραγματικά σκέφτομαι και εργάζομαι."
support.gloria_bio_2="Το υπόβαθρό μου στις συμπεριφορικές επιστήμες και στην έρευνα για τα κίνητρα καθοδηγεί τον τρόπο που χτίζουμε λειτουργίες που δεν οργανώνουν απλώς εργασίες—σας βοηθούν να θέλετε πραγματικά να τις ολοκληρώσετε."
support.closing_text="Μπορούμε να δημιουργήσουμε έναν κόσμο όπου κανείς δεν χρειάζεται να παλεύει με τα εργαλεία του για να κάνει σπουδαία δουλειά. Η χορηγία σας χρηματοδοτεί ένα μέλλον όπου το λογισμικό προσαρμόζεται στην ανθρώπινη ποικιλομορφία, και όχι το αντίστροφο."
support.headline_ready_to_impact="Έτοιμοι να έχετε άμεσο αντίκτυπο;"
support.contribution_text="Κάθε συνεισφορά—από 1 $ έως 100 $—πηγαίνει απευθείας στο να γίνει το Leantime καλύτερο για όλους."
