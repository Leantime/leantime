text.help_dashboard_intro="Το Leantime έχει σχεδιαστεί για να ενισχύει τις υπερδυνάμεις σας και να σας βοηθά να βλέπετε την πρόοδό σας προς τους στόχους σας.<br /><br />Οι περισσότεροι από εμάς έχουμε συνηθίσει να φτιάχνουμε λίστες εργασιών — εμείς όμως θα σας ζητήσουμε να σκεφτείτε τι ακριβώς προσπαθείτε να πετύχετε.<br /><br />1. Ορίστε ένα όραμα (στρατηγική) και τους στόχους σας<br />2. Καθορίστε τη δουλειά που θα σας οδηγήσει σε αυτούς τους στόχους<br />3. Και έπειτα πετύχετέ τους, οργανώνοντας την καθημερινότητά σας με τον πίνακα ελέγχου «Η Εργασία Μου».<br />"
