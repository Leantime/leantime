text.mattermost_instructions=" Αυτή η ενσωμάτωση θα δημοσιεύσει ειδοποιήσεις ενημέρωσης στο κανάλι της επιλογής σας.<br/>Ακολουθήστε τις οδηγίες <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>εδώ για να πάρετε μια εισερχόμενη διεύθυνση URL</a> από Mattermost. Στη συνέχεια, επικολλήστε το σύνδεσμο στη φόρμα στα δεξιά και κάντε κλικ στην επιλογή Αποθήκευση."
text.slack_instructions="Αυτή η ενσωμάτωση θα δημοσιεύσει ειδοποιήσεις ενημέρωσης στο κανάλι της επιλογής σας.<br/>Ακολουθήστε τις οδηγίες <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>εδώ για να πάρετε μια εισερχόμενη διεύθυνση URL</a> από το Slack. Στη συνέχεια, επικολλήστε το σύνδεσμο στη φόρμα στα δεξιά και κάντε κλικ στην επιλογή Αποθήκευση."
text.choose_access_for_users="Επιλέξτε ή αποεπιλέξτε τους χρήστες που θέλετε να προσθέσετε/αφαιρέσετε. Μπορείτε να μάθετε περισσότερα για τους ρόλους στο <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
