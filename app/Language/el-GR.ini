text.zulip_instructions="Αυτή η ενσωμάτωση θα δημοσιεύσει ειδοποιήσεις για τη ροή και το θέμα της επιλογής σας.<br/>Ακολουθήστε τις οδηγίες <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>εδώ για να δημιουργήσετε ένα νέο bot</a>. Στη συνέχεια, επικολλήστε τις πληροφορίες στη φόρμα στα δεξιά και κάντε κλικ στην επιλογή Αποθήκευση."
text.discord_instructions="Αυτή η ενσωμάτωση θα δημοσιεύσει ειδοποιήσεις ενημέρωσης στο κανάλι της επιλογής σας.<br/>Ακολουθήστε τις οδηγίες <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>εδώ για να δημιουργήσετε ένα νέο webhook(s)</a>, στη συνέχεια επικολλήστε τους συνδέσμους στα δεξιά και κάντε κλικ στο στοιχείο Αποθήκευση."
