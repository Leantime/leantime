label.onboarding_default_project_name="Το Έργο Μου"
text.onboarding_default_project_details="Καλώς ήρθατε στο πρώτο σας έργο στο Leantime!<br />Αυτός είναι ο χώρος σας για να οργανώνετε εργασίες, να παρακολουθείτε στόχους και να σχεδιάζετε τη δουλειά σας. Μπορείτε ελεύθερα να αλλάξετε οτιδήποτε εδώ ή να δημιουργήσετε επιπλέον έργα καθώς εξελίσσεστε. Αυτό το έργο είναι μόνο για εσάς, για να ξεκινήσετε"
label.onboarding_milestone_getting_started="Πρώτα βήματα"
label.onboarding_task_community_chat="Γίνετε μέλος της συνομιλίας της κοινότητάς μας"
text.onboarding_task_community_chat="Η συνομιλία της κοινότητάς μας είναι εξαιρετικό μέρος για να κάνετε ερωτήσεις και να λάβετε σχόλια για τη δομή του έργου σας. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Συνομιλία κοινότητας</a>"
label.onboarding_task_invite_team="Προσκαλέστε τους συνεργάτες σας"
text.onboarding_task_invite_team="Είτε δουλεύετε με κάποιον είτε απλώς χρειάζεστε κάποιον να σας κρατά συνεπείς, η χρήση του Leantime ως ομάδα σας βοηθά να παραμένετε σε τροχιά και με κίνητρο <a href='%s'>Διαχείριση Χρηστών</a>"
label.onboarding_task_project_structure="Μάθετε περισσότερα για τη δομή έργων του Leantime"
text.onboarding_task_project_structure="Η τεκμηρίωση βοήθειάς μας περιέχει πολλούς επιπλέον πόρους. Για να μάθετε περισσότερα για τη δομή έργων στο Leantime και τις βέλτιστες πρακτικές, επισκεφθείτε: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Δημιουργήστε έναν Στόχο"
text.onboarding_task_create_goal="Οι στόχοι χρησιμοποιούνται για την παρακολούθηση και τη μέτρηση μακροπρόθεσμων σκοπών. Πρέπει να είναι μετρήσιμοι, με μετρήσεις που μπορείτε να ενημερώνετε τακτικά. Οι στόχοι και τα ορόσημα μπορούν να συνδεθούν, ώστε να βλέπετε την πρόοδο της εκτέλεσης μαζί με την πρόοδο των μετρήσεων <a href='%s'>Στόχοι Έργου</a>"
label.onboarding_task_create_milestone="Δημιουργήστε ένα Ορόσημο"
text.onboarding_task_create_milestone="Τα ορόσημα σας επιτρέπουν να οργανώνετε τις φάσεις των έργων σας σε διακριτά αποτελέσματα. Κάθε ορόσημο έχει ημερομηνία έναρξης και λήξης και πρέπει να παραδίδει κάποιο αποτέλεσμα <a href='%s'>Ορόσημα Έργου</a>"
label.onboarding_task_personal_project="Εξερευνήστε το Προσωπικό σας Έργο"
text.onboarding_task_personal_project="Το προσωπικό σας έργο είναι ένας χώρος όπου μπορείτε να οργανώνετε τις εργασίες, τους στόχους και τη δουλειά σας. Μπορείτε να το ανοίξετε από τον επιλογέα έργων στο επάνω μέρος ή κάνοντας κλικ σε αυτόν τον σύνδεσμο: <a href='%s'>Το Έργο Μου</a>"
label.onboarding_task_complete_profile="Ολοκλήρωση του προφίλ μου στο Leantime"
text.onboarding_task_complete_profile="Ενημέρωση της εικόνας προφίλ και ολοκλήρωση των προτιμήσεων εργασίας για εξατομίκευση της εμπειρίας μου. <a href='%s'>Το Προφίλ Μου</a>"
label.onboarding_goalboard_title="Οι Στόχοι Μου"
label.onboarding_goal_metric="Εργασίες που ολοκληρώθηκαν εγκαίρως"
label.onboarding_goal_objective="Δημιουργία του συστήματος παραγωγικότητάς μου"
