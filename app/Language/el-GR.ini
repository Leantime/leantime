text.lean.helper_content="Ο καμβάς lean θα σας καθοδηγήσει σε ολόκληρη τη διαδικασία επικύρωσης της νέας επιχειρηματικής ιδέας ή/και της ιδέας προϊόντος σας.<br/>Θα ασχοληθείτε με το <em>Τμήμα Πελατών</em>, το <em>Πρόβλημα, τη Λύση</em>.<br/>Από εκεί θα περάσετε στη <em>Μοναδική Πρόταση Αξίας</em> (τι κάνει την ιδέα σας καλύτερη από άλλες προσφορές;), στα <em>Κανάλια Διανομής</em> (πώς θα φτάσει η λύση σας στους πελάτες;), στις <em>Ροές Εσόδων</em> (πώς θα αποφέρει έσοδα η λύση σας;), στη <em>Δομή Κόστους</em> (πόσο αξίζει η λύση σας;), στις <em>Βασικές Μετρήσεις</em> (πώς θα μετρήσετε την επιτυχία;) και στο <em>Ανταγωνιστικό Πλεονέκτημα</em> (τι διαθέτετε που θα σας βοηθήσει να πετύχετε απέναντι στον ανταγωνισμό;)<br/>Οι απαντήσεις σε αυτές τις ερωτήσεις έχουν σκοπό να προάγουν την επιτυχία, να περιορίζουν την αποτυχία και να σας επιτρέπουν να παρακολουθείτε και να επικυρώνετε τις υποθέσεις σας. Το να είστε Lean σημαίνει να εξαλείφετε τη σπατάλη και να δημιουργείτε προϊόντα, επιχειρήσεις και λύσεις που χρειάζονται οι πελάτες σας."
text.lean.disclaimer="Ο αδύνατος καμβάς είναι προσαρμοσμένος από την άδεια <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> και έχει αδειοδοτηθεί από την άδεια <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Μόλις νιώσετε άνετα με τον αδύνατο καμβά σας, πηγαίνετε στο</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Planner Roadmap</a>"


