text.mattermost_instructions="此集成会将更新通知发布到您选择的频道。<br/>按照来自 Mattermost 网页的说明进行操作 <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>在这里获取的传入 Webhook URL</a> 之后将链接粘贴到右侧的表单中再单击保存。"
text.slack_instructions="此集成会将更新通知发布到您选择的频道。<br/>按照来自 Slack 网页的说明进行操作 <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>在这里获取的传入 Webhook URL</a> 之后将链接粘贴到右侧的表单中再单击保存。"
text.choose_access_for_users="选择有权访问该项目的成员。<a href='/users/showAll/'>在此处新增更多成员</a>"
text.expected_to_finish_by="预期完成日期"
text.zulip_instructions="此集成会将更新通知发布到您选择的流和主题。<br/>按照来自 Zulip 网页的说明进行操作 <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>在这里创建一个新的 Bot</a> 之后将信息粘贴到右侧的表单中再单击保存。"
text.discord_instructions="此集成会将更新通知发布到您选择的频道。<br/>按照来自 Discord 网页的说明进行操作 <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>在这里创建一个新的 Webhook</a> 之后将链接粘贴到右侧的表单中再单击保存。"
