tour.project_dashboard.menu_text="项目菜单将您的项目划分为不同的部分：<strong>数据室</strong>——存放您所有的文件和信息；<strong>思考</strong>——制定策略、构思创意并明确定义；<strong>制作</strong>——管理目标、里程碑和任务。"
tour.project_dashboard.selector_title="项目选择器"
tour.project_dashboard.selector_text="使用项目选择器在项目之间切换。左侧菜单会显示与当前项目相关的所有内容。"
tour.project_dashboard.checklist_title="检查清单"
tour.project_dashboard.checklist_text="项目检查清单可供您快速查看项目是否包含成功执行所需的全部信息。"
tour.project_dashboard.status_title="快速状态更新"
tour.project_dashboard.status_text="您可以使用状态更新，通过红、黄、绿三种颜色快速与团队分享项目进展。该状态将在整个应用中可见。"
tour.project_dashboard.progress_title="进度"
tour.project_dashboard.progress_text="项目进度指示器显示您已完成了多少工作。它会综合考虑不同的任务规模、团队速度和项目里程碑。"
tour.project_dashboard.latest_tasks_title="最新任务"
tour.project_dashboard.latest_tasks_text="最新任务列表显示最近添加到项目中的任务，可用作项目收件箱。"
tour.project_dashboard.team_title="团队"
tour.project_dashboard.team_text="团队区域显示此项目的成员。"
tour.project_dashboard.finish_text="您已完成项目仪表盘导览。前往<a href='%s/tickets/showKanban'>待办任务</a>，了解在 Leantime 中管理任务的各种方式。"
tour.kanban_board.overview_title="您的看板"
tour.kanban_board.overview_text="这是您的看板。它可以帮助您将工作可视化，并限制进行中的工作量。"
tour.kanban_board.workflow_title="工作流"
tour.kanban_board.workflow_text="任务会随着进展从左向右移动。拖放卡片即可更新其状态。"
tour.kanban_board.columns_title="灵活的列"
tour.kanban_board.columns_text="使用三点菜单，您可以添加、删除和重命名列。"
tour.kanban_board.filter_title="筛选任务"
tour.kanban_board.filter_text="您可以按优先级、状态、项目或日期等各种字段筛选任务。"
tour.kanban_board.swimlanes_title="泳道"
tour.kanban_board.swimlanes_text="此外，您还可以对任务进行分组以创建看板泳道。这有助于您按团队成员、优先级或里程碑将工作可视化。"
tour.kanban_board.sprints_title="Sprint 冲刺"
tour.kanban_board.sprints_text="如果您以 Sprint 冲刺的方式管理工作，可以使用这里的下拉菜单来选择、创建和更新 Sprint 冲刺。"
tour.kanban_board.finish_text="看板导览到此结束。前往<a href='%s/tickets/roadmap'>里程碑</a>，了解如何在 Leantime 中创建和管理里程碑。"
tour.milestones.overview_title="里程碑"
tour.milestones.overview_text="里程碑可帮助您跟踪主要成果和项目阶段。"
tour.milestones.drag_title="拖动与排序"
tour.milestones.drag_text="每个条形代表一个里程碑。您可以沿时间轴拖动它们、重新排序并调整其长度。您在此屏幕上的所有操作都会更新里程碑的时间安排。"
tour.milestones.filter_title="筛选"
tour.milestones.filter_text="您可以筛选里程碑，还可以查看属于这些里程碑的任务。"
tour.milestones.timeframes_title="时间范围"
tour.milestones.timeframes_text="您可以更改时间轴视图的时间范围，以查看一年中的更多时间，或深入查看按天的细分。"
tour.milestones.finish_text="里程碑导览到此结束。前往<a href='%s/goalcanvas/dashboard'>目标</a>，了解如何在 Leantime 中创建和管理目标。"
tour.goals.overview_title="目标"
tour.goals.overview_text="目标可帮助您跟踪项目中可衡量的影响。"
tour.goals.parts_title="目的与指标"
tour.goals.parts_text="每个目标都由一个“目的”（您想要实现什么）和一个“指标”（您将如何衡量它）组成。"
tour.goals.progress_title="目标进度"
tour.goals.progress_text="当您更新目标指标时，进度条会显示您已取得多少进展。"
tour.goals.milestones_title="里程碑与目标"
tour.goals.milestones_text="您可以将目标关联到里程碑，以跟踪目标在任务层面的进度。这有助于发现项目计划中的缺口。"
tour.goals.finish_text="目标导览到此结束。里程碑、目标和待办任务是 Leantime 中的基本构建模块。使用它们将您的工作分解为易于管理的小块。前往<a href='%s/tickets/showKanban'>看板</a>查看您的任务。"
