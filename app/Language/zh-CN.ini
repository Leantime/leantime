text.lean.helper_content="精益画布将带您完成新业务和/或产品创意的完整验证过程。<br/>您将解决您的<em>客户细分、问题、解决方案</em>。<br/>然后，您将进入您的<em>独特的价值主张</em>（您的创意相比其他产品有何优势？），您的<em>分销渠道</em>（您将如何将解决方案提供给客户？），您的<em>收入流</em>（您的解决方案如何盈利？），您的<em>成本结构</em>（您的解决方案价值多少？），<em>关键指标</em>（您将如何衡量成功？）和<em>不公平的优势</em>（您有什么可以帮助您在竞争中取得成功的优势？）<br/>回答这些问题旨在促进成功、减少失败，并允许您跟踪和验证您的假设。精益是指消除浪费，努力构建您的客户需要的产品、业务和解决方案。"
text.lean.disclaimer="精益画布改编自<a href='https://strategyzer.com/' target='_blank'>商业模型画布</a>，并根据<a href='https://creativecommons.org/licenses/by-sa/3.0/'>知识共享署名-相同方式共享 3.0</a>许可证进行许可"
