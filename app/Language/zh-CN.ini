support.marcel_name="👋 我是 Marcel"
support.marcel_tagline="德国移民，一位自闭症女儿的父亲，我自己也有 ADHD。"
support.marcel_bio_1="传统的项目管理工具从来都不适合我。它们感觉像是由神经典型的人为神经典型的人打造的。当我做自由职业、努力让客户项目保持条理时，我开始打造一个顺应而不是对抗我大脑的工具。"
support.marcel_bio_2="当我意识到还有数百万人需要同样的东西时，这个个人解决方案就变成了 Leantime。"
support.gloria_name="👋 我是 Gloria"
support.gloria_tagline="前急诊室护士，后转型为产品经理，第一代西班牙裔创业者。"
support.gloria_bio_1="我曾在高压的医疗环境中工作多年，在那里，条理性真的能挽救生命。但当我开始创业时，传统的项目工具让我感到不堪重负，与我实际的思考和工作方式脱节。"
support.gloria_bio_2="我在行为科学和动机研究方面的背景，驱动着我们打造这样的功能：它们不只是组织任务，更能让你真正想去完成它们。"
support.closing_text="我们可以创造一个世界，让任何人都不必与工具较劲就能做出出色的工作。你的赞助将资助这样一个未来：软件适应人类的多样性，而不是反过来。"
support.headline_ready_to_impact="准备好直接产生影响了吗？"
support.contribution_text="每一份贡献——从 $1 到 $100——都将直接用于让 Leantime 对每个人都更好。"
support.start_sponsoring_button="立即开始赞助"
