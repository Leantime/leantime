text.my_work_dashboard_intro="你的“我的工作”仪表盘让所有重要事项一目了然。<br/>你最重要的工作现在就摆在眼前，并按照你自己以及你的大脑最擅长的方式进行组织。<br/><br/>从快速任务到宏大目标，你需要的一切都在这里。这是你记录想法、跟踪进度并一路庆祝成果的空间。"
text.blueprints_intro="蓝图让你有机会理清所有数据。Leantime 提供多种工具和画布，可通过商业模式画布、SWOT 分析或同理心地图来定义项目背景。<br/><br/>如果你不知道从何开始，我们建议先创建一个“项目价值画布”。该画布将回答项目中最重要的问题：你的客户是谁？<br/>你要解决什么问题？<br/>你的解决方案是什么？<br/>与竞争对手相比，你的解决方案有什么优势？<br/>"
text.goals_tour_intro="目标可以帮助你将项目拆分为可实现、可衡量且可执行的部分。<br/>里程碑侧重于执行，而目标关注你想要达成的指标。<br/>每个目标都应有清晰的目的（你想达成的事情），并且应能用单一指标轻松衡量。<br/><br/>设定目标后，你可以为其分配里程碑，将其进一步拆分为可执行的任务。<br/>"
text.project_dashboard_tour_intro="Leantime 中的项目是协作工作空间，你和团队可以在其中高效地组织、跟踪和交付工作。每个项目都是相关目标、任务和里程碑的容器，让你可以在一个集中的位置监控进度。<br/><br/>无论你是在管理工作、学业还是内部的个人事务，Leantime 项目都能提供所需的结构和工具，帮助你把想法变成成功的成果。"
text.wiki_tour_intro="我们的文档功能让你可以撰写文档并与团队共享。你可以创建多个空间，按团队、领域或文档类别来组织文档。<br/>创建文档来分享知识、流程和规程。你也可以创建一个文档，用来分享云存储中某个文件或文件夹的链接。<br/>"
text.extend_leantime_latest_plugins="使用我们最新的插件扩展 Leantime。"
support.headline_help_us_build="帮助我们构建一个让每种头脑都能茁壮成长的未来！"
support.intro_text_1="大多数效率工具都假设每个人的思维方式都一样：线性的、注意力完美集中、被武断的截止日期驱动。无论你是有 ADHD、需要通过完成任务获得多巴胺刺激，还是自闭症人士、渴望稳定一致的结构，或是有阅读障碍、偏向空间思维，又或者只是厌倦了那些与大脑实际运作方式不符的工具——你可能早已彻底放弃了项目管理。"
support.intro_text_2="我们正在为思维方式与众不同的人打造 Leantime。这包括神经多样性人群，也包括任何曾经觉得现有工具与自己天然思维模式相冲突的人。"
