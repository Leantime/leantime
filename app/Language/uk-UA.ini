label.webhook_notifications_description="Надсилайте свої сповіщення на власну HTTPS-адресу. Для кожного сповіщення проєкту, яке вам належить отримати, Leantime надсилає на цю URL-адресу один HTTP POST-запит із тілом у форматі JSON. Запити надсилаються у фоновому режимі, і їх доставка може тривати кілька хвилин; невдалий запит не повторюється. Які сповіщення надсилатимуться, визначають категорії та рівні для проєктів на вкладці «Сповіщення»; зміни, які ви вносите самі, теж надсилаються. Вимкнення сповіщень електронною поштою не зупиняє вебхук. Вебхук надсилає дані лише тоді, коли його ввімкнено й задано URL-адресу. Поки вебхук вимкнено, ваша URL-адреса залишається збереженою — очистіть її, щоб видалити."
