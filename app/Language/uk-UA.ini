tour.my_work.welcome_title="Ласкаво просимо до туру по панелі"
tour.my_work.welcome_text="Почнімо з кількох основ, щоб ви швидко освоїлися з навігацією та різними елементами Leantime."
tour.my_work.work_modes_title="Робочі режими"
tour.my_work.work_modes_text="Верхня навігація показує поточний «робочий режим», у якому ви перебуваєте. Ви можете бути всередині проєкту, у своїй особистій робочій зоні або в режимі компанії."
tour.my_work.left_nav_text="Ліва навігація деталізує поточний робочий режим і дає доступ до різних розділів. Усе, що тут представлено, належить до робочого режиму, вибраного вгорі."
tour.my_work.profile_bar_title="Панель мого профілю"
tour.my_work.profile_bar_text="Тут ви знайдете посилання на свій обліковий запис, а також сповіщення та останні новини про Leantime."
tour.my_work.widgets_title="Віджети вашої панелі"
tour.my_work.widgets_text="Ваша панель складається з різних віджетів, які показують найважливішу інформацію про вашу роботу."
tour.my_work.customize_title="Налаштуйте свою панель"
tour.my_work.customize_text="Віджети можна переміщувати та змінювати їхній розмір за допомогою перетягування."
tour.my_work.todos_title="Мої завдання"
tour.my_work.todos_text="Віджет «Мої завдання» показує всі завдання, які зараз призначені вам."
tour.my_work.group_todos_title="Групування завдань"
tour.my_work.group_todos_text="За допомогою цих випадних списків можна фільтрувати завдання за проєктом або групувати їх за пріоритетом, статусом, проєктом чи датами."
tour.my_work.sort_todos_title="Сортування завдань"
tour.my_work.sort_todos_text="Кожне завдання можна перетягнути, щоб змінити його порядок. Також можна перетягнути завдання в календар, щоб запланувати його."
tour.my_work.timer_title="Запустіть таймер"
tour.my_work.timer_text="Коли будете готові почати роботу над завданням, просто натисніть кнопку запуску таймера."
tour.my_work.complete_task_title="Завершіть завдання"
tour.my_work.complete_task_text="Коли завдання виконано, позначте його як виконане за допомогою випадного списку статусу."
tour.my_work.add_tasks_title="Додайте більше завдань"
tour.my_work.add_tasks_text="Ви можете додати більше завдань, натиснувши кнопку «плюс» у кожному розділі або скориставшись меню з трьома крапками біля кожного завдання."
tour.my_work.finish_text="Ви завершили тур по панелі «Моя робота». Перейдіть до <a href='%s/dashboard/show'>свого проєкту</a>, щоб дізнатися більше про управління проєктами в Leantime."
tour.project_dashboard.menu_title="Меню проєкту"
tour.project_dashboard.menu_text="Меню проєкту поділяє ваш проєкт на різні розділи: <strong>Кімната даних</strong> — для зберігання всіх ваших файлів та інформації, <strong>Мислення</strong> — для стратегії, генерування ідей і визначення, <strong>Створення</strong> — для управління цілями, етапами та завданнями."
tour.project_dashboard.selector_title="Селектор проєктів"
tour.project_dashboard.selector_text="Використовуйте селектор проєктів, щоб перемикатися між проєктами. Ліве меню показує все, що стосується вашого поточного проєкту."
tour.project_dashboard.checklist_title="Контрольний список"
tour.project_dashboard.checklist_text="Контрольний список проєкту дає змогу швидко перевірити, чи містить ваш проєкт усю інформацію, необхідну для успішного виконання."
tour.project_dashboard.status_title="Швидкі оновлення статусу"
tour.project_dashboard.status_text="За допомогою оновлень статусу ви можете швидко повідомити команді про прогрес проєкту, використовуючи червоний, жовтий і зелений кольори. Статус буде видно в усьому застосунку."
tour.project_dashboard.progress_title="Прогрес"
tour.project_dashboard.progress_text="Індикатор прогресу проєкту показує, скільки роботи ви вже виконали. Він враховує різний розмір завдань, швидкість команди та етапи проєкту."
tour.project_dashboard.latest_tasks_title="Останні завдання"
tour.project_dashboard.latest_tasks_text="Список останніх завдань показує завдання, нещодавно додані до вашого проєкту, і може слугувати вхідною скринькою проєкту."
tour.project_dashboard.team_title="Команда"
tour.project_dashboard.team_text="Блок «Команда» показує учасників цього проєкту."
tour.project_dashboard.finish_text="Ви завершили тур по панелі проєкту. Перейдіть до розділу <a href='%s/tickets/showKanban'>Завдання</a>, щоб дізнатися більше про різні способи керування завданнями в Leantime."
tour.kanban_board.overview_title="Ваша Канбан-дошка"
tour.kanban_board.overview_text="Це ваша Канбан-дошка. Вона допомагає візуалізувати роботу й обмежувати кількість незавершених завдань."
tour.kanban_board.workflow_title="Робочий процес"
tour.kanban_board.workflow_text="Завдання рухаються зліва направо в міру виконання. Перетягуйте картки, щоб оновити їхній статус."
tour.kanban_board.columns_title="Гнучкі колонки"
tour.kanban_board.columns_text="За допомогою меню з трьома крапками ви можете додавати, видаляти та перейменовувати колонки."
tour.kanban_board.filter_title="Фільтрування завдань"
tour.kanban_board.filter_text="Ви можете фільтрувати завдання за різними полями, як-от пріоритет, статус, проєкт або дати."
tour.kanban_board.swimlanes_title="Доріжки"
tour.kanban_board.swimlanes_text="Крім того, ви можете групувати завдання, створюючи доріжки на Канбан-дошці. Це допомагає візуалізувати роботу за учасниками команди, пріоритетом або етапами."
tour.kanban_board.sprints_title="Спринти"
tour.kanban_board.sprints_text="Якщо ви плануєте роботу спринтами, за допомогою цього випадного списку можна вибирати, створювати та оновлювати спринти."
tour.kanban_board.finish_text="На цьому тур по Канбан-дошці завершено. Перейдіть до розділу <a href='%s/tickets/roadmap'>Етапи</a>, щоб дізнатися, як створювати етапи та керувати ними в Leantime."
tour.milestones.overview_title="Етапи"
tour.milestones.overview_text="Етапи допомагають відстежувати ключові результати та фази проєкту."
tour.milestones.drag_title="Перетягування та сортування"
tour.milestones.drag_text="Кожна смуга відповідає одному етапу. Ви можете переміщувати смуги вздовж часової шкали, змінювати їхній порядок і розмір. Усе, що ви робите на цьому екрані, оновлює терміни ваших етапів."
tour.milestones.filter_title="Фільтр"
tour.milestones.filter_text="Ви можете фільтрувати етапи, а також переглядати завдання, які до них входять."
tour.milestones.timeframes_title="Часові рамки"
tour.milestones.timeframes_text="Ви можете змінити масштаб часової шкали, щоб охопити більшу частину року або детально переглянути розбивку по днях."
tour.milestones.finish_text="На цьому тур по етапах завершено. Перейдіть до розділу <a href='%s/goalcanvas/dashboard'>Цілі</a>, щоб дізнатися, як створювати цілі та керувати ними в Leantime."
tour.goals.overview_title="Цілі"
tour.goals.overview_text="Цілі допомагають відстежувати вимірюваний вплив ваших проєктів."
tour.goals.parts_title="Мета та метрики"
tour.goals.parts_text="Кожна ціль складається з мети (чого ви намагаєтеся досягти) і метрики (як ви це вимірюватимете)."
tour.goals.progress_title="Прогрес цілі"
tour.goals.progress_text="Коли ви оновлюєте метрики цілей, індикатор прогресу показує, наскільки ви просунулися."
tour.goals.milestones_title="Етапи та цілі"
tour.goals.milestones_text="Ви можете пов'язати цілі з етапами, щоб відстежувати прогрес цілей на рівні завдань. Це допомагає виявити прогалини в плані проєкту."
tour.goals.finish_text="На цьому тур по цілях завершено. Етапи, цілі та завдання — основні будівельні блоки Leantime. Використовуйте їх, щоб розбивати роботу на керовані частини. Перейдіть до <a href='%s/tickets/showKanban'>Канбан-дошки</a>, щоб переглянути свої завдання."
