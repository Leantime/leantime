text.helpful_resources="Будь-яке нове програмне забезпечення може бути складним для вивчення, ми прагнемо зробити Leantime максимально простим і зрозумілим.<br />Якщо ви коли-небудь застрягнете або захочете обмінятися ідеями, ви можете скористатися ресурсами нижче, щоб отримати допомогу:"

text.discordChat="Наш чат у Discord, ймовірно, найшвидший спосіб отримати відповідь на будь-яке ваше запитання. Наша спільнота активна і неймовірно корисна."
text.documentation="Наша документація детально описує використання Leantime, а також деякі концепції, що стоять за цими функціями"
