support.marcel_name="👋 Я — Марсель"
support.marcel_tagline="Іммігрант з Німеччини, батько доньки з аутизмом, і сам живу із СДУГ."
support.marcel_bio_1="Традиційні інструменти управління проєктами мені ніколи не підходили. Здавалося, що їх створили нейротипові люди для нейротипових людей. Коли я працював фрилансером і насилу тримав у порядку клієнтські проєкти, я почав створювати щось, що працювало б разом із моїм мозком, а не проти нього."
support.marcel_bio_2="Те, що починалося як особисте рішення, стало Leantime, коли я зрозумів, що мільйонам інших людей потрібне те саме."
support.gloria_name="👋 А я — Глорія"
support.gloria_tagline="Колишня медсестра відділення невідкладної допомоги, яка стала продакт-менеджеркою, підприємиця латиноамериканського походження в першому поколінні."
support.gloria_bio_1="Я багато років працювала в медичному середовищі з високим тиском, де організованість буквально рятує життя. Але коли я заснувала власний бізнес, традиційні інструменти для проєктів здавалися мені перевантаженими й далекими від того, як я насправді думаю і працюю."
support.gloria_bio_2="Мій досвід у поведінкових науках і дослідженнях мотивації визначає, як ми створюємо функції, що не просто впорядковують завдання, а допомагають вам справді хотіти їх виконати."
support.closing_text="Ми можемо створити світ, де нікому не доведеться боротися зі своїми інструментами, щоб робити чудову роботу. Ваше спонсорство фінансує майбутнє, де програмне забезпечення адаптується до людського розмаїття, а не навпаки."
support.headline_ready_to_impact="Готові зробити безпосередній внесок?"
support.contribution_text="Кожен внесок — від $1 до $100 — іде безпосередньо на те, щоб зробити Leantime кращим для всіх."
