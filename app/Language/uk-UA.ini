text.onboarding_default_project_details="Ласкаво просимо до вашого першого проєкту в Leantime!<br />Це ваш простір для організації завдань, відстеження цілей і планування роботи. Ви можете змінювати тут що завгодно або створювати нові проєкти в міру зростання. Цей проєкт створено лише для того, щоб ви могли розпочати"
label.onboarding_milestone_getting_started="Початок роботи"
label.onboarding_task_community_chat="Приєднайтеся до нашого чату спільноти"
text.onboarding_task_community_chat="Наш чат спільноти — чудове місце, щоб ставити запитання й отримувати поради щодо налаштування проєкту. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Чат спільноти</a>"
label.onboarding_task_invite_team="Запросіть колег по команді"
text.onboarding_task_invite_team="Працюєте ви з кимось чи вам просто потрібен партнер для взаємного контролю — спільна робота в Leantime допомагає не збиватися з курсу та зберігати мотивацію <a href='%s'>Управління користувачами</a>"
label.onboarding_task_project_structure="Дізнайтеся більше про структуру проєктів у Leantime"
text.onboarding_task_project_structure="У нашій довідковій документації є багато додаткових матеріалів. Щоб дізнатися більше про структуру проєктів у Leantime та найкращі практики, відвідайте: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Створіть ціль"
text.onboarding_task_create_goal="Цілі допомагають відстежувати й вимірювати поступ до довгострокової мети. Їх потрібно вимірювати за допомогою метрик, які ви можете регулярно оновлювати. Цілі та етапи можна пов'язати, щоб бачити прогрес виконання поряд із прогресом метрик <a href='%s'>Цілі проєкту</a>"
label.onboarding_task_create_milestone="Створіть етап"
text.onboarding_task_create_milestone="Етапи дають змогу поділити фази ваших проєктів на окремі результати. Кожен етап має дату початку й завершення та повинен давати певний результат <a href='%s'>Етап проєкту</a>"
label.onboarding_task_personal_project="Ознайомтеся зі своїм особистим проєктом"
text.onboarding_task_personal_project="Ваш особистий проєкт — це простір, де ви можете організовувати свої завдання, цілі та роботу. Відкрити його можна через селектор проєктів угорі або за цим посиланням: <a href='%s'>Мій проєкт</a>"
label.onboarding_task_complete_profile="Заповніть свій профіль Leantime"
text.onboarding_task_complete_profile="Оновіть зображення профілю та заповніть робочі вподобання, щоб персоналізувати свій досвід. <a href='%s'>Мій профіль</a>"
label.onboarding_goalboard_title="Мої цілі"
label.onboarding_goal_metric="Завдання, виконані вчасно"
label.onboarding_goal_objective="Створити власну систему продуктивності"
label.onboarding_step_name_first_task="Назвіть своє перше завдання"
label.onboarding_step_invite_team="Запросіть свою команду"
label.onboarding_step_name_project="Назвіть свій проєкт"

