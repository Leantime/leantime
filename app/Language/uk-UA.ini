text.mattermost_instructions="Ця інтеграція надсилатиме сповіщення про оновлення в обраний вами канал.<br/>Дотримуйтесь інструкцій <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>тут, щоб отримати URL-адресу вхідного вебхука</a> від Mattermost. Потім вставте посилання у форму праворуч і натисніть Зберегти."
text.slack_instructions="Ця інтеграція надсилатиме сповіщення про оновлення в обраний вами канал.<br/>Дотримуйтесь інструкцій <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>тут, щоб отримати URL-адресу вхідного вебхука</a> від Slack. Потім вставте посилання у форму праворуч і натисніть Зберегти."
