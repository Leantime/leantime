text.zulip_instructions="Ця інтеграція надсилатиме сповіщення про оновлення в потік і тему на ваш вибір.<br/>Дотримуйтесь інструкцій <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>тут, щоб створити нового бота</a>. Потім вставте інформацію у форму праворуч і натисніть Зберегти."
text.discord_instructions="Ця інтеграція надсилатиме сповіщення про оновлення в обраний вами канал.<br/>Дотримуйтесь інструкцій <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>тут, щоб створити новий вебхук(и)</a>, потім вставте посилання у поля праворуч і натисніть Зберегти."
