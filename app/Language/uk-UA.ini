text.help_dashboard_intro="Leantime створено, щоб посилити ваші суперсили й допомогти бачити прогрес на шляху до цілей.<br /><br />Більшість із нас звикли складати списки завдань — але ми попросимо вас подумати, чого саме ви намагаєтеся досягти.<br /><br />1. Визначте бачення (стратегію) та свої цілі<br />2. Визначте роботу, яка приведе вас до цих цілей<br />3. А потім досягайте їх, плануючи кожен день за допомогою панелі «Моя робота».<br />"
