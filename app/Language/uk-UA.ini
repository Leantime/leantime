text.my_work_dashboard_intro="Ваша панель «Моя робота» зосереджує увагу на всьому, що має значення.<br/>Ваша найважливіша робота тепер на першому плані — упорядкована саме для вас і так, як найкраще працює ваш мозок.<br/><br/>Від швидких завдань до амбітних цілей — усе необхідне тут. Це ваш простір, щоб фіксувати ідеї, відстежувати прогрес і святкувати перемоги на цьому шляху."
text.blueprints_intro="Схеми — це ваша можливість осмислити всі дані. Leantime має різноманітні інструменти та канви для визначення контексту проєкту: канви бізнес-моделі, SWOT-аналіз або карти емпатії.<br/><br/>Якщо ви не знаєте, з чого почати, радимо створити «Канву цінності проєкту». Ця канва дасть відповіді на найважливіші питання вашого проєкту: Хто ваш клієнт?<br/>Яку проблему ви вирішуєте?<br/>Яке ваше рішення?<br/>Яку перевагу ваше рішення має над конкурентами?<br/>"
text.goals_tour_intro="Цілі дозволяють розбити ваш проєкт на досяжні, вимірювані й дієві частини.<br/>Якщо етапи зосереджені на виконанні, то цілі — на метриках, яких ви хочете досягти.<br/>Кожна ціль повинна мати чітко визначений результат (те, чого ви хочете досягти) і легко вимірюватися однією метрикою.<br/><br/>Коли у вас є ціль, ви можете призначити їй етапи, щоб розбити її на конкретні завдання.<br/>"
text.project_dashboard_tour_intro="Проєкти в Leantime — це спільні робочі простори, де ви та ваша команда ефективно організовуєте, відстежуєте й виконуєте роботу. Кожен проєкт об'єднує пов'язані цілі, завдання й етапи та дає змогу стежити за прогресом в одному місці.<br/><br/>Незалежно від того, чи керуєте ви робочими, навчальними чи особистими ініціативами, проєкти Leantime надають структуру та інструменти, щоб перетворювати ідеї на успішні результати."
text.wiki_tour_intro="Розділ «Документи» дозволяє писати документацію та ділитися нею з командою. Ви можете створити кілька просторів, щоб упорядкувати документацію за командами, напрямами або категоріями документів.<br/>Створюйте документи, щоб ділитися знаннями, процесами та процедурами. Ви також можете створити документ, щоб поділитися посиланням на файл або папку у вашому хмарному сховищі.<br/>"
text.extend_leantime_latest_plugins="Розширюйте Leantime за допомогою наших найновіших плагінів."
support.headline_help_us_build="Допоможіть нам збудувати майбутнє, у якому процвітає кожен розум!"
support.intro_text_1="Більшість інструментів продуктивності припускають, що всі мислять однаково: лінійно, з ідеальною концентрацією, керуючись довільними дедлайнами. Чи у вас СДУГ і вам потрібен дофамін від виконаних завдань, чи у вас аутизм і вам потрібна стабільна структура, чи у вас дислексія і ви мислите просторово, чи ви просто втомилися від інструментів, які не відповідають тому, як насправді працює ваш мозок, — ви, мабуть, уже зовсім відмовилися від управління проєктами."
support.intro_text_2="Ми створюємо Leantime для людей, які мислять інакше. Це стосується нейровідмінних людей, а також усіх, хто колись відчував, що наявні інструменти суперечать їхньому природному способу мислення."
