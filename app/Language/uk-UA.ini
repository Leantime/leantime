text.insights.helper_content="Дошка <em>Спостереження / Навчання - Інсайти</em> допомагає вам збирати та структурувати інсайти з чотирьох різних джерел (етнографічні спостереження, інтерв'ю, фокус-групи та вторинні дослідження) і перетворювати їх на знання.<br/>Вона підтримує етапи спостереження та навчання, які іноді називають емпатією та визначенням, процесу дизайн-мислення.<br/>Ви можете знайти додаткові деталі в розділах 2, 8 та 9 книги <a href='https://inov.at/dts'></em>Design Thinking for Strategy</em></a>.<br/>Ми пропонуємо вам використовувати дошку <em>Спостереження / Навчання - Інсайти</em> кожного разу, коли ви збираєте та аналізуєте нові інсайти, чи то для аналізу ризиків, аналізу середовища, виявлення галузевих тенденцій, чи для розробки нових продуктів і послуг, і це лише деякі з них."
