text.confirm_delete_timesheet = "Anda yakin ingin menghapus timesheet ini?"
text.timer_on_todo = "<span class='head-icon fa fa-stop'></span> Timer %1$s pada %2$s"
text.these_are_system_wide_settings = "Ini adalah pengaturan tingkat sistem yang akan memengaruhi tampilan dan nuansa pengalaman leantime Anda."
text.company_name_helper = "Muncul di judul halaman dan di email"
text.advanced_boards_helper_content = "Ide berkembang, tumbuh, dan matang. Di sinilah tempat untuk melacaknya.<br/>Pindahkan kartu ide dari satu kolom ke kolom berikutnya untuk mencerminkan status terkininya.<br/>Ini adalah tempat yang baik untuk memulai riset, mengembangkan prototipe, dan memvalidasi prototipe tersebut dengan beberapa pelanggan sebelum Anda mulai mengimplementasikannya."
text.backlog_helper_content = "Backlog adalah tempat bagi semua tugas Anda; yang sedang Anda kerjakan saat ini dan yang direncanakan untuk dikerjakan.<br/><br/>Untuk membuat progres menyelesaikan backlog, kami menyarankan bekerja dalam iterasi singkat - Sprint.<br/>Sprint adalah interval waktu dua minggu yang memungkinkan Anda fokus pada bagian pekerjaan yang lebih kecil dan dapat diserahkan.<br/>Di akhir dua minggu, Anda seharusnya memiliki sesuatu untuk 'didemokan'. Sesuatu yang memberi nilai bagi pengguna atau klien Anda.<br/><br/>Di layar ini, Anda dapat mengatur dan mengelola daftar tugas Anda, memprioritaskan backlog melalui seret dan lepas, serta memindahkan item Backlog ke Sprint Anda saat ini.<br/>Ingin info lebih lanjut? Mulai tur atau tutup untuk memulai!"
text.glad_youre_here = "Kami senang Anda di sini. Mari luangkan waktu sejenak untuk saling mengenal."
text.business_research_section = "Bagian Riset Bisnis kami adalah rumah baru untuk ide-ide Anda. Bagian ini dirancang untuk memandu Anda melalui tahapan pengembangan pelanggan, riset masalah, dan ideasi solusi."
text.our_roadmap_design = "Peta jalan kami dirancang untuk membawa Anda dari milestone kecil yang mudah dikelola menuju penyelesaian gambaran besar. Rencanakan milestone berdurasi sekitar 3 bulan dan gunakan penanda proyek ini untuk tetap sesuai target."
text.this_is_where_you_spend_most_time = "Di sinilah Anda akan menghabiskan sebagian besar waktu - bekerja. Rencanakan Sprint 2 minggu Anda dan jalankan dengan sukses menggunakan Papan Kanban dan alat Backlog kami. Gunakan Retrospektif untuk berkembang menuju Sprint berikutnya."
text.idea_board_helper_content = "Ini adalah tempat untuk mengumpulkan semua ide Anda. Diskusikan ide baru dengan tim Anda dan lampirkan Milestone untuk melihat progres menuju ide-ide Anda."
text.kanban_helper_content = "Kanban adalah kata dalam bahasa Jepang untuk 'kartu'. Papan Kanban dirintis oleh insinyur Toyota pada era 40-an dengan manufaktur Lean.<br/>Papan ini digunakan untuk berbagi informasi dan progres pekerjaan secara visual dengan cepat.<br/>Papan Kanban berguna untuk memvisualisasikan pekerjaan dan status, membantu mengelola pekerjaan yang aktif atau sedang berjalan, mengatur alur kerja, dan bertindak cepat menuju perbaikan lean."
text.my_timesheets_helper_content = "Timesheet adalah tempat untuk melacak jam kerja aktual pada sebuah Tugas.<br/>Ini berguna untuk keperluan penagihan, tetapi juga untuk memvalidasi seberapa baik Anda merencanakan tugas sejak awal.<br/>Seiring waktu, leantime dapat menyesuaikan tenggat untuk mengakomodasi ketidaksesuaian perencanaan."
text.new_project_helper_content = "<p>Di sinilah Anda akan mendeskripsikan, menentukan, dan mengatur parameter untuk proyek Anda. Ini penting karena bagian inilah yang menyampaikan kepada<br/>seluruh tim apa prioritas, ekspektasi, dan pedoman proyek tersebut.</p><p><br/><em>Hal-hal yang perlu dipikirkan di sini: 4C.<br/>Bersikaplah Jelas (Clear), Ringkas (Concise), Lengkap (Complete), dan Kredibel (Credible).<br/><br/></em></p><p>Menguasai hal-hal ini dalam deskripsi proyek Anda membuat semua orang memiliki pemahaman yang sama dan membantu meminimalkan risiko kesalahan atau langkah yang keliru.</p><br/>Saatnya untuk memulai!<br/><br/>"
text.not_found_helper_content = "<p>Kami belum memiliki konten untuk halaman ini.<br/>Silakan gunakan tautan 'Butuh Bantuan' di bagian bawah untuk mempelajari lebih lanjut tentang hal-hal yang dapat Anda lakukan di sini.</p>"
text.retros_helper_content = "<p>Retrospektif adalah refleksi singkat tentang pekerjaan, fungsi tim, dan tentu saja progres.<br/>Di sinilah tim Anda dapat meluangkan waktu sejenak untuk menyoroti apa yang berjalan baik, apa yang tidak berjalan baik, dan apa yang bisa dilakukan berbeda di lain waktu.<br/>Kami menyarankan untuk mengadakan rapat peninjauan secara berkala, atau minimal, di akhir setiap Milestone.<br/></p>"
text.roadmap_helper_content = "<p>Peta jalan membantu memecah proyek besar menjadi bagian yang lebih kecil dan lebih mudah dikelola.<br/><br/></p><p>Untuk membuat peta jalan Anda, kami menyarankan menetapkan milestone yang dapat dicapai dalam rentang waktu 3 bulan.</p><p>Milestone adalah titik pemeriksaan menuju penyelesaian proyek.<br/>Sederhananya: jika Anda melakukan perjalanan darat lintas negara, setiap negara bagian yang Anda lewati bisa menjadi sebuah milestone.<br/><br/>Klik 'Tambah Milestone' di sisi kiri atas untuk memulai. Atur tanggal pada tab ini atau langsung pada bagan peta jalan dengan mengklik dan menyeret milestone di dalam kalender.</p>"
text.show_clients_helper_content = "<p>Klien/Produk mengatur Proyek Anda ke dalam kategori dan memungkinkan Anda memisahkan kelompok yang berbeda.<br/><br/></p><p>Sebagai konsultan, Anda sudah bekerja dengan klien dan inilah tempat untuk mengaturnya.</p><p>Jika Anda adalah Tim Produk, Anda dapat menggunakan bagian ini untuk mengatur dan memisahkan departemen Anda (pemasaran, penjualan, operasional, dll).</p>"
text.show_projects_helper_content = "<p>Proyek adalah jantung bisnis dan leantime Anda! Perubahan, pengembangan, tujuan, dan apa pun yang bisa Anda bangun atau impikan akan melibatkan proyek.<br/>Manajemen proyek pada dasarnya adalah proses memastikan proyek Anda diserahkan tepat waktu, dengan benar, dan dengan nilai bisnis yang nyata.<br/><br/>Di sinilah Proyek Anda akan berada. Halaman proyek Anda memungkinkan Anda membuat proyek, dengan cepat melihat jumlah tugas, jam, anggaran, dan klien yang terkait dengan proyek tersebut.<br/><br/>Gunakan halaman ini untuk melihat ringkasan cepat semua proyek Anda.<br/><br/></p>"
text.new_db_version = "Versi baru telah terpasang. Untuk menggunakan Leantime, Anda perlu memperbarui database Anda.<br/><br/><strong>Pastikan untuk mencadangkan database Anda sebelum melakukan pembaruan ini!</strong><br/>Ini mungkin memerlukan waktu beberapa menit."
text.update_was_successful = "Pembaruan berhasil, Anda sekarang dapat masuk. <a href='%1$s'>Ke halaman masuk</a>"
