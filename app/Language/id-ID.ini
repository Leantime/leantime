text.mattermost_instructions = " Integrasi ini akan mengirim notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>di sini untuk mendapatkan URL Incoming Webhook</a> dari Mattermost. Kemudian tempel tautan tersebut ke formulir di sebelah kanan dan klik Simpan."
text.slack_instructions = "Integrasi ini akan mengirim notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>di sini untuk mendapatkan URL Incoming Webhook</a> dari Slack. Kemudian tempel tautan tersebut ke formulir di sebelah kanan dan klik Simpan."
text.choose_access_for_users = "Centang atau hilangkan centang pengguna yang ingin Anda tambahkan/hapus. Anda dapat mempelajari lebih lanjut tentang peran di <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by = "Diharapkan selesai pada"
text.zulip_instructions = "Integrasi ini akan mengirim notifikasi pembaruan ke stream dan topik pilihan Anda.<br/>Ikuti petunjuk <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>di sini untuk membuat bot baru</a>. Kemudian tempel informasi tersebut ke formulir di sebelah kanan dan klik Simpan."
text.telegram_instructions = "Integrasi ini akan mengirim notifikasi pembaruan ke chat Telegram.<br/>Buat bot dengan <a href='https://core.telegram.org/bots#how-do-i-create-a-bot' target='_blank'>@BotFather</a> lalu tempel token tersebut di sebelah kanan. Kirim pesan ke bot Anda sekali dan klik Simpan untuk mendeteksi chat secara otomatis — atau, untuk grup dengan Topics aktif, tempel Chat ID dan Topic ID grup tersebut secara langsung."
text.discord_instructions = "Integrasi ini akan mengirim notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>di sini untuk membuat webhook baru</a>, lalu tempel tautan tersebut ke kolom di sebelah kanan dan klik Simpan."
