text.lean.helper_content = "Lean canvas akan memandu Anda melalui seluruh proses validasi ide bisnis dan/atau produk baru Anda.<br/>Anda akan membahas <em>Segmen Pelanggan</em>, <em>Masalah, Solusi</em> Anda.<br/>Dari situ, Anda akan beralih ke <em>Proposisi Nilai Unik</em> Anda (apa yang membuat ide Anda lebih baik dari tawaran lain?), <em>Saluran Distribusi</em> Anda (bagaimana Anda akan menyampaikan solusi Anda kepada pelanggan?), <em>Aliran Pendapatan</em> Anda (bagaimana solusi Anda akan menghasilkan uang?), <em>Struktur Biaya</em> Anda (berapa nilai solusi Anda?), <em>Metrik Utama</em> (bagaimana Anda akan mengukur keberhasilan?), dan <em>Keunggulan yang Sulit Ditiru</em> Anda (apa yang Anda miliki yang akan membantu Anda unggul dari pesaing?)<br/>Menjawab pertanyaan-pertanyaan ini dirancang untuk mendorong keberhasilan, mengurangi kegagalan, dan memungkinkan Anda melacak serta memvalidasi asumsi Anda. Menjadi Lean berarti menghilangkan pemborosan dan berupaya membangun produk, bisnis, dan solusi yang benar-benar dibutuhkan pelanggan Anda."
text.lean.disclaimer = "Lean Canvas diadaptasi dari <a href='https://strategyzer.com/' target='_blank'>Kanvas Model Bisnis</a> dan menggunakan lisensi <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done = "<em>Setelah Anda merasa yakin dengan lean canvas Anda, buka</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Perencana Peta Jalan</a>"


