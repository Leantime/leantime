## Strategy Message

# Title
headline.sm.board = "Papan Pesan Strategi"

# Element/Box Labels
box.sm.qa = "Siapa <em>segmen pelanggan yang ditargetkan</em> dan siapa yang <em>secara eksplisit berada di luar cakupan</em>?"
box.sm.qb = "<em>Proposisi nilai</em> apa yang akan Anda tawarkan kepada pelanggan yang ditargetkan?"
box.sm.qc = "Mengapa pelanggan harus memilih berbisnis dengan Anda, dan bukan dengan pesaing Anda? Apa <em>karakteristik khas</em> kita yang sulit ditiru?"
box.sm.qd = "Mengapa Anda akan mampu memenuhi janji yang dibuat kepada pelanggan Anda? <em>Kemampuan unik</em> apa yang Anda miliki dan manfaatkan?"
box.sm.qe = "Apa yang akan <em>berubah</em> dengan strategi baru atau yang direvisi, dan apa yang <em>akan tetap sama</em> dari waktu ke waktu? Bagaimana Anda memastikan bahwa pelanggan yang sudah ada, yang tetap berada dalam cakupan, tidak hilang?"
box.sm.qf = "Mengapa strategi ini akan memungkinkan <em>menghasilkan dan/atau meningkatkan laba dari waktu ke waktu</em>?"
box.sm.qg = "Apakah tujuan yang ditetapkan dengan strategi baru atau yang direvisi <em>realistis untuk dicapai</em>?"

# Data Field Labels and placeholders
