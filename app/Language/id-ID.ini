text.full_lean_canvas_helper_content = "Papan riset lengkap akan memandu Anda melalui seluruh proses validasi ide.<br/>Di halaman ini, Anda akan kembali membahas segmen pelanggan, masalah, dan solusi Anda (tapi jangan khawatir, jika Anda sudah mengisinya di papan sederhana, Anda akan melihatnya lagi di sini!).<br/>Dari situ, Anda akan beralih ke Proposisi Nilai yang Jelas (Apa yang Membuat Ide Anda Lebih Baik dari Tawaran Lain?),<br/>Saluran Penjualan (Bagaimana Cara Pelanggan Mendapatkan Solusi Anda?)<br/>Aliran Pendapatan (Bagaimana solusi Anda menghasilkan uang?)<br/>Struktur Biaya (Berapa Nilai Solusi Anda?) Metrik Utama (Bagaimana Anda Mengukur Keberhasilan?)<br/>dan keunggulan kompetitif (Apa yang membuat Anda menonjol dibanding kompetitor?)<br/>Menjawab pertanyaan-pertanyaan ini dirancang untuk mendorong keberhasilan, mengurangi risiko kegagalan, dan memungkinkan Anda melacak serta memvalidasi asumsi Anda.<br/>Lean adalah tentang menghilangkan pemborosan dan berupaya membangun produk, toko, dan solusi yang dibutuhkan pelanggan Anda."
