text.lean.helper_content="ה־Lean Canvas ילווה אותך לאורך כל תהליך התיקוף של הרעיון לעסק ו/או למוצר החדש שלך.<br/>תחילה מתייחסים ל<em>פלח הלקוחות</em>, ל<em>בעיה ולפתרון</em>.<br/>משם ממשיכים אל <em>הצעת הערך הייחודית</em> (מה הופך את הרעיון שלך לטוב יותר מהצעות אחרות?), <em>ערוצי ההפצה</em> (איך הפתרון שלך יגיע ללקוחות?), <em>תזרימי ההכנסות</em> (איך הפתרון שלך יכניס כסף?), <em>מבנה העלויות</em> (כמה שווה הפתרון שלך?), <em>מדדי המפתח</em> (איך תימדד ההצלחה?), ו<em>היתרון הבלתי הוגן</em> (מה יש לך שיעזור לך להצליח מול המתחרים?)<br/>המענה על השאלות האלה נועד לקדם הצלחה, לצמצם כישלונות ולאפשר לך לעקוב אחר ההנחות שלך ולתקף אותן. גישת Lean עוסקת בצמצום בזבוז ובעבודה לבניית מוצרים, עסקים ופתרונות שהלקוחות שלך צריכים."
text.lean.disclaimer="Lean Canvas הוא עיבוד של <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> ומופץ ברישיון <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>לאחר שה־Lean Canvas שלך מוכן, ניתן לעבור אל</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> תכנון תכנית הפעולה</a>"


