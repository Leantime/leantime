text.helpful_resources="כל תוכנה חדשה יכולה להיות מאתגרת ללמידה, ואנו שואפים להפוך את Leantime לפשוטה וישירה ככל האפשר.<br />אם נתקעת או שמתחשק לך להחליף רעיונות, אפשר להיעזר במשאבים שלהלן:"

text.discordChat="צ׳אט ה־Discord שלנו הוא כנראה הדרך המהירה ביותר לקבל תשובה לכל שאלה. הקהילה שלנו פעילה ומועילה מאוד."
text.documentation="התיעוד שלנו מפרט את אופן השימוש ב־Leantime וגם חלק מהמושגים שמאחורי התכונות האלה"
