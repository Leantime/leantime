text.who_can_access="נא לבחור מי רשאי לצפות במיזם הזה. כברירת מחדל, המשתמשים יקבלו את התפקידים שהוגדרו להם. ניתן לשנות את התפקידים האלה תחת הלשונית “צוות”"
text.ical_export_description="כאן ניתן ליצור כתובת לוח שנה ייחודית שתאפשר לך לשלב את לוח השנה שלך מ־Leantime בכל יישום שתומך בתבנית “iCal”. "
text.you_ical_url="כתובת לוח השנה שלך מופיעה להלן. <br /> נא לשים לב שכל מי שמחזיק בכתובת הזאת יכול לגשת ללוח השנה. יש לשמור עליה בסוד כמו על סיסמה."
