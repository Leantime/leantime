support.marcel_name="👋 אני מרסל"
support.marcel_tagline="מהגר מגרמניה, אבא לבת על הספקטרום האוטיסטי, ובעצמי חי עם ADHD."
support.marcel_bio_1="כלי ניהול מיזמים מסורתיים אף פעם לא התאימו לי. הרגשתי שהם נבנו על ידי מוחות נוירוטיפיקליים עבור מוחות נוירוטיפיקליים. כשעבדתי כפרילנסר והתקשיתי לשמור על הסדר במיזמים של לקוחות, התחלתי לבנות משהו שעובד עם המוח שלי ולא נגדו."
support.marcel_bio_2="מה שהתחיל כפתרון אישי הפך ל־Leantime כשהבנתי שמיליוני אנשים אחרים זקוקים בדיוק לאותו דבר."
support.gloria_name="👋 ואני גלוריה"
support.gloria_tagline="אחות לשעבר בחדר מיון שהפכה למנהלת מוצר, יזמית היספנית מהדור הראשון."
support.gloria_bio_1="עבדתי שנים בסביבות רפואיות תחת לחץ גבוה, שבהן ארגון ממש מציל חיים. אבל כשפתחתי עסק משלי, כלי המיזמים המסורתיים הרגישו מכבידים ומנותקים מהאופן שבו אני באמת חושבת ועובדת."
support.gloria_bio_2="הרקע שלי במדעי ההתנהגות ובמחקר המוטיבציה מכוון את האופן שבו אנחנו בונים תכונות שלא רק מארגנות משימות — הן עוזרות לך באמת לרצות להשלים אותן."
support.closing_text="אנחנו יכולים ליצור עולם שבו אף אחד לא צריך להיאבק בכלים שלו כדי לעשות עבודה מעולה. החסות שלך מממנת עתיד שבו התוכנה מתאימה את עצמה לגיוון האנושי, ולא להפך."
