text.zulip_instructions="השילוב הזה יפרסם הודעות עדכון לתזרים ולנושא לבחירתך.<br/>יש לעקוב אחר ההנחיות שמופיעות <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>כאן כדי ליצור בוט חדש</a>. ואז להדביק את הקישור לכתובת שמשמאל וללחוץ על שמירה."
