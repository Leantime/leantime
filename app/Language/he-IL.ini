label.onboarding_checklist_personal_project="סקירת המיזם האישי שלך"
label.onboarding_checklist_project="סקירת המיזם שלך"
label.onboarding_checklist_milestone="יצירת אבן דרך"
label.onboarding_checklist_goal="יצירת יעד"
label.onboarding_checklist_comment="הוספת תגובה למשימה"
label.onboarding_default_project_name="המיזם שלי"
text.onboarding_default_project_details="ברוך בואך למיזם הראשון שלך ב־Leantime!<br />זה המרחב שלך לארגון משימות, למעקב אחר יעדים ולתכנון העבודה. אפשר לשנות כאן כל דבר או ליצור מיזמים נוספים ככל שהעבודה מתרחבת. המיזם הזה נועד לך בלבד, כדי שיהיה לך קל להתחיל"
label.onboarding_milestone_getting_started="צעדים ראשונים"
label.onboarding_task_community_chat="הצטרפות לצ׳אט הקהילה שלנו"
text.onboarding_task_community_chat="צ׳אט הקהילה שלנו הוא משאב מצוין לשאילת שאלות ולקבלת משוב על הקמת המיזם. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>צ׳אט הקהילה</a>"
label.onboarding_task_invite_team="הזמנת חברי הצוות שלך"
text.onboarding_task_invite_team="בין אם העבודה שלך משותפת עם מישהו ובין אם צריך רק שותף שיעזור לשמור על מחויבות – שימוש ב־Leantime כקבוצה עוזר לשמור על המסלול ועל המוטיבציה <a href='%s'>ניהול משתמשים</a>"
label.onboarding_task_project_structure="מידע נוסף על מבנה המיזמים ב־Leantime"
text.onboarding_task_project_structure="יש לנו הרבה משאבים נוספים בתיעוד העזרה. למידע נוסף על מבנה מיזמים ב־Leantime ועל שיטות עבודה מומלצות, אפשר לבקר בכתובת: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="יצירת יעד"
text.onboarding_task_create_goal="יעדים משמשים למעקב ולמדידה של מטרות ארוכות טווח. צריך שיהיה אפשר למדוד אותם בעזרת מדדים שמתעדכנים באופן קבוע. אפשר לקשר יעדים לאבני דרך כדי לראות את התקדמות הביצוע לצד התקדמות המדד <a href='%s'>יעדי המיזם</a>"
label.onboarding_task_create_milestone="יצירת אבן דרך"
text.onboarding_task_create_milestone="אבני דרך מאפשרות לחלק את שלבי המיזמים שלך לתוצאות מוגדרות. לכל אבן דרך יש תאריך התחלה ותאריך סיום, והיא אמורה להניב תוצר כלשהו <a href='%s'>אבני הדרך של המיזם</a>"
label.onboarding_task_personal_project="סיור במיזם האישי שלך"
text.onboarding_task_personal_project="המיזם האישי שלך הוא מרחב שבו אפשר לארגן את המשימות, היעדים והעבודה שלך. אפשר לגשת אליו דרך בוחר המיזם שלמעלה או בלחיצה על הקישור הזה: <a href='%s'>המיזם שלי</a>"
