## Strategy Message=

headline.sm.board="לוח מסר אסטרטגי"

box.sm.qa="מי הם <em>פלחי הלקוחות שאליהם מכוונים</em> ומי <em>נמצא במפורש מחוץ לתחום</em>?"
box.sm.qb="איזו <em>הצעת ערך</em> תוצע ללקוחות שאליהם מכוונים?"
box.sm.qc="למה שלקוחות יבחרו לעשות איתך עסקים ולא עם המתחרים? מהם <em>המאפיינים הייחודיים</em> שלנו שקשה להעתיק?"
box.sm.qd="למה יהיה ביכולתך לעמוד בהבטחות שניתנו ללקוחות? אילו <em>יכולות ייחודיות</em> יש לך ואיך הן מנוצלות?"
box.sm.qe="מה <em>ישתנה</em> עם האסטרטגיה החדשה או המעודכנת ומה <em>יישאר ללא שינוי</em> לאורך זמן? איך מבטיחים שלקוחות קיימים, שנשארים בתחום, לא יאבדו?"
box.sm.qf="מדוע האסטרטגיה תאפשר <em>יצירה ו/או הגדלה של רווחים לאורך זמן</em>?"
box.sm.qg="באיזו מידה היעדים שנקבעו עם האסטרטגיה החדשה או המעודכנת <em>ניתנים להשגה באופן מציאותי</em>?"

