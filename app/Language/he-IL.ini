text.my_work_dashboard_intro="לוח הבקרה “העבודה שלי” ממקד את כל מה שחשוב.<br/>העבודה החשובה ביותר שלך נמצאת עכשיו במרכז, מאורגנת במיוחד בשבילך ולפי הדרך שבה המוח שלך עובד הכי טוב.<br/><br/>ממשימות קטנות ועד יעדים שאפתניים, כל מה שצריך נמצא כאן. זה המרחב שלך ללכוד רעיונות, לעקוב אחר ההתקדמות ולחגוג הצלחות לאורך הדרך."
text.blueprints_intro="השרטוטים הם ההזדמנות שלך להבין את כל הנתונים. ב־Leantime יש מגוון כלים וקנבסים להגדרת הרקע של המיזם שלך באמצעות קנבס מודל עסקי, ניתוח SWOT או מפות אמפתיה.<br/><br/>אם לא ברור מאיפה להתחיל, אנו ממליצים ליצור “קנבס ערך מיזם”. הקנבס הזה יענה על השאלות החשובות ביותר של המיזם שלך: מי הלקוח שלך?<br/>איזו בעיה נפתרת כאן?<br/>מה הפתרון שלך?<br/>איזה יתרון יש לפתרון שלך על פני המתחרים<br/>"
text.goals_tour_intro="יעדים מאפשרים לך לפרק את המיזם לחלקים בני השגה, מדידים וברי ביצוע.<br/>בעוד שאבני דרך מתמקדות בביצוע, יעדים עוסקים במדדים שברצונך להשיג.<br/>לכל יעד צריכה להיות מטרה ברורה (הדבר שברצונך להשיג), וצריך להיות קל למדוד אותו באמצעות מדד יחיד.<br/><br/>לאחר שיש לך יעד, אפשר להקצות לו אבני דרך כדי לפרק אותו למשימות ברות ביצוע.<br/>"
text.project_dashboard_tour_intro="מיזמים ב־Leantime הם מרחבי עבודה שיתופיים שבהם ניתן לארגן, לעקוב ולספק עבודה ביעילות יחד עם הצוות שלך. כל מיזם משמש מכל ליעדים, משימות ואבני דרך קשורים, ומאפשר לעקוב אחר ההתקדמות במקום מרכזי אחד.<br/><br/>בין אם מדובר בעבודה, בלימודים או ביוזמות אישיות, מיזמי Leantime מספקים את המבנה והכלים הדרושים כדי להפוך רעיונות לתוצאות מוצלחות."
text.wiki_tour_intro="המסמכים שלנו מאפשרים לך לכתוב תיעוד ולשתף אותו עם הצוות שלך. אפשר ליצור כמה מרחבים כדי לארגן את התיעוד לפי צוותים, תחומים או קטגוריות מסמכים.<br/>אפשר ליצור מסמכים כדי לשתף ידע, תהליכים ונהלים. אפשר גם ליצור מסמך כדי לשתף קישור לקובץ או לתיקייה באחסון הענן שלך.<br/>"
text.extend_leantime_latest_plugins="הרחבת Leantime באמצעות הפלאגינים החדשים ביותר שלנו."
support.headline_help_us_build="עזרו לנו לבנות עתיד שבו כל מוח משגשג!"
support.intro_text_1="רוב כלי הפרודוקטיביות מניחים שכולם חושבים באותה דרך: באופן ליניארי, בריכוז מושלם ומתוך מוטיבציה של מועדי יעד שרירותיים. בין אם יש לך ADHD ונדרשות לך זריקות דופמין ממשימות שהושלמו, בין אם יש לך אוטיזם ומבנה עקבי חשוב לך, בין אם יש לך דיסלקציה והחשיבה שלך מרחבית, ובין אם פשוט נמאס לך מכלים שלא מתאימים לאופן שבו המוח שלך באמת עובד — סביר להניח שכבר ויתרת לגמרי על ניהול מיזמים."
support.intro_text_2="אנחנו בונים את Leantime עבור מוחות שעובדים אחרת. זה כולל מוחות נוירו־מגוונים, אבל גם כל מי שהרגיש אי־פעם שהכלים הקיימים נלחמים בדפוסי החשיבה הטבעיים שלו."
