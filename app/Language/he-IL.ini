text.mattermost_instructions=" השילוב הזה יפרסם הודעות עדכון לערוץ לבחירתך.<br/>יש לעקוב אחר ההנחיות שמופיעות <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>כאן כדי לקבל כתובת התליית רשת נכנסת (Incoming Webhook URL)</a> מ־Mattermost. ואז להדביק את הקישור לכתובת שמשמאל וללחוץ על שמירה."
