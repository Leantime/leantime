label.webhook_notifications_description="שליחת ההתראות שלך לנקודת קצה HTTPS משלך. על כל התראת מיזם שמגיעה לך, Leantime שולח לכתובת הזאת בקשת HTTP POST אחת עם גוף JSON. הבקשות נשלחות ברקע ויכולות להגיע בעיכוב של כמה דקות; בקשה שנכשלת אינה נשלחת שוב. הקטגוריות והרמות לפי מיזם בלשונית התראות קובעות אילו התראות מגיעות לך, כולל שינויים שביצעת בעצמך. כיבוי התראות הדוא״ל אינו עוצר את ה־webhook. ה־webhook שולח רק כשהוא מופעל ומוגדרת כתובת. הכתובת שלך נשארת שמורה גם כשה־webhook מושבת — כדי להסיר אותה יש לרוקן את הכתובת."
