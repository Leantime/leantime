text.my_work_dashboard_intro="Dein Dashboard „Meine Arbeit“ rückt alles Wichtige in den Fokus.<br/>Deine wichtigste Arbeit steht jetzt im Mittelpunkt – organisiert speziell für dich und so, wie dein Gehirn am besten arbeitet.<br/><br/>Von schnellen Aufgaben bis zu ehrgeizigen Zielen: Alles, was du brauchst, findest du hier. Das ist dein Raum, um Ideen festzuhalten, Fortschritte zu verfolgen und Erfolge unterwegs zu feiern."
text.blueprints_intro="Projektpläne helfen dir, alle Daten sinnvoll einzuordnen. Leantime bietet eine Vielzahl von Werkzeugen und Canvases, um den Hintergrund deines Projekts zu definieren – etwa mit Business Model Canvases, SWOT-Analysen oder Empathy Maps.<br/><br/>Wenn du nicht weißt, wo du anfangen sollst, empfehlen wir dir, ein „Project Value Canvas“ zu erstellen. Dieses Canvas beantwortet die wichtigsten Fragen deines Projekts: Wer ist dein Kunde?<br/>Welches Problem löst du?<br/>Was ist deine Lösung?<br/>Welchen Vorteil bietet deine Lösung gegenüber deinen Mitbewerbern?<br/>"
text.goals_tour_intro="Mit Zielen kannst du dein Projekt in erreichbare, messbare und umsetzbare Abschnitte aufteilen.<br/>Während sich Meilensteine auf die Umsetzung konzentrieren, geht es bei Zielen um die Kennzahlen, die du erreichen möchtest.<br/>Jedes Ziel sollte eine klare Zielsetzung haben (das, was du erreichen möchtest) und sich mit einer einzigen Kennzahl leicht messen lassen.<br/><br/>Sobald du ein Ziel hast, kannst du ihm Meilensteine zuordnen, um es in umsetzbare Aufgaben aufzuteilen.<br/>"
text.project_dashboard_tour_intro="Projekte in Leantime sind gemeinsame Arbeitsbereiche, in denen du und dein Team Arbeit effizient organisiert, verfolgt und erledigt. Jedes Projekt bündelt zusammengehörige Ziele, Aufgaben und Meilensteine und ermöglicht es dir, den Fortschritt an einem zentralen Ort zu verfolgen.<br/><br/>Ob du Arbeit, Studium oder persönliche Vorhaben verwaltest – Leantime-Projekte bieten die Struktur und die Werkzeuge, um aus Ideen erfolgreiche Ergebnisse zu machen."
text.wiki_tour_intro="Mit unseren Dokumenten kannst du Dokumentation schreiben und mit deinem Team teilen. Du kannst mehrere Bereiche anlegen, um deine Dokumentation nach Teams, Themen oder Dokumentkategorien zu ordnen.<br/>Erstelle Dokumente, um Wissen, Prozesse und Abläufe zu teilen. Du kannst auch ein Dokument erstellen, um einen Link zu einer Datei oder einem Ordner in deinem Cloud-Speicher zu teilen.<br/>"
text.extend_leantime_latest_plugins="Erweitere Leantime mit unseren neuesten Plugins."
support.headline_help_us_build="Hilf uns, eine Zukunft zu schaffen, in der alle Köpfe aufblühen!"
support.intro_text_1="Die meisten Produktivitätstools gehen davon aus, dass alle gleich denken: linear, perfekt fokussiert und motiviert durch willkürliche Deadlines. Ob du ADHS hast und die Dopamin-Kicks erledigter Aufgaben brauchst, autistisch bist und dich nach verlässlicher Struktur sehnst, Legasthenie hast und räumlich denkst – oder einfach genug von Tools hast, die nicht dazu passen, wie dein Gehirn wirklich arbeitet: Wahrscheinlich hast du Projektmanagement längst ganz aufgegeben."
support.intro_text_2="Wir entwickeln Leantime für Köpfe, die anders arbeiten. Das schließt neurodivergente Gehirne ein, aber auch alle, die schon einmal das Gefühl hatten, dass bestehende Tools gegen ihre natürlichen Denkmuster arbeiten."
