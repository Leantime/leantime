text.mattermost_instructions=" Diese Integration sendet Aktualisierungsbenachrichtigungen an den Kanal deiner Wahl.<br/>Befolge die Anweisungen <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>hier, um eine eingehende Webhook-URL</a> von Mattermost zu erhalten. Füge dann den Link in das Formular rechts ein und klicke auf Speichern."
