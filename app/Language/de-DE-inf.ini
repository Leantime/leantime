tour.my_work.welcome_title="Willkommen zur Dashboard-Tour"
tour.my_work.welcome_text="Lass uns mit ein paar Grundlagen beginnen, damit du dich schnell in der Navigation und den verschiedenen Elementen von Leantime zurechtfindest."
tour.my_work.work_modes_title="Arbeitsmodi"
tour.my_work.work_modes_text="Die obere Navigation zeigt dir, in welchem „Arbeitsmodus“ du dich gerade befindest. Du kannst in einem Projekt sein, in deinem persönlichen Arbeitsbereich oder im Unternehmensmodus."
tour.my_work.left_nav_text="Die linke Navigation gliedert den aktuellen Arbeitsmodus und gibt dir Zugriff auf verschiedene Bereiche. Alles, was hier angezeigt wird, gehört zum oben ausgewählten Arbeitsmodus."
tour.my_work.profile_bar_title="Meine Profilleiste"
tour.my_work.profile_bar_text="Hier findest du Links zu deinem Konto sowie Benachrichtigungen und Neuigkeiten rund um Leantime."
tour.my_work.widgets_title="Deine Dashboard-Widgets"
tour.my_work.widgets_text="Dein Dashboard ist in verschiedene Widgets unterteilt, die dir gezielte Informationen zu deiner Arbeit zeigen."
tour.my_work.customize_title="Passe dein Dashboard an"
tour.my_work.customize_text="Widgets lassen sich per Drag & Drop verschieben und in der Größe ändern."
tour.my_work.todos_title="Meine To-Dos"
tour.my_work.todos_text="Das Widget „Meine To-Dos“ zeigt dir alle Aufgaben, die dir aktuell zugewiesen sind."
tour.my_work.group_todos_title="Aufgaben gruppieren"
tour.my_work.group_todos_text="Über die Dropdowns hier kannst du deine Aufgaben nach Projekt filtern oder nach Priorität, Status, Projekt oder Datum gruppieren."
tour.my_work.sort_todos_title="Aufgaben sortieren"
tour.my_work.sort_todos_text="Jede Aufgabe lässt sich per Drag & Drop verschieben, um ihre Reihenfolge zu ändern. Du kannst eine Aufgabe auch in den Kalender ziehen, um sie einzuplanen."
tour.my_work.timer_title="Timer starten"
tour.my_work.timer_text="Wenn du bereit bist, an einer Aufgabe zu arbeiten, klicke einfach auf die Schaltfläche zum Starten des Timers."
tour.my_work.complete_task_title="Aufgabe abschließen"
tour.my_work.complete_task_text="Sobald eine Aufgabe fertig ist, kannst du sie über das Status-Dropdown als erledigt markieren."
tour.my_work.add_tasks_title="Weitere Aufgaben hinzufügen"
tour.my_work.add_tasks_text="Weitere Aufgaben fügst du über die Plus-Schaltfläche in jedem Abschnitt hinzu oder über das Drei-Punkte-Menü neben jeder Aufgabe."
tour.my_work.finish_text="Du hast die Tour durch das Dashboard „Meine Arbeit“ abgeschlossen. Wechsle zu <a href='%s/dashboard/show'>deinem Projekt</a>, um mehr über das Projektmanagement in Leantime zu erfahren."
tour.project_dashboard.menu_title="Projektmenü"
tour.project_dashboard.menu_text="Das Projektmenü gliedert dein Projekt in verschiedene Bereiche: <strong>Datenbereich</strong> – für all deine Dateien und Informationen, <strong>Denken</strong> – zum Entwickeln von Strategien und Ideen und zum Definieren, <strong>Machen</strong> – zum Verwalten von Zielen, Meilensteinen und Aufgaben."
tour.project_dashboard.selector_title="Projektauswahl"
tour.project_dashboard.selector_text="Mit der Projektauswahl wechselst du zwischen Projekten. Das linke Menü zeigt alles, was zu deinem aktuellen Projekt gehört."
tour.project_dashboard.checklist_title="Checkliste"
tour.project_dashboard.checklist_text="Die Projekt-Checkliste zeigt dir auf einen Blick, ob dein Projekt alle Informationen enthält, die für eine erfolgreiche Umsetzung nötig sind."
tour.project_dashboard.status_title="Schnelle Status-Updates"
tour.project_dashboard.status_text="Mit Status-Updates teilst du den Fortschritt deines Projekts schnell mit deinem Team – in Rot, Gelb und Grün. Der Status ist in der gesamten Anwendung sichtbar."
tour.project_dashboard.progress_title="Fortschritt"
tour.project_dashboard.progress_text="Die Fortschrittsanzeige zeigt dir, wie viel Arbeit du bereits erledigt hast. Sie berücksichtigt unterschiedliche Aufgabengrößen, die Geschwindigkeit des Teams und die Projektmeilensteine."
tour.project_dashboard.latest_tasks_title="Neueste Aufgaben"
tour.project_dashboard.latest_tasks_text="Die Liste der neuesten Aufgaben zeigt dir die zuletzt zu deinem Projekt hinzugefügten Aufgaben und lässt sich als Projekt-Posteingang nutzen."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Im Team-Bereich siehst du die Mitglieder dieses Projekts."
tour.project_dashboard.finish_text="Du hast die Tour durch den Projektüberblick abgeschlossen. Wechsle zu den <a href='%s/tickets/showKanban'>Aufgaben</a>, um mehr über die verschiedenen Möglichkeiten zu erfahren, deine Aufgaben in Leantime zu verwalten."
tour.kanban_board.overview_title="Dein Kanban Board"
tour.kanban_board.overview_text="Das ist dein Kanban Board. Es hilft dir, deine Arbeit zu visualisieren und die Menge an gleichzeitig laufender Arbeit zu begrenzen."
tour.kanban_board.workflow_title="Arbeitsablauf"
tour.kanban_board.workflow_text="Aufgaben wandern mit ihrem Fortschritt von links nach rechts. Ziehe Karten per Drag & Drop, um ihren Status zu ändern."
tour.kanban_board.columns_title="Flexible Spalten"
tour.kanban_board.columns_text="Über das Drei-Punkte-Menü kannst du Spalten hinzufügen, entfernen und umbenennen."
tour.kanban_board.filter_title="Aufgaben filtern"
tour.kanban_board.filter_text="Du kannst deine Aufgaben nach verschiedenen Feldern wie Priorität, Status, Projekt oder Datum filtern."
tour.kanban_board.swimlanes_title="Swimlanes"
tour.kanban_board.swimlanes_text="Außerdem kannst du deine Aufgaben gruppieren, um Kanban-Swimlanes zu erstellen. So kannst du deine Arbeit nach Teammitgliedern, Priorität oder Meilensteinen visualisieren."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Wenn du deine Arbeit in Sprints organisierst, kannst du hier über das Dropdown Sprints auswählen, anlegen und aktualisieren."
tour.kanban_board.finish_text="Damit ist die Kanban-Tour abgeschlossen. Wechsle zu den <a href='%s/tickets/roadmap'>Meilensteinen</a>, um zu erfahren, wie du in Leantime Meilensteine erstellst und verwaltest."
tour.milestones.overview_title="Meilensteine"
tour.milestones.overview_text="Mit Meilensteinen behältst du wichtige Ergebnisse und Projektphasen im Blick."
tour.milestones.drag_title="Ziehen & Sortieren"
tour.milestones.drag_text="Jeder Balken steht für einen Meilenstein. Du kannst die Balken entlang der Zeitleiste verschieben, neu anordnen und ihre Länge ändern. Alles, was du in dieser Ansicht tust, passt die Zeitplanung deiner Meilensteine an."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Du kannst deine Meilensteine filtern und dir auch die zugehörigen Aufgaben anzeigen lassen."
tour.milestones.timeframes_title="Zeiträume"
tour.milestones.timeframes_text="Du kannst den Zeitraum der Zeitleiste ändern, um mehr vom Jahr zu sehen oder bis auf einzelne Tage hineinzuzoomen."
tour.milestones.finish_text="Damit ist die Meilenstein-Tour abgeschlossen. Wechsle zu den <a href='%s/goalcanvas/dashboard'>Zielen</a>, um zu erfahren, wie du in Leantime Ziele erstellst und verwaltest."
tour.goals.overview_title="Ziele"
tour.goals.overview_text="Mit Zielen verfolgst du die messbare Wirkung deiner Projekte."
tour.goals.parts_title="Zielsetzungen & Kennzahlen"
tour.goals.parts_text="Jedes Ziel besteht aus einer Zielsetzung (was du erreichen möchtest) und einer Kennzahl (wie du es messen wirst)."
tour.goals.progress_title="Zielfortschritt"
tour.goals.progress_text="Wenn du die Kennzahlen deiner Ziele aktualisierst, zeigt dir der Fortschrittsbalken, wie weit du schon bist."
tour.goals.milestones_title="Meilensteine & Ziele"
tour.goals.milestones_text="Du kannst Ziele mit Meilensteinen verknüpfen, um den Fortschritt deiner Ziele auf Aufgabenebene zu verfolgen. So erkennst du Lücken in deinem Projektplan."
tour.goals.finish_text="Damit ist die Ziele-Tour abgeschlossen. Meilensteine, Ziele und Aufgaben sind die grundlegenden Bausteine in Leantime. Nutze sie, um deine Arbeit in überschaubare Pakete aufzuteilen. Wechsle zum <a href='%s/tickets/showKanban'>Kanban Board</a>, um deine Aufgaben anzusehen."
