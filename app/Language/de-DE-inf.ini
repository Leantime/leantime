text.help_dashboard_intro="Leantime ist darauf ausgelegt, deine Superkräfte zu stärken und dir deinen Fortschritt auf dem Weg zu deinen Zielen zu zeigen.<br /><br />Die meisten von uns sind es gewohnt, Aufgabenlisten zu erstellen – wir möchten dich aber bitten, darüber nachzudenken, was genau du erreichen möchtest.<br /><br />1. Lege eine Vision (Strategie) und deine Ziele fest<br />2. Definiere die Arbeit, die dich zu diesen Zielen führt<br />3. Und dann erreiche sie, indem du deinen Alltag mit deinem Dashboard „Meine Arbeit“ planst.<br />"
