text.discord_instructions="Diese Integration sendet Aktualisierungsbenachrichtigungen an den Kanal Deiner Wahl.<br/>Befolge die Anweisungen <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>um einen neue Webhook zu erstellen</a>, dann füge den Link in das rechte Formularfeld ein und klicke auf Speichern."
