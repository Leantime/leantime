label.onboarding_default_project_name="Mein Projekt"
text.onboarding_default_project_details="Willkommen in deinem ersten Projekt in Leantime!<br />Hier organisierst du Aufgaben, verfolgst Ziele und planst deine Arbeit. Du kannst hier alles anpassen oder weitere Projekte anlegen, wenn du wächst. Dieses Projekt ist nur für dich, damit du loslegen kannst"
label.onboarding_milestone_getting_started="Erste Schritte"
label.onboarding_task_community_chat="Tritt unserem Community-Chat bei"
text.onboarding_task_community_chat="Unser Community-Chat ist eine tolle Anlaufstelle, um Fragen zu stellen und Feedback zur Einrichtung deines Projekts zu bekommen. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Community-Chat</a>"
label.onboarding_task_invite_team="Lade deine Teammitglieder ein"
text.onboarding_task_invite_team="Egal, ob du mit jemandem zusammenarbeitest oder einfach jemanden brauchst, der dich in die Pflicht nimmt: Wenn ihr Leantime gemeinsam nutzt, bleibt ihr leichter auf Kurs und motiviert <a href='%s'>Benutzerverwaltung</a>"
label.onboarding_task_project_structure="Erfahre mehr über die Projektstruktur in Leantime"
text.onboarding_task_project_structure="In unserer Hilfe-Dokumentation findest du viele weitere Ressourcen. Mehr über die Projektstruktur in Leantime und Best Practices erfährst du hier: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Erstelle ein Ziel"
text.onboarding_task_create_goal="Ziele dienen dazu, langfristige Zielsetzungen zu verfolgen und zu messen. Sie sollten über Kennzahlen messbar sein, die du regelmäßig aktualisieren kannst. Ziele und Meilensteine lassen sich verknüpfen, sodass du den Umsetzungsfortschritt zusammen mit dem Fortschritt der Kennzahlen siehst <a href='%s'>Projektziele</a>"
label.onboarding_task_create_milestone="Erstelle einen Meilenstein"
text.onboarding_task_create_milestone="Mit Meilensteinen gliederst du die Phasen deiner Projekte in klar abgegrenzte Ergebnisse. Jeder Meilenstein hat ein Start- und Enddatum und sollte ein Ergebnis liefern <a href='%s'>Projektmeilensteine</a>"
label.onboarding_task_personal_project="Entdecke dein persönliches Projekt"
text.onboarding_task_personal_project="Dein persönliches Projekt ist ein Bereich, in dem du deine Aufgaben, Ziele und Arbeit organisieren kannst. Du erreichst es über die Projektauswahl oben oder über diesen Link: <a href='%s'>Mein Projekt</a>"
label.onboarding_task_complete_profile="Mein Leantime-Profil vervollständigen"
text.onboarding_task_complete_profile="Profilbild aktualisieren und Arbeitseinstellungen vervollständigen, um mein Erlebnis zu personalisieren. <a href='%s'>Mein Profil</a>"
label.onboarding_goalboard_title="Meine Ziele"
