headlines.insights.welcome_to_board="Willkommen im Insights-Board!"

text.insights.helper_content="Das Board <em>Beobachten/Lernen – Einblicke</em> hilft Dir, strukturierte Einblicke aus vier verschiedenen Quellen (ethnografische Beobachtungen, Interviews, Fokusgruppen und Sekundärforschung) zu sammeln und sie in Wissen umzuwandeln.<br/>Es unterstützt die Phasen des Design-Thinking-Prozesses beobachten und lernen, die manchmal auch Empathisieren und Definieren genannt werden.<br/>Weitere Details findest Du in den Kapiteln 2, 8 und 9 des Buches <a href='https://inov.at/dts'></em>Design Thinking for Strategy</em></a>.<br/>Wir empfehlen Dir, jedes Mal, wenn Du neue Erkenntnisse sammelst und analysierst, das Board <em>Beobachten/Lernen – Einblicke</em> zu verwenden, sei es für eine Risikoanalyse, eine Umweltanalyse, das Entdecken von Branchentrends oder das Entwerfen neuer Produkte und Dienstleistungen, um nur einige zu nennen."
tour.insights.once_your_done="<em>Sobald Du mit Deiner Sammlung von Einblicken und Wissen zufrieden bist, spring direkt zum</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Projektfahrplan</a>"


