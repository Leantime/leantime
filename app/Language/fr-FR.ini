text.insights.helper_content="Le tableau <em>Observer / Apprendre - Enseignements</em> vous aide à recueillir et structurer des enseignements issus de quatre sources différentes (observations ethnographiques, entretiens, groupes de discussion et recherche documentaire) et à les transformer en connaissances.<br/>Il accompagne les étapes d'observation et d'apprentissage, parfois appelées empathie et définition, du processus de Design Thinking.<br/>Nous vous suggérons d'utiliser le tableau <em>Observer / Apprendre - Enseignements</em> chaque fois que vous recueillez et analysez de nouveaux enseignements, que ce soit pour une analyse de risques, une analyse environnementale, la découverte de tendances sectorielles, ou la conception de nouveaux produits et services, pour ne citer que quelques exemples."
