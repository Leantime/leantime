support.headline_help_us_build="Aidez-nous à construire un avenir où tous les esprits peuvent s'épanouir !"
support.intro_text_1="La plupart des outils de productivité partent du principe que tout le monde pense de la même façon : de manière linéaire, avec une concentration sans faille et une motivation dictée par des échéances arbitraires. Que vous ayez un TDAH et trouviez votre motivation dans la satisfaction d'accomplir des tâches, que vous soyez autiste et ayez besoin d'un cadre stable, que vous soyez dyslexique et pensiez de façon spatiale, ou que vous en ayez simplement assez des outils qui ne correspondent pas à votre façon de penser, vous avez probablement fini par abandonner la gestion de projet."
support.intro_text_2="Nous construisons Leantime pour les esprits qui fonctionnent différemment. Cela inclut les cerveaux neuroatypiques, mais aussi toute personne qui a déjà eu le sentiment que les outils existants allaient à l'encontre de sa façon naturelle de penser."
