support.marcel_name="👋 Je suis Marcel"
support.marcel_tagline="Immigré allemand, père d'une fille autiste et vivant moi-même avec un TDAH."
support.marcel_bio_1="Les outils traditionnels de gestion de projet n'ont jamais vraiment fonctionné pour moi. Ils semblaient conçus par des esprits neurotypiques pour des esprits neurotypiques. En freelance, alors que je peinais à organiser les projets de mes clients, j'ai commencé à construire un outil qui fonctionnait avec mon cerveau plutôt que contre lui."
support.marcel_bio_2="Ce qui a commencé comme une solution personnelle est devenu Leantime quand j'ai réalisé que des millions d'autres personnes avaient besoin de la même chose."
support.gloria_name="👋 Et moi, c'est Gloria"
support.gloria_tagline="Ancienne infirmière aux urgences devenue product manager, entrepreneuse hispanique de première génération."
support.gloria_bio_1="J'ai passé des années dans des environnements médicaux sous haute pression, où l'organisation sauve littéralement des vies. Mais quand j'ai lancé ma propre entreprise, les outils de gestion de projet traditionnels me semblaient accablants et déconnectés de ma façon réelle de penser et de travailler."
support.gloria_bio_2="Ma formation en sciences comportementales et en recherche sur la motivation influence la façon dont nous concevons des fonctionnalités qui ne se contentent pas d'organiser les tâches — elles donnent envie de les terminer."
support.closing_text="Nous pouvons créer un monde où personne n'a à se battre contre ses outils pour bien travailler. Votre parrainage finance un avenir où le logiciel s'adapte à la diversité humaine, et non l'inverse."
support.headline_ready_to_impact="Envie de faire la différence ?"
support.contribution_text="Chaque contribution — de 1 $ à 100 $ — sert directement à améliorer Leantime pour tout le monde."
