text.lean.helper_content="Le Lean Canvas vous accompagne dans tout le processus de validation d'idée de votre nouvelle activité et/ou produit.<br/>Vous aborderez votre <em>Segment de clientèle</em>, votre <em>Problème, Solution</em>.<br/>Vous passerez ensuite à votre <em>Proposition de valeur unique</em> (qu'est-ce qui rend votre idée meilleure que les autres offres ?), vos <em>Canaux de distribution</em> (comment allez-vous faire parvenir votre solution à vos clients ?), vos <em>Sources de revenus</em> (comment votre solution génère-t-elle de l'argent ?), votre <em>Structure des coûts</em> (quels coûts implique votre solution ?), vos <em>Indicateurs clés</em> (comment mesurerez-vous le succès ?) et votre <em>Avantage difficile à reproduire</em> (qu'est-ce qui vous aidera à réussir face à la concurrence ?)<br/>Répondre à ces questions vise à favoriser le succès, limiter l'échec et vous permettre de suivre et valider vos hypothèses. Être Lean, c'est éliminer le gaspillage et construire des produits, des entreprises et des solutions dont vos clients ont réellement besoin."
text.lean.disclaimer="Le canevas Lean est adapté de <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> et est autorisé sous la licence <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>."
