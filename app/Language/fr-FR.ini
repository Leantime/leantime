text.my_work_dashboard_intro="Votre tableau de bord Mon travail rassemble l'essentiel en un seul endroit.<br/>Vos tâches les plus importantes sont maintenant au premier plan, organisées pour vous et pour votre façon de travailler.<br/><br/>Des tâches rapides aux objectifs ambitieux, tout est à portée de main. C'est votre espace pour noter vos idées, suivre votre avancement et célébrer vos réussites."
text.blueprints_intro="Les blueprints vous permettent de donner du sens à toutes vos données. Leantime propose une variété d'outils et de canevas pour définir le contexte de votre projet : canevas de modèle économique, analyse SWOT ou carte d'empathie.<br/><br/>Si vous ne savez pas par où commencer, nous vous conseillons de créer un « Canevas de valeur du projet ». Ce canevas répond aux questions les plus importantes de votre projet : Qui est votre client ?<br/>Quel problème résolvez-vous ?<br/>Quelle est votre solution ?<br/>Quel avantage votre solution offre-t-elle par rapport à celles de vos concurrents ?<br/>"
text.goals_tour_intro="Les objectifs vous permettent de découper votre projet en éléments réalisables, mesurables et concrets.<br/>Alors que les étapes se concentrent sur l'exécution, les objectifs portent sur les indicateurs que vous voulez atteindre.<br/>Chaque objectif doit avoir un but clair (ce que vous voulez atteindre) et doit pouvoir être mesuré facilement avec un seul indicateur.<br/><br/>Une fois un objectif créé, vous pouvez lui associer des étapes pour le décomposer en tâches concrètes.<br/>"
text.project_dashboard_tour_intro="Dans Leantime, les projets sont des espaces de travail collaboratifs où vous et votre équipe organisez, suivez et livrez le travail efficacement. Chaque projet regroupe les objectifs, tâches et étapes qui s'y rapportent, et vous permet de suivre l'avancement depuis un seul endroit.<br/><br/>Que vous gériez du travail professionnel, scolaire ou des initiatives personnelles, les projets Leantime vous donnent la structure et les outils nécessaires pour transformer vos idées en résultats concrets."
text.wiki_tour_intro="La documentation vous permet de rédiger et de partager des documents avec votre équipe. Vous pouvez créer plusieurs espaces pour organiser votre documentation par équipe, domaine ou catégorie de document.<br/>Créez des documents pour partager des connaissances, des processus et des procédures. Vous pouvez aussi créer un document pour partager un lien vers un fichier ou un dossier de votre stockage en ligne.<br/>"
