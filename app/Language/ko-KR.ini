label.onboarding_task_invite_team = "팀원 초대하기"
text.onboarding_task_invite_team = "누군가와 함께 일하든, 서로 책임감을 북돋아 줄 동료가 필요하든, Leantime을 팀으로 사용하면 동기를 유지하며 계획대로 나아가는 데 도움이 돼요 <a href='%s'>사용자 관리</a>"
label.onboarding_task_project_structure = "Leantime의 프로젝트 구조 자세히 알아보기"
text.onboarding_task_project_structure = "도움말 문서에 다양한 추가 자료가 있어요. Leantime의 프로젝트 구조와 모범 사례를 자세히 알아보려면 다음을 방문하세요: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal = "목표 만들기"
text.onboarding_task_create_goal = "목표는 장기적인 목적을 추적하고 측정하는 데 사용해요. 정기적으로 업데이트할 수 있는 지표로 측정할 수 있어야 해요. 목표와 마일스톤을 연결하면 지표 진행 상황과 함께 실행 진행 상황도 확인할 수 있어요 <a href='%s'>프로젝트 목표</a>"
label.onboarding_task_create_milestone = "마일스톤 만들기"
text.onboarding_task_create_milestone = "마일스톤을 사용하면 프로젝트의 단계를 개별 성과 단위로 구분할 수 있어요. 각 마일스톤에는 시작일과 종료일이 있으며, 구체적인 결과물을 만들어 내야 해요 <a href='%s'>프로젝트 마일스톤</a>"
label.onboarding_task_personal_project = "개인 프로젝트 둘러보기"
text.onboarding_task_personal_project = "개인 프로젝트는 작업, 목표, 업무를 정리할 수 있는 공간이에요. 상단의 프로젝트 선택기를 사용하거나 다음 링크를 클릭해 이동할 수 있어요: <a href='%s'>내 프로젝트</a>"
label.onboarding_task_complete_profile = "내 Leantime 프로필 완성하기"
text.onboarding_task_complete_profile = "프로필 사진을 업데이트하고 업무 환경 설정을 완료해 나에게 맞는 환경을 만드세요. <a href='%s'>내 프로필</a>"
label.onboarding_goalboard_title = "내 목표"
