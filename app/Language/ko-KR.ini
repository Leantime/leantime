tour.milestones.filter_text = "마일스톤을 필터링하고, 각 마일스톤에 속한 작업도 볼 수 있어요."
tour.milestones.timeframes_title = "기간"
tour.milestones.timeframes_text = "타임라인 보기의 기간을 바꿔 한 해를 더 넓게 보거나 일별로 자세히 살펴볼 수 있어요."
tour.milestones.finish_text = "마일스톤 둘러보기를 마쳤어요. <a href='%s/goalcanvas/dashboard'>목표</a>로 이동해 Leantime에서 목표를 만들고 관리하는 방법을 알아보세요."
tour.goals.overview_title = "목표"
tour.goals.overview_text = "목표로 프로젝트에 미치는 측정 가능한 영향을 추적할 수 있어요."
tour.goals.parts_title = "목적 & 지표"
tour.goals.parts_text = "각 목표는 목적(달성하려는 것)과 지표(측정하는 방법)로 구성돼요."
tour.goals.progress_title = "목표 진행 상황"
tour.goals.progress_text = "목표 지표를 업데이트하면 진행률 막대에 얼마나 진행되었는지 표시돼요."
tour.goals.milestones_title = "마일스톤 & 목표"
tour.goals.milestones_text = "목표를 마일스톤에 연결하면 작업 수준에서 목표의 진행 상황을 추적할 수 있어요. 프로젝트 계획의 빈틈을 찾는 데 도움이 돼요."
tour.goals.finish_text = "목표 둘러보기를 마쳤어요. 마일스톤, 목표, 할 일은 Leantime의 기본 구성 요소예요. 이를 활용해 업무를 관리하기 쉬운 단위로 나누세요. <a href='%s/tickets/showKanban'>칸반 보드</a>로 이동해 작업을 확인해 보세요."
