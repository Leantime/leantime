text.my_work_dashboard_intro = "내 작업 대시보드는 중요한 모든 것을 한눈에 보여 줘요.<br/>가장 중요한 작업이 맨 앞에 놓이고, 나와 내 생각하는 방식에 꼭 맞게 정리돼요.<br/><br/>간단한 작업부터 큰 목표까지 필요한 모든 것이 여기에 있어요. 아이디어를 기록하고, 진행 상황을 추적하고, 그 과정에서 이룬 성과를 축하하는 나만의 공간이에요."
text.blueprints_intro = "블루프린트는 모든 데이터를 의미 있게 정리할 수 있는 기회예요. Leantime에는 비즈니스 모델 캔버스, SWOT 분석, 공감 지도 등 프로젝트 배경을 정의할 수 있는 다양한 도구와 캔버스가 있어요.<br/><br/>어디서 시작해야 할지 모르겠다면 '프로젝트 가치 캔버스'를 먼저 만들어 보세요. 이 캔버스는 프로젝트의 가장 중요한 질문에 답해 줘요: 고객은 누구인가요?<br/>어떤 문제를 해결하나요?<br/>솔루션은 무엇인가요?<br/>내 솔루션은 경쟁사보다 어떤 이점이 있나요?<br/>"
text.goals_tour_intro = "목표를 사용하면 프로젝트를 달성 가능하고 측정 가능하며 실행 가능한 단위로 나눌 수 있어요.<br/>마일스톤이 실행에 초점을 맞춘다면, 목표는 달성하려는 지표에 관한 것이에요.<br/>각 목표에는 명확한 목적(이루고자 하는 것)이 있어야 하고, 하나의 지표로 쉽게 측정할 수 있어야 해요.<br/><br/>목표를 정했다면 마일스톤을 연결해 실행 가능한 작업으로 나눌 수 있어요.<br/>"
text.project_dashboard_tour_intro = "Leantime의 프로젝트는 나와 팀이 작업을 효율적으로 정리하고 추적하고 완수하는 협업 공간이에요. 각 프로젝트는 관련된 목표, 작업, 마일스톤을 한데 담고, 한곳에서 진행 상황을 확인할 수 있게 해 줘요.<br/><br/>업무, 학업, 개인 프로젝트 등 무엇을 관리하든 Leantime 프로젝트는 아이디어를 성공적인 결과로 바꾸는 데 필요한 구조와 도구를 제공해요."
text.wiki_tour_intro = "문서에서는 팀과 함께 문서를 작성하고 공유할 수 있어요. 여러 공간을 만들어 팀, 분야, 문서 카테고리별로 문서를 정리할 수 있어요.<br/>지식, 프로세스, 절차를 공유하는 문서를 만들어 보세요. 클라우드 스토리지의 파일이나 폴더 링크를 공유하는 문서도 만들 수 있어요.<br/>"
text.extend_leantime_latest_plugins = "최신 플러그인으로 Leantime을 확장하세요."
support.headline_help_us_build = "모든 사고방식이 빛나는 미래를 함께 만들어 주세요!"
support.intro_text_1 = "대부분의 생산성 도구는 모든 사람이 같은 방식으로 생각한다고 가정해요. 순서대로, 완벽하게 집중하며, 임의로 정한 마감일에서 동기를 얻는다고요. ADHD가 있어 작업을 끝낼 때마다 도파민이 필요하든, 자폐가 있어 일관된 구조를 원하든, 난독증이 있어 공간적으로 생각하든, 아니면 그저 내 뇌가 실제로 작동하는 방식과 맞지 않는 도구에 지쳤든—아마 프로젝트 관리를 아예 포기했을지도 몰라요."
support.intro_text_2 = "우리는 다르게 작동하는 마음을 위해 Leantime을 만들고 있어요. 신경다양성을 가진 사람은 물론, 기존 도구가 자신의 자연스러운 사고 패턴과 부딪친다고 느껴 본 모든 사람을 위한 것이에요."
