support.headline_whos_behind = "Leantime을 만드는 사람들"
support.marcel_name = "👋 저는 Marcel이에요"
support.marcel_tagline = "독일 출신 이민자이자 자폐가 있는 딸의 아빠이고, 저 역시 ADHD와 함께 살고 있어요."
support.marcel_bio_1 = "전통적인 프로젝트 관리 도구는 저와 전혀 맞지 않았어요. 신경전형적인 사람이 신경전형적인 사람을 위해 만든 도구처럼 느껴졌거든요. 프리랜서로 일하며 클라이언트 프로젝트를 정리하느라 애먹던 시절, 제 뇌와 맞서지 않고 함께 움직이는 도구를 직접 만들기 시작했어요."
support.marcel_bio_2 = "개인적인 해결책으로 시작한 것이, 수많은 사람에게도 같은 것이 필요하다는 걸 깨달으면서 Leantime이 되었어요."
support.gloria_name = "👋 그리고 저는 Gloria예요"
support.gloria_tagline = "응급실 간호사에서 제품 관리자로 전향한 1세대 히스패닉 창업가예요."
support.gloria_bio_1 = "저는 정리가 말 그대로 생명을 구하는 긴박한 의료 현장에서 수년을 보냈어요. 하지만 제 사업을 시작했을 때, 전통적인 프로젝트 도구는 부담스러웠고 제가 실제로 생각하고 일하는 방식과 동떨어져 있었어요."
support.gloria_bio_2 = "행동 과학과 동기 연구를 해 온 제 경험은, 단순히 작업을 정리하는 데 그치지 않고 실제로 작업을 끝내고 싶게 만드는 기능을 만드는 원동력이 돼요."
support.closing_text = "누구도 좋은 일을 하기 위해 도구와 씨름할 필요가 없는 세상을 만들 수 있어요. 여러분의 후원은 사람이 소프트웨어에 맞추는 대신 소프트웨어가 인간의 다양성에 맞추는 미래를 만들어요."
support.headline_ready_to_impact = "직접 변화를 만들어 볼 준비가 되셨나요?"
support.contribution_text = "$1부터 $100까지, 모든 후원은 모두를 위해 Leantime을 더 좋게 만드는 데 직접 쓰여요."
