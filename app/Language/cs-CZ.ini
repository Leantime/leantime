support.marcel_name="👋 Jsem Marcel"
support.marcel_tagline="Německý přistěhovalec, táta autistické dcery a sám žiju s ADHD."
support.marcel_bio_1="Tradiční nástroje pro řízení projektů mi nikdy nesedly. Připadalo mi, že je vytvořily neurotypické mysli pro neurotypické mysli. Když jsem pracoval na volné noze a snažil se udržet klientské projekty v pořádku, začal jsem budovat něco, co by fungovalo s mým mozkem, a ne proti němu."
support.marcel_bio_2="To, co začalo jako osobní řešení, se stalo Leantime, když jsem si uvědomil, že totéž potřebují miliony dalších lidí."
support.gloria_name="👋 A já jsem Gloria"
support.gloria_tagline="Bývalá zdravotní sestra z urgentního příjmu, nyní produktová manažerka, podnikatelka hispánského původu v první generaci."
support.gloria_bio_1="Strávila jsem roky ve vysoce stresujícím zdravotnickém prostředí, kde organizace doslova zachraňuje životy. Když jsem ale založila vlastní firmu, tradiční nástroje pro projekty mi připadaly zahlcující a odtržené od toho, jak skutečně myslím a pracuji."
support.gloria_bio_2="Moje zázemí v behaviorální vědě a výzkumu motivace určuje, jak vytváříme funkce, které úkoly nejen organizují — pomáhají vám je také skutečně chtít dokončit."
support.closing_text="Můžeme vytvořit svět, kde nikdo nemusí bojovat se svými nástroji, aby odvedl skvělou práci. Vaše sponzorství financuje budoucnost, ve které se software přizpůsobuje lidské rozmanitosti, a ne naopak."
