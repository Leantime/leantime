## Strategy Message=

headline.sm.board="Tabule Strategické Zprávy"

box.sm.qa="Kdo jsou <em>cílové segmenty zákazníků</em> a kdo je <em>explicitně mimo rozsah</em>?"
box.sm.qb="Jakou <em>hodnotovou nabídku</em> budete nabízet svým cílovým zákazníkům?"
box.sm.qc="Proč by si zákazníci měli zvolit podnikání s vámi namísto s vašimi konkurenty? Jaké jsou naše <em>rozlišovací charakteristiky</em>, které se těžko kopírují?"
box.sm.qd="Proč budete schopni plnit sliby dané vašim zákazníkům? Jaké <em>jedinečné schopnosti</em> máte a využíváte?"
box.sm.qe="Co se <em>změní</em> s novou nebo přepracovanou strategií a co <em>zůstane stejné</em> v čase? Jak zajistíte, aby stávající zákazníci, které zůstávají v rozsahu, nebyli ztraceni?"
box.sm.qf="Proč strategie umožní <em>generovat a/nebo zvyšovat zisky v čase</em>?"
box.sm.qg="Jsou cíle stanovené s novou nebo přepracovanou strategií <em>reálně dosažitelné</em>?"

