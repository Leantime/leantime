tour.my_work.welcome_title="Vítejte v prohlídce přehledu"
tour.my_work.welcome_text="Začněme několika základy, abyste se rychle zorientovali v navigaci a jednotlivých prvcích Leantime."
tour.my_work.work_modes_title="Pracovní režimy"
tour.my_work.work_modes_text="Horní navigace ukazuje aktuální „pracovní režim“, ve kterém se nacházíte. Můžete být uvnitř projektu, ve své osobní pracovní oblasti nebo v režimu společnosti."
tour.my_work.left_nav_text="Levá navigace člení aktuální pracovní režim a zpřístupňuje jeho jednotlivé oblasti. Vše, co zde vidíte, patří k pracovnímu režimu vybranému výše."
tour.my_work.profile_bar_title="Panel profilu"
tour.my_work.profile_bar_text="Zde najdete odkazy na svůj účet, oznámení a nejnovější zprávy o Leantime."
tour.my_work.widgets_title="Widgety vašeho přehledu"
tour.my_work.widgets_text="Váš přehled je rozdělen do několika widgetů, které zobrazují cílené informace o vaší práci."
tour.my_work.customize_title="Přizpůsobte si přehled"
tour.my_work.customize_text="Widgetům můžete měnit velikost a přesouvat je přetažením."
tour.my_work.todos_title="Moje Úkoly"
tour.my_work.todos_text="Widget „Moje Úkoly“ zobrazuje všechny úkoly, které jsou vám aktuálně přiřazeny."
tour.my_work.group_todos_title="Seskupení úkolů"
tour.my_work.group_todos_text="Pomocí rozbalovacích nabídek zde můžete filtrovat úkoly podle projektu nebo je seskupit podle priority, stavu, projektu či termínů."
tour.my_work.sort_todos_title="Řazení úkolů"
tour.my_work.sort_todos_text="Pořadí každého úkolu můžete změnit přetažením. Úkol můžete také přetáhnout do kalendáře a naplánovat ho."
tour.my_work.timer_title="Spusťte časovač"
tour.my_work.timer_text="Až budete připraveni začít na úkolu pracovat, stačí kliknout na tlačítko pro spuštění časovače."
tour.my_work.complete_task_title="Dokončete úkol"
tour.my_work.complete_task_text="Jakmile je úkol hotový, můžete ho označit jako dokončený v rozbalovací nabídce stavu."
tour.my_work.add_tasks_title="Přidejte další úkoly"
tour.my_work.add_tasks_text="Další úkoly můžete přidat kliknutím na tlačítko plus v každé sekci nebo pomocí nabídky se třemi tečkami vedle každého úkolu."
tour.my_work.finish_text="Dokončili jste prohlídku přehledu Moje Práce. Přejděte do <a href='%s/dashboard/show'>svého projektu</a> a zjistěte víc o řízení projektů v Leantime."
tour.project_dashboard.menu_title="Nabídka projektu"
tour.project_dashboard.menu_text="Nabídka projektu člení váš projekt do několika sekcí: <strong>Datová Místnost</strong> – pro všechny vaše soubory a informace, <strong>Přemýšlet</strong> – pro strategii, nápady a definice, <strong>Dělat</strong> – pro správu cílů, milníků a úkolů."
tour.project_dashboard.selector_title="Výběr projektu"
tour.project_dashboard.selector_text="Pomocí výběru projektu můžete přepínat mezi projekty. Levá nabídka zobrazuje vše, co souvisí s aktuálním projektem."
tour.project_dashboard.checklist_title="Kontrolní seznam"
tour.project_dashboard.checklist_text="Kontrolní seznam projektu vám rychle ukáže, zda projekt obsahuje všechny informace potřebné k úspěšné realizaci."
tour.project_dashboard.status_title="Rychlé aktualizace stavu"
tour.project_dashboard.status_text="Aktualizacemi stavu můžete týmu rychle sdělit, jak projekt pokračuje, a to pomocí červené, žluté a zelené barvy. Stav bude viditelný v celé aplikaci."
tour.project_dashboard.progress_title="Pokrok"
tour.project_dashboard.progress_text="Ukazatel pokroku projektu ukazuje, kolik práce jste již dokončili. Zohledňuje různou velikost úkolů, rychlost týmu i milníky projektu."
tour.project_dashboard.latest_tasks_title="Nejnovější úkoly"
tour.project_dashboard.latest_tasks_text="Seznam nejnovějších úkolů zobrazuje úkoly naposledy přidané do projektu a může sloužit jako schránka projektu."
tour.project_dashboard.team_title="Tým"
tour.project_dashboard.team_text="Sekce Tým zobrazuje členy tohoto projektu."
tour.project_dashboard.finish_text="Dokončili jste prohlídku přehledu projektu. Přejděte na <a href='%s/tickets/showKanban'>Úkoly</a> a zjistěte víc o různých způsobech správy úkolů v Leantime."
tour.kanban_board.overview_title="Vaše Kanban tabule"
tour.kanban_board.overview_text="Toto je vaše Kanban tabule. Pomáhá vám vizualizovat práci a omezit množství rozpracované práce."
tour.kanban_board.workflow_title="Tok práce"
tour.kanban_board.workflow_text="Úkoly se s postupem práce posouvají zleva doprava. Přetažením karet změníte jejich stav."
tour.kanban_board.columns_title="Flexibilní sloupce"
tour.kanban_board.columns_text="V nabídce se třemi tečkami můžete sloupce přidávat, odebírat a přejmenovávat."
tour.kanban_board.filter_title="Filtrování úkolů"
tour.kanban_board.filter_text="Úkoly můžete filtrovat podle různých polí, jako je priorita, stav, projekt nebo termíny."
tour.kanban_board.swimlanes_title="Dráhy"
tour.kanban_board.swimlanes_text="Úkoly můžete také seskupit a vytvořit tak na Kanban tabuli dráhy. Díky tomu uvidíte práci rozdělenou podle členů týmu, priority nebo milníků."
tour.kanban_board.sprints_title="Sprinty"
tour.kanban_board.sprints_text="Pokud řídíte práci ve sprintech, můžete zde v rozbalovací nabídce sprinty vybírat, vytvářet a upravovat."
tour.kanban_board.finish_text="Tím prohlídka Kanbanu končí. Přejděte na <a href='%s/tickets/roadmap'>Milníky</a> a zjistěte, jak v Leantime vytvářet a spravovat milníky."
tour.milestones.overview_title="Milníky"
tour.milestones.overview_text="Milníky vám pomáhají sledovat hlavní výstupy a fáze projektu."
tour.milestones.drag_title="Přetahování a řazení"
tour.milestones.drag_text="Každý pruh představuje jeden milník. Pruhy můžete posouvat po časové ose, měnit jejich pořadí i délku. Vše, co na této obrazovce uděláte, upraví načasování vašich milníků."
tour.milestones.filter_title="Filtr"
tour.milestones.filter_text="Milníky můžete filtrovat a také zobrazit úkoly, které k nim patří."
tour.milestones.timeframes_title="Časová období"
tour.milestones.timeframes_text="Časové období zobrazení časové osy můžete změnit, abyste viděli větší část roku nebo se ponořili do rozpisu po dnech."
tour.milestones.finish_text="Tím prohlídka milníků končí. Přejděte na <a href='%s/goalcanvas/dashboard'>Cíle</a> a zjistěte, jak v Leantime vytvářet a spravovat cíle."
tour.goals.overview_title="Cíle"
tour.goals.overview_text="Cíle vám pomáhají sledovat měřitelný dopad vašich projektů."
tour.goals.parts_title="Záměry a metriky"
tour.goals.parts_text="Každý cíl se skládá ze záměru (čeho chcete dosáhnout) a metriky (jak to budete měřit)."
tour.goals.progress_title="Pokrok cíle"
tour.goals.progress_text="Jak budete aktualizovat metriky cíle, ukazatel průběhu vám ukáže, jak daleko jste."
tour.goals.milestones_title="Milníky a cíle"
tour.goals.milestones_text="Cíle můžete propojit s milníky a sledovat jejich pokrok na úrovni úkolů. Pomáhá to odhalit mezery v plánu projektu."
tour.goals.finish_text="Tím prohlídka cílů končí. Milníky, cíle a úkoly jsou základní stavební kameny Leantime. Používejte je k rozdělení práce na zvládnutelné části. Přejděte na <a href='%s/tickets/showKanban'>Kanban tabuli</a> a projděte si své úkoly."
