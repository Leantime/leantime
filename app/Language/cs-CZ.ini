headlines.lean.welcome_to_board="Vítejte na tabuli Lean Canvas!"

text.lean.helper_content="Lean canvas vás provede celým procesem ověřování vaší nové myšlenky na obchod a/nebo produkt.<br/>Budete řešit <em>Segmenty Zákazníků</em>, <em>Problém, Řešení</em>.<br/>Odtud se přesunete na vaši <em>Unikátní Hodnotovou Nabídku</em> (co vám dává lepší výhodu než ostatní nabídky?), vaše <em>Distribuční Kanály</em> (jak dostanete vaše řešení k vašim zákazníkům?), vaše <em>Toky Příjmů</em> (jak bude vaše řešení vydělávat peníze?), vaši <em>Strukturu Nákladů</em> (kolik stojí vaše řešení?), <em>Klíčové Metriky</em> (jak budete měřit úspěch?), a vaši <em>Nespravedlivou Výhodu</em> (co máte, co vám pomůže uspět proti konkurenci?)<br/>Odpovědi na tyto otázky jsou navrženy tak, aby podporovaly úspěch, zmírňovaly selhání a umožňovaly vám sledovat a ověřovat vaše předpoklady. Být Lean znamená eliminovat plýtvání a pracovat na vytváření produktů, obchodů a řešení, která vaši zákazníci potřebují."
text.lean.disclaimer="Lean Canvas je adaptován z <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> a je licencován pod licencí <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
