text.mattermost_instructions=" Tato integrace bude publikovat upozornění na aktualizace do zvoleného kanálu.<br/>Postupujte podle pokynů <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>zde, abyste získali adresu URL příchozího webhooku</a> z Mattermostu. Poté vložte odkaz do formuláře napravo a klikněte na Uložit."
text.slack_instructions="Tato integrace bude publikovat upozornění na aktualizace do zvoleného kanálu.<br/>Postupujte podle pokynů <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>zde, abyste získali adresu URL příchozího webhooku</a> ze služby Slack. Poté vložte odkaz do formuláře napravo a klikněte na Uložit."
