label.onboarding_default_project_name="Můj projekt"
text.onboarding_default_project_details="Vítejte ve svém prvním projektu v Leantime!<br />Toto je váš prostor pro organizaci úkolů, sledování cílů a plánování práce. Klidně zde cokoli upravte nebo si s rostoucími potřebami vytvořte další projekty. Tento projekt slouží jen k tomu, abyste mohli začít"
label.onboarding_milestone_getting_started="Začínáme"
label.onboarding_task_community_chat="Připojte se k našemu komunitnímu chatu"
text.onboarding_task_community_chat="Náš komunitní chat je skvělé místo, kde se můžete ptát a získat zpětnou vazbu k nastavení projektu. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Komunitní chat</a>"
label.onboarding_task_invite_team="Pozvěte své kolegy z týmu"
text.onboarding_task_invite_team="Ať už s někým spolupracujete, nebo jen potřebujete parťáka, který vás podrží. Společné používání Leantime pomáhá zůstat na správné cestě a motivovaní <a href='%s'>Správa uživatelů</a>"
label.onboarding_task_project_structure="Zjistěte víc o struktuře projektů v Leantime"
text.onboarding_task_project_structure="V naší nápovědě najdete spoustu dalších materiálů. Chcete-li se dozvědět víc o struktuře projektů v Leantime a osvědčených postupech, navštivte: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Vytvořte cíl"
text.onboarding_task_create_goal="Cíle slouží ke sledování a měření dlouhodobých záměrů. Měly by být měřitelné pomocí metrik, které můžete pravidelně aktualizovat. Cíle a milníky lze propojit, takže vedle pokroku metrik uvidíte i pokrok v realizaci <a href='%s'>Cíle projektu</a>"
label.onboarding_task_create_milestone="Vytvořte milník"
text.onboarding_task_create_milestone="Milníky vám umožňují rozdělit fáze projektu na samostatné výstupy. Každý milník má datum začátku a konce a měl by přinést konkrétní výsledek <a href='%s'>Milníky projektu</a>"
label.onboarding_task_personal_project="Prozkoumejte svůj osobní projekt"
text.onboarding_task_personal_project="Váš osobní projekt je prostor, kde si můžete uspořádat úkoly, cíle a práci. Otevřete ho přes výběr projektu nahoře nebo kliknutím na tento odkaz: <a href='%s'>Můj projekt</a>"
label.onboarding_task_complete_profile="Doplnit můj profil v Leantime"
text.onboarding_task_complete_profile="Aktualizovat profilový obrázek a vyplnit pracovní preference pro přizpůsobení prostředí. <a href='%s'>Můj profil</a>"
label.onboarding_goalboard_title="Moje cíle"
