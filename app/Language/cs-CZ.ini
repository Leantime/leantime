text.my_work_dashboard_intro="Váš přehled Moje Práce dává do popředí vše, na čem záleží.<br/>Vaše nejdůležitější práce je teď hned na očích, uspořádaná přesně pro vás a podle toho, jak vašemu mozku nejlépe vyhovuje.<br/><br/>Od rychlých úkolů po ambiciózní cíle — vše, co potřebujete, je přímo tady. Toto je váš prostor pro zachycení nápadů, sledování pokroku a oslavu úspěchů na cestě."
text.blueprints_intro="Plány jsou vaší příležitostí dát všem datům smysl. Leantime nabízí řadu nástrojů a pláten, pomocí kterých definujete pozadí svého projektu — Business Model Canvas, SWOT analýzu nebo mapy empatie.<br/><br/>Pokud nevíte, kde začít, doporučujeme vytvořit „Canvas Hodnoty Projektu“. Toto plátno odpoví na nejdůležitější otázky vašeho projektu: Kdo je váš zákazník?<br/>Jaký problém řešíte?<br/>Jaké je vaše řešení?<br/>Jakou výhodu nabízí vaše řešení oproti konkurenci?<br/>"
text.goals_tour_intro="Cíle vám umožní rozdělit projekt na dosažitelné, měřitelné a proveditelné části.<br/>Zatímco milníky se zaměřují na realizaci, cíle se týkají metrik, kterých chcete dosáhnout.<br/>Každý cíl by měl mít jasný záměr (to, čeho chcete dosáhnout) a měl by být snadno měřitelný jedinou metrikou.<br/><br/>Jakmile máte cíl, můžete k němu přiřadit milníky a rozdělit jej tak na proveditelné úkoly.<br/>"
text.project_dashboard_tour_intro="Projekty v Leantime jsou společné pracovní prostory, kde vy a váš tým efektivně organizujete, sledujete a dodáváte práci. Každý projekt slouží jako kontejner pro související cíle, úkoly a milníky a umožňuje vám sledovat pokrok na jednom centrálním místě.<br/><br/>Ať už řídíte práci, školu nebo interní osobní iniciativy, projekty v Leantime vám poskytnou strukturu a nástroje potřebné k proměně nápadů v úspěšné výsledky."
text.wiki_tour_intro="Naše dokumentace vám umožní psát a sdílet dokumentaci s týmem. Můžete vytvořit více prostorů a uspořádat dokumentaci podle týmů, oblastí nebo kategorií dokumentů.<br/>Vytvářejte dokumenty pro sdílení znalostí, procesů a postupů. Můžete také vytvořit dokument s odkazem na soubor nebo složku ve svém cloudovém úložišti.<br/>"
text.extend_leantime_latest_plugins="Rozšiřte Leantime pomocí našich nejnovějších pluginů."
support.headline_help_us_build="Pomozte nám budovat budoucnost, ve které se daří všem myslím!"
support.intro_text_1="Většina nástrojů pro produktivitu předpokládá, že všichni myslí stejně: lineárně, s dokonalým soustředěním a s motivací z libovolně stanovených termínů. Ať už máte ADHD a potřebujete dávku dopaminu z dokončených úkolů, jste autisté a toužíte po konzistentní struktuře, máte dyslexii a myslíte prostorově, nebo vás jen unavují nástroje, které neodpovídají tomu, jak váš mozek skutečně funguje — pravděpodobně jste to s řízením projektů úplně vzdali."
support.intro_text_2="Leantime budujeme pro mysli, které fungují jinak. To zahrnuje neurodivergentní mozky, ale také každého, kdo někdy měl pocit, že stávající nástroje bojují proti jeho přirozenému způsobu myšlení."
