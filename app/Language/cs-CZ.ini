text.twoFA_verify_code="Zadejte kód, který generuje OTP/Google Authenticator aplikace"
text.twoFA_already_enabled="Dvoufaktorové ověření je již pro váš účet povoleno a je vyžadováno pro přihlášení.<br/><br/>Chcete-li odstranit dvoufaktorové ověření, klikněte níže na Odebrat"
text.twoFA_enabled="Váš účet má dvoufaktorové ověření <strong>povoleno</strong>."
text.twoFA_disabled="Váš účet má dvoufaktorové ověření <strong>zakázáno</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Spravovat dvoufaktorové ověření"
text.who_can_access="Vyberte, kdo má dovoleno zobrazit tento projekt. Ve výchozím nastavení budou uživatelé dědit role, které byly nastaveny. Tyto role můžete změnit na kartě 'Tým'"
text.ical_export_description="Zde můžete vytvořit jedinečnou URL adresu kalendáře, která vám umožní integrovat kalendář Leantime do jakékoli aplikace, která podporuje formát 'iCal'. "
text.you_ical_url="Url adresa vašeho kalendáře je níže. <br /> Prosím mějte na paměti, že každý, kdo získá tuto URL adresu, má do kalendáře přístup. URL adresu chraňte jako heslo."
