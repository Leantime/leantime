text.help_dashboard_intro="Leantime je vytvořen tak, aby posílil vaše superschopnosti a pomohl vám vidět pokrok na cestě k vašim cílům.<br /><br />Většina z nás je zvyklá vytvářet seznamy úkolů — my vás ale požádáme, abyste se zamysleli nad tím, čeho přesně se snažíte dosáhnout.<br /><br />1. Stanovte si vizi (strategii) a své cíle<br />2. Definujte práci, která vás k těmto cílům dovede<br />3. A pak jich dosáhněte – svou každodenní práci si plánujte v přehledu Moje Práce.<br />"
