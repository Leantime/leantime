text.zulip_instructions = "Ta integracja będzie wysyłać powiadomienia o aktualizacjach do wybranego strumienia i tematu.<br/>Postępuj zgodnie z instrukcją <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>dostępną tutaj</a>, aby utworzyć nowego bota. Następnie wklej dane w formularzu po prawej i kliknij Zapisz."
