text.my_work_dashboard_intro = "Twój dashboard Moja praca skupia wszystko, co ważne.<br/>Najważniejsza praca jest teraz na pierwszym planie, uporządkowana specjalnie dla Ciebie i pod to, jak najlepiej działa Twój umysł.<br/><br/>Od szybkich zadań po ambitne cele — wszystko, czego potrzebujesz, jest tutaj. To Twoja przestrzeń do zapisywania pomysłów, śledzenia postępów i świętowania sukcesów."
text.blueprints_intro = "Blueprinty pozwalają nadać sens wszystkim danym. Leantime oferuje wiele narzędzi i tablic do opisania tła projektu, takich jak Business Model Canvas, analiza SWOT czy mapy empatii.<br/><br/>Jeśli nie wiesz, od czego zacząć, proponujemy utworzyć „Project Value Canvas”. Ta tablica odpowie na najważniejsze pytania dotyczące Twojego projektu: Kim jest Twój klient?<br/>Jaki problem rozwiązujesz?<br/>Jakie jest Twoje rozwiązanie?<br/>Jaką przewagę ma Twoje rozwiązanie nad konkurencją?<br/>"
text.goals_tour_intro = "Cele pozwalają podzielić projekt na osiągalne, mierzalne i wykonalne części.<br/>Kamienie milowe skupiają się na realizacji, a cele — na metrykach, które chcesz osiągnąć.<br/>Każdy cel powinien mieć jasno określony zamiar (to, co chcesz osiągnąć) i być łatwo mierzalny za pomocą jednej metryki.<br/><br/>Gdy masz już cel, możesz przypisać do niego kamienie milowe, aby rozbić go na wykonalne zadania.<br/>"
text.project_dashboard_tour_intro = "Projekty w Leantime to wspólne przestrzenie robocze, w których Ty i Twój zespół sprawnie organizujecie, śledzicie i realizujecie pracę. Każdy projekt grupuje powiązane cele, zadania i kamienie milowe oraz pozwala monitorować postępy w jednym miejscu.<br/><br/>Niezależnie od tego, czy zarządzasz pracą, nauką czy inicjatywami wewnętrznymi lub osobistymi, projekty w Leantime dają strukturę i narzędzia potrzebne, aby zamieniać pomysły w udane rezultaty."
text.wiki_tour_intro = "Dokumentacja pozwala pisać i udostępniać dokumenty Twojemu zespołowi. Możesz utworzyć wiele przestrzeni, aby uporządkować dokumentację według zespołów, obszarów lub kategorii dokumentów.<br/>Twórz dokumenty, aby dzielić się wiedzą, procesami i procedurami. Możesz też utworzyć dokument z linkiem do pliku lub folderu w chmurze.<br/>"
text.extend_leantime_latest_plugins = "Rozszerz Leantime o nasze najnowsze wtyczki."
support.headline_help_us_build = "Pomóż nam budować przyszłość, w której każdy umysł może się rozwijać!"
support.intro_text_1 = "Większość narzędzi do produktywności zakłada, że wszyscy myślą tak samo: liniowo, z idealnym skupieniem, motywowani arbitralnymi terminami. Niezależnie od tego, czy masz ADHD i potrzebujesz zastrzyku dopaminy z ukończonych zadań, jesteś osobą autystyczną i potrzebujesz stałej struktury, masz dysleksję i myślisz przestrzennie, czy po prostu masz dość narzędzi, które nie pasują do tego, jak naprawdę działa Twój umysł — pewnie zdarzyło Ci się całkiem zrezygnować z zarządzania projektami."
support.intro_text_2 = "Budujemy Leantime dla umysłów, które działają inaczej. Dotyczy to osób neuroatypowych, ale też każdego, kto kiedykolwiek czuł, że istniejące narzędzia walczą z jego naturalnym sposobem myślenia."
