tour.my_work.welcome_title = "Witamy w przewodniku po dashboardzie"
tour.my_work.welcome_text = "Zacznijmy od kilku podstaw, które pomogą Ci szybko poznać nawigację i różne elementy Leantime."
tour.my_work.work_modes_title = "Tryby pracy"
tour.my_work.work_modes_text = "Górna nawigacja pokazuje bieżący „tryb pracy”, w którym się znajdujesz. Możesz być w projekcie, w swojej osobistej przestrzeni pracy lub w trybie firmy."
tour.my_work.left_nav_text = "Lewa nawigacja dzieli bieżący tryb pracy na części i daje dostęp do różnych obszarów. Wszystko, co tu widzisz, należy do trybu pracy wybranego powyżej."
tour.my_work.profile_bar_title = "Mój pasek profilu"
tour.my_work.profile_bar_text = "Tutaj znajdziesz linki do swojego konta, a także powiadomienia i najnowsze wiadomości o Leantime."
tour.my_work.widgets_title = "Widżety Twojego dashboardu"
tour.my_work.widgets_text = "Twój dashboard składa się z różnych widżetów, które pokazują najważniejsze informacje o Twojej pracy."
tour.my_work.customize_title = "Dostosuj swój dashboard"
tour.my_work.customize_text = "Rozmiar widżetów można zmieniać, a same widżety przesuwać metodą „przeciągnij i upuść”."
tour.my_work.todos_title = "Moje zadania"
tour.my_work.todos_text = "Widżet „Moje zadania” pokazuje wszystkie zadania, które są aktualnie przypisane do Ciebie."
tour.my_work.group_todos_title = "Grupowanie zadań"
tour.my_work.group_todos_text = "Za pomocą tych list rozwijanych możesz filtrować zadania według projektu lub grupować je według priorytetu, statusu, projektu albo dat."
tour.my_work.sort_todos_title = "Sortowanie zadań"
tour.my_work.sort_todos_text = "Każde zadanie można przeciągnąć i upuścić, aby zmienić jego kolejność. Możesz też przeciągnąć zadanie na kalendarz, aby je zaplanować."
tour.my_work.timer_title = "Uruchom licznik czasu"
tour.my_work.timer_text = "Gdy chcesz zacząć pracę nad zadaniem, po prostu kliknij przycisk uruchamiania licznika czasu."
tour.my_work.complete_task_title = "Ukończ zadanie"
tour.my_work.complete_task_text = "Gdy zadanie jest ukończone, możesz oznaczyć je jako zrobione, klikając listę rozwijaną statusu."
tour.my_work.add_tasks_title = "Dodaj więcej zadań"
tour.my_work.add_tasks_text = "Więcej zadań możesz dodać, klikając przycisk plusa w każdej sekcji lub korzystając z menu z trzema kropkami obok każdego zadania."
tour.my_work.finish_text = "To koniec przewodnika po dashboardzie „Moja praca”. Przejdź do <a href='%s/dashboard/show'>swojego projektu</a>, aby dowiedzieć się więcej o zarządzaniu projektami w Leantime."
tour.project_dashboard.menu_title = "Menu projektu"
tour.project_dashboard.menu_text = "Menu projektu dzieli projekt na sekcje: <strong>Data Room</strong> – do przechowywania wszystkich plików i informacji, <strong>Myśl</strong> – do opracowywania strategii, generowania pomysłów i definiowania, <strong>Twórz</strong> – do zarządzania celami, kamieniami milowymi i zadaniami."
tour.project_dashboard.selector_title = "Selektor projektu"
tour.project_dashboard.selector_text = "Użyj selektora projektu, aby przełączać się między projektami. Lewe menu pokazuje wszystko, co dotyczy bieżącego projektu."
tour.project_dashboard.checklist_title = "Lista kontrolna"
tour.project_dashboard.checklist_text = "Lista kontrolna projektu pozwala szybko sprawdzić, czy projekt zawiera wszystkie informacje potrzebne do skutecznej realizacji."
tour.project_dashboard.status_title = "Szybkie aktualizacje statusu"
tour.project_dashboard.status_text = "Aktualizacje statusu pozwalają szybko informować zespół o postępach projektu za pomocą kolorów czerwonego, żółtego i zielonego. Status będzie widoczny w całej aplikacji."
tour.project_dashboard.progress_title = "Postęp"
tour.project_dashboard.progress_text = "Wskaźnik postępu projektu pokazuje, ile pracy zostało już wykonane. Uwzględnia różne rozmiary zadań, tempo zespołu i kamienie milowe projektu."
tour.project_dashboard.latest_tasks_title = "Najnowsze zadania"
tour.project_dashboard.latest_tasks_text = "Lista najnowszych zadań pokazuje zadania ostatnio dodane do projektu i może służyć jako skrzynka odbiorcza projektu."
tour.project_dashboard.team_title = "Zespół"
tour.project_dashboard.team_text = "Sekcja „Zespół” pokazuje członków tego projektu."
tour.project_dashboard.finish_text = "To koniec przewodnika po dashboardzie projektu. Przejdź do sekcji <a href='%s/tickets/showKanban'>Zadania</a>, aby poznać różne sposoby zarządzania zadaniami w Leantime."
tour.kanban_board.overview_title = "Twoja tablica Kanban"
tour.kanban_board.overview_text = "To jest Twoja tablica Kanban. Pomaga wizualizować pracę i ograniczać pracę w toku."
tour.kanban_board.workflow_title = "Przepływ pracy"
tour.kanban_board.workflow_text = "Zadania przesuwają się od lewej do prawej wraz z postępem prac. Przeciągaj i upuszczaj karty, aby zmieniać ich status."
tour.kanban_board.columns_title = "Elastyczne kolumny"
tour.kanban_board.columns_text = "Za pomocą menu z trzema kropkami możesz dodawać i usuwać kolumny oraz zmieniać ich nazwy."
tour.kanban_board.filter_title = "Filtrowanie zadań"
tour.kanban_board.filter_text = "Zadania możesz filtrować według różnych pól, takich jak priorytet, status, projekt czy daty."
tour.kanban_board.swimlanes_title = "Tory (swimlanes)"
tour.kanban_board.swimlanes_text = "Możesz też grupować zadania, tworząc tory na tablicy Kanban. Pomaga to wizualizować pracę według członków zespołu, priorytetu lub kamieni milowych."
tour.kanban_board.sprints_title = "Sprinty"
tour.kanban_board.sprints_text = "Jeśli pracujesz w sprintach, za pomocą tej listy rozwijanej możesz wybierać, tworzyć i aktualizować sprinty."
tour.kanban_board.finish_text = "To koniec przewodnika po Kanbanie. Przejdź do sekcji <a href='%s/tickets/roadmap'>Kamienie milowe</a>, aby dowiedzieć się, jak tworzyć kamienie milowe i nimi zarządzać w Leantime."
tour.milestones.overview_title = "Kamienie milowe"
tour.milestones.overview_text = "Kamienie milowe pomagają śledzić najważniejsze rezultaty i fazy projektu."
tour.milestones.drag_title = "Przeciągaj i sortuj"
tour.milestones.drag_text = "Każdy pasek to jeden kamień milowy. Możesz przesuwać paski wzdłuż osi czasu, zmieniać ich kolejność i rozmiar. Wszystko, co zrobisz na tym ekranie, aktualizuje terminy Twoich kamieni milowych."
tour.milestones.filter_title = "Filtrowanie"
tour.milestones.filter_text = "Możesz filtrować kamienie milowe, a także wyświetlać należące do nich zadania."
tour.milestones.timeframes_title = "Zakresy czasu"
tour.milestones.timeframes_text = "Możesz zmienić zakres czasu na osi czasu, aby zobaczyć większą część roku albo przejść do szczegółowego widoku dziennego."
tour.milestones.finish_text = "To koniec przewodnika po kamieniach milowych. Przejdź do sekcji <a href='%s/goalcanvas/dashboard'>Cele</a>, aby dowiedzieć się, jak tworzyć cele i nimi zarządzać w Leantime."
tour.goals.overview_title = "Cele"
tour.goals.overview_text = "Cele pomagają śledzić mierzalne efekty Twoich projektów."
tour.goals.parts_title = "Zamierzenia i metryki"
tour.goals.parts_text = "Każdy cel składa się z zamierzenia (co chcesz osiągnąć) i metryki (jak to zmierzysz)."
tour.goals.progress_title = "Postęp celu"
tour.goals.progress_text = "Gdy aktualizujesz metryki celu, pasek postępu pokaże, na jakim etapie jesteś."
tour.goals.milestones_title = "Kamienie milowe i cele"
tour.goals.milestones_text = "Możesz łączyć cele z kamieniami milowymi, aby śledzić postęp celów na poziomie zadań. Pomaga to wychwycić luki w planie projektu."
tour.goals.finish_text = "To koniec przewodnika po celach. Kamienie milowe, cele i zadania to podstawowe elementy Leantime. Używaj ich, aby dzielić pracę na mniejsze części, którymi łatwo zarządzać. Przejdź do <a href='%s/tickets/showKanban'>tablicy Kanban</a>, aby przejrzeć swoje zadania."
