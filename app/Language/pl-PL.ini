support.marcel_name = "👋 Jestem Marcel"
support.marcel_tagline = "Imigrant z Niemiec, tata autystycznej córki, sam żyję z ADHD."
support.marcel_bio_1 = "Tradycyjne narzędzia do zarządzania projektami nigdy do mnie nie przemawiały. Miałem wrażenie, że zbudowały je neurotypowe umysły dla neurotypowych umysłów. Gdy pracowałem jako freelancer i miałem trudności z porządkowaniem projektów klientów, zacząłem budować coś, co współpracuje z moim mózgiem, a nie z nim walczy."
support.marcel_bio_2 = "To, co zaczęło się jako moje osobiste rozwiązanie, stało się Leantime, gdy zrozumiałem, że miliony innych osób potrzebują tego samego."
support.gloria_name = "👋 A ja jestem Gloria"
support.gloria_tagline = "Była pielęgniarka SOR, dziś product managerka, latynoska przedsiębiorczyni w pierwszym pokoleniu."
support.gloria_bio_1 = "Przez lata pracowałam w medycznych środowiskach pod dużą presją, gdzie organizacja dosłownie ratuje życie. Ale gdy założyłam własną firmę, tradycyjne narzędzia projektowe przytłaczały mnie i nie pasowały do tego, jak naprawdę myślę i pracuję."
support.gloria_bio_2 = "Moje doświadczenie w naukach behawioralnych i badaniach nad motywacją wpływa na to, jak budujemy funkcje, które nie tylko porządkują zadania, ale sprawiają, że naprawdę chcesz je wykonać."
support.closing_text = "Możemy stworzyć świat, w którym nikt nie musi walczyć ze swoimi narzędziami, aby wykonywać świetną pracę. Twój sponsoring finansuje przyszłość, w której oprogramowanie dostosowuje się do ludzkiej różnorodności, a nie odwrotnie."
support.headline_ready_to_impact = "Chcesz mieć bezpośredni wpływ?"
support.contribution_text = "Każda wpłata — od $1 do $100 — trafia bezpośrednio na ulepszanie Leantime dla wszystkich."
