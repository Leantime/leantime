text.mattermost_instructions = "Ta integracja będzie wysyłać powiadomienia o aktualizacjach do wybranego kanału.<br/>Postępuj zgodnie z instrukcją <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>dostępną tutaj</a>, aby uzyskać adres webhooka przychodzącego. Następnie wklej link w formularzu po prawej i kliknij Zapisz."
