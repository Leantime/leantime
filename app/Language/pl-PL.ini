headlines.lean.welcome_to_board = "Witaj na tablicy Lean Canvas!"

text.lean.helper_content = "Lean Canvas przeprowadzi Cię przez pełny proces walidacji pomysłu biznesowego i/lub produktowego.<br/>Zaczniesz od <em>segmentów klientów</em>, <em>problemu</em> oraz <em>rozwiązania</em>.<br/>Następnie przejdziesz do <em>unikalnej propozycji wartości</em> (co sprawia, że Twój pomysł jest lepszy od innych?), <em>kanałów dystrybucji</em> (jak dostarczysz rozwiązanie klientom?), <em>strumieni przychodów</em> (w jaki sposób rozwiązanie będzie zarabiać?), <em>struktury kosztów</em> (jakie koszty generuje rozwiązanie?), <em>kluczowych metryk</em> (jak zmierzysz sukces?) oraz <em>nieuczciwej przewagi</em> (co posiadasz, czego konkurencja nie jest w stanie łatwo skopiować?).<br/>Odpowiedzi na te pytania mają zwiększyć szanse na sukces, ograniczyć ryzyko porażki oraz umożliwić śledzenie i walidację założeń. Podejście Lean polega na eliminowaniu marnotrawstwa i budowaniu produktów, biznesów oraz rozwiązań, których naprawdę potrzebują klienci."
text.lean.disclaimer = "Lean Canvas bazuje na <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> i jest objęty licencją <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done = "<em>Gdy Lean Canvas jest gotowy, przejdź do</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Planera mapy drogowej</a>"


