text.full_lean_canvas_helper_content="Det fulde forskningsboard guider dig gennem hele processen med at validere en idé.<br/>På denne side tager du igen fat på dit kundesegment, problem og løsning (men bare rolig — hvis du allerede har udfyldt dette på det simple board, ser du det igen her!).<br/>Derfra skifter du til Klart værditilbud (Hvad gør din idé bedre end andre tilbud?),<br/>Salgskanaler (Hvordan får kunderne din løsning?)<br/>Indtægtsstrømme (Hvordan tjener din løsning penge?)<br/>Omkostningsstruktur (Hvor meget er din løsning værd?) Nøgletal (Hvordan måler du succes?)<br/>og uretfærdig fordel (Hvad hjælper dig med at skille dig ud fra konkurrenterne?)<br/>Besvarelsen af disse spørgsmål skal skabe succes, mindske fejl og give dig mulighed for at følge og validere dine antagelser.<br/>Lean handler om at fjerne spild og arbejde på at bygge produkter, butikker og løsninger, som dine kunder har brug for."
