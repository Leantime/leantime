text.help_dashboard_intro="Leantime er bygget til at styrke dine superkræfter og hjælpe dig med at se din fremgang mod dine mål.<br /><br />De fleste af os er vant til at lave opgavelister — men vi vil bede dig om at tænke over, hvad du præcis prøver at opnå.<br /><br />1. Sæt en vision (strategi), og sæt dine mål<br />2. Definer det arbejde, der får dig til de mål<br />3. Og nå dem så ved at planlægge dag for dag med dit Mit arbejde-dashboard.<br />"
