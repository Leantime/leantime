text.my_work_dashboard_intro="Dit Mit arbejde-dashboard sætter fokus på alt det, der betyder noget.<br/>Dit vigtigste arbejde er nu i centrum, organiseret helt for dig, og sådan som din hjerne fungerer bedst.<br/><br/>Fra hurtige opgaver til ambitiøse mål — alt, hvad du har brug for, er lige her. Dette er dit sted til at indfange ideer, følge fremgang og fejre sejre undervejs."
text.blueprints_intro="Blueprints er din mulighed for at få mening i alle dataene. Leantime har en række værktøjer og canvasser til at definere din projektbaggrund via Business Model Canvas, SWOT-analyse eller empatikort.<br/><br/>Hvis du ikke ved, hvor du skal starte, foreslår vi, at du opretter et 'Project Value Canvas'. Dette canvas besvarer de vigtigste spørgsmål i dit projekt: Hvem er din kunde?<br/>Hvilket problem løser du?<br/>Hvad er din løsning?<br/>Hvilken fordel giver din løsning i forhold til dine konkurrenter<br/>"
text.goals_tour_intro="Mål gør det muligt at opdele dit projekt i opnåelige, målbare og handlingsrettede bidder.<br/>Hvor milepæle fokuserer på udførelse, handler mål om de nøgletal, du vil opnå.<br/>Hvert mål bør have et klart formål (det, du vil opnå), og det bør let kunne måles med ét enkelt nøgletal.<br/><br/>Når du har et mål, kan du tilknytte milepæle til det for at opdele det i udførbare opgaver.<br/>"
text.project_dashboard_tour_intro="Projekter i Leantime er fælles arbejdsområder, hvor du og dit team organiserer, følger og leverer arbejde effektivt. Hvert projekt fungerer som en beholder for relaterede mål, opgaver og milepæle og giver dig mulighed for at følge fremgangen ét centralt sted.<br/><br/>Uanset om du styrer arbejde, skole eller interne personlige initiativer, giver projekter i Leantime den struktur og de værktøjer, der skal til for at gøre ideer til gode resultater."
text.wiki_tour_intro="Vores wiki giver dig mulighed for at skrive og dele dokumentation med dit team. Du kan oprette flere områder for at organisere din dokumentation efter teams, områder eller dokumentkategorier.<br/>Opret dokumenter for at dele viden, processer og procedurer. Du kan også oprette et dokument for at dele et link til en fil eller en mappe i din cloud-lagring.<br/>"
text.extend_leantime_latest_plugins="Udvid Leantime med vores nyeste plugins."
support.headline_help_us_build="Hjælp os med at skabe en fremtid, hvor alle hjerner trives!"
support.intro_text_1="De fleste produktivitetsværktøjer antager, at alle tænker på samme måde: lineært, med perfekt fokus og motiveret af vilkårlige deadlines. Uanset om du har ADHD og har brug for dopaminkick fra fuldførte opgaver, er autist og har brug for fast struktur, har ordblindhed og tænker rumligt, eller bare er træt af værktøjer, der ikke passer til, hvordan din hjerne faktisk fungerer — så har du sikkert helt opgivet projektstyring."
support.intro_text_2="Vi bygger Leantime til hjerner, der fungerer anderledes. Det gælder neurodivergente hjerner, men også alle, der nogensinde har følt, at eksisterende værktøjer kæmper imod deres naturlige tankemønstre."
support.headline_why_wont_disappear="Derfor forsvinder Leantime ikke"
