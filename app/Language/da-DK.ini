tour.my_work.welcome_title="Velkommen til dashboard-turen"
tour.my_work.welcome_text="Lad os starte med det grundlæggende, så du hurtigt kommer godt i gang med navigationen og de forskellige elementer i Leantime."
tour.my_work.work_modes_title="Arbejdstilstande"
tour.my_work.work_modes_text="Topnavigationen viser, hvilken »arbejdstilstand« du er i. Du kan være inde i et projekt, i dit personlige arbejdsområde eller i virksomhedstilstanden."
tour.my_work.left_nav_text="Den venstre navigation opdeler den aktuelle arbejdstilstand og giver dig adgang til forskellige områder. Alt, hvad der vises her, hører til den arbejdstilstand, der er valgt ovenfor."
tour.my_work.profile_bar_title="Min profilbjælke"
tour.my_work.profile_bar_text="Her finder du links til din konto samt notifikationer og de seneste nyheder om Leantime."
tour.my_work.widgets_title="Dine dashboard-widgets"
tour.my_work.widgets_text="Dit dashboard er opdelt i forskellige widgets, der viser dig fokuseret information om dit arbejde."
tour.my_work.customize_title="Tilpas dit dashboard"
tour.my_work.customize_text="Widgets kan ændres i størrelse og flyttes rundt med træk og slip."
tour.my_work.todos_title="Mine To-Dos"
tour.my_work.todos_text="Widgetten Mine To-Dos viser alle de opgaver, der i øjeblikket er tildelt dig."
tour.my_work.group_todos_title="Gruppér To-Dos"
tour.my_work.group_todos_text="Du kan bruge rullemenuerne her til at filtrere dine opgaver efter projekt eller gruppere dem efter prioritet, status, projekt eller datoer."
tour.my_work.sort_todos_title="Sortér To-Dos"
tour.my_work.sort_todos_text="Hver To-Do kan trækkes og slippes for at ændre rækkefølgen. Du kan også trække en opgave over i kalenderen for at planlægge den."
tour.my_work.timer_title="Start timeren"
tour.my_work.timer_text="Når du er klar til at gå i gang med en opgave, skal du blot klikke på knappen til at starte timeren."
tour.my_work.complete_task_title="Fuldfør en opgave"
tour.my_work.complete_task_text="Når en opgave er fuldført, kan du markere den som udført ved at klikke på rullemenuen for status."
tour.my_work.add_tasks_title="Tilføj flere opgaver"
tour.my_work.add_tasks_text="Du kan tilføje flere opgaver ved at klikke på plusknappen i hver sektion eller ved at bruge menuen med de 3 prikker ud for hver opgave."
tour.my_work.finish_text="Du har gennemført dashboard-turen for Mit arbejde. Gå til <a href='%s/dashboard/show'>dit projekt</a> for at lære mere om projektstyring i Leantime."
tour.project_dashboard.menu_title="Projektmenu"
tour.project_dashboard.menu_text="Projektmenuen opdeler dit projekt i forskellige sektioner: <strong>Datarum</strong> - til alle dine filer og oplysninger, <strong>Tænk</strong> - til at lægge strategi, få idéer og definere, <strong>Lav</strong> - til at styre mål, milepæle og opgaver."
tour.project_dashboard.selector_title="Projektvælger"
tour.project_dashboard.selector_text="Brug projektvælgeren til at skifte mellem projekter. Den venstre menu viser alt, der vedrører dit aktuelle projekt."
tour.project_dashboard.checklist_title="Tjekliste"
tour.project_dashboard.checklist_text="Projekttjeklisten giver dig et hurtigt overblik over, om dit projekt indeholder alle de oplysninger, der er nødvendige for en vellykket gennemførelse."
tour.project_dashboard.status_title="Hurtige statusopdateringer"
tour.project_dashboard.status_text="Med statusopdateringer kan du hurtigt dele dit projekts fremskridt med dit team ved hjælp af farverne rød, gul og grøn. Statussen er synlig i hele applikationen."
tour.project_dashboard.progress_title="Fremskridt"
tour.project_dashboard.progress_text="Indikatoren for projektets fremskridt viser dig, hvor meget arbejde du har fuldført. Den tager højde for opgavernes forskellige størrelser, teamets hastighed og projektets milepæle."
tour.project_dashboard.latest_tasks_title="Seneste opgaver"
tour.project_dashboard.latest_tasks_text="Listen over seneste opgaver viser de opgaver, der senest er tilføjet til dit projekt, og kan bruges som projektets indbakke."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Teamfeltet viser dig medlemmerne af dette projekt."
tour.project_dashboard.finish_text="Du har gennemført turen af projektoversigten. Gå til <a href='%s/tickets/showKanban'>To-Dos</a> for at lære mere om de forskellige måder at styre dine opgaver på i Leantime."
tour.kanban_board.overview_title="Dit Kanban-board"
tour.kanban_board.overview_text="Dette er dit Kanban-board. Det hjælper dig med at visualisere dit arbejde og begrænse mængden af igangværende arbejde."
tour.kanban_board.workflow_title="Arbejdsgang"
tour.kanban_board.workflow_text="Opgaver bevæger sig fra venstre mod højre, efterhånden som de skrider frem. Træk og slip kort for at opdatere deres status."
tour.kanban_board.columns_title="Fleksible kolonner"
tour.kanban_board.columns_text="Via menuen med de 3 prikker kan du tilføje, fjerne og omdøbe kolonner."
tour.kanban_board.filter_title="Filtrer opgaver"
tour.kanban_board.filter_text="Du kan filtrere dine opgaver efter forskellige felter som prioritet, status, projekt eller datoer."
tour.kanban_board.swimlanes_title="Svømmebaner"
tour.kanban_board.swimlanes_text="Du kan desuden gruppere dine opgaver for at oprette Kanban-svømmebaner. Det hjælper dig med at visualisere dit arbejde efter teammedlemmer, prioritet eller milepæle."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Hvis du styrer dit arbejde i sprints, kan du bruge rullemenuen her til at vælge, oprette og opdatere sprints."
tour.kanban_board.finish_text="Dette afslutter Kanban-turen. Gå til <a href='%s/tickets/roadmap'>Milepæle</a> for at lære, hvordan du opretter og styrer milepæle i Leantime."
tour.milestones.overview_title="Milepæle"
tour.milestones.overview_text="Milepæle hjælper dig med at følge vigtige resultater og projektfaser."
tour.milestones.drag_title="Træk og sortér"
tour.milestones.drag_text="Hver bjælke repræsenterer én milepæl. Du kan trække dem langs tidslinjen, ændre deres rækkefølge og ændre deres størrelse. Alt, hvad du gør på denne skærm, opdaterer tidsplanen for dine milepæle."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Du kan filtrere dine milepæle og også se de opgaver, der hører til dem."
tour.milestones.timeframes_title="Tidsrammer"
tour.milestones.timeframes_text="Du kan ændre tidsrammen for tidslinjevisningen for at se mere af året eller dykke ned i en opdeling dag for dag."
tour.milestones.finish_text="Dette afslutter milepælsturen. Gå til <a href='%s/goalcanvas/dashboard'>Mål</a> for at lære, hvordan du opretter og styrer mål i Leantime."
tour.goals.overview_title="Mål"
tour.goals.overview_text="Mål hjælper dig med at følge den målbare effekt af dine projekter."
tour.goals.parts_title="Målsætninger og nøgletal"
tour.goals.parts_text="Hvert mål består af en målsætning (det, du forsøger at opnå) og et nøgletal (hvordan du vil måle det)."
tour.goals.progress_title="Fremskridt for mål"
tour.goals.progress_text="Når du opdaterer nøgletallene for dine mål, viser statuslinjen, hvor langt du er nået."
tour.goals.milestones_title="Milepæle og mål"
tour.goals.milestones_text="Du kan knytte mål til milepæle for at følge målenes fremskridt på opgaveniveau. Det hjælper dig med at finde huller i din projektplan."
tour.goals.finish_text="Dette afslutter målturen. Milepæle, mål og To-Dos er de grundlæggende byggesten i Leantime. Brug dem til at opdele dit arbejde i overskuelige bidder. Gå til <a href='%s/tickets/showKanban'>Kanban-boardet</a> for at gennemgå dine opgaver."
