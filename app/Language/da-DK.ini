support.marcel_name="👋 Jeg hedder Marcel"
support.marcel_tagline="Tysk indvandrer, far til en autistisk datter og selv ramt af ADHD."
support.marcel_bio_1="Traditionelle projektstyringsværktøjer gav aldrig mening for mig. De føltes, som om de var bygget af neurotypiske hjerner til neurotypiske hjerner. Da jeg arbejdede som freelancer og kæmpede med at holde styr på kundeprojekter, begyndte jeg at bygge noget, der arbejdede med min hjerne i stedet for imod den."
support.marcel_bio_2="Det, der startede som en personlig løsning, blev til Leantime, da jeg indså, at millioner af andre havde brug for det samme."
support.gloria_name="👋 Og jeg hedder Gloria"
support.gloria_tagline="Tidligere skadestuesygeplejerske, nu produktchef, og førstegenerations latinamerikansk iværksætter."
support.gloria_bio_1="Jeg tilbragte år i medicinske miljøer under højt pres, hvor organisering bogstaveligt talt redder liv. Men da jeg startede min egen virksomhed, føltes traditionelle projektværktøjer overvældende og frakoblede fra, hvordan jeg faktisk tænker og arbejder."
support.gloria_bio_2="Min baggrund inden for adfærdsvidenskab og motivationsforskning præger, hvordan vi bygger funktioner, der ikke bare organiserer opgaver — de hjælper dig til rent faktisk at have lyst til at fuldføre dem."
support.closing_text="Vi kan skabe en verden, hvor ingen behøver at kæmpe med deres værktøjer for at udføre godt arbejde. Dit sponsorat finansierer en fremtid, hvor software tilpasser sig menneskelig mangfoldighed — ikke omvendt."
