label.onboarding_default_project_name="Mit projekt"
text.onboarding_default_project_details="Velkommen til dit første projekt i Leantime!<br />Her kan du organisere opgaver, følge mål og planlægge dit arbejde. Du er velkommen til at ændre alt her eller oprette flere projekter, efterhånden som du vokser. Dette projekt er kun til for at hjælpe dig i gang"
label.onboarding_milestone_getting_started="Kom godt i gang"
label.onboarding_task_community_chat="Deltag i vores fællesskabschat"
text.onboarding_task_community_chat="Vores fællesskabschat er et godt sted at stille spørgsmål og få feedback på opsætningen af dit projekt. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Fællesskabschat</a>"
label.onboarding_task_invite_team="Inviter dine teammedlemmer"
text.onboarding_task_invite_team="Uanset om du arbejder sammen med nogen eller bare har brug for en makker, der holder dig til ilden, hjælper det at bruge Leantime som gruppe med at holde kursen og motivationen <a href='%s'>Brugerstyring</a>"
label.onboarding_task_project_structure="Lær mere om Leantimes projektstruktur"
text.onboarding_task_project_structure="Vi har mange ekstra ressourcer i vores hjælpedokumentation. Du kan lære mere om projektstruktur i Leantime og bedste praksis her: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Opret et mål"
text.onboarding_task_create_goal="Mål bruges til at følge og måle langsigtede målsætninger. De bør kunne måles med nøgletal, som du kan opdatere regelmæssigt. Mål og milepæle kan knyttes sammen, så du kan se fremskridtet i udførelsen samtidig med fremskridtet i nøgletallene <a href='%s'>Projektmål</a>"
label.onboarding_task_create_milestone="Opret en milepæl"
text.onboarding_task_create_milestone="Med milepæle kan du opdele dit projekt i faser med afgrænsede resultater. Hver milepæl har en start- og slutdato og bør levere et konkret resultat <a href='%s'>Projektmilepæl</a>"
label.onboarding_task_personal_project="Udforsk dit personlige projekt"
text.onboarding_task_personal_project="Dit personlige projekt er et sted, hvor du kan organisere dine opgaver, mål og dit arbejde. Du kan finde det via projektvælgeren øverst eller ved at klikke på dette link: <a href='%s'>Mit projekt</a>"
label.onboarding_task_complete_profile="Udfyld min Leantime-profil"
text.onboarding_task_complete_profile="Opdater profilbilledet og udfyld arbejdspræferencerne for at tilpasse min oplevelse. <a href='%s'>Min profil</a>"
