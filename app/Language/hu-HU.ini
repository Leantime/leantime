box.sm.qe="Mi <em>módosul</em> az új vagy felülvizsgált stratégiával, és mi <em>marad változatlan</em> az idő múlásával? Hogyan biztosítja, hogy a meglévő ügyfelek továbbra is hatálya, nem vesztek el?"
