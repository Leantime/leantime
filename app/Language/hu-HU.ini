text.my_work_dashboard_intro="A Saját munka irányítópult mindent a fókuszba hoz, ami számít.<br/>A legfontosabb munkái most középpontba kerülnek, kifejezetten Önnek rendezve, úgy, ahogyan az agya a legjobban működik.<br/><br/>A gyors feladatoktól a nagyratörő célokig minden itt van, amire szüksége van. Ez az Ön tere, ahol ötleteket rögzíthet, nyomon követheti az előrehaladást, és útközben megünnepelheti a sikereit."
text.blueprints_intro="A tervrajzok segítenek értelmezni az összes adatot. A Leantime számos eszközt és vásznat kínál a projekt hátterének meghatározásához, például üzleti modell vásznakat, SWOT-elemzést vagy empátiatérképeket.<br/><br/>Ha nem tudja, hol kezdje, javasoljuk, hogy hozzon létre egy „Projektérték-vásznat”. Ez a vászon megválaszolja a projekt legfontosabb kérdéseit: Ki az ügyfele?<br/>Milyen problémát old meg?<br/>Mi a megoldása?<br/>Milyen előnyt kínál a megoldása a versenytársakéval szemben?<br/>"
text.goals_tour_intro="A célok segítségével elérhető, mérhető és megvalósítható részekre bonthatja a projektjét.<br/>Míg a mérföldkövek a végrehajtásra összpontosítanak, a célok azokról a mérőszámokról szólnak, amelyeket el szeretne érni.<br/>Minden célnak legyen egyértelmű célkitűzése (amit el szeretne érni), és egyetlen mérőszámmal könnyen mérhetőnek kell lennie.<br/><br/>Ha már van célja, mérföldköveket rendelhet hozzá, hogy végrehajtható feladatokra bontsa.<br/>"
text.project_dashboard_tour_intro="A Leantime projektjei olyan közös munkaterek, ahol Ön és csapata hatékonyan szervezheti, követheti és teljesítheti a munkát. Minden projekt a kapcsolódó célok, feladatok és mérföldkövek tárolójaként szolgál, és lehetővé teszi, hogy egyetlen központi helyen kövesse az előrehaladást.<br/><br/>Legyen szó munkáról, iskoláról vagy belső, személyes kezdeményezésekről, a Leantime projektjei biztosítják azt a struktúrát és azokat az eszközöket, amelyekkel az ötletekből sikeres eredmények lesznek."
text.wiki_tour_intro="A dokumentumok segítségével dokumentációt írhat és oszthat meg csapatával. Több teret is létrehozhat, hogy csapatok, területek vagy dokumentumkategóriák szerint rendezze a dokumentációt.<br/>Hozzon létre dokumentumokat tudás, folyamatok és eljárások megosztásához. Olyan dokumentumot is létrehozhat, amely egy felhőtárhelyen lévő fájlra vagy mappára mutató hivatkozást oszt meg.<br/>"
text.extend_leantime_latest_plugins="Bővítse a Leantime-ot legújabb beépülő moduljainkkal."
support.headline_help_us_build="Segítsen nekünk olyan jövőt építeni, ahol minden elme kiteljesedhet!"
support.intro_text_1="A legtöbb termelékenységi eszköz azt feltételezi, hogy mindenki ugyanúgy gondolkodik: lineárisan, tökéletes fókusszal, önkényes határidők által motiválva. Akár ADHD-s, és a befejezett feladatok dopaminlöketére van szüksége, akár autista, és következetes struktúrára vágyik, akár diszlexiás, és térben gondolkodik, akár egyszerűen elege van azokból az eszközökből, amelyek nem illeszkednek ahhoz, ahogyan az agya valójában működik – valószínűleg már teljesen lemondott a projektmenedzsmentről."
support.intro_text_2="A Leantime-ot a másképp működő elméknek építjük. Ide tartoznak a neurodivergens agyak, de mindenki más is, aki valaha úgy érezte, hogy a meglévő eszközök a természetes gondolkodásmódja ellen dolgoznak."
