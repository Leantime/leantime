text.help_dashboard_intro="A Leantime arra készült, hogy felerősítse a szuperképességeit, és segítsen látni, hogyan halad a céljai felé.<br /><br />A legtöbben megszoktuk a feladatlisták készítését – mi azonban arra kérjük, gondolja végig, pontosan mit is szeretne elérni.<br /><br />1. Határozzon meg egy jövőképet (stratégiát), és tűzze ki a céljait<br />2. Határozza meg azt a munkát, amely elvezet ezekhez a célokhoz<br />3. Majd érje el őket úgy, hogy a mindennapjait a Saját munka irányítópulton tervezi meg.<br />"
