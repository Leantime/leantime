text.twoFA_verify_code="Írja be az OTP alkalmazástól/Google Hitelesítőtől kapott kódot"
text.twoFA_already_enabled="A kéttényezős hitelesítés már engedélyezve van az Ön fiókjában, és szükséges a bejelentkezéshez.<br/><br/>A kéttényezős hitelesítés eltávolításához kattintson az alábbi eltávolításra."
text.twoFA_enabled="Fiókjában a kéttényezős hitelesítés <strong>engedélyezett</strong>."
text.twoFA_disabled="Fiókjában a kéttényezős hitelesítés <strong>le van tiltva</strong>."
