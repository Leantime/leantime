support.marcel_name="👋 Marcel vagyok"
support.marcel_tagline="Német bevándorló, egy autista lány apja, és magam is ADHD-val élek."
support.marcel_bio_1="A hagyományos projektmenedzsment-eszközök sosem működtek nálam. Úgy éreztem, neurotipikus elmék építették őket neurotipikus elméknek. Amikor szabadúszóként dolgoztam, és nehezen tartottam rendben az ügyfélprojekteket, elkezdtem építeni valamit, ami az agyammal együtt működik, nem pedig ellene."
support.marcel_bio_2="Ami személyes megoldásként indult, abból akkor lett a Leantime, amikor rájöttem, hogy emberek millióinak van szüksége ugyanerre."
support.gloria_name="👋 Én pedig Gloria vagyok"
support.gloria_tagline="Egykori sürgősségi ápoló, akiből termékmenedzser lett; első generációs spanyolajkú vállalkozó."
support.gloria_bio_1="Éveket töltöttem nagy nyomás alatt álló egészségügyi környezetben, ahol a szervezettség szó szerint életeket ment. Amikor azonban elindítottam a saját vállalkozásomat, a hagyományos projekteszközök nyomasztónak tűntek, és nem illeszkedtek ahhoz, ahogyan valójában gondolkodom és dolgozom."
support.gloria_bio_2="A viselkedéstudományi és motivációkutatási hátterem határozza meg, hogyan építünk olyan funkciókat, amelyek nem csupán rendszerezik a feladatokat – hanem abban is segítenek, hogy valóban el akarja végezni őket."
support.closing_text="Létrehozhatunk egy olyan világot, ahol senkinek sem kell az eszközeivel küzdenie ahhoz, hogy nagyszerű munkát végezzen. Szponzorálásával egy olyan jövőt finanszíroz, amelyben a szoftver alkalmazkodik az emberi sokféleséghez, és nem fordítva."
