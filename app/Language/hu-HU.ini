; Strings added 2026-10 by machine translation (Claude), please review
tour.my_work.welcome_title="Üdvözöljük az irányítópult bemutatójában"
tour.my_work.welcome_text="Kezdjük néhány alapvető tudnivalóval, hogy gyorsan eligazodjon a navigációban és a Leantime különböző elemei között."
tour.my_work.work_modes_title="Munkamódok"
tour.my_work.work_modes_text="A felső navigáció mutatja, melyik „munkamódban” van éppen. Lehet egy projektben, a személyes munkaterületén vagy a vállalati módban."
tour.my_work.left_nav_text="A bal oldali navigáció részekre bontja az aktuális munkamódot, és hozzáférést ad a különböző területekhez. Minden, ami itt megjelenik, a fent kiválasztott munkamódhoz tartozik."
tour.my_work.profile_bar_title="Profilsáv"
tour.my_work.profile_bar_text="Itt találja a fiókjára mutató hivatkozásokat, valamint az értesítéseket és a Leantime legfrissebb híreit."
tour.my_work.widgets_title="Az irányítópult widgetjei"
tour.my_work.widgets_text="Az irányítópult különböző widgetekre oszlik, amelyek célzott információkat mutatnak a munkájáról."
tour.my_work.customize_title="Az irányítópult testreszabása"
tour.my_work.customize_text="A widgetek húzással átméretezhetők és áthelyezhetők."
tour.my_work.todos_title="Saját teendők"
tour.my_work.todos_text="A Saját teendők widget az Önhöz jelenleg hozzárendelt összes feladatot mutatja."
tour.my_work.group_todos_title="Teendők csoportosítása"
tour.my_work.group_todos_text="Az itt található legördülő menükkel projekt szerint szűrheti a feladatait, vagy prioritás, állapot, projekt vagy dátum szerint csoportosíthatja őket."
tour.my_work.sort_todos_title="Teendők rendezése"
tour.my_work.sort_todos_text="A teendők sorrendje húzással módosítható. Egy feladatot a naptárba is húzhat, hogy beütemezze."
tour.my_work.timer_title="Az időzítő indítása"
tour.my_work.timer_text="Ha készen áll arra, hogy elkezdjen dolgozni egy feladaton, egyszerűen kattintson az időzítő indítása gombra."
tour.my_work.complete_task_title="Feladat befejezése"
tour.my_work.complete_task_text="Ha egy feladat elkészült, az állapot legördülő menüjére kattintva megjelölheti késznek."
tour.my_work.add_tasks_title="További feladatok hozzáadása"
tour.my_work.add_tasks_text="További feladatokat az egyes szakaszok plusz gombjára kattintva, vagy a feladatok melletti hárompontos menüvel adhat hozzá."
tour.my_work.finish_text="Befejezte a Saját munka irányítópult bemutatóját. Nyissa meg <a href='%s/dashboard/show'>a projektjét</a>, és ismerje meg közelebbről a projektkezelést a Leantime-ban."
tour.project_dashboard.menu_title="Projektmenü"
tour.project_dashboard.menu_text="A projektmenü különböző szakaszokra osztja a projektet: <strong>Adatszoba</strong> – az összes fájl és információ tárolására, <strong>Gondolkodás</strong> – a stratégiaalkotásra, ötletelésre és meghatározásra, <strong>Cselekvés</strong> – a célok, mérföldkövek és feladatok kezelésére."
tour.project_dashboard.selector_title="Projektválasztó"
tour.project_dashboard.selector_text="A projektválasztóval válthat a projektek között. A bal oldali menü mindent megmutat, ami az aktuális projekthez kapcsolódik."
tour.project_dashboard.checklist_title="Ellenőrzőlista"
tour.project_dashboard.checklist_text="A projekt-ellenőrzőlistán gyorsan áttekintheti, hogy a projekt tartalmazza-e a sikeres végrehajtáshoz szükséges összes információt."
tour.project_dashboard.status_title="Gyors állapotfrissítések"
tour.project_dashboard.status_text="Az állapotfrissítésekkel piros, sárga és zöld színek segítségével gyorsan megoszthatja csapatával a projekt előrehaladását. Az állapot az egész alkalmazásban látható lesz."
tour.project_dashboard.progress_title="Előrehaladás"
tour.project_dashboard.progress_text="A projekt előrehaladásjelzője megmutatja, mennyi munkát végzett már el. Figyelembe veszi a feladatok eltérő méretét, a csapat sebességét és a projekt mérföldköveit."
tour.project_dashboard.latest_tasks_title="Legfrissebb feladatok"
tour.project_dashboard.latest_tasks_text="A legfrissebb feladatok listája a projekthez legutóbb hozzáadott feladatokat mutatja, és a projekt beérkező feladatainak gyűjtőhelyeként is használható."
tour.project_dashboard.team_title="Csapat"
tour.project_dashboard.team_text="A csapat panel a projekt tagjait mutatja."
tour.project_dashboard.finish_text="Befejezte a projekt-irányítópult bemutatóját. Lépjen a <a href='%s/tickets/showKanban'>Teendők</a> oldalra, és ismerje meg a feladatkezelés különböző módjait a Leantime-ban."
tour.kanban_board.overview_title="Az Ön Kanban táblája"
tour.kanban_board.overview_text="Ez az Ön Kanban táblája. Segít szemléltetni a munkáját és korlátozni a folyamatban lévő munkák számát."
tour.kanban_board.workflow_title="Munkafolyamat"
tour.kanban_board.workflow_text="A feladatok előrehaladásuk során balról jobbra haladnak. A kártyák áthúzásával frissítheti az állapotukat."
tour.kanban_board.columns_title="Rugalmas oszlopok"
tour.kanban_board.columns_text="A hárompontos menüvel oszlopokat adhat hozzá, távolíthat el és nevezhet át."
tour.kanban_board.filter_title="Feladatok szűrése"
tour.kanban_board.filter_text="Feladatait különböző mezők, például prioritás, állapot, projekt vagy dátum szerint szűrheti."
tour.kanban_board.swimlanes_title="Úszósávok"
tour.kanban_board.swimlanes_text="Feladatait csoportosíthatja is, így Kanban úszósávokat hozhat létre. Ezzel csapattagok, prioritás vagy mérföldkövek szerint szemléltetheti a munkáját."
tour.kanban_board.sprints_title="Sprintek"
tour.kanban_board.sprints_text="Ha sprintekben szervezi a munkáját, az itt található legördülő menüvel kiválaszthatja, létrehozhatja és frissítheti a sprinteket."
tour.kanban_board.finish_text="Ezzel a Kanban bemutató véget ért. Lépjen a <a href='%s/tickets/roadmap'>Mérföldkövek</a> oldalra, és ismerje meg, hogyan hozhat létre és kezelhet mérföldköveket a Leantime-ban."
tour.milestones.overview_title="Mérföldkövek"
tour.milestones.overview_text="A mérföldkövek segítenek nyomon követni a fő eredményeket és a projekt fázisait."
tour.milestones.drag_title="Húzás és rendezés"
tour.milestones.drag_text="Minden sáv egy mérföldkövet jelöl. Az idővonalon húzhatja, átrendezheti és átméretezheti őket. Minden, amit ezen a képernyőn tesz, frissíti a mérföldkövek ütemezését."
tour.milestones.filter_title="Szűrés"
tour.milestones.filter_text="Szűrheti a mérföldköveket, és a hozzájuk tartozó feladatokat is megtekintheti."
tour.milestones.timeframes_title="Időkeretek"
tour.milestones.timeframes_text="Módosíthatja az idővonal nézet időkeretét, hogy az év nagyobb részét lássa, vagy napi bontásban merüljön el a részletekben."
tour.milestones.finish_text="Ezzel a mérföldkövek bemutatója véget ért. Lépjen a <a href='%s/goalcanvas/dashboard'>Célok</a> oldalra, és ismerje meg, hogyan hozhat létre és kezelhet célokat a Leantime-ban."
tour.goals.overview_title="Célok"
tour.goals.overview_text="A célok segítenek nyomon követni a projektjeire gyakorolt mérhető hatást."
tour.goals.parts_title="Célkitűzések és mutatók"
tour.goals.parts_text="Minden cél egy célkitűzésből (amit el szeretne érni) és egy mutatóból (amivel méri) áll."
tour.goals.progress_title="A cél előrehaladása"
tour.goals.progress_text="Ahogy frissíti a célok mutatóit, a folyamatjelző sáv megmutatja, hol tart."
tour.goals.milestones_title="Mérföldkövek és célok"
tour.goals.milestones_text="A célokat mérföldkövekhez kapcsolhatja, így feladatszinten követheti céljai előrehaladását. Ez segít feltárni a projektterv hiányosságait."
tour.goals.finish_text="Ezzel a célok bemutatója véget ért. A mérföldkövek, a célok és a teendők a Leantime alapvető építőkövei. Használja őket arra, hogy kezelhető részekre bontsa a munkáját. Lépjen a <a href='%s/tickets/showKanban'>Kanban táblára</a>, és tekintse át a feladatait."
