label.webhook_notifications_description="Értesítéseit a saját HTTPS-végpontjára is küldheti. A Leantime minden olyan projektértesítésnél, amelyre Ön jogosult, egy HTTP POST kérést küld JSON-törzzsel erre az URL-címre. A kérések a háttérben kerülnek elküldésre, és több percig is eltarthat, mire megérkeznek; a sikertelen kéréseket a rendszer nem küldi újra. Az Értesítések lapon megadott kategóriák és projektenkénti szintek határozzák meg, mely értesítésekre jogosult, beleértve a saját módosításait is. Az e-mail értesítések kikapcsolása nem állítja le a webhookot. A webhook csak akkor küld, ha engedélyezve van, és meg van adva URL-cím. Az URL-cím a webhook letiltása esetén is mentve marad — az eltávolításához ürítse ki az URL mezőt."
