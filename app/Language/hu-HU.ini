label.onboarding_default_project_name="Saját projekt"
text.onboarding_default_project_details="Üdvözöljük első Leantime-projektjében!<br />Ez az Ön tere a feladatok rendszerezéséhez, a célok nyomon követéséhez és a munka megtervezéséhez. Itt bármit nyugodtan módosíthat, és ahogy fejlődik, további projekteket is létrehozhat. Ez a projekt csak az Öné, hogy könnyen elkezdhesse"
label.onboarding_milestone_getting_started="Első lépések"
label.onboarding_task_community_chat="Csatlakozzon közösségi fórumunkhoz"
text.onboarding_task_community_chat="Közösségi fórumunk remek hely arra, hogy kérdéseket tegyen fel, és visszajelzést kapjon a projekt beállításáról. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Közösségi fórum</a>"
label.onboarding_task_invite_team="Hívja meg csapattársait"
text.onboarding_task_invite_team="Akár valakivel együtt dolgozik, akár csak egy társra van szüksége, aki számon kéri Önt: ha csoportként használják a Leantime-ot, könnyebb a terv szerint haladni és motiváltnak maradni <a href='%s'>Felhasználókezelés</a>"
label.onboarding_task_project_structure="Ismerje meg jobban a Leantime projektstruktúráját"
text.onboarding_task_project_structure="Súgódokumentációnkban számos további forrást talál. Ha többet szeretne megtudni a Leantime projektstruktúrájáról és a bevált gyakorlatokról, látogasson el ide: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Hozzon létre egy célt"
text.onboarding_task_create_goal="A célok a hosszú távú célkitűzések nyomon követésére és mérésére szolgálnak. Olyan mutatókkal kell mérhetőnek lenniük, amelyeket rendszeresen frissíthet. A célok és a mérföldkövek összekapcsolhatók, így a mutatók előrehaladása mellett a végrehajtás előrehaladását is láthatja <a href='%s'>Projektcélok</a>"
label.onboarding_task_create_milestone="Hozzon létre egy mérföldkövet"
text.onboarding_task_create_milestone="A mérföldkövekkel a projekt fázisait jól elkülöníthető eredményekre bonthatja. Minden mérföldkőnek van kezdő és befejező dátuma, és valamilyen eredményt kell hoznia <a href='%s'>Projektmérföldkő</a>"
label.onboarding_task_personal_project="Fedezze fel személyes projektjét"
text.onboarding_task_personal_project="Személyes projektje olyan tér, ahol rendszerezheti feladatait, céljait és munkáját. A felső projektválasztóból vagy erre a hivatkozásra kattintva érheti el: <a href='%s'>Saját projekt</a>"
label.onboarding_task_complete_profile="Leantime-profilom kitöltése"
text.onboarding_task_complete_profile="Profilkép frissítése és a munkabeállítások kitöltése a személyre szabott élményért. <a href='%s'>Saját profil</a>"
