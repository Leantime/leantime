text.who_can_access="Válassza ki, hogy ki tekintheti meg ezt a projektet. Alapértelmezés szerint a felhasználók öröklik azokat a szerepköröket, amelyekkel beállították őket. Ezeket a szerepköröket a 'Csapat' lapon módosíthatja."
text.ical_export_description="Itt létrehozhat egy egyedi naptár URL-t, amely lehetővé teszi Leantime naptárának integrálását bármely olyan alkalmazásba, amely támogatja az 'iCal' formátumot."
text.you_ical_url="Naptár URL-je lent található. <br /> Kérjük, vegye figyelembe, hogy ezzel az URL-lel bárki hozzáférhet a naptárhoz. Tartsa titokban, mint egy jelszót."
