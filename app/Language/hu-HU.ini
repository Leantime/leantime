text.lean.helper_content="A Lean Canvas végigvezeti Önt új üzleti és/vagy termékötlete érvényesítésének teljes folyamatán.<br/>Foglalkozni fog az <em>ügyfélszegmenssel</em>, a <em>problémával és a megoldással</em>.<br/>Innen továbblép az <em>egyedi értékajánlatra</em> (mitől jobb az ötlete más ajánlatoknál?), az <em>értékesítési csatornákra</em> (hogyan juttatja el a megoldását az ügyfeleihez?), a <em>bevételi forrásokra</em> (hogyan termel majd pénzt a megoldása?), a <em>költségszerkezetre</em> (mennyit ér a megoldása?), a <em>kulcsmutatókra</em> (hogyan fogja mérni a sikert?) és a <em>tisztességtelen előnyre</em> (mi segíti abban, hogy sikeres legyen a versenytársakkal szemben?)<br/>Ezek a kérdések a siker elősegítését, a kudarc kockázatának csökkentését, valamint feltételezései nyomon követését és érvényesítését szolgálják. A Lean lényege a pazarlás megszüntetése, valamint olyan termékek, vállalkozások és megoldások építése, amelyekre ügyfeleinek valóban szükségük van."
