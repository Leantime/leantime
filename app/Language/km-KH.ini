text.lean.helper_content="ផ្ទាំងក្រណាត់គ្មានខ្លាញ់នឹងនាំអ្នកឆ្លងកាត់ដំណើរការផ្ទៀងផ្ទាត់គំនិតពេញលេញនៃអាជីវកម្មថ្មី និង/ឬគំនិតផលិតផលរបស់អ្នក។<br/>អ្នកនឹងដោះស្រាយ <em>ផ្នែកអតិថិជន</em> <em>បញ្ហា ដំណោះស្រាយ</em> របស់អ្នក។.<br/>ពីទីនោះ អ្នកនឹងចូលទៅកាន់ <em>សំណើតម្លៃពិសេស</em> របស់អ្នក (តើអ្វីដែលធ្វើឱ្យគំនិតរបស់អ្នកប្រសើរជាងការផ្តល់ផ្សេងទៀត?), <em>បណ្តាញចែកចាយ</em> របស់អ្នក (តើអ្នកនឹងទទួលបានដោយរបៀបណា? ដំណោះស្រាយរបស់អ្នកចំពោះអតិថិជនរបស់អ្នក?), <em>ចំណូលស្ទ្រីម</em> របស់អ្នក (តើដំណោះស្រាយរបស់អ្នកនឹងរកលុយដោយរបៀបណា?), <em>រចនាសម្ព័ន្ធចំណាយ</em> របស់អ្នក (តើដំណោះស្រាយរបស់អ្នកមានតម្លៃប៉ុន្មាន?), <em >សូចនាករសំខាន់ៗ</em> (តើអ្នកនឹងវាស់ស្ទង់ភាពជោគជ័យដោយរបៀបណា?) និង <em>អត្ថប្រយោជន៍មិនយុត្តិធម៌</em> របស់អ្នក (តើអ្នកមានអ្វីខ្លះដែលនឹងជួយអ្នកឱ្យទទួលបានជោគជ័យប្រឆាំងនឹងការប្រកួតប្រជែង?)<br/>ការឆ្លើយសំណួរទាំងនេះគឺ រចនាឡើងដើម្បីលើកកម្ពស់ភាពជោគជ័យ កាត់បន្ថយការបរាជ័យ និងអនុញ្ញាតឱ្យអ្នកតាមដាន និងធ្វើឱ្យការសន្មត់របស់អ្នកមានសុពលភាព។ Being Lean គឺនិយាយអំពីការលុបបំបាត់កាកសំណល់ និងធ្វើការដើម្បីបង្កើតផលិតផល អាជីវកម្ម និងដំណោះស្រាយដែលអតិថិជនរបស់អ្នកត្រូវការ។"
