text.advanced_boards_helper_content="គំនិតវិវត្តន៍ រីកចម្រើន និងចាស់ទុំ។ នេះគឺជាកន្លែងដែលត្រូវតាមដានពួកគេ។<br/>ផ្លាស់ទីកាតគំនិតពីជួរឈរមួយទៅជួរបន្ទាប់ ដើម្បីឆ្លុះបញ្ចាំងពីស្ថានភាពបច្ចុប្បន្នរបស់វា។<br/>នេះជាកន្លែងដ៏ល្អដើម្បីចាប់ផ្តើមស្រាវជ្រាវ បង្កើតគំរូដើម និងធ្វើឱ្យមានសុពលភាពគំរូទាំងនេះជាមួយអតិថិជនមួយចំនួន មុនពេលអ្នកចាប់ផ្តើមអនុវត្តន៍។"
text.backlog_helper_content="Backlog គឺជាផ្ទះនៃការងារត្រូវធ្វើទាំងអស់របស់អ្នក។ អ្នកដែលអ្នកកំពុងធ្វើការនាពេលបច្ចុប្បន្ន និងគ្រោងនឹងធ្វើការលើ<br/><br/>ដើម្បីធ្វើឱ្យមានវឌ្ឍនភាពឆ្ពោះទៅរកការបំពេញកំណត់ហេតុរបស់អ្នក យើងសូមណែនាំឱ្យធ្វើការម្តងទៀតក្នុងរយៈពេលខ្លី - Sprints ។<br/>Sprints គឺជាចន្លោះពេលកំណត់ពីរសប្តាហ៍ដែលអនុញ្ញាតឱ្យអ្នកផ្តោតលើការងារតូចៗដែលអាចចែកចាយបាន។<br/>នៅចុងបញ្ចប់នៃ 2 សប្តាហ៍ អ្នកគួរតែមានអ្វីមួយដើម្បី 'ការបង្ហាញ' ។ អ្វីមួយដែលផ្តល់តម្លៃដល់អ្នកប្រើប្រាស់ ឬភ្លៀវរបស់អ្នក។<br/><br/>នៅលើអេក្រង់នេះ អ្នកនឹងអាចរៀបចំ និងគ្រប់គ្រងបញ្ជីការងារត្រូវធ្វើរបស់អ្នក កំណត់អាទិភាព backlog របស់អ្នកតាមរយៈការអូស និងទម្លាក់ ហើយផ្លាស់ទីធាតុ Backlog ទៅក្នុង Sprint បច្ចុប្បន្នរបស់អ្នក។<br/>ចង់បានព័ត៌មានបន្ថែមទេ? ចាប់ផ្តើមដំណើរកម្សាន្ត ឬជិតចាប់ផ្តើមហើយ!"
text.glad_youre_here="យើងរីករាយដែលអ្នកនៅទីនេះ។ សូម​ចំណាយ​ពេល​បន្តិច​ដើម្បី​ស្គាល់។"
text.business_research_section="ផ្នែកស្រាវជ្រាវអាជីវកម្មរបស់យើងគឺជាផ្ទះថ្មីរបស់អ្នកសម្រាប់គំនិតរបស់អ្នក។ ផ្នែកនេះត្រូវបានរចនាឡើងដើម្បីនាំអ្នកឆ្លងកាត់ជំហាននៃការអភិវឌ្ឍន៍ភ្ញៀង ការស្រាវជ្រាវបញ្ហា និងគំនិតដំណោះស្រាយ។"
text.our_roadmap_design="ផែនទីបង្ហាញផ្លូវរបស់យើងត្រូវបានរចនាឡើងដើម្បីនាំអ្នកពីចំណុចសំខាន់ៗដែលអាចគ្រប់គ្រងបានតូចៗរហូតដល់ការបញ្ចប់រូបភាពធំ។ រៀបចំផែនការសម្រាប់ព្រឹត្តិការណ៍សំខាន់ៗរយៈពេលប្រហែល 3 ខែ ហើយប្រើសញ្ញាសម្គាល់គម្រោងទាំងនេះដើម្បីបន្តគោលដៅ។"
text.this_is_where_you_spend_most_time="នេះគឺជាកន្លែងដែលអ្នកនឹងចំណាយពេលភាគច្រើនរបស់អ្នក - ធ្វើ។ រៀបចំផែនការ Sprints របស់អ្នករយៈពេល 2 សប្តាហ៍ ហើយប្រតិបត្តិដោយជោគជ័យជាមួយនឹងក្រុមប្រឹក្សាភិបាល Kanban និងឧបករណ៍ Backlog របស់យើង។ ប្រើ Retrospectives ដើម្បីរីកចម្រើនសម្រាប់ Sprint បន្ទាប់។"
text.idea_board_helper_content="នេះជាកន្លែងប្រមូលគំនិតរបស់អ្នកទាំងអស់។ ពិភាក្សាអំពីអ្នកថ្មីជាមួយក្រុមរបស់អ្នក ហើយភ្ជាប់ Milestones ដើម្បីមើលវឌ្ឍនភាពឆ្ពោះទៅរកគំនិតរបស់អ្នក។"
text.kanban_helper_content="Kanban ជាពាក្យជប៉ុនដែលមានន័យថា «កាត»។ ក្តារ Kanban ត្រូវបានចាប់ផ្តើមដោយវិស្វករ Toyota ក្នុងទសវត្សរ៍ឆ្នាំ 40 ជាមួយការផលិតបែប Lean។<br/>វាត្រូវបានប្រើដើម្បីចែករំលែកព័ត៌មាន និងវឌ្ឍនភាពការងារដោយមើលឃើញបានយ៉ាងរហ័ស។<br/>ក្តារ Kanban មានប្រយោជន៍សម្រាប់មើលឃើញការងារ និងស្ថានភាព ជួយគ្រប់គ្រងការងារសកម្ម ឬការងារកំពុងដំណើរការ គ្រប់គ្រងលំហូរការងារ និងធ្វើសកម្មភាពយ៉ាងរហ័សឆ្ពោះទៅរកការកែលម្អបែប Lean។"
text.my_timesheets_helper_content="សន្លឹកតារាងពេលគឺជាកន្លែងសម្រាប់តាមដានម៉ោងពិតប្រាកដដែលបានធ្វើការលើការងារត្រូវធ្វើ។<br/>វាមានប្រយោជន៍សម្រាប់គោលបំណងចេញវិក្កយបត្រ ប៉ុន្តែក៏ដើម្បីបញ្ជាក់ថាតើអ្នកកំពុងរៀបចំផែនការកិច្ចការរបស់អ្នកបានល្អប៉ុណ្ណាដែរ។<br/>ម៉ោងធ្វើការបន្ថែមម៉ោងអាចកែតម្រូវកាលបរិច្ឆេទកំណត់សម្រាប់គណនីសម្រាប់ភាពមិនស្របគ្នានៃផែនការ។"
text.new_project_helper_content="<p>នេះគឺជាកន្លែងដែលអ្នកនឹងពណ៌នា កំណត់ និងកំណត់ប៉ារ៉ាម៉ែត្រសម្រាប់គម្រោងរបស់អ្នក។ នេះមានសារៈសំខាន់ ដោយសារវាជាផ្នែកដែលទាក់ទងទៅក្រុម<br/>ទាំងមូល នូវអ្វីដែលគម្រោងអាទិភាព ការរំពឹងទុក និងគោលការណ៍ណែនាំ។</p><p><br/><em>អ្វីដែលត្រូវគិតនៅទីនេះ៖ 4Cs ។<br/>មានភាពច្បាស់លាស់ សង្ខេប ពេញលេញ និងគួរឱ្យជឿជាក់។<br/><br/></em></p><p>ការស្ទាត់ជំនាញរឿងទាំងនេះទៅក្នុងសេចក្ដីពណ៌នាគម្រោងរបស់អ្នក រក្សាអ្នកគ្រប់គ្នានៅលើទំព័រតែមួយ និងជួយ កាត់បន្ថយហានិភ័យនៃកំហុស ឬការដើរខុស។</p><br/>ដល់ពេលចាប់ផ្តើមហើយ!<br/><br/>"
text.not_found_helper_content="<p>យើងមិនទាន់មានខ្លឹមសារសម្រាប់ទំព័រនេះនៅឡើយទេ។<br/>សូមប្រើតំណ 'ត្រូវការជំនួយ' របស់យើងនៅខាងក្រោម ដើម្បីស្វែងយល់បន្ថែមអំពីអ្វីដែលអ្នកអាចធ្វើបាននៅទីនេះ។</p>"
text.retros_helper_content="<p>ការរំលឹកឡើងវិញគឺជាការឆ្លុះបញ្ចាំងយ៉ាងរហ័សអំពីការងារ ការបំពេញការងារជាក្រុម និងជាការពិតណាស់វឌ្ឍនភាព។<br/>នេះជាកន្លែងដែលក្រុមរបស់អ្នកអាចចំណាយពេលបន្តិចដើម្បីពិនិត្យមើលនូវអ្វីដែលដំណើរការល្អ អ្វីដែលមិនល្អ និងអ្វីដែលអាចជា បានធ្វើខុសគ្នានៅពេលក្រោយ។<br/>យើងសូមផ្តល់អនុសាសន៍ឱ្យដំណើរការការប្រជុំត្រួតពិនិត្យក្នុងចន្លោះពេលទៀងទាត់ ឬយ៉ាងហោចណាស់នៅចុងបញ្ចប់នៃ Milestone នីមួយៗ។<br/></p>"
text.roadmap_helper_content="<p>ផែនទីបង្ហាញផ្លូវមានប្រយោជន៍សម្រាប់ការពង្រីកគម្រោងធំៗទៅជាផ្នែកតូចៗ និងអាចគ្រប់គ្រងបានច្រើនជាងនេះ។<br/><br/></p><p>ដើម្បីបង្កើតផែនទីបង្ហាញផ្លូវរបស់អ្នក យើងសូមណែនាំឱ្យកំណត់ចំណុចសំខាន់ៗដែលអាចសម្រេចបានក្នុងរយៈពេល 3 ខែ។ វិសាលភាពពេលវេលា។</p><p>ចំណុចសំខាន់ៗគឺជាចំណុចត្រួតពិនិត្យនៅលើផ្លូវឆ្ពោះទៅការបញ្ចប់គម្រោង។<br/>និយាយដោយសាមញ្ញ៖ ប្រសិនបើអ្នកកំពុងធ្វើដំណើរតាមផ្លូវឆ្លងប្រទេស នោះរដ្ឋនីមួយៗដែលអ្នកឆ្លងកាត់អាចជាព្រឹត្តិការណ៍ដ៏សំខាន់មួយ។< br/><br/>ចុច 'Add Milestone' នៅផ្នែកខាងលើខាងឆ្វេងដៃ ដើម្បីចាប់ផ្តើម។ កំណត់កាលបរិច្ឆេទនៅលើផ្ទាំងនេះ ឬនៅក្នុងគំនូសតាងផែនទីបង្ហាញផ្លូវដោយខ្លួនឯងដោយចុច និងអូសចំណុចសំខាន់នៅក្នុងប្រតិទិន។</p>"
text.show_clients_helper_content="<p>អតិថិជន/ផលិតផលរៀបចំគម្រោងរបស់អ្នកទៅជាប្រភេទ និងអនុញ្ញាតឱ្យអ្នកដាច់ដោយឡែកពីក្រុមផ្សេងៗ។<br/><br/></p><p>ក្នុងនាមជាអ្នកប្រឹក្សា អ្នកធ្វើការជាមួយអតិថិជនរួចហើយ ហើយនេះជាកន្លែងសម្រាប់ រៀបចំពួកវា។</p><p>ប្រសិនបើអ្នកជាក្រុមផលិតផល អ្នកអាចប្រើផ្នែកនេះដើម្បីរៀបចំ និងញែកនាយកដ្ឋានរបស់អ្នក (ទីផ្សារ ការលក់ ប្រតិបត្តិការ។ល។)។</p>"
text.show_projects_helper_content="<p>គម្រោងគឺជាបេះដូងនៃអាជីវកម្ម និងពេលទំនេររបស់អ្នក! ការផ្លាស់ប្តូរ ការអភិវឌ្ឍន៍ គោលដៅ និងអ្វីៗដែលអ្នកអាចសាងសង់ ឬស្រមៃចង់បាននឹងពាក់ព័ន្ធនឹងគម្រោង។<br/>ការគ្រប់គ្រងគម្រោងគឺគ្រាន់តែជាដំណើរការនៃការធានាថាគម្រោងរបស់អ្នកត្រូវបានចែកចាយទាន់ពេលវេលា ត្រឹមត្រូវ និងមានតម្លៃអាជីវកម្មពិតប្រាកដ។<br/>< br/>នេះជាកន្លែងដែលគម្រោងរបស់អ្នកនឹងរស់នៅ។ ទំព័រគម្រោងរបស់អ្នកនឹងអនុញ្ញាតឱ្យអ្នកបង្កើតគម្រោង មើលឃើញយ៉ាងឆាប់រហ័សដើម្បីធ្វើលេខ ម៉ោង ថវិកា និងអតិថិជនដែលពាក់ព័ន្ធជាមួយគម្រោង។<br/><br/>ប្រើទំព័រនេះសម្រាប់ទិដ្ឋភាពទូទៅរហ័សនៃគម្រោងរបស់អ្នកទាំងអស់។<br/><br/> br/><br/></p>"
text.new_db_version="កំណែថ្មីត្រូវបានដំឡើង។ ដើម្បីប្រើ Leantime អ្នកនឹងត្រូវធ្វើបច្ចុប្បន្នភាពមូលដ្ឋានទិន្នន័យរបស់អ្នក។<br/><br/><strong>សូមប្រាកដថាបានបម្រុងទុកមូលដ្ឋានទិន្នន័យរបស់អ្នក មុនពេលអនុវត្តការអាប់ដេតនេះ!</strong><br/>វាអាចចំណាយពេលពីរបីនាទី។"
