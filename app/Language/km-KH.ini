tour.goals.finish_text="នេះជាការបញ្ចប់ការណែនាំអំពីគោលដៅ។ Milestone គោលដៅ និងការងារត្រូវធ្វើ គឺជាធាតុមូលដ្ឋាននៅក្នុង Leantime។ ប្រើវាដើម្បីបំបែកការងាររបស់អ្នកជាផ្នែកតូចៗដែលងាយស្រួលគ្រប់គ្រង។ ចូលទៅកាន់<a href='%s/tickets/showKanban'>ក្តារ Kanban</a> ដើម្បីពិនិត្យមើលកិច្ចការរបស់អ្នក។"
