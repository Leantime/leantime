support.marcel_tagline="ជនអន្តោប្រវេសន៍អាល្លឺម៉ង់ ឪពុករបស់កូនស្រីអូទីស្សឹម និងរស់នៅជាមួយ ADHD ខ្លួនឯងផងដែរ។"
support.marcel_bio_1="ឧបករណ៍គ្រប់គ្រងគម្រោងបែបប្រពៃណីមិនដែលសមនឹងខ្ញុំទេ។ ពួកវាហាក់ដូចជាត្រូវបានបង្កើតដោយចិត្តគំនិត neurotypical សម្រាប់ចិត្តគំនិត neurotypical។ នៅពេលខ្ញុំធ្វើការឯករាជ្យ ហើយពិបាករៀបចំគម្រោងអតិថិជន ខ្ញុំបានចាប់ផ្តើមកសាងអ្វីមួយដែលដំណើរការជាមួយខួរក្បាលរបស់ខ្ញុំ ជំនួសឱ្យការប្រឆាំងនឹងវា។"
support.marcel_bio_2="អ្វីដែលចាប់ផ្តើមជាដំណោះស្រាយផ្ទាល់ខ្លួន បានក្លាយជា Leantime នៅពេលខ្ញុំដឹងថាមនុស្សរាប់លាននាក់ផ្សេងទៀតត្រូវការរឿងដូចគ្នា។"
support.gloria_name="👋 ហើយខ្ញុំឈ្មោះ Gloria"
support.gloria_tagline="អតីតគិលានុបដ្ឋាយិកាផ្នែកសង្គ្រោះបន្ទាន់ ដែលក្លាយជាអ្នកគ្រប់គ្រងផលិតផល សហគ្រិនជនជាតិ Hispanic ជំនាន់ទីមួយ។"
support.gloria_bio_1="ខ្ញុំបានចំណាយពេលជាច្រើនឆ្នាំនៅក្នុងបរិយាកាសវេជ្ជសាស្ត្រដែលមានសម្ពាធខ្ពស់ ដែលការរៀបចំពិតជាជួយសង្គ្រោះជីវិត។ ប៉ុន្តែនៅពេលខ្ញុំចាប់ផ្តើមអាជីវកម្មផ្ទាល់ខ្លួន ឧបករណ៍គម្រោងបែបប្រពៃណីហាក់ដូចជាហួសហេតុ និងមិនស៊ីនឹងរបៀបដែលខ្ញុំគិត និងធ្វើការពិតប្រាកដ។"
support.gloria_bio_2="ប្រវត្តិរបស់ខ្ញុំក្នុងវិទ្យាសាស្ត្រអាកប្បកិរិយា និងការស្រាវជ្រាវលើការលើកទឹកចិត្ត ជំរុញរបៀបដែលយើងកសាងមុខងារ ដែលមិនត្រឹមតែរៀបចំកិច្ចការប៉ុណ្ណោះទេ—វាជួយឱ្យអ្នកពិតជាចង់បញ្ចប់វា។"
support.closing_text="យើងអាចបង្កើតពិភពលោកមួយដែលគ្មាននរណាម្នាក់ត្រូវតស៊ូជាមួយឧបករណ៍របស់ពួកគេ ដើម្បីធ្វើការងារដ៏អស្ចារ្យ។ ការឧបត្ថម្ភរបស់អ្នកផ្តល់មូលនិធិដល់អនាគតដែលកម្មវិធីសម្របខ្លួនទៅនឹងភាពចម្រុះរបស់មនុស្ស មិនមែនផ្ទុយមកវិញទេ។"
support.headline_ready_to_impact="ត្រៀមខ្លួនបង្កើតផលប៉ះពាល់ដោយផ្ទាល់ហើយឬនៅ?"
support.contribution_text="រាល់ការរួមចំណែក—ពី $1 ដល់ $100—ទៅដោយផ្ទាល់ដើម្បីធ្វើឱ្យ Leantime កាន់តែប្រសើរសម្រាប់មនុស្សគ្រប់គ្នា។"
