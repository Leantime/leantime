text.full_lean_canvas_helper_content="ក្តារស្រាវជ្រាវពេញលេញនឹងណែនាំអ្នកឆ្លងកាត់ដំណើរការទាំងមូលនៃការផ្ទៀងផ្ទាត់គំនិត។<br/>នៅលើទំព័រនេះ អ្នកនឹងដោះស្រាយម្តងទៀតនូវផ្នែកអតិថិជន បញ្ហា និងដំណោះស្រាយរបស់អ្នក (ប៉ុន្តែកុំបារម្ភ ប្រសិនបើអ្នកបានបំពេញវារួចហើយនៅលើក្តារសាមញ្ញ អ្នកនឹងឃើញវាម្តងទៀតនៅទីនេះ!)។<br/>ពីទីនោះ អ្នកនឹងប្តូរទៅសំណើតម្លៃច្បាស់លាស់ (តើអ្វីធ្វើឱ្យគំនិតរបស់អ្នកល្អជាងការផ្តល់ជូនផ្សេងទៀត?)<br/>ប៉ុស្តិ៍លក់ (តើអតិថិជនទទួលបានដំណោះស្រាយរបស់អ្នកដោយរបៀបណា?)<br/>ប្រភពចំណូល (តើដំណោះស្រាយរបស់អ្នករកប្រាក់បានដោយរបៀបណា?)<br/>រចនាសម្ព័ន្ធចំណាយ (តើដំណោះស្រាយរបស់អ្នកមានតម្លៃប៉ុន្មាន?) រង្វាស់សំខាន់ៗ (តើអ្នកវាស់ភាពជោគជ័យដោយរបៀបណា?)<br/>និងអត្ថប្រយោជន៍មិនយុត្តិធម៌ (តើអ្វីជួយឱ្យអ្នកលេចធ្លោជាងគូប្រកួតប្រជែង?)<br/>ការឆ្លើយសំណួរទាំងនេះត្រូវបានរចនាឡើងដើម្បីជំរុញភាពជោគជ័យ កាត់បន្ថយការបរាជ័យ និងអនុញ្ញាតឱ្យអ្នកតាមដាន និងផ្ទៀងផ្ទាត់ការសន្មត់របស់អ្នក។<br/>Lean គឺអំពីការលុបបំបាត់ការខ្ជះខ្ជាយ និងធ្វើការដើម្បីកសាងផលិតផល ហាង និងដំណោះស្រាយដែលអតិថិជនរបស់អ្នកត្រូវការ។"
