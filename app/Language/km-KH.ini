text.discord_instructions="ការរួមបញ្ចូលនេះនឹងបង្ហោះការជូនដំណឹងអំពីការអាប់ដេតទៅកាន់ប៉ុស្តិ៍ដែលអ្នកជ្រើសរើស។<br/>អនុវត្តតាមការណែនាំ <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>នៅទីនេះដើម្បីបង្កើត webhook(ច្រើន)</a>បន្ទាប់មកបិទភ្ជាប់តំណភ្ជាប់(ច្រើន)ទៅក្នុងវាលនៅខាងស្តាំ ហើយចុច រក្សាទុក។"
