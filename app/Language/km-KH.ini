text.mattermost_instructions=" ការរួមបញ្ចូលនេះនឹងបង្ហោះការជូនដំណឹងអំពីការអាប់ដេតទៅកាន់ប៉ុស្តិ៍ដែលអ្នកជ្រើសរើស។<br/>អនុវត្តតាមការណែនាំ <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>នៅទីនេះ ដើម្បីទទួលបាន URL ចូល Webhook</a> ពី Mattermost ។ បន្ទាប់​មក​បិទ​ភ្ជាប់​ទៅ​ក្នុង​សំណុំ​បែបបទ​ទៅ​ខាង​ស្ដាំ​ហើយ​ចុច​រក្សាទុក។"
text.slack_instructions="ការរួមបញ្ចូលនេះនឹងបង្ហោះការជូនដំណឹងអំពីការអាប់ដេតទៅកាន់ប៉ុស្តិ៍ដែលអ្នកជ្រើសរើស។<br/>អនុវត្តតាមការណែនាំ <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>នៅទីនេះ ដើម្បីទទួលបាន URL ចូល Webhook</a> ពី Slack ។ បន្ទាប់​មក​បិទ​ភ្ជាប់​ទៅ​ក្នុង​សំណុំ​បែបបទ​ទៅ​ខាង​ស្ដាំ​ហើយ​ចុច​រក្សាទុក។"
