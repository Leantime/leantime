text.my_work_dashboard_intro="ផ្ទាំងគ្រប់គ្រង «ការងាររបស់ខ្ញុំ» នាំយកអ្វីៗដែលសំខាន់មកផ្តោតអារម្មណ៍។<br/>ការងារសំខាន់បំផុតរបស់អ្នកឥឡូវនេះនៅខាងមុខ និងចំកណ្តាល ដែលរៀបចំសម្រាប់តែអ្នក និងតាមរបៀបដែលខួរក្បាលរបស់អ្នកដំណើរការល្អបំផុត។<br/><br/>ចាប់ពីកិច្ចការរហ័ស រហូតដល់គោលដៅធំៗ អ្វីគ្រប់យ៉ាងដែលអ្នកត្រូវការគឺនៅទីនេះ។ នេះជាកន្លែងរបស់អ្នកសម្រាប់កត់ត្រាគំនិត តាមដានវឌ្ឍនភាព និងអបអរជោគជ័យតាមផ្លូវ។"
text.blueprints_intro="ប្លង់គម្រោងជាឱកាសរបស់អ្នកដើម្បីយល់ពីទិន្នន័យទាំងអស់។ Leantime មានឧបករណ៍ និងផ្ទាំងក្រណាត់ជាច្រើនដើម្បីកំណត់ផ្ទៃខាងក្រោយគម្រោងរបស់អ្នក តាមរយៈផ្ទាំងក្រណាត់គំរូអាជីវកម្ម ការវិភាគ SWOT ឬផែនទីយល់ចិត្ត។<br/><br/>ប្រសិនបើអ្នកមិនដឹងថាត្រូវចាប់ផ្តើមពីណា យើងស្នើឱ្យអ្នកបង្កើត «ផ្ទាំងក្រណាត់តម្លៃគម្រោង»។ ផ្ទាំងក្រណាត់នេះនឹងឆ្លើយសំណួរសំខាន់បំផុតនៃគម្រោងរបស់អ្នក៖ តើអតិថិជនរបស់អ្នកជានរណា?<br/>តើអ្នកកំពុងដោះស្រាយបញ្ហាអ្វី?<br/>តើដំណោះស្រាយរបស់អ្នកជាអ្វី?<br/>តើដំណោះស្រាយរបស់អ្នកផ្តល់អត្ថប្រយោជន៍អ្វីលើសពីដៃគូប្រកួតប្រជែង<br/>"
text.goals_tour_intro="គោលដៅអនុញ្ញាតឱ្យអ្នកបំបែកគម្រោងរបស់អ្នកទៅជាផ្នែកដែលអាចសម្រេចបាន អាចវាស់វែងបាន និងអាចអនុវត្តបាន។<br/>ខណៈពេលដែល Milestone ផ្តោតលើការអនុវត្ត គោលដៅគឺអំពីរង្វាស់ដែលអ្នកចង់សម្រេច។<br/>គោលដៅនីមួយៗគួរមានគោលបំណងច្បាស់លាស់ (អ្វីដែលអ្នកចង់សម្រេច) ហើយគួរងាយស្រួលវាស់វែងដោយប្រើរង្វាស់តែមួយ។<br/><br/>នៅពេលអ្នកមានគោលដៅ អ្នកអាចកំណត់ Milestone ទៅវា ដើម្បីបំបែកវាទៅជាកិច្ចការដែលអាចអនុវត្តបាន។<br/>"
text.project_dashboard_tour_intro="គម្រោងក្នុង Leantime គឺជាកន្លែងធ្វើការរួមគ្នា ដែលអ្នក និងក្រុមរបស់អ្នករៀបចំ តាមដាន និងប្រគល់ការងារប្រកបដោយប្រសិទ្ធភាព។ គម្រោងនីមួយៗបម្រើជាកន្លែងផ្ទុកសម្រាប់គោលដៅ កិច្ចការ Milestone ដែលពាក់ព័ន្ធ និងអនុញ្ញាតឱ្យអ្នកតាមដានវឌ្ឍនភាពនៅកន្លែងកណ្តាលតែមួយ។<br/><br/>មិនថាអ្នកកំពុងគ្រប់គ្រងការងារ សាលារៀន ឬគំនិតផ្តួចផ្តើមផ្ទាល់ខ្លួនផ្ទៃក្នុងទេ គម្រោង Leantime ផ្តល់នូវរចនាសម្ព័ន្ធ និងឧបករណ៍ដែលត្រូវការ ដើម្បីបំប្លែងគំនិតទៅជាលទ្ធផលជោគជ័យ។"
text.wiki_tour_intro="ឯកសាររបស់យើងអនុញ្ញាតឱ្យអ្នកសរសេរ និងចែករំលែកឯកសារជាមួយក្រុមរបស់អ្នក។ អ្នកអាចបង្កើតកន្លែងច្រើនដើម្បីរៀបចំឯកសាររបស់អ្នកតាមក្រុម តំបន់ ឬប្រភេទឯកសារ។<br/>បង្កើតឯកសារដើម្បីចែករំលែកចំណេះដឹង ដំណើរការ និងនីតិវិធី។ អ្នកក៏អាចបង្កើតឯកសារដើម្បីចែករំលែកតំណទៅកាន់ឯកសារ ឬថតមួយនៅក្នុងកន្លែងផ្ទុកលើពពករបស់អ្នក។<br/>"
text.extend_leantime_latest_plugins="ពង្រីក Leantime ដោយប្រើកម្មវិធីជំនួយចុងក្រោយរបស់យើង។"
support.headline_help_us_build="ជួយយើងកសាងអនាគតដែលគ្រប់ចិត្តគំនិតទាំងអស់អាចរីកចម្រើន!"
support.intro_text_1="ឧបករណ៍ផលិតភាពភាគច្រើនសន្មតថាមនុស្សគ្រប់គ្នាគិតដូចគ្នា៖ តាមលំដាប់លំដោយ ជាមួយការផ្តោតអារម្មណ៍ឥតខ្ចោះ ដោយមានការលើកទឹកចិត្តពីកាលកំណត់តាមអំពើចិត្ត។ មិនថាអ្នកមាន ADHD និងត្រូវការ dopamine ពីកិច្ចការដែលបានបញ្ចប់ ជាមនុស្សអូទីស្សឹម និងចង់បានរចនាសម្ព័ន្ធស្ថិរភាព មាន dyslexia និងគិតតាមលំហ ឬអ្នកគ្រាន់តែធុញទ្រាន់នឹងឧបករណ៍ដែលមិនស៊ីនឹងរបៀបដែលខួរក្បាលរបស់អ្នកដំណើរការពិតប្រាកដ—អ្នកប្រហែលជាបានបោះបង់ការគ្រប់គ្រងគម្រោងទាំងស្រុងហើយ។"
support.intro_text_2="យើងកំពុងកសាង Leantime សម្រាប់ចិត្តគំនិតដែលដំណើរការខុសពីគេ។ នោះរួមបញ្ចូលទាំងខួរក្បាល neurodivergent ប៉ុន្តែក៏សម្រាប់អ្នកណាម្នាក់ដែលធ្លាប់មានអារម្មណ៍ថាឧបករណ៍ដែលមានស្រាប់ប្រឆាំងនឹងគំរូនៃការគិតធម្មជាតិរបស់ពួកគេ។"
