label.webhook_notifications_description="ផ្ញើការជូនដំណឹងរបស់អ្នកទៅកាន់ HTTPS endpoint ផ្ទាល់ខ្លួនរបស់អ្នក។ សម្រាប់រាល់ការជូនដំណឹងគម្រោងដែលអ្នកមានសិទ្ធិទទួល Leantime ផ្ញើសំណើ HTTP POST មួយដែលមានតួ JSON ទៅកាន់ URL នេះ។ សំណើត្រូវបានផ្ញើនៅផ្ទៃខាងក្រោយ ហើយអាចចំណាយពេលច្រើននាទីដើម្បីមកដល់។ សំណើដែលបរាជ័យនឹងមិនត្រូវបានព្យាយាមម្តងទៀតទេ។ ប្រភេទ និងកម្រិតតាមគម្រោងនៅក្នុងផ្ទាំង ការជូនដំណឹងច្រើន សម្រេចថាការជូនដំណឹងណាខ្លះមានសិទ្ធិ រួមទាំងការផ្លាស់ប្តូរដែលអ្នកធ្វើដោយខ្លួនឯង។ ការបិទការជូនដំណឹងតាមអ៊ីមែលមិនបញ្ឈប់ webhook ទេ។ Webhook ផ្ញើតែនៅពេលវាត្រូវបានបើក ហើយមាន URL កំណត់ប៉ុណ្ណោះ។ URL របស់អ្នកនៅតែរក្សាទុកពេល webhook ត្រូវបានបិទ — សម្អាត URL ដើម្បីដកវាចេញ។"
