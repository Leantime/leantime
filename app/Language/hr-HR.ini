support.marcel_name="👋 Ja sam Marcel"
support.marcel_tagline="Njemački imigrant, otac autistične kćeri, a i sam živim s ADHD-om."
support.marcel_bio_1="Tradicionalni alati za upravljanje projektima nikad mi nisu odgovarali. Činilo mi se kao da su ih izgradili neurotipični umovi za neurotipične umove. Dok sam radio kao freelancer i mučio se održati klijentske projekte organiziranima, počeo sam graditi nešto što radi s mojim mozgom, a ne protiv njega."
support.marcel_bio_2="Ono što je počelo kao osobno rješenje postalo je Leantime kada sam shvatio da milijunima drugih treba isto."
support.gloria_name="👋 A ja sam Gloria"
support.gloria_tagline="Bivša medicinska sestra na hitnoj koja je postala voditeljica proizvoda, hispanoamerička poduzetnica prve generacije."
support.gloria_bio_1="Godinama sam radila u zahtjevnim medicinskim okruženjima u kojima organizacija doslovno spašava živote. No kada sam pokrenula vlastiti posao, tradicionalni alati za projekte djelovali su mi preopterećujuće i nepovezano s načinom na koji zapravo razmišljam i radim."
support.gloria_bio_2="Moje iskustvo u bihevioralnoj znanosti i istraživanju motivacije usmjerava način na koji gradimo značajke koje ne samo da organiziraju zadatke — nego vam pomažu da ih zaista poželite dovršiti."
support.closing_text="Možemo stvoriti svijet u kojem se nitko ne mora boriti sa svojim alatima kako bi obavio izvrstan posao. Vaše sponzorstvo financira budućnost u kojoj se softver prilagođava ljudskoj raznolikosti, a ne obrnuto."
