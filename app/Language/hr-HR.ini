text.full_lean_canvas_helper_content="Cjelovita istraživačka ploča vodit će vas kroz cijeli postupak potvrđivanja ideje.<br/>Na ovoj ćete stranici ponovno obraditi svoj segment kupaca, problem i rješenje (ali bez brige – ako ste to već ispunili na jednostavnoj ploči, ovdje ćete to ponovno vidjeti!).<br/>Zatim prelazite na jasnu vrijednosnu ponudu (po čemu je vaša ideja bolja od drugih ponuda?),<br/>prodajne kanale (kako kupci dolaze do vašeg rješenja?)<br/>tokove prihoda (kako vaše rješenje zarađuje?)<br/>strukturu troškova (koliko vrijedi vaše rješenje?) i ključne metrike (kako mjerite uspjeh?)<br/>te nepravednu prednost (što vas izdvaja od konkurencije?)<br/>Odgovori na ova pitanja trebaju potaknuti uspjeh, ublažiti neuspjehe i omogućiti vam praćenje i provjeru pretpostavki.<br/>Lean znači uklanjanje rasipanja i rad na izgradnji proizvoda, trgovina i rješenja koja su vašim kupcima potrebna."
