text.insights.helper_content="Ploča <em>Promatranje / Učenje - Uvidi</em> pomaže vam prikupiti i strukturirati uvide iz četiri različita izvora (etnografska promatranja, intervjui, fokus grupe i sekundarno istraživanje) te ih pretvoriti u znanje.<br/>Podržava faze promatranja i učenja, koje se ponekad nazivaju empatija i definiranje, u procesu Design Thinkinga.<br/>Predlažemo da ploču <em>Promatranje / Učenje - Uvidi</em> koristite svaki put kada prikupljate i analizirate nove uvide, bilo za analizu rizika, analizu okruženja, otkrivanje trendova u industriji ili za dizajn novih proizvoda i usluga, da navedemo samo neke primjere."
