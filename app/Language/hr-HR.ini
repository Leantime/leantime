label.onboarding_default_project_name="Moj projekt"
text.onboarding_default_project_details="Dobro došli u svoj prvi projekt u Leantimeu!<br />Ovo je vaš prostor za organiziranje zadataka, praćenje ciljeva i planiranje rada. Slobodno ovdje bilo što izmijenite ili izradite dodatne projekte kako budete rasli. Ovaj projekt služi vam samo za početak"
label.onboarding_milestone_getting_started="Prvi koraci"
label.onboarding_task_community_chat="Pridružite se našem chatu zajednice"
text.onboarding_task_community_chat="Naš chat zajednice izvrstan je izvor za postavljanje pitanja i dobivanje povratnih informacija o postavljanju projekta. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat zajednice</a>"
label.onboarding_task_invite_team="Pozovite članove svojeg tima"
text.onboarding_task_invite_team="Bilo da s nekim surađujete ili vam samo treba netko tko će vas držati odgovornima, korištenje Leantimea u grupi pomaže vam da ostanete na pravom putu i motivirani <a href='%s'>Upravljanje korisnicima</a>"
label.onboarding_task_project_structure="Saznajte više o strukturi projekata u Leantimeu"
text.onboarding_task_project_structure="U našoj dokumentaciji za pomoć imamo mnogo dodatnih resursa. Kako biste saznali više o strukturi projekata u Leantimeu i najboljim praksama, posjetite: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Izradite cilj"
text.onboarding_task_create_goal="Pomoću ciljeva pratite i mjerite ono što želite postići dugoročno. Trebali bi biti mjerljivi pomoću metrika koje možete redovito ažurirati. Ciljeve i prekretnice možete povezati kako biste uz napredak metrika vidjeli i napredak izvedbe <a href='%s'>Ciljevi projekta</a>"
label.onboarding_task_create_milestone="Izradite prekretnicu"
text.onboarding_task_create_milestone="Prekretnice vam omogućuju da faze svojih projekata razvrstate u zasebne ishode. Svaka prekretnica ima datum početka i završetka te bi trebala donijeti neki rezultat <a href='%s'>Prekretnice projekta</a>"
label.onboarding_task_personal_project="Istražite svoj osobni projekt"
text.onboarding_task_personal_project="Vaš osobni projekt prostor je u kojem možete organizirati svoje zadatke, ciljeve i rad. Možete mu pristupiti putem izbornika projekata na vrhu ili klikom na ovu poveznicu: <a href='%s'>Moj projekt</a>"
label.onboarding_task_complete_profile="Dovršite svoj profil u Leantimeu"
text.onboarding_task_complete_profile="Ažurirajte profilnu sliku i dovršite radne postavke kako biste prilagodili svoje iskustvo. <a href='%s'>Moj profil</a>"
