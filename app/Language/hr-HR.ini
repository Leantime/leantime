text.timer_on_todo="<span class='head-icon fa fa-stop'></span> %1$s Mjerač vremena na %2$s"
text.these_are_system_wide_settings="Ovo su postavke na razini cijelog sustava koje utječu na izgled i doživljaj vašeg Leantimea."
text.company_name_helper="Prikazuje se u naslovu stranice i u e-porukama"
text.advanced_boards_helper_content="Ideje se razvijaju, rastu i sazrijevaju. Ovo je mjesto na kojem ih pratite.<br/>Premještajte kartice ideja iz jednog stupca u sljedeći kako bi odražavale njihovo trenutačno stanje.<br/>Ovo je dobro mjesto za početak istraživanja, razvoj prototipova i njihovu provjeru s nekoliko kupaca prije nego što počnete s implementacijom."
text.backlog_helper_content="Backlog je dom svih vaših zadataka – onih na kojima trenutačno radite i onih na kojima planirate raditi.<br/><br/>Kako biste napredovali u dovršavanju Backloga, preporučujemo rad u kratkim iteracijama – sprintovima.<br/>Sprintovi su dvotjedni vremenski intervali koji vam omogućuju da se usredotočite na manje dijelove posla koji se mogu isporučiti.<br/>Na kraju dva tjedna trebali biste imati nešto za 'demo'. Nešto što donosi vrijednost vašim korisnicima ili klijentima.<br/><br/>Na ovom zaslonu možete organizirati svoj popis zadataka i upravljati njime, odrediti prioritete u Backlogu povlačenjem i ispuštanjem te premještati stavke iz Backloga u trenutačni sprint.<br/>Želite više informacija? Pokrenite obilazak ili zatvorite prozor i započnite!"
text.glad_youre_here="Drago nam je što ste ovdje. Odvojimo minutu da se upoznamo."
text.business_research_section="Naš odjeljak Poslovno istraživanje novi je dom vaših ideja. Osmišljen je da vas provede kroz korake razvoja kupaca, istraživanja problema i osmišljavanja rješenja."
text.our_roadmap_design="Naš plan razvoja osmišljen je da vas od manjih, ostvarivih prekretnica dovede do dovršetka cjelokupne slike. Planirajte prekretnice u trajanju od oko 3 mjeseca i koristite te oznake projekta kako biste ostali na pravom putu."
text.this_is_where_you_spend_most_time="Ovdje ćete provoditi većinu vremena – radeći. Planirajte svoje dvotjedne sprintove i uspješno ih izvršite uz Kanban ploču i naše alate za Backlog. Koristite retrospektive kako biste napredovali u sljedećem sprintu."
text.idea_board_helper_content="Ovo je mjesto za prikupljanje svih vaših ideja. Raspravljajte o novima sa svojim timom i povežite prekretnice kako biste vidjeli napredak svojih ideja."
text.kanban_helper_content="Kanban je japanska riječ za 'karticu'. Kanban ploče uveli su Toyotini inženjeri 40-ih godina u sklopu vitke (lean) proizvodnje.<br/>Koriste se za brzo vizualno dijeljenje informacija i napretka rada.<br/>Kanban ploče korisne su za vizualizaciju rada i statusa, za upravljanje aktivnim poslom ili poslom u tijeku, za upravljanje tijekom rada i za brzo djelovanje prema lean poboljšanjima."
text.my_timesheets_helper_content="Evidencije vremena mjesto su za bilježenje stvarnih sati rada na zadatku.<br/>To je korisno za naplatu, ali i za provjeru koliko dobro unaprijed planirate svoje zadatke.<br/>S vremenom Leantime može prilagoditi rokove kako bi uzeo u obzir odstupanja u planiranju."
text.new_project_helper_content="<p>Ovo je mjesto na kojem ćete opisati i definirati svoj projekt te postaviti njegove parametre. To je važno jer upravo ovaj dio cijelom<br/>timu prenosi koji su prioriteti, očekivanja i smjernice projekta.</p><p><br/><em>O čemu ovdje razmisliti: 4C.<br/>Budite jasni, sažeti, cjeloviti i vjerodostojni.<br/><br/></em></p><p>Kada to savladate u opisima projekata, svi su na istoj stranici, a rizik od pogrešaka i propusta je manji.</p><br/>Vrijeme je za početak!<br/><br/>"
text.not_found_helper_content="<p>Za ovu stranicu još nemamo sadržaja.<br/>Upotrijebite poveznicu 'Trebate pomoć' pri dnu kako biste saznali više o tome što ovdje možete raditi.</p>"
text.retros_helper_content="<p>Retrospektive su kratka razmišljanja o radu, funkcioniranju tima i, naravno, napretku.<br/>Ovdje vaš tim može odvojiti trenutak i usredotočiti se na to što je dobro prošlo, što nije i što bi se sljedeći put moglo učiniti drukčije.<br/>Preporučujemo održavanje sastanka pregleda u redovitim intervalima ili barem na kraju svake prekretnice.<br/></p>"
text.roadmap_helper_content="<p>Planovi razvoja korisni su za razlaganje velikih projekata na manje dijelove kojima je lakše upravljati.<br/><br/></p><p>Za izradu plana razvoja preporučujemo postavljanje prekretnica koje se mogu ostvariti u razdoblju od 3 mjeseca.</p><p>Prekretnice su kontrolne točke na putu do dovršetka projekta.<br/>Jednostavno rečeno: ako putujete automobilom preko cijele zemlje, svaka regija kroz koju prolazite mogla bi biti prekretnica.<br/><br/>Za početak kliknite 'Dodaj prekretnicu' u gornjem lijevom kutu. Datum postavite na ovoj kartici ili izravno na grafikonu plana razvoja tako da kliknete i povučete prekretnicu unutar kalendara.</p>"
text.show_clients_helper_content="<p>Klijenti/Proizvodi razvrstavaju vaše projekte u kategorije i omogućuju vam odvajanje različitih grupa.<br/><br/></p><p>Kao konzultant već radite s klijentima i ovo bi bilo mjesto za njihovo organiziranje.</p><p>Ako ste produktni tim, ovaj odjeljak možete koristiti za organiziranje i odvajanje svojih odjela (marketing, prodaja, operacije itd.).</p>"
text.show_projects_helper_content="<p>Projekti su srce vašeg poslovanja i Leantimea! Promjene, razvoj, ciljevi i sve što možete izgraditi ili zamisliti uključuje projekte.<br/>Upravljanje projektima jednostavno je postupak kojim osiguravate da se vaši projekti isporuče na vrijeme, ispravno i sa stvarnom poslovnom vrijednošću.<br/><br/>Ovdje će se nalaziti vaši projekti. Na stranici projekata možete stvoriti projekt i brzo vidjeti broj zadataka, sate, iznos proračuna i klijenta povezanog s projektom.<br/><br/>Koristite ovu stranicu za brzi pregled svih svojih projekata.<br/><br/></p>"
text.new_db_version="Instalirana je nova verzija. Da biste koristili Leantime, morate ažurirati bazu podataka.<br/><br/><strong>Prije ovog ažuriranja obavezno napravite sigurnosnu kopiju baze podataka!</strong><br/>Ovo može potrajati nekoliko minuta."
text.update_was_successful="Ažuriranje je uspjelo i sada se možete prijaviti. <a href='%1$s'>Idi na prijavu</a>"
text.this_script_will_set_up_leantime="Ova skripta postavit će vašu bazu podataka i stvoriti administratorski račun"
