text.lean.helper_content="Lean Canvas provest će vas kroz cijeli postupak validacije vaše nove poslovne ideje i/ili ideje za proizvod.<br/>Obradit ćete svoj <em>segment kupaca</em> te <em>problem i rješenje</em>.<br/>Zatim ćete prijeći na svoju <em>jedinstvenu ponudu vrijednosti</em> (po čemu je vaša ideja bolja od drugih ponuda?), <em>kanale distribucije</em> (kako ćete svoje rješenje dostaviti kupcima?), <em>tokove prihoda</em> (kako će vaše rješenje zarađivati?), <em>strukturu troškova</em> (koliko vrijedi vaše rješenje?), <em>ključne metrike</em> (kako ćete mjeriti uspjeh?) i svoju <em>nepoštenu prednost</em> (što imate, a što će vam pomoći da nadmašite konkurenciju?)<br/>Odgovori na ova pitanja potiču uspjeh, smanjuju rizik neuspjeha i omogućuju vam da pratite i validirate svoje pretpostavke. Biti lean znači uklanjati gubitke i raditi na izgradnji proizvoda, poslovanja i rješenja koja su vašim kupcima potrebna."
