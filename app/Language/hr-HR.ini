tour.my_work.welcome_title="Dobro došli u obilazak nadzorne ploče"
tour.my_work.welcome_text="Za početak nekoliko osnova kako biste se brzo snašli u navigaciji i različitim elementima Leantimea."
tour.my_work.work_modes_title="Načini rada"
tour.my_work.work_modes_text="Gornja navigacija prikazuje „način rada“ u kojem se trenutačno nalazite. Možete biti unutar projekta, u svojem osobnom radnom prostoru ili u načinu rada tvrtke."
tour.my_work.left_nav_text="Lijeva navigacija razrađuje trenutačni način rada i omogućuje vam pristup različitim područjima. Sve što je ovdje prikazano dio je gore odabranog načina rada."
tour.my_work.profile_bar_title="Moja traka profila"
tour.my_work.profile_bar_text="Ovdje ćete pronaći poveznice na svoj račun te obavijesti i najnovije vijesti o Leantimeu."
tour.my_work.widgets_title="Widgeti vaše nadzorne ploče"
tour.my_work.widgets_text="Vaša je nadzorna ploča podijeljena na različite widgete koji vam prikazuju ciljane informacije o vašem radu."
tour.my_work.customize_title="Prilagodite svoju nadzornu ploču"
tour.my_work.customize_text="Widgetima možete mijenjati veličinu i premještati ih povlačenjem i ispuštanjem."
tour.my_work.todos_title="Moji zadaci"
tour.my_work.todos_text="Widget Moji zadaci prikazuje sve zadatke koji su vam trenutačno dodijeljeni."
tour.my_work.group_todos_title="Grupiranje zadataka"
tour.my_work.group_todos_text="Ovdje pomoću padajućih izbornika možete filtrirati zadatke po projektu ili ih grupirati po prioritetu, statusu, projektu ili datumima."
tour.my_work.sort_todos_title="Razvrstavanje zadataka"
tour.my_work.sort_todos_text="Svaki zadatak možete povući i ispustiti kako biste promijenili njegov redoslijed. Zadatak možete povući i ispustiti i u kalendar kako biste ga zakazali."
tour.my_work.timer_title="Pokrenite mjerač vremena"
tour.my_work.timer_text="Kada budete spremni početi raditi na zadatku, samo kliknite gumb za pokretanje mjerača vremena."
tour.my_work.complete_task_title="Dovršite zadatak"
tour.my_work.complete_task_text="Kada je zadatak dovršen, možete ga označiti kao gotov klikom na padajući izbornik statusa."
tour.my_work.add_tasks_title="Dodajte još zadataka"
tour.my_work.add_tasks_text="Još zadataka možete dodati klikom na gumb plus u svakom odjeljku ili putem izbornika s tri točke pokraj svakog zadatka."
tour.my_work.finish_text="Završili ste obilazak nadzorne ploče Moj rad. Idite na <a href='%s/dashboard/show'>svoj projekt</a> kako biste saznali više o upravljanju projektima u Leantimeu."
tour.project_dashboard.menu_title="Izbornik projekta"
tour.project_dashboard.menu_text="Izbornik projekta organizira vaš projekt u različite odjeljke: <strong>Podatkovna soba</strong> – za smještaj svih vaših datoteka i informacija, <strong>Promišljanje</strong> – za strateško planiranje, osmišljavanje ideja i definiranje, <strong>Izvedba</strong> – za upravljanje ciljevima, prekretnicama i zadacima."
tour.project_dashboard.selector_title="Izbornik projekata"
tour.project_dashboard.selector_text="Pomoću izbornika projekata prelazite s jednog projekta na drugi. Lijevi izbornik prikazuje sve što je povezano s vašim trenutačnim projektom."
tour.project_dashboard.checklist_title="Kontrolni popis"
tour.project_dashboard.checklist_text="Kontrolni popis projekta brzi je podsjetnik koji pokazuje sadrži li vaš projekt sve informacije potrebne za uspješnu izvedbu."
tour.project_dashboard.status_title="Brza ažuriranja stanja"
tour.project_dashboard.status_text="Ažuriranjima stanja možete brzo podijeliti napredak projekta sa svojim timom pomoću crvene, žute i zelene boje. Stanje će biti vidljivo u cijeloj aplikaciji."
tour.project_dashboard.progress_title="Napredak"
tour.project_dashboard.progress_text="Pokazatelj napretka projekta pokazuje koliko ste posla dovršili. Uzima u obzir različite veličine zadataka, brzinu tima i prekretnice projekta."
tour.project_dashboard.latest_tasks_title="Najnoviji zadaci"
tour.project_dashboard.latest_tasks_text="Popis najnovijih zadataka prikazuje zadatke koji su posljednji dodani u vaš projekt i može služiti kao ulazni sandučić projekta."
tour.project_dashboard.team_title="Tim"
tour.project_dashboard.team_text="Okvir tima prikazuje članove ovog projekta."
tour.project_dashboard.finish_text="Završili ste obilazak nadzorne ploče projekta. Otvorite odjeljak <a href='%s/tickets/showKanban'>Zadaci</a> kako biste saznali više o različitim načinima upravljanja zadacima u Leantimeu."
tour.kanban_board.overview_title="Vaša Kanban ploča"
tour.kanban_board.overview_text="Ovo je vaša Kanban ploča. Pomaže vam vizualizirati rad i ograničiti količinu posla u tijeku."
tour.kanban_board.workflow_title="Tijek rada"
tour.kanban_board.workflow_text="Zadaci se kreću slijeva nadesno kako napreduju. Povucite i ispustite kartice kako biste ažurirali njihov status."
tour.kanban_board.columns_title="Prilagodljivi stupci"
tour.kanban_board.columns_text="Putem izbornika s tri točke možete dodavati, uklanjati i preimenovati stupce."
tour.kanban_board.filter_title="Filtriranje zadataka"
tour.kanban_board.filter_text="Zadatke možete filtrirati po raznim poljima kao što su prioritet, status, projekt ili datumi."
tour.kanban_board.swimlanes_title="Plivačke staze"
tour.kanban_board.swimlanes_text="Osim toga, zadatke možete grupirati kako biste izradili Kanban plivačke staze. Tako možete vizualizirati rad po članovima tima, prioritetu ili prekretnicama."
tour.kanban_board.sprints_title="Sprintovi"
tour.kanban_board.sprints_text="Ako svoj rad organizirate u sprintovima, ovdje pomoću padajućeg izbornika možete odabrati, izraditi i ažurirati sprintove."
tour.kanban_board.finish_text="Ovim je obilazak Kanban ploče završen. Otvorite odjeljak <a href='%s/tickets/roadmap'>Prekretnice</a> kako biste saznali kako izrađivati prekretnice i upravljati njima u Leantimeu."
tour.milestones.overview_title="Prekretnice"
tour.milestones.overview_text="Prekretnice vam pomažu pratiti glavne ishode i faze projekta."
tour.milestones.drag_title="Povlačenje i razvrstavanje"
tour.milestones.drag_text="Svaka traka predstavlja jednu prekretnicu. Možete ih povlačiti duž vremenske crte te im mijenjati redoslijed i veličinu. Sve što radite na ovom zaslonu ažurira vremenski raspored vaših prekretnica."
tour.milestones.filter_title="Filtar"
tour.milestones.filter_text="Prekretnice možete filtrirati, a možete i pregledati zadatke koji su njihov dio."
tour.milestones.timeframes_title="Vremenski okviri"
tour.milestones.timeframes_text="Možete promijeniti vremenski okvir prikaza vremenske crte kako biste vidjeli veći dio godine ili detaljno pregledali raspored po danima."
tour.milestones.finish_text="Ovim je obilazak prekretnica završen. Otvorite odjeljak <a href='%s/goalcanvas/dashboard'>Ciljevi</a> kako biste saznali kako izrađivati ciljeve i upravljati njima u Leantimeu."
tour.goals.overview_title="Ciljevi"
tour.goals.overview_text="Ciljevi vam pomažu pratiti mjerljiv učinak na vašim projektima."
tour.goals.parts_title="Svrha i metrike"
tour.goals.parts_text="Svaki se cilj sastoji od svrhe (onoga što želite postići) i metrike (načina na koji ćete to mjeriti)."
tour.goals.progress_title="Napredak cilja"
tour.goals.progress_text="Dok ažurirate metrike ciljeva, traka napretka pokazivat će koliko ste daleko stigli."
tour.goals.milestones_title="Prekretnice i ciljevi"
tour.goals.milestones_text="Ciljeve možete povezati s prekretnicama kako biste pratili napredak svojih ciljeva na razini zadataka. To pomaže uočiti nedostatke u planu projekta."
tour.goals.finish_text="Ovim je obilazak ciljeva završen. Prekretnice, ciljevi i zadaci osnovni su gradivni elementi Leantimea. Pomoću njih razložite svoj rad na dijelove kojima je lako upravljati. Otvorite <a href='%s/tickets/showKanban'>Kanban ploču</a> kako biste pregledali svoje zadatke."
