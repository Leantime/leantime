text.mattermost_instructions=" Ova integracija objavljuje obavijesti o ažuriranjima na kanalu po vašem izboru.<br/>Slijedite upute <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>ovdje kako biste dobili URL dolaznog webhooka</a> iz Mattermosta. Zatim zalijepite poveznicu u obrazac s desne strane i kliknite Spremi."
text.slack_instructions="Ova integracija objavljuje obavijesti o ažuriranjima na kanalu po vašem izboru.<br/>Slijedite upute <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>ovdje kako biste dobili URL dolaznog webhooka</a> iz Slacka. Zatim zalijepite poveznicu u obrazac s desne strane i kliknite Spremi."
text.choose_access_for_users="Označite ili poništite oznaku korisnika koje želite dodati/ukloniti. Više o ulogama možete saznati na <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Očekivani završetak do"
text.zulip_instructions="Ova integracija objavljuje obavijesti o ažuriranjima u streamu i temi po vašem izboru.<br/>Slijedite upute <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>ovdje kako biste stvorili novog bota</a>. Zatim zalijepite podatke u obrazac s desne strane i kliknite Spremi."
text.discord_instructions="Ova integracija objavljuje obavijesti o ažuriranjima na kanalu po vašem izboru.<br/>Slijedite upute <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>ovdje kako biste stvorili nove webhookove</a>, zatim zalijepite poveznice u polja s desne strane i kliknite Spremi."
