text.my_work_dashboard_intro="Vaša nadzorna ploča Moj rad stavlja u fokus sve što je važno.<br/>Vaš najvažniji rad sada je u prvom planu, organiziran baš za vas i za način na koji vaš mozak najbolje radi.<br/><br/>Od brzih zadataka do ambicioznih ciljeva, sve što vam treba nalazi se upravo ovdje. Ovo je vaš prostor za bilježenje ideja, praćenje napretka i slavljenje uspjeha na tom putu."
text.blueprints_intro="Nacrti su vaša prilika da podacima date smisao. Leantime nudi niz alata i platna za definiranje pozadine projekta pomoću platna poslovnog modela (Business Model Canvas), SWOT analize ili mapa empatije.<br/><br/>Ako ne znate odakle početi, predlažemo da izradite 'Project Value Canvas'. To platno odgovara na najvažnija pitanja vašeg projekta: Tko je vaš kupac?<br/>Koji problem rješavate?<br/>Koje je vaše rješenje?<br/>Koju prednost vaše rješenje nudi u odnosu na konkurenciju?<br/>"
text.goals_tour_intro="Ciljevi vam omogućuju da projekt razložite na ostvarive, mjerljive i provedive dijelove.<br/>Dok su prekretnice usmjerene na izvršenje, ciljevi se odnose na metrike koje želite postići.<br/>Svaki cilj treba imati jasnu svrhu (ono što želite postići) i trebao bi biti lako mjerljiv pomoću jedne metrike.<br/><br/>Kada imate cilj, možete mu dodijeliti prekretnice kako biste ga razložili na izvršive zadatke.<br/>"
text.project_dashboard_tour_intro="Projekti u Leantimeu suradnički su radni prostori u kojima vi i vaš tim učinkovito organizirate, pratite i isporučujete rad. Svaki projekt služi kao spremnik za povezane ciljeve, zadatke i prekretnice te vam omogućuje praćenje napretka na jednom središnjem mjestu.<br/><br/>Bilo da upravljate poslom, školskim obvezama ili internim i osobnim inicijativama, projekti u Leantimeu pružaju strukturu i alate potrebne da ideje pretvorite u uspješne ishode."
text.wiki_tour_intro="Naši dokumenti omogućuju vam pisanje i dijeljenje dokumentacije s timom. Možete stvoriti više prostora kako biste dokumentaciju organizirali po timovima, područjima ili kategorijama dokumenata.<br/>Stvarajte dokumente za dijeljenje znanja, procesa i postupaka. Možete stvoriti i dokument koji dijeli poveznicu na datoteku ili mapu u vašoj pohrani u oblaku.<br/>"
text.extend_leantime_latest_plugins="Proširite Leantime našim najnovijim dodacima."
support.headline_help_us_build="Pomozite nam izgraditi budućnost u kojoj svi umovi napreduju!"
support.intro_text_1="Većina alata za produktivnost pretpostavlja da svi razmišljaju na isti način: linearno, uz savršenu usredotočenost i motivirani proizvoljnim rokovima. Bilo da imate ADHD i trebate dozu dopamina od dovršenih zadataka, autistični ste i žudite za dosljednom strukturom, imate disleksiju i razmišljate prostorno ili vam je jednostavno dosta alata koji ne odgovaraju načinu na koji vaš mozak zapravo radi — vjerojatno ste potpuno odustali od upravljanja projektima."
support.intro_text_2="Leantime gradimo za umove koji rade drukčije. To uključuje neurodivergentne mozgove, ali i svakoga tko je ikada osjetio da se postojeći alati bore protiv njegovih prirodnih obrazaca razmišljanja."
