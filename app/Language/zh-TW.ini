text.my_work_dashboard_intro="「我的工作」儀表板讓所有重要的事情一目了然。<br/>您最重要的工作現在就擺在眼前，依照您的需求和您大腦最佳的運作方式來整理。<br/><br/>從簡單的任務到遠大的目標，您需要的一切都在這裡。這是您記錄想法、追蹤進度，並一路慶祝成果的空間。"
text.blueprints_intro="藍圖讓您有機會理解所有的資料。Leantime 提供多種工具和畫布，可透過商業模式畫布、SWOT 分析或同理心地圖來定義專案背景。<br/><br/>如果您不知道從何開始，我們建議您建立一個「專案價值畫布」。這個畫布將回答您專案最重要的問題：您的客戶是誰？<br/>您要解決什麼問題？<br/>您的解決方案是什麼？<br/>相較於競爭對手，您的解決方案能提供什麼好處？<br/>"
text.goals_tour_intro="目標讓您可以將專案拆解成可達成、可衡量且可執行的部分。<br/>里程碑著重於執行，而目標則著重於您想達成的指標。<br/>每個目標都應有明確的目的（您想達成的事情），並且應該能透過單一指標輕鬆衡量。<br/><br/>有了目標之後，您可以為其分配里程碑，將其拆解成可執行的任務。<br/>"
text.project_dashboard_tour_intro="Leantime 中的專案是協作工作區，您和您的團隊可以在其中有效率地組織、追蹤和交付工作。每個專案都是相關目標、任務和里程碑的容器，讓您可以在單一中心位置監控進度。<br/><br/>無論您管理的是工作、學業還是個人計畫，Leantime 專案都能提供將想法轉化為成功成果所需的架構和工具。"
text.wiki_tour_intro="我們的文件功能讓您可以撰寫文件並與團隊分享。您可以建立多個空間，依團隊、領域或文件類別來整理文件。<br/>建立文件以分享知識、流程和程序。您也可以建立文件來分享雲端儲存空間中檔案或資料夾的連結。<br/>"
text.extend_leantime_latest_plugins="使用我們最新的插件來擴充 Leantime。"
support.headline_help_us_build="協助我們打造一個讓每種思維都能發光發熱的未來！"
support.intro_text_1="大多數生產力工具都假設每個人的思考方式都一樣：線性的、完全專注的、受任意設定的期限所驅動。無論您是有 ADHD、需要從完成任務中獲得多巴胺，還是自閉症者、渴望一致的結構，或是有閱讀障礙、以空間方式思考，又或者只是厭倦了與自己大腦實際運作方式不符的工具 — 您可能早已完全放棄專案管理了。"
support.intro_text_2="我們正在為思考方式與眾不同的人打造 Leantime。這包括神經多樣性的大腦，也包括任何曾經覺得現有工具與自己自然思考模式相抵觸的人。"
