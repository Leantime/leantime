text.idea_board_helper_content="這是收集您所有備忘的地方。與您的團隊討論新備忘並附加里程碑，以查看實現您的備忘的進度ideas."
text.kanban_helper_content="Kanban 在日文中意指「卡片」。看板最早由豐田汽車的工程師在 40 年代隨精益生產一同推行。<br/>它用於以視覺化方式快速分享資訊與工作進度。<br/>看板有助於將工作與狀態視覺化、管理進行中的工作、管理工作流程，並迅速朝精益改善採取行動。"
