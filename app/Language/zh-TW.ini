support.marcel_name="👋 我是 Marcel"
support.marcel_tagline="德國移民、自閉症女兒的父親，本身也有 ADHD。"
support.marcel_bio_1="傳統的專案管理工具從來都不適合我。它們感覺像是由神經典型的人為神經典型的人所打造的。當我還是自由工作者、努力讓客戶專案保持井然有序時，我開始打造一個順應我的大腦、而不是與之對抗的工具。"
support.marcel_bio_2="當我意識到還有數百萬人需要同樣的東西時，這個原本為自己打造的解決方案就成了 Leantime。"
support.gloria_name="👋 我是 Gloria"
support.gloria_tagline="從急診室護理師轉職為產品經理，第一代西班牙裔創業家。"
support.gloria_bio_1="我在高壓的醫療環境中工作多年，在那裡，條理分明真的能拯救生命。但當我開始創業時，傳統的專案工具讓人感到不知所措，而且與我實際思考和工作的方式脫節。"
support.gloria_bio_2="我在行為科學和動機研究方面的背景，引導我們打造的功能不僅能整理任務 — 更能幫助您真正想要完成它們。"
support.closing_text="我們可以創造一個沒有人需要與工具搏鬥才能做出好成果的世界。您的贊助將資助一個讓軟體適應人類多樣性、而不是反過來的未來。"
support.headline_ready_to_impact="準備好直接帶來影響了嗎？"
support.contribution_text="每一筆貢獻 — 從 $1 到 $100 — 都會直接用於讓 Leantime 對每個人都變得更好。"
support.start_sponsoring_button="立即開始贊助"
