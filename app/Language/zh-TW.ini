tour.my_work.welcome_title="歡迎參加儀表板導覽"
tour.my_work.welcome_text="讓我們從幾個基本概念開始，幫助您快速熟悉 Leantime 的導覽方式與各種介面元素。"
tour.my_work.work_modes_title="工作模式"
tour.my_work.work_modes_text="頂端導覽列會顯示您目前所在的「工作模式」。您可以位於某個專案內、您的個人工作區，或是公司模式中。"
tour.my_work.left_nav_text="左側導覽列會細分目前的工作模式，並讓您前往不同的區域。這裡呈現的所有內容都屬於上方目前選取的工作模式。"
tour.my_work.profile_bar_title="我的個人資料列"
tour.my_work.profile_bar_text="您可以在這裡找到您帳戶的連結，以及通知和 Leantime 的最新消息。"
tour.my_work.widgets_title="您的儀表板小工具"
tour.my_work.widgets_text="您的儀表板由各種小工具組成，為您呈現與工作相關的重點資訊。"
tour.my_work.customize_title="自訂您的儀表板"
tour.my_work.customize_text="小工具可以透過拖放功能調整大小及移動位置。"
tour.my_work.todos_title="我的待辦事項"
tour.my_work.todos_text="「我的待辦事項」小工具會顯示目前指派給您的所有任務。"
tour.my_work.group_todos_title="將待辦事項分組"
tour.my_work.group_todos_text="您可以使用這裡的下拉選單依專案篩選任務，或依優先順序、狀態、專案或日期將任務分組。"
tour.my_work.sort_todos_title="排序待辦事項"
tour.my_work.sort_todos_text="每個待辦事項都可以拖放以變更順序。您也可以將任務拖放到日曆上進行排程。"
tour.my_work.timer_title="啟動計時器"
tour.my_work.timer_text="準備好開始處理任務時，只要按一下啟動計時器按鈕即可。"
tour.my_work.complete_task_title="完成任務"
tour.my_work.complete_task_text="任務完成後，您可以按一下狀態下拉選單，將其標示為完成。"
tour.my_work.add_tasks_title="新增更多任務"
tour.my_work.add_tasks_text="您可以按一下各區段中的加號按鈕，或使用每個任務旁的三點選單來新增更多任務。"
tour.my_work.finish_text="您已完成「我的工作」儀表板導覽。前往<a href='%s/dashboard/show'>您的專案</a>，進一步了解如何在 Leantime 中管理專案。"
tour.project_dashboard.menu_title="專案選單"
tour.project_dashboard.menu_text="專案選單將您的專案分為不同區段：<strong>資料室</strong> - 存放您所有的檔案與資訊，<strong>思考</strong> - 用於擬定策略、發想與定義，<strong>建立</strong> - 用於管理目標、里程碑與任務。"
tour.project_dashboard.selector_title="專案選擇器"
tour.project_dashboard.selector_text="使用專案選擇器在專案之間切換。左側選單會顯示與目前專案相關的所有內容。"
tour.project_dashboard.checklist_title="檢查清單"
tour.project_dashboard.checklist_text="專案檢查清單是一份快速參考，可讓您確認專案是否包含成功執行所需的所有資訊。"
tour.project_dashboard.status_title="快速狀態更新"
tour.project_dashboard.status_text="您可以使用狀態更新，以紅、黃、綠三種顏色快速與團隊分享專案進度。此狀態會顯示在整個應用程式中。"
tour.project_dashboard.progress_title="進度"
tour.project_dashboard.progress_text="專案進度指標會顯示您已完成多少工作。它會將不同的任務規模、團隊速度與專案里程碑納入考量。"
tour.project_dashboard.latest_tasks_title="最新任務"
tour.project_dashboard.latest_tasks_text="最新任務清單會顯示最近新增到專案中的任務，可作為專案收件匣使用。"
tour.project_dashboard.team_title="團隊"
tour.project_dashboard.team_text="團隊區塊會顯示此專案的成員。"
tour.project_dashboard.finish_text="您已完成專案儀表板導覽。前往<a href='%s/tickets/showKanban'>待辦事項</a>，進一步了解在 Leantime 中管理任務的各種方式。"
tour.kanban_board.overview_title="您的看板"
tour.kanban_board.overview_text="這是您的看板。它能幫助您將工作視覺化，並限制進行中的工作量。"
tour.kanban_board.workflow_title="工作流程"
tour.kanban_board.workflow_text="任務會隨著進展由左向右移動。拖放卡片即可更新其狀態。"
tour.kanban_board.columns_title="彈性欄位"
tour.kanban_board.columns_text="您可以使用三點選單新增或移除欄位，並為欄位重新命名。"
tour.kanban_board.filter_title="篩選任務"
tour.kanban_board.filter_text="您可以依優先順序、狀態、專案或日期等各種欄位篩選任務。"
tour.kanban_board.swimlanes_title="泳道"
tour.kanban_board.swimlanes_text="此外，您也可以將任務分組以建立看板泳道。這有助於您依團隊成員、優先順序或里程碑將工作視覺化。"
tour.kanban_board.sprints_title="緊急待辦事項"
tour.kanban_board.sprints_text="如果您以緊急待辦事項（Sprint）來管理工作，可以使用這裡的下拉選單選取、建立及更新緊急待辦事項。"
tour.kanban_board.finish_text="看板導覽到此結束。前往<a href='%s/tickets/roadmap'>里程碑</a>，了解如何在 Leantime 中建立與管理里程碑。"
tour.milestones.overview_title="里程碑"
tour.milestones.overview_text="里程碑可幫助您追蹤重大成果與專案階段。"
tour.milestones.drag_title="拖曳與排序"
tour.milestones.drag_text="每個長條代表一個里程碑。您可以沿著時間軸拖曳、重新排序並調整其長度。您在此畫面上的所有操作都會更新里程碑的時程。"
tour.milestones.filter_title="篩選"
tour.milestones.filter_text="您可以篩選里程碑，也可以檢視屬於這些里程碑的任務。"
tour.milestones.timeframes_title="時間範圍"
tour.milestones.timeframes_text="您可以變更時間軸檢視的時間範圍，以查看一年中更長的期間，或深入檢視每日細節。"
tour.milestones.finish_text="里程碑導覽到此結束。前往<a href='%s/goalcanvas/dashboard'>目標</a>，了解如何在 Leantime 中建立與管理目標。"
tour.goals.overview_title="目標"
tour.goals.overview_text="目標可幫助您追蹤專案中可衡量的影響。"
tour.goals.parts_title="目的與指標"
tour.goals.parts_text="每個目標都由一個目的（您想達成的事情）和一個指標（您將如何衡量它）組成。"
tour.goals.progress_title="目標進度"
tour.goals.progress_text="當您更新目標指標時，進度列會顯示您的達成程度。"
tour.goals.milestones_title="里程碑與目標"
tour.goals.milestones_text="您可以將目標連結到里程碑，以追蹤目標在任務層級的進度。這有助於找出專案規劃中的缺口。"
tour.goals.finish_text="目標導覽到此結束。里程碑、目標與待辦事項是 Leantime 的基本構成要素，可用來將您的工作拆解成容易管理的部分。前往<a href='%s/tickets/showKanban'>看板</a>檢視您的任務。"
