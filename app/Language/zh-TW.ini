label.onboarding_default_project_name="我的專案"
text.onboarding_default_project_details="歡迎來到您在 Leantime 中的第一個專案！<br />這是您整理任務、追蹤目標與規劃工作的空間。您可以隨意修改這裡的任何內容，或隨著需求成長建立更多專案。這個專案是為了幫助您開始上手"
label.onboarding_milestone_getting_started="快速入門"
label.onboarding_task_community_chat="加入我們的社群聊天室"
text.onboarding_task_community_chat="我們的社群聊天室是提問及取得專案設定意見回饋的絕佳資源。<a href='https://discord.gg/4zMzJtAq9z' target='_blank'>社群聊天室</a>"
label.onboarding_task_invite_team="邀請您的團隊成員"
text.onboarding_task_invite_team="無論您是與他人合作，還是只需要一位互相督促的夥伴，以團隊方式使用 Leantime 都能幫助您保持進度並維持動力。<a href='%s'>使用者管理</a>"
label.onboarding_task_project_structure="進一步了解 Leantime 的專案結構"
text.onboarding_task_project_structure="我們的說明文件中有許多額外資源。若要進一步了解 Leantime 的專案結構與最佳做法，請造訪：<a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="建立目標"
text.onboarding_task_create_goal="目標用於追蹤與衡量長期目的，應能透過您可定期更新的指標來衡量。目標與里程碑可以互相連結，讓您在檢視指標進度的同時掌握執行進度。<a href='%s'>專案目標</a>"
label.onboarding_task_create_milestone="建立里程碑"
text.onboarding_task_create_milestone="里程碑可讓您將專案的各個階段劃分為明確的成果。每個里程碑都有開始與結束日期，並應交付某些產出。<a href='%s'>專案里程碑</a>"
label.onboarding_task_personal_project="探索您的個人專案"
text.onboarding_task_personal_project="您的個人專案是一個讓您整理任務、目標與工作的空間。您可以透過頂端的專案選擇器進入，或按一下這個連結：<a href='%s'>我的專案</a>"
label.onboarding_task_complete_profile="完成我的 Leantime 個人資料"
text.onboarding_task_complete_profile="更新個人資料圖片並完成工作偏好設定，打造個人化的使用體驗。<a href='%s'>我的個人資料</a>"
