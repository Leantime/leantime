text.onboarding_default_project_details="Chào mừng bạn đến với dự án đầu tiên trong Leantime!<br />Đây là không gian để bạn sắp xếp công việc, theo dõi mục tiêu và lên kế hoạch làm việc. Bạn có thể thoải mái thay đổi bất cứ điều gì ở đây hoặc tạo thêm dự án khi cần. Dự án này chỉ dành cho bạn để bắt đầu"
label.onboarding_milestone_getting_started="Bắt đầu"
label.onboarding_task_community_chat="Tham gia chat cộng đồng của chúng tôi"
text.onboarding_task_community_chat="Chat cộng đồng của chúng tôi là nơi tuyệt vời để đặt câu hỏi và nhận góp ý về cách thiết lập dự án. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat Cộng đồng</a>"
label.onboarding_task_invite_team="Mời đồng đội của bạn"
text.onboarding_task_invite_team="Dù bạn đang làm việc cùng ai đó hay chỉ cần một người bạn đồng hành để giữ cam kết, sử dụng Leantime theo nhóm giúp bạn đi đúng hướng và giữ động lực <a href='%s'>Quản lý Người dùng</a>"
label.onboarding_task_project_structure="Tìm hiểu thêm về cấu trúc dự án của Leantime"
text.onboarding_task_project_structure="Chúng tôi có rất nhiều tài nguyên bổ sung trong tài liệu trợ giúp. Để tìm hiểu thêm về cấu trúc dự án trong Leantime và các phương pháp hay nhất, hãy truy cập: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Tạo một mục tiêu"
text.onboarding_task_create_goal="Mục tiêu được dùng để theo dõi và đo lường các mục đích dài hạn. Mục tiêu nên đo lường được bằng các chỉ số mà bạn có thể cập nhật thường xuyên. Bạn có thể liên kết mục tiêu với cột mốc để vừa xem tiến độ thực hiện vừa xem tiến độ của chỉ số <a href='%s'>Mục tiêu dự án</a>"
label.onboarding_task_create_milestone="Tạo một cột mốc"
text.onboarding_task_create_milestone="Cột mốc cho phép bạn chia các giai đoạn của dự án thành những kết quả riêng biệt. Mỗi cột mốc có ngày bắt đầu và ngày kết thúc và nên mang lại một kết quả cụ thể <a href='%s'>Cột mốc dự án</a>"
label.onboarding_task_personal_project="Khám phá dự án cá nhân của bạn"
text.onboarding_task_personal_project="Dự án cá nhân là không gian để bạn sắp xếp công việc, mục tiêu và các hoạt động của mình. Bạn có thể truy cập nó qua bộ chọn dự án ở phía trên hoặc bằng cách nhấp vào liên kết này: <a href='%s'>Dự án của tôi</a>"
label.onboarding_task_complete_profile="Hoàn thiện hồ sơ Leantime của tôi"
text.onboarding_task_complete_profile="Cập nhật ảnh hồ sơ và hoàn thiện tùy chọn làm việc để cá nhân hóa trải nghiệm của tôi. <a href='%s'>Hồ sơ của tôi</a>"
label.onboarding_goalboard_title="Mục tiêu của tôi"
label.onboarding_goal_metric="Công việc hoàn thành đúng hạn"
label.onboarding_goal_objective="Xây dựng hệ thống năng suất của tôi"
label.onboarding_step_name_first_task="Đặt tên cho công việc đầu tiên"
label.onboarding_step_invite_team="Mời nhóm của bạn"
label.onboarding_step_name_project="Đặt tên cho dự án của bạn"

