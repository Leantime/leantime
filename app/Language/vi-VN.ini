text.my_work_dashboard_intro="Bảng điều khiển Công việc của tôi giúp bạn tập trung vào mọi điều quan trọng.<br/>Những công việc quan trọng nhất giờ đây luôn ở vị trí trung tâm, được sắp xếp riêng cho bạn và theo cách bộ não của bạn hoạt động tốt nhất.<br/><br/>Từ những việc nhanh gọn đến các mục tiêu đầy tham vọng, mọi thứ bạn cần đều ở ngay đây. Đây là không gian để bạn ghi lại ý tưởng, theo dõi tiến độ và ăn mừng những thành công trên hành trình."
text.blueprints_intro="Bản thiết kế là cơ hội để bạn hiểu rõ mọi dữ liệu. Leantime có nhiều công cụ và bảng canvas để xác định bối cảnh dự án của bạn thông qua Business Model Canvas, Phân tích SWOT hoặc Bản đồ đồng cảm.<br/><br/>Nếu bạn chưa biết bắt đầu từ đâu, chúng tôi gợi ý bạn tạo một 'Bảng Giá Trị Dự Án'. Bảng này sẽ trả lời những câu hỏi quan trọng nhất của dự án: Khách hàng của bạn là ai?<br/>Bạn đang giải quyết vấn đề gì?<br/>Giải pháp của bạn là gì?<br/>Giải pháp của bạn mang lại lợi ích gì so với đối thủ cạnh tranh<br/>"
text.goals_tour_intro="Mục tiêu cho phép bạn chia nhỏ dự án thành các phần có thể đạt được, đo lường được và hành động được.<br/>Trong khi cột mốc tập trung vào việc thực thi, mục tiêu hướng đến các chỉ số bạn muốn đạt được.<br/>Mỗi mục tiêu nên có một đích đến rõ ràng (điều bạn muốn đạt được) và có thể dễ dàng đo lường bằng một chỉ số duy nhất.<br/><br/>Khi đã có mục tiêu, bạn có thể gán cột mốc cho nó để chia nhỏ thành các công việc có thể thực hiện.<br/>"
text.project_dashboard_tour_intro="Dự án trong Leantime là không gian làm việc cộng tác, nơi bạn và nhóm sắp xếp, theo dõi và hoàn thành công việc hiệu quả. Mỗi dự án là nơi chứa các mục tiêu, công việc, cột mốc liên quan và cho phép bạn theo dõi tiến độ tại một nơi tập trung.<br/><br/>Dù bạn đang quản lý công việc, việc học hay các sáng kiến cá nhân, dự án Leantime cung cấp cấu trúc và công cụ cần thiết để biến ý tưởng thành kết quả thành công."
text.wiki_tour_intro="Tài liệu cho phép bạn viết và chia sẻ tài liệu với nhóm. Bạn có thể tạo nhiều không gian để sắp xếp tài liệu theo nhóm, lĩnh vực hoặc danh mục tài liệu.<br/>Tạo tài liệu để chia sẻ kiến thức, quy trình và thủ tục. Bạn cũng có thể tạo tài liệu để chia sẻ liên kết đến một tệp hoặc thư mục trong bộ nhớ đám mây của bạn.<br/>"
text.extend_leantime_latest_plugins="Mở rộng Leantime bằng các plugin mới nhất của chúng tôi."
support.headline_help_us_build="Hãy giúp chúng tôi xây dựng một tương lai nơi mọi bộ óc đều phát triển!"
support.intro_text_1="Hầu hết các công cụ năng suất đều cho rằng mọi người suy nghĩ giống nhau: tuyến tính, tập trung hoàn hảo và được thúc đẩy bởi những thời hạn tùy ý. Dù bạn mắc ADHD và cần dopamine từ những công việc đã hoàn thành, là người tự kỷ và mong muốn một cấu trúc nhất quán, mắc chứng khó đọc và tư duy theo không gian, hay đơn giản là đã mệt mỏi với những công cụ không phù hợp với cách bộ não bạn thực sự hoạt động — có lẽ bạn đã từ bỏ hẳn việc quản lý dự án."
support.intro_text_2="Chúng tôi xây dựng Leantime cho những bộ óc hoạt động khác biệt. Điều đó bao gồm những bộ não đa dạng thần kinh, nhưng cũng là bất kỳ ai từng cảm thấy các công cụ hiện có đi ngược lại lối suy nghĩ tự nhiên của mình."
