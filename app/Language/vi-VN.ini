text.all_assigned_projects="🗂️ Tất cả dự án được giao"
text.get_organized_with_projects="Chúng tôi rất vui được hướng dẫn bạn và giúp sắp xếp công việc của bạn.<br /><br />Leantime quản lý công việc của bạn theo “dự án”. Cách dễ nhất để xác định một dự án là nghĩ về một điều <strong>bạn muốn đạt được</strong>. Đó có thể là các chỉ số bạn muốn đạt tới, một dự án cho khách hàng hoặc một thứ bạn muốn tạo ra. Sau đó, dự án được chia nhỏ thành các Mục tiêu với chỉ số và Cột mốc. <br /><br />"
