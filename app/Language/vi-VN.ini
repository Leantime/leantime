text.helpful_resources="Bất kỳ phần mềm mới nào cũng có thể làm cho bạn cảm thấy lạc quan, chúng tôi cố gắng làm cho Leantime đơn giản và dễ hiểu nhất có thể.<br />Nếu bạn bao giờ cảm thấy bí bách hoặc muốn trao đổi ý kiến, bạn có thể sử dụng các tài nguyên dưới đây để nhận sự giúp đỡ:"

text.discordChat="Chats discord của chúng tôi có lẽ là cách nhanh nhất để nhận câu trả lời cho bất kỳ câu hỏi nào của bạn. Cộng đồng của chúng tôi rất tích cực và hữu ích."
