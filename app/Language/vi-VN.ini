text.lean.helper_content="Bảng Lean Canvas sẽ đưa bạn qua toàn bộ quá trình xác nhận ý tưởng của bạn về doanh nghiệp và/hoặc sản phẩm mới.<br/>Bạn sẽ định rõ <em>Phân khúc Khách hàng</em>, <em>Vấn đề, Giải pháp</em>.<br/>Từ đó, bạn sẽ chuyển sang <em>Đề xuất Giá trị Độc đáo</em> (điều gì khiến ý tưởng của bạn tốt hơn so với các ứng dụng khác?), <em>Kênh phân phối</em> (làm thế nào bạn sẽ đưa giải pháp của mình đến với khách hàng?), <em>Luồng Doanh thu</em> (làm thế nào giải pháp của bạn sẽ tạo ra lợi nhuận?), <em>Cơ cấu Chi phí</em> (giá trị của giải pháp của bạn là bao nhiêu?), <em>Chỉ số Quan trọng</em> (làm thế nào bạn sẽ đo lường thành công?), và <em>Ưu thế Không công bằng</em> (bạn có điều gì giúp bạn thành công so với đối thủ?)<br/>Trả lời những câu hỏi này được thiết kế để thúc đẩy sự thành công, giảm thiểu rủi ro thất bại và cho phép bạn theo dõi và xác nhận giả định của mình. Việc thành công là về việc loại bỏ lãng phí và làm việc để xây dựng sản phẩm, doanh nghiệp và giải pháp mà khách hàng của bạn cần."
text.lean.disclaimer="Bảng Lean Canvas được chuyển từ <a href='https://strategyzer.com/' target='_blank'>Bảng Mô hình Kinh doanh</a> và được cấp phép theo giấy phép <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
