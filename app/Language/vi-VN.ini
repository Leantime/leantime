support.marcel_name="👋 Tôi là Marcel"
support.marcel_tagline="Người nhập cư gốc Đức, bố của một cô con gái tự kỷ và bản thân cũng sống chung với ADHD."
support.marcel_bio_1="Các công cụ quản lý dự án truyền thống chưa bao giờ phù hợp với tôi. Chúng dường như được tạo ra bởi những bộ óc điển hình thần kinh, dành cho những bộ óc điển hình thần kinh. Khi làm việc tự do và vật lộn để giữ các dự án của khách hàng ngăn nắp, tôi bắt đầu xây dựng một thứ hoạt động cùng với bộ não của mình thay vì chống lại nó."
support.marcel_bio_2="Điều bắt đầu như một giải pháp cá nhân đã trở thành Leantime khi tôi nhận ra hàng triệu người khác cũng cần điều tương tự."
support.gloria_name="👋 Và tôi là Gloria"
support.gloria_tagline="Từng là y tá cấp cứu, nay là quản lý sản phẩm, doanh nhân gốc Mỹ Latinh thế hệ đầu tiên."
support.gloria_bio_1="Tôi đã dành nhiều năm trong môi trường y tế áp lực cao, nơi sự ngăn nắp thực sự cứu sống con người. Nhưng khi bắt đầu kinh doanh riêng, các công cụ dự án truyền thống khiến tôi cảm thấy quá tải và xa rời cách tôi thực sự suy nghĩ và làm việc."
support.gloria_bio_2="Nền tảng về khoa học hành vi và nghiên cứu động lực của tôi định hướng cách chúng tôi xây dựng những tính năng không chỉ sắp xếp công việc — mà còn giúp bạn thực sự muốn hoàn thành chúng."
support.closing_text="Chúng ta có thể tạo ra một thế giới nơi không ai phải vật lộn với công cụ để làm tốt công việc. Khoản tài trợ của bạn góp phần tạo nên một tương lai nơi phần mềm thích nghi với sự đa dạng của con người, chứ không phải ngược lại."
support.headline_ready_to_impact="Sẵn sàng tạo tác động trực tiếp?"
support.contribution_text="Mọi đóng góp — từ $1 đến $100 — đều được dùng trực tiếp để làm cho Leantime tốt hơn cho tất cả mọi người."
