; Strings added 2026-10 by machine translation (Claude), please review
tour.my_work.welcome_title="Chào mừng đến với hành trình Bảng điều khiển"
tour.my_work.welcome_text="Hãy bắt đầu với một vài điều cơ bản để bạn nhanh chóng làm quen với thanh điều hướng và các thành phần khác nhau trong Leantime."
tour.my_work.work_modes_title="Chế độ làm việc"
tour.my_work.work_modes_text="Thanh điều hướng trên cùng cho biết “chế độ làm việc” hiện tại của bạn. Bạn có thể đang ở trong một dự án, trong khu vực làm việc cá nhân hoặc ở chế độ công ty."
tour.my_work.left_nav_text="Thanh điều hướng bên trái chia nhỏ chế độ làm việc hiện tại và giúp bạn truy cập các khu vực khác nhau. Mọi thứ hiển thị ở đây đều thuộc về chế độ làm việc đang được chọn ở trên."
tour.my_work.profile_bar_title="Thanh hồ sơ của tôi"
tour.my_work.profile_bar_text="Tại đây bạn sẽ tìm thấy các liên kết đến tài khoản của mình, cùng với thông báo và tin tức mới nhất về Leantime."
tour.my_work.widgets_title="Các tiện ích trên bảng điều khiển của bạn"
tour.my_work.widgets_text="Bảng điều khiển của bạn được chia thành nhiều tiện ích, mỗi tiện ích hiển thị thông tin tập trung về công việc của bạn."
tour.my_work.customize_title="Tùy chỉnh bảng điều khiển"
tour.my_work.customize_text="Bạn có thể thay đổi kích thước và di chuyển các tiện ích bằng cách kéo và thả."
tour.my_work.todos_title="Công việc cần làm của tôi"
tour.my_work.todos_text="Tiện ích Công việc cần làm của tôi hiển thị tất cả các công việc hiện đang được giao cho bạn."
tour.my_work.group_todos_title="Nhóm Công việc cần làm"
tour.my_work.group_todos_text="Bạn có thể dùng các danh sách thả xuống ở đây để lọc công việc theo dự án hoặc nhóm chúng theo mức ưu tiên, trạng thái, dự án hoặc ngày."
tour.my_work.sort_todos_title="Sắp xếp Công việc cần làm"
tour.my_work.sort_todos_text="Bạn có thể kéo và thả từng Công việc cần làm để thay đổi thứ tự. Bạn cũng có thể kéo và thả một công việc vào lịch để lên lịch cho nó."
tour.my_work.timer_title="Bắt đầu bộ hẹn giờ"
tour.my_work.timer_text="Khi bạn sẵn sàng bắt đầu làm một công việc, chỉ cần nhấp vào nút bắt đầu hẹn giờ."
tour.my_work.complete_task_title="Hoàn thành một công việc"
tour.my_work.complete_task_text="Khi một công việc đã xong, bạn có thể đánh dấu hoàn thành bằng cách nhấp vào danh sách thả xuống trạng thái."
tour.my_work.add_tasks_title="Thêm công việc"
tour.my_work.add_tasks_text="Bạn có thể thêm công việc bằng cách nhấp vào nút dấu cộng ở mỗi mục, hoặc dùng menu ba chấm bên cạnh mỗi công việc."
tour.my_work.finish_text="Bạn đã hoàn thành hành trình bảng điều khiển Công việc của tôi. Hãy chuyển đến <a href='%s/dashboard/show'>dự án của bạn</a> để tìm hiểu thêm về quản lý dự án trong Leantime."
tour.project_dashboard.menu_title="Menu dự án"
tour.project_dashboard.menu_text="Menu dự án sắp xếp dự án của bạn thành các phần khác nhau: <strong>Phòng Dữ Liệu</strong> - nơi lưu trữ mọi tệp và thông tin của bạn, <strong>Suy nghĩ</strong> - để lập chiến lược, lên ý tưởng và xác định, <strong>Tạo</strong> - để quản lý mục tiêu, cột mốc và công việc."
tour.project_dashboard.selector_title="Bộ chọn dự án"
tour.project_dashboard.selector_text="Dùng bộ chọn dự án để chuyển nhanh giữa các dự án. Menu bên trái hiển thị mọi thứ liên quan đến dự án hiện tại của bạn."
tour.project_dashboard.checklist_title="Danh sách kiểm tra"
tour.project_dashboard.checklist_text="Danh sách kiểm tra dự án giúp bạn nhanh chóng xem dự án đã có đầy đủ thông tin cần thiết để thực hiện thành công hay chưa."
tour.project_dashboard.status_title="Cập nhật trạng thái nhanh"
tour.project_dashboard.status_text="Bạn có thể dùng cập nhật trạng thái để nhanh chóng chia sẻ tiến độ dự án với nhóm bằng các màu đỏ, vàng và xanh lá. Trạng thái này sẽ hiển thị trên toàn bộ ứng dụng."
tour.project_dashboard.progress_title="Tiến độ"
tour.project_dashboard.progress_text="Chỉ báo tiến độ dự án cho bạn biết lượng công việc đã hoàn thành. Chỉ báo này tính đến quy mô khác nhau của các công việc, tốc độ của nhóm và các cột mốc của dự án."
tour.project_dashboard.latest_tasks_title="Công việc mới nhất"
tour.project_dashboard.latest_tasks_text="Danh sách công việc mới nhất hiển thị các công việc vừa được thêm vào dự án và có thể dùng làm hộp thư đến của dự án."
tour.project_dashboard.team_title="Nhóm"
tour.project_dashboard.team_text="Ô Nhóm hiển thị các thành viên của dự án này."
tour.project_dashboard.finish_text="Bạn đã hoàn thành hành trình bảng điều khiển dự án. Hãy chuyển đến <a href='%s/tickets/showKanban'>Công việc cần làm</a> để tìm hiểu thêm về các cách quản lý công việc trong Leantime."
tour.kanban_board.overview_title="Bảng Kanban của bạn"
tour.kanban_board.overview_text="Đây là bảng Kanban của bạn. Bảng giúp bạn trực quan hóa công việc và giới hạn số công việc đang thực hiện."
tour.kanban_board.workflow_title="Luồng công việc"
tour.kanban_board.workflow_text="Công việc di chuyển từ trái sang phải theo tiến độ. Kéo và thả thẻ để cập nhật trạng thái của chúng."
tour.kanban_board.columns_title="Cột linh hoạt"
tour.kanban_board.columns_text="Với menu ba chấm, bạn có thể thêm, xóa và đổi tên các cột."
tour.kanban_board.filter_title="Lọc công việc"
tour.kanban_board.filter_text="Bạn có thể lọc công việc theo nhiều trường như mức ưu tiên, trạng thái, dự án hoặc ngày."
tour.kanban_board.swimlanes_title="Swimlane"
tour.kanban_board.swimlanes_text="Ngoài ra, bạn có thể nhóm công việc để tạo các swimlane trên bảng Kanban. Cách này giúp bạn trực quan hóa công việc theo thành viên nhóm, mức ưu tiên hoặc cột mốc."
tour.kanban_board.sprints_title="Sprint"
tour.kanban_board.sprints_text="Nếu bạn quản lý công việc theo sprint, bạn có thể dùng danh sách thả xuống ở đây để chọn, tạo và cập nhật sprint."
tour.kanban_board.finish_text="Hành trình Kanban đến đây là kết thúc. Hãy chuyển đến <a href='%s/tickets/roadmap'>Cột mốc</a> để tìm hiểu cách tạo và quản lý cột mốc trong Leantime."
tour.milestones.overview_title="Cột mốc"
tour.milestones.overview_text="Cột mốc giúp bạn theo dõi các kết quả chính và các giai đoạn của dự án."
tour.milestones.drag_title="Kéo & sắp xếp"
tour.milestones.drag_text="Mỗi thanh tương ứng với một cột mốc. Bạn có thể kéo chúng dọc theo dòng thời gian, sắp xếp lại và thay đổi kích thước. Mọi thao tác trên màn hình này đều cập nhật thời gian của các cột mốc."
tour.milestones.filter_title="Bộ lọc"
tour.milestones.filter_text="Bạn có thể lọc các cột mốc và xem cả những công việc thuộc về chúng."
tour.milestones.timeframes_title="Khung thời gian"
tour.milestones.timeframes_text="Bạn có thể thay đổi khung thời gian của chế độ xem dòng thời gian để xem nhiều hơn trong năm hoặc đi sâu vào chi tiết từng ngày."
tour.milestones.finish_text="Hành trình cột mốc đến đây là kết thúc. Hãy chuyển đến <a href='%s/goalcanvas/dashboard'>Mục tiêu</a> để tìm hiểu cách tạo và quản lý mục tiêu trong Leantime."
tour.goals.overview_title="Mục tiêu"
tour.goals.overview_text="Mục tiêu giúp bạn theo dõi tác động có thể đo lường được đối với dự án của mình."
tour.goals.parts_title="Mục đích & Chỉ số"
tour.goals.parts_text="Mỗi mục tiêu gồm một Mục đích (điều bạn muốn đạt được) và một Chỉ số (cách bạn đo lường nó)."
tour.goals.progress_title="Tiến độ mục tiêu"
tour.goals.progress_text="Khi bạn cập nhật các chỉ số của mục tiêu, thanh tiến độ sẽ cho bạn thấy mình đã đi được bao xa."
tour.goals.milestones_title="Cột mốc & Mục tiêu"
tour.goals.milestones_text="Bạn có thể liên kết mục tiêu với cột mốc để theo dõi tiến độ của mục tiêu ở cấp độ công việc. Điều này giúp phát hiện những thiếu sót trong kế hoạch dự án."
tour.goals.finish_text="Hành trình mục tiêu đến đây là kết thúc. Cột mốc, Mục tiêu và Công việc cần làm là những thành phần cơ bản trong Leantime. Hãy dùng chúng để chia nhỏ công việc thành những phần dễ quản lý. Hãy chuyển đến <a href='%s/tickets/showKanban'>Bảng Kanban</a> để xem lại công việc của bạn."
