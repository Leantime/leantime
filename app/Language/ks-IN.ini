support.marcel_tagline="جرمن مہاجر، اکہِ آٹسٹک کوٗرِ ہُند مول، تہٕ پانہٕ تہِ ADHD سان زندگی گزارن وول۔"
support.marcel_bio_1="روایتی پروجیکٹ مینجمنٹ ٹول آیہِ نہٕ زانٛہہ مےٚ پسند۔ مےٚ باسیوٚو زِ یِم چھِ نیوروٹیپیکل دماغو نیوروٹیپیکل دماغن خٲطرٕ بنٲوِمٕتۍ۔ ییٚلہِ بہٕ فری لانسنگ اوسُس کران تہٕ کلائنٹ پروجیکٹ منظم تھاونس منٛز پریشان اوسُس، مےٚ کوٚر کیٚنٛہہ تِتھ بناوُن شروع یُس میٲنِس دماغس سٟتۍ کٲم کرِ، اَمِس خلاف نہٕ۔"
support.marcel_bio_2="یُس اکھ ذٲتی حل اوس، سُہ بنیوٚو Leantime ییٚلہِ مےٚ احساس گوٚو زِ لکھوٚ بیٚین لُکن چھےٚ اَتھے چیزٕچ ضرورت۔"
support.gloria_name="👋 تہٕ بہٕ چھےٚس گلوریا"
support.gloria_tagline="سابقہ ER نرس یۄسہٕ پروڈکٹ مینیجر بنیہٕ، گۄڈنِچ نسلٕچ ہسپانوی کاروبٲری۔"
support.gloria_bio_1="مےٚ گُزرٲوۍ واریاہ ؤری تِتھیٚن دباؤ وٲلیٚن طبی ماحولن منٛز یتہِ تنظیم واقعی زندگی بچاوان چھےٚ۔ مگر ییٚلہِ مےٚ پنُن کاروبار شروع کوٚر، روایتی پروجیکٹ ٹول باسیہٕ بوجھل تہٕ تمہِ طریقہٕ نِشہِ دُور یِتھ پٲٹھۍ بہٕ اصل منٛز سوچان تہٕ کٲم کران چھےٚس۔"
support.gloria_bio_2="رویہ جاتی سائنس تہٕ ترغیب ریسرچس منٛز میون پس منظر چھُ تعین کران زِ أسۍ کِتھہٕ پٲٹھۍ چھِ تِتھۍ فیچر بناوان یِم صِرف ٹاسک منظم چھِ نہٕ کران—بلکہ تۄہہِ چھِ یِم مکمل کرنُک واقعی شوق دِوان۔"
support.closing_text="أسۍ ہیکو اکھ تِژھ دُنیا بنٲوِتھ یتھ منٛز کانٛہہ تہِ بڑِ کٲم کرنہٕ خٲطرٕ پننیٚن ٹولن سٟتۍ لڑان آسہِ نہٕ۔ تُہٕنٛز سپانسرشپ چھےٚ اکھ تِتھ مستقبل فنڈ کران یتھ منٛز سافٹ ویئر انسانی تنوعس سٟتۍ مطابقت کرِ، نہٕ زِ اُلٹ۔"
support.headline_ready_to_impact="کیا تۄہہِ چھِو براہِ راست اثر ترٲوِنہٕ خٲطرٕ تیار؟"
support.contribution_text="پرٛتھ عطیہ—$1 پؠٹھہٕ $100 تام—چھُ سیدِ سیود Leantime سارِنی خٲطرٕ بہتر بناونس منٛز لگان۔"
