text.help_dashboard_intro="Leantime چھُ تُہٕنٛزٕ سُپر پاورٕ مضبوط کرنہٕ تہٕ تُہٕنٛدِن مقصدن کُن تُہٕنٛز پیش رفت ہاونہٕ خٲطرٕ بناونہٕ آمُت۔<br /><br />اسہِ منٛزٕ چھِ زیادٕ تر لُکھ ٹاسکن ہٕنٛز لِسٹ بناونس عادی — مگر اسۍ ونَو تۄہہِ یہِ سوچنہٕ خٲطرٕ زِ تۄہہِ کیاہ چھِو اصل منٛز حاصل کرُن یژھان۔<br /><br />1. اکھ وِژن (حکمتِ عملی) تہٕ پنٕنۍ مقصد طے کٔرِو<br />2. سۄ کٲم طے کٔرِو یۄسہٕ تۄہہِ تِمن مقصدن تام واتنٲوِ<br />3. تہٕ پتہٕ واتِو تِمن تام، پنُن روزانہ کٲم میٲنۍ کٲم ڈیش بورڈ سٟتۍ پلان کٔرِتھ۔<br />"
