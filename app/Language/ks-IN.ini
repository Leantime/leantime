text.lean.helper_content="لین کینوس چھُ تۄہہِ پننِس نٔوِس بزنس تہٕ/یا پراڈکٹ خیالس خٲطرٕ خیالٕچ تصدیقُک مکمل عمل کرناوان۔<br/>تۄہہِ کرِو پننِس <em>کسٹمر سیگمنٹ</em>، <em>مسئلہ، حل</em> پؠٹھ کٲم۔<br/>تتہِ پتہٕ واتِو تۄہہِ پننِس <em>منفرد ویلیو پروپوزیشنس</em> (تُہُنٛد خیال کیازِ چھُ باقی پیشکشن نِشہِ بہتر؟)، پننیٚن <em>ڈسٹری بیوشن چینلن</em> (تۄہہِ کِتھہٕ پٲٹھۍ واتنٲوِو پنُن حل کسٹمرن تام؟)، پننیٚن <em>آمدنی ہٕنٛدیٚن ذریعن</em> (تُہُنٛد حل کِتھہٕ پٲٹھۍ کمٲوِ پونسہٕ؟)، پننِس <em>لاگتکِس ڈھانچس</em> (تُہٕنٛدِ حلٕچ قیمت کیاہ چھےٚ؟)، <em>اہم میٹرکسن</em> (تۄہہِ کِتھہٕ پٲٹھۍ ناپِو کامیٲبی؟) تہٕ پننِس <em>غیر منصفانہ فائدس</em> (تۄہہِ نِش کیاہ چھُ یُس مقابلس منٛز کامیٲبی خٲطرٕ مدد کرِ؟) تام۔<br/>یِمن سوالن ہٕنٛد جواب دِنہٕ سٟتۍ چھےٚ کامیٲبی بڑان، ناکٲمی کم گژھان تہٕ تۄہہِ ہیکِو پننیٚن مفروضن ٹریک تہٕ تصدیق کٔرِتھ۔ لین آسنُک مطلب چھُ ضیاع ختم کرُن تہٕ تِم پراڈکٹ، بزنس تہٕ حل بناونہٕ خٲطرٕ کٲم کرٕنۍ یِمن ہٕنٛز تُہٕنٛدیٚن کسٹمرن ضرورت چھےٚ۔"
text.lean.disclaimer="لین کینوس چھُ <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> پؠٹھہٕ ماخوذ تہٕ یہِ چھُ <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> لائسنسہٕ تحت لائسنس شُدہ"
