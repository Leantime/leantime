text.full_lean_canvas_helper_content="مکمل تحقیقی بورڈ کرِ تۄہہِ خیالُک تصدیق کرنُک پوٗرٕ عمل منٛز رہنمائی۔<br/>یتھ صفحس پؠٹھ کرِو تۄہہِ دوبارہ پنُن کسٹمر سیگمنٹ، مسئلہ تہٕ حل بیان (مگر فکر مہ کٔرِو، اگر تۄہہِ یہِ پٔہلے پٔے سادٕ بورڈس پؠٹھ بوٚرمُت چھُ، تیٚلہِ وُچھِو تۄہہِ یہِ یتہِ دوبارہ!)۔<br/>اَتہِ پؠٹھہٕ گژھِو تۄہہِ واضح ویلیو پروپوزیشن (تُہُنٛد خیال کیازِ چھُ بیٚین پیشکشن کھوتہٕ بہتر؟)،<br/>سیلز چینل (کسٹمر کِتھہٕ پٲٹھۍ چھِ تُہُنٛد حل حاصل کران؟)<br/>آمدنی ہٕنٛدۍ ذریعہ (تُہُنٛد حل کِتھہٕ پٲٹھۍ چھُ پونٛسہٕ کمٲوان؟)<br/>لاگتُک ڈھانچہ (تُہُنٛد حل کوٚتہٕ قیمتی چھُ؟) کلیدی میٹرک (تۄہہِ کِتھہٕ پٲٹھۍ چھِو کامیٲبی ناپان؟)<br/>تہٕ غیر منصفانہ فائدٕ (کیاہ چھُ تۄہہِ مقابلس منٛز الگ ہاوان؟) کُن۔<br/>یِمن سوالن ہُند جواب دِنُک مقصد چھُ کامیٲبی حاصل کرٕنۍ، ناکامی کم کرٕنۍ تہٕ پننۍ مفروضہ ٹریک تہٕ ثابت کرٕنۍ۔<br/>Lean چھُ فضول خرچی ختم کرنہٕ تہٕ تِم پروڈکٹ، سٹور تہٕ حل بناونہٕ متعلق یِمن ہٕنٛز تُہٕنٛدِن کسٹمرن ضرورت چھےٚ۔"
