label.onboarding_task_community_chat="سٲنِس کمیونٹی چیٹس منٛز شٲمِل گٔژھِو"
text.onboarding_task_community_chat="سون کمیونٹی چیٹ چھُ سوال پرٛژھنہٕ تہٕ پروجیکٹ سیٹ اپس پؠٹھ رائے حاصل کرنہٕ خٲطرٕ اکھ بہترین ذریعہ۔ <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>کمیونٹی چیٹ</a>"
label.onboarding_task_invite_team="پننیٚن ٹیم ممبرن دعوت دِیِو"
text.onboarding_task_invite_team="چاہے تۄہہِ کٲنسہِ سٟتۍ کٲم کران آسِو یا صِرف اکِس جوابدہی ساتھی ہٕنٛز ضرورت آسِو۔ Leantime گروپس منٛز ورتاونہٕ سٟتۍ چھُ ٹریک پؠٹھ تہٕ حوصلہ مند روزنس منٛز مدد مِلان <a href='%s'>یوزر مینجمنٹ</a>"
label.onboarding_task_project_structure="Leantime منٛز پروجیکٹ ڈھانچس مُتعلق مزید زانِو"
text.onboarding_task_project_structure="سٲنِس مدد دستاویزن منٛز چھِ واریاہ اضافی وسائل۔ Leantime منٛز پروجیکٹ ڈھانچہ تہٕ بہترین طریقن مُتعلق مزید زاننہٕ خٲطرٕ وُچھِو: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="اکھ مقصد بنٲوِو"
text.onboarding_task_create_goal="مقصد چھِ طویل مدتی ہدف ٹریک کرنہٕ تہٕ ناپنہٕ خٲطرٕ ورتاونہٕ یِوان۔ یِم گژھن تِمن میٹرکن ذریعہٕ ناپنہٕ لایق آسٕنۍ یِم تۄہہِ باقاعدگی سان اپڈیٹ ہیکِو کٔرِتھ۔ مقصد تہٕ سنگِ میل ہیکن اکھ أکِس سٟتۍ لِنک سپدِتھ تاکہ تۄہہِ میٹرک پیش رفتس سٟتۍ سٟتۍ عمل درآمدٕچ پیش رفت تہِ وُچھِو <a href='%s'>پروجیکٹ مقصد</a>"
label.onboarding_task_create_milestone="اکھ سنگِ میل بنٲوِو"
text.onboarding_task_create_milestone="سنگِ میل چھِ تۄہہِ پننیٚن پروجیکٹن ہٕنٛدۍ مرحلہٕ الگ الگ نتیجن منٛز تقسیم کرنٕچ سہولت دِوان۔ ہر سنگِ میلس چھےٚ شروعاتُک تہٕ آخری تٲریخ، تہٕ اَمہِ سٟتۍ گژھِ کانٛہہ آؤٹ پُٹ حاصل گژھُن <a href='%s'>پروجیکٹ سنگِ میل</a>"
label.onboarding_task_personal_project="پنُن ذٲتی پروجیکٹ وُچھِو"
