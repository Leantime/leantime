text.company_name_helper="صفحٕکِس عنوانس تہٕ ای میلن منٛز چھُ ہاونہٕ یِوان"
text.advanced_boards_helper_content="خیال چھِ بدلان، بڑان تہٕ پختہ گژھان۔ یِمن ٹریک کرنٕچ جاے چھےٚ یہِ۔<br/>خیالن ہٕنٛدۍ کارڈ اکہِ کالمہٕ پؠٹھہٕ بییِس کالمس منٛز کٔرِو منتقل، تاکہ تِہُنٛد موجودہ حال ہاونہٕ یِیہِ۔<br/>تحقیق شروع کرنہٕ، پروٹو ٹائپ بناونہٕ تہٕ عمل درآمد کرنہٕ برونٛہہ کیٚنٛژن کسٹمرن سٟتۍ یِم پروٹو ٹائپ ثابت کرنہٕ خٲطرٕ چھےٚ یہِ جان جاے۔"
text.backlog_helper_content="Backlog چھُ تُہٕنٛدِن سٲرِنی ٹاسکن ہُند گھر؛ تِم یِمن پؠٹھ تۄہہِ وۄنۍ کٲم کران چھِو تہٕ تِم یِمن پؠٹھ کٲم کرنُک منصوبہ چھُ۔<br/><br/>پنُن Backlog مکمل کرنس کُن پیش رفت کرنہٕ خٲطرٕ چھِ اسۍ مشورٕ دِوان زِ کٲم کٔرِو مختصر مرحلن منٛز — سپرنٹن منٛز۔<br/>سپرنٹ چھِ زٕ ہفتن ہٕنٛدۍ مقرر وقفہ یِم تۄہہِ لۄکٹین، ڈیلیور کرنہٕ لایق کٲمہٕ حصن پؠٹھ توجہ دِنٕچ سہولت چھِ دِوان۔<br/>زٕ ہفتہٕ پتہٕ گژھِ تُہٕنٛدِ نِش کیٚنٛہہ 'ڈیمو' کرنہٕ خٲطرٕ آسُن۔ کیٚنٛہہ تِتھ یُس تُہٕنٛدِن یوزرن یا کلائنٹن خٲطرٕ قدر پیدا کرِ۔<br/><br/>یتھ سکرینس پؠٹھ ہیکِو تۄہہِ پننۍ ٹاسک لِسٹ منظم تہٕ مینیج کٔرِتھ، ڈریگ تہٕ ڈراپ ذریعہٕ پننِس Backlog ترجیح دِتھ تہٕ Backlog آیٹم پننِس موجودہ سپرنٹس منٛز منتقل کٔرِتھ۔<br/>مزید معلومات یژھان؟ ٹور کٔرِو شروع یا بند کٔرِو تہٕ کٔرِو شروعات!"
text.glad_youre_here="اسۍ چھِ خوش زِ تۄہہِ چھِو یتہِ۔ یِیِو، اکہِ منٹس منٛز کرَو واقفیت۔"
text.business_research_section="سون بزنس ریسرچ حصہ چھُ تُہٕنٛدِن خیالن ہُند نوٚو گھر۔ یہِ حصہ چھُ تۄہہِ کسٹمر ڈیولپمنٹ، مسئلہ تحقیق تہٕ حل سوچنٕکۍ قدم پار کرناونہٕ خٲطرٕ بناونہٕ آمُت۔"
text.our_roadmap_design="سون روڈ میپ چھُ تۄہہِ لۄکٹین، قابلِ انتظام سنگِ میلن پؠٹھہٕ بٔڑِس تصویرس مکمل کرنس تام واتناونہٕ خٲطرٕ بناونہٕ آمُت۔ لگ بگ 3 ریتن ہٕنٛدۍ سنگِ میل کٔرِو پلان تہٕ ہدفس پؠٹھ روزنہٕ خٲطرٕ ورتٲوِو یِم پروجیکٹ نشان۔"
text.this_is_where_you_spend_most_time="یتہِ گُزارِو تۄہہِ زیادٕ تر وقت — کٲم کٔرِتھ۔ پننۍ 2 ہفتن ہٕنٛدۍ سپرنٹ کٔرِو پلان تہٕ Kanban بورڈ تہٕ سٲنِس Backlog ٹولن سٟتۍ کٔرِو کامیٲبی سان عمل۔ اگلِس سپرنٹس خٲطرٕ بہتر گژھنہٕ ورتٲوِو ریٹروسپیکٹو۔"
text.idea_board_helper_content="یہِ چھےٚ پننۍ سٲری خیال جمع کرنٕچ جاے۔ نوٚو خیالن پؠٹھ کٔرِو پننِس ٹیمہٕ سٟتۍ بحث تہٕ پننِن خیالن کُن پیش رفت وُچھنہٕ خٲطرٕ کٔرِو سنگِ میل منسلک۔"
text.kanban_helper_content="Kanban چھُ جاپٲنی زبٲنۍ ہُند لفظ یَمیُک مطلب چھُ 'کارڈ'۔ Kanban بورڈ کٔرۍ Toyota کِن انجینیرو 1940 ہٕنٛزِ دہایہِ منٛز Lean مینوفیکچرنگ سٟتۍ شروع۔<br/>یہِ چھُ معلومات تہٕ کٲمہِ ہٕنٛز پیش رفت جلدی بصری طور شیئر کرنہٕ خٲطرٕ ورتاونہٕ یِوان۔<br/>Kanban بورڈ چھِ کٲم تہٕ سٹیٹس وُچھناونہٕ، فعال یا جٲری کٲم مینیج کرنہٕ، ورک فلو مینیج کرنہٕ تہٕ Lean بہتری کُن جلد قدم تُلنہٕ خٲطرٕ کارآمد۔"
text.my_timesheets_helper_content="ٹائم شیٹ چھےٚ کُنہِ ٹاسکس پؠٹھ اصل منٛز کٲم کٔرمٕتۍ گَنٹہٕ ٹریک کرنٕچ جاے۔<br/>یہِ چھُ بِلنگ خٲطرٕ کارآمد، مگر یہِ ثابت کرنہٕ خٲطرٕ تہِ زِ تۄہہِ کوٚتہٕ جان پٲٹھۍ چھِو پننۍ ٹاسک برونٛہہ پلان کران۔<br/>وقتس سٟتۍ ہیکہِ Leantime پلاننگ ہٕنٛدۍ فرق مدِ نظر تھٲوِتھ آخری تٲریخہٕ ایڈجسٹ کٔرِتھ۔"
text.new_project_helper_content="<p>یتہِ کٔرِو تۄہہِ پننِس پروجیکٹس بیان، طے تہٕ اَمیُک پیرامیٹر سیٹ۔ یہِ چھُ اہم کیازِ یہِ چھُ سُہ حصہ یُس<br/>پوٗرِس ٹیمس ونان زِ پروجیکٹکۍ ترجیحات، توقعات تہٕ رہنما اصول کیاہ چھِ۔</p><p><br/><em>یتہِ سوچنہٕ وٲلۍ چیز: 4C۔<br/>واضح (Clear)، مختصر (Concise)، مکمل (Complete) تہٕ معتبر (Credible) روزِو۔<br/><br/></em></p><p>پننین پروجیکٹ تفصیلن منٛز یِم چیز ماہرانہ پٲٹھۍ شٲمِل کرنہٕ سٟتۍ روزان سٲری اکہِ صفحس پؠٹھ تہٕ غلطی یا غلط قدمن ہُند خطرٕ گژھان کم۔</p><br/>شروع کرنُک وقت!<br/><br/>"
text.not_found_helper_content="<p>یتھ صفحس خٲطرٕ چھُ نہٕ اسہِ نِش وُنہِ تام کانٛہہ مواد۔<br/>یتہِ کیاہ کیاہ ہیکِو تۄہہِ کٔرِتھ، تتھ متعلق مزید زاننہٕ خٲطرٕ ورتٲوِو مہربٲنی کٔرِتھ بۄنہِ کُن سون 'مدد چھا ضرورت' لِنک۔</p>"
text.retros_helper_content="<p>ریٹروسپیکٹو چھِ کٲم، ٹیمہِ ہٕنٛزِ کارکردگی تہٕ بیشک پیش رفتس پؠٹھ مختصر غور و فکر۔<br/>یتہِ ہیکہِ تُہٕنٛز ٹیم کیٚنٛہہ وقت نِتھ یتھ پؠٹھ توجہ دِتھ زِ کیاہ گوٚو جان، کیاہ گوٚو نہٕ جان تہٕ اگلہِ لٹہِ کیاہ ہیکہِ الگ پٲٹھۍ کرنہٕ یِتھ۔<br/>اسۍ چھِ مشورٕ دِوان زِ باقاعدہ وقفن پؠٹھ کٔرِو اکھ جائزہ میٹنگ، یا کم از کم پرٛتھ سنگِ میلس پتہٕ۔<br/></p>"
text.roadmap_helper_content="<p>روڈ میپ چھِ بٔڈۍ پروجیکٹ لۄکٹین تہٕ قابلِ انتظام حصن منٛز بٲگرنہٕ خٲطرٕ کارآمد۔<br/><br/></p><p>پنُن روڈ میپ بناونہٕ خٲطرٕ چھِ اسۍ مشورٕ دِوان زِ تِتھۍ سنگِ میل کٔرِو سیٹ یِم 3 ریتن اندر حاصل ہیکن سپدِتھ۔</p><p>سنگِ میل چھِ پروجیکٹ مکمل کرنہٕ کِس راستس پؠٹھ چیک پوائنٹ۔<br/>سادٕ لفظن منٛز: اگر تۄہہِ پوٗرِس ملکس منٛز روڈ ٹرپ کران چھِو، تیٚلہِ ہیکہِ پرٛتھ ریاست یۄسہٕ تۄہہِ پار کٔرِو اکھ سنگِ میل آسِتھ۔<br/><br/>شروع کرنہٕ خٲطرٕ کٔرِو پؠٹھمہِ کونہٕ منٛز 'سنگِ میل شٲمِل کٔرِو' پؠٹھ کلِک۔ تٲریخ کٔرِو یتھ ٹیبس پؠٹھ سیٹ، یا روڈ میپ چارٹس منٛزٕے کیلنڈرس اندر سنگِ میل کلِک تہٕ ڈریگ کٔرِتھ۔</p>"
text.show_clients_helper_content="<p>کلائنٹ/پروڈکٹ چھِ تُہٕنٛدۍ پروجیکٹ کیٹیگرین منٛز منظم کران تہٕ تۄہہِ الگ الگ گروپ الگ تھاونٕچ سہولت دِوان۔<br/><br/></p><p>بحیثیتِ کنسلٹنٹ چھِو تۄہہِ پٔہلے پٔے کلائنٹن سٟتۍ کٲم کران تہٕ یِمن منظم کرنٕچ جاے چھےٚ یہِ۔</p><p>اگر تۄہہِ پروڈکٹ ٹیم چھِو، تیٚلہِ ہیکِو تۄہہِ یہِ حصہ پننۍ شعبہٕ (مارکیٹنگ، سیلز، آپریشنز وغیرہ) منظم تہٕ الگ کرنہٕ خٲطرٕ ورتٲوِتھ۔</p>"
text.show_projects_helper_content="<p>پروجیکٹ چھِ تُہٕنٛدِ کاروبارُک تہٕ Leantime ہُند دِل! تبدیلی، ترقی، مقصد تہٕ پرٛتھ تتھ چیزس منٛز یُس تۄہہِ بنٲوِتھ یا سوچِتھ ہیکِو، آسن پروجیکٹ شٲمِل۔<br/>پروجیکٹ مینجمنٹ چھُ صِرف یہِ یقینی بناونُک عمل زِ تُہٕنٛدۍ پروجیکٹ گژھن وقتس پؠٹھ، صحیح پٲٹھۍ تہٕ اصل کاروباری قدرِ سٟتۍ ڈیلیور۔<br/><br/>یتہِ روزن تُہٕنٛدۍ پروجیکٹ۔ تُہٕنٛدِ پروجیکٹ صفحس پؠٹھ ہیکِو تۄہہِ پروجیکٹ بنٲوِتھ، ٹاسکن ہٕنٛز تعداد، گَنٹہٕ، بجٹ تہٕ پروجیکٹس سٟتۍ وابستہ کلائنٹ جلد وُچھِتھ۔<br/><br/>پننِن سٲرِنی پروجیکٹن ہُند مختصر جائزٕ ہیٚنہٕ خٲطرٕ ورتٲوِو یہِ صفحہ۔<br/><br/></p>"
text.new_db_version="اکھ نوٚو ورژن آو انسٹال کرنہٕ۔ Leantime ورتاونہٕ خٲطرٕ پَزِ تۄہہِ پنُن ڈیٹا بیس اپڈیٹ کرُن۔<br/><br/><strong>یہِ اپڈیٹ کرنہٕ برونٛہہ کٔرِو مہربٲنی کٔرِتھ پننِس ڈیٹا بیسُک بیک اپ!</strong><br/>اَتھ ہیکن کیٚنٛہہ منٹ لگِتھ۔"
