text.onboarding_default_project_details="Leantime منٛز پننِس گۄڈنِکِس پروجیکٹس منٛز خوش آمدید!<br />یہِ چھےٚ تُہٕنٛز جاے ٹاسک منظم کرنہٕ، مقصد ٹریک کرنہٕ تہٕ پننِس کٲمہِ ہٕنٛز منصوبہ بندی کرنہٕ خٲطرٕ۔ یتہِ کٔرِو بلا جھجک کینٛہہ تہِ تبدیل، یا برونٛہہ پکنہٕ سٟتۍ بنٲوِو مزید پروجیکٹ۔ یہِ پروجیکٹ چھُ صِرف تۄہہِ شروعات کرنہٕ خٲطرٕ"
