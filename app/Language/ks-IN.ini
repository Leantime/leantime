text.my_work_dashboard_intro="تُہُنٛد «میٲنۍ کٲم» ڈیش بورڈ چھُ سورُی اہم اکہِ جایہِ انان۔<br/>تُہٕنٛز سارٕوے کھوتہٕ اہم کٲم چھےٚ وۄنۍ سامنہٕ، صِرف تۄہہِ خٲطرٕ تہٕ تُہٕنٛدِ دماغٕکہِ بہترین طریقہٕ مطابق ترتیب دِنہٕ آمٕژ۔<br/><br/>لۄکٹیٚن ٹاسکو پؠٹھہٕ بٔڈیٚن مقصدن تام، سورُی یُس تۄہہِ ضرورت چھُ، چھُ یتیٚے۔ یہِ چھےٚ تُہٕنٛز جاے خیال درج کرنہٕ، پیش رفت ٹریک کرنہٕ تہٕ وَتہِ منٛز کامیٲبی منٲونہٕ خٲطرٕ۔"
text.blueprints_intro="خاکہ چھِ سورُی ڈیٹا سمجھنُک موقعہ۔ Leantime منٛز چھِ واریاہ ٹول تہٕ کینوس یِمو سٟتۍ تۄہہِ بزنس ماڈل کینوس، SWOT تجزیہ یا ایمپیتھی میپ ذریعہٕ پنُن پروجیکٹ پس منظر واضح ہیکِو کٔرِتھ۔<br/><br/>اگر تۄہہِ پتہٕ چھُ نہٕ زِ کتہِ پؠٹھہٕ شروع کرُن، تیٚلہِ چھےٚ سٲنۍ تجویز زِ بنٲوِو اکھ «پروجیکٹ ویلیو کینوس»۔ یہِ کینوس دِیِ تُہٕنٛدِس پروجیکٹس متعلق سارٕوے کھوتہٕ اہم سوالن ہُند جواب: تُہُنٛد کسٹمر کُس چھُ؟<br/>تۄہہِ کُس مسئلہ چھِو حل کران؟<br/>تُہُنٛد حل کیاہ چھُ؟<br/>تُہُنٛد حل کیاہ فائدہ چھُ دیوان پننیٚن مقابلہ کرن وٲلیٚن کھوتہٕ<br/>"
text.goals_tour_intro="مقصد چھِ تۄہہِ پنُن پروجیکٹ حاصل کرنہٕ لایق، قابلِ پیمائش تہٕ قابلِ عمل حصن منٛز بٲگرنس منٛز مدد کران۔<br/>ییٚلہِ زَن سنگِ میل عمل درآمدس پؠٹھ توجہ دیوان چھِ، مقصد چھِ تِمن میٹرکسن متعلق یِم تۄہہِ حاصل کرُن یژھان چھِو۔<br/>پرٛتھ مقصدس گژھِ اکھ واضح ہدف آسُن (سُہ چیز یُس تۄہہِ حاصل کرُن یژھان چھِو) تہٕ سُہ گژھِ اکہِ میٹرکہٕ سٟتۍ آسٲنی سان ناپنہٕ یِنہٕ لایق آسُن۔<br/><br/>ییٚلہِ تۄہہِ اکھ مقصد آسہِ، تۄہہِ ہیکِو اَتھ سنگِ میل اسائن کٔرِتھ تاکہ یہِ قابلِ عمل ٹاسکن منٛز بٲگرنہٕ یِیہِ۔<br/>"
text.project_dashboard_tour_intro="Leantime منٛز پروجیکٹ چھِ اشتراکی ورک سپیس یتہِ تۄہہِ تہٕ تُہٕنٛز ٹیم کٲم مؤثر طریقہٕ ترتیب دِتھ، ٹریک کٔرِتھ تہٕ مکمل ہیکِو کٔرِتھ۔ پرٛتھ پروجیکٹ چھُ متعلقہ مقصدن، ٹاسکن تہٕ سنگِ میلن ہُند کنٹینر، تہٕ تۄہہِ ہیکِو اکہِ مرکزی جایہِ پیش رفت نگرانی کٔرِتھ۔<br/><br/>چاہے تۄہہِ کٲم، سکول یا اندرونی ذٲتی منصوبہ سنبھالان آسِو، Leantime پروجیکٹ چھِ خیالن کامیاب نتیجن منٛز بدلاونہٕ خٲطرٕ ضروری ڈھانچہ تہٕ ٹول دیوان۔"
text.wiki_tour_intro="سٲنۍ دستاویز چھِ تۄہہِ پننہِ ٹیمہِ سٟتۍ دستاویز لیکھنس تہٕ شیئر کرنس منٛز مدد کران۔ تۄہہِ ہیکِو پنٕنۍ دستاویز ٹیمن، علاقن یا دستاویز کیٹیگری منٛز ترتیب دِنہٕ خٲطرٕ واریاہ سپیس بنٲوِتھ۔<br/>علم، عمل تہٕ طریقہ کار شیئر کرنہٕ خٲطرٕ بنٲوِو دستاویز۔ تۄہہِ ہیکِو پننِس کلاؤڈ سٹوریجس منٛز کُنہِ فائلہِ یا فولڈرٕچ لِنک شیئر کرنہٕ خٲطرٕ تہِ اکھ دستاویز بنٲوِتھ۔<br/>"
text.extend_leantime_latest_plugins="سٲنیٚن تازہ ترین پلگ اِنن سٟتۍ کٔرِو Leantime وسیع۔"
support.headline_help_us_build="سٲنۍ مدد کٔرِو اکھ تِتھ مستقبل بناونس منٛز یتھ منٛز پرٛتھ دماغ پھلہِ پھولہِ!"
support.intro_text_1="زیادٕ تر پروڈکٹیویٹی ٹول چھِ یہِ فرض کران زِ سٲری چھِ اکہِ ہِوی پٲٹھۍ سوچان: لکیری انداز، مکمل توجہ سان، تہٕ مَن مانٕژن ڈیڈ لائنن سٟتۍ متحرک۔ چاہے تۄہہِ ADHD آسہِ تہٕ مکمل ٹاسکو سٟتۍ ڈوپامین ضرورت آسہِ، چاہے تۄہہِ آٹزم آسہِ تہٕ مستقل ڈھانچس ضرورت آسہِ، چاہے تۄہہِ ڈسلیکسیا آسہِ تہٕ تۄہہِ جگہِ کِس لحاظہٕ سوچان آسِو، یا تۄہہِ آسِو صِرف تِمن ٹولن نِشہِ تنگ آمٕتۍ یِم تُہٕنٛدِس دماغس سٟتۍ میل چھِ نہٕ کھیوان—تۄہہِ آسِو شاید پروجیکٹ مینجمنٹ پوٗرٕ پٲٹھۍ ترٲومُت۔"
support.intro_text_2="أسۍ چھِ Leantime تِمن دماغن خٲطرٕ بناوان یِم الگ پٲٹھۍ کٲم کران چھِ۔ اَتھ منٛز چھِ نیوروڈائیورجنٹ دماغ شٲمِل، مگر پرٛتھ سُہ شخص تہِ یَمِس زانٛہہ باسیوٚمُت چھُ زِ موجودہ ٹول چھِ تٔمۍ سٕنٛدِ قدرتی سوچنٕکہِ طریقس خلاف جنگ کران۔"
