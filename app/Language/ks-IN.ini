tour.my_work.customize_text="ڈریگ تہٕ ڈراپ ورتٲوِتھ ہیکِو تۄہہِ وِجٹن ہُند سائز بدلٲوِتھ تہٕ تِم یورٕ تورٕ منتقل کٔرِتھ۔"
tour.my_work.todos_title="میٲنۍ ٹاسک"
tour.my_work.todos_text="«میٲنۍ ٹاسک» وِجٹ چھُ تۄہہِ تِم سٲری ٹاسک ہاوان یِم وۄنۍ تۄہہِ اسائن چھِ۔"
tour.my_work.group_todos_title="ٹاسک گروپ کٔرِو"
tour.my_work.group_todos_text="یتہِ ڈراپ ڈاؤن ورتٲوِتھ ہیکِو تۄہہِ پننۍ ٹاسک پروجیکٹ کِس حسابہٕ فلٹر کٔرِتھ، یا ترجیح، سٹیٹس، پروجیکٹ یا تٲریخن کِس حسابہٕ گروپ کٔرِتھ۔"
tour.my_work.sort_todos_title="ٹاسک سارٹ کٔرِو"
tour.my_work.sort_todos_text="ہر ٹاسکٕچ ترتیب بدلاونہٕ خٲطرٕ ہیکِو تۄہہِ سُہ ڈریگ تہٕ ڈراپ کٔرِتھ۔ ٹاسک شیڈول کرنہٕ خٲطرٕ ہیکِو تۄہہِ سُہ کیلنڈرس پؠٹھ تہِ ڈریگ تہٕ ڈراپ کٔرِتھ۔"
tour.my_work.timer_title="ٹائمر شروع کٔرِو"
tour.my_work.timer_text="ییٚلہِ تۄہہِ کُنہِ ٹاسکس پؠٹھ کٲم شروع کرنہٕ خٲطرٕ تیار آسِو، تیٚلہِ کٔرِو صِرف ٹائمر شروع کرنٕکِس بٹنس پؠٹھ کلک۔"
tour.my_work.complete_task_title="ٹاسک مکمل کٔرِو"
tour.my_work.complete_task_text="ییٚلہِ کانٛہہ ٹاسک مکمل گژھِ، تیٚلہِ ہیکِو تۄہہِ سٹیٹس ڈراپ ڈاؤنس پؠٹھ کلک کٔرِتھ سُہ «مکمل» نشان زد کٔرِتھ۔"
tour.my_work.add_tasks_title="مزید ٹاسک شٲمِل کٔرِو"
tour.my_work.add_tasks_text="ہر سیکشنس منٛز پلس بٹنس پؠٹھ کلک کٔرِتھ، یا ہر ٹاسکس نِش موجود 3 ڈاٹ مینوٗ ورتٲوِتھ ہیکِو تۄہہِ مزید ٹاسک شٲمِل کٔرِتھ۔"
tour.my_work.finish_text="تۄہہِ کوٚر «میٲنۍ کٲم» ڈیش بورڈ ٹور مکمل۔ Leantime منٛز پروجیکٹ مینجمنٹ مُتعلق مزید زاننہٕ خٲطرٕ گٔژھِو <a href='%s/dashboard/show'>پننِس پروجیکٹس</a> پؠٹھ۔"
tour.project_dashboard.menu_title="پروجیکٹ مینوٗ"
tour.project_dashboard.menu_text="پروجیکٹ مینوٗ چھُ تُہُنٛد پروجیکٹ مختلف سیکشنن منٛز تقسیم کران: <strong>ڈیٹا روم</strong> - پننۍ سٲری فائل تہٕ معلومات تھاونہٕ خٲطرٕ، <strong>سوچِو</strong> - حکمتِ عملی بناونہٕ، خیال سازی تہٕ وضاحت خٲطرٕ، <strong>بنٲوِو</strong> - مقصد، سنگِ میل تہٕ ٹاسک منظم کرنہٕ خٲطرٕ۔"
tour.project_dashboard.selector_title="پروجیکٹ سلیکٹر"
tour.project_dashboard.selector_text="پروجیکٹن درمیان بدلاونہٕ خٲطرٕ ورتٲوِو پروجیکٹ سلیکٹر۔ کھوٚوُر مینوٗ چھُ تُہٕنٛدِس موجودہ پروجیکٹس سٟتۍ وابستہ سورُے ہاوان۔"
tour.project_dashboard.checklist_title="چیک لِسٹ"
tour.project_dashboard.checklist_text="پروجیکٹ چیک لِسٹ سٟتۍ ہیکِو تۄہہِ جلدی وُچھِتھ زِ کیا تُہٕنٛدِس پروجیکٹس منٛز چھےٚ کامیاب عمل درآمد خٲطرٕ سٲری ضروری معلومات موجود۔"
tour.project_dashboard.status_title="فوری سٹیٹس اپڈیٹ"
tour.project_dashboard.status_text="سٹیٹس اپڈیٹو سٟتۍ ہیکِو تۄہہِ وۄزُل، لیوٚدُر تہٕ سبز رنگ ورتٲوِتھ پننِس ٹیمس سٟتۍ پروجیکٹٕچ پیش رفت جلدی شیئر کٔرِتھ۔ سٹیٹس یِیہِ پوری ایپلیکیشنس منٛز نظر۔"
tour.project_dashboard.progress_title="پیش رفت"
tour.project_dashboard.progress_text="پروجیکٹ پیش رفت انڈیکیٹر چھُ تۄہہِ ہاوان زِ تۄہہِ کوٚتاہ کٲم چھےٚ مکمل کٔرمٕژ۔ یہِ چھُ مختلف ٹاسک سائز، ٹیمٕچ رفتار تہٕ پروجیکٹکۍ سنگِ میل تہِ مدِ نظر تھاوان۔"
tour.project_dashboard.latest_tasks_title="تازہ ترین ٹاسک"
tour.project_dashboard.latest_tasks_text="تازہ ترین ٹاسکن ہٕنٛز لِسٹ چھےٚ تۄہہِ پروجیکٹس منٛز حالیہ شٲمِل کرنہٕ آمٕتۍ ٹاسک ہاوان، تہٕ تۄہہِ ہیکِو اَتھ پروجیکٹ اِن باکس کِہ پٲٹھۍ ورتٲوِتھ۔"
tour.project_dashboard.team_title="ٹیم"
tour.project_dashboard.team_text="ٹیم باکس چھُ تۄہہِ یتھ پروجیکٹس ہٕنٛدۍ ممبر ہاوان۔"
tour.project_dashboard.finish_text="تۄہہِ کوٚر پروجیکٹ ڈیش بورڈ ٹور مکمل۔ Leantime منٛز پننۍ ٹاسک منظم کرنٕکۍ مختلف طریقہٕ زاننہٕ خٲطرٕ گٔژھِو <a href='%s/tickets/showKanban'>ٹاسک</a> صفحس پؠٹھ۔"
tour.kanban_board.overview_title="تُہُنٛد Kanban بورڈ"
tour.kanban_board.overview_text="یہِ چھُ تُہُنٛد Kanban بورڈ۔ یہِ چھُ تۄہہِ پننۍ کٲم بصری طور وُچھنس تہٕ جٲری کٲم محدود تھاونس منٛز مدد کران۔"
tour.kanban_board.workflow_title="ورک فلو"
tour.kanban_board.workflow_text="ٹاسک چھِ پیش رفت سان کھوٚوُر طرفہٕ دۄچھُن طرفس کُن پکان۔ تِہنٛد سٹیٹس اپڈیٹ کرنہٕ خٲطرٕ کٔرِو کارڈ ڈریگ تہٕ ڈراپ۔"
tour.kanban_board.columns_title="لچکدار کالم"
tour.kanban_board.columns_text="3 ڈاٹ مینوٗ ورتٲوِتھ ہیکِو تۄہہِ کالم شٲمِل کٔرِتھ، ہٹٲوِتھ تہٕ تِہنٛد ناو بدلٲوِتھ۔"
tour.kanban_board.filter_title="ٹاسک فلٹر کٔرِو"
tour.kanban_board.filter_text="تۄہہِ ہیکِو پننۍ ٹاسک مختلف فیلڈن ہِوۍ ترجیح، سٹیٹس، پروجیکٹ یا تٲریخن کِس حسابہٕ فلٹر کٔرِتھ۔"
tour.kanban_board.swimlanes_title="سوئم لین"
tour.kanban_board.swimlanes_text="اَمہِ علاوہ ہیکِو تۄہہِ پننۍ ٹاسک گروپ کٔرِتھ Kanban سوئم لین بنٲوِتھ۔ یہِ چھُ تۄہہِ پننۍ کٲم ٹیم ممبرن، ترجیح یا سنگِ میلن کِس حسابہٕ بصری طور وُچھنس منٛز مدد کران۔"
tour.kanban_board.sprints_title="سپرنٹ"
tour.kanban_board.sprints_text="اگر تۄہہِ پننۍ کٲم سپرنٹن منٛز منظم کران چھِو، تیٚلہِ ہیکِو تۄہہِ یتہِ ڈراپ ڈاؤن ورتٲوِتھ سپرنٹ ژٲرِتھ، بنٲوِتھ تہٕ اپڈیٹ کٔرِتھ۔"
tour.kanban_board.finish_text="یتھ سٟتۍ گوٚو Kanban ٹور مکمل۔ Leantime منٛز سنگِ میل بناونُک تہٕ منظم کرنُک طریقہٕ ہیچھنہٕ خٲطرٕ گٔژھِو <a href='%s/tickets/roadmap'>سنگِ میل</a> صفحس پؠٹھ۔"
tour.milestones.overview_title="سنگِ میل"
tour.milestones.overview_text="سنگِ میل چھِ تۄہہِ اہم نتیجہٕ تہٕ پروجیکٹکۍ مرحلہٕ ٹریک کرنس منٛز مدد کران۔"
tour.milestones.drag_title="ڈریگ تہٕ سارٹ"
tour.milestones.drag_text="ہر بار چھُ اکھ سنگِ میل ظاہر کران۔ تۄہہِ ہیکِو یِم ٹائم لائنس پؠٹھ ڈریگ کٔرِتھ، تِہنٛز ترتیب بدلٲوِتھ تہٕ تِہنٛد سائز بدلٲوِتھ۔ یتھ سکرینس پؠٹھ یُس تہِ تۄہہِ کرِو، سُہ چھُ تُہٕنٛدیٚن سنگِ میلن ہُند وقت اپڈیٹ کران۔"
tour.milestones.filter_title="فلٹر"
tour.milestones.filter_text="تۄہہِ ہیکِو پننۍ سنگِ میل فلٹر کٔرِتھ تہٕ تِم ٹاسک تہِ وُچھِتھ یِم یِمن ہُند حصہ چھِ۔"
tour.milestones.timeframes_title="ٹائم فریم"
tour.milestones.timeframes_text="ٹائم لائن ویوٕچ ٹائم فریم بدلٲوِتھ ہیکِو تۄہہِ ؤرِیُک زیادٕ حصہ وُچھِتھ یا دۄہہ وار تفصیلس منٛز گہرٲیی سان گٔژھِتھ۔"
tour.milestones.finish_text="یتھ سٟتۍ گوٚو سنگِ میل ٹور مکمل۔ Leantime منٛز مقصد بناونُک تہٕ منظم کرنُک طریقہٕ ہیچھنہٕ خٲطرٕ گٔژھِو <a href='%s/goalcanvas/dashboard'>مقصد</a> صفحس پؠٹھ۔"
tour.goals.overview_title="مقصد"
tour.goals.overview_text="مقصد چھِ تۄہہِ پننیٚن پروجیکٹن پؠٹھ قابلِ پیمائش اثر ٹریک کرنس منٛز مدد کران۔"
tour.goals.parts_title="ہدف تہٕ میٹرک"
tour.goals.parts_text="ہر مقصد چھُ اکِس ہدفس (یُس تۄہہِ حاصل کرنٕچ کوشش کران چھِو) تہٕ اکِس میٹرکس (یَمہِ سٟتۍ تۄہہِ اَتھ ناپِو) پؠٹھ مشتمل۔"
tour.goals.progress_title="مقصدٕچ پیش رفت"
tour.goals.progress_text="ییٚلہِ تۄہہِ پننیٚن مقصدن ہٕنٛدۍ میٹرک اپڈیٹ کرِو، تیٚلہِ ہاوِ پیش رفت بار تۄہہِ زِ تۄہہِ کوٚتاہ برونٛہہ چھِو واتمٕتۍ۔"
tour.goals.milestones_title="سنگِ میل تہٕ مقصد"
tour.goals.milestones_text="پننیٚن مقصدن ہٕنٛز ٹاسک لیول پیش رفت ٹریک کرنہٕ خٲطرٕ ہیکِو تۄہہِ مقصد سنگِ میلن سٟتۍ لِنک کٔرِتھ۔ یہِ چھُ پروجیکٹ منصوبس منٛز کمی پہچاننس منٛز مدد کران۔"
tour.goals.finish_text="یتھ سٟتۍ گوٚو مقصد ٹور مکمل۔ سنگِ میل، مقصد تہٕ ٹاسک چھِ Leantime منٛز بنیادی تعمیری حصہ۔ یِم ورتٲوِتھ کٔرِو پننۍ کٲم سنبالنہٕ لایق حصن منٛز تقسیم۔ پننۍ ٹاسک وُچھنہٕ خٲطرٕ گٔژھِو <a href='%s/tickets/showKanban'>Kanban بورڈس</a> پؠٹھ۔"
