text.lean.helper_content="Lean Canvas vă ghidează prin întregul proces de validare a noii idei de afacere și/sau de produs.<br/>Veți aborda <em>segmentul de clienți</em>, <em>problema și soluția</em>.<br/>De acolo veți trece la <em>propunerea de valoare unică</em> (ce face ideea dvs. mai bună decât alte oferte?), <em>canalele de distribuție</em> (cum veți ajunge cu soluția la clienți?), <em>sursele de venit</em> (cum va aduce bani soluția?), <em>structura costurilor</em> (cât valorează soluția?), <em>indicatorii-cheie</em> (cum veți măsura succesul?) și <em>avantajul competitiv greu de copiat</em> (ce aveți care vă va ajuta să reușiți în fața concurenței?)<br/>Răspunsurile la aceste întrebări sunt menite să favorizeze succesul, să reducă riscul de eșec și să vă permită să urmăriți și să validați ipotezele. Abordarea Lean înseamnă eliminarea risipei și construirea de produse, afaceri și soluții de care clienții au nevoie."
text.lean.disclaimer="Lean Canvas este adaptat după <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> și este licențiat sub licența <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Când vă simțiți pregătit cu Lean Canvas-ul, mergeți la</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Planificatorul foii de parcurs</a>"


