support.marcel_bio_1="Instrumentele tradiționale de management de proiect nu au funcționat niciodată pentru mine. Păreau construite de minți neurotipice pentru minți neurotipice. Când lucram ca freelancer și mă chinuiam să țin organizate proiectele clienților, am început să construiesc ceva care să funcționeze cu mintea mea, nu împotriva ei."
support.marcel_bio_2="Ceea ce a început ca o soluție personală a devenit Leantime când mi-am dat seama că milioane de alți oameni aveau nevoie de același lucru."
support.gloria_name="👋 Iar eu sunt Gloria"
support.gloria_tagline="Fostă asistentă medicală la urgențe devenită product manager, antreprenoare hispanică din prima generație."
support.gloria_bio_1="Am petrecut ani de zile în medii medicale cu presiune mare, unde organizarea salvează literalmente vieți. Dar când mi-am deschis propria afacere, instrumentele tradiționale de proiect mi s-au părut copleșitoare și deconectate de felul în care gândesc și lucrez de fapt."
support.gloria_bio_2="Pregătirea mea în științe comportamentale și în cercetarea motivației influențează modul în care construim funcționalități care nu doar organizează sarcinile — ci vă ajută să vă doriți cu adevărat să le finalizați."
support.closing_text="Putem crea o lume în care nimeni nu trebuie să se lupte cu instrumentele sale pentru a face o muncă excelentă. Sponsorizarea dvs. finanțează un viitor în care software-ul se adaptează diversității umane, nu invers."
support.headline_ready_to_impact="Sunteți gata să aveți un impact direct?"
support.contribution_text="Fiecare contribuție — de la 1 $ la 100 $ — merge direct către îmbunătățirea Leantime pentru toată lumea."
support.start_sponsoring_button="Începeți să sponsorizați astăzi"
