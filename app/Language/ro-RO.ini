label.webhook_notifications_description="Trimiteți notificările către propriul endpoint HTTPS. Pentru fiecare notificare de proiect pentru care sunteți eligibil, Leantime trimite o cerere HTTP POST cu un corp JSON către acest URL. Cererile sunt trimise în fundal și pot ajunge după câteva minute; o cerere eșuată nu este reîncercată. Categoriile și nivelurile pe proiect din fila Notificări decid ce notificări sunt eligibile, inclusiv modificările făcute de dumneavoastră. Dezactivarea notificărilor prin e-mail nu oprește webhookul. Webhookul trimite doar cât timp este activat și are un URL setat. URL-ul rămâne salvat cât timp webhookul este dezactivat — goliți URL-ul pentru a-l elimina."
