text.my_work_dashboard_intro="Tabloul de bord Munca mea aduce în prim-plan tot ce contează.<br/>Cea mai importantă muncă a dvs. este acum în centrul atenției, organizată special pentru dvs. și pentru felul în care mintea dvs. funcționează cel mai bine.<br/><br/>De la sarcini rapide la obiective ambițioase, tot ce aveți nevoie se află aici. Acesta este spațiul dvs. pentru a nota idei, a urmări progresul și a sărbători reușitele pe parcurs."
text.blueprints_intro="Planurile de proiect sunt ocazia dvs. de a da sens tuturor datelor. Leantime oferă o varietate de instrumente și canvasuri pentru a defini contextul proiectului prin Business Model Canvas, analiză SWOT sau hărți ale empatiei.<br/><br/>Dacă nu știți de unde să începeți, vă sugerăm să creați un „Project Value Canvas”. Acest canvas va răspunde la cele mai importante întrebări ale proiectului dvs.: Cine este clientul dvs.?<br/>Ce problemă rezolvați?<br/>Care este soluția dvs.?<br/>Ce avantaj oferă soluția dvs. față de concurenți?<br/>"
text.goals_tour_intro="Obiectivele vă permit să împărțiți proiectul în bucăți realizabile, măsurabile și acționabile.<br/>În timp ce reperele se concentrează pe execuție, obiectivele țin de indicatorii pe care doriți să îi atingeți.<br/>Fiecare obiectiv ar trebui să aibă un scop clar (ceea ce doriți să realizați) și să fie ușor de măsurat printr-un singur indicator.<br/><br/>După ce aveți un obiectiv, îi puteți atribui repere pentru a-l împărți în sarcini executabile.<br/>"
text.project_dashboard_tour_intro="Proiectele din Leantime sunt spații de lucru colaborative în care dvs. și echipa dvs. organizați, urmăriți și livrați munca în mod eficient. Fiecare proiect servește drept container pentru obiectivele, sarcinile și reperele asociate și vă permite să monitorizați progresul într-un singur loc central.<br/><br/>Fie că gestionați muncă, școală sau inițiative personale interne, proiectele Leantime oferă structura și instrumentele necesare pentru a transforma ideile în rezultate de succes."
text.wiki_tour_intro="Documentele vă permit să scrieți și să partajați documentație cu echipa dvs. Puteți crea mai multe spații pentru a organiza documentația pe echipe, domenii sau categorii de documente.<br/>Creați documente pentru a partaja cunoștințe, procese și proceduri. De asemenea, puteți crea un document pentru a partaja un link către un fișier sau un dosar din spațiul de stocare în cloud.<br/>"
text.extend_leantime_latest_plugins="Extindeți Leantime cu cele mai noi pluginuri."
support.headline_help_us_build="Ajutați-ne să construim un viitor în care toate mințile să prospere!"
support.intro_text_1="Majoritatea instrumentelor de productivitate presupun că toată lumea gândește la fel: liniar, cu o concentrare perfectă, motivată de termene arbitrare. Fie că aveți ADHD și aveți nevoie de doza de dopamină a sarcinilor finalizate, fie că sunteți autist și aveți nevoie de o structură constantă, fie că aveți dislexie și gândiți spațial, fie că pur și simplu v-ați săturat de instrumente care nu se potrivesc cu felul în care funcționează de fapt mintea dvs. — probabil ați renunțat cu totul la managementul de proiect."
support.intro_text_2="Construim Leantime pentru minți care funcționează diferit. Asta include creierele neurodivergente, dar și pe oricine a simțit vreodată că instrumentele existente luptă împotriva modului său natural de a gândi."
