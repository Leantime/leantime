text.mattermost_instructions=" Această integrare va publica notificări de actualizare în canalul ales de dvs.<br/>Urmați instrucțiunile <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>de aici pentru a obține un URL de Incoming Webhook</a> din Mattermost. Apoi lipiți linkul în formularul din dreapta și faceți clic pe Salvați."
text.slack_instructions="Această integrare va publica notificări de actualizare în canalul ales de dvs.<br/>Urmați instrucțiunile <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>de aici pentru a obține un URL de Incoming Webhook</a> din Slack. Apoi lipiți linkul în formularul din dreapta și faceți clic pe Salvați."
text.choose_access_for_users="Bifați sau debifați utilizatorii pe care doriți să-i adăugați/eliminați. Puteți afla mai multe despre roluri la <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Finalizare estimată până la"
text.zulip_instructions="Această integrare va publica notificări de actualizare în fluxul și subiectul alese de dvs.<br/>Urmați instrucțiunile <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>de aici pentru a crea un bot nou</a>. Apoi lipiți informațiile în formularul din dreapta și faceți clic pe Salvați."
text.discord_instructions="Această integrare va publica notificări de actualizare în canalul ales de dvs.<br/>Urmați instrucțiunile <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>de aici pentru a crea unul sau mai multe webhookuri</a>, apoi lipiți linkul (linkurile) în câmpurile din dreapta și faceți clic pe Salvați."
text.no_conclusion_yet="<i>Încă nicio concluzie</i>"
text.no_users_assigned_to_this_client="Nu au fost adăugate contacte la acest client. Adăugați și atribuiți utilizatori <a href='/users/showAll'>aici</a>"
text.confirm_delete_timesheet="Sigur doriți să ștergeți această înregistrare de timp?"
text.timer_on_todo="<span class='head-icon fa fa-stop'></span> Cronometru: %1$s pe %2$s"
text.these_are_system_wide_settings="Acestea sunt setări la nivel de sistem care vor afecta aspectul experienței dvs. Leantime."
text.company_name_helper="Apare în titlul paginii și în e-mailuri"
text.advanced_boards_helper_content="Ideile evoluează, cresc și se maturizează. Aici le puteți urmări.<br/>Mutați cardurile de idei dintr-o coloană în alta pentru a reflecta starea lor curentă.<br/>Este un loc bun pentru a începe cercetarea, a dezvolta prototipuri și a le valida cu câțiva clienți înainte de a începe implementarea."
text.backlog_helper_content="Backlogul este casa tuturor sarcinilor dvs.: cele la care lucrați acum și cele pe care plănuiți să le abordați.<br/><br/>Pentru a avansa în finalizarea backlogului, vă recomandăm să lucrați în iterații scurte - sprinturi.<br/>Sprinturile sunt intervale de două săptămâni care vă permit să vă concentrați pe bucăți de lucru mai mici, livrabile.<br/>La finalul celor două săptămâni ar trebui să aveți ceva de „demonstrat”. Ceva ce aduce valoare utilizatorilor sau clienților dvs.<br/><br/>Pe acest ecran vă puteți organiza și gestiona lista de sarcini, vă puteți prioritiza backlogul prin glisare și plasare și puteți muta elemente din backlog în sprintul curent.<br/>Doriți mai multe informații? Începeți turul sau închideți pentru a începe!"
text.glad_youre_here="Ne bucurăm că sunteți aici. Haideți să facem cunoștință în câteva minute."
text.business_research_section="Secțiunea de cercetare de business este noul loc pentru ideile dvs. Este concepută să vă ghideze prin pașii dezvoltării clienților, cercetării problemei și generării de soluții."
text.our_roadmap_design="Foaia noastră de parcurs este concepută să vă ducă de la repere mai mici, ușor de gestionat, până la finalizarea imaginii de ansamblu. Planificați repere de aproximativ 3 luni și folosiți aceste puncte de control pentru a rămâne pe drumul cel bun."
text.this_is_where_you_spend_most_time="Aici veți petrece cea mai mare parte a timpului - lucrând efectiv. Planificați sprinturi de 2 săptămâni și executați-le cu succes cu panoul Kanban și instrumentele noastre de backlog. Folosiți retrospectivele pentru a progresa în următorul sprint."
text.idea_board_helper_content="Aici vă colectați toate ideile. Discutați-le pe cele noi cu echipa și atașați repere pentru a vedea progresul ideilor."
text.kanban_helper_content="Kanban este cuvântul japonez pentru „card”. Panourile Kanban au fost introduse de inginerii Toyota în anii '40, odată cu producția Lean.<br/>Sunt folosite pentru a partaja rapid și vizual informații și progresul muncii.<br/>Panourile Kanban sunt utile pentru a vizualiza munca și starea ei, pentru a gestiona munca activă sau în desfășurare, fluxul de lucru și pentru a acționa rapid către îmbunătățiri lean."
text.my_timesheets_helper_content="Pontajele sunt locul în care urmăriți orele efectiv lucrate la o sarcină.<br/>Acest lucru este util pentru facturare, dar și pentru a verifica cât de bine vă planificați sarcinile în avans.<br/>În timp, Leantime poate ajusta termenele pentru a ține cont de discrepanțele de planificare."
text.new_project_helper_content="<p>Aici veți descrie, defini și stabili parametrii proiectului. Acest lucru este important, deoarece aceasta este partea care comunică<br/>întregii echipe care sunt prioritățile, așteptările și liniile directoare ale proiectului.</p><p><br/><em>Lucruri la care să vă gândiți aici: cei 4C.<br/>Fiți clar, concis, complet și credibil.<br/><br/></em></p><p>Aplicarea acestor principii în descrierile proiectelor îi menține pe toți pe aceeași lungime de undă și ajută la reducerea riscului de erori sau pași greșiți.</p><br/>Este timpul să începem!<br/><br/>"
text.not_found_helper_content="<p>Încă nu avem conținut pentru această pagină.<br/>Vă rugăm să folosiți linkul „Aveți nevoie de ajutor” din partea de jos pentru a afla mai multe despre ce puteți face aici.</p>"
text.retros_helper_content="<p>Retrospectivele sunt reflecții rapide asupra muncii, funcționării echipei și, desigur, progresului.<br/>Aici echipa se poate opri un moment pentru a se concentra pe ce a mers bine, ce nu a mers bine și ce s-ar putea face diferit data viitoare.<br/>Vă recomandăm să organizați o ședință de analiză la intervale regulate sau, cel puțin, la finalul fiecărui reper.<br/></p>"
text.roadmap_helper_content="<p>Foile de parcurs sunt utile pentru a împărți proiectele mari în bucăți mai mici și mai ușor de gestionat.<br/><br/></p><p>Pentru a vă crea foaia de parcurs, vă recomandăm să stabiliți repere care pot fi atinse într-un interval de 3 luni.</p><p>Reperele sunt puncte de control pe drumul spre finalizarea proiectului.<br/>Pe scurt: dacă faceți o călătorie cu mașina prin toată țara, fiecare regiune prin care treceți ar putea fi un reper.<br/><br/>Faceți clic pe „Adăugați reper” în partea din stânga sus pentru a începe. Setați data în această filă sau direct în graficul foii de parcurs, făcând clic și trăgând reperul în calendar.</p>"
text.show_clients_helper_content="<p>Clienții/Produsele vă organizează proiectele în categorii și vă permit să izolați grupuri diferite.<br/><br/></p><p>Ca și consultant, lucrați deja cu clienți, iar aici îi puteți organiza.</p><p>Dacă sunteți o echipă de produs, puteți folosi această secțiune pentru a vă organiza și izola departamentele (marketing, vânzări, operațiuni etc.).</p>"
text.show_projects_helper_content="<p>Proiectele sunt inima afacerii dvs. și a Leantime! Schimbarea, dezvoltarea, obiectivele și tot ce puteți construi sau visa vor implica proiecte.<br/>Managementul de proiect este pur și simplu procesul prin care vă asigurați că proiectele sunt livrate la timp, corect și cu valoare reală de business.<br/><br/>Aici se vor afla proiectele dvs. Pagina de proiecte vă permite să creați un proiect și să vedeți rapid numărul de sarcini, orele, bugetul și clientul asociat proiectului.<br/><br/>Folosiți această pagină pentru o prezentare generală rapidă a tuturor proiectelor dvs.<br/><br/></p>"
text.new_db_version="A fost instalată o versiune nouă. Pentru a folosi Leantime, trebuie să actualizați baza de date.<br/><br/><strong>Asigurați-vă că faceți o copie de rezervă a bazei de date înainte de această actualizare!</strong><br/>Acest proces poate dura câteva minute."
text.update_was_successful="Actualizarea a reușit, acum vă puteți autentifica. <a href='%1$s'>Mergeți la autentificare</a>"
text.this_script_will_set_up_leantime="Acest script vă va configura baza de date și va crea un cont de administrator"
text.enter_new_password="Introduceți noua parolă pentru a o reseta."
