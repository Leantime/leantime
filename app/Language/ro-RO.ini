tour.my_work.welcome_title="Bun venit la turul tabloului de bord"
tour.my_work.welcome_text="Să începem cu câteva noțiuni de bază, ca să vă familiarizați rapid cu navigarea și cu diferitele elemente din Leantime."
tour.my_work.work_modes_title="Moduri de lucru"
tour.my_work.work_modes_text="Navigarea de sus vă arată „modul de lucru” în care vă aflați. Puteți fi în interiorul unui proiect, în zona dvs. personală de lucru sau în modul companie."
tour.my_work.left_nav_text="Navigarea din stânga detaliază modul de lucru curent și vă oferă acces la diferite zone. Tot ce este prezentat aici face parte din modul de lucru selectat mai sus."
tour.my_work.profile_bar_title="Bara de profil"
tour.my_work.profile_bar_text="Aici găsiți linkuri către contul dvs., precum și notificări și cele mai recente noutăți despre Leantime."
tour.my_work.widgets_title="Widgeturile tabloului de bord"
tour.my_work.widgets_text="Tabloul dvs. de bord este împărțit în diverse widgeturi care vă arată informații concentrate despre munca dvs."
tour.my_work.customize_title="Personalizați tabloul de bord"
tour.my_work.customize_text="Widgeturile pot fi redimensionate și mutate prin glisare și plasare."
tour.my_work.todos_title="Sarcinile mele"
tour.my_work.todos_text="Widgetul „Sarcinile mele” vă arată toate sarcinile care vă sunt atribuite în prezent."
tour.my_work.group_todos_title="Grupați sarcinile"
tour.my_work.group_todos_text="Puteți folosi meniurile derulante de aici pentru a filtra sarcinile după proiect sau pentru a le grupa după prioritate, stare, proiect sau date."
tour.my_work.sort_todos_title="Sortați sarcinile"
tour.my_work.sort_todos_text="Fiecare sarcină poate fi glisată și plasată pentru a-i schimba ordinea. De asemenea, puteți glisa o sarcină în calendar pentru a o programa."
tour.my_work.timer_title="Porniți cronometrul"
tour.my_work.timer_text="Când sunteți gata să începeți lucrul la o sarcină, faceți clic pe butonul de pornire a cronometrului."
tour.my_work.complete_task_title="Finalizați o sarcină"
tour.my_work.complete_task_text="După ce o sarcină este gata, o puteți marca drept finalizată făcând clic pe meniul derulant al stării."
tour.my_work.add_tasks_title="Adăugați mai multe sarcini"
tour.my_work.add_tasks_text="Puteți adăuga mai multe sarcini făcând clic pe butonul plus din fiecare secțiune sau folosind meniul cu trei puncte de lângă fiecare sarcină."
tour.my_work.finish_text="Ați finalizat turul tabloului de bord Munca mea. Mergeți la <a href='%s/dashboard/show'>proiectul dvs.</a> pentru a afla mai multe despre gestionarea proiectelor în Leantime."
tour.project_dashboard.menu_title="Meniul proiectului"
tour.project_dashboard.menu_text="Meniul proiectului organizează proiectul în diferite secțiuni: <strong>Camera de date</strong> - pentru a găzdui toate fișierele și informațiile, <strong>Gândire</strong> - pentru a elabora strategii, a genera idei și a defini, <strong>Execuție</strong> - pentru a gestiona obiective, repere și sarcini."
tour.project_dashboard.selector_title="Selectorul de proiecte"
tour.project_dashboard.selector_text="Folosiți selectorul de proiecte pentru a trece de la un proiect la altul. Meniul din stânga arată tot ce ține de proiectul curent."
tour.project_dashboard.checklist_title="Listă de verificare"
tour.project_dashboard.checklist_text="Lista de verificare a proiectului este o referință rapidă pentru a vedea dacă proiectul conține toate informațiile necesare unei execuții reușite."
tour.project_dashboard.status_title="Actualizări rapide de stare"
tour.project_dashboard.status_text="Puteți folosi actualizările de stare pentru a comunica rapid echipei progresul proiectului, cu ajutorul culorilor roșu, galben și verde. Starea va fi vizibilă în întreaga aplicație."
tour.project_dashboard.progress_title="Progres"
tour.project_dashboard.progress_text="Indicatorul de progres al proiectului vă arată cât de multă muncă ați finalizat. Acesta ține cont de dimensiunile diferite ale sarcinilor, de viteza echipei și de reperele proiectului."
tour.project_dashboard.latest_tasks_title="Cele mai recente sarcini"
tour.project_dashboard.latest_tasks_text="Lista celor mai recente sarcini vă arată sarcinile adăugate cel mai recent în proiect și poate fi folosită ca inbox al proiectului."
tour.project_dashboard.team_title="Echipa"
tour.project_dashboard.team_text="Caseta echipei vă arată membrii acestui proiect."
tour.project_dashboard.finish_text="Ați finalizat turul tabloului de bord al proiectului. Mergeți la <a href='%s/tickets/showKanban'>Sarcini</a> pentru a afla mai multe despre diversele moduri în care vă puteți gestiona sarcinile în Leantime."
tour.kanban_board.overview_title="Panoul dvs. Kanban"
tour.kanban_board.overview_text="Acesta este panoul dvs. Kanban. Vă ajută să vă vizualizați munca și să limitați munca în desfășurare."
tour.kanban_board.workflow_title="Fluxul de lucru"
tour.kanban_board.workflow_text="Sarcinile se deplasează de la stânga la dreapta pe măsură ce avansează. Glisați și plasați cardurile pentru a le actualiza starea."
tour.kanban_board.columns_title="Coloane flexibile"
tour.kanban_board.columns_text="Din meniul cu trei puncte puteți adăuga, elimina sau redenumi coloane."
tour.kanban_board.filter_title="Filtrați sarcinile"
tour.kanban_board.filter_text="Puteți filtra sarcinile după diverse câmpuri, precum prioritatea, starea, proiectul sau datele."
tour.kanban_board.swimlanes_title="Swimlane-uri"
tour.kanban_board.swimlanes_text="În plus, puteți grupa sarcinile pentru a crea swimlane-uri Kanban. Astfel vă puteți vizualiza munca în funcție de membrii echipei, de prioritate sau de repere."
tour.kanban_board.sprints_title="Sprinturi"
tour.kanban_board.sprints_text="Dacă vă organizați munca în sprinturi, puteți folosi meniul derulant de aici pentru a selecta, crea și actualiza sprinturi."
tour.kanban_board.finish_text="Acesta a fost turul Kanban. Mergeți la <a href='%s/tickets/roadmap'>Repere</a> pentru a afla cum să creați și să gestionați repere în Leantime."
tour.milestones.overview_title="Repere"
tour.milestones.overview_text="Reperele vă ajută să urmăriți rezultatele majore și fazele proiectului."
tour.milestones.drag_title="Glisare și sortare"
tour.milestones.drag_text="Fiecare bară reprezintă un reper. Le puteți glisa de-a lungul cronologiei, le puteți reordona și redimensiona. Tot ce faceți pe acest ecran actualizează datele reperelor."
tour.milestones.filter_title="Filtrare"
tour.milestones.filter_text="Puteți filtra reperele și puteți vedea, de asemenea, sarcinile care fac parte din ele."
tour.milestones.timeframes_title="Intervale de timp"
tour.milestones.timeframes_text="Puteți schimba intervalul de timp al vizualizării cronologice pentru a vedea o parte mai mare din an sau pentru a intra în detaliu, zi cu zi."
tour.milestones.finish_text="Acesta a fost turul reperelor. Mergeți la <a href='%s/goalcanvas/dashboard'>Obiective</a> pentru a afla cum să creați și să gestionați obiective în Leantime."
tour.goals.overview_title="Obiective"
tour.goals.overview_text="Obiectivele vă ajută să urmăriți impactul măsurabil asupra proiectelor dvs."
tour.goals.parts_title="Scopuri și indicatori"
tour.goals.parts_text="Fiecare obiectiv este alcătuit dintr-un scop (ceea ce încercați să realizați) și un indicator (modul în care îl veți măsura)."
tour.goals.progress_title="Progresul obiectivului"
tour.goals.progress_text="Pe măsură ce actualizați indicatorii obiectivelor, bara de progres vă va arăta cât de departe ați ajuns."
tour.goals.milestones_title="Repere și obiective"
tour.goals.milestones_text="Puteți asocia obiective cu repere pentru a urmări progresul obiectivelor la nivel de sarcini. Acest lucru vă ajută să identificați lipsurile din planul proiectului."
tour.goals.finish_text="Acesta a fost turul obiectivelor. Reperele, obiectivele și sarcinile sunt elementele de bază din Leantime. Folosiți-le pentru a vă împărți munca în bucăți ușor de gestionat. Mergeți la <a href='%s/tickets/showKanban'>Panoul Kanban</a> pentru a vă revizui sarcinile."
