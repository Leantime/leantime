label.onboarding_default_project_name="Proiectul meu"
text.onboarding_default_project_details="Bun venit în primul dvs. proiect din Leantime!<br />Acesta este spațiul dvs. pentru a organiza sarcini, a urmări obiective și a vă planifica munca. Nu ezitați să modificați orice de aici sau să creați proiecte suplimentare pe măsură ce evoluați. Acest proiect este doar pentru dvs., ca să puteți începe"
label.onboarding_milestone_getting_started="Primii pași"
label.onboarding_task_community_chat="Alăturați-vă chatului comunității noastre"
text.onboarding_task_community_chat="Chatul comunității noastre este o resursă excelentă pentru a pune întrebări și a primi feedback despre configurarea proiectelor. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chatul comunității</a>"
label.onboarding_task_invite_team="Invitați-vă colegii de echipă"
text.onboarding_task_invite_team="Fie că lucrați cu cineva, fie că aveți nevoie doar de un partener care să vă țină responsabil, folosirea Leantime în grup vă ajută să rămâneți pe drumul cel bun și motivat <a href='%s'>Gestionarea utilizatorilor</a>"
label.onboarding_task_project_structure="Aflați mai multe despre structura proiectelor în Leantime"
text.onboarding_task_project_structure="Avem multe resurse suplimentare în documentația de ajutor. Pentru a afla mai multe despre structura proiectelor în Leantime și despre bunele practici, vizitați: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Creați un obiectiv"
text.onboarding_task_create_goal="Obiectivele sunt folosite pentru a urmări și a măsura scopuri pe termen lung. Ar trebui să poată fi măsurate prin indicatori pe care îi puteți actualiza în mod regulat. Obiectivele și reperele pot fi asociate pentru a vedea progresul execuției alături de progresul indicatorilor <a href='%s'>Obiectivele proiectului</a>"
label.onboarding_task_create_milestone="Creați un reper"
text.onboarding_task_create_milestone="Reperele vă permit să împărțiți fazele proiectelor în rezultate distincte. Fiecare reper are o dată de început și una de sfârșit și ar trebui să producă un rezultat concret <a href='%s'>Reperele proiectului</a>"
label.onboarding_task_personal_project="Explorați proiectul personal"
text.onboarding_task_personal_project="Proiectul personal este un spațiu în care vă puteți organiza sarcinile, obiectivele și munca. Îl puteți accesa din selectorul de proiecte din partea de sus sau făcând clic pe acest link: <a href='%s'>Proiectul meu</a>"
label.onboarding_task_complete_profile="Completați-vă profilul Leantime"
text.onboarding_task_complete_profile="Actualizați fotografia de profil și completați preferințele de lucru pentru a vă personaliza experiența. <a href='%s'>Profilul meu</a>"
label.onboarding_goalboard_title="Obiectivele mele"
