support.marcel_name="👋 Я Марсель"
support.marcel_tagline="Иммигрант из Германии, отец дочери-аутистки, и у меня самого СДВГ."
support.marcel_bio_1="Традиционные инструменты управления проектами мне никогда не подходили. Казалось, что их создали нейротипичные люди для нейротипичных людей. Когда я работал фрилансером и с трудом держал в порядке клиентские проекты, я начал создавать то, что работало бы вместе с моим мозгом, а не против него."
support.marcel_bio_2="То, что начиналось как личное решение, стало Leantime, когда я понял, что то же самое нужно миллионам других людей."
support.gloria_name="👋 А я Глория"
support.gloria_tagline="Бывшая медсестра отделения неотложной помощи, ставшая продакт-менеджером, предприниматель латиноамериканского происхождения в первом поколении."
support.gloria_bio_1="Я много лет провела в напряженной медицинской среде, где организованность буквально спасает жизни. Но когда я открыла собственный бизнес, традиционные инструменты для проектов казались мне перегруженными и оторванными от того, как я на самом деле думаю и работаю."
support.gloria_bio_2="Мой опыт в поведенческой науке и исследованиях мотивации определяет то, как мы создаем функции, которые не просто упорядочивают задачи, а помогают вам действительно захотеть их выполнить."
support.closing_text="Мы можем создать мир, в котором никому не придется бороться со своими инструментами, чтобы делать отличную работу. Ваше спонсорство финансирует будущее, в котором программы подстраиваются под человеческое разнообразие, а не наоборот."
support.headline_ready_to_impact="Готовы внести прямой вклад?"
support.contribution_text="Каждый взнос — от $1 до $100 — идет непосредственно на то, чтобы сделать Leantime лучше для всех."
