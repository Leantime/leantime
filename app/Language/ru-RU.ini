; Strings added 2026-10 by machine translation (Claude), please review
tour.my_work.welcome_title="Добро пожаловать в обзор панели"
tour.my_work.welcome_text="Давайте начнем с основ, чтобы вы быстро освоились с навигацией и разными элементами Leantime."
tour.my_work.work_modes_title="Рабочие режимы"
tour.my_work.work_modes_text="Верхняя навигация показывает, в каком «рабочем режиме» вы сейчас находитесь. Вы можете быть внутри проекта, в своем личном рабочем пространстве или в режиме компании."
tour.my_work.left_nav_text="Левая навигация раскрывает текущий рабочий режим и открывает доступ к разным разделам. Все, что здесь представлено, относится к рабочему режиму, выбранному выше."
tour.my_work.profile_bar_title="Моя панель профиля"
tour.my_work.profile_bar_text="Здесь вы найдете ссылки на свою учетную запись, а также уведомления и последние новости Leantime."
tour.my_work.widgets_title="Виджеты вашей панели"
tour.my_work.widgets_text="Ваша панель состоит из различных виджетов, которые показывают самую важную информацию о вашей работе."
tour.my_work.customize_title="Настройте свою панель"
tour.my_work.customize_text="Виджеты можно перемещать и менять их размер простым перетаскиванием."
tour.my_work.todos_title="Мои задачи"
tour.my_work.todos_text="Виджет «Мои задачи» показывает все задачи, которые сейчас назначены вам."
tour.my_work.group_todos_title="Группировка задач"
tour.my_work.group_todos_text="С помощью выпадающих списков здесь можно фильтровать задачи по проекту или группировать их по приоритету, статусу, проекту или датам."
tour.my_work.sort_todos_title="Сортировка задач"
tour.my_work.sort_todos_text="Каждую задачу можно перетащить, чтобы изменить ее порядок. Задачу также можно перетащить в календарь, чтобы запланировать ее."
tour.my_work.timer_title="Запустите таймер"
tour.my_work.timer_text="Когда будете готовы приступить к задаче, просто нажмите кнопку запуска таймера."
tour.my_work.complete_task_title="Завершите задачу"
tour.my_work.complete_task_text="Когда задача выполнена, ее можно отметить как готовую в выпадающем списке статуса."
tour.my_work.add_tasks_title="Добавьте больше задач"
tour.my_work.add_tasks_text="Добавить задачи можно кнопкой «плюс» в каждом разделе или через меню с тремя точками рядом с каждой задачей."
tour.my_work.finish_text="Вы завершили обзор панели «Моя работа». Перейдите в <a href='%s/dashboard/show'>свой проект</a>, чтобы узнать больше об управлении проектами в Leantime."
tour.project_dashboard.menu_title="Меню проекта"
tour.project_dashboard.menu_text="Меню проекта делит ваш проект на разделы: <strong>Хранилище данных</strong> — для всех ваших файлов и информации, <strong>Думать</strong> — для стратегии, идей и определения, <strong>Сделать</strong> — для управления целями, вехами и задачами."
tour.project_dashboard.selector_title="Выбор проекта"
tour.project_dashboard.selector_text="Переключайтесь между проектами с помощью селектора проектов. В левом меню показано все, что относится к текущему проекту."
tour.project_dashboard.checklist_title="Чек-лист"
tour.project_dashboard.checklist_text="Чек-лист проекта помогает быстро проверить, содержит ли ваш проект всю информацию, необходимую для успешного выполнения."
tour.project_dashboard.status_title="Быстрые обновления статуса"
tour.project_dashboard.status_text="С помощью обновлений статуса можно быстро сообщить команде о ходе проекта красным, желтым и зеленым цветом. Статус будет виден во всем приложении."
tour.project_dashboard.progress_title="Прогресс"
tour.project_dashboard.progress_text="Индикатор прогресса проекта показывает, какой объем работы уже выполнен. Он учитывает разный размер задач, скорость команды и вехи проекта."
tour.project_dashboard.latest_tasks_title="Последние задачи"
tour.project_dashboard.latest_tasks_text="Список последних задач показывает задачи, недавно добавленные в ваш проект, и его можно использовать как папку «Входящие» проекта."
tour.project_dashboard.team_title="Команда"
tour.project_dashboard.team_text="В блоке «Команда» показаны участники этого проекта."
tour.project_dashboard.finish_text="Вы завершили обзор панели проекта. Перейдите в раздел <a href='%s/tickets/showKanban'>Задачи</a>, чтобы узнать больше о разных способах управления задачами в Leantime."
tour.kanban_board.overview_title="Ваша доска Kanban"
tour.kanban_board.overview_text="Это ваша доска Kanban. Она помогает визуализировать работу и ограничивать объем незавершенной работы."
tour.kanban_board.workflow_title="Рабочий процесс"
tour.kanban_board.workflow_text="По мере выполнения задачи перемещаются слева направо. Перетаскивайте карточки, чтобы обновить их статус."
tour.kanban_board.columns_title="Гибкие столбцы"
tour.kanban_board.columns_text="В меню с тремя точками можно добавлять, удалять и переименовывать столбцы."
tour.kanban_board.filter_title="Фильтр задач"
tour.kanban_board.filter_text="Задачи можно фильтровать по различным полям, например по приоритету, статусу, проекту или датам."
tour.kanban_board.swimlanes_title="Дорожки"
tour.kanban_board.swimlanes_text="Кроме того, задачи можно сгруппировать, чтобы создать дорожки Kanban. Это помогает визуализировать работу по участникам команды, приоритету или вехам."
tour.kanban_board.sprints_title="Спринты"
tour.kanban_board.sprints_text="Если вы работаете спринтами, с помощью выпадающего списка здесь можно выбирать, создавать и обновлять спринты."
tour.kanban_board.finish_text="На этом обзор Kanban завершен. Перейдите в раздел <a href='%s/tickets/roadmap'>Вехи</a>, чтобы узнать, как создавать вехи и управлять ими в Leantime."
tour.milestones.overview_title="Вехи"
tour.milestones.overview_text="Вехи помогают отслеживать ключевые результаты и этапы проекта."
tour.milestones.drag_title="Перетаскивание и сортировка"
tour.milestones.drag_text="Каждая полоса — это одна веха. Вехи можно перетаскивать по временной шкале, менять их порядок и длительность. Все, что вы делаете на этом экране, обновляет сроки ваших вех."
tour.milestones.filter_title="Фильтр"
tour.milestones.filter_text="Вехи можно фильтровать, а также просматривать входящие в них задачи."
tour.milestones.timeframes_title="Периоды"
tour.milestones.timeframes_text="Период временной шкалы можно изменить, чтобы видеть большую часть года или подробно рассмотреть разбивку по дням."
tour.milestones.finish_text="На этом обзор вех завершен. Перейдите в раздел <a href='%s/goalcanvas/dashboard'>Цели</a>, чтобы узнать, как создавать цели и управлять ими в Leantime."
tour.goals.overview_title="Цели"
tour.goals.overview_text="Цели помогают отслеживать измеримый эффект ваших проектов."
tour.goals.parts_title="Ориентиры и показатели"
tour.goals.parts_text="Каждая цель состоит из ориентира (того, чего вы хотите добиться) и показателя (того, как вы будете это измерять)."
tour.goals.progress_title="Прогресс цели"
tour.goals.progress_text="По мере обновления показателей цели индикатор прогресса покажет, насколько вы продвинулись."
tour.goals.milestones_title="Вехи и цели"
tour.goals.milestones_text="Цели можно связать с вехами, чтобы отслеживать их прогресс на уровне задач. Это помогает найти пробелы в плане проекта."
tour.goals.finish_text="На этом обзор целей завершен. Вехи, цели и задачи — основные строительные блоки Leantime. Используйте их, чтобы разбивать работу на посильные части. Перейдите на <a href='%s/tickets/showKanban'>доску Kanban</a>, чтобы просмотреть свои задачи."
