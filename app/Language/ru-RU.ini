text.helpful_resources="Освоение любого нового программного обеспечения может быть непростым, мы стремимся сделать Leantime максимально простым и понятный.<br /> Если вы почувствуете себя в тупике или захотите обменяться идеями, вы можете воспользоваться приведенными ниже ресурсами, чтобы получить помощь:"

text.discordChat="Наш чат в discord, вероятно, является самым быстрым способом получить ответ на любой из ваших вопросов. Наше сообщество активно и невероятно дружелюбно."
text.documentation="В нашей документации подробно рассказывается об использовании Leantime, а также о некоторых концепциях и особенностях"
