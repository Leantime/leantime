label.webhook_notifications_description="Отправляйте свои уведомления на собственный HTTPS-адрес. Для каждого уведомления проекта, которое вам положено, Leantime отправляет на этот URL один HTTP POST-запрос с телом в формате JSON. Запросы отправляются в фоновом режиме и могут доходить через несколько минут; неудачный запрос повторно не отправляется. Какие уведомления вам положены, определяют категории и уровни по проектам на вкладке «Уведомления»; изменения, которые вы вносите сами, тоже отправляются. Отключение уведомлений по электронной почте не останавливает вебхук. Вебхук работает, только если он включен и указан URL. Пока вебхук отключен, ваш URL остается сохраненным — очистите поле, чтобы удалить его."
