label.onboarding_default_project_name="Мой проект"
text.onboarding_default_project_details="Добро пожаловать в ваш первый проект в Leantime!<br />Это ваше пространство, чтобы организовывать задачи, отслеживать цели и планировать работу. Можете изменять здесь что угодно или создавать новые проекты по мере роста. Этот проект нужен лишь для того, чтобы вы могли начать работу"
label.onboarding_milestone_getting_started="Начало работы"
label.onboarding_task_community_chat="Присоединитесь к чату нашего сообщества"
text.onboarding_task_community_chat="Чат нашего сообщества — отличное место, чтобы задать вопросы и получить отзывы о настройке проекта. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Чат сообщества</a>"
label.onboarding_task_invite_team="Пригласите коллег по команде"
text.onboarding_task_invite_team="Работаете ли вы с кем-то или вам просто нужен партнер, который поможет держать слово, — работа в Leantime в группе помогает не сбиваться с курса и сохранять мотивацию <a href='%s'>Управление пользователями</a>"
label.onboarding_task_project_structure="Узнайте больше о структуре проектов в Leantime"
text.onboarding_task_project_structure="В нашей справочной документации много дополнительных материалов. Чтобы узнать больше о структуре проектов в Leantime и лучших практиках, посетите: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Создайте цель"
text.onboarding_task_create_goal="Цели нужны, чтобы отслеживать и измерять долгосрочные ориентиры. Они должны быть измеримыми с помощью показателей, которые вы регулярно обновляете. Цели и вехи можно связать, чтобы видеть ход выполнения вместе с прогрессом показателей <a href='%s'>Цели проекта</a>"
label.onboarding_task_create_milestone="Создайте веху"
text.onboarding_task_create_milestone="Вехи позволяют разделить этапы проекта на отдельные результаты. У каждой вехи есть дата начала и окончания, и она должна приносить определенный результат <a href='%s'>Вехи проекта</a>"
label.onboarding_task_personal_project="Изучите свой личный проект"
text.onboarding_task_personal_project="Ваш личный проект — это пространство, где вы можете организовать свои задачи, цели и работу. Открыть его можно через селектор проектов вверху или по этой ссылке: <a href='%s'>Мой проект</a>"
label.onboarding_task_complete_profile="Заполните свой профиль Leantime"
text.onboarding_task_complete_profile="Обновите фото профиля и укажите рабочие предпочтения, чтобы настроить Leantime под себя. <a href='%s'>Мой профиль</a>"
label.onboarding_goalboard_title="Мои цели"
