text.lean.helper_content="Lean Canvas проведет вас через весь процесс проверки вашей новой бизнес- и/или продуктовой идеи.<br/>Вы опишете <em>сегмент клиентов</em>, <em>проблему, решение</em>.<br/>Затем вы перейдете к <em>уникальному ценностному предложению</em> (чем ваша идея лучше других предложений?), <em>каналам дистрибуции</em> (как ваше решение дойдет до клиентов?), <em>потокам доходов</em> (как ваше решение будет приносить деньги?), <em>структуре расходов</em> (сколько стоит ваше решение?), <em>ключевым показателям</em> (как вы будете измерять успех?) и <em>уникальным преимуществам</em> (что поможет вам победить в конкурентной борьбе?)<br/>Ответы на эти вопросы помогают добиться успеха, снизить риск неудачи, а также отслеживать и проверять ваши допущения. Быть Lean — значит устранять потери и создавать продукты, бизнес и решения, которые нужны вашим клиентам."
text.lean.disclaimer="Lean Canvas адаптирован из <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> и распространяется по лицензии <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Когда ваш Lean Canvas будет готов, перейдите в</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Планировщик дорожной карты</a>"


