text.my_work_dashboard_intro="Панель «Моя работа» помогает сосредоточиться на самом важном.<br/>Самая важная работа теперь у вас перед глазами — организованная именно для вас и так, как лучше работает ваш мозг.<br/><br/>От быстрых задач до амбициозных целей — все необходимое здесь. Это ваше пространство, чтобы записывать идеи, отслеживать прогресс и отмечать победы на этом пути."
text.blueprints_intro="Blueprints помогают осмыслить все данные. В Leantime есть множество инструментов и холстов, чтобы описать предпосылки проекта: холсты бизнес-модели, SWOT-анализ или карты эмпатии.<br/><br/>Если вы не знаете, с чего начать, рекомендуем создать «Холст ценности проекта». Этот холст ответит на самые важные вопросы вашего проекта: Кто ваш клиент?<br/>Какую проблему вы решаете?<br/>Каково ваше решение?<br/>Какое преимущество ваше решение дает перед конкурентами?<br/>"
text.goals_tour_intro="Цели позволяют разбить проект на достижимые, измеримые и выполнимые части.<br/>Вехи ориентированы на исполнение, а цели — на показатели, которых вы хотите достичь.<br/>У каждой цели должен быть четкий ориентир (то, чего вы хотите добиться), и ее должно быть легко измерить одним показателем.<br/><br/>Когда цель определена, к ней можно привязать вехи, чтобы разбить ее на выполнимые задачи.<br/>"
text.project_dashboard_tour_intro="Проекты в Leantime — это совместные рабочие пространства, где вы и ваша команда эффективно организуете, отслеживаете и выполняете работу. Каждый проект объединяет связанные цели, задачи и вехи и позволяет следить за прогрессом в одном месте.<br/><br/>Управляете ли вы рабочими, учебными или личными инициативами, проекты Leantime дают структуру и инструменты, чтобы превращать идеи в успешные результаты."
text.wiki_tour_intro="Документы позволяют писать документацию и делиться ею с командой. Вы можете создать несколько пространств, чтобы упорядочить документацию по командам, направлениям или категориям.<br/>Создавайте документы, чтобы делиться знаниями, процессами и процедурами. Также можно создать документ со ссылкой на файл или папку в вашем облачном хранилище.<br/>"
text.extend_leantime_latest_plugins="Расширьте возможности Leantime с помощью наших новых плагинов."
support.headline_help_us_build="Помогите нам построить будущее, в котором любой ум сможет раскрыться!"
support.intro_text_1="Большинство инструментов продуктивности исходят из того, что все думают одинаково: линейно, с идеальной концентрацией и мотивацией от произвольных дедлайнов. Если у вас СДВГ и вам нужен дофамин от выполненных задач, если вы аутист и нуждаетесь в постоянной структуре, если у вас дислексия и вы мыслите пространственно или вы просто устали от инструментов, которые не соответствуют тому, как на самом деле работает ваш мозг, — вы, вероятно, уже совсем отказались от управления проектами."
support.intro_text_2="Мы создаем Leantime для умов, которые работают иначе. Это касается нейроотличных людей, но также и всех, кому когда-либо казалось, что существующие инструменты мешают их естественному способу мышления."
