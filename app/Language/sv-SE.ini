text.full_lean_canvas_helper_content="Den fullständiga forskningstavlan guidar dig genom hela processen för att validera en idé.<br/>På den här sidan tar du dig återigen an ditt kundsegment, problem och din lösning (men oroa dig inte, om du redan har fyllt i detta på den enkla tavlan ser du det här igen!).<br/>Därifrån går du vidare till ett tydligt värdeerbjudande (vad gör din idé bättre än andra erbjudanden?),<br/>försäljningskanaler (hur får kunderna tillgång till din lösning?)<br/>intäktsströmmar (hur tjänar din lösning pengar?)<br/>kostnadsstruktur (hur mycket är din lösning värd?) nyckeltal (hur mäter du framgång?)<br/>och orättvisa fördelar (vad hjälper dig att sticka ut mot konkurrensen?)<br/>Att besvara de här frågorna är tänkt att driva framgång, minska misslyckanden och låta dig följa upp och validera dina antaganden.<br/>Lean handlar om att eliminera slöseri och arbeta för att bygga produkter, tjänster och lösningar som dina kunder behöver."
