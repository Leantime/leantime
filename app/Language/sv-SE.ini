text.my_work_dashboard_intro="Din översikt Mitt arbete sätter fokus på allt som är viktigt.<br/>Ditt viktigaste arbete står nu i centrum, organiserat just för dig och för hur din hjärna fungerar bäst.<br/><br/>Från snabba uppgifter till ambitiösa mål — allt du behöver finns här. Det här är din plats för att fånga idéer, följa framsteg och fira framgångar längs vägen."
text.blueprints_intro="Blueprints är din chans att få grepp om all data. Leantime har en rad verktyg och tavlor för att definiera projektets bakgrund med Business Model Canvas, SWOT-analys eller empatikartor.<br/><br/>Om du inte vet var du ska börja föreslår vi att du skapar en 'Project Value Canvas'. Den besvarar de viktigaste frågorna i ditt projekt: Vem är din kund?<br/>Vilket problem löser du?<br/>Vilken är din lösning?<br/>Vilken fördel har din lösning jämfört med konkurrenternas<br/>"
text.goals_tour_intro="Med mål kan du dela upp ditt projekt i uppnåbara, mätbara och genomförbara delar.<br/>Medan milstolpar fokuserar på genomförandet handlar mål om de mätvärden du vill uppnå.<br/>Varje mål bör ha ett tydligt syfte (det du vill uppnå) och vara lätt att mäta med ett enda mätvärde.<br/><br/>När du har ett mål kan du koppla milstolpar till det för att bryta ner det i genomförbara uppgifter.<br/>"
text.project_dashboard_tour_intro="Projekt i Leantime är gemensamma arbetsytor där du och ditt team organiserar, följer upp och levererar arbete effektivt. Varje projekt samlar relaterade mål, uppgifter och milstolpar och låter dig följa framstegen på ett ställe.<br/><br/>Oavsett om du hanterar arbete, skola eller interna personliga initiativ ger projekt i Leantime den struktur och de verktyg som behövs för att förvandla idéer till lyckade resultat."
text.wiki_tour_intro="Med våra dokument kan du skriva och dela dokumentation med ditt team. Du kan skapa flera ytor för att organisera dokumentationen efter team, områden eller dokumentkategori.<br/>Skapa dokument för att dela kunskap, processer och rutiner. Du kan också skapa ett dokument för att dela en länk till en fil eller mapp i din molnlagring.<br/>"
text.extend_leantime_latest_plugins="Utöka Leantime med våra senaste plugins."
support.headline_help_us_build="Hjälp oss att bygga en framtid där alla hjärnor kan blomstra!"
support.intro_text_1="De flesta produktivitetsverktyg utgår från att alla tänker på samma sätt: linjärt, med perfekt fokus och motiverade av godtyckliga deadlines. Oavsett om du har ADHD och behöver dopaminkickar av avklarade uppgifter, är autistisk och längtar efter en konsekvent struktur, har dyslexi och tänker rumsligt, eller bara är trött på verktyg som inte passar hur din hjärna faktiskt fungerar — har du förmodligen gett upp projektledning helt."
support.intro_text_2="Vi bygger Leantime för hjärnor som fungerar annorlunda. Det gäller neurodivergenta hjärnor, men också alla som någon gång har känt att befintliga verktyg motarbetar deras naturliga sätt att tänka."
