headlines.lean.analysis="Beskriv din lean canvas"
headlines.lean.welcome_to_board="Välkommen till tavlan för Lean Canvas!"

text.lean.helper_content="Lean canvas tar dig genom hela processen för att validera din nya affärs- och/eller produktidé.<br/>Du tar dig an ditt <em>kundsegment</em>, <em>problem och lösning</em>.<br/>Därifrån går du vidare till ditt <em>unika värdeerbjudande</em> (vad gör din idé bättre än andra erbjudanden?), dina <em>distributionskanaler</em> (hur ska din lösning nå dina kunder?), dina <em>intäktsströmmar</em> (hur ska din lösning tjäna pengar?), din <em>kostnadsstruktur</em> (hur mycket är din lösning värd?), <em>nyckeltal</em> (hur ska du mäta framgång?) och din <em>orättvisa fördel</em> (vad har du som hjälper dig att lyckas mot konkurrensen?)<br/>Att besvara de här frågorna är tänkt att främja framgång, minska misslyckanden och låta dig följa upp och validera dina antaganden. Att vara lean handlar om att eliminera slöseri och arbeta för att bygga produkter, verksamheter och lösningar som dina kunder behöver."
text.lean.disclaimer="Lean Canvas är anpassad från <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> och är licensierad under licensen <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>När du känner dig nöjd med din lean canvas, gå vidare till</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Färdplanering</a>"


