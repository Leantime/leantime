text.onboarding_default_project_details="Välkommen till ditt första projekt i Leantime!<br />Det här är din plats för att organisera uppgifter, följa mål och planera ditt arbete. Ändra gärna vad du vill här eller skapa fler projekt allteftersom du växer. Det här projektet är bara till för att du ska komma igång"
label.onboarding_milestone_getting_started="Kom igång"
label.onboarding_task_community_chat="Gå med i vår communitychatt"
text.onboarding_task_community_chat="Vår communitychatt är en utmärkt resurs för att ställa frågor och få feedback på hur du lägger upp ditt projekt. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Communitychatt</a>"
label.onboarding_task_invite_team="Bjud in dina teamkamrater"
text.onboarding_task_invite_team="Oavsett om du arbetar tillsammans med någon eller bara behöver någon som håller dig ansvarig: att använda Leantime i grupp hjälper er att hålla kursen och motivationen uppe <a href='%s'>Användarhantering</a>"
label.onboarding_task_project_structure="Läs mer om projektstrukturen i Leantime"
text.onboarding_task_project_structure="Vi har många fler resurser i vår hjälpdokumentation. Om du vill veta mer om projektstruktur i Leantime och bästa praxis kan du besöka: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Skapa ett mål"
text.onboarding_task_create_goal="Mål används för att följa och mäta långsiktiga syften. De ska vara mätbara med mätvärden som du kan uppdatera regelbundet. Mål och milstolpar kan kopplas ihop så att du ser genomförandets framsteg samtidigt som du ser mätvärdenas framsteg <a href='%s'>Projektmål</a>"
label.onboarding_task_create_milestone="Skapa en milstolpe"
text.onboarding_task_create_milestone="Med milstolpar kan du dela in projektets faser i avgränsade resultat. Varje milstolpe har ett start- och slutdatum och bör leverera något konkret <a href='%s'>Projektets milstolpar</a>"
label.onboarding_task_personal_project="Utforska ditt personliga projekt"
text.onboarding_task_personal_project="Ditt personliga projekt är en plats där du kan organisera dina uppgifter, mål och ditt arbete. Du når det via projektväljaren högst upp eller genom att klicka på den här länken: <a href='%s'>Mitt projekt</a>"
label.onboarding_task_complete_profile="Slutför min Leantime-profil"
text.onboarding_task_complete_profile="Uppdatera profilbilden och fyll i arbetsinställningarna för att anpassa min upplevelse. <a href='%s'>Min Profil</a>"
label.onboarding_goalboard_title="Mina mål"
label.onboarding_goal_metric="Uppgifter slutförda i tid"
label.onboarding_goal_objective="Bygg mitt produktivitetssystem"
label.onboarding_step_name_first_task="Namnge din första uppgift"
