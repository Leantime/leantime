text.zulip_instructions="Denna integration kommer posta uppdaterings meddelanden på ström och ämne som du väljer.<br/>Följ instruktionerna <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>här för att skapa en ny bot</a>. Kopiera sedan in informationen i formuläret till höger och tryck på spara."
text.discord_instructions="Denna integration kommer posta uppdaterings meddelanden på kanalen du väljer.<br/>Följ instruktionerna <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>här för att skapa en ny webhook(s)</a>, och klistra sedan in länk(arna) i fälten till höger och tryck på spara."
