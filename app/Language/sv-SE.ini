tour.my_work.welcome_title="Välkommen till rundturen för översikten"
tour.my_work.welcome_text="Vi börjar med några grunder så att du snabbt kommer igång med navigeringen och de olika delarna i Leantime."
tour.my_work.work_modes_title="Arbetslägen"
tour.my_work.work_modes_text="Den övre navigeringen visar vilket ”arbetsläge” du befinner dig i. Du kan vara i ett projekt, i ditt personliga arbetsområde eller i företagsläget."
tour.my_work.left_nav_text="Den vänstra navigeringen delar upp det aktuella arbetsläget och ger dig tillgång till olika områden. Allt som visas här hör till det arbetsläge som är valt ovan."
tour.my_work.profile_bar_title="Mitt profilfält"
tour.my_work.profile_bar_text="Här hittar du länkar till ditt konto samt aviseringar och de senaste nyheterna om Leantime."
tour.my_work.widgets_title="Dina widgetar på översikten"
tour.my_work.widgets_text="Din översikt består av olika widgetar som visar fokuserad information om ditt arbete."
tour.my_work.customize_title="Anpassa din översikt"
tour.my_work.customize_text="Widgetar kan ändras i storlek och flyttas runt med dra och släpp."
tour.my_work.todos_title="Mina Att Göra"
tour.my_work.todos_text="Widgeten Mina Att Göra visar alla uppgifter som för närvarande är tilldelade dig."
tour.my_work.group_todos_title="Gruppera Att Göra"
tour.my_work.group_todos_text="Med rullgardinsmenyerna här kan du filtrera dina uppgifter efter projekt eller gruppera dem efter prioritet, status, projekt eller datum."
tour.my_work.sort_todos_title="Sortera Att Göra"
tour.my_work.sort_todos_text="Varje Att Göra kan dras och släppas för att ändra ordningen. Du kan också dra och släppa en uppgift i kalendern för att schemalägga den."
tour.my_work.timer_title="Starta timern"
tour.my_work.timer_text="När du är redo att börja arbeta med en uppgift klickar du bara på knappen för att starta timern."
tour.my_work.complete_task_title="Slutför en uppgift"
tour.my_work.complete_task_text="När en uppgift är slutförd kan du markera den som klar via rullgardinsmenyn för status."
tour.my_work.add_tasks_title="Lägg till fler uppgifter"
tour.my_work.add_tasks_text="Du kan lägga till fler uppgifter genom att klicka på plusknappen i varje avsnitt eller via menyn med tre punkter bredvid varje uppgift."
tour.my_work.finish_text="Du har slutfört rundturen för översikten Mitt arbete. Gå till <a href='%s/dashboard/show'>ditt projekt</a> för att lära dig mer om projektledning i Leantime."
tour.project_dashboard.menu_title="Projektmeny"
tour.project_dashboard.menu_text="Projektmenyn delar in ditt projekt i olika avsnitt: <strong>Datarum</strong> – för att samla alla dina filer och all information, <strong>Tänk</strong> – för att ta fram strategier, idéer och definitioner, <strong>Genomför</strong> – för att hantera mål, milstolpar och uppgifter."
tour.project_dashboard.selector_title="Projektväljare"
tour.project_dashboard.selector_text="Använd projektväljaren för att hoppa mellan projekt. Den vänstra menyn visar allt som hör till ditt aktuella projekt."
tour.project_dashboard.checklist_title="Checklista"
tour.project_dashboard.checklist_text="Projektchecklistan är en snabb referens för att se om ditt projekt innehåller all information som behövs för ett lyckat genomförande."
tour.project_dashboard.status_title="Snabba statusuppdateringar"
tour.project_dashboard.status_text="Med statusuppdateringar kan du snabbt dela projektets framsteg med ditt team med färgerna rött, gult och grönt. Statusen syns i hela applikationen."
tour.project_dashboard.progress_title="Framsteg"
tour.project_dashboard.progress_text="Projektets framstegsindikator visar hur mycket arbete du har slutfört. Den tar hänsyn till olika uppgiftsstorlekar, teamets hastighet och projektets milstolpar."
tour.project_dashboard.latest_tasks_title="Senaste uppgifter"
tour.project_dashboard.latest_tasks_text="Listan över senaste uppgifter visar de uppgifter som senast lagts till i ditt projekt och kan användas som projektets inkorg."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Teamrutan visar medlemmarna i det här projektet."
tour.project_dashboard.finish_text="Du har slutfört rundturen för projektskrivbordet. Gå till <a href='%s/tickets/showKanban'>Att Göra</a> för att lära dig mer om de olika sätten att hantera dina uppgifter i Leantime."
tour.kanban_board.overview_title="Din Kanban Tavla"
tour.kanban_board.overview_text="Det här är din Kanban Tavla. Den hjälper dig att visualisera ditt arbete och begränsa pågående arbete."
tour.kanban_board.workflow_title="Arbetsflöde"
tour.kanban_board.workflow_text="Uppgifter flyttas från vänster till höger allteftersom de fortskrider. Dra och släpp kort för att uppdatera deras status."
tour.kanban_board.columns_title="Flexibla kolumner"
tour.kanban_board.columns_text="Via menyn med tre punkter kan du lägga till, ta bort och byta namn på kolumner."
tour.kanban_board.filter_title="Filtrera uppgifter"
tour.kanban_board.filter_text="Du kan filtrera dina uppgifter efter olika fält som prioritet, status, projekt eller datum."
tour.kanban_board.swimlanes_title="Simbanor"
tour.kanban_board.swimlanes_text="Du kan dessutom gruppera dina uppgifter för att skapa simbanor i Kanban. Det hjälper dig att visualisera ditt arbete per teammedlem, prioritet eller milstolpe."
tour.kanban_board.sprints_title="Sprintar"
tour.kanban_board.sprints_text="Om du hanterar ditt arbete i sprintar kan du använda rullgardinsmenyn här för att välja, skapa och uppdatera sprintar."
tour.kanban_board.finish_text="Detta avslutar Kanban-rundturen. Gå till <a href='%s/tickets/roadmap'>Milstolpar</a> för att lära dig hur du skapar och hanterar milstolpar i Leantime."
tour.milestones.overview_title="Milstolpar"
tour.milestones.overview_text="Milstolpar hjälper dig att följa viktiga resultat och projektfaser."
tour.milestones.drag_title="Dra & Sortera"
tour.milestones.drag_text="Varje stapel representerar en milstolpe. Du kan dra dem längs tidslinjen, ändra deras ordning och ändra deras storlek. Allt du gör på den här skärmen uppdaterar tidsplanen för dina milstolpar."
tour.milestones.filter_title="Filtrera"
tour.milestones.filter_text="Du kan filtrera dina milstolpar och även visa de uppgifter som ingår i dem."
tour.milestones.timeframes_title="Tidsramar"
tour.milestones.timeframes_text="Du kan ändra tidsramen för tidslinjevyn för att se mer av året eller fördjupa dig i en uppdelning per dag."
tour.milestones.finish_text="Detta avslutar rundturen för milstolpar. Gå till <a href='%s/goalcanvas/dashboard'>Mål</a> för att lära dig hur du skapar och hanterar mål i Leantime."
tour.goals.overview_title="Mål"
tour.goals.overview_text="Mål hjälper dig att följa mätbar effekt i dina projekt."
tour.goals.parts_title="Syften & mätvärden"
tour.goals.parts_text="Varje mål består av ett syfte (det du försöker uppnå) och ett mätvärde (hur du ska mäta det)."
tour.goals.progress_title="Målets framsteg"
tour.goals.progress_text="När du uppdaterar mätvärdena för dina mål visar förloppsindikatorn hur långt du har kommit."
tour.goals.milestones_title="Milstolpar & mål"
tour.goals.milestones_text="Du kan koppla mål till milstolpar för att följa dina måls framsteg på uppgiftsnivå. Det hjälper dig att hitta luckor i din projektplan."
tour.goals.finish_text="Detta avslutar rundturen för mål. Milstolpar, mål och Att Göra är de grundläggande byggstenarna i Leantime. Använd dem för att dela upp ditt arbete i hanterbara delar. Gå till <a href='%s/tickets/showKanban'>Kanban Tavlan</a> för att granska dina uppgifter."
