support.marcel_name="👋 Jag heter Marcel"
support.marcel_tagline="Tysk invandrare, pappa till en autistisk dotter och har själv ADHD."
support.marcel_bio_1="Traditionella verktyg för projektledning klickade aldrig för mig. De kändes som om de var byggda av neurotypiska hjärnor för neurotypiska hjärnor. När jag frilansade och kämpade med att hålla ordning på kundprojekt började jag bygga något som fungerade med min hjärna i stället för emot den."
support.marcel_bio_2="Det som började som en personlig lösning blev Leantime när jag insåg att miljontals andra behövde samma sak."
support.gloria_name="👋 Och jag heter Gloria"
support.gloria_tagline="Tidigare akutsjuksköterska som blev produktchef, första generationens latinamerikanska entreprenör."
support.gloria_bio_1="Jag tillbringade flera år i pressade vårdmiljöer där organisation bokstavligen räddar liv. Men när jag startade mitt eget företag kändes traditionella projektverktyg överväldigande och frånkopplade från hur jag faktiskt tänker och arbetar."
support.gloria_bio_2="Min bakgrund inom beteendevetenskap och motivationsforskning styr hur vi bygger funktioner som inte bara organiserar uppgifter — de hjälper dig att faktiskt vilja slutföra dem."
support.closing_text="Vi kan skapa en värld där ingen behöver kämpa mot sina verktyg för att göra ett bra arbete. Din sponsring finansierar en framtid där programvara anpassar sig efter mänsklig mångfald, inte tvärtom."
