text.mattermost_instructions=" Denna integration kommer posta uppdaterings meddelande till kanalen du väljer.<br/>Följ instruktionerna <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>här för att få en Inkommande Webhook URL</a> från Mattermost. Kopiera sedan länken i formuläret till höger och tryck på spara."
text.slack_instructions="Denna integration kommer posta uppdaterings meddelanden på kanalen du väljer.<br/>Följ instruktionerna <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>här för att få en Inkommande Webhook URL</a> från Slack. Klistra länken i formuläret till höger och tryck på Spara."
text.choose_access_for_users="Markera eller avmarkera användare som du vill lägga till/radera. Du kan lära dig mer om rollerna på <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
