text.onboarding_default_project_details="Добро дошли у свој први пројекат у Leantime-у!<br />Ово је ваш простор за организовање задатака, праћење циљева и планирање рада. Слободно измените било шта овде или направите додатне пројекте како будете напредовали. Овај пројекат је само за вас, да бисте лакше почели"
label.onboarding_milestone_getting_started="Први кораци"
label.onboarding_task_community_chat="Придружите се чету наше заједнице"
text.onboarding_task_community_chat="Чет наше заједнице одличан је ресурс за постављање питања и добијање повратних информација о подешавању пројекта. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Чет заједнице</a>"
label.onboarding_task_invite_team="Позовите чланове тима"
text.onboarding_task_invite_team="Било да радите са неким или вам је само потребан неко ко ће вас држати одговорним, коришћење Leantime-а у групи помаже вам да останете на правом путу и мотивисани <a href='%s'>Управљање корисницима</a>"
label.onboarding_task_project_structure="Сазнајте више о структури пројеката у Leantime-у"
text.onboarding_task_project_structure="У нашој документацији помоћи пронаћи ћете много додатних ресурса. Да бисте сазнали више о структури пројеката у Leantime-у и најбољим праксама, посетите: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Направите циљ"
text.onboarding_task_create_goal="Циљеви служе за праћење и мерење дугорочних сврха. Треба да буду мерљиви помоћу метрика које можете редовно да ажурирате. Циљеви и прекретнице могу се повезати, тако да напредак реализације видите упоредо са напретком метрике <a href='%s'>Циљеви пројекта</a>"
label.onboarding_task_create_milestone="Направите прекретницу"
text.onboarding_task_create_milestone="Прекретнице вам омогућавају да фазе пројекта поделите на засебне исходе. Свака прекретница има датум почетка и завршетка и треба да донесе одређени резултат <a href='%s'>Прекретнице пројекта</a>"
label.onboarding_task_personal_project="Истражите свој лични пројекат"
text.onboarding_task_personal_project="Ваш лични пројекат је простор у коме можете да организујете своје задатке, циљеве и рад. Можете му приступити преко бирача пројеката на врху или кликом на овај линк: <a href='%s'>Мој пројекат</a>"
label.onboarding_task_complete_profile="Довршите свој Leantime профил"
text.onboarding_task_complete_profile="Ажурирајте профилну слику и довршите радне преференције да бисте персонализовали своје искуство. <a href='%s'>Мој профил</a>"
label.onboarding_goalboard_title="Моји циљеви"
label.onboarding_goal_metric="Задаци завршени на време"
label.onboarding_goal_objective="Изградити свој систем продуктивности"
