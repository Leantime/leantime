text.help_dashboard_intro="Leantime је направљен да оснажи ваше супермоћи и помогне вам да видите напредак ка својим циљевима.<br /><br />Већина нас је навикла да прави листе задатака — али ми ћемо вас замолити да размислите шта тачно покушавате да постигнете.<br /><br />1. Поставите визију (стратегију) и своје циљеве<br />2. Дефинишите посао који ће вас довести до тих циљева<br />3. А затим их остварите, планирајући свакодневни рад уз контролну таблу „Мој рад“.<br />"
