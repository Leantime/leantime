text.full_lean_canvas_helper_content="Потпуна истраживачка табла водиће вас кроз цео процес валидације идеје.<br/>На овој страници поново ћете се бавити сегментом купаца, проблемом и решењем (али не брините, ако сте их већ попунили на једноставној табли, видећете их и овде!).<br/>Затим прелазите на јасну вредносну понуду (по чему је ваша идеја боља од других понуда?),<br/>канале продаје (како купци долазе до вашег решења?)<br/>токове прихода (како ваше решење зарађује?)<br/>структуру трошкова (колико вреди ваше решење?) кључне метрике (како мерите успех?)<br/>и непоштену предност (шта вам помаже да се истакнете у односу на конкуренцију?)<br/>Одговори на ова питања осмишљени су да подстакну успех, умање неуспехе и омогуће вам да пратите и потврдите своје претпоставке.<br/>Lean се своди на уклањање расипања и изградњу производа, продавница и решења која су потребна вашим купцима."
