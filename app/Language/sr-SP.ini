text.twoFA_disabled="На вашем налогу двофакторска аутентификација је <strong>онемогућена</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Управљај двофакторском аутентификацијом"
text.who_can_access="Изаберите ко може да види овај пројекат. Подразумевано корисници наслеђују улоге са којима су подешени. Ове улоге можете променити на картици „Тим“"
text.ical_export_description="Овде можете направити јединствени URL календара који вам омогућава да свој Leantime календар интегришете у било коју апликацију која подржава формат „iCal“. "
text.you_ical_url="URL вашег календара налази се испод. <br /> Имајте на уму да свако ко има овај URL може да приступи календару. Чувајте га у тајности као лозинку."
