; Strings added 2026-10 by machine translation (Claude), please review
tour.my_work.welcome_title="Добро дошли у обилазак контролне табле"
tour.my_work.welcome_text="Почнимо са неколико основних ствари како бисте се брзо снашли у навигацији и различитим елементима у Leantime-у."
tour.my_work.work_modes_title="Радни режими"
tour.my_work.work_modes_text="Горња навигација приказује тренутни „радни режим“ у којем се налазите. Можете бити у пројекту, у свом личном радном простору или у режиму компаније."
tour.my_work.left_nav_text="Лева навигација рашчлањује тренутни радни режим и даје вам приступ различитим областима. Све што је овде приказано део је радног режима који је тренутно изабран изнад."
tour.my_work.profile_bar_title="Моја трака профила"
tour.my_work.profile_bar_text="Овде ћете пронаћи линкове ка свом налогу, као и обавештења и најновије вести о Leantime-у."
tour.my_work.widgets_title="Виџети ваше контролне табле"
tour.my_work.widgets_text="Ваша контролна табла подељена је на различите виџете који приказују усмерене информације о вашем раду."
tour.my_work.customize_title="Прилагодите своју контролну таблу"
tour.my_work.customize_text="Виџетима можете да мењате величину и да их премештате превлачењем и отпуштањем."
tour.my_work.todos_title="Моји задаци"
tour.my_work.todos_text="Виџет „Моји задаци“ приказује све задатке који су вам тренутно додељени."
tour.my_work.group_todos_title="Груписање задатака"
tour.my_work.group_todos_text="Помоћу ових падајућих менија можете да филтрирате задатке по пројекту или да их групишете по приоритету, статусу, пројекту или датумима."
tour.my_work.sort_todos_title="Сортирање задатака"
tour.my_work.sort_todos_text="Сваки задатак можете превући и пустити да бисте променили његов редослед. Задатак можете превући и у календар да бисте га заказали."
tour.my_work.timer_title="Покрените тајмер"
tour.my_work.timer_text="Када будете спремни да почнете рад на задатку, само кликните на дугме за покретање тајмера."
tour.my_work.complete_task_title="Завршите задатак"
tour.my_work.complete_task_text="Када је задатак завршен, можете га означити као завршен кликом на падајући мени статуса."
tour.my_work.add_tasks_title="Додајте још задатака"
tour.my_work.add_tasks_text="Још задатака можете додати кликом на дугме плус у сваком одељку или помоћу менија са три тачке поред сваког задатка."
tour.my_work.finish_text="Завршили сте обилазак контролне табле „Мој рад“. Пређите на <a href='%s/dashboard/show'>свој пројекат</a> да бисте сазнали више о управљању пројектима у Leantime-у."
tour.project_dashboard.menu_title="Мени пројекта"
tour.project_dashboard.menu_text="Мени пројекта дели ваш пројекат на различите одељке: <strong>Соба података</strong> – за чување свих ваших датотека и информација, <strong>Размишљање</strong> – за осмишљавање стратегије, генерисање идеја и дефинисање, <strong>Израда</strong> – за управљање циљевима, прекретницама и задацима."
tour.project_dashboard.selector_title="Бирач пројеката"
tour.project_dashboard.selector_text="Помоћу бирача пројеката прелазите са једног пројекта на други. Леви мени приказује све што је повезано са вашим тренутним пројектом."
tour.project_dashboard.checklist_title="Контролна листа"
tour.project_dashboard.checklist_text="Контролна листа пројекта служи као брз преглед да ли ваш пројекат садржи све информације потребне за успешну реализацију."
tour.project_dashboard.status_title="Брза ажурирања статуса"
tour.project_dashboard.status_text="Помоћу ажурирања статуса можете брзо да поделите напредак пројекта са својим тимом користећи црвену, жуту и зелену боју. Статус ће бити видљив у целој апликацији."
tour.project_dashboard.progress_title="Напредак"
tour.project_dashboard.progress_text="Индикатор напретка пројекта показује колико сте посла завршили. Он узима у обзир различите величине задатака, брзину тима и прекретнице пројекта."
tour.project_dashboard.latest_tasks_title="Најновији задаци"
tour.project_dashboard.latest_tasks_text="Листа најновијих задатака приказује задатке који су последњи додати у ваш пројекат и може да служи као пријемно сандуче пројекта."
tour.project_dashboard.team_title="Тим"
tour.project_dashboard.team_text="Оквир тима приказује чланове овог пројекта."
tour.project_dashboard.finish_text="Завршили сте обилазак контролне табле пројекта. Пређите на одељак <a href='%s/tickets/showKanban'>Задаци</a> да бисте сазнали више о различитим начинима управљања задацима у Leantime-у."
tour.kanban_board.overview_title="Ваша Канбан табла"
tour.kanban_board.overview_text="Ово је ваша Канбан табла. Помаже вам да визуелно прикажете свој рад и ограничите количину посла у току."
tour.kanban_board.workflow_title="Ток рада"
tour.kanban_board.workflow_text="Задаци се крећу слева надесно како напредују. Превлачите и пуштајте картице да бисте ажурирали њихов статус."
tour.kanban_board.columns_title="Прилагодљиве колоне"
tour.kanban_board.columns_text="Помоћу менија са три тачке можете да додајете, уклањате и преименујете колоне."
tour.kanban_board.filter_title="Филтрирање задатака"
tour.kanban_board.filter_text="Задатке можете да филтрирате по различитим пољима, као што су приоритет, статус, пројекат или датуми."
tour.kanban_board.swimlanes_title="Хоризонталне траке"
tour.kanban_board.swimlanes_text="Поред тога, задатке можете да групишете и тако направите хоризонталне траке на Канбан табли. То вам помаже да свој рад визуелно прикажете по члановима тима, приоритету или прекретницама."
tour.kanban_board.sprints_title="Спринтови"
tour.kanban_board.sprints_text="Ако свој рад организујете у спринтовима, помоћу овог падајућег менија можете да бирате, правите и ажурирате спринтове."
tour.kanban_board.finish_text="Овим се завршава обилазак Канбан табле. Пређите на одељак <a href='%s/tickets/roadmap'>Прекретнице</a> да бисте сазнали како да правите прекретнице и управљате њима у Leantime-у."
tour.milestones.overview_title="Прекретнице"
tour.milestones.overview_text="Прекретнице вам помажу да пратите главне исходе и фазе пројекта."
tour.milestones.drag_title="Превлачење и сортирање"
tour.milestones.drag_text="Свака трака представља једну прекретницу. Можете да их превлачите дуж временске линије, мењате им редослед и величину. Све што урадите на овом екрану ажурира временски распоред ваших прекретница."
tour.milestones.filter_title="Филтер"
tour.milestones.filter_text="Прекретнице можете да филтрирате, а можете да прикажете и задатке који им припадају."
tour.milestones.timeframes_title="Временски оквири"
tour.milestones.timeframes_text="Можете да промените временски оквир приказа временске линије да бисте видели већи део године или детаљно разложили рад по данима."
tour.milestones.finish_text="Овим се завршава обилазак прекретница. Пређите на одељак <a href='%s/goalcanvas/dashboard'>Циљеви</a> да бисте сазнали како да правите циљеве и управљате њима у Leantime-у."
tour.goals.overview_title="Циљеви"
tour.goals.overview_text="Циљеви вам помажу да пратите мерљив утицај на своје пројекте."
tour.goals.parts_title="Сврхе и метрике"
tour.goals.parts_text="Сваки циљ се састоји од сврхе (оно што желите да постигнете) и метрике (начин на који ћете то мерити)."
tour.goals.progress_title="Напредак циља"
tour.goals.progress_text="Како будете ажурирали метрике циља, трака напретка ће показивати колико сте одмакли."
tour.goals.milestones_title="Прекретнице и циљеви"
tour.goals.milestones_text="Циљеве можете да повежете са прекретницама да бисте пратили напредак својих циљева на нивоу задатака. То помаже да уочите празнине у плану пројекта."
tour.goals.finish_text="Овим се завршава обилазак циљева. Прекретнице, циљеви и задаци основни су градивни елементи у Leantime-у. Користите их да поделите свој рад на управљиве делове. Пређите на <a href='%s/tickets/showKanban'>Канбан таблу</a> да бисте прегледали своје задатке."
