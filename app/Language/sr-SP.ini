text.my_work_dashboard_intro="Ваша контролна табла „Мој рад“ ставља у фокус све што је важно.<br/>Ваш најважнији рад сада је у првом плану, организован баш за вас и за начин на који ваш мозак најбоље ради.<br/><br/>Од брзих задатака до амбициозних циљева, све што вам треба је ту. Ово је ваш простор за бележење идеја, праћење напретка и прослављање успеха успут."
text.blueprints_intro="Нацрти су ваша прилика да дате смисао свим подацима. Leantime има низ алата и платана за дефинисање позадине пројекта кроз Business Model Canvas, SWOT анализу или мапе емпатије.<br/><br/>Ако не знате одакле да почнете, предлажемо да направите „Платно вредности пројекта“. Ово платно ће одговорити на најважнија питања вашег пројекта: Ко је ваш купац?<br/>Који проблем решавате?<br/>Које је ваше решење?<br/>Коју предност ваше решење нуди у односу на конкуренцију<br/>"
text.goals_tour_intro="Циљеви вам омогућавају да поделите пројекат на остварљиве, мерљиве и конкретне делове.<br/>Док су прекретнице усмерене на извршење, циљеви се тичу метрика које желите да постигнете.<br/>Сваки циљ треба да има јасну сврху (оно што желите да постигнете) и треба да буде лако мерљив помоћу једне метрике.<br/><br/>Када имате циљ, можете му доделити прекретнице да бисте га разложили на извршне задатке.<br/>"
text.project_dashboard_tour_intro="Пројекти у апликацији Leantime су заједнички радни простори у којима ви и ваш тим ефикасно организујете, пратите и испоручујете рад. Сваки пројекат служи као контејнер за повезане циљеве, задатке и прекретнице и омогућава вам да пратите напредак на једном централном месту.<br/><br/>Било да управљате послом, школом или интерним личним иницијативама, Leantime пројекти пружају структуру и алате потребне да идеје претворите у успешне исходе."
text.wiki_tour_intro="Наши документи вам омогућавају да пишете и делите документацију са својим тимом. Можете направити више простора да бисте документацију организовали по тимовима, областима или категоријама докумената.<br/>Правите документе да бисте делили знање, процесе и процедуре. Можете направити и документ за дељење линка ка датотеци или фасцикли у свом складишту у облаку.<br/>"
text.extend_leantime_latest_plugins="Проширите Leantime нашим најновијим додацима."
support.headline_help_us_build="Помозите нам да изградимо будућност у којој сви умови напредују!"
support.intro_text_1="Већина алата за продуктивност претпоставља да сви размишљају на исти начин: линеарно, са савршеном концентрацијом, мотивисани произвољним роковима. Било да имате АДХД и потребни су вам налети допамина од завршених задатака, да сте аутистични и жудите за доследном структуром, да имате дислексију и размишљате просторно, или сте једноставно уморни од алата који не одговарају начину на који ваш мозак заиста ради — вероватно сте потпуно одустали од управљања пројектима."
support.intro_text_2="Градимо Leantime за умове који раде другачије. То укључује неуродивергентне мозгове, али и свакога ко је икада осетио да се постојећи алати боре против његових природних образаца размишљања."
