text.lean.helper_content="Lean платно ће вас провести кроз цео процес валидације идеје за ваше ново пословање и/или производ.<br/>Бавићете се својим <em>сегментом купаца</em>, <em>проблемом, решењем</em>.<br/>Затим ћете прећи на своју <em>јединствену понуду вредности</em> (по чему је ваша идеја боља од других понуда?), <em>канале дистрибуције</em> (како ћете своје решење довести до купаца?), <em>токове прихода</em> (како ће ваше решење зарађивати?), <em>структуру трошкова</em> (колико вреди ваше решење?), <em>кључне метрике</em> (како ћете мерити успех?) и своју <em>непобедиву предност</em> (шта имате што ће вам помоћи да успете у односу на конкуренцију?)<br/>Одговори на ова питања осмишљени су да подстакну успех, ублаже неуспех и омогуће вам да пратите и потврдите своје претпоставке. Lean приступ значи уклањање расипања и рад на изградњи производа, пословања и решења која су вашим купцима потребна."
text.lean.disclaimer="Lean Canvas је прилагођен из <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> и лиценциран је под лиценцом <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
tour.lean.once_your_done="<em>Када будете задовољни својим Lean платном, пређите на</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Планер мапе пута</a>"


