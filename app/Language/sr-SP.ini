support.marcel_name="👋 Ја сам Марсел"
support.marcel_tagline="Имигрант из Немачке, отац ћерке са аутизмом, и сам живим са АДХД-ом."
support.marcel_bio_1="Традиционални алати за управљање пројектима никада ми нису легли. Деловало ми је као да су их направили неуротипични умови за неуротипичне умове. Када сам радио као фриленсер и борио се да клијентске пројекте одржим организованим, почео сам да градим нешто што ради у складу са мојим мозгом, а не против њега."
support.marcel_bio_2="Оно што је почело као лично решење постало је Leantime када сам схватио да милионима других треба исто."
support.gloria_name="👋 А ја сам Глорија"
support.gloria_tagline="Бивша медицинска сестра у хитној помоћи која је постала менаџерка производа, предузетница прве генерације латиноамеричког порекла."
support.gloria_bio_1="Провела сам године у медицинским окружењима под великим притиском, где организација буквално спасава животе. Али када сам покренула сопствени посао, традиционални алати за пројекте деловали су ми застрашујуће и неповезано са начином на који заиста размишљам и радим."
support.gloria_bio_2="Моје искуство у бихевиоралној науци и истраживању мотивације усмерава начин на који градимо функције које не само да организују задатке — већ вам помажу да заиста пожелите да их завршите."
support.closing_text="Можемо створити свет у којем нико не мора да се бори са својим алатима да би радио одличан посао. Ваше спонзорство финансира будућност у којој се софтвер прилагођава људској различитости, а не обрнуто."
