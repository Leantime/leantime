text.mattermost_instructions=" Ова интеграција ће објављивати обавештења о ажурирањима у канал по вашем избору.<br/>Пратите упутства <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>овде да бисте добили Incoming Webhook URL</a> из апликације Mattermost. Затим налепите линк у образац десно и кликните на „Сачувај“."
text.slack_instructions="Ова интеграција ће објављивати обавештења о ажурирањима у канал по вашем избору.<br/>Пратите упутства <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>овде да бисте добили Incoming Webhook URL</a> из апликације Slack. Затим налепите линк у образац десно и кликните на „Сачувај“."
text.choose_access_for_users="Означите или поништите избор корисника које желите да додате/уклоните. Више о улогама можете сазнати на <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Очекивани завршетак до"
text.zulip_instructions="Ова интеграција ће објављивати обавештења о ажурирањима у ток и тему по вашем избору.<br/>Пратите упутства <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>овде да бисте направили новог бота</a>. Затим налепите податке у образац десно и кликните на „Сачувај“."
text.discord_instructions="Ова интеграција ће објављивати обавештења о ажурирањима у канал по вашем избору.<br/>Пратите упутства <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>овде да бисте направили један или више webhook-ова</a>, затим налепите линк(ове) у поља десно и кликните на „Сачувај“."
text.no_conclusion_yet="<i>Још нема закључка</i>"
text.no_users_assigned_to_this_client="Овом клијенту још нису додати контакти. Додајте и доделите кориснике <a href='/users/showAll'>овде</a>"
text.confirm_delete_timesheet="Да ли заиста желите да обришете овај унос времена?"
text.timer_on_todo="<span class='head-icon fa fa-stop'></span> %1$s – тајмер на %2$s"
text.these_are_system_wide_settings="Ово су системска подешавања која утичу на изглед и доживљај целог вашег Leantime окружења."
text.company_name_helper="Приказује се у наслову странице и у имејловима"
text.advanced_boards_helper_content="Идеје се развијају, расту и сазревају. Ово је место где их пратите.<br/>Премештајте картице идеја из једне колоне у следећу да бисте приказали њихово тренутно стање.<br/>Ово је добро место да започнете истраживање, развијете прототипове и проверите их са неколико купаца пре него што почнете са имплементацијом."
text.backlog_helper_content="Листа чекања је дом свих ваших задатака: оних на којима тренутно радите и оних на којима планирате да радите.<br/><br/>Да бисте напредовали у решавању листе чекања, препоручујемо рад у кратким итерацијама – спринтовима.<br/>Спринтови су двонедељни временски интервали који вам омогућавају да се фокусирате на мање делове посла које можете испоручити.<br/>На крају две недеље требало би да имате нешто за „демо“. Нешто што пружа вредност вашим корисницима или клијентима.<br/><br/>На овом екрану можете да организујете листу задатака и управљате њом, да одређујете приоритете у листи чекања превлачењем и да премештате ставке из листе чекања у тренутни спринт.<br/>Желите више информација? Започните обилазак или затворите прозор да бисте почели!"
text.glad_youre_here="Драго нам је што сте овде. Одвојимо минут да се упознамо."
text.business_research_section="Наш одељак за пословно истраживање је нови дом за ваше идеје. Осмишљен је да вас проведе кроз кораке развоја купаца, истраживања проблема и осмишљавања решења."
text.our_roadmap_design="Наша мапа пута осмишљена је да вас од мањих, управљивих прекретница доведе до завршетка целине. Планирајте прекретнице у трајању од око 3 месеца и користите ове ознаке пројекта да бисте остали на правом путу."
text.this_is_where_you_spend_most_time="Овде ћете проводити највише времена – радећи. Планирајте двонедељне спринтове и успешно их спроводите уз Канбан таблу и наше алате за листу чекања. Користите ретроспективе да бисте напредовали у следећем спринту."
text.idea_board_helper_content="Ово је место за прикупљање свих ваших идеја. Разговарајте о новим идејама са тимом и повежите прекретнице да бисте видели напредак ка остварењу идеја."
text.kanban_helper_content="Канбан је јапанска реч за „картицу“. Канбан табле су увели Тојотини инжењери 40-их година у оквиру Lean производње.<br/>Користе се за брзо визуелно дељење информација и напретка рада.<br/>Канбан табле су корисне за визуелизацију рада и статуса, управљање активним послом и послом у току, управљање током рада и брзо деловање ка Lean побољшањима."
text.my_timesheets_helper_content="Евиденција времена је место где пратите стварне сате рада на задатку.<br/>То је корисно за фактурисање, али и да проверите колико добро унапред планирате своје задатке.<br/>Временом Leantime може прилагодити рокове како би узео у обзир одступања у планирању."
text.new_project_helper_content="<p>Ово је место где ћете описати, дефинисати и поставити параметре свог пројекта. То је важно јер се тиме<br/>целом тиму саопштава који су приоритети, очекивања и смернице пројекта.</p><p><br/><em>О чему треба размислити: четири начела.<br/>Будите јасни, језгровити, потпуни и веродостојни.<br/><br/></em></p><p>Примена ових начела у описима пројеката држи све на истој страни и помаже да се смањи ризик од грешака и погрешних корака.</p><br/>Време је да почнете!<br/><br/>"
text.not_found_helper_content="<p>За ову страницу још немамо садржај.<br/>Користите наш линк „Потребна помоћ“ на дну да бисте сазнали више о томе шта овде можете да радите.</p>"
text.retros_helper_content="<p>Ретроспективе су кратка размишљања о послу, функционисању тима и, наравно, напретку.<br/>Овде ваш тим може да одвоји тренутак и усредсреди се на то шта је прошло добро, шта није и шта би следећи пут могло да се уради другачије.<br/>Препоручујемо да састанак за преглед одржавате у редовним интервалима или бар на крају сваке прекретнице.<br/></p>"
text.roadmap_helper_content="<p>Мапе пута помажу да се велики пројекти разложе на мање и управљивије делове.<br/><br/></p><p>Да бисте направили мапу пута, препоручујемо да поставите прекретнице које се могу остварити у периоду од 3 месеца.</p><p>Прекретнице су контролне тачке на путу ка завршетку пројекта.<br/>Једноставно речено: ако путујете аутомобилом преко целе земље, свака област кроз коју прођете могла би бити прекретница.<br/><br/>Кликните на „Додај прекретницу“ у горњем левом углу да бисте почели. Датум поставите на овој картици или директно у графикону мапе пута тако што ћете кликнути на прекретницу и превући је у календару.</p>"
text.show_clients_helper_content="<p>Клијенти/Производи организују ваше пројекте у категорије и омогућавају вам да одвојите различите групе.<br/><br/></p><p>Као консултант, већ радите са клијентима и ово је место где их можете организовати.</p><p>Ако сте продуктни тим, овај одељак можете користити да организујете и одвојите своја одељења (маркетинг, продаја, операције итд.).</p>"
text.show_projects_helper_content="<p>Пројекти су срце вашег пословања и Leantime платформе! Промене, развој, циљеви и све што можете да изградите или замислите укључиваће пројекте.<br/>Управљање пројектима је једноставно процес којим се осигурава да се пројекти испоруче на време, исправно и са стварном пословном вредношћу.<br/><br/>Овде ће живети ваши пројекти. Страница пројеката омогућава вам да направите пројекат и брзо видите број задатака, сате, буџет и клијента повезаног са пројектом.<br/><br/>Користите ову страницу за брз преглед свих својих пројеката.<br/><br/></p>"
text.new_db_version="Инсталирана је нова верзија. Да бисте користили Leantime, потребно је да ажурирате базу података.<br/><br/><strong>Обавезно направите резервну копију базе података пре овог ажурирања!</strong><br/>Ово може потрајати неколико минута."
text.update_was_successful="Ажурирање је успело, сада се можете пријавити. <a href='%1$s'>Иди на пријаву</a>"
text.this_script_will_set_up_leantime="Ова скрипта ће подесити вашу базу података и направити администраторски налог"
text.enter_new_password="Унесите нову лозинку да бисте је ресетовали."
text.enter_email_address_to_reset="Унесите своју имејл адресу да бисте ресетовали лозинку."
text.twoFA_qr="Скенирајте QR код испод у омиљеној OTP апликацији или у апликацији Google Authenticator"
text.twoFA_verify_code="Унесите код који вам је дала OTP апликација или апликација Google Authenticator"
text.twoFA_already_enabled="Двофакторска аутентификација је већ омогућена за ваш налог и обавезна је за пријаву.<br/><br/>Да бисте уклонили двофакторску аутентификацију, кликните на „Уклони“ испод"
