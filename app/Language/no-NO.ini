text.my_work_dashboard_intro="Dashbordet Mitt arbeid setter fokus på alt som betyr noe.<br/>Det viktigste arbeidet ditt står nå i sentrum, organisert for deg og slik hjernen din fungerer best.<br/><br/>Fra raske oppgaver til ambisiøse mål – alt du trenger, finner du her. Dette er stedet der du samler ideer, følger fremdriften og feirer seierne underveis."
text.blueprints_intro="Blueprints gir deg muligheten til å få oversikt over alle dataene. Leantime har en rekke verktøy og canvas for å definere prosjektbakgrunnen med Business Model Canvas, SWOT-analyse eller empatikart.<br/><br/>Hvis du ikke vet hvor du skal begynne, foreslår vi at du oppretter et «Project Value Canvas». Dette canvaset besvarer de viktigste spørsmålene i prosjektet ditt: Hvem er kunden din?<br/>Hvilket problem løser du?<br/>Hva er løsningen din?<br/>Hvilken fordel gir løsningen din sammenlignet med konkurrentene?<br/>"
text.goals_tour_intro="Med mål kan du dele opp prosjektet ditt i oppnåelige, målbare og handlingsrettede deler.<br/>Mens milepæler handler om gjennomføring, handler mål om måltallene du vil oppnå.<br/>Hvert mål bør ha en tydelig hensikt (det du vil oppnå) og være enkelt å måle med ett enkelt måltall.<br/><br/>Når du har et mål, kan du knytte milepæler til det for å dele det opp i oppgaver som kan utføres.<br/>"
text.project_dashboard_tour_intro="Prosjekter i Leantime er samarbeidsområder der du og teamet ditt organiserer, følger opp og leverer arbeid effektivt. Hvert prosjekt samler relaterte mål, oppgaver og milepæler, og lar deg følge fremdriften på ett sentralt sted.<br/><br/>Enten du styrer arbeid, skole eller interne personlige initiativer, gir prosjektene i Leantime deg strukturen og verktøyene du trenger for å gjøre ideer om til gode resultater."
text.wiki_tour_intro="Med dokumentene våre kan du skrive og dele dokumentasjon med teamet ditt. Du kan opprette flere områder for å organisere dokumentasjonen etter team, områder eller dokumentkategori.<br/>Opprett dokumenter for å dele kunnskap, prosesser og rutiner. Du kan også opprette et dokument for å dele en lenke til en fil eller mappe i skylagringen din.<br/>"
text.extend_leantime_latest_plugins="Utvid Leantime med de nyeste programtilleggene våre."
support.headline_help_us_build="Hjelp oss med å bygge en fremtid der alle hjerner trives!"
support.intro_text_1="De fleste produktivitetsverktøy tar for gitt at alle tenker likt: lineært, med perfekt fokus og motivert av vilkårlige frister. Enten du har ADHD og trenger dopaminkicket fra fullførte oppgaver, er autist og trenger fast struktur, har dysleksi og tenker romlig, eller bare er lei av verktøy som ikke passer til hvordan hjernen din faktisk fungerer – har du sannsynligvis gitt opp prosjektstyring helt."
support.intro_text_2="Vi bygger Leantime for hjerner som fungerer annerledes. Det gjelder nevrodivergente hjerner, men også alle som noen gang har følt at eksisterende verktøy motarbeider deres naturlige tankemønstre."
