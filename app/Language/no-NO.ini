text.these_are_system_wide_settings="Dette er systemomfattende innstillinger som påvirker utseendet på Leantime-opplevelsen din."
text.company_name_helper="Vises i sidetittelen og i e-poster"
text.advanced_boards_helper_content="Ideer utvikler seg, vokser og modnes. Her holder du oversikt over dem.<br/>Flytt idékort fra én kolonne til den neste for å vise hvor de står nå.<br/>Dette er et godt sted å starte undersøkelser, utvikle prototyper og validere prototypene med noen kunder før du begynner å implementere."
text.backlog_helper_content="En backlog er hjemmet til alle oppgavene dine – både de du jobber med nå og de du planlegger å jobbe med.<br/><br/>For å komme videre med backloggen anbefaler vi å jobbe i korte iterasjoner – sprinter.<br/>Sprinter er tidsavgrensede perioder på to uker som lar deg fokusere på mindre arbeidsbiter som kan leveres.<br/>Etter to uker bør du ha noe å vise frem – noe som gir verdi for brukerne eller kundene dine.<br/><br/>På denne skjermen kan du organisere og administrere oppgavelisten, prioritere backloggen med dra og slipp og flytte elementer fra backloggen inn i den nåværende sprinten.<br/>Vil du vite mer? Start omvisningen eller lukk for å komme i gang!"
text.glad_youre_here="Vi er glade for at du er her. La oss bruke et minutt på å bli kjent."
text.business_research_section="Seksjonen for forretningsutforskning er det nye hjemmet for ideene dine. Den tar deg gjennom trinnene i kundeutvikling, problemutforskning og idéutvikling for løsninger."
text.our_roadmap_design="Veikartet tar deg fra mindre, håndterbare milepæler til det store bildet. Planlegg milepæler på rundt 3 måneder, og bruk disse prosjektmarkørene til å holde kursen."
text.this_is_where_you_spend_most_time="Det er her du kommer til å bruke mesteparten av tiden – på å gjøre jobben. Planlegg sprinter på 2 uker og gjennomfør dem med Kanban-tavlen og backlog-verktøyene. Bruk retrospektiver til å bli bedre til neste sprint."
text.idea_board_helper_content="Her samler du alle ideene dine. Diskuter nye ideer med teamet ditt og knytt til milepæler for å se fremdriften."
text.kanban_helper_content="Kanban er japansk for «kort». Kanban-tavler ble tatt i bruk av ingeniører hos Toyota på 40-tallet som en del av lean-produksjon.<br/>De brukes til å dele informasjon og arbeidsfremdrift visuelt og raskt.<br/>Kanban-tavler er nyttige for å visualisere arbeid og status, styre pågående arbeid, administrere arbeidsflyten og raskt gjennomføre lean-forbedringer."
text.my_timesheets_helper_content="I tidsskjemaene registrerer du de faktiske timene som er brukt på en oppgave.<br/>Det er nyttig for fakturering, men også for å se hvor godt du planlegger oppgavene på forhånd.<br/>Over tid kan Leantime justere forfallsdatoer for å ta høyde for avvik i planleggingen."
text.new_project_helper_content="<p>Her beskriver og definerer du prosjektet og setter rammene for det. Dette er viktig, fordi det er dette som formidler til<br/>hele teamet hva prosjektets prioriteringer, forventninger og retningslinjer er.</p><p><br/><em>Ting å tenke på her: de 4 K-ene.<br/>Vær klar, kortfattet, komplett og kredibel.<br/><br/></em></p><p>Når prosjektbeskrivelsene oppfyller dette, er alle på samme side, og risikoen for feil og feiltrinn blir mindre.</p><br/>Nå er det på tide å komme i gang!<br/><br/>"
text.not_found_helper_content="<p>Vi har ikke innhold for denne siden ennå.<br/>Bruk lenken «Trenger du hjelp» nederst for å lære mer om hva du kan gjøre her.</p>"
text.retros_helper_content="<p>Retrospektiver er korte refleksjoner over arbeidet, hvordan teamet fungerer og selvfølgelig fremdriften.<br/>Her kan teamet ta seg tid til å se nærmere på hva som gikk bra, hva som ikke gikk bra og hva som kan gjøres annerledes neste gang.<br/>Vi anbefaler å holde et gjennomgangsmøte med jevne mellomrom, eller i det minste på slutten av hver milepæl.<br/></p>"
text.roadmap_helper_content="<p>Veikart er nyttige for å dele store prosjekter opp i mindre og mer håndterbare biter.<br/><br/></p><p>For å lage veikartet anbefaler vi å sette milepæler som kan nås innen 3 måneder.</p><p>Milepæler er sjekkpunkter på veien mot et ferdig prosjekt.<br/>Enkelt sagt: Hvis du kjører gjennom hele landet, kan hvert fylke du passerer være en milepæl.<br/><br/>Klikk «Legg til milepæl» øverst til venstre for å komme i gang. Angi datoen i denne fanen eller direkte i veikartdiagrammet ved å klikke og dra milepælen i kalenderen.</p>"
text.show_clients_helper_content="<p>Kunder/produkter deler prosjektene dine inn i kategorier og lar deg skille ulike grupper fra hverandre.<br/><br/></p><p>Som konsulent jobber du allerede med kunder, og det er her du organiserer dem.</p><p>Hvis du er et produktteam, kan du bruke denne seksjonen til å organisere og skille avdelingene dine (markedsføring, salg, drift osv.).</p>"
text.show_projects_helper_content="<p>Prosjekter er hjertet i virksomheten din og i Leantime! Endring, utvikling, mål og alt du kan bygge eller drømme om, involverer prosjekter.<br/>Prosjektledelse er rett og slett prosessen med å sørge for at prosjektene leveres i tide, riktig og med reell forretningsverdi.<br/><br/>Det er her prosjektene dine bor. På prosjektsiden kan du opprette prosjekter og raskt se antall oppgaver, timer, budsjett og kunden som er knyttet til prosjektet.<br/><br/>Bruk denne siden for en rask oversikt over alle prosjektene dine.<br/><br/></p>"
text.new_db_version="En ny versjon er installert. For å bruke Leantime må du oppdatere databasen.<br/><br/><strong>Sørg for å ta sikkerhetskopi av databasen før du utfører denne oppdateringen!</strong><br/>Dette kan ta noen minutter."
