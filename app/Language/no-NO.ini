support.marcel_name="👋 Jeg er Marcel"
support.marcel_tagline="Tysk innvandrer, pappa til en autistisk datter og har selv ADHD."
support.marcel_bio_1="Tradisjonelle prosjektstyringsverktøy fungerte aldri for meg. De føltes som om de var laget av nevrotypiske hjerner for nevrotypiske hjerner. Da jeg jobbet som frilanser og slet med å holde orden på kundeprosjektene, begynte jeg å bygge noe som fungerte med hjernen min i stedet for mot den."
support.marcel_bio_2="Det som startet som en personlig løsning, ble Leantime da jeg innså at millioner av andre trengte det samme."
support.gloria_name="👋 Og jeg er Gloria"
support.gloria_tagline="Tidligere akuttsykepleier som ble produktsjef, førstegenerasjons latinamerikansk gründer."
support.gloria_bio_1="Jeg tilbrakte år i medisinske miljøer med høyt press, der organisering bokstavelig talt redder liv. Men da jeg startet min egen bedrift, føltes tradisjonelle prosjektverktøy overveldende og frakoblet fra hvordan jeg faktisk tenker og jobber."
support.gloria_bio_2="Bakgrunnen min innen atferdsvitenskap og motivasjonsforskning styrer hvordan vi bygger funksjoner som ikke bare organiserer oppgaver – de hjelper deg med å faktisk ha lyst til å fullføre dem."
support.closing_text="Vi kan skape en verden der ingen trenger å kjempe mot verktøyene sine for å gjøre et godt arbeid. Sponsingen din finansierer en fremtid der programvare tilpasser seg menneskelig mangfold, ikke omvendt."
