text.onboarding_default_project_details="Velkommen til ditt første prosjekt i Leantime!<br />Her kan du organisere oppgaver, følge med på mål og planlegge arbeidet ditt. Du kan gjerne endre hva som helst her eller opprette flere prosjekter etter hvert. Dette prosjektet er bare for deg, slik at du kommer i gang"
label.onboarding_milestone_getting_started="Kom i gang"
label.onboarding_task_community_chat="Bli med i fellesskapschatten vår"
text.onboarding_task_community_chat="Fellesskapschatten vår er et flott sted å stille spørsmål og få tilbakemeldinger på prosjektoppsettet. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Fellesskapschat</a>"
label.onboarding_task_invite_team="Inviter teammedlemmene dine"
text.onboarding_task_invite_team="Enten du jobber sammen med noen eller bare trenger en ansvarspartner: Når dere bruker Leantime som gruppe, er det lettere å holde kursen og motivasjonen oppe <a href='%s'>Brukeradministrasjon</a>"
label.onboarding_task_project_structure="Lær mer om prosjektstrukturen i Leantime"
text.onboarding_task_project_structure="Vi har mange flere ressurser i hjelpedokumentasjonen vår. For å lære mer om prosjektstruktur og beste praksis i Leantime, gå til: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Opprett et mål"
text.onboarding_task_create_goal="Mål brukes til å følge og måle langsiktige målsetninger. De bør kunne måles med måltall som du oppdaterer jevnlig. Mål og milepæler kan kobles sammen, slik at du ser fremdriften i gjennomføringen samtidig med fremdriften i måltallene <a href='%s'>Prosjektmål</a>"
label.onboarding_task_create_milestone="Opprett en milepæl"
text.onboarding_task_create_milestone="Med milepæler kan du dele inn prosjektets faser i avgrensede resultater. Hver milepæl har en start- og sluttdato og bør levere et konkret resultat <a href='%s'>Prosjektmilepæl</a>"
label.onboarding_task_personal_project="Utforsk ditt personlige prosjekt"
text.onboarding_task_personal_project="Det personlige prosjektet ditt er et sted der du kan organisere oppgavene, målene og arbeidet ditt. Du finner det via prosjektvelgeren øverst eller ved å klikke på denne lenken: <a href='%s'>Mitt prosjekt</a>"
label.onboarding_task_complete_profile="Fullfør Leantime-profilen min"
text.onboarding_task_complete_profile="Oppdater profilbildet og fullfør arbeidsinnstillingene for å tilpasse opplevelsen min. <a href='%s'>Min profil</a>"
label.onboarding_goalboard_title="Mine mål"
label.onboarding_goal_metric="Oppgaver fullført i tide"
label.onboarding_goal_objective="Bygg mitt produktivitetssystem"
label.onboarding_step_name_first_task="Gi den første oppgaven din et navn"
label.onboarding_step_invite_team="Inviter teamet ditt"
label.onboarding_step_name_project="Gi prosjektet ditt et navn"

