text.full_lean_canvas_helper_content="Den fullstendige utforskningstavlen leder deg gjennom hele prosessen med å validere en idé.<br/>På denne siden tar du igjen for deg kundesegment, problem og løsning (men ikke bekymre deg – har du allerede fylt ut dette på den enkle tavlen, ser du det igjen her!).<br/>Deretter går du videre til tydelig verdiforslag (hva gjør ideen din bedre enn andre tilbud?),<br/>salgskanaler (hvordan får kundene tak i løsningen din?)<br/>inntektsstrømmer (hvordan tjener løsningen din penger?)<br/>kostnadsstruktur (hvor mye er løsningen din verdt?), nøkkeltall (hvordan måler du suksess?)<br/>og urettferdig fordel (hva får deg til å skille deg ut fra konkurrentene?)<br/>Svarene på disse spørsmålene skal bidra til suksess, redusere risikoen for feil og la deg følge opp og validere antakelsene dine.<br/>Lean handler om å eliminere sløsing og bygge produkter, butikker og løsninger som kundene dine trenger."
