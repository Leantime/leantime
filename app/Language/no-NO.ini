headlines.lean.analysis="Beskriv Lean Canvas-et ditt"
headlines.lean.welcome_to_board="Velkommen til Lean Canvas-tavlen!"

text.lean.helper_content="Lean Canvas tar deg gjennom hele valideringsprosessen for den nye forretnings- og/eller produktidéen din.<br/>Du tar for deg <em>kundesegment</em>, <em>problem og løsning</em>.<br/>Derfra går du videre til <em>unikt verdiforslag</em> (hva gjør idéen din bedre enn andre tilbud?), <em>distribusjonskanaler</em> (hvordan når løsningen frem til kundene?), <em>inntektsstrømmer</em> (hvordan skal løsningen tjene penger?), <em>kostnadsstruktur</em> (hva er løsningen verdt?), <em>nøkkeltall</em> (hvordan måler du suksess?) og <em>urettferdig fortrinn</em> (hva har du som hjelper deg å lykkes i konkurransen?)<br/>Spørsmålene skal fremme suksess, redusere risikoen for å mislykkes og la deg følge opp og validere antakelsene dine. Å være lean handler om å fjerne sløsing og bygge produkter, virksomheter og løsninger som kundene dine trenger."
text.lean.disclaimer="Lean Canvas er tilpasset fra <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> og er lisensiert under lisensen <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Navngivelse-DelPåSammeVilkår 3.0</a>"
tour.lean.once_your_done="<em>Når du er fornøyd med Lean Canvas-et, går du til</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Veikartplanleggeren</a>"


