text.mattermost_instructions=" Denne integrasjonen publiserer oppdateringsvarsler i kanalen du velger.<br/>Følg instruksjonene <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>her for å få en URL for innkommende webhook</a> fra Mattermost. Lim deretter inn lenken i skjemaet til høyre og klikk Lagre."
text.slack_instructions="Denne integrasjonen publiserer oppdateringsvarsler i kanalen du velger.<br/>Følg instruksjonene <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>her for å få en URL for innkommende webhook</a> fra Slack. Lim deretter inn lenken i skjemaet til høyre og klikk Lagre."
text.choose_access_for_users="Huk av eller fjern haken for brukerne du vil legge til / fjerne. Du kan lese mer om rollene på <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="Forventes ferdig innen"
text.zulip_instructions="Denne integrasjonen publiserer oppdateringsvarsler i strømmen og emnet du velger.<br/>Følg instruksjonene <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>her for å opprette en ny bot</a>. Lim deretter inn informasjonen i skjemaet til høyre og klikk Lagre."
text.discord_instructions="Denne integrasjonen publiserer oppdateringsvarsler i kanalen du velger.<br/>Følg instruksjonene <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>her for å opprette en eller flere nye webhooks</a>, lim deretter inn lenken(e) i feltene til høyre og klikk Lagre."
