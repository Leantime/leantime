tour.my_work.welcome_title="Velkommen til omvisningen på dashbordet"
tour.my_work.welcome_text="La oss starte med noen grunnleggende ting, slik at du raskt blir kjent med navigasjonen og de ulike elementene i Leantime."
tour.my_work.work_modes_title="Arbeidsmoduser"
tour.my_work.work_modes_text="Toppnavigasjonen viser hvilken «arbeidsmodus» du er i nå. Du kan være i et prosjekt, i ditt personlige arbeidsområde eller i firmamodus."
tour.my_work.left_nav_text="Venstre navigasjon deler opp den gjeldende arbeidsmodusen og gir deg tilgang til ulike områder. Alt som vises her, hører til arbeidsmodusen som er valgt ovenfor."
tour.my_work.profile_bar_title="Min profillinje"
tour.my_work.profile_bar_text="Her finner du lenker til kontoen din, i tillegg til varsler og de siste nyhetene om Leantime."
tour.my_work.widgets_title="Widgetene på dashbordet ditt"
tour.my_work.widgets_text="Dashbordet ditt er delt inn i ulike widgets som viser deg målrettet informasjon om arbeidet ditt."
tour.my_work.customize_title="Tilpass dashbordet ditt"
tour.my_work.customize_text="Du kan endre størrelse på widgets og flytte dem rundt med dra-og-slipp."
tour.my_work.todos_title="Mine oppgaver"
tour.my_work.todos_text="Widgeten Mine oppgaver viser alle oppgavene som er tildelt deg nå."
tour.my_work.group_todos_title="Grupper oppgaver"
tour.my_work.group_todos_text="Med nedtrekksmenyene her kan du filtrere oppgavene etter prosjekt eller gruppere dem etter prioritet, status, prosjekt eller datoer."
tour.my_work.sort_todos_title="Sorter oppgaver"
tour.my_work.sort_todos_text="Du kan dra og slippe hver oppgave for å endre rekkefølgen. Du kan også dra en oppgave til kalenderen for å planlegge den."
tour.my_work.timer_title="Start tidtakeren"
tour.my_work.timer_text="Når du er klar til å begynne på en oppgave, klikker du bare på knappen for å starte tidtakeren."
tour.my_work.complete_task_title="Fullfør en oppgave"
tour.my_work.complete_task_text="Når en oppgave er fullført, kan du merke den som ferdig ved å klikke på nedtrekksmenyen for status."
tour.my_work.add_tasks_title="Legg til flere oppgaver"
tour.my_work.add_tasks_text="Du kan legge til flere oppgaver ved å klikke på plussknappen i hver seksjon, eller via menyen med tre prikker ved siden av hver oppgave."
tour.my_work.finish_text="Du har fullført omvisningen på dashbordet Mitt arbeid. Gå til <a href='%s/dashboard/show'>prosjektet ditt</a> for å lære mer om prosjektstyring i Leantime."
tour.project_dashboard.menu_title="Prosjektmeny"
tour.project_dashboard.menu_text="Prosjektmenyen deler prosjektet inn i ulike seksjoner: <strong>Datarom</strong> – for alle filene og all informasjonen din, <strong>Tenk</strong> – for å legge strategi, utvikle ideer og definere, <strong>Lag</strong> – for å styre mål, milepæler og oppgaver."
tour.project_dashboard.selector_title="Prosjektvelger"
tour.project_dashboard.selector_text="Bruk prosjektvelgeren til å bytte mellom prosjekter. Menyen til venstre viser alt som hører til det nåværende prosjektet."
tour.project_dashboard.checklist_title="Sjekkliste"
tour.project_dashboard.checklist_text="Prosjektsjekklisten gir deg en rask oversikt over om prosjektet inneholder all informasjonen som trengs for en vellykket gjennomføring."
tour.project_dashboard.status_title="Raske statusoppdateringer"
tour.project_dashboard.status_text="Med statusoppdateringer kan du raskt dele fremdriften i prosjektet med teamet ditt ved hjelp av fargene rød, gul og grønn. Statusen vises i hele applikasjonen."
tour.project_dashboard.progress_title="Fremdrift"
tour.project_dashboard.progress_text="Fremdriftsindikatoren for prosjektet viser hvor mye arbeid du har fullført. Den tar hensyn til ulike oppgavestørrelser, teamets hastighet og prosjektets milepæler."
tour.project_dashboard.latest_tasks_title="Siste oppgaver"
tour.project_dashboard.latest_tasks_text="Listen over siste oppgaver viser oppgavene som sist ble lagt til i prosjektet, og kan brukes som en innboks for prosjektet."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Teamboksen viser medlemmene i dette prosjektet."
tour.project_dashboard.finish_text="Du har fullført omvisningen på prosjektdashbordet. Gå til <a href='%s/tickets/showKanban'>Oppgaver</a> for å lære mer om de ulike måtene du kan styre oppgavene dine på i Leantime."
tour.kanban_board.overview_title="Kanban-tavlen din"
tour.kanban_board.overview_text="Dette er Kanban-tavlen din. Den hjelper deg med å visualisere arbeidet og begrense pågående arbeid."
tour.kanban_board.workflow_title="Arbeidsflyt"
tour.kanban_board.workflow_text="Oppgavene flyttes fra venstre mot høyre etter hvert som de kommer videre. Dra og slipp kort for å oppdatere statusen."
tour.kanban_board.columns_title="Fleksible kolonner"
tour.kanban_board.columns_text="Via menyen med tre prikker kan du legge til, fjerne og gi nytt navn til kolonner."
tour.kanban_board.filter_title="Filtrer oppgaver"
tour.kanban_board.filter_text="Du kan filtrere oppgavene etter ulike felt, som prioritet, status, prosjekt eller datoer."
tour.kanban_board.swimlanes_title="Svømmebaner"
tour.kanban_board.swimlanes_text="Du kan også gruppere oppgavene for å lage svømmebaner på Kanban-tavlen. Slik kan du visualisere arbeidet etter teammedlemmer, prioritet eller milepæler."
tour.kanban_board.sprints_title="Sprinter"
tour.kanban_board.sprints_text="Hvis du jobber i sprinter, kan du bruke nedtrekksmenyen her til å velge, opprette og oppdatere sprinter."
tour.kanban_board.finish_text="Dette avslutter omvisningen i Kanban. Gå til <a href='%s/tickets/roadmap'>Milepæler</a> for å lære hvordan du oppretter og styrer milepæler i Leantime."
tour.milestones.overview_title="Milepæler"
tour.milestones.overview_text="Med milepæler kan du følge med på viktige resultater og prosjektfaser."
tour.milestones.drag_title="Dra og sorter"
tour.milestones.drag_text="Hver stolpe representerer én milepæl. Du kan dra dem langs tidslinjen, endre rekkefølgen og endre størrelsen. Alt du gjør på denne skjermen, oppdaterer tidspunktene for milepælene dine."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Du kan filtrere milepælene og også se oppgavene som hører til dem."
tour.milestones.timeframes_title="Tidsrammer"
tour.milestones.timeframes_text="Du kan endre tidsrammen for tidslinjevisningen for å se mer av året eller gå i dybden på en oversikt dag for dag."
tour.milestones.finish_text="Dette avslutter omvisningen for milepæler. Gå til <a href='%s/goalcanvas/dashboard'>Mål</a> for å lære hvordan du oppretter og styrer mål i Leantime."
tour.goals.overview_title="Mål"
tour.goals.overview_text="Med mål kan du følge med på målbar effekt i prosjektene dine."
tour.goals.parts_title="Målsetninger og måltall"
tour.goals.parts_text="Hvert mål består av en målsetning (det du prøver å oppnå) og et måltall (hvordan du skal måle det)."
tour.goals.progress_title="Fremdrift for mål"
tour.goals.progress_text="Når du oppdaterer måltallene for målene dine, viser fremdriftslinjen hvor langt du har kommet."
tour.goals.milestones_title="Milepæler og mål"
tour.goals.milestones_text="Du kan koble mål til milepæler for å følge fremdriften for målene dine på oppgavenivå. Det hjelper deg med å finne hull i prosjektplanen."
tour.goals.finish_text="Dette avslutter omvisningen for mål. Milepæler, mål og oppgaver er de grunnleggende byggesteinene i Leantime. Bruk dem til å dele opp arbeidet i håndterbare deler. Gå til <a href='%s/tickets/showKanban'>Kanban-tavlen</a> for å se gjennom oppgavene dine."
