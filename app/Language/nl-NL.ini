text.mattermost_instructions="Deze integratie zal updatemeldingen op het kanaal van jouw keuze plaatsen.<br/>Volg de instructies <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>hier om een inkomende webhook-URL</a> van Mattermost te krijgen. Plak vervolgens de link in het formulier aan de rechterkant en klik op Opslaan."
