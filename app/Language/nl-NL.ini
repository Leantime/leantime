text.onboarding_default_project_details="Welkom bij je eerste project in Leantime!<br />Dit is jouw plek om taken te organiseren, doelen te volgen en je werk te plannen. Pas hier gerust alles aan of maak extra projecten aan naarmate je groeit. Dit project is er alleen voor jou, om mee te beginnen"
label.onboarding_milestone_getting_started="Aan de slag"
label.onboarding_task_community_chat="Word lid van onze communitychat"
text.onboarding_task_community_chat="Onze communitychat is een prima plek om vragen te stellen en feedback te krijgen op de opzet van je project. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Communitychat</a>"
label.onboarding_task_invite_team="Nodig je teamgenoten uit"
text.onboarding_task_invite_team="Of je nu met iemand samenwerkt of gewoon een stok achter de deur nodig hebt: Leantime als groep gebruiken helpt je om op koers en gemotiveerd te blijven <a href='%s'>Gebruikersmanagement</a>"
label.onboarding_task_project_structure="Lees meer over de projectstructuur van Leantime"
text.onboarding_task_project_structure="In onze helpdocumentatie vind je nog veel meer informatie. Wil je meer weten over de projectstructuur in Leantime en best practices? Ga naar: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Maak een doel aan"
text.onboarding_task_create_goal="Met doelen volg en meet je doelstellingen op de lange termijn. Ze moeten meetbaar zijn aan de hand van meetwaarden die je regelmatig kunt bijwerken. Koppel doelen en mijlpalen aan elkaar om de voortgang van de uitvoering te zien naast de voortgang van de meetwaarden <a href='%s'>Projectdoelen</a>"
label.onboarding_task_create_milestone="Maak een mijlpaal aan"
text.onboarding_task_create_milestone="Met mijlpalen deel je de fases van je projecten op in afzonderlijke resultaten. Elke mijlpaal heeft een start- en einddatum en moet iets opleveren <a href='%s'>Projectmijlpaal</a>"
label.onboarding_task_personal_project="Ontdek je persoonlijke project"
text.onboarding_task_personal_project="Je persoonlijke project is een plek waar je je taken, doelen en werk kunt organiseren. Je opent het via de projectselector bovenaan of door op deze link te klikken: <a href='%s'>Mijn project</a>"
label.onboarding_task_complete_profile="Mijn Leantime-profiel aanvullen"
text.onboarding_task_complete_profile="Profielfoto bijwerken en werkvoorkeuren aanvullen om mijn ervaring te personaliseren. <a href='%s'>Mijn profiel</a>"
label.onboarding_goalboard_title="Mijn doelen"
label.onboarding_goal_metric="Taken op tijd afgerond"
label.onboarding_goal_objective="Mijn productiviteitssysteem opbouwen"
