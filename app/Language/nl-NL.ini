text.my_work_dashboard_intro="Je dashboard Mijn werk brengt alles wat ertoe doet in beeld.<br/>Je belangrijkste werk staat nu centraal, georganiseerd voor jou en de manier waarop jouw brein het beste werkt.<br/><br/>Van snelle taken tot ambitieuze doelen: alles wat je nodig hebt, vind je hier. Dit is jouw plek om ideeën vast te leggen, voortgang bij te houden en onderweg successen te vieren."
text.blueprints_intro="Met blauwdrukken breng je orde in al je gegevens. Leantime biedt allerlei tools en canvassen om de achtergrond van je project te definiëren, zoals Business Model Canvassen, SWOT-analyses of empathiekaarten.<br/><br/>Weet je niet waar je moet beginnen? Dan raden we je aan een “Project Waarde Canvas” te maken. Dit canvas beantwoordt de belangrijkste vragen over je project: Wie is je klant?<br/>Welk probleem los je op?<br/>Wat is je oplossing?<br/>Welk voordeel biedt je oplossing ten opzichte van je concurrenten?<br/>"
text.goals_tour_intro="Met doelen verdeel je je project in haalbare, meetbare en uitvoerbare stukken.<br/>Waar mijlpalen draaien om uitvoering, gaan doelen over de meetwaarden die je wilt bereiken.<br/>Elk doel moet een duidelijke doelstelling hebben (wat je wilt bereiken) en eenvoudig meetbaar zijn met één meetwaarde.<br/><br/>Zodra je een doel hebt, kun je er mijlpalen aan toewijzen om het op te splitsen in uitvoerbare taken.<br/>"
text.project_dashboard_tour_intro="Projecten in Leantime zijn gezamenlijke werkruimtes waarin jij en je team werk efficiënt organiseren, volgen en opleveren. Elk project bundelt samenhangende doelen, taken en mijlpalen, zodat je de voortgang op één centrale plek kunt volgen.<br/><br/>Of je nu werk, school of persoonlijke initiatieven beheert, Leantime-projecten bieden de structuur en tools om ideeën om te zetten in succesvolle resultaten."
text.wiki_tour_intro="Met onze Docs schrijf en deel je documentatie met je team. Je kunt meerdere ruimtes aanmaken om je documentatie te ordenen per team, gebied of documentcategorie.<br/>Maak documenten aan om kennis, processen en procedures te delen. Je kunt ook een document maken om een link naar een bestand of map in je cloudopslag te delen.<br/>"
text.extend_leantime_latest_plugins="Breid Leantime uit met onze nieuwste plug-ins."
support.headline_help_us_build="Help ons een toekomst te bouwen waarin elk brein kan floreren!"
support.intro_text_1="De meeste productiviteitstools gaan ervan uit dat iedereen op dezelfde manier denkt: lineair, perfect gefocust en gemotiveerd door willekeurige deadlines. Of je nu ADHD hebt en dopamine nodig hebt van afgeronde taken, autistisch bent en verlangt naar een vaste structuur, dyslexie hebt en ruimtelijk denkt, of gewoon genoeg hebt van tools die niet passen bij hoe je brein echt werkt — waarschijnlijk heb je projectmanagement helemaal opgegeven."
support.intro_text_2="We bouwen Leantime voor breinen die anders werken. Dat zijn neurodivergente breinen, maar ook iedereen die ooit het gevoel had dat bestaande tools tegen zijn natuurlijke denkpatronen in werken."
