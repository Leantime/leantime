text.full_lean_canvas_helper_content="Het volledige onderzoeksbord begeleidt je door het hele proces van ideevalidatie.<br/>Op deze pagina behandel je opnieuw je klantsegment, probleem en oplossing (maar geen zorgen: als je dit al op het eenvoudige bord hebt ingevuld, zie je het hier terug!).<br/>Daarna ga je verder met een duidelijke waardepropositie (wat maakt je idee beter dan ander aanbod?),<br/>verkoopkanalen (hoe komen klanten aan je oplossing?)<br/>inkomstenstromen (hoe levert je oplossing geld op?)<br/>kostenstructuur (hoeveel is je oplossing waard?), kernmetrieken (hoe meet je succes?)<br/>en oneerlijk voordeel (waarmee onderscheid je je van de concurrentie?)<br/>Het beantwoorden van deze vragen is bedoeld om succes te stimuleren, mislukkingen te beperken en je aannames te kunnen volgen en valideren.<br/>Lean draait om het elimineren van verspilling en het bouwen van producten, winkels en oplossingen die je klanten nodig hebben."
