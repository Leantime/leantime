headlines.lean.analysis="Beschrijf je lean canvas"
headlines.lean.welcome_to_board="Welkom bij het Lean canvas bord!"

text.lean.helper_content="Het lean canvas neemt je mee door het volledige validatieproces van je nieuwe bedrijfs- en/of productidee.<br/>Je behandelt je <em>klantsegment</em>, <em>probleem en oplossing</em>.<br/>Daarna ga je verder met je <em>unieke waardepropositie</em> (wat maakt je idee beter dan ander aanbod?), je <em>distributiekanalen</em> (hoe breng je je oplossing bij je klanten?), je <em>inkomstenstromen</em> (hoe gaat je oplossing geld opleveren?), je <em>kostenstructuur</em> (hoeveel is je oplossing waard?), <em>kernmetrieken</em> (hoe meet je succes?) en je <em>oneerlijk voordeel</em> (wat heb jij dat je helpt om de concurrentie voor te blijven?)<br/>Het beantwoorden van deze vragen is bedoeld om succes te bevorderen, mislukkingen te beperken en je aannames te kunnen volgen en valideren. Lean werken draait om het elimineren van verspilling en het bouwen van producten, bedrijven en oplossingen die je klanten nodig hebben."
text.lean.disclaimer="Lean Canvas is afgeleid van het <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> en valt onder de licentie <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Naamsvermelding-GelijkDelen 3.0</a>"
tour.lean.once_your_done="<em>Als jij je comfortabel bij jouw Lean canvas, ga dan naar de </em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Stappenplan Planner</a>"


