tour.my_work.welcome_title="Welkom bij de dashboardtour"
tour.my_work.welcome_text="Laten we beginnen met een paar basisprincipes, zodat je snel wegwijs wordt in de navigatie en de verschillende onderdelen van Leantime."
tour.my_work.work_modes_title="Werkmodi"
tour.my_work.work_modes_text="De bovenste navigatie toont de ‘werkmodus’ waarin je je op dit moment bevindt. Je kunt in een project zitten, in je persoonlijke werkruimte of in de bedrijfsmodus."
tour.my_work.left_nav_text="De linkernavigatie deelt de huidige werkmodus op en geeft je toegang tot verschillende onderdelen. Alles wat je hier ziet, hoort bij de werkmodus die hierboven is geselecteerd."
tour.my_work.profile_bar_title="Mijn profielbalk"
tour.my_work.profile_bar_text="Hier vind je links naar je account, je meldingen en het laatste nieuws over Leantime."
tour.my_work.widgets_title="Je dashboardwidgets"
tour.my_work.widgets_text="Je dashboard is opgedeeld in verschillende widgets die je gerichte informatie over je werk tonen."
tour.my_work.customize_title="Je dashboard aanpassen"
tour.my_work.customize_text="Je kunt widgets van formaat veranderen en verplaatsen door ze te slepen en neer te zetten."
tour.my_work.todos_title="Mijn taken"
tour.my_work.todos_text="De widget Mijn taken toont alle taken die op dit moment aan jou zijn toegewezen."
tour.my_work.group_todos_title="Taken groeperen"
tour.my_work.group_todos_text="Met de vervolgkeuzelijsten hier kun je je taken filteren op project of ze groeperen op prioriteit, status, project of datum."
tour.my_work.sort_todos_title="Taken sorteren"
tour.my_work.sort_todos_text="Je kunt elke taak slepen en neerzetten om de volgorde te wijzigen. Je kunt een taak ook naar de kalender slepen om hem in te plannen."
tour.my_work.timer_title="Start de timer"
tour.my_work.timer_text="Ben je klaar om aan een taak te beginnen? Klik dan gewoon op de knop om de timer te starten."
tour.my_work.complete_task_title="Een taak afronden"
tour.my_work.complete_task_text="Is een taak klaar, dan kun je hem als gereed markeren via de vervolgkeuzelijst voor de status."
tour.my_work.add_tasks_title="Meer taken toevoegen"
tour.my_work.add_tasks_text="Je kunt meer taken toevoegen door op de plusknop in elke sectie te klikken of via het menu met de drie puntjes naast elke taak."
tour.my_work.finish_text="Je hebt de tour door het dashboard Mijn werk afgerond. Ga naar <a href='%s/dashboard/show'>je project</a> voor meer informatie over projectbeheer in Leantime."
tour.project_dashboard.menu_title="Projectmenu"
tour.project_dashboard.menu_text="Het projectmenu deelt je project op in verschillende secties: <strong>Dataroom</strong> - om al je bestanden en informatie te bewaren, <strong>Denk</strong> - om je strategie te bepalen, ideeën te bedenken en zaken te definiëren, <strong>Maak</strong> - om doelen, mijlpalen en taken te beheren."
tour.project_dashboard.selector_title="Projectselector"
tour.project_dashboard.selector_text="Met de projectselector spring je snel van het ene project naar het andere. Het linkermenu toont alles wat met je huidige project te maken heeft."
tour.project_dashboard.checklist_title="Checklist"
tour.project_dashboard.checklist_text="Met de projectchecklist zie je in één oogopslag of je project alle informatie bevat die nodig is voor een succesvolle uitvoering."
tour.project_dashboard.status_title="Snelle statusupdates"
tour.project_dashboard.status_text="Met statusupdates deel je snel de voortgang van je project met je team, aan de hand van de kleuren rood, geel en groen. De status is overal in de applicatie zichtbaar."
tour.project_dashboard.progress_title="Voortgang"
tour.project_dashboard.progress_text="De voortgangsindicator van het project laat zien hoeveel werk je al hebt afgerond. Daarbij wordt rekening gehouden met verschillende taakgroottes, de teamsnelheid en de projectmijlpalen."
tour.project_dashboard.latest_tasks_title="Laatste taken"
tour.project_dashboard.latest_tasks_text="De lijst met laatste taken toont de taken die het meest recent aan je project zijn toegevoegd en kun je gebruiken als inbox voor je project."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Het teamvak toont de leden van dit project."
tour.project_dashboard.finish_text="Je hebt de tour door het projectdashboard afgerond. Ga naar <a href='%s/tickets/showKanban'>Taken</a> voor meer informatie over de verschillende manieren om je taken in Leantime te beheren."
tour.kanban_board.overview_title="Je kanbanbord"
tour.kanban_board.overview_text="Dit is je kanbanbord. Het helpt je om je werk te visualiseren en het onderhanden werk te beperken."
tour.kanban_board.workflow_title="Werkstroom"
tour.kanban_board.workflow_text="Taken schuiven van links naar rechts naarmate ze vorderen. Sleep kaarten naar een andere kolom om hun status bij te werken."
tour.kanban_board.columns_title="Flexibele kolommen"
tour.kanban_board.columns_text="Via het menu met de drie puntjes kun je kolommen toevoegen, verwijderen en hernoemen."
tour.kanban_board.filter_title="Taken filteren"
tour.kanban_board.filter_text="Je kunt je taken filteren op verschillende velden, zoals prioriteit, status, project of datum."
tour.kanban_board.swimlanes_title="Swimlanes"
tour.kanban_board.swimlanes_text="Daarnaast kun je je taken groeperen om swimlanes op je kanbanbord te maken. Zo visualiseer je je werk per teamlid, prioriteit of mijlpaal."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Beheer je je werk in sprints? Dan kun je hier via de vervolgkeuzelijst sprints selecteren, aanmaken en bijwerken."
tour.kanban_board.finish_text="Hiermee is de Kanban-tour afgerond. Ga naar <a href='%s/tickets/roadmap'>Mijlpalen</a> om te leren hoe je mijlpalen aanmaakt en beheert in Leantime."
tour.milestones.overview_title="Mijlpalen"
tour.milestones.overview_text="Met mijlpalen houd je belangrijke resultaten en projectfases bij."
tour.milestones.drag_title="Slepen & sorteren"
tour.milestones.drag_text="Elke balk staat voor één mijlpaal. Je kunt de balken over de tijdlijn slepen, van volgorde veranderen en van formaat veranderen. Alles wat je op dit scherm doet, past de planning van je mijlpalen aan."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Je kunt je mijlpalen filteren en ook de taken bekijken die erbij horen."
tour.milestones.timeframes_title="Tijdsperiodes"
tour.milestones.timeframes_text="Je kunt de tijdsperiode van de tijdlijnweergave aanpassen om meer van het jaar te zien of juist in te zoomen op een overzicht per dag."
tour.milestones.finish_text="Hiermee is de mijlpalentour afgerond. Ga naar <a href='%s/goalcanvas/dashboard'>Doelen</a> om te leren hoe je doelen aanmaakt en beheert in Leantime."
tour.goals.overview_title="Doelen"
tour.goals.overview_text="Met doelen volg je de meetbare impact van je projecten."
tour.goals.parts_title="Doelstellingen & meetwaarden"
tour.goals.parts_text="Elk doel bestaat uit een doelstelling (wat je wilt bereiken) en een meetwaarde (hoe je dat gaat meten)."
tour.goals.progress_title="Voortgang van doelen"
tour.goals.progress_text="Wanneer je de meetwaarden van je doelen bijwerkt, laat de voortgangsbalk zien hoe ver je al bent."
tour.goals.milestones_title="Mijlpalen & doelen"
tour.goals.milestones_text="Je kunt doelen aan mijlpalen koppelen om de voortgang van je doelen op taakniveau te volgen. Zo ontdek je hiaten in je projectplanning."
tour.goals.finish_text="Hiermee is de doelentour afgerond. Mijlpalen, doelen en taken zijn de basisbouwstenen van Leantime. Gebruik ze om je werk op te delen in behapbare stukken. Ga naar het <a href='%s/tickets/showKanban'>kanbanbord</a> om je taken te bekijken."
