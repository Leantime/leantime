support.marcel_name="👋 Ik ben Marcel"
support.marcel_tagline="Duitse immigrant, vader van een autistische dochter en zelf ook ADHD'er."
support.marcel_bio_1="Traditionele projectmanagementtools hebben bij mij nooit gewerkt. Ze voelden alsof ze door neurotypische breinen voor neurotypische breinen waren gebouwd. Toen ik als freelancer worstelde om klantprojecten georganiseerd te houden, begon ik iets te bouwen dat met mijn brein meewerkte in plaats van ertegenin."
support.marcel_bio_2="Wat begon als een persoonlijke oplossing, werd Leantime toen ik besefte dat miljoenen anderen hetzelfde nodig hadden."
support.gloria_name="👋 En ik ben Gloria"
support.gloria_tagline="Voormalig SEH-verpleegkundige, nu productmanager, en Hispanic ondernemer van de eerste generatie."
support.gloria_bio_1="Ik heb jarenlang in medische omgevingen onder hoge druk gewerkt, waar organisatie letterlijk levens redt. Maar toen ik mijn eigen bedrijf begon, voelden traditionele projecttools overweldigend en stonden ze los van hoe ik echt denk en werk."
support.gloria_bio_2="Mijn achtergrond in gedragswetenschap en motivatieonderzoek bepaalt hoe we functies bouwen die niet alleen taken organiseren — ze zorgen ervoor dat je ze ook echt wilt afronden."
support.closing_text="We kunnen een wereld creëren waarin niemand met zijn tools hoeft te vechten om geweldig werk te leveren. Jouw sponsoring financiert een toekomst waarin software zich aanpast aan menselijke diversiteit, en niet andersom."
support.headline_ready_to_impact="Klaar om direct impact te maken?"
support.contribution_text="Elke bijdrage — van $1 tot $100 — gaat rechtstreeks naar het verbeteren van Leantime voor iedereen."
