text.my_work_dashboard_intro="Seu painel Meu Trabalho coloca em foco tudo o que importa.<br/>Seu trabalho mais importante agora fica em primeiro plano, organizado só para você e para o jeito como seu cérebro funciona melhor.<br/><br/>De tarefas rápidas a metas ambiciosas, tudo o que você precisa está aqui. Este é o seu espaço para registrar ideias, acompanhar o progresso e comemorar as conquistas pelo caminho."
text.blueprints_intro="As Plantas são sua oportunidade de dar sentido a todos os dados. O Leantime oferece várias ferramentas e canvas para definir o contexto do seu projeto, como Business Model Canvas, Análise SWOT ou Mapas de Empatia.<br/><br/>Se você não sabe por onde começar, sugerimos criar um “Canvas de Valor do Projeto”. Este canvas responderá às perguntas mais importantes do seu projeto: Quem é o seu cliente?<br/>Que problema você está resolvendo?<br/>Qual é a sua solução?<br/>Que benefício sua solução oferece em relação aos concorrentes?<br/>"
text.goals_tour_intro="As metas permitem dividir seu projeto em partes alcançáveis, mensuráveis e acionáveis.<br/>Enquanto os marcos focam na execução, as metas tratam das métricas que você quer alcançar.<br/>Cada meta deve ter um objetivo claro (aquilo que você quer alcançar) e ser facilmente mensurável com uma única métrica.<br/><br/>Depois de criar uma meta, você pode atribuir marcos a ela para dividi-la em tarefas executáveis.<br/>"
text.project_dashboard_tour_intro="Os projetos no Leantime são espaços de trabalho colaborativos onde você e sua equipe organizam, acompanham e entregam o trabalho com eficiência. Cada projeto funciona como um contêiner para metas, tarefas e marcos relacionados e permite acompanhar o progresso em um só lugar.<br/><br/>Seja no trabalho, nos estudos ou em iniciativas pessoais, os projetos do Leantime oferecem a estrutura e as ferramentas necessárias para transformar ideias em resultados de sucesso."
text.wiki_tour_intro="Nossos documentos permitem escrever e compartilhar documentação com sua equipe. Você pode criar vários espaços para organizar sua documentação por equipes, áreas ou categorias de documentos.<br/>Crie documentos para compartilhar conhecimento, processos e procedimentos. Você também pode criar um documento para compartilhar um link para um arquivo ou pasta no seu armazenamento em nuvem.<br/>"
text.extend_leantime_latest_plugins="Amplie o Leantime com nossos plugins mais recentes."
support.headline_help_us_build="Ajude-nos a construir um futuro em que todas as mentes prosperem!"
support.intro_text_1="A maioria das ferramentas de produtividade parte do princípio de que todos pensam da mesma forma: de modo linear, com foco perfeito, motivados por prazos arbitrários. Quer você tenha TDAH e precise da dose de dopamina de tarefas concluídas, seja autista e precise de uma estrutura consistente, tenha dislexia e pense de forma espacial, ou simplesmente esteja cansado de ferramentas que não combinam com o jeito como seu cérebro realmente funciona — provavelmente você já desistiu completamente do gerenciamento de projetos."
support.intro_text_2="Estamos construindo o Leantime para mentes que funcionam de forma diferente. Isso inclui cérebros neurodivergentes, mas também qualquer pessoa que já sentiu que as ferramentas existentes lutam contra seus padrões naturais de pensamento."
