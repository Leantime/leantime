## Strategy Message=

headline.sm.board="Quadro de Mensagem Estratégica"

box.sm.qa="Quais são os <em>segmentos de clientes-alvo</em> e quem está <em>explicitamente fora do escopo</em>?"
box.sm.qb="Qual <em>proposta de valor</em> você oferecerá aos seus clientes-alvo?"
box.sm.qc="Por que os clientes devem escolher fazer negócios com você, em vez de com seus concorrentes? Quais são nossas <em>características distintivas</em> difíceis de copiar?"
box.sm.qd="Por que você será capaz de cumprir as promessas feitas aos seus clientes? Quais <em>capacidades únicas</em> você possui e explora?"
box.sm.qe="O que <em>mudará</em> com a nova estratégia ou revisada e o que <em>permanecerá o mesmo</em> ao longo do tempo? Como você garante que os clientes existentes, que permanecem dentro do escopo, não sejam perdidos?"
box.sm.qf="Por que a estratégia permitirá <em>gerar e/ou aumentar lucros ao longo do tempo</em>?"
box.sm.qg="Quais são as metas definidas com a nova estratégia ou revisada <em>realisticamente alcançáveis</em>?"

