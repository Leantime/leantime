text.lean.helper_content="O Lean Canvas o guiará por todo o processo de validação de ideias para o seu novo negócio e/ou produto.<br/>Você abordará seu <em>Segmento de Clientes</em>, <em>Problema, Solução</em>.<br/>A partir daí, você passará para sua <em>Proposta de Valor Única</em> (o que torna sua ideia melhor do que outras ofertas?), seus <em>Canais de Distribuição</em> (como você entregará sua solução aos clientes?), suas <em>Fontes de Receita</em> (como sua solução gerará dinheiro?), sua <em>Estrutura de Custos</em> (quanto vale sua solução?), <em>Métricas Chave</em> (como você medirá o sucesso?) e sua <em>Vantagem Desleal</em> (o que você tem que o ajudará a ter sucesso contra a concorrência?)<br/>Responder a essas perguntas é projetado para promover o sucesso, mitigar falhas e permitir que você rastreie e valide suas suposições. Ser Lean é eliminar o desperdício e trabalhar para criar produtos, negócios e soluções que seus clientes precisam."
text.lean.disclaimer="O Lean Canvas é adaptado do <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> e é licenciado sob a licença <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>."
