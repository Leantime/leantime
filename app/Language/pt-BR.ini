text.insights.helper_content="O quadro <em>Observar / Aprender - Insights</em> ajuda você a coletar e estruturar insights de quatro fontes diferentes (observações etnográficas, entrevistas, grupos de foco e pesquisa secundária) e transformá-los em conhecimento.<br/>Ele oferece suporte às etapas de observação e aprendizado, às vezes chamadas de empatia e definição, do processo de Design Thinking.<br/>Você pode encontrar mais detalhes nos capítulos 2, 8 e 9 do livro <a href='https://inov.at/dts'><em>Design Thinking for Strategy</em></a>.<br/>Sugerimos que você use o quadro <em>Observar / Aprender - Insights</em> sempre que coletar e analisar novos insights, seja para uma análise de riscos, uma análise ambiental, para descobrir tendências da indústria ou para projetar novos produtos e serviços, para citar apenas alguns exemplos."
