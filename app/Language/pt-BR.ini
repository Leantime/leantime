support.marcel_name="👋 Eu sou o Marcel"
support.marcel_tagline="Imigrante alemão, pai de uma filha autista e também convivo com TDAH."
support.marcel_bio_1="As ferramentas tradicionais de gerenciamento de projetos nunca funcionaram para mim. Pareciam feitas por mentes neurotípicas para mentes neurotípicas. Quando eu trabalhava como freelancer e tinha dificuldade para manter os projetos dos clientes organizados, comecei a construir algo que funcionasse a favor do meu cérebro, e não contra ele."
support.marcel_bio_2="O que começou como uma solução pessoal se tornou o Leantime quando percebi que milhões de outras pessoas precisavam da mesma coisa."
support.gloria_name="👋 E eu sou a Gloria"
support.gloria_tagline="Ex-enfermeira de pronto-socorro que se tornou gerente de produto, empreendedora hispânica de primeira geração."
support.gloria_bio_1="Passei anos em ambientes médicos de alta pressão, onde a organização literalmente salva vidas. Mas quando abri meu próprio negócio, as ferramentas tradicionais de projetos pareciam sobrecarregantes e desconectadas do jeito como eu realmente penso e trabalho."
support.gloria_bio_2="Minha formação em ciência comportamental e pesquisa sobre motivação orienta como criamos recursos que não apenas organizam tarefas — eles fazem você realmente querer concluí-las."
support.closing_text="Podemos criar um mundo em que ninguém precise lutar contra suas ferramentas para fazer um ótimo trabalho. Seu patrocínio financia um futuro em que o software se adapta à diversidade humana, e não o contrário."
