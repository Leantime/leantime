tour.my_work.welcome_title="Bem-vindo ao Tour do Painel"
tour.my_work.welcome_text="Vamos começar com alguns conceitos básicos para você se familiarizar com a navegação e os diferentes elementos do Leantime."
tour.my_work.work_modes_title="Modos de Trabalho"
tour.my_work.work_modes_text="A navegação superior mostra o “modo de trabalho” em que você está. Você pode estar dentro de um projeto, na sua área de trabalho pessoal ou no modo Empresa."
tour.my_work.left_nav_text="A navegação lateral detalha o modo de trabalho atual e dá acesso às diferentes áreas. Tudo o que aparece aqui faz parte do modo de trabalho selecionado acima."
tour.my_work.profile_bar_title="Minha Barra de Perfil"
tour.my_work.profile_bar_text="Aqui você encontra links para a sua conta, além de notificações e as últimas novidades sobre o Leantime."
tour.my_work.widgets_title="Widgets do Seu Painel"
tour.my_work.widgets_text="Seu painel é dividido em vários widgets que mostram informações focadas sobre o seu trabalho."
tour.my_work.customize_title="Personalize Seu Painel"
tour.my_work.customize_text="Os widgets podem ser redimensionados e reposicionados arrastando e soltando."
tour.my_work.todos_title="Minhas Tarefas"
tour.my_work.todos_text="O widget Minhas Tarefas mostra todas as tarefas atualmente atribuídas a você."
tour.my_work.group_todos_title="Agrupar Tarefas"
tour.my_work.group_todos_text="Use os menus suspensos aqui para filtrar suas tarefas por projeto ou agrupá-las por prioridade, status, projeto ou datas."
tour.my_work.sort_todos_title="Ordenar Tarefas"
tour.my_work.sort_todos_text="Cada tarefa pode ser arrastada e solta para mudar sua ordem. Você também pode arrastar uma tarefa até o calendário para agendá-la."
tour.my_work.timer_title="Iniciar o Cronômetro"
tour.my_work.timer_text="Quando estiver pronto para começar a trabalhar em uma tarefa, basta clicar no botão de iniciar o cronômetro."
tour.my_work.complete_task_title="Concluir uma Tarefa"
tour.my_work.complete_task_text="Quando uma tarefa estiver concluída, você pode marcá-la como feita clicando no menu suspenso de status."
tour.my_work.add_tasks_title="Adicionar Mais Tarefas"
tour.my_work.add_tasks_text="Você pode adicionar mais tarefas clicando no botão de mais em cada seção ou usando o menu de 3 pontos ao lado de cada tarefa."
tour.my_work.finish_text="Você concluiu o tour do painel Meu Trabalho. Vá para <a href='%s/dashboard/show'>seu projeto</a> para saber mais sobre a gestão de projetos no Leantime."
tour.project_dashboard.menu_title="Menu do Projeto"
tour.project_dashboard.menu_text="O menu do projeto organiza seu projeto em diferentes seções: <strong>Sala de Arquivos</strong> - para guardar todos os seus arquivos e informações, <strong>Pensar</strong> - para criar estratégias, gerar ideias e definir, <strong>Fazer</strong> - para gerenciar metas, marcos e tarefas."
tour.project_dashboard.selector_title="Seletor de Projetos"
tour.project_dashboard.selector_text="Use o seletor de projetos para alternar entre projetos. O menu lateral mostra tudo o que está relacionado ao seu projeto atual."
tour.project_dashboard.checklist_title="Checklist"
tour.project_dashboard.checklist_text="O checklist do projeto é uma referência rápida para verificar se o seu projeto contém todas as informações necessárias para uma execução bem-sucedida."
tour.project_dashboard.status_title="Atualizações Rápidas de Status"
tour.project_dashboard.status_text="Use as atualizações de status para compartilhar rapidamente o andamento do seu projeto com a sua equipe usando as cores vermelho, amarelo e verde. O status ficará visível em toda a aplicação."
tour.project_dashboard.progress_title="Progresso"
tour.project_dashboard.progress_text="O indicador de progresso do projeto mostra quanto trabalho você já concluiu. Ele considera os diferentes tamanhos de tarefa, a velocidade da equipe e os marcos do projeto."
tour.project_dashboard.latest_tasks_title="Últimas Tarefas"
tour.project_dashboard.latest_tasks_text="A lista de últimas tarefas mostra as tarefas adicionadas mais recentemente ao seu projeto e pode ser usada como caixa de entrada do projeto."
tour.project_dashboard.team_title="Equipe"
tour.project_dashboard.team_text="O quadro da equipe mostra os membros deste projeto."
tour.project_dashboard.finish_text="Você concluiu o tour do painel do projeto. Vá para <a href='%s/tickets/showKanban'>Tarefas</a> para conhecer as várias formas de gerenciar suas tarefas no Leantime."
tour.kanban_board.overview_title="Seu Quadro Kanban"
tour.kanban_board.overview_text="Este é o seu quadro Kanban. Ele ajuda você a visualizar seu trabalho e a limitar o trabalho em andamento."
tour.kanban_board.workflow_title="Fluxo de Trabalho"
tour.kanban_board.workflow_text="As tarefas se movem da esquerda para a direita conforme avançam. Arraste e solte os cartões para atualizar o status deles."
tour.kanban_board.columns_title="Colunas Flexíveis"
tour.kanban_board.columns_text="Usando o menu de 3 pontos, você pode adicionar, remover e renomear colunas."
tour.kanban_board.filter_title="Filtrar Tarefas"
tour.kanban_board.filter_text="Você pode filtrar suas tarefas por vários campos, como prioridade, status, projeto ou datas."
tour.kanban_board.swimlanes_title="Raias"
tour.kanban_board.swimlanes_text="Além disso, você pode agrupar suas tarefas para criar raias no Kanban. Isso ajuda a visualizar seu trabalho por membro da equipe, prioridade ou marco."
tour.kanban_board.sprints_title="Sprints"
tour.kanban_board.sprints_text="Se você organiza seu trabalho em sprints, pode usar o menu suspenso aqui para selecionar, criar e atualizar sprints."
tour.kanban_board.finish_text="Assim termina o tour do Kanban. Vá para <a href='%s/tickets/roadmap'>Marcos</a> para aprender a criar e gerenciar marcos no Leantime."
tour.milestones.overview_title="Marcos"
tour.milestones.overview_text="Os marcos ajudam você a acompanhar os principais resultados e as fases do projeto."
tour.milestones.drag_title="Arrastar e Ordenar"
tour.milestones.drag_text="Cada barra representa um marco. Você pode arrastá-las ao longo da linha do tempo, reordená-las e redimensioná-las. Tudo o que você faz nesta tela atualiza as datas dos seus marcos."
tour.milestones.filter_title="Filtro"
tour.milestones.filter_text="Você pode filtrar seus marcos e também ver as tarefas que fazem parte deles."
tour.milestones.timeframes_title="Períodos"
tour.milestones.timeframes_text="Você pode mudar o período da linha do tempo para ver mais do ano ou detalhar o trabalho dia a dia."
tour.milestones.finish_text="Assim termina o tour dos marcos. Vá para <a href='%s/goalcanvas/dashboard'>Metas</a> para aprender a criar e gerenciar metas no Leantime."
tour.goals.overview_title="Metas"
tour.goals.overview_text="As metas ajudam você a acompanhar o impacto mensurável nos seus projetos."
tour.goals.parts_title="Objetivos e Métricas"
tour.goals.parts_text="Cada meta é composta por um Objetivo (o que você quer alcançar) e uma Métrica (como você vai medi-lo)."
tour.goals.progress_title="Progresso da Meta"
tour.goals.progress_text="À medida que você atualiza as métricas da meta, a barra de progresso mostra o quanto você já avançou."
tour.goals.milestones_title="Marcos e Metas"
tour.goals.milestones_text="Você pode conectar metas a marcos para acompanhar o progresso das suas metas no nível das tarefas. Isso ajuda a identificar lacunas no plano do seu projeto."
tour.goals.finish_text="Assim termina o tour das metas. Marcos, Metas e Tarefas são os blocos básicos do Leantime. Use-os para dividir seu trabalho em partes gerenciáveis. Vá para o <a href='%s/tickets/showKanban'>Quadro Kanban</a> para revisar suas tarefas."
