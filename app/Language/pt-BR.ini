label.onboarding_default_project_name="Meu Projeto"
text.onboarding_default_project_details="Bem-vindo ao seu primeiro projeto no Leantime!<br />Este é o seu espaço para organizar tarefas, acompanhar metas e planejar seu trabalho. Fique à vontade para alterar o que quiser aqui ou criar outros projetos conforme você cresce. Este projeto é só para você começar"
label.onboarding_milestone_getting_started="Primeiros Passos"
label.onboarding_task_community_chat="Participe do chat da nossa comunidade"
text.onboarding_task_community_chat="O chat da nossa comunidade é um ótimo recurso para tirar dúvidas e receber feedback sobre a configuração de projetos. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat da Comunidade</a>"
label.onboarding_task_invite_team="Convide seus colegas de equipe"
text.onboarding_task_invite_team="Seja para trabalhar com alguém ou só para ter um parceiro que cobre você. Usar o Leantime em grupo ajuda a manter o foco e a motivação <a href='%s'>Gestão de Usuário</a>"
label.onboarding_task_project_structure="Saiba Mais sobre a Estrutura de Projetos do Leantime"
text.onboarding_task_project_structure="Temos muitos recursos adicionais na nossa documentação de ajuda. Para saber mais sobre a estrutura de projetos no Leantime e as melhores práticas, acesse: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Crie uma Meta"
text.onboarding_task_create_goal="As metas servem para acompanhar e medir objetivos de longo prazo. Elas devem ser mensuráveis por meio de métricas que você possa atualizar regularmente. Metas e Marcos podem ser conectados para ver o progresso da execução junto com o progresso das métricas <a href='%s'>Metas do Projeto</a>"
label.onboarding_task_create_milestone="Crie um Marco"
text.onboarding_task_create_milestone="Os marcos permitem dividir as fases dos seus projetos em resultados distintos. Cada marco tem uma data de início e de término e deve gerar alguma entrega <a href='%s'>Marco do Projeto</a>"
label.onboarding_task_personal_project="Explore seu Projeto Pessoal"
text.onboarding_task_personal_project="Seu projeto pessoal é um espaço onde você pode organizar suas tarefas, metas e trabalho. Você pode acessá-lo pelo seletor de projetos no topo ou clicando neste link: <a href='%s'>Meu Projeto</a>"
label.onboarding_task_complete_profile="Completar meu perfil no Leantime"
text.onboarding_task_complete_profile="Atualizar a foto de perfil e completar as preferências de trabalho para personalizar minha experiência. <a href='%s'>Meu Perfil</a>"
