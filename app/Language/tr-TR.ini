support.marcel_name="👋 Ben Marcel"
support.marcel_tagline="Alman göçmen, otizmli bir kızın babası ve kendisi de DEHB ile yaşıyor."
support.marcel_bio_1="Geleneksel proje yönetimi araçları bana hiç uymadı. Nörotipik zihinler tarafından nörotipik zihinler için yapılmış gibi geliyorlardı. Serbest çalışırken müşteri projelerini düzenli tutmakta zorlandığımda, beynime karşı değil onunla birlikte çalışan bir şey geliştirmeye başladım."
support.marcel_bio_2="Kişisel bir çözüm olarak başlayan şey, milyonlarca kişinin de aynı şeye ihtiyaç duyduğunu fark ettiğimde Leantime'a dönüştü."
support.gloria_name="👋 Ben de Gloria"
support.gloria_tagline="Acil servis hemşireliğinden ürün yöneticiliğine geçmiş, birinci kuşak Hispanik girişimci."
support.gloria_bio_1="Yıllarımı, düzenin kelimenin tam anlamıyla hayat kurtardığı yüksek baskılı tıbbi ortamlarda geçirdim. Ancak kendi işimi kurduğumda geleneksel proje araçları bunaltıcı geldi ve gerçekte nasıl düşündüğüm ve çalıştığımla bağlantısızdı."
support.gloria_bio_2="Davranış bilimi ve motivasyon araştırmalarındaki geçmişim, yalnızca görevleri düzenlemekle kalmayıp onları gerçekten tamamlamak istemenize yardımcı olan özellikleri nasıl geliştirdiğimize yön veriyor."
support.closing_text="Kimsenin harika işler yapmak için araçlarıyla savaşmak zorunda kalmadığı bir dünya yaratabiliriz. Sponsorluğunuz, insanların yazılıma değil, yazılımın insan çeşitliliğine uyum sağladığı bir geleceği finanse ediyor."
