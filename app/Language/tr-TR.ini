text.lean.helper_content="Lean tuval, yeni iş ve/veya ürün fikrinizin tüm fikir doğrulama sürecinde size rehberlik eder.<br/><em>Müşteri Segmentinizi</em>, <em>Probleminizi ve Çözümünüzü</em> ele alacaksınız.<br/>Ardından <em>Benzersiz Değer Önerinize</em> (fikrinizi diğer tekliflerden daha iyi yapan nedir?), <em>Dağıtım Kanallarınıza</em> (çözümünüzü müşterilerinize nasıl ulaştıracaksınız?), <em>Gelir Akışlarınıza</em> (çözümünüz nasıl para kazandıracak?), <em>Maliyet Yapınıza</em> (çözümünüzün değeri nedir?), <em>Temel Metriklere</em> (başarıyı nasıl ölçeceksiniz?) ve <em>Haksız Avantajınıza</em> (rakiplerinize karşı başarılı olmanızı ne sağlayacak?) geçeceksiniz.<br/>Bu soruları yanıtlamak; başarıyı desteklemek, başarısızlığı azaltmak ve varsayımlarınızı takip edip doğrulamanızı sağlamak için tasarlanmıştır. Lean olmak, israfı ortadan kaldırmak ve müşterilerinizin ihtiyaç duyduğu ürünleri, işletmeleri ve çözümleri oluşturmak için çalışmak demektir."
text.lean.disclaimer="Lean Tuval, <a href='https://strategyzer.com/' target='_blank'>İş Modeli Tuvali</a>'nden uyarlanmıştır ve <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> lisansı ile lisanslanmıştır"
