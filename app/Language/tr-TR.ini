tour.my_work.welcome_title="Pano Turuna Hoş Geldiniz"
tour.my_work.welcome_text="Leantime'daki gezinme ve farklı öğeler hakkında hızla bilgi edinmeniz için birkaç temel bilgiyle başlayalım."
tour.my_work.work_modes_title="Çalışma Modları"
tour.my_work.work_modes_text="Üst gezinme çubuğu, içinde bulunduğunuz mevcut “çalışma modunu” gösterir. Bir projenin içinde, kişisel çalışma alanınızda ya da şirket modunda olabilirsiniz."
tour.my_work.left_nav_text="Sol gezinme çubuğu mevcut çalışma modunu bölümlere ayırır ve farklı alanlara erişmenizi sağlar. Burada gösterilen her şey, yukarıda seçili olan çalışma modunun bir parçasıdır."
tour.my_work.profile_bar_title="Profil Çubuğum"
tour.my_work.profile_bar_text="Burada hesabınıza ait bağlantıların yanı sıra bildirimleri ve Leantime ile ilgili en son haberleri bulacaksınız."
tour.my_work.widgets_title="Pano Widget'larınız"
tour.my_work.widgets_text="Panonuz, işinizle ilgili odaklanmış bilgiler gösteren çeşitli widget'lara bölünmüştür."
tour.my_work.customize_title="Panonuzu Özelleştirin"
tour.my_work.customize_text="Widget'lar sürükle ve bırak işleviyle yeniden boyutlandırılabilir ve taşınabilir."
tour.my_work.todos_title="Yapılacaklarım"
tour.my_work.todos_text="Yapılacaklarım widget'ı, şu anda size atanmış tüm görevleri gösterir."
tour.my_work.group_todos_title="Yapılacakları Gruplayın"
tour.my_work.group_todos_text="Buradaki açılır menüleri kullanarak görevlerinizi projeye göre filtreleyebilir veya önceliğe, duruma, projeye ya da tarihlere göre gruplayabilirsiniz."
tour.my_work.sort_todos_title="Yapılacakları Sıralayın"
tour.my_work.sort_todos_text="Her yapılacak iş, sırasını değiştirmek için sürüklenip bırakılabilir. Bir görevi planlamak için onu takvime de sürükleyip bırakabilirsiniz."
tour.my_work.timer_title="Zamanlayıcıyı Başlatın"
tour.my_work.timer_text="Bir görev üzerinde çalışmaya hazır olduğunuzda zamanlayıcıyı başlat düğmesine tıklamanız yeterli."
tour.my_work.complete_task_title="Bir Görevi Tamamlayın"
tour.my_work.complete_task_text="Bir görev tamamlandığında, durum açılır menüsüne tıklayarak onu tamamlandı olarak işaretleyebilirsiniz."
tour.my_work.add_tasks_title="Daha Fazla Görev Ekleyin"
tour.my_work.add_tasks_text="Her bölümdeki artı düğmesine tıklayarak veya her görevin yanındaki 3 noktalı menüyü kullanarak daha fazla görev ekleyebilirsiniz."
tour.my_work.finish_text="İşlerim panosu turunu tamamladınız. Leantime'da proje yönetimi hakkında daha fazla bilgi edinmek için <a href='%s/dashboard/show'>projenize</a> gidin."
tour.project_dashboard.menu_title="Proje Menüsü"
tour.project_dashboard.menu_text="Proje menüsü, projenizi farklı bölümler halinde düzenler: <strong>Veri Odası</strong> - tüm dosyalarınızı ve bilgilerinizi barındırmak için, <strong>Düşün</strong> - strateji geliştirmek, fikir üretmek ve tanımlamak için, <strong>Yap</strong> - hedefleri, mesafe taşlarını ve görevleri yönetmek için."
tour.project_dashboard.selector_title="Proje Seçici"
tour.project_dashboard.selector_text="Projeler arasında geçiş yapmak için proje seçiciyi kullanın. Sol menü, mevcut projenizle ilgili her şeyi gösterir."
tour.project_dashboard.checklist_title="Kontrol Listesi"
tour.project_dashboard.checklist_text="Proje kontrol listesi, projenizin başarılı bir şekilde yürütülmesi için gerekli tüm bilgileri içerip içermediğini görmenizi sağlayan hızlı bir başvuru kaynağıdır."
tour.project_dashboard.status_title="Hızlı Durum Güncellemeleri"
tour.project_dashboard.status_text="Durum güncellemelerini kullanarak projenizin ilerlemesini kırmızı, sarı ve yeşil renklerle ekibinizle hızlıca paylaşabilirsiniz. Durum, uygulamanın her yerinde görünür olacaktır."
tour.project_dashboard.progress_title="İlerleme"
tour.project_dashboard.progress_text="Proje ilerleme göstergesi, ne kadar iş tamamladığınızı gösterir. Farklı görev büyüklüklerini, ekip hızını ve proje mesafe taşlarını hesaba katar."
tour.project_dashboard.latest_tasks_title="Son Görevler"
tour.project_dashboard.latest_tasks_text="Son görevler listesi, projenize en son eklenen görevleri gösterir ve bir proje gelen kutusu olarak kullanılabilir."
tour.project_dashboard.team_title="Ekip"
tour.project_dashboard.team_text="Ekip kutusu, bu projenin üyelerini gösterir."
tour.project_dashboard.finish_text="Proje panosu turunu tamamladınız. Leantime'da görevlerinizi yönetmenin çeşitli yolları hakkında daha fazla bilgi edinmek için <a href='%s/tickets/showKanban'>Yapılacaklar</a> bölümüne gidin."
tour.kanban_board.overview_title="Kanban Panonuz"
tour.kanban_board.overview_text="Bu sizin Kanban panonuz. İşinizi görselleştirmenize ve devam eden işleri sınırlamanıza yardımcı olur."
tour.kanban_board.workflow_title="İş Akışı"
tour.kanban_board.workflow_text="Görevler ilerledikçe soldan sağa doğru hareket eder. Durumlarını güncellemek için kartları sürükleyip bırakın."
tour.kanban_board.columns_title="Esnek Sütunlar"
tour.kanban_board.columns_text="3 noktalı menüyü kullanarak sütun ekleyebilir, kaldırabilir ve sütunları yeniden adlandırabilirsiniz."
tour.kanban_board.filter_title="Görevleri Filtreleyin"
tour.kanban_board.filter_text="Görevlerinizi öncelik, durum, proje veya tarihler gibi çeşitli alanlara göre filtreleyebilirsiniz."
tour.kanban_board.swimlanes_title="Kulvarlar"
tour.kanban_board.swimlanes_text="Ayrıca görevlerinizi gruplayarak Kanban kulvarları oluşturabilirsiniz. Bu, işinizi ekip üyelerine, önceliğe veya mesafe taşlarına göre görselleştirmenize yardımcı olur."
tour.kanban_board.sprints_title="Sprint'ler"
tour.kanban_board.sprints_text="İşinizi sprint'ler halinde yönetiyorsanız, buradaki açılır menüyü kullanarak sprint seçebilir, oluşturabilir ve güncelleyebilirsiniz."
tour.kanban_board.finish_text="Kanban turu burada sona eriyor. Leantime'da mesafe taşlarının nasıl oluşturulup yönetileceğini öğrenmek için <a href='%s/tickets/roadmap'>Mesafe Taşları</a> bölümüne gidin."
tour.milestones.overview_title="Mesafe Taşları"
tour.milestones.overview_text="Mesafe taşları, önemli sonuçları ve proje aşamalarını takip etmenize yardımcı olur."
tour.milestones.drag_title="Sürükle & Sırala"
tour.milestones.drag_text="Her çubuk bir mesafe taşını temsil eder. Bunları zaman tüneli boyunca sürükleyebilir, yeniden sıralayabilir ve yeniden boyutlandırabilirsiniz. Bu ekranda yaptığınız her şey mesafe taşlarınızın zamanlamasını günceller."
tour.milestones.filter_title="Filtre"
tour.milestones.filter_text="Mesafe taşlarınızı filtreleyebilir ve bunlara ait görevleri de görüntüleyebilirsiniz."
tour.milestones.timeframes_title="Zaman Aralıkları"
tour.milestones.timeframes_text="Yılın daha büyük bir bölümünü görmek veya günlük bir dökümün ayrıntılarına inmek için zaman tüneli görünümünün zaman aralığını değiştirebilirsiniz."
tour.milestones.finish_text="Mesafe taşı turu burada sona eriyor. Leantime'da hedeflerin nasıl oluşturulup yönetileceğini öğrenmek için <a href='%s/goalcanvas/dashboard'>Hedefler</a> bölümüne gidin."
tour.goals.overview_title="Hedefler"
tour.goals.overview_text="Hedefler, projeleriniz üzerindeki ölçülebilir etkiyi takip etmenize yardımcı olur."
tour.goals.parts_title="Amaçlar & Metrikler"
tour.goals.parts_text="Her hedef bir Amaç (neyi başarmaya çalıştığınız) ve bir Metrikten (bunu nasıl ölçeceğiniz) oluşur."
tour.goals.progress_title="Hedef İlerlemesi"
tour.goals.progress_text="Hedef metriklerinizi güncelledikçe ilerleme çubuğu ne kadar yol aldığınızı gösterir."
tour.goals.milestones_title="Mesafe Taşları & Hedefler"
tour.goals.milestones_text="Hedeflerinizin görev düzeyindeki ilerlemesini takip etmek için hedefleri mesafe taşlarına bağlayabilirsiniz. Bu, proje planınızdaki eksiklikleri belirlemenize yardımcı olur."
tour.goals.finish_text="Hedefler turu burada sona eriyor. Mesafe Taşları, Hedefler ve Yapılacaklar, Leantime'ın temel yapı taşlarıdır. İşinizi yönetilebilir parçalara bölmek için bunları kullanın. Görevlerinizi gözden geçirmek için <a href='%s/tickets/showKanban'>Kanban Panosu</a> sayfasına gidin."
