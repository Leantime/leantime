text.full_lean_canvas_helper_content="Kapsamlı araştırma panosu, fikir doğrulama sürecinin tamamında size rehberlik eder.<br/>Bu sayfada müşteri segmentinizi, probleminizi ve çözümünüzü yeniden ele alacaksınız (endişelenmeyin, bunları basit panoda zaten doldurduysanız burada tekrar göreceksiniz!).<br/>Ardından Net Değer Önerisi'ne (Fikrinizi diğer tekliflerden daha iyi yapan nedir?),<br/>Satış Kanalları'na (Müşteriler çözümünüze nasıl ulaşır?)<br/>Gelir Akışları'na (Çözümünüz nasıl para kazandırır?)<br/>Maliyet Yapısı'na (Çözümünüzün değeri nedir?), Temel Metrikler'e (Başarıyı nasıl ölçersiniz?)<br/>ve haksız avantaja (Rakiplerinizden sıyrılmanızı ne sağlar?) geçeceksiniz.<br/>Bu soruları yanıtlamak; başarıyı desteklemek, başarısızlıkları azaltmak ve varsayımlarınızı takip edip doğrulamanızı sağlamak için tasarlanmıştır.<br/>Lean, israfı ortadan kaldırmak ve müşterilerinizin ihtiyaç duyduğu ürünleri, mağazaları ve çözümleri oluşturmak için çalışmakla ilgilidir."
