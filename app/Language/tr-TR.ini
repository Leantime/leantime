text.mattermost_instructions=" Bu entegrasyon, seçtiğiniz kanala güncelleme bildirimleri gönderir.Bu entegrasyon, seçtiğiniz kanala güncelleme bildirimleri gönderir.<br/>Talimatları takip et <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>bir Gelen Web kancası URL'si almak için buraya</a> Mattermost'tan. Ardından bağlantıyı sağdaki forma yapıştırın ve Kaydet'e tıklayın."
