label.onboarding_default_project_name="Projem"
text.onboarding_default_project_details="Leantime'daki ilk projenize hoş geldiniz!<br />Burası görevleri düzenleyeceğiniz, hedefleri takip edeceğiniz ve işinizi planlayacağınız alanınız. Burada istediğiniz her şeyi değiştirebilir veya büyüdükçe ek projeler oluşturabilirsiniz. Bu proje yalnızca başlamanıza yardımcı olmak için hazırlandı"
label.onboarding_milestone_getting_started="Başlarken"
label.onboarding_task_community_chat="Topluluk sohbetimize katılın"
text.onboarding_task_community_chat="Topluluk sohbetimiz, soru sormak ve proje kurulumu hakkında geri bildirim almak için harika bir kaynaktır. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Topluluk Sohbeti</a>"
label.onboarding_task_invite_team="Ekip arkadaşlarınızı davet edin"
text.onboarding_task_invite_team="İster biriyle birlikte çalışıyor olun ister yalnızca sizi sorumlu tutacak bir arkadaşa ihtiyacınız olsun, Leantime'ı bir grup olarak kullanmak yolda ve motive kalmanıza yardımcı olur <a href='%s'>Kullanıcı Yönetimi</a>"
label.onboarding_task_project_structure="Leantime'ın Proje Yapısı Hakkında Daha Fazla Bilgi Edinin"
text.onboarding_task_project_structure="Yardım belgelerimizde çok sayıda ek kaynak bulunuyor. Leantime'daki proje yapısı ve en iyi uygulamalar hakkında daha fazla bilgi edinmek için şu adresi ziyaret edin: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Bir Hedef Oluşturun"
text.onboarding_task_create_goal="Hedefler, uzun vadeli amaçları takip etmek ve ölçmek için kullanılır. Düzenli olarak güncelleyebileceğiniz metriklerle ölçülebilir olmalıdırlar. Metrik ilerlemesini görüntülerken uygulama ilerlemesini de görmek için Hedefler ve Mesafe Taşları birbirine bağlanabilir <a href='%s'>Proje Hedefleri</a>"
label.onboarding_task_create_milestone="Bir Mesafe Taşı Oluşturun"
text.onboarding_task_create_milestone="Mesafe taşları, projelerinizin aşamalarını belirgin sonuçlar halinde sınıflandırmanızı sağlar. Her mesafe taşının bir başlangıç ve bitiş tarihi vardır ve bir çıktı sunmalıdır <a href='%s'>Proje Mesafe Taşı</a>"
label.onboarding_task_personal_project="Kişisel Projenizi Keşfedin"
text.onboarding_task_personal_project="Kişisel projeniz, görevlerinizi, hedeflerinizi ve işlerinizi düzenleyebileceğiniz bir alandır. Ona üstteki proje seçiciden veya buradaki bağlantıya tıklayarak erişebilirsiniz: <a href='%s'>Projem</a>"
label.onboarding_task_complete_profile="Leantime profilimi tamamla"
text.onboarding_task_complete_profile="Deneyimimi kişiselleştirmek için profil fotoğrafımı güncelle ve çalışma tercihlerimi tamamla. <a href='%s'>Profilim</a>"
