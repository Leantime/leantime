text.my_work_dashboard_intro="İşlerim panonuz önemli olan her şeyi odağa getirir.<br/>En önemli işleriniz artık tam önünüzde; size ve beyninizin en iyi nasıl çalıştığına göre düzenlenmiş.<br/><br/>Hızlı görevlerden iddialı hedeflere kadar ihtiyacınız olan her şey burada. Burası fikirleri yakalayacağınız, ilerlemeyi takip edeceğiniz ve yol boyunca başarıları kutlayacağınız alanınız."
text.blueprints_intro="Blueprints, tüm verileri anlamlandırma fırsatınızdır. Leantime, proje arka planınızı İş Modeli Tuvalleri, SWOT Analizi veya Empati Haritaları ile tanımlamanız için çeşitli araçlar ve tuvaller sunar.<br/><br/>Nereden başlayacağınızı bilmiyorsanız bir 'Proje Değer Tuvali' oluşturmanızı öneririz. Bu tuval projenizin en önemli sorularını yanıtlar: Müşteriniz kim?<br/>Hangi sorunu çözüyorsunuz?<br/>Çözümünüz nedir?<br/>Çözümünüz rakiplerinize göre ne gibi bir fayda sağlıyor?<br/>"
text.goals_tour_intro="Hedefler, projenizi ulaşılabilir, ölçülebilir ve uygulanabilir parçalara ayırmanızı sağlar.<br/>Mesafe taşları yürütmeye odaklanırken hedefler ulaşmak istediğiniz ölçütlerle ilgilidir.<br/>Her hedefin net bir amacı (ulaşmak istediğiniz şey) olmalı ve tek bir ölçütle kolayca ölçülebilmelidir.<br/><br/>Bir hedef oluşturduktan sonra, onu uygulanabilir görevlere bölmek için hedefe mesafe taşları atayabilirsiniz.<br/>"
text.project_dashboard_tour_intro="Leantime'daki projeler, sizin ve ekibinizin işleri verimli bir şekilde düzenlediği, takip ettiği ve teslim ettiği ortak çalışma alanlarıdır. Her proje ilgili hedefler, görevler ve mesafe taşları için bir kapsayıcı görevi görür ve ilerlemeyi tek bir merkezden izlemenizi sağlar.<br/><br/>İster iş, ister okul, ister kişisel girişimleri yönetiyor olun, Leantime projeleri fikirleri başarılı sonuçlara dönüştürmek için gereken yapıyı ve araçları sunar."
text.wiki_tour_intro="Dokümanlarımız, ekibinizle dokümantasyon yazıp paylaşmanızı sağlar. Dokümantasyonunuzu ekiplere, alanlara veya doküman kategorilerine göre düzenlemek için birden fazla alan oluşturabilirsiniz.<br/>Bilgileri, süreçleri ve prosedürleri paylaşmak için dokümanlar oluşturun. Bulut depolamanızdaki bir dosyanın veya klasörün bağlantısını paylaşmak için de bir doküman oluşturabilirsiniz.<br/>"
text.extend_leantime_latest_plugins="En yeni eklentilerimizle Leantime'ı genişletin."
support.headline_help_us_build="Tüm zihinlerin geliştiği bir gelecek inşa etmemize yardım edin!"
support.intro_text_1="Çoğu üretkenlik aracı herkesin aynı şekilde düşündüğünü varsayar: doğrusal, mükemmel bir odakla ve keyfi son tarihlerle motive olarak. İster DEHB'niz olsun ve tamamlanan görevlerden dopamin almaya ihtiyaç duyun, ister otizmli olun ve tutarlı bir yapı arayın, ister disleksiniz olsun ve mekânsal düşünün, ister sadece beyninizin gerçekte nasıl çalıştığına uymayan araçlardan bıkmış olun — muhtemelen proje yönetiminden tamamen vazgeçmişsinizdir."
support.intro_text_2="Leantime'ı farklı çalışan zihinler için geliştiriyoruz. Buna nöroçeşitli beyinler de dahil, ama aynı zamanda mevcut araçların doğal düşünme biçimine karşı savaştığını hisseden herkes de."
