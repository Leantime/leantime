label.onboarding_default_project_name="Il mio progetto"
text.onboarding_default_project_details="Benvenuto nel tuo primo progetto in Leantime!<br />Questo è il tuo spazio per organizzare le attività, monitorare gli obiettivi e pianificare il lavoro. Sentiti libero di modificare qualsiasi cosa o di creare altri progetti man mano che cresci. Questo progetto serve solo ad aiutarti a iniziare"
label.onboarding_milestone_getting_started="Primi passi"
label.onboarding_task_community_chat="Unisciti alla chat della nostra community"
text.onboarding_task_community_chat="La chat della nostra community è un'ottima risorsa per fare domande e ricevere feedback sulla configurazione dei progetti. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Chat della community</a>"
label.onboarding_task_invite_team="Invita i tuoi colleghi"
text.onboarding_task_invite_team="Che tu lavori con qualcuno o abbia solo bisogno di qualcuno che ti aiuti a mantenere gli impegni, usare Leantime in gruppo aiuta a restare in carreggiata e motivati <a href='%s'>Gestione utenti</a>"
label.onboarding_task_project_structure="Scopri di più sulla struttura dei progetti in Leantime"
text.onboarding_task_project_structure="La nostra documentazione di aiuto offre molte risorse aggiuntive. Per saperne di più sulla struttura dei progetti in Leantime e sulle best practice, visita: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Crea un obiettivo"
text.onboarding_task_create_goal="Gli obiettivi servono a monitorare e misurare traguardi a lungo termine. Devono essere misurabili con metriche che puoi aggiornare regolarmente. Obiettivi e milestone possono essere collegati per vedere l'avanzamento dell'esecuzione insieme a quello delle metriche <a href='%s'>Obiettivi del progetto</a>"
label.onboarding_task_create_milestone="Crea una milestone"
text.onboarding_task_create_milestone="Le milestone ti permettono di suddividere le fasi dei tuoi progetti in risultati distinti. Ogni milestone ha una data di inizio e una di fine e dovrebbe produrre un risultato concreto <a href='%s'>Milestone del progetto</a>"
label.onboarding_task_personal_project="Esplora il tuo progetto personale"
text.onboarding_task_personal_project="Il tuo progetto personale è uno spazio in cui organizzare le tue attività, i tuoi obiettivi e il tuo lavoro. Puoi accedervi dal selettore di progetti in alto oppure facendo clic su questo link: <a href='%s'>Il mio progetto</a>"
label.onboarding_task_complete_profile="Completa il mio profilo Leantime"
text.onboarding_task_complete_profile="Aggiorna l'immagine del profilo e completa le preferenze di lavoro per personalizzare la mia esperienza. <a href='%s'>Il mio profilo</a>"
label.onboarding_goalboard_title="I miei obiettivi"
label.onboarding_goal_metric="Attività completate in tempo"
