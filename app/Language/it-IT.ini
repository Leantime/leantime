support.marcel_name="👋 Sono Marcel"
support.marcel_tagline="Immigrato tedesco, papà di una figlia autistica e io stesso con l'ADHD."
support.marcel_bio_1="Gli strumenti tradizionali di gestione dei progetti non hanno mai fatto per me. Sembravano creati da menti neurotipiche per menti neurotipiche. Quando lavoravo come freelance e faticavo a tenere organizzati i progetti dei clienti, ho iniziato a costruire qualcosa che lavorasse con il mio cervello invece che contro di esso."
support.marcel_bio_2="Quella che era nata come una soluzione personale è diventata Leantime quando ho capito che milioni di altre persone avevano bisogno della stessa cosa."
support.gloria_name="👋 E io sono Gloria"
support.gloria_tagline="Ex infermiera di pronto soccorso diventata product manager, imprenditrice ispanica di prima generazione."
support.gloria_bio_1="Ho passato anni in ambienti medici ad alta pressione, dove l'organizzazione salva letteralmente delle vite. Ma quando ho avviato la mia attività, gli strumenti di progetto tradizionali mi sembravano opprimenti e distanti dal modo in cui penso e lavoro davvero."
support.gloria_bio_2="Il mio background in scienze comportamentali e nella ricerca sulla motivazione guida il modo in cui costruiamo funzionalità che non si limitano a organizzare le attività, ma ti aiutano a volerle davvero completare."
support.closing_text="Possiamo creare un mondo in cui nessuno debba lottare con i propri strumenti per fare un ottimo lavoro. La tua sponsorizzazione finanzia un futuro in cui il software si adatta alla diversità umana, e non il contrario."
