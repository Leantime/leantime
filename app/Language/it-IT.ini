tour.my_work.welcome_title="Benvenuto nel tour della dashboard"
tour.my_work.welcome_text="Iniziamo con alcune nozioni di base per prendere confidenza con la navigazione e con i diversi elementi di Leantime."
tour.my_work.work_modes_title="Modalità di lavoro"
tour.my_work.work_modes_text="La navigazione in alto mostra la «modalità di lavoro» in cui ti trovi. Puoi essere all'interno di un progetto, nella tua area di lavoro personale o nella modalità aziendale."
tour.my_work.left_nav_text="La navigazione a sinistra articola la modalità di lavoro corrente e ti dà accesso alle diverse aree. Tutto ciò che vedi qui fa parte della modalità di lavoro selezionata in alto."
tour.my_work.profile_bar_title="La mia barra del profilo"
tour.my_work.profile_bar_text="Qui trovi i link al tuo account, oltre alle notifiche e alle ultime novità su Leantime."
tour.my_work.widgets_title="I widget della tua dashboard"
tour.my_work.widgets_text="La tua dashboard è suddivisa in vari widget che mostrano informazioni mirate sul tuo lavoro."
tour.my_work.customize_title="Personalizza la tua dashboard"
tour.my_work.customize_text="I widget possono essere ridimensionati e spostati tramite trascinamento."
tour.my_work.todos_title="Le mie To-Do"
tour.my_work.todos_text="Il widget Le mie To-Do mostra tutte le attività attualmente assegnate a te."
tour.my_work.group_todos_title="Raggruppa le To-Do"
tour.my_work.group_todos_text="Usa i menu a discesa qui per filtrare le tue attività per progetto o raggrupparle per priorità, stato, progetto o date."
tour.my_work.sort_todos_title="Ordina le To-Do"
tour.my_work.sort_todos_text="Ogni To-Do può essere trascinata e rilasciata per cambiarne l'ordine. Puoi anche trascinare un'attività nel calendario per pianificarla."
tour.my_work.timer_title="Avvia il timer"
tour.my_work.timer_text="Quando sei pronto a lavorare su un'attività, fai semplicemente clic sul pulsante per avviare il timer."
tour.my_work.complete_task_title="Completa un'attività"
tour.my_work.complete_task_text="Quando un'attività è terminata, puoi segnarla come completata facendo clic sul menu a discesa dello stato."
tour.my_work.add_tasks_title="Aggiungi altre attività"
tour.my_work.add_tasks_text="Puoi aggiungere altre attività facendo clic sul pulsante più in ogni sezione oppure usando il menu a tre puntini accanto a ciascuna attività."
tour.my_work.finish_text="Hai completato il tour della dashboard My Work. Vai al <a href='%s/dashboard/show'>tuo progetto</a> per scoprire di più sulla gestione dei progetti in Leantime."
tour.project_dashboard.menu_title="Menu del progetto"
tour.project_dashboard.menu_text="Il menu del progetto organizza il tuo progetto in diverse sezioni: <strong>Data Room</strong> - per ospitare tutti i tuoi file e le tue informazioni, <strong>Rifletti</strong> - per elaborare strategie, generare idee e definire, <strong>Crea</strong> - per gestire obiettivi, milestone e attività."
tour.project_dashboard.selector_title="Selettore di progetti"
tour.project_dashboard.selector_text="Usa il selettore di progetti per passare da un progetto all'altro. Il menu a sinistra mostra tutto ciò che riguarda il progetto corrente."
tour.project_dashboard.checklist_title="Checklist"
tour.project_dashboard.checklist_text="La checklist del progetto è un riferimento rapido per verificare se il tuo progetto contiene tutte le informazioni necessarie per un'esecuzione di successo."
tour.project_dashboard.status_title="Aggiornamenti di stato rapidi"
tour.project_dashboard.status_text="Usa gli aggiornamenti di stato per condividere rapidamente l'avanzamento del progetto con il tuo team tramite i colori rosso, giallo e verde. Lo stato sarà visibile in tutta l'applicazione."
tour.project_dashboard.progress_title="Avanzamento"
tour.project_dashboard.progress_text="L'indicatore di avanzamento del progetto mostra quanto lavoro hai completato. Tiene conto delle diverse dimensioni delle attività, della velocità del team e delle milestone del progetto."
tour.project_dashboard.latest_tasks_title="Ultime attività"
tour.project_dashboard.latest_tasks_text="L'elenco delle ultime attività mostra le attività aggiunte più di recente al tuo progetto e può essere usato come posta in arrivo del progetto."
tour.project_dashboard.team_title="Team"
tour.project_dashboard.team_text="Il riquadro del team mostra i membri di questo progetto."
tour.project_dashboard.finish_text="Hai completato il tour della dashboard del progetto. Vai alle <a href='%s/tickets/showKanban'>To-Do</a> per scoprire i vari modi di gestire le tue attività in Leantime."
tour.kanban_board.overview_title="La tua bacheca Kanban"
tour.kanban_board.overview_text="Questa è la tua bacheca Kanban. Ti aiuta a visualizzare il tuo lavoro e a limitare il lavoro in corso."
tour.kanban_board.workflow_title="Flusso di lavoro"
tour.kanban_board.workflow_text="Le attività si spostano da sinistra a destra man mano che avanzano. Trascina e rilascia le schede per aggiornarne lo stato."
tour.kanban_board.columns_title="Colonne flessibili"
tour.kanban_board.columns_text="Con il menu a tre puntini puoi aggiungere, rimuovere e rinominare le colonne."
tour.kanban_board.filter_title="Filtra le attività"
tour.kanban_board.filter_text="Puoi filtrare le tue attività per vari campi, come priorità, stato, progetto o date."
tour.kanban_board.swimlanes_title="Swimlane"
tour.kanban_board.swimlanes_text="Puoi anche raggruppare le tue attività per creare swimlane Kanban. Così puoi visualizzare il lavoro per membri del team, priorità o milestone."
tour.kanban_board.sprints_title="Sprint"
tour.kanban_board.sprints_text="Se gestisci il tuo lavoro in sprint, puoi usare il menu a discesa qui per selezionare, creare e aggiornare gli sprint."
tour.kanban_board.finish_text="Questo conclude il tour Kanban. Vai alle <a href='%s/tickets/roadmap'>Milestone</a> per scoprire come creare e gestire le milestone in Leantime."
tour.milestones.overview_title="Milestone"
tour.milestones.overview_text="Le milestone ti aiutano a monitorare i risultati principali e le fasi del progetto."
tour.milestones.drag_title="Trascina e ordina"
tour.milestones.drag_text="Ogni barra rappresenta una milestone. Puoi trascinarle lungo la timeline, riordinarle e ridimensionarle. Tutto ciò che fai in questa schermata aggiorna le tempistiche delle tue milestone."
tour.milestones.filter_title="Filtra"
tour.milestones.filter_text="Puoi filtrare le tue milestone e visualizzare anche le attività che ne fanno parte."
tour.milestones.timeframes_title="Intervalli di tempo"
tour.milestones.timeframes_text="Puoi cambiare l'intervallo di tempo della vista timeline per vedere una porzione più ampia dell'anno o scendere nel dettaglio giorno per giorno."
tour.milestones.finish_text="Questo conclude il tour delle milestone. Vai agli <a href='%s/goalcanvas/dashboard'>Obiettivi</a> per scoprire come creare e gestire gli obiettivi in Leantime."
tour.goals.overview_title="Obiettivi"
tour.goals.overview_text="Gli obiettivi ti aiutano a monitorare un impatto misurabile sui tuoi progetti."
tour.goals.parts_title="Scopi e metriche"
tour.goals.parts_text="Ogni obiettivo è composto da uno Scopo (ciò che vuoi ottenere) e da una Metrica (come lo misurerai)."
tour.goals.progress_title="Avanzamento dell'obiettivo"
tour.goals.progress_text="Man mano che aggiorni le metriche dei tuoi obiettivi, la barra di avanzamento ti mostra a che punto sei."
tour.goals.milestones_title="Milestone e obiettivi"
tour.goals.milestones_text="Puoi collegare gli obiettivi alle milestone per monitorare l'avanzamento dei tuoi obiettivi a livello di attività. Questo aiuta a individuare le lacune nel piano del progetto."
tour.goals.finish_text="Questo conclude il tour degli obiettivi. Milestone, Obiettivi e To-Do sono gli elementi di base di Leantime. Usali per suddividere il tuo lavoro in parti gestibili. Vai alla <a href='%s/tickets/showKanban'>bacheca Kanban</a> per rivedere le tue attività."
