text.zulip_instructions="Questa integrazione pubblichera' notifiche di aggiornamento sullo stream e sull'argomento di tua scelta.<br/>Segui le istruzioni <a href='https://zulipchat.com/help/add-a-bot-or-integration' target=' _blank'>qui per creare un nuovo bot</a>. Quindi incolla le informazioni nel modulo a destra e fai clic su Salva."
text.discord_instructions="Questa integrazione invierà notifiche di aggiornamento al canale che preferisci.<br/>Segui le istruzioni <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>qui per creare un nuovo webhook</a>, poi incolla il/i link nel/i campo/i a destra e clicca su Salva."
