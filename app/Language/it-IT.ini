text.my_work_dashboard_intro="La tua dashboard My Work mette a fuoco tutto ciò che conta.<br/>Il tuo lavoro più importante è ora in primo piano, organizzato su misura per te e per il modo in cui la tua mente funziona meglio.<br/><br/>Dalle attività rapide agli obiettivi ambiziosi, tutto ciò che ti serve è qui. Questo è il tuo spazio per raccogliere idee, monitorare i progressi e celebrare i successi lungo il percorso."
text.blueprints_intro="Gli schemi sono la tua occasione per dare un senso a tutti i dati. Leantime offre diversi strumenti e canvas per definire il contesto del tuo progetto tramite Business Model Canvas, analisi SWOT o mappe dell'empatia.<br/><br/>Se non sai da dove cominciare, ti consigliamo di creare un «Canvas del valore del progetto». Questo canvas risponderà alle domande più importanti del tuo progetto: chi è il tuo cliente?<br/>Quale problema stai risolvendo?<br/>Qual è la tua soluzione?<br/>Quale vantaggio offre la tua soluzione rispetto ai concorrenti?<br/>"
text.goals_tour_intro="Gli obiettivi ti permettono di suddividere il progetto in parti raggiungibili, misurabili e concrete.<br/>Mentre le milestone si concentrano sull'esecuzione, gli obiettivi riguardano le metriche che vuoi raggiungere.<br/>Ogni obiettivo dovrebbe avere uno scopo chiaro (ciò che vuoi ottenere) ed essere facilmente misurabile con un'unica metrica.<br/><br/>Una volta definito un obiettivo, puoi assegnargli delle milestone per suddividerlo in attività eseguibili.<br/>"
text.project_dashboard_tour_intro="In Leantime i progetti sono spazi di lavoro collaborativi in cui tu e il tuo team organizzate, monitorate e portate a termine il lavoro in modo efficiente. Ogni progetto raccoglie obiettivi, attività e milestone correlati e ti permette di seguire l'avanzamento in un unico posto.<br/><br/>Che tu stia gestendo lavoro, studio o iniziative personali interne, i progetti di Leantime offrono la struttura e gli strumenti necessari per trasformare le idee in risultati concreti."
text.wiki_tour_intro="La nostra documentazione ti permette di scrivere e condividere documenti con il tuo team. Puoi creare più spazi per organizzare la documentazione per team, aree o categorie di documenti.<br/>Crea documenti per condividere conoscenze, processi e procedure. Puoi anche creare un documento per condividere il link a un file o a una cartella nel tuo cloud storage.<br/>"
text.extend_leantime_latest_plugins="Estendi Leantime con i nostri plugin più recenti."
support.headline_help_us_build="Aiutaci a costruire un futuro in cui ogni mente possa prosperare!"
support.intro_text_1="La maggior parte degli strumenti di produttività presuppone che tutti pensino allo stesso modo: in modo lineare, con una concentrazione perfetta, motivati da scadenze arbitrarie. Che tu abbia l'ADHD e abbia bisogno della dopamina delle attività completate, che tu sia autistico e desideri una struttura coerente, che tu abbia la dislessia e pensi in modo spaziale, o che tu sia semplicemente stanco di strumenti che non rispecchiano il modo in cui funziona davvero la tua mente, probabilmente hai rinunciato del tutto alla gestione dei progetti."
support.intro_text_2="Stiamo costruendo Leantime per le menti che funzionano in modo diverso. Questo include i cervelli neurodivergenti, ma anche chiunque abbia mai avuto la sensazione che gli strumenti esistenti vadano contro i propri schemi di pensiero naturali."
