text.mattermost_instructions="Questa integrazione pubblichera' le notifiche di aggiornamento sul canale di tua scelta.<br/>Segui le istruzioni <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target ='_blank'>qui per ottenere un URL webhook in entrata</a> da Mattermost. Quindi incolla il collegamento nel modulo a destra e fai clic su Salva."
text.slack_instructions="Questa integrazione pubblichera' le notifiche di aggiornamento sul canale di tua scelta.<br/>Segui le istruzioni <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for -Slack' target='_blank'>qui per ottenere un URL webhook in entrata</a> da Slack. Quindi incolla il collegamento nel modulo a destra e fai clic su Salva."
