support.marcel_name="👋 Es esmu Marsels"
support.marcel_tagline="Imigrants no Vācijas, autistiskas meitas tētis, un man pašam ir UDHS."
support.marcel_bio_1="Tradicionālie projektu vadības rīki man nekad nebija piemēroti. Šķita, ka tos veidojuši neirotipiski prāti neirotipiskiem prātiem. Kad strādāju kā ārštata speciālists un man bija grūti uzturēt kārtībā klientu projektus, sāku veidot kaut ko, kas strādātu kopā ar manu prātu, nevis pret to."
support.marcel_bio_2="Tas, kas sākās kā personisks risinājums, kļuva par Leantime, kad sapratu, ka tieši to pašu vajag miljoniem citu cilvēku."
support.gloria_name="👋 Un es esmu Glorija"
support.gloria_tagline="Bijusī neatliekamās palīdzības medmāsa, tagad produktu vadītāja, pirmās paaudzes spāņu izcelsmes uzņēmēja."
support.gloria_bio_1="Daudzus gadus pavadīju saspringtā medicīnas vidē, kur organizētība burtiski glābj dzīvības. Taču, kad sāku savu uzņēmumu, tradicionālie projektu rīki šķita nomācoši un atrauti no tā, kā es patiesībā domāju un strādāju."
support.gloria_bio_2="Mana pieredze uzvedības zinātnē un motivācijas pētniecībā nosaka, kā mēs veidojam funkcijas, kas ne tikai sakārto uzdevumus, bet arī palīdz jums patiesi vēlēties tos pabeigt."
support.closing_text="Mēs varam radīt pasauli, kurā nevienam nav jācīnās ar saviem rīkiem, lai paveiktu izcilu darbu. Jūsu sponsorēšana finansē nākotni, kurā programmatūra pielāgojas cilvēku daudzveidībai, nevis otrādi."
support.headline_ready_to_impact="Vai esat gatavs sniegt tiešu ieguldījumu?"
support.contribution_text="Katrs ieguldījums — no 1 $ līdz 100 $ — tiek tieši novirzīts tam, lai Leantime kļūtu labāks ikvienam."
