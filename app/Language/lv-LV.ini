text.my_work_dashboard_intro="Jūsu informācijas panelis „Mans darbs” palīdz koncentrēties uz to, kas ir svarīgs.<br/>Jūsu svarīgākais darbs tagad ir pašā priekšplānā, sakārtots tieši jums un tam, kā vislabāk darbojas jūsu prāts.<br/><br/>No ātriem uzdevumiem līdz vērienīgiem mērķiem — viss nepieciešamais ir tepat. Šī ir jūsu vieta, kur pierakstīt idejas, sekot progresam un ceļā svinēt panākumus."
text.blueprints_intro="Projekta shēmas ļauj jums izprast visus datus. Leantime piedāvā dažādus rīkus un shēmas, ar kuriem aprakstīt projekta kontekstu, piemēram, biznesa modeļa shēmas, SVID analīzi vai empātijas kartes.<br/><br/>Ja nezināt, ar ko sākt, iesakām izveidot „Projekta vērtības shēmu”. Šī shēma atbildēs uz svarīgākajiem jūsu projekta jautājumiem: Kas ir jūsu klients?<br/>Kādu problēmu jūs risināt?<br/>Kāds ir jūsu risinājums?<br/>Kādas priekšrocības jūsu risinājumam ir salīdzinājumā ar konkurentiem?<br/>"
text.goals_tour_intro="Mērķi ļauj sadalīt projektu sasniedzamās, izmērāmās un īstenojamās daļās.<br/>Kamēr atskaites punkti ir vērsti uz izpildi, mērķi ir par rādītājiem, ko vēlaties sasniegt.<br/>Katram mērķim jābūt skaidram uzdevumam (tam, ko vēlaties sasniegt), un tam jābūt viegli izmērāmam ar vienu rādītāju.<br/><br/>Kad mērķis ir izveidots, varat tam piesaistīt atskaites punktus, lai to sadalītu izpildāmos uzdevumos.<br/>"
text.project_dashboard_tour_intro="Projekti Leantime ir sadarbības darbvietas, kurās jūs un jūsu komanda efektīvi organizējat, sekojat un paveicat darbu. Katrs projekts apvieno saistītos mērķus, uzdevumus un atskaites punktus un ļauj sekot progresam vienuviet.<br/><br/>Neatkarīgi no tā, vai pārvaldāt darbu, studijas vai iekšējas personīgās iniciatīvas, Leantime projekti sniedz struktūru un rīkus, kas nepieciešami, lai idejas pārvērstu veiksmīgos rezultātos."
text.wiki_tour_intro="Dokumenti ļauj rakstīt dokumentāciju un dalīties ar to savā komandā. Varat izveidot vairākas telpas, lai sakārtotu dokumentāciju pa komandām, jomām vai dokumentu kategorijām.<br/>Izveidojiet dokumentus, lai dalītos ar zināšanām, procesiem un procedūrām. Varat arī izveidot dokumentu, lai kopīgotu saiti uz failu vai mapi savā mākoņkrātuvē.<br/>"
text.extend_leantime_latest_plugins="Paplašiniet Leantime ar mūsu jaunākajiem spraudņiem."
support.headline_help_us_build="Palīdziet mums veidot nākotni, kurā plaukst ikviens prāts!"
support.intro_text_1="Lielākā daļa produktivitātes rīku pieņem, ka visi domā vienādi: lineāri, ar nevainojamu koncentrēšanos un motivāciju no patvaļīgiem termiņiem. Neatkarīgi no tā, vai jums ir UDHS un jums vajag dopamīna devu no pabeigtiem uzdevumiem, vai esat autists un jums nepieciešama nemainīga struktūra, vai jums ir disleksija un domājat telpiski, vai arī esat vienkārši noguris no rīkiem, kas neatbilst tam, kā patiesībā darbojas jūsu prāts, — visticamāk, projektu vadību esat pilnībā atmetis."
support.intro_text_2="Mēs veidojam Leantime prātiem, kas darbojas citādi. Tas attiecas uz neirodiverģentiem prātiem, bet arī uz ikvienu, kuram kādreiz šķitis, ka esošie rīki cīnās pret viņa dabisko domāšanas veidu."
