text.advanced_boards_helper_content="Idejas attīstās, aug un nobriest. Šī ir vieta, kur tām sekot līdzi.<br/>Pārvietojiet ideju kartītes no vienas kolonnas uz nākamo, lai atspoguļotu to pašreizējo stāvokli.<br/>Šī ir laba vieta, kur sākt izpēti, izstrādāt prototipus un pārbaudīt tos ar dažiem klientiem, pirms sākat ieviešanu."
text.backlog_helper_content="Backlog ir visu jūsu uzdevumu mājvieta — to, pie kuriem pašlaik strādājat, un to, pie kuriem plānojat strādāt.<br/><br/>Lai virzītos uz backlog izpildi, iesakām strādāt īsās iterācijās — sprintos.<br/>Sprinti ir divu nedēļu laika intervāli, kas ļauj koncentrēties uz mazākām, nododamām darba daļām.<br/>Pēc divām nedēļām jums vajadzētu būt kaut kam, ko „demonstrēt”. Kaut kam, kas sniedz vērtību jūsu lietotājiem vai klientiem.<br/><br/>Šajā ekrānā varēsiet organizēt un pārvaldīt savu uzdevumu sarakstu, noteikt backlog prioritātes, velkot un nometot, un pārvietot Backlog vienumus uz pašreizējo sprintu.<br/>Vēlaties uzzināt vairāk? Sāciet ekskursiju vai aizveriet šo logu, lai sāktu darbu!"
text.glad_youre_here="Mēs priecājamies, ka esat šeit. Veltīsim minūti, lai iepazītos."
text.business_research_section="Mūsu biznesa izpētes sadaļa ir jūsu ideju jaunās mājas. Šī sadaļa ir izveidota, lai vadītu jūs cauri klientu attīstības, problēmu izpētes un risinājumu ideju radīšanas posmiem."
text.our_roadmap_design="Mūsu ceļa karte ir veidota tā, lai vestu jūs no mazākiem, pārvaldāmiem atskaites punktiem līdz kopējā mērķa sasniegšanai. Plānojiet aptuveni 3 mēnešus garus atskaites punktus un izmantojiet šos projekta marķierus, lai nenovirzītos no kursa."
text.this_is_where_you_spend_most_time="Šeit jūs pavadīsiet lielāko daļu laika — darot. Plānojiet savus 2 nedēļu sprintus un veiksmīgi tos izpildiet ar Kanban dēli un mūsu Backlog rīkiem. Izmantojiet retrospektīvas, lai pilnveidotos nākamajam sprintam."
text.idea_board_helper_content="Šī ir vieta, kur apkopot visas savas idejas. Pārrunājiet jaunas idejas ar savu komandu un piesaistiet atskaites punktus, lai redzētu progresu ideju īstenošanā."
text.kanban_helper_content="Kanban japāņu valodā nozīmē „kartīte”. Kanban dēļus 40. gados līdz ar Lean ražošanu sāka izmantot Toyota inženieri.<br/>Tos izmanto, lai vizuāli un ātri dalītos ar informāciju un darba progresu.<br/>Kanban dēļi palīdz vizualizēt darbu un statusu, pārvaldīt aktīvo vai procesā esošo darbu, pārvaldīt darba plūsmu un ātri rīkoties, lai ieviestu Lean uzlabojumus."
text.my_timesheets_helper_content="Laika uzskaite ir vieta, kur uzskaitīt pie uzdevuma faktiski nostrādātās stundas.<br/>Tas noder rēķinu izrakstīšanai, kā arī lai pārbaudītu, cik labi jūs plānojat savus uzdevumus iepriekš.<br/>Laika gaitā Leantime var pielāgot izpildes termiņus, ņemot vērā plānošanas neatbilstības."
text.new_project_helper_content="<p>Šeit jūs aprakstīsiet, definēsiet un noteiksiet sava projekta parametrus. Tas ir svarīgi, jo tieši tas<br/>visai komandai paziņo projekta prioritātes, gaidas un vadlīnijas.</p><p><br/><em>Par ko padomāt: 4C.<br/>Rakstiet skaidri (Clear), kodolīgi (Concise), pilnīgi (Complete) un ticami (Credible).<br/><br/></em></p><p>Ievērojot šos principus projektu aprakstos, visi būs vienisprātis, un tiks mazināts kļūdu vai nepareizu soļu risks.</p><br/>Laiks sākt!<br/><br/>"
text.not_found_helper_content="<p>Šai lapai mums vēl nav satura.<br/>Lūdzu, izmantojiet saiti „Nepieciešama palīdzība” lapas apakšā, lai uzzinātu vairāk par to, ko šeit varat darīt.</p>"
text.retros_helper_content="<p>Retrospektīvas ir īsas pārdomas par darbu, komandas darbību un, protams, progresu.<br/>Šeit jūsu komanda var veltīt brīdi, lai pievērstos tam, kas izdevās labi, kas neizdevās un ko nākamreiz varētu darīt citādi.<br/>Iesakām rīkot pārskata sanāksmes regulāri vai vismaz katra atskaites punkta beigās.<br/></p>"
text.roadmap_helper_content="<p>Ceļa kartes palīdz sadalīt lielus projektus mazākās un vieglāk pārvaldāmās daļās.<br/><br/></p><p>Lai izveidotu savu ceļa karti, iesakām noteikt atskaites punktus, ko var sasniegt 3 mēnešu laikā.</p><p>Atskaites punkti ir kontrolpunkti ceļā uz projekta pabeigšanu.<br/>Vienkārši sakot: ja dodaties ceļojumā pāri visai valstij, katrs reģions, caur kuru braucat, varētu būt atskaites punkts.<br/><br/>Lai sāktu, noklikšķiniet uz „Pievienot atskaites punktu” augšējā kreisajā pusē. Iestatiet datumu šajā cilnē vai pašā ceļa kartes diagrammā, noklikšķinot un velkot atskaites punktu kalendārā.</p>"
text.show_clients_helper_content="<p>Klienti/Produkti sakārto jūsu projektus kategorijās un ļauj nodalīt dažādas grupas.<br/><br/></p><p>Kā konsultants jūs jau strādājat ar klientiem, un šī ir vieta, kur tos organizēt.</p><p>Ja esat produktu komanda, varat izmantot šo sadaļu, lai organizētu un nodalītu savus departamentus (mārketings, pārdošana, operācijas utt.).</p>"
text.show_projects_helper_content="<p>Projekti ir jūsu biznesa un Leantime sirds! Pārmaiņas, attīstība, mērķi un viss, ko varat uzbūvēt vai par ko sapņojat, ir saistīts ar projektiem.<br/>Projektu vadība ir vienkārši process, kas nodrošina, ka jūsu projekti tiek īstenoti laikā, pareizi un ar reālu vērtību biznesam.<br/><br/>Šeit atradīsies jūsu projekti. Projektu lapā varat izveidot projektu un ātri apskatīt uzdevumu skaitu, stundas, budžetu un ar projektu saistīto klientu.<br/><br/>Izmantojiet šo lapu, lai ātri pārskatītu visus savus projektus.<br/><br/></p>"
text.new_db_version="Ir instalēta jauna versija. Lai lietotu Leantime, jums jāatjaunina datubāze.<br/><br/><strong>Pirms šī atjauninājuma veikšanas noteikti izveidojiet datubāzes rezerves kopiju!</strong><br/>Tas var aizņemt dažas minūtes."
text.update_was_successful="Atjaunināšana bija veiksmīga, tagad varat pieteikties. <a href='%1$s'>Doties uz pieteikšanos</a>"
text.this_script_will_set_up_leantime="Šis skripts iestatīs jūsu datubāzi un izveidos administratora kontu"
text.enter_new_password="Ievadiet jauno paroli, lai to atiestatītu."
text.enter_email_address_to_reset="Ievadiet savu e-pasta adresi, lai atiestatītu paroli."
text.twoFA_qr="Noskenējiet zemāk redzamo QR kodu ar savu iecienīto OTP lietotni/Google Authenticator"
text.twoFA_verify_code="Ievadiet kodu, ko jums sniedza OTP lietotne/Google Authenticator"
text.twoFA_already_enabled="Jūsu kontam jau ir iespējota divfaktoru autentifikācija, un tā ir nepieciešama, lai pieteiktos.<br/><br/>Lai noņemtu divfaktoru autentifikāciju, noklikšķiniet uz „Noņemt” zemāk"
text.twoFA_enabled="Jūsu kontam divfaktoru autentifikācija ir <strong>iespējota</strong>."
text.twoFA_disabled="Jūsu kontam divfaktoru autentifikācija ir <strong>atspējota</strong>."
text.twoFA_manage="<span class='fa fa-lock'></span> Pārvaldīt divfaktoru autentifikāciju"
text.who_can_access="Izvēlieties, kam ir atļauts skatīt šo projektu. Pēc noklusējuma lietotāji mantos lomas, kas viņiem ir piešķirtas. Šīs lomas varat mainīt cilnē „Komanda”"
text.ical_export_description="Šeit varat izveidot unikālu kalendāra URL, kas ļaus integrēt jūsu Leantime kalendāru jebkurā lietotnē, kas atbalsta „iCal” formātu. "
text.you_ical_url="Jūsu kalendāra URL ir norādīts zemāk. <br /> Lūdzu, ņemiet vērā, ka ikviens, kam ir šis URL, var piekļūt kalendāram. Glabājiet to slepenībā tāpat kā paroli."
