label.onboarding_default_project_name="Mans projekts"
text.onboarding_default_project_details="Laipni lūdzam jūsu pirmajā projektā Leantime!<br />Šī ir jūsu vieta, kur organizēt uzdevumus, sekot mērķiem un plānot darbu. Droši mainiet šeit jebko vai, darbam augot, izveidojiet papildu projektus. Šis projekts ir paredzēts tikai jums, lai sāktu darbu"
label.onboarding_milestone_getting_started="Darba sākšana"
label.onboarding_task_community_chat="Pievienojieties mūsu kopienas tērzēšanai"
text.onboarding_task_community_chat="Mūsu kopienas tērzēšana ir lielisks resurss, kur uzdot jautājumus un saņemt atsauksmes par projekta iestatīšanu. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Kopienas tērzēšana</a>"
label.onboarding_task_invite_team="Uzaiciniet savus komandas biedrus"
text.onboarding_task_invite_team="Neatkarīgi no tā, vai strādājat kopā ar kādu vai jums vienkārši nepieciešams atbildības partneris, Leantime izmantošana kopā ar citiem palīdz noturēt kursu un saglabāt motivāciju <a href='%s'>Lietotāju pārvaldība</a>"
label.onboarding_task_project_structure="Uzziniet vairāk par Leantime projektu struktūru"
text.onboarding_task_project_structure="Mūsu palīdzības dokumentācijā ir daudz papildu resursu. Lai uzzinātu vairāk par projektu struktūru Leantime un labāko praksi, apmeklējiet: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Izveidojiet mērķi"
text.onboarding_task_create_goal="Mērķi tiek izmantoti, lai sekotu ilgtermiņa iecerētajiem rezultātiem un tos mērītu. Tiem jābūt izmērāmiem ar rādītājiem, kurus varat regulāri atjaunināt. Mērķus un atskaites punktus var sasaistīt, lai līdztekus rādītāju progresam redzētu arī izpildes progresu <a href='%s'>Projekta mērķi</a>"
label.onboarding_task_create_milestone="Izveidojiet atskaites punktu"
text.onboarding_task_create_milestone="Atskaites punkti ļauj sadalīt projekta posmus atsevišķos rezultātos. Katram atskaites punktam ir sākuma un beigu datums, un tam jādod kāds rezultāts <a href='%s'>Projekta atskaites punkts</a>"
label.onboarding_task_personal_project="Izpētiet savu personīgo projektu"
text.onboarding_task_personal_project="Jūsu personīgais projekts ir vieta, kur varat organizēt savus uzdevumus, mērķus un darbu. Tam varat piekļūt, izmantojot projektu atlasītāju augšpusē vai noklikšķinot uz šīs saites: <a href='%s'>Mans projekts</a>"
label.onboarding_task_complete_profile="Aizpildiet savu Leantime profilu"
text.onboarding_task_complete_profile="Atjauniniet profila attēlu un aizpildiet darba preferences, lai pielāgotu Leantime savām vajadzībām. <a href='%s'>Mans profils</a>"
