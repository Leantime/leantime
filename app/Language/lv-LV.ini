text.helpful_resources="Jebkuru jaunu programmatūru var būt grūti apgūt, tāpēc mēs cenšamies padarīt Leantime pēc iespējas vienkāršāku un saprotamāku.<br />Ja kādreiz nezināt, kā rīkoties, vai vēlaties apmainīties ar idejām, varat izmantot tālāk norādītos resursus, lai saņemtu palīdzību:"

text.discordChat="Mūsu Discord tērzēšana, iespējams, ir ātrākais veids, kā saņemt atbildi uz jebkuru jautājumu. Mūsu kopiena ir aktīva un ārkārtīgi izpalīdzīga."
