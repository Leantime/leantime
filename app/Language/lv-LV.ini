label.webhook_notifications_description="Sūtiet savus paziņojumus uz savu HTTPS galapunktu. Par katru projekta paziņojumu, ko varat saņemt, Leantime nosūta uz šo URL vienu HTTP POST pieprasījumu ar JSON saturu. Pieprasījumi tiek sūtīti fonā, un to piegāde var aizņemt vairākas minūtes; neveiksmīgs pieprasījums netiek atkārtots. Kategorijas un līmeņi katram projektam cilnē Paziņojumi nosaka, kuri paziņojumi tiek sūtīti, tostarp par jūsu pašu veiktajām izmaiņām. E-pasta paziņojumu izslēgšana neaptur tīmekļa aizķeri. Tīmekļa aizķere sūta paziņojumus tikai tad, ja tā ir iespējota un ir iestatīts URL. Kamēr tīmekļa aizķere ir atspējota, jūsu URL paliek saglabāts — lai to noņemtu, notīriet URL."
