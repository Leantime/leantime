text.mattermost_instructions=" Šī integrācija publicēs paziņojumus par atjauninājumiem jūsu izvēlētajā kanālā.<br/>Izpildiet <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>šeit sniegtos norādījumus, lai iegūtu ienākošā Webhook URL</a> no Mattermost. Pēc tam ielīmējiet saiti veidlapā labajā pusē un noklikšķiniet uz „Saglabāt”."
