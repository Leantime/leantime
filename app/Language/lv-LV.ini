headlines.lean.welcome_to_board="Laipni lūdzam Lean Canvas dēlī!"

text.lean.helper_content="Lean Canvas jūs vedīs cauri visam jaunās biznesa un/vai produkta idejas validēšanas procesam.<br/>Jūs pievērsīsieties savam <em>klientu segmentam</em>, <em>problēmai, risinājumam</em>.<br/>Pēc tam pāriesiet pie sava <em>unikālā vērtības piedāvājuma</em> (kas padara jūsu ideju labāku par citiem piedāvājumiem?), <em>izplatīšanas kanāliem</em> (kā jūsu risinājums nonāks pie klientiem?), <em>ieņēmumu plūsmām</em> (kā jūsu risinājums pelnīs naudu?), <em>izmaksu struktūras</em> (cik vērts ir jūsu risinājums?), <em>galvenajiem rādītājiem</em> (kā mērīsiet panākumus?) un <em>nepārspējamās priekšrocības</em> (kas jums ir tāds, kas palīdzēs gūt panākumus konkurencē?)<br/>Atbildes uz šiem jautājumiem ir paredzētas, lai veicinātu panākumus, mazinātu neveiksmes risku un ļautu jums sekot līdzi saviem pieņēmumiem un tos validēt. Būt „lean” nozīmē novērst izšķērdēšanu un strādāt, lai radītu produktus, biznesu un risinājumus, kas nepieciešami jūsu klientiem."
text.lean.disclaimer="Lean Canvas ir pielāgots no <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> un ir licencēts saskaņā ar <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> licenci"
tour.lean.once_your_done="<em>Kad esat apmierināti ar savu Lean Canvas, turpiniet šeit:</em><br/><a href='%s/tickets/roadmap/' class='btn btn-primary'><span class='fas fa-map'></span> Ceļa kartes plānotājs</a>"


