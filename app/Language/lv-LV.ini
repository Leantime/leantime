; Strings added 2026-10 by machine translation (Claude), please review
tour.my_work.welcome_title="Laipni lūdzam informācijas paneļa ekskursijā"
tour.my_work.welcome_text="Sāksim ar dažiem pamatiem, lai jūs ātri apgūtu navigāciju un dažādos Leantime elementus."
tour.my_work.work_modes_title="Darba režīmi"
tour.my_work.work_modes_text="Augšējā navigācijā redzams pašreizējais „darba režīms”, kurā atrodaties. Jūs varat būt projektā, savā personīgajā darba zonā vai uzņēmuma režīmā."
tour.my_work.left_nav_text="Kreisā navigācija sadala pašreizējo darba režīmu sīkāk un sniedz piekļuvi dažādām sadaļām. Viss, kas šeit redzams, ir daļa no augšā atlasītā darba režīma."
tour.my_work.profile_bar_title="Mana profila josla"
tour.my_work.profile_bar_text="Šeit atradīsiet saites uz savu kontu, kā arī paziņojumus un jaunākās ziņas par Leantime."
tour.my_work.widgets_title="Jūsu informācijas paneļa logrīki"
tour.my_work.widgets_text="Jūsu informācijas panelis ir sadalīts dažādos logrīkos, kas sniedz mērķtiecīgu informāciju par jūsu darbu."
tour.my_work.customize_title="Pielāgojiet savu informācijas paneli"
tour.my_work.customize_text="Logrīkiem var mainīt izmērus, un tos var pārvietot, velkot un nometot."
tour.my_work.todos_title="Mani uzdevumi"
tour.my_work.todos_text="Logrīkā „Mani uzdevumi” redzami visi uzdevumi, kas pašlaik piešķirti jums."
tour.my_work.group_todos_title="Grupēt uzdevumus"
tour.my_work.group_todos_text="Ar šīm nolaižamajām izvēlnēm varat filtrēt uzdevumus pēc projekta vai grupēt tos pēc prioritātes, statusa, projekta vai datumiem."
tour.my_work.sort_todos_title="Kārtot uzdevumus"
tour.my_work.sort_todos_text="Katru uzdevumu var vilkt un nomest, lai mainītu tā secību. Uzdevumu varat arī ievilkt kalendārā, lai to ieplānotu."
tour.my_work.timer_title="Palaidiet taimeri"
tour.my_work.timer_text="Kad vēlaties sākt darbu pie uzdevuma, vienkārši noklikšķiniet uz taimera palaišanas pogas."
tour.my_work.complete_task_title="Pabeidziet uzdevumu"
tour.my_work.complete_task_text="Kad uzdevums ir izpildīts, varat atzīmēt to kā pabeigtu, noklikšķinot uz statusa nolaižamās izvēlnes."
tour.my_work.add_tasks_title="Pievienojiet vairāk uzdevumu"
tour.my_work.add_tasks_text="Vairāk uzdevumu varat pievienot, noklikšķinot uz plusa pogas katrā sadaļā vai izmantojot trīs punktu izvēlni blakus katram uzdevumam."
tour.my_work.finish_text="Jūs esat pabeiguši „Mans darbs” informācijas paneļa ekskursiju. Dodieties uz <a href='%s/dashboard/show'>savu projektu</a>, lai uzzinātu vairāk par projektu vadību Leantime."
tour.project_dashboard.menu_title="Projekta izvēlne"
tour.project_dashboard.menu_text="Projekta izvēlne sadala jūsu projektu vairākās sadaļās: <strong>Datu telpa</strong> — visu jūsu failu un informācijas glabāšanai, <strong>Domāt</strong> — stratēģijas veidošanai, ideju radīšanai un definēšanai, <strong>Darīt</strong> — mērķu, atskaites punktu un uzdevumu pārvaldībai."
tour.project_dashboard.selector_title="Projektu atlasītājs"
tour.project_dashboard.selector_text="Izmantojiet projektu atlasītāju, lai pārslēgtos starp projektiem. Kreisajā izvēlnē redzams viss, kas saistīts ar jūsu pašreizējo projektu."
tour.project_dashboard.checklist_title="Kontrolsaraksts"
tour.project_dashboard.checklist_text="Projekta kontrolsaraksts ļauj ātri pārbaudīt, vai jūsu projektā ir visa veiksmīgai izpildei nepieciešamā informācija."
tour.project_dashboard.status_title="Ātri statusa atjauninājumi"
tour.project_dashboard.status_text="Ar statusa atjauninājumiem varat ātri informēt komandu par projekta progresu, izmantojot sarkano, dzelteno un zaļo krāsu. Statuss būs redzams visā lietotnē."
tour.project_dashboard.progress_title="Progress"
tour.project_dashboard.progress_text="Projekta progresa rādītājs parāda, cik daudz darba esat paveikuši. Tas ņem vērā dažādus uzdevumu apjomus, komandas ātrumu un projekta atskaites punktus."
tour.project_dashboard.latest_tasks_title="Jaunākie uzdevumi"
tour.project_dashboard.latest_tasks_text="Jaunāko uzdevumu sarakstā redzami projektam pēdējie pievienotie uzdevumi, un to var izmantot kā projekta iesūtni."
tour.project_dashboard.team_title="Komanda"
tour.project_dashboard.team_text="Komandas lodziņā redzami šī projekta dalībnieki."
tour.project_dashboard.finish_text="Jūs esat pabeiguši projekta informācijas paneļa ekskursiju. Dodieties uz sadaļu <a href='%s/tickets/showKanban'>Uzdevumi</a>, lai uzzinātu vairāk par dažādajiem veidiem, kā Leantime pārvaldīt uzdevumus."
tour.kanban_board.overview_title="Jūsu Kanban dēlis"
tour.kanban_board.overview_text="Šis ir jūsu Kanban dēlis. Tas palīdz vizualizēt darbu un ierobežot vienlaikus procesā esošā darba apjomu."
tour.kanban_board.workflow_title="Darba plūsma"
tour.kanban_board.workflow_text="Darbam virzoties uz priekšu, uzdevumi pārvietojas no kreisās uz labo pusi. Velciet un nometiet kartītes, lai atjauninātu to statusu."
tour.kanban_board.columns_title="Elastīgas kolonnas"
tour.kanban_board.columns_text="Ar trīs punktu izvēlni varat pievienot vai noņemt kolonnas un pārdēvēt tās."
tour.kanban_board.filter_title="Filtrēt uzdevumus"
tour.kanban_board.filter_text="Uzdevumus varat filtrēt pēc dažādiem laukiem, piemēram, prioritātes, statusa, projekta vai datumiem."
tour.kanban_board.swimlanes_title="Swimlanes"
tour.kanban_board.swimlanes_text="Turklāt varat grupēt uzdevumus, lai izveidotu Kanban swimlanes — horizontālas joslas. Tas palīdz vizualizēt darbu pēc komandas dalībniekiem, prioritātes vai atskaites punktiem."
tour.kanban_board.sprints_title="Sprinti"
tour.kanban_board.sprints_text="Ja pārvaldāt darbu sprintos, ar šo nolaižamo izvēlni varat atlasīt, izveidot un atjaunināt sprintus."
tour.kanban_board.finish_text="Ar šo Kanban ekskursija ir pabeigta. Dodieties uz sadaļu <a href='%s/tickets/roadmap'>Atskaites punkti</a>, lai uzzinātu, kā Leantime izveidot un pārvaldīt atskaites punktus."
tour.milestones.overview_title="Atskaites punkti"
tour.milestones.overview_text="Atskaites punkti palīdz sekot nozīmīgiem rezultātiem un projekta posmiem."
tour.milestones.drag_title="Vilkt un kārtot"
tour.milestones.drag_text="Katra josla attēlo vienu atskaites punktu. Joslas varat vilkt pa laika grafiku, mainīt to secību un izmērus. Viss, ko darāt šajā ekrānā, maina jūsu atskaites punktu laika plānojumu."
tour.milestones.filter_title="Filtrs"
tour.milestones.filter_text="Varat filtrēt atskaites punktus un apskatīt arī uzdevumus, kas tajos ietilpst."
tour.milestones.timeframes_title="Laika posmi"
tour.milestones.timeframes_text="Varat mainīt laika grafika skata laika posmu, lai redzētu lielāku gada daļu vai iedziļinātos sadalījumā pa dienām."
tour.milestones.finish_text="Ar šo atskaites punktu ekskursija ir pabeigta. Dodieties uz sadaļu <a href='%s/goalcanvas/dashboard'>Mērķi</a>, lai uzzinātu, kā Leantime izveidot un pārvaldīt mērķus."
tour.goals.overview_title="Mērķi"
tour.goals.overview_text="Mērķi palīdz sekot izmērāmai ietekmei uz jūsu projektiem."
tour.goals.parts_title="Iecerētie rezultāti un rādītāji"
tour.goals.parts_text="Katrs mērķis sastāv no iecerētā rezultāta (ko vēlaties sasniegt) un rādītāja (kā to mērīsiet)."
tour.goals.progress_title="Mērķa progress"
tour.goals.progress_text="Atjauninot mērķu rādītājus, progresa josla parādīs, cik tālu esat pavirzījušies."
tour.goals.milestones_title="Atskaites punkti un mērķi"
tour.goals.milestones_text="Varat sasaistīt mērķus ar atskaites punktiem, lai sekotu mērķu progresam uzdevumu līmenī. Tas palīdz atklāt nepilnības jūsu projekta plānā."
tour.goals.finish_text="Ar šo mērķu ekskursija ir pabeigta. Atskaites punkti, mērķi un uzdevumi ir Leantime pamatelementi. Izmantojiet tos, lai sadalītu darbu pārvaldāmās daļās. Dodieties uz <a href='%s/tickets/showKanban'>Kanban dēli</a>, lai pārskatītu savus uzdevumus."
