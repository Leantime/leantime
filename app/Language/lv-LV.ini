text.dbm.disclaimer="<em>Detalizētā biznesa modeļa shēma</em> ir ņemta no <a href='https://inov.at/dts'>Design Thinking for Strategy</a> un balstīta uz uzņēmuma <a href='https://www.strategyzer.com'>Strategyzer</a> izstrādāto <em>Business Model Canvas</em>. Tā ir licencēta saskaņā ar <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> licenci"


