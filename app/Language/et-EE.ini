tour.my_work.add_tasks_title="Lisa rohkem ülesandeid"
tour.my_work.add_tasks_text="Ülesandeid saad juurde lisada, klikkides iga jaotise plussnupul või kasutades iga ülesande kõrval olevat kolme punktiga menüüd."
tour.my_work.finish_text="Oled Minu töö töölaua tuuri läbinud. Mine <a href='%s/dashboard/show'>oma projekti</a>, et Leantime'i projektihaldusest rohkem teada saada."
tour.project_dashboard.menu_title="Projekti menüü"
tour.project_dashboard.menu_text="Projekti menüü jaotab sinu projekti erinevateks osadeks: <strong>Andmeruum</strong> – kõigi sinu failide ja info hoidmiseks, <strong>Mõtle</strong> – strateegia kujundamiseks, ideede loomiseks ja määratlemiseks, <strong>Tegutse</strong> – eesmärkide, verstapostide ja ülesannete haldamiseks."
tour.project_dashboard.selector_title="Projektivalija"
tour.project_dashboard.selector_text="Projektivalijaga saad projektide vahel liikuda. Vasak menüü näitab kõike, mis on seotud sinu praeguse projektiga."
tour.project_dashboard.checklist_title="Kontrollnimekiri"
tour.project_dashboard.checklist_text="Projekti kontrollnimekirjast näed kiiresti, kas sinu projektis on olemas kogu eduka elluviimise jaoks vajalik info."
tour.project_dashboard.status_title="Kiired staatuse uuendused"
tour.project_dashboard.status_text="Staatuse uuendustega saad punase, kollase ja rohelise värvi abil kiiresti oma meeskonnaga projekti edenemist jagada. Staatus on nähtav kogu rakenduses."
tour.project_dashboard.progress_title="Edenemine"
tour.project_dashboard.progress_text="Projekti edenemise näidik näitab, kui palju tööd oled juba teinud. See arvestab erinevate ülesannete suurust, meeskonna kiirust ja projekti verstaposte."
tour.project_dashboard.latest_tasks_title="Viimased ülesanded"
tour.project_dashboard.latest_tasks_text="Viimaste ülesannete nimekiri näitab sinu projekti viimati lisatud ülesandeid ja seda saab kasutada projekti postkastina."
tour.project_dashboard.team_title="Meeskond"
tour.project_dashboard.team_text="Meeskonna plokis näed selle projekti liikmeid."
tour.project_dashboard.finish_text="Oled projekti töölaua tuuri läbinud. Mine lehele <a href='%s/tickets/showKanban'>Ülesanded</a>, et rohkem teada saada, kuidas Leantime'is oma ülesandeid eri viisidel hallata."
tour.kanban_board.overview_title="Sinu Kanban tahvel"
tour.kanban_board.overview_text="See on sinu Kanban tahvel. See aitab sul oma tööd visualiseerida ja pooleliolevat tööd piirata."
tour.kanban_board.workflow_title="Töövoog"
tour.kanban_board.workflow_text="Ülesanded liiguvad edenedes vasakult paremale. Lohista kaarte, et nende staatust uuendada."
tour.kanban_board.columns_title="Paindlikud veerud"
tour.kanban_board.columns_text="Kolme punktiga menüüst saad veerge lisada, eemaldada ja ümber nimetada."
tour.kanban_board.filter_title="Filtreeri ülesandeid"
tour.kanban_board.filter_text="Saad ülesandeid filtreerida erinevate väljade järgi, nagu tähtsus, staatus, projekt või kuupäevad."
tour.kanban_board.swimlanes_title="Ujumisrajad"
tour.kanban_board.swimlanes_text="Lisaks saad ülesandeid rühmitada, et luua Kanbani ujumisrajad. Nii saad oma tööd visualiseerida meeskonnaliikmete, tähtsuse või verstapostide kaupa."
tour.kanban_board.sprints_title="Sprindid"
tour.kanban_board.sprints_text="Kui haldad oma tööd sprintidena, saad siinse rippmenüü abil sprinte valida, luua ja uuendada."
tour.kanban_board.finish_text="Kanbani tuur on lõppenud. Mine lehele <a href='%s/tickets/roadmap'>Verstapostid</a>, et õppida Leantime'is verstaposte looma ja haldama."
tour.milestones.overview_title="Verstapostid"
tour.milestones.overview_text="Verstapostid aitavad sul jälgida olulisi tulemusi ja projekti etappe."
tour.milestones.drag_title="Lohista ja sorteeri"
tour.milestones.drag_text="Iga riba tähistab üht verstaposti. Saad neid ajajoonel lohistada, ümber järjestada ja nende pikkust muuta. Kõik, mida sellel ekraanil teed, uuendab sinu verstapostide ajastust."
tour.milestones.filter_title="Filter"
tour.milestones.filter_text="Saad verstaposte filtreerida ja vaadata ka nende juurde kuuluvaid ülesandeid."
tour.milestones.timeframes_title="Ajavahemikud"
tour.milestones.timeframes_text="Ajajoone vaate ajavahemikku saad muuta, et näha suuremat osa aastast või süveneda päevade kaupa jaotusesse."
tour.milestones.finish_text="Verstapostide tuur on lõppenud. Mine lehele <a href='%s/goalcanvas/dashboard'>Eesmärgid</a>, et õppida Leantime'is eesmärke looma ja haldama."
tour.goals.overview_title="Eesmärgid"
tour.goals.overview_text="Eesmärgid aitavad sul jälgida oma projektide mõõdetavat mõju."
tour.goals.parts_title="Sihid ja mõõdikud"
tour.goals.parts_text="Iga eesmärk koosneb sihist (mida soovid saavutada) ja mõõdikust (kuidas seda mõõdad)."
tour.goals.progress_title="Eesmärgi edenemine"
tour.goals.progress_text="Kui uuendad oma eesmärkide mõõdikuid, näitab edenemisriba, kui kaugel sa oled."
tour.goals.milestones_title="Verstapostid ja eesmärgid"
tour.goals.milestones_text="Eesmärke saab siduda verstapostidega, et jälgida eesmärkide edenemist ülesannete tasandil. See aitab leida lünki sinu projektiplaanis."
tour.goals.finish_text="Eesmärkide tuur on lõppenud. Verstapostid, eesmärgid ja ülesanded on Leantime'i põhilised ehituskivid. Kasuta neid, et jagada oma töö hallatavateks osadeks. Mine <a href='%s/tickets/showKanban'>Kanban tahvlile</a>, et oma ülesanded üle vaadata."
