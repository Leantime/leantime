support.marcel_name="👋 Mina olen Marcel"
support.marcel_tagline="Saksa immigrant, autistliku tütre isa ja ise ATH-ga elav inimene."
support.marcel_bio_1="Traditsioonilised projektijuhtimise tööriistad ei sobinud mulle kunagi. Tundus, nagu oleksid need loodud neurotüüpiliste mõistuste poolt neurotüüpilistele mõistustele. Kui töötasin vabakutselisena ja nägin vaeva klientide projektide korras hoidmisega, hakkasin looma midagi, mis töötaks koos minu ajuga, mitte selle vastu."
support.marcel_bio_2="See, mis sai alguse isiklikust lahendusest, kasvas Leantime'iks, kui mõistsin, et miljonid teised vajavad sama asja."
support.gloria_name="👋 Ja mina olen Gloria"
support.gloria_tagline="Endine erakorralise meditsiini õde, kellest sai tootejuht; esimese põlvkonna hispaanlasest ettevõtja."
support.gloria_bio_1="Veetsin aastaid kõrge pingega meditsiinikeskkondades, kus korraldatus päästab sõna otseses mõttes elusid. Kuid kui alustasin oma ettevõttega, tundusid traditsioonilised projektitööriistad ülekoormavad ja kaugel sellest, kuidas ma tegelikult mõtlen ja töötan."
support.gloria_bio_2="Minu taust käitumisteaduses ja motivatsiooniuuringutes suunab seda, kuidas loome funktsioone, mis ei korralda lihtsalt ülesandeid — need aitavad sul tõesti tahta neid lõpule viia."
support.closing_text="Me saame luua maailma, kus kellelgi ei pea suurepärase töö tegemiseks oma tööriistadega võitlema. Sinu toetus rahastab tulevikku, kus tarkvara kohandub inimeste mitmekesisusega, mitte vastupidi."
