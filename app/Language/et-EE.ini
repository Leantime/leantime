text.lean.helper_content="Lean lõuend juhatab sind läbi kogu oma uue äri- ja/või tooteidee valideerimise protsessi.<br/>Käsitled oma <em>kliendisegmenti</em> ning <em>probleemi ja lahendust</em>.<br/>Sealt liigud edasi oma <em>unikaalse väärtuspakkumise</em> (mis teeb sinu idee teistest pakkumistest paremaks?), <em>levituskanalite</em> (kuidas jõuab sinu lahendus klientideni?), <em>tuluvoogude</em> (kuidas sinu lahendus raha teenib?), <em>kulustruktuuri</em> (kui palju sinu lahendus väärt on?), <em>põhimõõdikute</em> (kuidas edu mõõdad?) ja <em>ebaõiglase eelise</em> (mis sul on, mis aitab konkurentide ees edu saavutada?) juurde.<br/>Nendele küsimustele vastamine aitab edu saavutada, ebaõnnestumisi vähendada ning oma eeldusi jälgida ja valideerida. Lean tähendab raiskamise kõrvaldamist ja selliste toodete, ettevõtete ja lahenduste loomist, mida sinu kliendid vajavad."
text.lean.disclaimer="Lean lõuend on kohandatud lõuendist <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> ja see on litsentsitud <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> litsentsi alusel"
