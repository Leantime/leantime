text.these_are_system_wide_settings="Need on kogu süsteemi hõlmavad seaded, mis mõjutavad teie leantime kogemuse välimust."
text.company_name_helper="Näidatakse lehe pealkirjas ja e-kirjades"
text.advanced_boards_helper_content="Ideed arenevad, kasvavad ja küpsevad. See on koht, kus neil silm peal hoida.<br/>Liiguta ideekaarte ühest veerust teise, et kajastada nende praegust seisu.<br/>See on hea koht, kust alustada uurimistööd, arendada prototüüpe ja valideerida neid prototüüpe mõne kliendiga enne kui tööga pihta hakata."
text.backlog_helper_content="Mahajäämus on kõigi teie ülesannete kodu; need, millega sa praegu töötad ja mis on tulemas.<br/><br/>Mahajäämuse täitmiseks soovitame töötada lühikeste sprintidena.<br/>Sprindid on kahenädalased ajastatud intervallid, mis võimaldavad sul keskenduda väiksematele, saavutatavatele tööosadele.<br/>Kahe nädala lõpus peaks sul olema midagi ette näidata. Midagi, mis pakub teie kasutajatele või klientidele väärtust.<br/><br/>Sellel lehel saad korraldada ja hallata oma ülesannete nimekirja, tähtsuse järjekorda lohistades muuta ja liigutada tähtaja ületanud üksused oma praegusesse sprinti.<br/>Kas soovite lisainfot? Alusta tuuri või lihtsalt sulge, et kohe tööga algust teha!"
text.glad_youre_here="Tore, et oled meiega. Võta hetk, et siinse keskkonnaga tutvuda."
text.business_research_section="Meie äriuuringute jaotis on sinu ideede uus kodu. See jaotis juhatab sind läbi kliendiarenduse, probleemi uurimise ja lahenduste väljamõtlemise sammude."
text.our_roadmap_design="Meie tegevuskava viib sind väiksematest hallatavatest verstapostidest suure pildi valmimiseni. Planeeri umbes 3 kuu pikkused verstapostid ja kasuta neid projekti tähiseid, et õigel kursil püsida."
text.this_is_where_you_spend_most_time="Siin veedad suurema osa oma ajast – tegutsedes. Planeeri oma 2-nädalased sprindid ja vii need edukalt ellu Kanban tahvli ja mahajäämuse tööriistadega. Kasuta retrospektiive, et järgmiseks sprindiks areneda."
text.idea_board_helper_content="See on koht, kuhu saad koguda kõik oma ideed. Aruta oma meeskonnaga uusi eesmärke ja lisage neid, et näha edenemist oma ideede suunas."
text.kanban_helper_content="Kanban tähendab jaapani keeles 'kaarti'. Kanban tahvleid hakkasid 1940. aastatel lean-tootmise raames kasutama Toyota insenerid.<br/>Seda kasutatakse info ja töö edenemise kiireks visuaalseks jagamiseks.<br/>Kanban tahvlid aitavad tööd ja staatust visualiseerida, hallata aktiivset või pooleliolevat tööd, juhtida töövoogu ning kiiresti lean-täiustuste suunas tegutseda."
text.my_timesheets_helper_content="Ajatabelid aitavad jälgida ülesandega seotud tegelikke töötunde.<br/>See on kasulik arvete esitamisel, aga ka selleks, et kontrollida, kui hästi on ülesanded ette planeeritud.<br/>Ületunnitööga saab korrigeerida tähtaegu, et võtta lahendada erinevusi planeeritud töötundidega."
text.new_project_helper_content="<p>Siin saad kirjeldada, määratleda ja määrata oma projekti parameetrid. See on oluline, kuna see on see osa, mis annab<br/>kogu meeskonnale info selle kohta, millised on projekti prioriteedid, ootused ja juhised.</p><p><br/><em>Asjad, millele siin mõelda: 4C-d.<br/>Kirjuta selgelt ja lühidalt. Lisa kõik vajalik ning jää realistlikuks.<br/><br/></em></p><p>Nii saad kõiki asjaga kursis hoida ning minimeerida vigade või eksimuste riski.</p><br/>Hakkame pihta!<br/><br/>"
text.not_found_helper_content="<p>Meil pole selle lehe jaoks veel sisu.<br/>Kasuta lehe allosas olevat linki 'Vajad abi?', et saada rohkem teada, mida siin teha saad.</p>"
text.retros_helper_content="<p>Retrospektiivid on kiired tagasivaated tööle, meeskonna toimimisele ja loomulikult edenemisele.<br/>Siin saab sinu meeskond hetkeks keskenduda sellele, mis läks hästi, mis ei läinud hästi ja mida võiks järgmisel korral teisiti teha.<br/>Soovitame korraldada ülevaatekoosolekuid regulaarselt või vähemalt iga verstaposti lõpus.<br/></p>"
text.roadmap_helper_content="<p>Tegevuskavad aitavad suured projektid väiksemateks ja paremini hallatavateks osadeks jagada.<br/><br/></p><p>Tegevuskava loomiseks soovitame seada verstapostid, mida on võimalik saavutada 3 kuu jooksul.</p><p>Verstapostid on kontrollpunktid teel projekti valmimiseni.<br/>Lihtsalt öeldes: kui teed üle riigi autoreisi, võib iga läbitav maakond olla üks verstapost.<br/><br/>Alustamiseks kliki vasakul üleval nupul 'Lisa verstapost'. Määra kuupäev sellel vahekaardil või otse tegevuskava graafikul, lohistades verstaposti kalendris.</p>"
text.show_clients_helper_content="<p>Kliendid/tooted jaotavad sinu projektid kategooriatesse ja võimaldavad eri gruppe üksteisest eraldada.<br/><br/></p><p>Konsultandina töötad juba klientidega ja siin saad neid korraldada.</p><p>Kui oled tootemeeskond, saad selles jaotises oma osakondi (turundus, müük, tegevused jne) korraldada ja eraldada.</p>"
text.show_projects_helper_content="<p>Projektid on sinu äri ja Leantime'i süda! Muutused, arendus, eesmärgid ja kõik, mida suudad ehitada või unistada, hõlmavad projekte.<br/>Projektijuhtimine on lihtsalt protsess, mis tagab, et sinu projektid valmivad õigel ajal, õigesti ja tõelise ärilise väärtusega.<br/><br/>Siin asuvad sinu projektid. Projektide lehel saad luua projekti ning kiiresti näha ülesannete arvu, tunde, eelarvet ja projektiga seotud klienti.<br/><br/>Kasuta seda lehte kõigi oma projektide kiireks ülevaateks.<br/><br/></p>"
text.new_db_version="Paigaldatud on uus versioon. Leantime'i kasutamiseks pead oma andmebaasi uuendama.<br/><br/><strong>Tee enne uuendamist kindlasti oma andmebaasist varukoopia!</strong><br/>See võib võtta mõne minuti."
text.update_was_successful="Värskendus oli edukas, saad nüüd <a href='%1$s'>sisse logida</a>"
