text.my_work_dashboard_intro="Sinu Minu töö töölaud toob fookusesse kõik, mis on oluline.<br/>Sinu kõige olulisem töö on nüüd esiplaanil, korraldatuna just sinu jaoks ja nii, nagu sinu aju kõige paremini töötab.<br/><br/>Kiiretest ülesannetest ambitsioonikate eesmärkideni — kõik vajalik on siinsamas. See on sinu ruum ideede kogumiseks, edenemise jälgimiseks ja võitude tähistamiseks."
text.blueprints_intro="Blueprints annavad sulle võimaluse kõigist andmetest aru saada. Leantime'is on mitmeid tööriistu ja lõuendeid, millega määratleda oma projekti tausta: Business Model Canvas, SWOT-analüüs või Empathy Map.<br/><br/>Kui sa ei tea, kust alustada, soovitame luua „Project Value Canvase“. See lõuend vastab sinu projekti kõige olulisematele küsimustele: Kes on sinu klient?<br/>Millist probleemi sa lahendad?<br/>Mis on sinu lahendus?<br/>Millist eelist pakub sinu lahendus konkurentide ees?<br/>"
text.goals_tour_intro="Eesmärgid aitavad jagada sinu projekti saavutatavateks, mõõdetavateks ja teostatavateks osadeks.<br/>Kui verstapostid keskenduvad teostusele, siis eesmärgid on seotud mõõdikutega, mida soovid saavutada.<br/>Igal eesmärgil peaks olema selge siht (see, mida soovid saavutada) ja seda peaks saama hõlpsalt mõõta ühe mõõdikuga.<br/><br/>Kui sul on eesmärk olemas, saad sellele määrata verstaposte, et jagada see teostatavateks ülesanneteks.<br/>"
text.project_dashboard_tour_intro="Leantime'i projektid on ühised tööruumid, kus sina ja sinu meeskond saate tööd tõhusalt korraldada, jälgida ja ellu viia. Iga projekt koondab seotud eesmärgid, ülesanded ja verstapostid ning võimaldab jälgida edenemist ühest kohast.<br/><br/>Ükskõik, kas haldad tööd, kooli või isiklikke algatusi, annavad Leantime'i projektid struktuuri ja tööriistad, et muuta ideed edukateks tulemusteks."
text.wiki_tour_intro="Meie dokumendid võimaldavad sul kirjutada ja jagada dokumentatsiooni oma meeskonnaga. Dokumentatsiooni korraldamiseks meeskondade, valdkondade või dokumendikategooriate kaupa saad luua mitu ruumi.<br/>Loo dokumente teadmiste, protsesside ja protseduuride jagamiseks. Samuti saad luua dokumendi, et jagada linki pilvesalvestuses olevale failile või kaustale.<br/>"
text.extend_leantime_latest_plugins="Laienda Leantime'i meie uusimate pluginatega."
support.headline_help_us_build="Aita meil luua tulevik, kus kõik mõistused õitsevad!"
support.intro_text_1="Enamik produktiivsustööriistu eeldab, et kõik mõtlevad ühtemoodi: lineaarselt, täiusliku keskendumisega ja meelevaldsetest tähtaegadest motiveerituna. Olgu sul ATH ja vajad lõpetatud ülesannetest dopamiinilaksu, oled autistlik ja ihaldad püsivat struktuuri, sul on düsleksia ja mõtled ruumiliselt või oled lihtsalt tüdinud tööriistadest, mis ei sobi sellega, kuidas su aju tegelikult töötab — tõenäoliselt oled projektijuhtimisest täiesti loobunud."
support.intro_text_2="Me ehitame Leantime'i mõistustele, mis töötavad teisiti. See hõlmab neurodivergentseid ajusid, aga ka kõiki, kes on kunagi tundnud, et olemasolevad tööriistad võitlevad nende loomulike mõttemustrite vastu."
