text.zulip_instructions="See integratsioon postitab värskendusteated teie valitud kanalile.<br/>Järgige <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>neid juhiseid</a>, et luua uus bot. Seejärel kopeeri info vormi ja vajuta nuppu Salvesta."
text.discord_instructions="See integratsioon postitab värskendusteated teie valitud kanalile.<br/>Järgige <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>neid juhiseid</a>, et luua uus veebihook. Seejärel aseta link paremal asuvale vormi ja vajuta nuppu Salvesta."
