label.onboarding_default_project_name="Minu projekt"
text.onboarding_default_project_details="Tere tulemast oma esimesse Leantime'i projekti!<br />See on sinu ruum ülesannete korraldamiseks, eesmärkide jälgimiseks ja töö planeerimiseks. Võid siin julgelt kõike muuta või luua kasvades uusi projekte. See projekt on mõeldud just sulle alustamiseks"
label.onboarding_milestone_getting_started="Alustamine"
label.onboarding_task_community_chat="Liitu meie kogukonna vestlusega"
text.onboarding_task_community_chat="Meie kogukonna vestlus on suurepärane koht küsimuste esitamiseks ja projekti seadistamise kohta tagasiside saamiseks. <a href='https://discord.gg/4zMzJtAq9z' target='_blank'>Kogukonna vestlus</a>"
label.onboarding_task_invite_team="Kutsu oma meeskonnakaaslased"
text.onboarding_task_invite_team="Olenemata sellest, kas töötad kellegagi koos või vajad lihtsalt kaaslast, kes sind vastutusele võtaks, aitab Leantime'i koos kasutamine püsida õigel kursil ja motiveerituna. <a href='%s'>Kasutajate haldamine</a>"
label.onboarding_task_project_structure="Loe lähemalt Leantime'i projektistruktuuri kohta"
text.onboarding_task_project_structure="Meie abidokumentatsioonis on palju lisamaterjale. Leantime'i projektistruktuuri ja parimate tavade kohta lähemalt lugemiseks külasta: <a href='https://support.leantime.io/en/article/getting-started-in-leantime-an-introduction-to-setting-structure-to-the-work-14t1qip/' target='_blank'>https://help.leantime.io</a>"
label.onboarding_task_create_goal="Loo eesmärk"
text.onboarding_task_create_goal="Eesmärkidega jälgitakse ja mõõdetakse pikaajalisi sihte. Need peaksid olema mõõdetavad mõõdikutega, mida saad regulaarselt uuendada. Eesmärke ja verstaposte saab omavahel siduda, et näha elluviimise edenemist koos mõõdikute edenemisega. <a href='%s'>Projekti eesmärgid</a>"
label.onboarding_task_create_milestone="Loo verstapost"
text.onboarding_task_create_milestone="Verstapostid võimaldavad jaotada sinu projektide etapid selgelt eristuvateks tulemusteks. Igal verstapostil on algus- ja lõppkuupäev ning see peaks andma mingi tulemuse. <a href='%s'>Projekti verstapostid</a>"
label.onboarding_task_personal_project="Tutvu oma isikliku projektiga"
text.onboarding_task_personal_project="Sinu isiklik projekt on ruum, kus saad korraldada oma ülesandeid, eesmärke ja tööd. Sellele pääsed ligi ülal olevast projektivalijast või klikkides sellel lingil: <a href='%s'>Minu projekt</a>"
label.onboarding_task_complete_profile="Täida oma Leantime'i profiil"
text.onboarding_task_complete_profile="Uuenda profiilipilti ja täida tööeelistused, et oma kogemust isikupärastada. <a href='%s'>Minu profiil</a>"
