label.webhook_notifications_description="Saada oma teavitused enda HTTPS-lõpp-punkti. Iga projektiteavituse kohta, mis sulle ette nähtud on, saadab Leantime sellele URL-ile ühe JSON-sisuga HTTP POST päringu. Päringud saadetakse taustal ja nende kohalejõudmine võib võtta mitu minutit; ebaõnnestunud päringut uuesti ei saadeta. Milliseid teavitusi saadetakse, otsustavad vahekaardi Teavitused kategooriad ja projektipõhised tasemed; saadetakse ka sinu enda tehtud muudatused. Meiliteatiste väljalülitamine webhooki ei peata. Webhook saadab teavitusi ainult siis, kui see on lubatud ja URL on määratud. Kui webhook on keelatud, jääb sinu URL salvestatuks — selle eemaldamiseks tühjenda URL."
