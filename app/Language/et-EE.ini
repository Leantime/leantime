text.mattermost_instructions=" See integratsioon postitab värskendusteated teie valitud kanalile.<br/>Järgige <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>neid juhiseid</a>, et hankida Mattermosti sissetuleva veebihooki URL. Seejärel aseta link paremal asuvale vormi ja vajuta nuppu Salvesta."
text.slack_instructions="See integratsioon postitab värskendusteated teie valitud kanalile.<br/>Järgige <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>neid juhiseid</a>, et hankida Slacki sissetuleva veebihooki URL. Seejärel aseta link paremal asuvale vormi ja vajuta nuppu Salvesta."
text.choose_access_for_users="Märgi või tühjenda kasutajad, keda soovid lisada/eemaldada. Rollide kohta saad rohkem teada aadressil <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
