# Leantime in a subfolder (https://domain.example.com/leantime) next to an existing website.
#
# - Install Leantime OUTSIDE the website's document root (here /var/www/leantime, not
#   /var/www/html/leantime). Only its public/ folder is then reachable from the web, so
#   config/.env and userfiles/ stay private.
# - Set LEAN_APP_URL = 'https://domain.example.com/leantime' in config/.env.
# - Replace /leantime, the paths and the PHP-FPM socket with yours.
# Guide: https://docs.leantime.io/#/installation/subfolder

server {
    listen 80;
    listen [::]:80;
    server_name domain.example.com;
    return 301 https://domain.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain.example.com;

    ssl_certificate /etc/ssl/domain.example.com/ssl-bundle.crt;
    ssl_certificate_key /etc/ssl/domain.example.com/domain.example.com.key;

    # logging
    access_log /var/log/nginx/domain.access.log;
    error_log /var/log/nginx/domain.error.log warn;

    # Your existing website
    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # match your PHP version (8.2 or later)
    }

    location ~ /\.ht {
        deny all;
    }

    # Leantime in /leantime
    location = /leantime {
        return 301 /leantime/$is_args$args;
    }

    # The trailing slashes keep the website's own /leantime.php or /leantime-news out of it.
    # ^~ keeps the website's regex locations (like \.php$ above) away from Leantime's files.
    location ^~ /leantime/ {
        alias /var/www/leantime/public/;
        index index.php;
        try_files $uri $uri/ @leantime;

        # ^~ also skips the website's .ht rule above, so repeat it here.
        location ~ /\.ht {
            deny all;
        }

        location ~ \.php$ {
            # A .php file that doesn't exist, like the old /leantime/download.php attachment
            # links, goes to Leantime's index.php, which still handles those URLs.
            try_files $uri @leantime;

            include fastcgi_params;
            # The real file path under alias. $fastcgi_script_name would be the URL
            # (/leantime/index.php), and PHP-FPM would answer "File not found."
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # match your PHP version (8.2 or later)
        }
    }

    location @leantime {
        rewrite ^/leantime/(.*)$ /leantime/index.php last;
    }

    location ^~ /leantime/dist/ {
        alias /var/www/leantime/public/dist/;
        expires 7d;
        access_log off;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
